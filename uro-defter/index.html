 skar alanını tamamen bypass etmek için\ndoğrudan Transperitoneal (karın içinden) yoldan, tertemiz planlarla\nböbreğe ulaşmayı seçerim.\"</p>\n"}, {"id": "15.3", "t": "Yeni Teknolojiler (Bph'da MIST, REZUM, Aquablatıon ve Lazer Fiziği)", "h": "<h3 id=\"a-lazer-fi̇zi̇ği̇-hedefimiz-su-mu-kan-mı\">A. LAZER FİZİĞİ:\nHedefimiz Su mu, Kan mı?</h3>\n<p>Bir lazerin dokuyu nasıl keseceğini, yakacağını veya kanamayı nasıl\ndurduracağını belirleyen tek şey onun Dalga Boyu (Wavelength) ve hedef\naldığı hücre içi maddedir (Kromofor).</p>\n<p>GreenLight (KTP/LBO Lazer - 532 nm): Kan Avcısı</p>\n<p><em>Kromofor:</em> Hemoglobin (Kırmızı renk).</p>\n<p><em>Etki:</em> Yeşil ışık, prostat dokusundaki kan hücreleri\ntarafından emilir. Dokuyu anında buharlaştırır (Vaporizasyon) ve kan\ndamarlarını mükemmel mühürler. Kanaması durmayan, Ağır Kan Sulandırıcı\n(Antikoagülan) kullanan hastalarda EAU'nun altın standart BPH\nlazeridir.</p>\n<p>Holmium Lazer (Ho:YAG - 2140 nm): Suyun Gücü</p>\n<p><em>Kromofor:</em> Su. (Prostat ve taşlar su içerir).</p>\n<p><em>Etki:</em> Kesik kesik (Pulsatil) atım yapar. Suyu anında\nkaynatıp mikroskobik buhar baloncukları yaratır. Bu baloncuklar\npatlayarak taşı kırar veya dokuyu neşter gibi keser (HoLEP - Holmium\nLazer Enükleasyon).</p>\n<p>Thulium Fiber Lazer (TFL - 1940 nm): Yeni Kral</p>\n<p><em>Kromofor:</em> Su. (Holmium'a göre suya emilimi 4 kat daha\nfazladır).</p>\n<p><em>Etki:</em> Sürekli (Continuous) dalga verebilir. Çok daha ince\nfiberlerle çalışır, dokuyu Holmium'dan çok daha pürüzsüz keser ve\nkanamayı çok daha iyi durdurur. Günümüzde hem taş kırmada (RIRS) hem de\nprostat cerrahisinde (ThuLEP) zirveye oynamaktadır.</p>\n<h3 id=\"b-rezum-su-buhari-terapi̇si̇-isı-yayılımı\">B. REZUM (SU BUHARI\nTERAPİSİ): Isı Yayılımı</h3>\n<p>Genç bir erkek hasta geldi, prostatı büyümüş, idrar yapamıyor ama\n\"TUR-P olursam menim geriye kaçarmış (Retrograd Ejakülasyon), ben çocuk\nsahibi olmak istiyorum\" diyor. İşte çözüm: Rezum.</p>\n<p>Mekanizma (Konvektif Termal Enerji): Sistoskopik bir iğneyle\nprostatın obstrüktif (tıkayıcı) loblarının içine girilir. Cihaz, her bir\nnoktaya 9 saniye boyunca radyofrekans enerjisiyle ısıtılmış, 106°C\nsıcaklığında steril su buharı enjekte eder.</p>\n<p>Hücresel Yıkım: Buhar, hücreler arasındaki boşluklardan hızla yayılır\n(Konveksiyon) ve doku ısısını anında 70°C'nin üzerine çıkararak hücre\nzarlarını patlatır (Ani hücre ölümü).</p>\n<p>Sonuç: Ameliyat sonrası prostat hemen küçülmez. Ölen dokular vücudun\nmakrofajları tarafından 1 ila 3 ay içinde yavaş yavaş emilir. Prostat\nbüzüşür, kanal açılır. En büyük avantajı: Ejakülasyonu (Meni çıkışını)\n%90-95 oranında korur ve işlem lokal anesteziyle bile yapılabilir.</p>\n<h3 id=\"c-aquablation-robotik-su-jeti\">C. AQUABLATION: Robotik Su\nJeti</h3>\n<p>Prostat devasa (Örn: 150 gram). TUR-P yapmak saatler sürer, HoLEP ise\ninanılmaz dik bir öğrenme eğrisi gerektirir. Silikon Vadisi çıkışlı bu\nyeni teknoloji ise cerrahın el becerisini devreden çıkarıyor.</p>\n<p>Mekanizma: Hasta anestezi altındayken, rektuma bir Ultrason (TRUS)\nprobu yerleştirilir. Üretradan ise Aquabeam robotik probu sokulur.\nCerrah, ultrason ekranında prostatın kesilecek sınırlarını çizer ve\n\"Başla\" tuşuna basar.</p>\n<p>Isısız Yıkım (Hydrodissection): Robot, oda sıcaklığındaki yüksek\nbasınçlı bir su jeti fışkırtarak, önceden çizilen sınırlar içindeki\nprostat dokusunu saniyeler içinde mekanik olarak parçalar ve yıkar.</p>\n<p>Avantaj: Isı (koter/lazer) KULLANILMAZ. Isı olmadığı için etraftaki\nsertleşme sinirlerine (Nörovasküler demet) veya sfinktere termal hasar\nsıçrama riski sıfırdır. 150 gramlık bir prostatın rezeksiyonu sadece 3\nila 5 dakika sürer.</p>\n<h3 id=\"d-urolift-prostati̇k-üretral-aski-dokuyu-kesmeden-açmak\">D.\nUROLIFT (PROSTATİK ÜRETRAL ASKI): Dokuyu Kesmeden Açmak</h3>\n<p>Doku yakmak, dondurmak veya kesmek istemiyorsun. Kanama riski hiç\nalınmasın isteniyor.</p>\n<p>Mekanizma: Sistoskopla girilir. Prostatın idrar yolunu kapatan yan\nloblarına, dışarıdan (kapsüle doğru) küçük zımbalar (implantlar)\nçakılır. Bu zımbalar, prostat loblarını bir perdenin ipleri gibi yanlara\ndoğru çeker ve sabitler (Askı / Urethral Lift).</p>\n<p>Avantaj: Tamamen mekanik bir açılmadır. 10 dakikada biter, cinsel\nfonksiyonlar %100 korunur. Ancak Orta Lobu (Median lob) çok büyük olan\nhastalarda etkinliği düşüktür.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe kalp kapakçığı değişmiş, ömür boyu Warfarin\n(Coumadin) ve Aspirin kullanmak ZORUNDA olan bir BPH hastası geldi.\nİlaçları kesersen hasta felç geçirebilir. Bu hastayı TUR-P'ye alamazsın.\nHangi lazer veya teknoloji ile prostat ameliyatı yapmayı\nplanlarsın?\"</p>\n<p>Cevap: \"Kan sulandırıcıları KESMEDEN yapılabilecek en güvenli prostat\ncerrahisi GreenLight (532 nm) Lazer Vaporizasyonudur. GreenLight lazer\ndoğrudan kandaki hemoglobini hedef aldığı için, prostat dokusunu anında\nbuharlaştırırken geride kalan damarları kusursuz bir şekilde yakar ve\nmühürler (Fotokoagülasyon). EAU 2026 kılavuzları, yüksek kanama riski\nolan hastalarda ilk seçenek olarak GreenLight'ı veya Thulium lazeri\n(ThuVEP) önerir.\"</p>\n<p>Soru: \"Hastaya su buharı tedavisi (Rezum) yaptın, başarılı geçti ve\nhastayı sondasıyla evine gönderdin. Aileye, 'Hastanın prostatı hemen\nbugün küçülmedi, şikayetlerinin tam olarak geçmesi ve prostatın erimesi\nzaman alacak' demelisin. Peki bu hücresel erime ve kanalın açılması ne\nkadar sürer?\"</p>\n<p>Cevap: \"Rezum tedavisinde anlık doku buharlaşması (vaporizasyon)\nolmaz; ısı hücreleri öldürür ama cesetleri içeride kalır. Ölü hücrelerin\nbağışıklık sistemi tarafından temizlenmesi, inflamasyonun sönmesi ve\ndokunun büzüşüp (atrofi) kanalın açılması yaklaşık 1 ila 3 AY sürer.\nHatta ilk 1-2 hafta dokudaki ödem nedeniyle hastanın idrar akımı\nameliyat öncesinden daha kötü olabilir; bu yüzden hastalara genellikle\nişlem sonrası 3-7 gün sonda takılır.\"</p>\n<p>Soru: \"Ameliyathanede 100 gramlık bir prostata Aquablation (Su Jeti)\nyaptın. İşlem 4 dakikada bitti. Ancak prostat dokusu ısı kullanılmadan,\noda sıcaklığındaki suyla mekanik olarak parçalandığı için, içeride\nkanayan damarları durduracak hiçbir koagülasyon (yakma) etkisi oluşmadı.\nSu jeti işleminden sonra kanamayı nasıl durdurursun?\"</p>\n<p>Cevap: \"Aquablation'ın en zayıf noktası hemostazdır (kanama\nkontrolü). İşlem bittikten sonra iki yol izlenir: Birincisi, sistoskopla\ngirilip kanayan büyük odaklara çok hafif, temassız koter veya lazer\ndokunuşlarıyla yüzeysel kanama kontrolü (Fokal hemostaz) yapılır.\nİkincisi ve asıl yöntem, içeriye devasa balonlu özel bir Foley sonda\nyerleştirip balonu mesane boynunda gerdirerek (Traction) prostat lojuna\nfiziksel baskı (Tamponad) uygulamaktır.\"</p>\n"}, {"id": "15.4", "t": "Fokal Tedaviler: Prostat Kanserinde HIFU ve Kriyoterapi", "h": "<p>A. HIFU (YÜKSEK YOĞUNLUKLU ODAKLANMIŞ ULTRASON): Merceğin Altındaki\nKarınca</p>\n<p>HIFU, prostatı kesmeden, ışın vermeden (radyasyon yoktur) ve\nkanatmadan sadece içerideki kanserli odağı yakıp kül eden kusursuz bir\ntermal silahtır.</p>\n<p>Fiziksel Mekanizma: Bir büyüteçle güneş ışınlarını toplayıp bir\nkağıdı yaktığını düşün. Rektuma (makata) yerleştirilen HIFU probu,\nyüzlerce ultrasonik ses dalgası yayar. Bu dalgalar rektum duvarından ve\nsağlam prostat dokusundan geçerken çok zayıftır (dokuyu yakmazlar).\nAncak bu dalgaların tümü, milimetrik bir Odak Noktasında (Focal Point)\nkesişecek şekilde ayarlanır.</p>\n<p>Koagülatif Nekroz: Dalgaların kesiştiği o milimetrik odakta, mekanik\nsürtünme enerjisi aniden devasa bir ısıya dönüşür. Doku sıcaklığı\nsaniyeler içinde 85°C ile 100°C arasına fırlar. Kanser hücrelerinin\nproteinleri anında denatüre olur, hücre zarları erir ve dokuda kesin bir\n\"Koagülatif Nekroz\" (yanık/çürüme) oluşur. İşlem bittiğinde geride\nsadece ölü bir yara izi (skar) kalır.</p>\n<h3 id=\"b-kri̇yoterapi̇-buzun-yikici-gücü-hücreleri-i̇çeriden-patlatmak\">B.\nKRİYOTERAPİ (BUZUN YIKICI GÜCÜ): Hücreleri İçeriden Patlatmak</h3>\n<p>Isı yerine soğuğun, donmanın o acımasız, parçalayıcı fiziğini\nkullandığımız yöntemdir.</p>\n<p>Mekanizma (Joule-Thomson Etkisi): Hasta anestezi altındayken, apış\narasından (perineden) ultrason eşliğinde prostatın içine ince iğneler\n(Kriyoproblar) yerleştirilir. Bu iğnelerin içine yüksek basınçlı Argon\ngazı basılır. Gaz iğnenin ucunda aniden genleştiğinde çevredeki ısıyı\nemer ve doku sıcaklığını saniyeler içinde -40°C'ye düşürür.</p>\n<p>Hücresel Yıkım (Donma-Çözülme Döngüsü): -40°C'de, kanser hücrelerinin\nhem içinde hem de dışında keskin buz kristalleri oluşur. Bu kristaller\nbir bıçak gibi hücre zarlarını ve mitokondrileri parçalar. Ardından\niğnelere sıcak Helyum gazı basılarak buz eritilir (Çözülme). Bu\n\"dondur-çöz (freeze-thaw)\" döngüsü iki kez tekrarlanarak tümör hücresel\nseviyede tamamen imha edilir.</p>\n<h3 id=\"c-koruma-strateji̇leri̇-üretrayı-nasıl-kurtarırız\">C. KORUMA\nSTRATEJİLERİ: Üretrayı Nasıl Kurtarırız?</h3>\n<p>Bu devasa termal fırtınaları (100°C veya -40°C) prostatın içinde\nyaratırken, prostatın tam ortasından geçen ve hastanın idrar yapmasını\nsağlayan o narin idrar kanalını (Üretra) nasıl koruyacağız? Eğer üretra\nyanar veya donarsa, çürüyüp dökülür (Nekroz) ve hasta ömür boyu sondayla\nyaşar.</p>\n<p>Isıtıcı/Soğutucu Sonda (Urethral Warming Catheter): Kriyoterapi\nişlemi boyunca idrar yoluna özel bir sonda takılır. Dışarıdaki bir\ncihaz, bu sondanın içinden sürekli olarak sürekli sirküle eden SICAK SU\n(38-40°C) pompalar. Prostatın içi -40°C'de buz tutarken, idrar kanalı\nsıcak su sayesinde donmaktan kurtulur. (HIFU'da ise üretrayı yanmaktan\nkorumak için işlem boyunca sondadan soğuk su çevrilir).</p>\n<h3 id=\"d-ki̇mlere-uygulanir-hasta-seçimi-ve-aşil-topuğu\">D. KİMLERE\nUYGULANIR? (Hasta Seçimi ve Aşil Topuğu)</h3>\n<p>Fokal tedavi herkese yapılmaz. EAU 2026 kılavuzlarına göre endikasyon\nçok dardır:</p>\n<p>Tümör tek bir odakta olmalıdır (Ünifokal).</p>\n<p>Düşük veya orta riskli olmalıdır (Gleason 3+3 veya 3+4).</p>\n<p>Multiparametrik MR'da tümörün yeri kusursuz şekilde haritalandırılmış\nolmalıdır.</p>\n<p>Fokal Tedavinin Aşil Topuğu (En Büyük Eleştirisi):</p>\n<p>Prostat kanseri genellikle \"Multifokal\" (Çok odaklı) bir hastalıktır.\nMR sadece en büyük (indeks) tümörü gösterir. Fokal tedavide sadece\ngörünen tümörü yakarsan, prostatın diğer loblarında MR'ın göremediği\nmikroskobik kanser hücrelerini içeride bırakmış olursun. Bu yüzden fokal\ntedavi alan hastalar, ameliyat olmuş gibi \"kurtulup gidemezler\"; çok\nsıkı PSA ve MR takibinde (Aktif İzlem) tutulmak zorundadırlar.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Hastaya Kriyoterapi (dondurma) yapıyorsun. Ultrasonda\niğnelerin ucunda büyüyen o karanlık (ekojenik) buz topunu izliyorsun.\nBuz topu prostatın arka kapsülüne (rektuma) çok yaklaştı. Rektumun\ndonmasını ve ölümcül bir Rekto-Üretral Fistül açılmasını engellemek\niçin, buz topunu sadece gözle (MR/TRUS) izlemek yeterli midir? Ameliyat\nmasasında seni koruyacak cihaz nedir?\"</p>\n<p>Cevap: \"Sadece görüntüye güvenmek son derece tehlikelidir, çünkü buz\ntopunun akustik gölgesi arkasını görmemi engeller. Kriyoterapiye\nbaşlamadan önce, prostat ile rektum arasına (Denonvilliers fasyasına)\nmutlaka Termokupl (Isı Sensörü) adı verilen minik proplar yerleştiririm.\nBu sensörler anlık olarak rektum duvarının sıcaklığını ölçer. Rektum\nduvarı 0°C'ye yaklaştığı an sensör alarm verir ve dondurma işlemini\nderhal durdurup Helyum (ısıtma) gazını açarım.\"</p>\n<p>Soru: \"Sol lobundaki tümör için HIFU (odaklanmış ultrason) yapılmış\nbir hasta. 2 yıl sonra PSA'sı tekrar yükseldi. Biyopsi yaptın, HIFU\nalanında kanser nüks etmiş. Hasta radikal bir çözüm istiyor. Bu hastaya\nşimdi 'Kurtarma Radikal Prostatektomisi (Salvage RP)' ameliyatı\nyapabilir misin? Bu ameliyatın ilk kez ameliyat olan birine göre farkı\nnedir?\"</p>\n<p>Cevap: \"Evet, Salvage (Kurtarma) Prostatektomi yapılabilir ancak\ncerrah için tam bir kabustur. HIFU'nun yarattığı o 100°C'lik ısı,\nprostatın etrafındaki o kusursuz anatomik planları (zarları) tamamen\neritmiş ve yerine taş gibi sert, damarlı bir fibröz nedbe (skar) dokusu\nörmüştür. Prostatı etraftan (özellikle rektumdan ve sinirlerden) ayırmak\ninanılmaz derecede zorlaşır. Sinir koruma ihtimali (ereksiyonun devamı)\nneredeyse sıfıra iner ve idrar kaçırma (İnkontinans) riski standart\nameliyata göre kat kat yüksektir. Hastaya bu riskler mutlaka onamda\nbelirtilmelidir.\"</p>\n<p>Soru: \"HIFU işlemi bitti, hastayı servise aldın. Ancak cihaz rektumun\n(makatın) içine yerleştirilip ses dalgalarını prostatın içine gönderdiği\niçin, rektum duvarında bir termal hasar (yanık) oluşmasından\nkorkuyorsun. HIFU cihazının kendi sisteminde rektumu yanmaktan koruyan\notomatik soğutma mekanizması nedir?\"</p>\n<p>Cevap: \"HIFU probunun üzerinde rektum duvarına temas eden bir balon\nsistemi vardır. İşlem boyunca bu balonun içinden sürekli olarak\nsoğutulmuş (chilled) su sirküle edilir. Bu aktif soğutma sistemi, rektum\nmukozasını sürekli serin tutarken, ses dalgaları zarar vermeden geçip\nprostatın derinliklerinde 100°C'lik odaklanmasını sağlar. Eğer bu\nsoğutma sistemi arızalanırsa, rektum anında yanar ve devasa\nkomplikasyonlar doğar.\"</p>\n"}, {"id": "15.5", "t": "Laparoskopik ve Robotik Cerrahi Komplikasyonları ve Kriz Yönetimi", "h": "<h3 id=\"a-vasküler-felaket-red-out-kızıl-karanlık-ve-kava-yırtığı\">A.\nVASKÜLER FELAKET: \"Red-Out\" (Kızıl Karanlık) ve Kava Yırtığı</h3>\n<p>Laparoskopik ve robotik cerrahinin en korkutucu anıdır. Özellikle Sağ\nRadikal Nefrektomi veya retroperitoneal lenf nodu diseksiyonu (RPLND)\nyaparken, milimetrik bir koter hatası Vena Kava İnferior'da veya Renal\nVen'de devasa bir yırtık açabilir.</p>\n<p>Red-Out Etkisi: Kan, ışığı inanılmaz derecede emer. İçeriye kan\nfışkırdığında kamera ışığı yutulur ve ekran aniden tamamen kırmızı,\nkaranlık bir bulanıklığa dönüşür. Cerrah kör olur.</p>\n<p>Kriz Yönetimi (Altın Saniyeler):</p>\n<p>Körleme Koter YASAKTIR: Kanayan yere körlemesine koter basarsan\ndeliği daha da büyütürsün.</p>\n<p>Basıncı Artır (Tamponad): Vena Kava düşük basınçlı bir sistemdir\n(genellikle 5-10 mmHg). İnsüflatör cihazına bağırıp karın içi gaz\nbasıncını anında 15-20 mmHg'ye çıkarttırırsın. Bu yüksek gaz basıncı,\ntoplardamar kanamasını bıçak gibi keser veya çok yavaşlatır.</p>\n<p>Rulo Gazlı Bez ve Kompresyon: Robotun 4. koluyla (veya asistan\nportundan) içeri atılmış bir rulo gazlı bezi (sünger) doğrudan kanayan\ndeliğin üzerine bastırırsın. Ortalık temizlenene kadar 3-5 dakika\nbeklenir.</p>\n<p>İçeriden Dikiş (Konversiyonsuz Onarım): Kanama gaz basıncı ve\nkompresyonla kontrol altına alındıysa, karnı açmak (konversiyon) hastaya\ndaha büyük zarar verir (Çünkü karnı açtığın an gaz basıncı sıfırlanır ve\nkava şelale gibi kanamaya başlar). Robotun o kıvrak kollarıyla 4-0 veya\n5-0 Prolen dikiş alınır, 8 şekilli (figure-of-eight) veya sürekli\ndikişle yırtık içeriden kusursuzca onarılır.</p>\n<h3 id=\"b-di̇yafram-yirtiği-pnömotoraks-ve-kalbin-sıkışması\">B. DİYAFRAM\nYIRTIĞI: Pnömotoraks ve Kalbin Sıkışması</h3>\n<p>Özellikle böbreğin üst kutbunda (Üst Pol) devasa bir tümörle (veya\nyapışık bir adrenal kitleyle) uğraşıyorsan, diyafram kasına çok yakınsın\ndemektir. Koterle o zarı yanlışlıkla deldiğinde felaket başlar.</p>\n<p>Fizyolojik Kabus: Karın içindeki 15 mmHg'lik CO2 gazı, bir vakum gibi\nçalışan göğüs boşluğuna (plevraya) hücum eder. Saniyeler içinde Tansiyon\nPnömotoraks gelişir.</p>\n<p>Anestezi Alarmları: Anestezi doktoru \"Akciğer havalanmıyor! Airway\n(Havayolu) basınçları 40'a fırladı, satürasyon düşüyor ve tansiyon\nalamıyorum!\" diye bağırır. (Çünkü göğüs kafesine dolan gaz kalbi\nezmektedir).</p>\n<p>Kriz Yönetimi:</p>\n<p>Gazı Boşalt (Desüflasyon): Karnı şişiren gaz vanası derhal kapatılır\nve trokarlardan karın içi boşaltılır. Kalp üzerindeki baskı anında\nkalkar.</p>\n<p>Göğüs Tüpü (Torakostomi): Eğer gaz çok fazlaysa ve anestezi\ntoparlayamıyorsa, ameliyatı durdurup hastanın göğsüne (genellikle 5.\ninterkostal aralık) acil bir Göğüs Tüpü takılır.</p>\n<p>Dikiş: Hasta stabilize olduktan sonra gaz çok düşük basınçta (8-10\nmmHg) tekrar açılır ve diyaframdaki o yırtık, erimeyen (non-absorbable)\nkalın dikişlerle hava sızdırmaz şekilde dikilir.</p>\n<h3 id=\"c-si̇nsi̇-kati̇l-termal-bağırsak-yaralanması\">C. SİNSİ KATİL:\nTermal Bağırsak Yaralanması</h3>\n<p>Vasküler yaralanma masada bağırır, bağırsak yaralanması ise\nameliyattan günler sonra hastayı öldürür.</p>\n<p>Mekanizma (Kapasitif Kuplaj ve Elektrik Kaçağı): Bazen koterin ucu\nbağırsağa değmese bile, aletin izolasyonundaki mikroskobik bir çatlaktan\nsızan elektrik akımı bağırsağı yakar.</p>\n<p>Neden Gözden Kaçar? Termal (yanık) hasarı kanamaz. O an ekranda\nsadece beyaz/soluk minik bir leke görürsün ve önemsemezsin. Ancak o doku\nölmüştür. Ameliyattan 3 ila 5 gün sonra o ölü doku delinir (Nekroz ve\nPerforasyon).</p>\n<p>Klinik Facia: Hasta serviste taburcu olmayı beklerken aniden taş gibi\nsert bir karın (Akut Batın), 39 derece ateş ve septik şoka girer. Dışkı\n(gaita) tüm karın boşluğuna dolmuştur.</p>\n<p>Çözüm: Ameliyat sırasında en ufak bir şüpheli yanık/beyazlama\ngörürsen, o bölgeyi 2 kat (seromusküler) dikişle içeri doğru gömerek\nonarmak (Lembert dikişi) hayat kurtarır. Eğer hasar tam katsa, o\nbağırsak segmenti kesilip uç uca (anastomoz) dikilmelidir.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Robotik radikal prostatektomi yapıyorsun. Hastayı,\nbağırsakları yukarı itmek için çok dik bir 'Trendelenburg' pozisyonuna\n(baş aşağı 30-45 derece) aldın ve ameliyat 4 saat sürdü. Ameliyat bitip\nhastayı uyandırdığında, hastanın kolları ve bacakları şişmiş, yüzü balon\ngibi olmuş ve göz kapakları açılmıyor. İdrar çıkışı da sıfır. Bu\nfizyolojik komplikasyonun adı nedir ve hangi ölümcül riski taşır?\"</p>\n<p>Cevap: \"Bu dik pozisyon ve uzun süreli gaz basıncına bağlı gelişen\nMasif Yüz/Göz Ödemi (Venöz Göllenme) ve Kompartman Sendromu tablosudur.\nEn ölümcül riski, dışarıda gördüğüm bu ödemin hastanın solunum\nyollarında da (Laringeal Ödem) olmasıdır. Eğer hasta ekstübe edilirse\n(tüp çekilirse) havayolu aniden kapanabilir ve hasta boğulabilir. Ayrıca\nbacaklarda uzun süreli basıya bağlı Rabdomyoliz (kas yıkımı) gelişip\nböbrekleri tıkayabilir (Akut Tübüler Nekroz). Bu hastalar kesinlikle\nekstübe edilmeden yoğun bakıma alınmalı, baş yukarı\n(reverse-trendelenburg) pozisyonda diüretiklerle ödem çözülene kadar\nuyutulmalıdır.\"</p>\n<p>Soru: \"Laparoskopik ameliyata başlarken, ilk portu (Optik trokarı)\ngöbekten körlemesine, iğneyle (Veress iğnesi) değil de doğrudan 'Açık\n(Hasson) Teknik' ile cilt altını görerek yerleştirmenin EAU\nkılavuzlarına göre en büyük medikolegal ve hayati avantajı nedir?\"</p>\n<p>Cevap: \"Göbek tam altında, karın zarına milimetrelerce mesafede Aort\nve Vena Kava gibi devasa damarlar ile bağırsaklar yatar. Körlemesine\nsokulan iğneler (Veress) veya kesici trokarların bu büyük damarları\ndelmesi (Major Vasküler Yaralanma) saniyeler içinde ölümcüldür. Hasson\n(Açık) teknikte ise fasya ve periton bistüriyle, gözle görülerek kat kat\naçılır, içeriye parmakla girilip bağırsak yapışıklığı olup olmadığı\nkontrol edilir ve ucu künt (kesici olmayan) bir trokar yerleştirilir.\nBu, körlemesine damar ve bağırsak delme riskini neredeyse SIFIRA\nindirir.\"</p>\n<p>Soru: \"Tümörü çıkardın, ameliyat bitti. Karın içindeki aletleri ve\nportları çekerken asistanın 12 mm'lik port deliklerini sadece cildi\ndikerek (fasyayı açık bırakarak) kapattı. Hasta taburcu olduktan 1 hafta\nsonra o trokar deliğinden dışarı fırlayan bir bağırsak düğümü\n(İnsizyonel Trokar Yeri Hernisi) ile acile geldi. Kılavuzlara göre hangi\nboyuttaki trokar delikleri mutlaka KAS (Fasya) seviyesinde\ndikilmelidir?\"</p>\n<p>Cevap: \"EAU ve fıtık cerrahisi prensiplerine göre, 10 mm ve\nüzerindeki (10 mm, 12 mm, 15 mm) tüm trokar deliklerinin fasyası (kas\nkılıfı) MUTLAKA ayrı ve sağlam bir şekilde (tercihen port-kapatıcı özel\niğnelerle) dikilmek zorundadır. Aksi takdirde, karın içi basıncı\narttığında (öksürme, ıkınma) bağırsaklar o küçük delikten fıtıklaşır ve\nboğulur (Strangüle Herni). 5 mm ve 8 mm'lik deliklerin ise genellikle\nsadece cildinin kapatılması yeterlidir (ancak manipülasyonla\ngenişletilmişse onlar da dikilmelidir).\"</p>\n"}]}];

 else if(TAB==="soru")vQuiz();else if(TAB==="kayit")vSaved();else vSettings();
}
function chapProg(c){const r=c.s.filter(s=>ST.read[s.id]).length;return [r,c.s.length];}
function vHome(){
 header('<span class="brand">Üro Defter</span>',false);
 const tr=ALLS.filter(s=>ST.read[s.id]).length;const qa=Object.keys(ST.ans).length;const qok=Object.values(ST.ans).filter(Boolean).length;
 let h=`<div class="search"><input id="q" type="search" placeholder="Tüm konularda ara" value="${esc(VIEW.q||"")}" autocomplete="off" enterkeyhint="search"></div>`;
 if(VIEW.q&&VIEW.q.length>=2){$("#main").innerHTML=h+searchHTML(VIEW.q);bindSearch();return;}
 h+=`<div class="stats"><div class="stat"><b>${tr}/${ALLS.length}</b><span>konu okundu</span></div><div class="stat"><b>${qa}/${SORULAR.length}</b><span>soru çözüldü</span></div><div class="stat"><b>${qa?Math.round(qok/qa*100):0}%</b><span>doğru</span></div></div>`;
 if(ST.last&&SEC[ST.last]){const s=SEC[ST.last];h+=`<div class="card"><button class="row" data-sec="${s.id}"><span class="num">${s.id.split(".")[0]}</span><span class="tt">Kaldığın yerden devam et<div class="sub">${s.id} ${esc(s.t)}</div></span>${IC.chev}</button></div>`;}
 h+=`<div class="card">`+DATA.map(c=>{const [r,n]=chapProg(c);return `<button class="row${r===n&&n?" done":""}" data-chap="${c.n}"><span class="num">${c.n}</span><span class="tt">${esc(c.t)}<div class="pbar"><i style="width:${n?r/n*100:0}%"></i></div></span><span class="meta">${r}/${n}</span>${IC.chev}</button>`}).join("")+`</div>`;
 $("#main").innerHTML=h;bindSearch();
}
function bindSearch(){const i=$("#q");if(!i)return;let t;i.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>{VIEW={v:"home",q:i.value.trim()};const pos=i.selectionStart;vHome();const n=$("#q");n.focus();n.setSelectionRange(pos,pos);},200);});}
function searchHTML(q){
 const P=plain(),lq=q.toLocaleLowerCase("tr"),res=[];
 ALLS.forEach(s=>{const txt=P[s.id],low=txt.toLocaleLowerCase("tr");let k=low.indexOf(lq);const inT=s.t.toLocaleLowerCase("tr").includes(lq);if(k<0&&!inT)return;let cnt=0,p=0;while((p=low.indexOf(lq,p))>=0){cnt++;p+=lq.length;}
  const a=Math.max(0,k-60),snip=k>=0?(a>0?"…":"")+txt.slice(a,k+lq.length+90)+"…":"";res.push({s,cnt:cnt+(inT?50:0),snip});});
 res.sort((x,y)=>y.cnt-x.cnt);
 const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
 if(!res.length)return `<div class="empty">“${esc(q)}” için sonuç yok.</div>`;
 return `<div class="sub" style="color:var(--muted);font-size:13px">${res.length} konu</div><div class="card">`+res.slice(0,60).map(r=>`<button class="row" data-sec="${r.s.id}" data-q="${esc(q)}"><span class="num">${r.s.c}</span><span class="tt">${esc(r.s.id+" "+r.s.t).replace(re,"<mark>$1</mark>")}<div class="sub">${esc(r.snip).replace(re,"<mark>$1</mark>")}</div></span>${IC.chev}</button>`).join("")+`</div>`;
}
function vChap(){
 const c=DATA[VIEW.n-1];header(`${c.n}. ${esc(c.t)}`,true);
 const rel=REL[c.n];
 let h=rel?`<div class="note">Güncel EAU 2026 önerileri: ${rel.map(esc).join(", ")}. <a href="${KILAVUZ}" target="_blank" rel="noopener">Üro Kılavuz'da aç</a></div>`:"";
 const qn=SORULAR.filter(q=>q.b===c.n).length;
 h+=`<div class="card">`+c.s.map(s=>`<button class="row${ST.read[s.id]?" done":""}" data-sec="${s.id}"><span class="num">${s.id.split(".")[1]}</span><span class="tt">${esc(s.t)}</span>${ST.mark[s.id]?'<span class="meta">★</span>':""}${IC.chev}</button>`).join("")+`</div>`;
 if(qn)h+=`<button class="btn pri" style="width:100%;margin-top:6px" data-quizchap="${c.n}">Bu bölümün sorularını çöz (${qn})</button>`;
 $("#main").innerHTML=h;
}
function vSec(){
 const s=SEC[VIEW.id],c=DATA[s.c-1];ST.last=s.id;save();
 header(`${s.id}`,true);
 let html=s.h.replace(/<table/g,'<div class="tw"><table').replace(/<\/table>/g,"</table></div>");
 if(VIEW.q){const re=new RegExp("("+VIEW.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![^<]*>)","gi");html=html.replace(re,"<mark>$1</mark>");}
 const prev=c.s[s.i-1]||(DATA[s.c-2]&&DATA[s.c-2].s.slice(-1)[0]),next=c.s[s.i+1]||(DATA[s.c]&&DATA[s.c].s[0]);
 $("#main").innerHTML=`<div class="skicker">${c.n}. ${esc(c.t)}</div><div class="stitle">${esc(s.t)}</div>
 <div class="tools"><button class="chip" id="rd" aria-pressed="${!!ST.read[s.id]}">${ST.read[s.id]?"✓ Okundu":"Okundu işaretle"}</button><button class="chip" id="mk" aria-pressed="${!!ST.mark[s.id]}">${ST.mark[s.id]?"★ Kaydedildi":"☆ Kaydet"}</button><button class="chip" id="fm" aria-label="Yazıyı küçült">A−</button><button class="chip" id="fp" aria-label="Yazıyı büyüt">A+</button></div>
 <article class="reader">${html}</article>
 <div class="pn">${prev?`<button class="btn" data-sec="${prev.id}">‹ Önceki<small>${esc(prev.id+" "+prev.t)}</small></button>`:"<span></span>"}${next?`<button class="btn pri" data-sec="${next.id}" data-markread="${s.id}">Sonraki ›<small>${esc(next.id+" "+next.t)}</small></button>`:"<span></span>"}</div>`;
}
// quiz
let QZ=null;
function startQuiz(scope){let pool=SORULAR;if(scope==="wrong")pool=SORULAR.filter(q=>ST.ans[q.id]===false);else if(scope!=="all")pool=SORULAR.filter(q=>q.b===+scope);
 pool=pool.slice().sort(()=>Math.random()-.5);QZ={scope,pool,i:0,ok:0,done:false,picked:null};}
function vQuiz(){
 header("Sorular",!!QZ);
 if(!QZ){const w=SORULAR.filter(q=>ST.ans[q.id]===false).length;
  let h=`<div class="card"><button class="row" data-qs="all"><span class="num">∑</span><span class="tt">Karışık – tüm sorular<div class="sub">${SORULAR.length} soru</div></span>${IC.chev}</button>${w?`<button class="row" data-qs="wrong"><span class="num" style="color:var(--no)">✕</span><span class="tt">Yanlışlarımı tekrar et<div class="sub">${w} soru</div></span>${IC.chev}</button>`:""}</div><div class="card">`+DATA.map(c=>{const qs=SORULAR.filter(q=>q.b===c.n);if(!qs.length)return"";const a=qs.filter(q=>q.id in ST.ans).length,o=qs.filter(q=>ST.ans[q.id]).length;return `<button class="row" data-qs="${c.n}"><span class="num">${c.n}</span><span class="tt">${esc(c.t)}<div class="sub">${qs.length} soru · ${a?`${o}/${a} doğru`:"çözülmedi"}</div></span>${IC.chev}</button>`}).join("")+`</div>`;
  $("#main").innerHTML=h;return;}
 if(QZ.i>=QZ.pool.length){$("#main").innerHTML=`<div class="empty" style="color:var(--ink)"><div style="font-size:40px;font-weight:700">${QZ.ok}/${QZ.pool.length}</div><p>Bitti. ${QZ.pool.length?Math.round(QZ.ok/QZ.pool.length*100):0}% doğru.</p></div><div class="pn"><button class="btn" id="qx">Listeye dön</button><button class="btn pri" data-qs="${QZ.scope}">Tekrar çöz</button></div>`;return;}
 const q=QZ.pool[QZ.i],c=DATA[q.b-1];
 let h=`<div class="skicker">${QZ.i+1}/${QZ.pool.length} · ${c.n}. ${esc(c.t)}</div><div class="q">${esc(q.q)}</div>`;
 h+=q.o.map((o,k)=>{let cl="";if(QZ.picked!==null){if(k===q.a)cl=" ok";else if(k===QZ.picked)cl=" no";}return `<button class="opt${cl}" data-opt="${k}" ${QZ.picked!==null?"disabled":""}>${"ABCD"[k]}) ${esc(o)}</button>`}).join("");
 if(QZ.picked!==null){h+=`<div class="exp"><b style="color:${QZ.picked===q.a?"var(--ok)":"var(--no)"}">${QZ.picked===q.a?"Doğru.":"Yanlış."}</b> ${esc(q.e)}</div><div class="pn"><button class="btn" data-chap="${q.b}">Konuya git</button><button class="btn pri" id="qn">Sonraki</button></div>`;}
 $("#main").innerHTML=h;
}
function vSaved(){
 header("Kaydedilenler",false);
 const ms=ALLS.filter(s=>ST.mark[s.id]);const w=SORULAR.filter(q=>ST.ans[q.id]===false);
 let h=ms.length?`<div class="card">`+ms.map(s=>`<button class="row" data-sec="${s.id}"><span class="num">${s.c}</span><span class="tt">${esc(s.id+" "+s.t)}</span>${IC.chev}</button>`).join("")+`</div>`:`<div class="empty">Henüz kaydedilmiş konu yok. Bir konunun içindeki ☆ Kaydet düğmesine dokun.</div>`;
 if(w.length)h+=`<button class="btn pri" style="width:100%" data-gowrong="1">Yanlış yaptığın ${w.length} soruyu tekrar çöz</button>`;
 $("#main").innerHTML=h;
}
function vSettings(){
 header("Ayarlar",false);
 const T={auto:"Otomatik",light:"Açık",dark:"Koyu",black:"Siyah"};
 $("#main").innerHTML=`<div class="card" style="padding:14px"><b>Tema</b><div class="tools">${Object.keys(T).map(k=>`<button class="chip" data-th="${k}" aria-pressed="${ST.theme===k}">${T[k]}</button>`).join("")}</div><b>Yazı boyutu</b><div class="tools">${[15,17,19,21].map(k=>`<button class="chip" data-fs="${k}" aria-pressed="${ST.fs===k}">${k}px</button>`).join("")}</div></div>
 <div class="card" style="padding:14px;font-size:14.5px"><b>İçerik hakkında</b><p>Konu anlatımı, paylaştığın “Üroloji Çalışma Defteri”nden birebir aktarıldı (${DATA.length} ana bölüm, ${ALLS.length} konu). Defter başka bir yapay zekâyla hazırlanmış; kılavuz önerileriyle çelişen bir bilgi görürsen güncel EAU 2026 önerileri için <a href="${KILAVUZ}" target="_blank" rel="noopener">Üro Kılavuz</a>'u esas al.</p><p>Soru bankası (${SORULAR.length} soru) EAU 2026 cep kılavuzlarıyla uyumlu hazırlandı.</p></div>
 <button class="btn" style="width:100%;color:var(--no);border-color:var(--no)" id="rst">İlerlemeyi sıfırla</button>`;
}
document.addEventListener("click",e=>{
 const t=e.target.closest("button,a");if(!t||t.tagName==="A")return;
 if(t.dataset.tab){TAB=t.dataset.tab;if(TAB!=="soru")QZ=null;if(TAB==="konu"){VIEW={v:"home"};hist.length=0;}render();window.scrollTo(0,0);return;}
 if(t.id==="bk"){if(TAB==="soru"){QZ=null;render();}else back();return;}
 if(t.dataset.markread){ST.read[t.dataset.markread]=true;save();}
 if(t.dataset.sec){if(TAB!=="konu"){TAB="konu";hist.length=0;VIEW={v:"home"};}go({v:"sec",id:t.dataset.sec,q:t.dataset.q});return;}
 if(t.dataset.chap){if(TAB!=="konu"){TAB="konu";QZ=null;hist.length=0;VIEW={v:"home"};}go({v:"chap",n:+t.dataset.chap});return;}
 if(t.dataset.quizchap){TAB="soru";startQuiz(t.dataset.quizchap);render();window.scrollTo(0,0);return;}
 if(t.dataset.gowrong){TAB="soru";startQuiz("wrong");render();return;}
 if(t.dataset.qs){startQuiz(t.dataset.qs);render();window.scrollTo(0,0);return;}
 if(t.dataset.opt&&QZ&&QZ.picked===null){const q=QZ.pool[QZ.i];QZ.picked=+t.dataset.opt;const ok=QZ.picked===q.a;if(ok)QZ.ok++;ST.ans[q.id]=ok;save();vQuiz();return;}
 if(t.id==="qn"){QZ.i++;QZ.picked=null;vQuiz();window.scrollTo(0,0);return;}
 if(t.id==="qx"){QZ=null;vQuiz();return;}
 if(t.id==="rd"){const id=VIEW.id;ST.read[id]=!ST.read[id];if(!ST.read[id])delete ST.read[id];save();vSec();return;}
 if(t.id==="mk"){const id=VIEW.id;ST.mark[id]=!ST.mark[id];if(!ST.mark[id])delete ST.mark[id];save();vSec();return;}
 if(t.id==="fm"||t.id==="fp"){ST.fs=Math.max(14,Math.min(24,ST.fs+(t.id==="fp"?1:-1)));save();applyTheme();return;}
 if(t.dataset.th){ST.theme=t.dataset.th;save();applyTheme();vSettings();return;}
 if(t.dataset.fs){ST.fs=+t.dataset.fs;save();applyTheme();vSettings();return;}
 if(t.id==="rst"){if(confirm("Okundu, kaydedilen ve soru cevapları silinsin mi?")){ST.read={};ST.mark={};ST.ans={};ST.last=null;save();vSettings();}return;}
});
window.addEventListener("scroll",()=>$("#top").classList.toggle("sc",scrollY>4),{passive:true});
applyTheme();render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
