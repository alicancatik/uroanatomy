ağlıklı damar ağları oluşur (Neo-Anjiyogenez).</p></li>\n<li><p>Kime Yapılır? EAU 2026 kılavuzuna göre sadece Hafif ve Orta\ndereceli Vaskülojenik (Damarsal) ED hastalarına önerilir. Sinirleri\nkesilmiş (Nörojenik) veya ağır diyabetik hastalarda işe\nyaramaz.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe gelen hasta 'Sildenafil (Viagra) aldım ama hiçbir\nişe yaramadı, haplar bende çalışmıyor' dedi. Hemen 2. basamak olan iğne\n(Trimiks) tedavisine mi geçersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Literatüre göre PDE5 inhibitörü 'başarısız' diyen\nhastaların büyük bir kısmı ilacı yanlış kullanmaktadır. İğneye geçmeden\nönce hastaya şu 3 soruyu mutlaka sormalıyım: 1) İlacı tok karnına (veya\nyağlı yemekle) mı aldın? 2) İlacı aldıktan sonra cinsel bir uyarı (ön\nsevişme) oldu mu? 3) İlacı sadece 1-2 kez mi denedin? (Kılavuzlar ilacın\nişe yaramadığını söylemek için en az 6-8 farklı deneme yapılmasını şart\nkoşar).\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastaya intrakavernozal enjeksiyon (ICI) öğreteceğiz. İğneyi\npenisin tam olarak neresinden ve hangi açısından yapmasını\nsöylemelisin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İğne penisin gövdesine (şaftına), saat kadranına göre 10\nveya 2 hizasından (lateralden) yapılmalıdır. Saat 12 hizası (Dorsal)\nkesinlikle YASAKTIR çünkü oradan ana sinir ve damar paketi (Nörovasküler\ndemet) geçer. Saat 6 hizası (Ventral) da YASAKTIR çünkü orada üretra\n(idrar kanalı) vardır. İğne sadece yan taraftaki süngerimsi dokulara\n(korpus kavernozumlara) yapılmalıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Genç bir hasta sana geldi. Sabah ereksiyonları (morning wood)\nçok iyi, mastürbasyonda hiçbir sorunu yok ama partneriyle ilişkiye\ngireceği zaman aniden sertliği kayboluyor. IIEF-5 skoru da düşük. Hangi\ntahlilleri istersin ve tedavide ilk ne verirsin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu klasik bir Psikojenik ED (Performans Anksiyetesi)\ntablosudur. Fizyolojik mekanizma, damarlar ve sinirler tamamen sağlamdır\n(sabah ereksiyonu ve mastürbasyon bunu kanıtlar). Anksiyete anında artan\naşırı adrenalin (sempatik deşarj), penisteki damarları kasar ve\nereksiyonu bitirir. Rutin tahliller (Testosteron, Açlık şekeri)\nistenebilir ama asıl tedavi hastayı psikoseksüel danışmanlığa\nyönlendirmek ve özgüvenini geri kazanana kadar geçici destek amaçlı\ndüşük doz PDE5 inhibitörü (örn: Tadalafil 5 mg) vermektir.\"</li>\n</ul>\n"}, {"id": "9.3", "t": "Penil Protez Cerrahisi (3. Basamak)", "h": "<h3 id=\"a-ci̇haz-seçi̇mi̇-bükülebilir-mi-şişirilebilir-mi\">A. CİHAZ SEÇİMİ:\nBükülebilir mi, Şişirilebilir mi?</h3>\n<p>Hastanın sosyokültürel durumu, el becerisi (manuel yeteneği) ve\nanatomisi hangi cihazın takılacağını belirler.</p>\n<h3 id=\"1-malleable-bükülebilir--yarı-sert-protezler\">1. Malleable\n(Bükülebilir / Yarı Sert) Protezler:</h3>\n<ul>\n<li><p>Yapısı: İçi çelik/gümüş tel sarmallı, dışı silikon kaplı iki adet\nsilindirdir.</p></li>\n<li><p>Mekanizma: Sürekli serttir. Hasta cinsel ilişki için penisi\nyukarı doğru büker, günlük hayatta (pantolon içinde saklamak için) aşağı\ndoğru büker.</p></li>\n<li><p>Avantaj/Dezavantaj: Ameliyatı çok kısa ve kolaydır, mekanik\nbozulma ihtimali (içinde sıvı olmadığı için) neredeyse sıfırdır ve çok\nucuzdur. Ancak penis sürekli sert kaldığı için kozmetik olarak saklaması\nzordur ve uca yaptığı sürekli baskı nedeniyle erozyon (delip dışarı\nçıkma) riski en yüksek olan modeldir. Yaşlı, el becerisi zayıf (pompayı\nsıkamayacak) hastalarda tercih edilir.</p></li>\n</ul>\n<h3 id=\"2-şişirilebilir-i̇nflatable---3-parçalı-protezler\">2.\nŞişirilebilir (İnflatable - 3 Parçalı) Protezler:</h3>\n<p>Altın standarttır. Gerçek fizyolojik ereksiyonu (sönme ve şişme)\nbirebir taklit eden hidrolik bir mühendislik harikasıdır.</p>\n<ul>\n<li>Üç Parçanın Anatomik Yerleşimi:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Silindirler (Cylinders): Her iki korpus kavernozumun içine\nyerleştirilir (Ereksiyonu sağlayan ana yapılar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Pompa (Pump): Skrotumun (torbanın) içine, testislerin arasına,\nhastanın eliyle kolayca bulabileceği en alt (dependent) noktaya\nyerleştirilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Rezervuar (Su Deposu): Karnın alt kısmına, mesanenin hemen önüne\n(Space of Retzius) veya ektopik olarak kasık fasyasının altına\nyerleştirilir. İçi steril izotonik sıvıyla doludur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Mekanizma: Hasta torbasındaki pompayı sıktığında, rezervuardaki su\nhortumlardan geçerek penisteki silindirleri doldurur ve penis sertleşir.\nİş bitince pompadaki indirme düğmesine basar, su depoya geri döner ve\npenis tamamen yumuşayıp doğal haline döner.</li>\n</ul>\n<h3 id=\"b-cerrahi̇-yaklaşimlar-kesi-nereden-yapılacak\">B. CERRAHİ\nYAKLAŞIMLAR (Kesi Nereden Yapılacak?)</h3>\n<ol type=\"1\">\n<li>Peno-Skrotal Kesi (En Sık Kullanılan):<br />\nPenisin torbayla birleştiği o alt kıvrımdan (rafe) yapılır.</li>\n</ol>\n<ul>\n<li><em>Avantajı:</em> Korpus kavernozumlara proximal (kök) genişleme\niçin mükemmel bir açı sağlar. Pompayı skrotuma yerleştirmek çok\nkolaydır. Dorsal sinirlere (penisin hissini sağlayan sinirler) uzak\nolduğu için his kaybı riski minimaldir.</li>\n</ul>\n<ol type=\"1\">\n<li>İnfrapubik Kesi:<br />\nPenisin hemen üstünden, kasık kıllarının olduğu bölgeden yapılır.</li>\n</ol>\n<ul>\n<li><em>Avantajı:</em> Rezervuarı karın içine atmak çok daha\nkolaydır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Dezavantajı:</em> Pompayı aşağı (skrotuma) indirmek zordur ve\nkesi yeri dorsal nörovasküler demetin tam üzerinde olduğu için ameliyat\nsonrası peniste his kaybı yaşanma riski daha yüksektir.</li>\n</ul>\n<h3 id=\"c-cerrahin-kabusu-protez-enfeksi̇yonu\">C. CERRAHIN KABUSU: PROTEZ\nENFEKSİYONU</h3>\n<p>Penil protez ameliyatlarının onkolojiden bile daha stresli olmasının\ntek bir sebebi vardır: Enfeksiyon (%1-3).</p>\n<p>Kanlanmayan bir silikon parçasının üzerinde bakteri ürediğinde\n(genellikle <em>Staphylococcus epidermidis</em> biyofilm tabakası\noluşturur), o enfeksiyonu hiçbir antibiyotik temizleyemez.</p>\n<ul>\n<li><p>No-Touch Tekniği: Modern implantolojide cerrahın cildi kestikten\nsonra eli bir daha hastanın cildine değmez. Tüm cerrahi saha yapışkanlı\niyotlu örtülerle kapatılır. Cihaz paketinden çıktığı an antibiyotikli\nsularla yıkanır ve asla eldivenle bile gereksiz yere ellenmez.</p></li>\n<li><p>Enfeksiyon Olduğunda Ne Yapılır? (Altın Kural):<br />\nProtez enfekte olduysa (hasta ateş, akıntı veya şiddetli ağrıyla\ngeldiyse) o protez MUTLAKA ÇIKARILMALIDIR (Eksplantasyon). * Salvage\n(Kurtarma) Protokolü (Mulcahy):<br />\nEğer enfekte protezi çıkarıp hastayı eve gönderirsen, korpus\nkavernozumlar haftalar içinde taş gibi fibrozise uğrar ve büzüşür. Hasta\nbir daha asla protez takılamayacak kadar penik kısalığı yaşar. Bu yüzden\nMulcahy protokolü uygulanır: Enfekte protez çıkarılır, içerisi 7 farklı\nsolüsyonla (Betadin, Hidrojen peroksit, antibiyotikli sular vs.) yıkanır\nve aynı seansta yepyeni, steril bir protez (genellikle malleable) tekrar\ntakılır. Bu sayede fibrozis engellenir ve boyut korunur.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe protez taktırdığı için çok mutlu olan ama tek bir\nşikayeti olan hasta geldi: 'Hocam, penisim taş gibi sert oluyor ama baş\nkısmı (Glans) yumuşak ve soğuk kalıyor.' Bu bir cerrahi komplikasyon\nmudur?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır, bu ameliyatın beklenen bir fizyolojik sonucudur\n(Soğuk Glans Sendromu). Protez sadece korpus kavernozumların içine\ntakılır. Glans (penis başı) ise korpus spongiozumun bir uzantısıdır ve\nprotez buraya girmez. Bu durumu hastaya ameliyattan önce mutlaka\nanlatmak ve beklentisini yönetmek gerekir. İlişki öncesi iğne\n(Trimiks/Alprostadil) veya PDE5 inhibitörü eklenerek glansın kanla\ndolması sağlanabilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Ameliyat sırasında bujilerle (dilatörlerle) korpus\nkavernozumu genişletirken biraz fazla güç uyguladın ve dilatör üretra\n(idrar kanalı) içine girdi (Üretral Perforasyon). Ameliyata devam edip\nprotezi takar mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"ASLA! Eğer üretra delindiyse, idrar yolundaki bakteriler\ndoğrudan protez yatağına açılmış demektir. Enfeksiyon riski %100'dür.\nDerhal o tarafın işlemi durdurulur, üretra onarılır, hastaya sonda\ntakılır ve ameliyat iptal edilir. En az 3-6 ay iyileşme beklendikten\nsonra protez tekrar denenir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta diyabetik, ciddi fimozisi (sünnet derisi darlığı) var\nve penil protez istiyor. 'Aynı seansta hem beni sünnet et hem de\nprotezimi tak' diyor. Kabul eder misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU/AUA kılavuzlarına göre, tertemiz (steril) bir implant\ncerrahisini, potansiyel olarak kontamine/enfekte olan bir sünnet derisi\ncerrahisiyle (Fimozis) aynı seansta birleştirmek enfeksiyon riskini\ninanılmaz derecede artırır. Hastaya önce sadece sünnet yapılır, yara\ntamamen iyileştikten haftalar/aylar sonra protez cerrahisi\nplanlanır.\"</li>\n</ul>\n"}, {"id": "9.4", "t": "Peyronie Hastalığı (Eğrilik ve Plaklar)", "h": "<h3 id=\"a-patofi̇zyoloji̇-neden-peniste-kemik-çıkar\">A. PATOFİZYOLOJİ:\nNeden Peniste Kemik Çıkar?</h3>\n<p>Peyronie hastalığı genetik bir şanssızlık veya enfeksiyon değildir;\ntemelde anormal bir yara iyileşmesi (skar) sürecidir.</p>\n<ol type=\"1\">\n<li><p>Mikrotravma: Cinsel ilişki sırasında (özellikle partner üstteyken\npenisin aniden bükülmesiyle) penisin dış kılıfı olan Tunika\nAlbuginea'nın katmanları arasında mikroskobik yırtıklar oluşur.</p></li>\n<li><p>Hatalı Tamir: Vücut bu yırtığı onarmak için bölgeye fibrin ve\nfibroblast yığar. Ancak genetik yatkınlığı olan erkeklerde bu süreç\ndurmaz. Sağlıklı, esnek Tip 1 Kollajen yerine, kaskatı ve esnemez Tip 3\nKollajen birikir.</p></li>\n<li><p>Plak Oluşumu: Bu birikim zamanla kireçlenir (kalsifikasyon) ve\nhatta kemikleşir (ossifikasyon). Penisin sırtında (dorsalinde) veya\naltında ele gelen taş gibi sert bir kitle (Plak) oluşur. Ereksiyon\nsırasında normal dokular esnerken, plak esnemez ve penis plağın olduğu\nyöne doğru bükülür.</p></li>\n</ol>\n<h3 id=\"b-hastaliğin-i̇ki̇-yüzü-akut-vs-kronik-faz\">B. HASTALIĞIN İKİ\nYÜZÜ: Akut vs. Kronik Faz</h3>\n<p>Cerrahinin ne zaman yapılacağını belirleyen en hayati ayrım\nbudur.</p>\n<ul>\n<li>Akut (İnflamatuar) Faz: Hastalık yeni başlamıştır. Hasta ereksiyon\nolduğunda şiddetli ağrı duyar. Plak henüz tam oturmamıştır ve penis\neğriliğinin açısı aydan aya değişmektedir (kötüleşmektedir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Altın Kural:</em> AKUT FAZDA ASLA AMELİYAT YAPILMAZ. İnflamasyon\nsürerken dikiş atmak veya yama yapmak hastalığı daha da alevlendirir,\ndikişler atar. Bu dönemde sadece ağrı kesiciler, PDE5 inhibitörleri\n(kanlanmayı artırıp plağı yıkmak için) ve traksiyon cihazları (penisi\nmekanik olarak gerdiren aletler) kullanılır. E vitamini veya Potaba gibi\nağızdan alınan ilaçların EAU 2026'ya göre artık bilimsel bir geçerliliği\n(kanıtı) yoktur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kronik (Stabil) Faz: Hastalığın üzerinden en az 12-18 ay geçmiştir.\nEreksiyondaki ağrı tamamen kaybolmuştur ve eğriliğin açısı son 3-6 aydır\nsabittir (değişmemiştir). <em>İşte ameliyat veya enjeksiyon zamanı\ngelmiştir.</em></li>\n</ul>\n<h3\nid=\"c-i̇ntralezyonel-enjeksi̇yon-xiaflex-kollajenaz-mucizesi-ve-kabusu\">C.\nİNTRALEZYONEL ENJEKSİYON: Xiaflex (Kollajenaz) Mucizesi ve Kabusu</h3>\n<p>Ameliyat olmak istemeyen hastalar için FDA onaylı en güçlü silahımız\nCCH (Collagenase Clostridium Histolyticum - Xiaflex) enjeksiyonudur.</p>\n<ul>\n<li><p>Mekanizma: Bu enzim, doğrudan o taş gibi sert plağın içine\nenjekte edilir. Tip 1 ve Tip 3 kollajen bağlarını biyokimyasal olarak\neriterek plağı parçalar. Sonrasında hasta evde penisine \"modelleme\"\n(gerdirme ve bükme) masajları yaparak plağı kırar.</p></li>\n<li><p>Kime Yapılır? Eğrilik açısı 30 ile 90 derece arasında olan ve\nplağı elle hissedilebilen hastalara.</p></li>\n<li><p>Kabus Komplikasyon (Korporal Rüptür): Enzim plağı eritirken,\nsağlıklı tunika albugineayı da inceltebilir. Hasta modelleme yaparken\nveya ilk cinsel ilişkisinde yüksek bir \"ÇAT!\" sesi duyar. Penis aniden\nşişer ve patlıcan moru rengini alır (Patlıcan Deformitesi). Korpus\nkavernozum yırtılmıştır ve bu acil bir cerrahi eksplorasyon\ngerektirir.</p></li>\n</ul>\n<h3 id=\"d-cerrahi̇-geometri̇-plikasyon-mu-greft-mi\">D. CERRAHİ GEOMETRİ:\nPlikasyon mu, Greft mi?</h3>\n<p>Ameliyat kararı aldık. Elimizde eğri bir silindir var. Plağın olduğu\ntaraf kısa, sağlıklı taraf uzun. Geometrik olarak bu silindiri\ndüzeltmenin sadece iki yolu vardır: Uzun tarafı kısaltmak veya kısa\ntarafı uzatmak.</p>\n<h3 id=\"1-tunikal-kısaltma-i̇şlemleri-plikasyon--nesbit\">1. Tunikal\nKısaltma İşlemleri (Plikasyon / Nesbit):</h3>\n<ul>\n<li><p>Mantık: Eğriliğin tam karşısındaki (uzun ve sağlıklı olan) tunika\nalbuginea kendi üzerine katlanır ve kalıcı dikişlerle (plikasyon)\nbüzülür veya küçük elipsler şeklinde kesilip dikilir (Nesbit).</p></li>\n<li><p>Kime Yapılır? Eğrilik açısı \\&lt; 60 derece olan, ereksiyon\nkapasitesi iyi ve penis boyu yeterince uzun olan hastalara.</p></li>\n<li><p>Zayıf Yönü: Bu ameliyat penisi KISALTIR (yaklaşık 1-2 cm).\nHastaya ameliyattan önce \"Eğriliğin düzelecek ama boyu biraz kısalacak\"\ngerçeğini onam formunda imzalatarak bildirmek hukuki bir\nzorunluluktur.</p></li>\n</ul>\n<h3 id=\"2-tunikal-uzatma-i̇şlemleri-i̇nsizyoneksizyon-ve-greftleme\">2.\nTunikal Uzatma İşlemleri (İnsizyon/Eksizyon ve Greftleme):</h3>\n<ul>\n<li><p>Mantık: Eğriliğin tam merkezindeki o sert plak (kısa olan taraf)\n\"H\" veya \"Y\" şeklinde kesilir (insizyon) ve penis zorla düzeltilir.\nOrtada açılan o devasa boşluğa vücudun başka yerinden alınan bir doku\n(safen ven / bacak toplardamarı) veya sentetik/biyolojik yamalar (Bovine\nperikardiyum) dikilir.</p></li>\n<li><p>Kime Yapılır? Eğrilik açısı \\&gt; 60 derece olanlara, Kum Saati\n(Hourglass) veya menteşe deformitesi olup penis gövdesi incelmiş\nolanlara ve penis boyu zaten kısa olanlara.</p></li>\n<li><p>Kabus Komplikasyon: Plağı keserken altındaki kavernöz dokuya (ve\nveno-oklüzif mekanizmaya) zarar verme riski yüksektir. Hastaların\n%20'sinde ameliyat sonrası yeni başlayan şiddetli Erektil Disfonksiyon\n(ED) gelişir.</p></li>\n</ul>\n<h3 id=\"3-penil-protez-mutluluk-çubuğu\">3. Penil Protez (Mutluluk\nÇubuğu):</h3>\n<ul>\n<li>Eğer hastanın hem şiddetli Peyronie eğriliği var hem de\nhaplara/iğnelere yanıt vermeyen ağır bir Erektil Disfonksiyonu varsa; ne\nplikasyon ne de greft yapılır. Doğrudan 3 parçalı şişirilebilir penil\nprotez takılır ve ameliyatta protez şişirildikten sonra penis zorla\nkırılarak (Modelleme) veya plak kesilerek eğrilik düzeltilir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe Peyronie hastası geldi. 'Hocam penisim ereksiyon\nhalinde değilken, inik (flaksid) durumdayken de ağrıyor' dedi. Bu\nPeyronie'nin akut fazı mıdır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Peyronie hastalığında inflamasyon tunika albuginea\nkatmanları arasındadır. Tunika sadece penis kanla dolup gerildiğinde\n(ereksiyon anında) gerilime uğrar ve ağrı yapar. İnaktif/inik haldeki\nağrı Peyronie'nin tipik bir bulgusu değildir; altta yatan başka bir\nnörojenik ağrıyı, pelvik taban spazmını veya kronik prostatiti (CPPS)\ndüşündürmelidir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın dorsalinde (penisin üstünde) devasa bir plak var.\nEğrilik yukarıya doğru \\&gt; 70°. İnsizyon ve Greft (Yama) ameliyatı\nyapmaya karar verdin. Dorsaldeki plağı keserken en çok hangi anatomik\nyapıya dikkat etmelisin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Dorsal plağın tam üzerinden penisin en hayati damar-sinir\npaketi olan Nörovasküler Demet (Dorsal arter, derin dorsal ven ve dorsal\nsinirler) geçer. Plağı kesmeden önce bu demeti milimetrik bir\ndiseksiyonla ('Buck fasyasını' kaldırarak) sağa veya sola doğru\nsıyırmalı (mobilize etmeli), ondan sonra plağı kesmeliyim. Aksi takdirde\nhastanın penisi hissini tamamen kaybeder (anestezi) veya glans nekroza\ngider.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Ultrason çektin, plakta yoğun kalsifikasyon (kireçlenme)\ngördün. Bu hastaya Xiaflex (Kollajenaz) enjeksiyonu önerir misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU/AUA kılavuzlarına göre, eğer plak tamamen kalsifiye\nolmuşsa (kemikleşmişse), Kollajenaz enzimi o kalsiyum zırhını aşıp\naltındaki kollajen bağlarına ulaşamaz. Yoğun kalsifikasyonu olan\nplajlarda enjeksiyon tedavileri kontrendikedir (etkisizdir). Bu hasta\ndoğrudan cerrahiye (plikasyon veya greft) yönlendirilmelidir.\"</li>\n</ul>\n"}, {"id": "9.5", "t": "Priapizm (Ürolojik Acil Durum ve Cerrahi Şantlar)", "h": "<h3 id=\"a-düşmani-tanimak-i̇skemik-mi-non-i̇skemik-mi\">A. DÜŞMANI TANIMAK:\nİskemik mi, Non-İskemik mi?</h3>\n<p>Priapizm, cinsel uyarıdan bağımsız olarak 4 saatten uzun süren uzamış\nereksiyondur. İki ana tipi vardır ve tedavileri birbirine taban tabana\nzıttır. Hasta acile geldiğinde ilk ve en hayati görevin bu ayrımı\nyapmaktır.</p>\n<h3 id=\"1-i̇skemik-düşük-akımlı---low-flow-priapizm\">1. İskemik (Düşük\nAkımlı - Low-flow) Priapizm:</h3>\n<ul>\n<li><p>Mekanizma: Penisin venöz çıkış kapakları kilitlenmiştir. Kan\niçeri girer ama çıkamaz. Hapsolan kanın oksijeni hızla tükenir, laktik\nasit birikir. Gerçek bir acildir.</p></li>\n<li><p>Klinik: Penis kaskatıdır (Rijit) ve hasta şiddetli ağrı çeker.\nGlans (penis başı) ve korpus spongiozum (idrar kanalının etrafı) olaya\nkatılmaz, yumuşaktır.</p></li>\n<li><p>Nedenleri: İntrakavernozal iğneler (Trimiks/Papaverin), PDE5\ninhibitörü aşırı dozu, psikiyatrik ilaçlar (Trazodon, Antipsikotikler)\nve genç hastalarda Orak Hücreli Anemi (Sickle Cell Disease).</p></li>\n</ul>\n<h3 id=\"2-non-i̇skemik-yüksek-akımlı---high-flow-priapizm\">2. Non-İskemik\n(Yüksek Akımlı - High-flow) Priapizm:</h3>\n<ul>\n<li><p>Mekanizma: Genellikle perine bölgesine alınan künt bir travma\n(örn: bisiklet selesinden düşme) sonrası kavernozal arter yırtılır ve\nsinüzoidlerin içine kontrolsüz, arteriyel kan pompalamaya başlar. Venöz\nçıkış açıktır.</p></li>\n<li><p>Klinik: Penis tam sert değildir (yarı-sert / parsiyel rijit) ve\nağrısızdır. Oksijenlenme devam ettiği için acil doku ölümü riski\nyoktur.</p></li>\n</ul>\n<h3 id=\"b-tani-ve-altin-standart-kavernozal-kan-gazı\">B. TANI VE ALTIN\nSTANDART: Kavernozal Kan Gazı</h3>\n<p>Fizik muayene her zaman güvenilir değildir. Acilde penis köküne ince\nbir iğne (19G veya 21G) batırıp içinden 2-3 cc kan çekersin ve doğrudan\nkan gazı cihazına yollarsın. Gözünle gördüğün renk ve laboratuvar sonucu\nsana tanıyı koydurur:</p>\n<ul>\n<li>İskemik Priapizm: Enjektöre gelen kan kapkaranlık (siyahımsı)\nrenktedir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Değerler: \\pO_2 &lt; 30 mmHg, \\pCO_2 &gt; 60 mmHg, ve asidoz\ntablosu (\\pH &lt; 7.25).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Non-İskemik Priapizm: Enjektöre gelen kan parlak kırmızıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Değerler: Normal arteriyel kanla aynıdır (\\pO_2 &gt; 90 mmHg,\nnormal \\pH).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Penil Renkli Doppler USG: Kesinleştirmek için acil şartlarında\nyapılır. İskemik tipte kan akımı sıfırdır; Non-iskemik tipte ise\nyırtılan arterden fışkıran kan (psödoanevrizma/fistül) görülür.</li>\n</ul>\n<h3 id=\"c-i̇skemi̇k-pri̇api̇zm-yöneti̇mi̇-eau-kılavuz-algoritması\">C. İSKEMİK\nPRİAPİZM YÖNETİMİ: EAU Kılavuz Algoritması</h3>\n<p>Zamanla yarışıyorsun. Kan gazında iskemiyi (asidozu) gördüğün an şu\nbasamakları sırayla uygularsın:</p>\n<p>Adım 1: Aspirasyon ve İrrigasyon</p>\n<p>Penisin lokal anesteziyle (penil blok) uyuşturulmasının ardından,\nsaat 2 veya 10 hizasından kalın (19G) kelebek iğnelerle girilir.\nİçerideki karanlık, pıhtılaşmış kan enjektörle çekilir. Ardından içeriye\nsoğuk Serum Fizyolojik (SF) basılarak korpus kavernozumlar yıkanır.\nGelen sıvı kırmızıya dönene kadar devam edilir. (Sadece bu işlemle\nvakaların %30'u çözülür).</p>\n<p>Adım 2: İntrakavernozal Sempatomimetik Enjeksiyon (Fenilefrin)</p>\n<p>Yıkama işe yaramazsa farmakolojik silahı çekersin.</p>\n<ul>\n<li><p>İlaç: Saf bir α_1-adrenerjik agonist olan Fenilefrin altın\nstandarttır. Damarları (düz kasları) şiddetle kasar ve kanın venlerden\ndışarı pompalanmasını sağlar.</p></li>\n<li><p>Uygulama: Özel olarak seyreltilir (genellikle 100-500\nmikrogram/mL) ve her 3-5 dakikada bir, penis inene kadar intrakavernozal\nenjekte edilir (Maksimum 1 saat).</p></li>\n</ul>\n<p>Adım 3: Cerrahi Şantlar (Surgical Shunts)</p>\n<p>İlaç da işe yaramadıysa, hapsolan o toksik kanı başka bir damar\nsistemine aktarmak (şant açmak) zorundasın. Öncelik her zaman uzak\n(distal) şantlardır. Spongiozum (ve glans) basınçsız olduğu için kanı\noraya aktarırız.</p>\n<ul>\n<li>Distal Şantlar (Penisin Ucundan Yapılanlar):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Winter Şantı: Tru-cut biyopsi iğnesi glansın (penis başının) içinden\nsokulur ve alttaki korpus kavernozumların uçları körlemesine delinerek\nfistüller yaratılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ebbehøj Şantı: 11 numara bistüri ile glanstan girilip tunika\nalbuginea'ya küçük çizikler (insizyonlar) atılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Al-Ghorab Şantı (Açık Cerahi): Bıçakla glansın üstü açılır, tunika\nalbuginea gözle görülerek 5x5 mm'lik pencereler şeklinde kesilip\nçıkarılır (Eksizyon). En etkili distal şanttır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Proksimal Şantlar (Penis Kökünden Yapılanlar):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Distal şantlar başarısız olursa yapılır. Quackels Şantı'nda korpus\nkavernozum ile korpus spongiozum birbirine perineal bölgede yan yana\ndikilir. Komplikasyon (üretra yaralanması) riski çok yüksektir.</li>\n</ul>\n<p>Adım 4: Akut Penil Protez İmplantasyonu</p>\n<p>Eğer priapizm 36-48 saati geçmişse, EAU kılavuzlarına göre o düz\nkaslar artık ölmüştür. Şant açmanın bir anlamı yoktur. Penisin tamamen\nbüzüşmesini (fibrozis) engellemek için, hasta acil şartlarda ameliyata\nalınır ve içine Malleable (Bükülebilir) Penil Protez takılır.</p>\n<h3 id=\"d-non-i̇skemi̇k-pri̇api̇zm-yöneti̇mi̇\">D. NON-İSKEMİK PRİAPİZM\nYÖNETİMİ</h3>\n<p>Bu hastalarda asidoz veya acil doku nekrozu yoktur. Bu yüzden agresif\nyıkamalara, şantlara veya Fenilefrin enjeksiyonlarına GEREK YOKTUR\n(Zaten işe yaramazlar çünkü damar yırtıktır).</p>\n<ul>\n<li>Tedavi: Hastanın kasığına buz ve baskı uygulanıp gözlemlenir.\nVakaların %60'ı kendi kendine kapanır. Kapanmazsa Girişimsel Radyolojiye\ngönderilir; anjiyografi ile yırtık arter bulunur ve hastanın kendi kan\npıhtısı (otolog pıhtı) veya geçici maddelerle Süperselektif Arteriyel\nEmbolizasyon yapılarak kanama durdurulur.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Acilde iskemik priapizmi olan hastaya Fenilefrin enjekte\netmeye başladın. Hemşireden monitörde özellikle neyi takip etmesini\nistersin ve neden?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Fenilefrin çok güçlü bir vazokonstriktördür. Eğer penisten\nsistemik dolaşıma kaçarsa, ani ve şiddetli Hipertansiyon ile refleks\nBradikardi yapar. Bu yüzden hastanın kan basıncı ve EKG'si (nabzı) işlem\nboyunca kesintisiz monitörize edilmelidir. Ciddi kardiyovasküler\nhastalığı olanlarda bu ilaç ölümcül olabilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Orak Hücreli Anemi (Sickle Cell) hastası acile priapizm ile\ngeldi. Ürolojik müdahalelere ek olarak hematolojik açıdan acilde ilk ne\nyapmalısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu hastalarda priapizmin nedeni oraklaşan alyuvarların venöz\nkanalları tıkamasıdır. Hipoksi ve asidoz oraklaşmayı daha da artırır\n(kısır döngü). Lokal ürolojik müdahalelerin (yıkama/Fenilefrin) yanı\nsıra hastaya acilen %100 Oksijen, agresif İntravenöz (IV) Hidrasyon,\nsistemik Alkalinizasyon (Bikarbonat) ve ağır vakalarda Kan Değişimi\n(Exchange Transfüzyon) için hematoloji konsültasyonu istenmelidir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Distal şantlar (Winter, Al-Ghorab) anatomik olarak korpus\nkavernozum ile glans arasında bağlantı kurar. Neden kanı başka bir yere\ndeğil de glansa boşaltıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Çünkü glans penis, korpus spongiozumun anatomik devamıdır.\nPriapizm sırasında korpus spongiozum ve glans basınçtan etkilenmez\n(düşük basınçlı kalırlar). Ayrıca spongiozumun venöz drenajı (derin\ndorsal ven ve sirkumfleks venler) tamamen açıktır. Biz şant açtığımızda,\nkavernozumdaki o sıkışmış yüksek basınçlı kan, glansın düşük basınçlı\nvenöz ağına (lavaboya dökülür gibi) akar ve sistemik dolaşıma geri\ndöner.\"</li>\n</ul>\n"}]}, {"n": 10, "t": "Androloji II: Erkek İnfertilitesi", "s": [{"id": "10.1", "t": "Temel Değerlendirme, Spermiyogram ve Hormonal Eksen", "h": "<h3 id=\"a-altin-standart-spermiyogram-ve-who-2021-kriterleri\">A. ALTIN\nSTANDART: Spermiyogram ve WHO 2021 Kriterleri</h3>\n<p>Hastadan istenecek ilk ve en önemli test Semen Analizidir\n(Spermiyogram). Ancak bu test sıradan bir kan tahlili değildir; 2-7\ngünlük cinsel perhiz (ne az, ne çok) sonrası, tercihen klinikteki özel\nbir odada mastürbasyon yoluyla verilmelidir.</p>\n<p>Tüm dünya ve EAU/AUA kılavuzları, bu testi yorumlarken Dünya Sağlık\nÖrgütü'nün (WHO) en güncel referans değerlerini kullanır. (Vizitlerde\nhala eski 2010 değerlerini sayarsan hoca seni uyarır, biz WHO 6. Baskı -\n2021 verilerini konuşacağız).</p>\n<p>WHO 2021 Alt Sınır Referans Değerleri (5. Persentil):</p>\n<ul>\n<li><p>Hacim (Volume): ≥ 1.4 mL</p></li>\n<li><p>Konsantrasyon (Mililitredeki sperm sayısı): ≥ 16\nmilyon/mL</p></li>\n<li><p>Total Sperm Sayısı (Tüm ejakülattaki): ≥ 39 milyon</p></li>\n<li><p>Total Motilite (Hareketlilik - PR + NP): ≥ %42</p></li>\n<li><p>İleri Doğru Hareketlilik (Progresif Motilite - PR): ≥\n%30</p></li>\n<li><p>Morfoloji (Kruger Kesin Kriterleri): ≥ %4 normal şekilli sperm.\n(Evet, %96'sının ucube/bozuk şekilli olması biyolojik olarak \"normal\"\nkabul edilir!).</p></li>\n</ul>\n<p>Klinik Jargon (Patolojik İsimlendirmeler):</p>\n<ul>\n<li><p>Oligozoospermi: Sperm konsantrasyonunun 16 milyon/mL'nin altında\nolması.</p></li>\n<li><p>Astenozoospermi: İleri hareketli sperm oranının %30'un altında\nolması.</p></li>\n<li><p>Teratozoospermi: Normal şekilli sperm oranının %4'ün altında\nolması.</p></li>\n<li><p>OAT Sendromu: Bu üçünün aynı anda bozuk olması\n(Oligo-Asteno-Teratozoospermi).</p></li>\n<li><p>Azoospermi: Ejakülatta (menide) santrifüj edildikten sonra bile\nHİÇ sperm hücresi bulunmaması.</p></li>\n<li><p>Aspermi: Mastürbasyon sonrası dışarı hiç sıvı (meni) çıkmaması\n(Retrograd ejakülasyon veya anejakülasyon).</p></li>\n</ul>\n<h3 id=\"b-kontrol-odasi-hipotalamo-hipofizer-gonadal-hpg-eksen\">B.\nKONTROL ODASI: Hipotalamo-Hipofizer-Gonadal (HPG) Eksen</h3>\n<p>Eğer spermiyogram bozuksa, testise \"üret\" emrini veren beynin kontrol\nodasına, yani HPG eksenine bakmalısın. Bu ekseni anlamadan hiçbir\nhastaya hormon ilacı yazamazsın.</p>\n<ol type=\"1\">\n<li><p>Hipotalamus: Düzenli aralıklarla (pulsatil) GnRH\nsalgılar.</p></li>\n<li><p>Hipofiz Ön Lobu: GnRH uyarısıyla iki majör hormon salgılar: FSH\nve LH.</p></li>\n</ol>\n<h3 id=\"3-testis-i̇ki-farklı-fabrika\">3. Testis (İki Farklı\nFabrika):</h3>\n<ul>\n<li>LH (Lüteinleştirici Hormon): Gider testisteki bağ dokusunda bulunan\nLeydig Hücrelerini uyarır ve Testosteron ürettirir. (Testosteron kanda\nyükselince beyni uyarır ve LH üretimini baskılar →<br />\nNegatif Feedback).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>FSH (Folikül Uyarıcı Hormon): Gider testisin içindeki tübüllerin\n(üretim bantlarının) duvarını döşeyen Sertoli Hücrelerini uyarır ve\nSpermatogenezi başlatır. Sertoli hücreleri sperm üretirken kana\nİnhibin-B adında bir protein salgılar. (İnhibin-B beyne gidip sadece FSH\nüretimini baskılar → Negatif Feedback).</li>\n</ul>\n<p>Klinik Çıkarım (Dedektiflik):</p>\n<p>Eğer bir hastanın kan tahlilinde FSH seviyesi çok yüksekse (örn: 25\nmIU/mL), bu ne demektir? Testisteki Sertoli hücreleri (sperm fabrikası)\nharabiyete uğramış veya yok olmuş demektir. İnhibin-B üretilemediği için\nbeynin (FSH'ın) freni boşalmıştır. Beyin çaresizce testisleri\nçalıştırmak için sürekli FSH pompalamaktadır ama aşağıda cevap verecek\nfabrika kalmamıştır. Bu tablo doğrudan Primer Testiküler Yetmezliği\n(Non-Obstrüktif Azoospermi) gösterir.</p>\n<h3 id=\"c-fi̇zi̇k-muayene-testisin-dili\">C. FİZİK MUAYENE: Testisin\nDili</h3>\n<ul>\n<li><p>Testis Hacmi: Orkidometre (Prader) ile ölçülür. Normali 15-20 mL\n(veya uzun aksı \\&gt;4 cm) olmalıdır. Eğer testisler fındık kadar (örn:\n3-5 mL) ve taş gibi sertse Klinefelter Sendromunu; küçük ve yumuşaksa\nhipofiz yetmezliğini düşünmelisin.</p></li>\n<li><p>Vaz Deferens Palpasyonu: Skrotumdaki kordon elle muayene edilir.\nO sert, spagetti makarnası gibi olan sperm taşıyıcı kanal (Vaz Deferens)\nyerinde mi? (Kistik Fibrozis hastalarında bu kanal doğuştan yoktur →\nCBAVD).</p></li>\n<li><p>Varikosel Muayenesi: Hasta mutlaka ayakta, sıcak bir odada ve\nValsalva (ıkınma) manevrası yaptırılarak muayene edilir. Sperm\nkalitesini bozan en sık anatomik nedendir.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe gelen hastanın spermiyogramını eline aldın. Hacim\nnormal ama sperm sayısı sıfır (Azoospermi) veya 1-2 milyon gibi çok\ndüşük geldi. Hemen hastaya 'Çocuğun olmaz, tüp bebek veya ameliyat şart'\nder misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Asla. Ürolojik tıbbın en katı kurallarından biri şudur: Tek\nbir spermiyogram ile asla tanı konmaz ve tedavi kararı verilmez.\nSpermatogenez döngüsü dalgalıdır ve stres, ateşli bir hastalık veya\nsıcak banyo bile o anki test sonucunu dibe çekebilir. İlk testten en az\n3-4 hafta (ideali 1-2 ay) sonra mutlaka ikinci bir doğrulayıcı\nspermiyogram istenir. Tanı her iki testin sonucuna göre konur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Vücut geliştirme (Bodybuilding) sporuyla uğraşan, devasa\nkaslı bir genç geldi. 'Çocuğum olmuyor' diyor. Spermiyogramda Azoospermi\nsaptadın. Hormonlarına baktın: FSH: 0.1, LH: 0.1, Testosteron: 1500 (Çok\nyüksek). Ne olmuştur bu hastaya?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hasta kas yapmak için dışarıdan Eksojen Testosteron\n(Anabolik Steroid) kullanmaktadır. Dışarıdan alınan yüksek doz\ntestosteron, beyni (hipofizi) kandırarak muazzam bir negatif feedback\nyaratır ve FSH/LH üretimini tamamen sıfırlar (Kapatır). LH olmayınca\ntestisin içindeki lokal testosteron üretimi durur. Spermatogenez için\ntestisin <em>kendi içindeki (intratestiküler)</em> testosteron\nseviyesinin kandakinden 100 kat yüksek olması şarttır. Dışarıdan alınan\ntestosteron en güçlü erkek doğum kontrol yöntemlerinden biridir. Tedavi\nolarak steroidleri kesmesi ve ekseni yeniden başlatmak için hCG/hMG\n(Klomifen) tedavileri verilmesi gerekir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Spermiyogramda Hacim 0.5 mL (Çok düşük), pH 6.5 (Asidik) ve\nAzoospermi var. Muayenede testis boyutları tamamen normal (18 mL). Hangi\nspesifik patolojiyi düşünürsün?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Meni hacminin %70'ini alkali (bazik) fruktoz içeren Seminal\nVeziküller üretir. Eğer hacim çok düşük, sıvı asidik (prostat sıvısı\nağırlıklı) ve sperm sıfırsa, bu durum Ejakülatuar Kanal Obstrüksiyonunu\n(EDO) veya Doğuştan İki Taraflı Vaz Deferens Yokluğunu (CBAVD) gösterir.\nFabrika (testis) çalışıyor ama taşıyıcı yollar tıkalıdır veya hiç yoktur\n(Obstrüktif Azoospermi).\"</li>\n</ul>\n"}, {"id": "10.2", "t": "Varikosel (İnfertilitenin En Sık Geri Döndürülebilir Nedeni)", "h": "<h3 id=\"a-patofi̇zyoloji̇-bir-venöz-göllenme-spermi-nasıl-öldürür\">A.\nPATOFİZYOLOJİ: Bir Venöz Göllenme Spermi Nasıl Öldürür?</h3>\n<p>Varikosel, spermatik kord içindeki Pampiniform Pleksus venlerinin\nanormal genişlemesidir (varisidir). Genellikle sol tarafta (%90) görülür\nçünkü sol gonadal ven, sol renal vene dik bir açıyla dökülür ve\nyerçekimine karşı daha uzun bir hidrostatik sütun oluşturur.</p>\n<p>Peki bu genişleyen damarlar testis fabrikasını nasıl bozar?</p>\n<ol type=\"1\">\n<li><p>Isı Stresi (Hipertermi): Testisler vücut dışında, 34°C'de\nçalışmak üzere tasarlanmıştır. Pampiniform pleksus, arteriyel kanı\nsoğutan bir \"radyatör\" görevi görür. Varikoselde bu sıcak kan göllenir,\ntestisin ısısı 37°C'ye çıkar. Sıcaktan ilk ölenler, hareketli (motil)\nspermlerdir.</p></li>\n<li><p>Oksidatif Stres (ROS): Göllenen kan hipoksi (oksijensizlik)\nyaratır. Dokuda Reaktif Oksijen Türleri (Serbest Radikaller) birikir. Bu\nradikaller spermin o hassas hücre zarına ve çekirdeğine saldırarak DNA\nFragmantasyonuna (Kırıklarına) neden olur. Sayı normal görünse bile,\nDNA'sı parçalanmış bir sperm yumurtayı dölleyemez veya tekrarlayan\ndüşüklere (abortus) yol açar.</p></li>\n<li><p>Adrenal Reflü: Sol renal ven, aynı zamanda sol adrenal\n(böbreküstü) bezinin de kanını alır. Kapakçıklar bozuk olduğunda,\nadrenal bezden gelen toksik metabolitler (kortizol, katekolaminler)\nretrograd akımla (geri kaçarak) doğrudan testisin içine yıkanır ve\nzehirli bir etki yaratır.</p></li>\n</ol>\n<h3 id=\"b-kilavuzlarin-kesi̇n-çi̇zgi̇si̇-kimi-ameliyat-edeceğiz\">B.\nKILAVUZLARIN KESİN ÇİZGİSİ: Kimi Ameliyat Edeceğiz?</h3>\n<p>Ultrason raporunda \"Grade 1 Varikosel\" yazan her hastayı ameliyat\netmek onkolojik veya androlojik bir hata değil, medikolegal bir\nkusurdur. EAU ve AUA kılavuzları, varikoselektomi kararı için şu 3\nşartın AYNI ANDA bulunmasını zorunlu tutar:</p>\n<ol type=\"1\">\n<li><p>Klinik Varikosel (Palpabl): Varikosel mutlaka fizik muayenede\n(Valsalva ile veya istirahatte) elle hissedilebilir olmalıdır.\n<em>Sadece ultrasonda görülen (Subklinik) varikoseller infertilitenin\nnedeni kabul edilmez ve ASLA ameliyat edilmez.</em></p></li>\n<li><p>Spermiyogram Bozukluğu: WHO 2021 kriterlerine göre sayı, hareket\nveya morfolojide (OAT) belgelenmiş bir anormallik veya kanıtlanmış\nyüksek DNA Fragmantasyon İndeksi olmalıdır.</p></li>\n<li><p>Açıklanamayan İnfertilite: Çift en az 1 yıldır korunmasız\nilişkiye girmesine rağmen gebelik olmamalı ve kadın partnerin üreme\npotansiyeli normal (veya düzeltilebilir) olmalıdır.</p></li>\n</ol>\n<p>İstisnai Durumlar (Kılavuz Dışı Ekstra Endikasyonlar):</p>\n<ul>\n<li><p>Adolesan (Ergen) Varikosel: Hasta bekar olsa bile, varikosel olan\ntestiste karşı tarafa göre %20'den fazla hacim kaybı (Atrofi/Hipotrofi)\nbaşlamışsa, testisi kurtarmak için proflaktik ameliyat yapılır.</p></li>\n<li><p>Ağrı: Konservatif tedavilere (dar iç çamaşırı, NSAİİ) dirençli,\nkünt ve çekilme tarzında şiddetli skrotal ağrısı olanlarda (spermiyogram\nnormal olsa bile) ağrı cerrahisi olarak yapılabilir.</p></li>\n</ul>\n<h3\nid=\"c-altin-standart-cerrahi̇-mikroskobik-subinguinal-varikoselektomi\">C.\nALTIN STANDART CERRAHİ: Mikroskobik Subinguinal Varikoselektomi</h3>\n<p>Geçmişte yüksekten (Palomo) veya inguinal seviyeden çıplak gözle\nbağlanan damarların yerini, günümüzde %1'in altında nüks ve komplikasyon\noranına sahip Mikrocerrahi almıştır.</p>\n<ol type=\"1\">\n<li><p>Kesi (İnsizyon): Dış inguinal halkanın hemen altından\n(Subinguinal) yapılır. Karın kası fasyası (eksternal oblik) kesilmediği\niçin hasta ameliyat sonrası neredeyse hiç ağrı hissetmez.</p></li>\n<li><p>Spermatik Kordun Doğurtulması: Kordon bulunur ve askıya\nalınır.</p></li>\n<li><p>Mikroskobik Diseksiyon (Zorluk Seviyesi): Operasyon mikroskobu\n(10x - 15x büyütme) altında kordonun zarları (internal ve eksternal\nspermatik fasyalar) açılır.</p></li>\n</ol>\n<ul>\n<li>Korunması Gerekenler: Vazo vazorum (Vaz deferens damarları), o\nincecik atan Testiküler Arter(ler) ve şeffaf su borularına benzeyen\nLenfatik Kanallar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Bağlanacak Olanlar: Çapı 2-3 mm'yi geçen tüm genişlemiş pampiniform\npleksus venleri (kremasterik venler dahil) titanyum kliplerle veya\nipeklerle tek tek bağlanır ve kesilir.</li>\n</ul>\n<h3 id=\"d-kabus-kompli̇kasyonlar-cerrahın-sınavı\">D. KABUS\nKOMPLİKASYONLAR (Cerrahın Sınavı)</h3>\n<ol type=\"1\">\n<li>Testiküler Arterin Kesilmesi: Mikroskop altında ven sanılıp arter\nkesilirse ne olur? Testis anında çürür (Atrofi) mü?</li>\n</ol>\n<ul>\n<li><em>Gerçek:</em> Genellikle hayır. Testisin üçlü kan desteği vardır\n(Testiküler arter, Vazal arter, Kremasterik arter). Biri kesilse bile\ndiğerleri testisi canlı tutabilir. Ancak sperm üretimi dramatik şekilde\ndüşebilir.</li>\n</ul>\n<ol type=\"1\">\n<li>Hidrosel (Su Fıtığı): Mikroskop kullanmayan cerrahların en sık\nyaptığı (%10-15) hatadır. Genişlemiş venleri bağlarken, yanındaki o\nşeffaf lenfatik kanalları da bağlarsanız, testisin lenf sıvısı boşalamaz\nve skrotumda devasa bir su kesesi birikir.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Nüks (Rekürrens): Subinguinal bölgede venler çok sayıda dal\n(kollateral) verir. Ufak bir dalın bile atlanması, aylar sonra\nvarikoselin tekrarlamasına neden olur.</li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe 60 yaşında bir amca geldi. Hayatında hiç\nvarikoseli olmamış ama son 1 ayda SAĞ testisinde aniden ortaya çıkan ve\nyatınca (supin pozisyonda) kaybolmayan (non-redükte) devasa bir\nvarikosel gelişmiş. İnfertilite açısından değerlendirir misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle hayır! İleri yaşta aniden ortaya çıkan, özellikle\nSAĞ taraflı olan veya yatınca boşalmayan varikosel, ürolojik bir acil\nalarmdır (Kırmızı Bayrak). Anatomik olarak sağ gonadal ven direkt Vena\nKava'ya dökülür. Bu tablo, aksi ispat edilene kadar sağ böbrekteki bir\nRenal Hücreli Kanser'in (RCC) tümör trombüsü ile Vena Kava'yı tıkadığını\nve venöz dönüşü engellediğini gösterir. Hastaya derhal kontrastlı Batın\nBT çektiririm.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastaya bilateral renkli Doppler USG çektik. Rapor şöyle:\n'Sol pampiniform pleksus ven çapları istirahatte 1.8 mm, Valsalva ile\n2.2 mm. Reflü (geri kaçış) izlenmedi.' Bu hastaya varikoselektomi kararı\nverir misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Vermem. Hem klinik olarak palpabl olmayan (subklinik) bir\ntablodur, hem de ultrasonografik olarak ven çapı 3 mm'nin altındadır ve\nreflü yoktur. Bu fizyolojik bir durumdur. Gereksiz bir cerrahi\nolur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Bilateral (iki taraflı) klinik varikoseli olan ve\nspermiyogramı bozuk olan hastada, sadece daha büyük olan sol tarafı\nameliyat etmek yeterli midir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU kılavuzlarına göre hayır. Varikosel sistemik ve\nbilateral etkileri olan bir hastalıktır. Eğer sağ tarafta da klinik\n(elle muayene edilebilir) bir varikosel varsa, maksimum spermatogenez\nonarımı sağlamak için her iki taraf da aynı seansta (Bilateral\nmikroskobik varikoselektomi) opere edilmelidir.\"</li>\n</ul>\n"}, {"id": "10.3", "t": "Azoospermi Sınıflaması (OA vs. NOA) ve Genetik Kodlar", "h": "<h3 id=\"a-obstrükti̇f-azoospermi̇-oa---tıkanıklık-tesisat-sorunu\">A.\nOBSTRÜKTİF AZOOSPERMİ (OA) - Tıkanıklık (Tesisat Sorunu)</h3>\n<p>Azoospermi vakalarının yaklaşık %40'ını oluşturur. Ürologların en\nsevdiği senaryodur çünkü testis (fabrika) kusursuz çalışmakta, deli gibi\nsperm üretmekte ancak bu spermler tıkalı borular yüzünden dışarı\nçıkamamaktadır.</p>\n<ul>\n<li>Klinik Tablo (Vizitin Altın Kuralı): * Testis boyutları tamamen\nnormaldir (15-20 mL).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hormonlar (FSH, LH, Testosteron) tamamen normaldir. (Sertoli\nhücreleri çalıştığı için İnhibin-B salgılanır ve FSH yükselmez).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Nedenleri:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Vazektomi: En sık edinsel (sonradan olma) nedendir.</p></li>\n<li><p>CBAVD (Doğuştan İki Taraflı Vaz Deferens Yokluğu): Muayenede\nskrotumdaki o sert kordonu (Vaz Deferens) eline getiremezsin, kanal\ndoğuştan yoktur.</p></li>\n<li><p>Enfeksiyonlar: Geçirilmiş şiddetli epididimit veya bel soğukluğu\n(Gonore/Klamidya) epididim kanallarını skar dokusuyla\ntıkamıştır.</p></li>\n<li><p>EDO (Ejakülatuar Kanal Obstrüksiyonu): Prostatın içindeki atış\nkanalları tıkalıdır. (Meni hacmi çok düşüktür, &lt; 1 mL).</p></li>\n</ol>\n<h3\nid=\"b-non-obstrükti̇f-azoospermi̇-noa---üretim-hatası-fabrika-çöküşü\">B.\nNON-OBSTRÜKTİF AZOOSPERMİ (NOA) - Üretim Hatası (Fabrika Çöküşü)</h3>\n<p>Azoospermi vakalarının %60'ını oluşturur ve tedavisi en zor olan,\nüreme tıbbının sınırlarını en çok zorlayan tablodur. Borular (kanallar)\ntamamen açıktır ancak testisin içindeki kök hücreler (Spermatogonyum) ya\nölmüştür ya da gelişimi yarıda kalmıştır (Matürasyon Arresti).</p>\n<ul>\n<li>Klinik Tablo (Sessiz Çöküş):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Testisler genellikle küçük ve atrofiktir (&lt; 12 mL).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hormon tablosunda FSH çok yüksektir. (Sertoli hücreleri hasarlı\nolduğu için İnhibin-B üretilemez, beyin sürekli testisi kırbaçlamak için\nFSH pompalar ama yanıt alamaz).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Nedenleri:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Genetik Anomaliler: (Aşağıda detaylandıracağız).</p></li>\n<li><p>İnmemiş Testis (Kriptorşidizm): Geç ameliyat edilmiş veya hiç\nindirilmemiş testislerde ısıya bağlı kök hücre ölümü.</p></li>\n<li><p>Kabakulak Orşiti: Ergenlikten sonra geçirilen kabakulak\nenfeksiyonunun testisi tahrip etmesi.</p></li>\n<li><p>Gonadotoksinler: Kanser tedavisi için alınmış kemoterapi veya\nradyoterapi.</p></li>\n</ol>\n<h3 id=\"c-geneti̇k-kodlar-ameliyat-öncesi-zorunlu-testler\">C. GENETİK\nKODLAR: Ameliyat Öncesi Zorunlu Testler</h3>\n<p>EAU ve AUA kılavuzları çok nettir: Bir NOA hastasını mikro-TESE\nameliyatına (testisi yarıp sperm aramaya) almadan önce veya bir OA\nhastasına tüp bebek (IVF/ICSI) yapmadan önce genetik haritasını çıkarmak\nZORUNLUDUR.</p>\n<h3 id=\"1-karyotip-analizi-kromozom-haritası\">1. Karyotip Analizi\n(Kromozom Haritası):</h3>\n<ul>\n<li><p>Tüm NOA hastalarından istenir. En sık karşılaşılan anomali\nKlinefelter Sendromudur (47, XXY).</p></li>\n<li><p><em>Klinik Tablo:</em> Hasta genellikle uzun boylu, uzun\nekstremiteli, jinekomastisi (meme büyümesi) olan ve testisleri fındık\nkadar (1-3 mL) ama taş gibi sert bir erkektir. Testosteronları düşüktür.\nGeçmişte bu hastalara \"Çocuğun olmaz\" denirdi. Bugün ise mikro-TESE\nameliyatı ile bu hastaların yaklaşık %50'sinde testisin derinliklerinden\ncanlı sperm bulunabilmektedir!</p></li>\n</ul>\n<h3 id=\"2-y-kromozomu-mikrodelesyonları-azf-bölgesi\">2. Y-Kromozomu\nMikrodelesyonları (AZF Bölgesi):</h3>\n<ul>\n<li><p>Karyotip normalse (46, XY) bile, Y kromozomunun uzun kolundaki (q\nkolu) o küçücük \"Azoospermi Faktörü\" (AZF) genlerinde mikroskobik\nsilinmeler (delesyonlar) olabilir. Tüm NOA hastalarından mutlaka PCR ile\nistenir.</p></li>\n<li><p>Kaderi Belirleyen Şifreler:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>AZFa veya AZFb Delesyonu: Eğer laboratuvar sonucu bu ikisinden biri\ngelirse, bistüriyi masaya bırakırsın. Bu hastalarda testisin içinde tek\nbir sperm bulma ihtimali SIFIRDIR (%0). Hastaya boş yere mikro-TESE\nameliyatı yapıp testisini parçalamazsın. Tek seçenek sperm donasyonudur\n(Türkiye'de yasal değildir) veya evlat edinmedir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>AZFc Delesyonu: En sık görülen delesyon tipidir. Bu hastalarda\nmikro-TESE ile sperm bulma şansı %50-60'tır. Ancak hasta uyarılmalıdır:\n\"Sperm bulursak ve tüp bebekle erkek çocuğun olursa, o çocuk da senin\ngibi doğuştan infertil (AZFc delesyonlu) doğacak.\"</li>\n</ul>\n<h3 id=\"3-cftr-kistik-fibrozis-gen-mutasyonu\">3. CFTR (Kistik Fibrozis)\nGen Mutasyonu:</h3>\n<ul>\n<li><p>NOA hastalarından değil, Obstrüktif Azoospermisi (CBAVD - Vaz\ndeferens yokluğu) olan hastalardan istenir.</p></li>\n<li><p>CBAVD hastalarının %80'i aslında hafif formda bir Kistik Fibrozis\ntaşıyıcısıdır (CFTR gen mutasyonu).</p></li>\n<li><p><em>Hayati Kural:</em> Bu hastanın testisinden iğneyle\n(PESA/TESA) sperm çekip tüp bebeğe gitmeden önce, KADIN PARTNERE DE\nMUTLAKA CFTR GEN TESTİ YAPILMALIDIR. Eğer kadın da sessiz bir taşıyıcı\nçıkarsa, doğacak çocuk %25 ihtimalle ölümcül, ağır Kistik Fibrozis\nhastası olur. (Embriyolara PGD - Preimplantasyon Genetik Tanı\nşarttır).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe gelen hastanın spermiyogramı Azoospermi. Muayene\nettin, testisleri 18 mL (normal boyutlarda). Kan tahliline baktın, FSH:\n3 mIU/mL (Normal). Bu hasta OA mıdır, NOA mıdır? Bıçak vurmadan bunu\nnasıl kesinleştirirsin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Fizik muayene ve normal FSH değeri, testisteki fabrikanın\nçalıştığını ve sorunun tıkanıklık (Obstrüktif Azoospermi - OA) olduğunu\nçok güçlü şekilde düşündürür. Ancak NOA vakalarının bazılarında\n(Matürasyon Arresti) FSH normal olabilir. Tanıyı %100 kesinleştirmek ve\no esnada tüp bebek için sperm elde etmek amacıyla testise iğne ile girip\nTESA (Testiküler Sperm Aspirasyonu) veya diagnostik testis biyopsisi\nyaparım. İğneye bol sperm gelirse tanı OA'dır; hiç sperm gelmezse tanı\nNOA'dır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"NOA hastası, Karyotipi: 46, XY (Normal) geldi. Y-kromozomu\nmikrodelesyon testi AZFb delesyonu pozitif geldi. Hasta 'Hocam ne kadar\nparam giderse gitsin, o ameliyatı (mikro-TESE) olmak istiyorum' diyor.\nKabul eder misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle kabul etmem. AZFa veya AZFb delesyonu varlığı,\nmikroskobik anatomi düzeyinde spermatogenezin hiç başlamadığı\n(Sertoli-cell only sendromu) anlamına gelir. Mikro-TESE bu hastalarda\nEAU/AUA kılavuzlarına göre kontrendikedir. Hem hastaya gereksiz anestezi\nve cerrahi travma (testis hasarı/testosteron kaybı) yaşatmış oluruz, hem\nde ciddi bir etik ve malpraktis suçu işlemiş oluruz.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Klinefelter (47, XXY) sendromlu bir hastayı mikro-TESE\nameliyatına hazırlıyoruz. Testosteron seviyesi 200 ng/dL (Düşük).\nAmeliyat başarısını artırmak için pre-operatif ne yapmalısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Klinefelter hastalarında testosteron genellikle düşüktür\n(Hipogonadizm). Mikro-TESE'de sperm bulma şansını maksimize etmek için,\nameliyattan 3-6 ay önce hastaya Aromataz İnhibitörleri (Anastrozol) veya\nhCG/Klomifen tedavisi başlayarak testisin içindeki (intratestiküler)\ntestosteron seviyesini suni olarak yükseltmek EAU kılavuzlarında\nönerilen en güçlü medikal optimizasyon stratejisidir.\"</li>\n</ul>\n"}, {"id": "10.4", "t": "Cerrahi Sperm Elde Etme Yöntemleri ve Mikro-TESE", "h": "<h3\nid=\"a-obstrükti̇f-azoospermi̇-oa-yöntemleri̇-depo-dolu-borular-tıkalı\">A.\nOBSTRÜKTİF AZOOSPERMİ (OA) YÖNTEMLERİ: Depo Dolu, Borular Tıkalı</h3>\n<p>Eğer hastanın testis boyutları normalse, FSH seviyesi normalse ve\ntanı OA ise, işimiz çok kolaydır. Testisin içi zaten sperm\nkaynamaktadır, sadece dışarı çıkamıyorlardır. Bu yüzden testisi\nyarmamıza (açık ameliyata) gerek yoktur; sadece depolama alanlarına\niğneyle girmemiz yeterlidir.</p>\n<h3 id=\"1-pesa-perkütan-epididimal-sperm-aspirasyonu\">1. PESA (Perkütan\nEpididimal Sperm Aspirasyonu):</h3>\n<ul>\n<li>Lokal anestezi altında, ince bir iğne (kelebek uç) ile doğrudan\nskrotumdan girilerek epididimin (spermin olgunlaştığı ve depolandığı\nvirgül şeklindeki organ) içine girilir ve sıvı çekilir. Körlemesine bir\nişlemdir ama OA vakalarında genellikle tek seferde milyonlarca sperm\nelde edilir.</li>\n</ul>\n<h3 id=\"1-mesa-mikrocerrahi-epididimal-sperm-aspirasyonu\">1. MESA\n(Mikrocerrahi Epididimal Sperm Aspirasyonu):</h3>\n<ul>\n<li>Skrotum açılır, mikroskop altında epididim tübülleri tek tek\nbulunur, en dolgun olanı bistüri ucuyla çizilir ve içinden sızan sperm\ndolu sıvı özel bir cam pipetle toplanır. <em>En temiz, kanamasız ve en\nyüksek sayıda spermin elde edildiği, dondurmaya (kriyoprezervasyon) en\nuygun yöntemdir.</em></li>\n</ul>\n<h3 id=\"1-tesa-testiküler-sperm-aspirasyonu\">1. TESA (Testiküler Sperm\nAspirasyonu):</h3>\n<ul>\n<li>Epididimde sperm bulunamazsa, kalın bir biyopsi iğnesiyle doğrudan\ntestisin içine girilip vakumla doku parçaları çekilir (Körleme iğne\nbiyopsisi).</li>\n</ul>\n<h3 id=\"b-non-obstrükti̇f-azoospermi̇-noa-ve-altin-standart-mi̇kro-tese\">B.\nNON-OBSTRÜKTİF AZOOSPERMİ (NOA) VE ALTIN STANDART: MİKRO-TESE</h3>\n<p>Eğer hastanın testisleri küçük, FSH'ı çok yüksek ve üretim çökmüşse\n(NOA); PESA, MESA veya TESA yapmak onkolojik ve androlojik bir hatadır.\nKörlemesine batırılan iğneler, çölde vaha aramaya benzer; %99 ihtimalle\nboş çıkar.</p>\n<p>Bu hastalarda testisin içinde spermatogenez tamamen durmamış\nolabilir; bazı bölgeler tamamen ölüyken (Sertoli-cell only), başka bir\nköşede tek bir tübülün içinde üretim devam ediyor olabilir (Fokal\nSpermatogenez). Bu iğne başı kadar adacıkları bulmanın tek yolu\nMikro-TESE (Mikroskobik Testiküler Sperm Ekstraksiyonu)\nameliyatıdır.</p>\n<p>Cerrahi Anatomi ve Av Başlıyor:</p>\n<ol type=\"1\">\n<li><p>Ekvatoral İnsizyon: Skrotum açılır, testis dışarı doğurtulur.\nTestisi saran o taş gibi sert kılıf (Tunika Albuginea), testisin tam\nortasından, kan damarlarına paralel olacak şekilde \"ekvatoral\" bir\ninsizyonla ikiye ayrılır. Testisin içi (Süngerimsi Tubuli Seminiferi\nyumağı) bir kitap gibi tamamen açılır.</p></li>\n<li><p>Optik Büyütme: Ameliyat mikroskobu en yüksek büyütmeye (20x -\n24x) alınır. Cerrah, binlerce ince tübülün arasında bir farklılık\narar.</p></li>\n</ol>\n<h3 id=\"3-hangi-tübülü-keseceğiz-vizitin-kalbi\">3. Hangi Tübülü\nKeseceğiz? (Vizitin Kalbi):</h3>\n<ul>\n<li>Ölü Tübüller: İncecik, iplik gibi, çökmüş (kollabe) ve içi cam gibi\nşeffaftır. Bunların içi boştur, sadece Sertoli hücresi vardır. Bunları\nkesip embriyoloğa göndermek vakit kaybıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Canlı Tübüller (Hedef): Etrafındaki ölü tübüllerin aksine, bu\ntübüller dolgun, genişlemiş (dilate) ve opak/beyazımsı bir renktedir.\nİşte o beyazlığın sebebi, içinde olgunlaşmakta olan sperm hücrelerinin\nyığılmasıdır. Cerrah mikro-makasla sadece bu dolgun tübülleri\n(milimetrik boyutta) keser ve petri kabındaki embriyoloğa uzatır.</li>\n</ul>\n<h3 id=\"c-embri̇yoloji̇-i̇le-koordi̇nasyon-ve-kabus-senaryo\">C. EMBRİYOLOJİ\nİLE KOORDİNASYON VE KABUS SENARYO</h3>\n<p>Embriyolog dokuyu alır, özel solüsyonlarda parçalar ve mikroskopta\ncanlı, hareketli (veya kuyruğu kıvrılan) tek bir sperm arar.</p>\n<ul>\n<li><p>Eğer embriyolog \"Sperm buldum!\" derse, o sperm ICSI\n(Mikroenjeksiyon) yöntemiyle doğrudan yumurtanın içine enjekte edilir.\nAmeliyat başarıyla sonlandırılır.</p></li>\n<li><p>Eğer embriyolog \"Sıfır, hiçbir şey yok\" derse, cerrah testisin\nüst polüne, alt polüne ve derinliklerine bakmaya devam eder. Bir\ntestiste bulunamazsa, diğer testise (karşı tarafa) geçilir.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe NOA hastası geldi. Dış merkezde 6 ay önce TESA\n(İğneyle sperm arama) yapılmış ve sonuç 'Sıfır (Azoospermi)' gelmiş.\nHasta sana tüp bebek şansının kalıp kalmadığını soruyor. Ne\ndersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hastaya şansının kesinlikle devam ettiğini söylerim. EAU\nkılavuzlarına göre NOA hastalarında körlemesine yapılan TESA'nın tanısal\nveya tedavi edici hiçbir değeri yoktur. Kör iğne o milimetrik sperm\nadacıklarını ıskalamış olabilir. TESA'da sperm bulunamayan NOA\nhastalarına deneyimli bir cerrah tarafından Mikro-TESE yapıldığında,\nyaklaşık %40-50 oranında canlı sperm bulunabilmektedir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Mikro-TESE ameliyatındasın. İki testisi de milimetre\nmilimetre taradın, en az 2 saat mikroskopta baktın ama embriyolog\n'Sıfır, hiçbir şey yok' dedi. Ameliyatı bitirip testisi kapatmadan önce\nyapman gereken son onkolojik/patolojik görev nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ameliyatı sonlandırmadan önce, her iki testisten de\nmilimetrik bir doku örneği alıp formol solüsyonuna koyarak Patolojiye\n(Histopatolojik incelemeye) göndermek zorundayım. Çünkü embriyolog\nsadece canlı hücre arar, dokunun hücresel mimarisini bilmez. Patoloji\nraporu bize o fabrikada ne olduğunu (Sertoli-cell only sendromu mu,\nMatürasyon Arresti mi yoksa Hipospermatogenez mi) kesin olarak\nsöyleyecektir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta mikro-TESE ameliyatından uyandı. Aklındaki en büyük\nkorku olan 'Acaba erkekliğim biter mi, testosteronum düşer mi?' sorusunu\nsoruyor. Gerçekten böyle bir risk var mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Evet, bu çok gerçek bir risktir ve ameliyat öncesi onamda\nmutlaka belirtilmelidir. Testisi açıp içinden tübül topladığımızda, o\ntübüllerin etrafındaki bağ dokusunda bulunan ve Testosteron üreten\nLeydig hücrelerini de istemeden uzaklaştırmış (veya damarlarına zarar\nvermiş) oluruz. Ameliyattan sonraki ilk 6 ayda hastaların çoğunda\ntestosteron seviyeleri düşer (Hipogonadizm). Çoğunlukla 12-18 ay içinde\ntoparlasa da, yaşlı veya Klinefelter sendromlu hastalarda bu düşüş\nkalıcı olabilir ve ömür boyu Testosteron Replasman Tedavisi (TRT)\ngerekebilir.\"</li>\n</ul>\n"}, {"id": "10.5", "t": "Ejakülatuar Kanal Obstrüksiyonu (EDO) ve Hipogonadotropik Hipogonadizm", "h": "<h3 id=\"a-ejakülatuar-kanal-obstrüksi̇yonu-edo-çıkıştaki-barikat\">A.\nEJAKÜLATUAR KANAL OBSTRÜKSİYONU (EDO): Çıkıştaki Barikat</h3>\n<p>Üreme yollarının en son durağı, vas deferens ile seminal veziküllerin\nbirleşip prostatın içinden (Verumontanum'dan) idrar kanalına döküldüğü\n\"Ejakülatuar Kanallar\"dır. Eğer bu kanallar doğuştan bir kist (Müllerian\nKist) veya geçirilmiş bir enfeksiyonla tıkanırsa, testis ne kadar sperm\nüretirse üretsin dışarı çıkamaz.</p>\n<p>Klinik Dedektiflik (Spermiyogram Şifreleri):</p>\n<p>Meni (ejakülat) hacminin yaklaşık %70-80'i Seminal Veziküllerden\ngelir. Bu sıvı alkalidir (bazik) ve spermin enerjisini sağlayan Fruktoz\niçerir.</p>\n<ul>\n<li><p>Eğer kanallar tıkalıysa (EDO varsa), seminal vezikül sıvısı\ndışarı akamaz.</p></li>\n<li><p>Sonuç: Spermiyogramda hacim çok düşüktür (&lt; 1.5 mL, genelde\n&lt; 0.5 mL). Sıvının tamamı sadece prostat salgısından oluştuğu için pH\nasidiktir (&lt; 7.2) ve Fruktoz NEGATİFTİR. Testis boyutları ve\nhormonlar (FSH, Testosteron) tamamen normaldir. Skrotumda her iki vaz\ndeferens elle hissedilir.</p></li>\n</ul>\n<p>Tanının Altın Standardı: TRUS (Transrektal Ultrasonografi)</p>\n<p>Hastaya TRUS yapıldığında prostatın hemen arkasında şişmiş, devasa\nboyutlara ulaşmış (genişliği &gt; 1.5 cm) Seminal Veziküller veya tam\norta hatta kanalları ezen büyük bir prostatik kist görülür.</p>\n<h3\nid=\"b-muci̇zevi̇-cerrahi̇-tured-transüretral-ejakülatuar-kanal-rezeksiyonu\">B.\nMUCİZEVİ CERRAHİ: TURED (Transüretral Ejakülatuar Kanal\nRezeksiyonu)</h3>\n<p>Tıpkı BPH ameliyatı (TUR-P) yapar gibi, endoskopla (rezektoskop)\nidrar kanalından girilir. Prostatın içindeki Verumontanum (kanalların\naçıldığı tepecik) bulunur.</p>\n<ul>\n<li><p>Cerrah, elektrikli koter (loop) ile verumontanumun hemen\nüzerinden milimetrik kesiler (rezeksiyon) yapmaya başlar.</p></li>\n<li><p>Kisti veya tıkalı kanalların tavanını kestiği an, içeride\nbasınçla hapsolmuş olan o süt beyazı \"sperm dolu\" seminal sıvı aniden\nidrar kanalına fışkırır.</p></li>\n<li><p><em>Kabus Komplikasyon:</em> Eğer cerrah çok derin keserse, idrar\nyaparken basınçlı idrar doğrudan seminal veziküllere (geriye) kaçar ve\nhastada tekrarlayan, şiddetli Kimyasal Epididimit veya Sulu Meni (Watery\nejaculate) tablosu gelişir.</p></li>\n</ul>\n<h3 id=\"c-hi̇pogonadotropi̇k-hi̇pogonadi̇zm-uyuyan-testisi-uyandırmak\">C.\nHİPOGONADOTROPİK HİPOGONADİZM: Uyuyan Testisi Uyandırmak</h3>\n<p>Azoosperminin medikal olarak (ameliyatsız) %100 tedavi edilebildiği\n<em>tek</em> mutlak tablodur.</p>\n<p>Sorun testiste değildir. Sorun, beynin (Hipotalamus veya Hipofizin)\nGnRH, FSH ve LH üretimini durdurmasıdır. En meşhur örneği, koku alma\nduyusunun da kaybolduğu Kallmann Sendromu'dur.</p>\n<ul>\n<li><p>Klinik Tablo: Hastanın testisleri fındık kadar küçük ve\nyumuşaktır (Pre-pubertal). Testosteron yerlerde sürünür, FSH ve LH ise\nneredeyse \"0\"dır. Hasta ergenliğe tam girememiştir (sakal/kıllanma\nazdır).</p></li>\n<li><p>Tedavi Stratejisi (Fabrikayı Yeniden Kurmak):</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Önce hCG (İnsan Koryonik Gonadotropini) iğneleri başlanır. Bu\nLH'ı taklit eder ve testisteki Leydig hücrelerini uyandırarak\nİntratestiküler Testosteron seviyesini devasa oranlarda artırır. (Bu\naşama 3-6 ay sürer).</p></li>\n<li><p>Testosteron fabrikası çalıştıktan sonra, ek olarak rFSH veya hMG\niğneleri tedaviye eklenir. Bu da Sertoli hücrelerini uyarır ve\nspermatogenezi (sperm üretimini) başlatır.</p></li>\n<li><p><em>Sonuç:</em> Yaklaşık 12-24 aylık iğne tedavisi sonucunda,\nsıfır spermle gelen hastanın ejakülatında milyonlarca sperm çıkmaya\nbaşlar ve doğal yolla gebelik elde edilir! TESE yapmaya asla gerek\nyoktur.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe gelen hastanın spermiyogramı: Azoospermi, Hacim:\n0.3 mL, pH: 6.5, Fruktoz negatif. Bu hastanın muayenesinde skrotumda Vaz\nDeferens'leri eline gelmiyor (hissedemiyorsun). Bu hastaya TURED\nameliyatı (EDO cerrahisi) yapar mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle yapmam. Çünkü bu tablo EDO değil, CBAVD (Doğuştan\nİki Taraflı Vaz Deferens Yokluğu) tablosudur. Seminal veziküller de vaz\ndeferens ile aynı embriyolojik kökenden (Wolff kanalı) geliştiği için\nCBAVD hastalarında seminal veziküller de doğuştan gelişmemiştir. Hacmin\ndüşük ve asidik olmasının sebebi budur. Ortada açılacak tıkalı bir kanal\nyoktur; doğrudan Kistik Fibrozis (CFTR) mutasyon testi istenir ve\nPESA/MESA ile tüp bebeğe (IVF/ICSI) geçilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hipogonadotropik Hipogonadizm (Kallmann) hastasına sperm\nüretimi için sadece dışarıdan Testosteron (Nebido/Sustanon) iğnesi\nvursak olmaz mı? Neden pahalı hCG iğneleri kullanıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Dışarıdan verilen (eksojen) testosteron, kanda ne kadar\nyüksek olursa olsun testis dokusunun (Sertoli hücrelerinin) içine\nyeterince geçemez. Spermatogenez için testisin kendi içinde\n(intratestiküler) testosteron üretmesi şarttır, ki bu da kandakinden\nyaklaşık 100 kat daha yoğundur. Bunu sağlayabilen tek şey LH'ı taklit\neden hCG iğneleridir. Eksojen testosteron sperm üretimini başlatmaz,\naksine varsa onu da baskılar.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"TURED ameliyatı sonrası hastanın menisinde spermler çıkmaya\nbaşladı ama spermlerin hiçbiri hareket etmiyor (Astenozoospermi) veya\nölü. Bunun EDO ile ilişkisi nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ejakülatuar kanallar yıllarca tıkalı kaldığında, epididim ve\ntestis içinde devasa bir geri basınç (hidrostatik basınç) birikir. Bu\nyüksek basınç yıllar içinde testisteki ince tübüllere ve epididimin\nfonksiyonuna zarar verir. Boruları açsak (TURED yapsak) bile, o basıncın\nyarattığı kalıcı hasardandan dolayı çıkan spermlerin kalitesi ve\nhareketliliği genellikle düşük kalabilir.\"</li>\n</ul>\n"}]}, {"n": 11, "t": "Nöroüroloji ve Fonksiyonel Üroloji", "s": [{"id": "11.1", "t": "Alt Üriner Sistem Fizyolojisi ve Nöroanatomisi", "h": "<h3 id=\"a-merkezi̇-komuta-frontal-lob-ve-ponsun-anahtarı\">A. MERKEZİ\nKOMUTA: Frontal Lob ve Pons'un Anahtarı</h3>\n<p>Mesane, vücutta hem otonom (istemsiz) hem de somatik (istemli)\nkontrol altında çalışan tek visseral organdır. Bu kusursuz uyum beyinde\nbaşlar:</p>\n<p>Frontal Korteks (Bilinçli Fren): İşemenin sosyal olarak uygun olup\nolmadığına karar veren \"Ahlak ve Mantık\" merkezidir. Mesane dolsa bile,\ntuvalet bulana kadar sürekli olarak alt merkezlere \"Dur, kasılma\n(İnhibisyon)\" sinyali gönderir. (Beyin kanaması veya Alzheimer\ngeçirenlerde bu fren koptuğu için idrar kaçırma başlar).</p>\n<p>Pontin İşeme Merkezi (PMC - Barrington Nükleusu): Beyin sapında\n(Pons) yer alan asıl \"Şalter\" (Switch) burasıdır. Frontal lob \"İşeme\nvakti geldi\" onayını verdiğinde, PMC şalteri indirir. İki şeyi aynı anda\nve kusursuz bir sırayla yapar:</p>\n<p>Önce aşağıdaki kapıyı (Sfinkteri) gevşetir.</p>\n<p>Saniyeler sonra motoru (Detrüsörü) kasar. (Bu ikisinin uyumuna\n<em>Sinerji</em> denir).</p>\n<h3 id=\"b-spi̇nal-otoban-üç-ana-sinir-ve-reseptörleri\">B. SPİNAL OTOBAN:\nÜç Ana Sinir ve Reseptörleri</h3>\n<p>Beyin sapından çıkan emirler omurilikten aşağı iner ve leğen\nkemiğinin (pelvisin) derinliklerinde mesaneye üç farklı kabloyla\n(sinirle) bağlanır. Bu üç siniri ve hedefledikleri reseptörleri adın\ngibi bilmelisin, çünkü poliklinikte yazacağın tüm ilaçlar\n(Antikolinerjikler, Beta-3 agonistler, Alfa-blokerler) bu reseptörleri\nvurur.</p>\n<h3 id=\"1-sempatik-sinir-sistemi-savaş-veya-kaç---depola\">1. Sempatik\nSinir Sistemi (Savaş veya Kaç - \"Depola!\")</h3>\n<p>Köken: Omuriliğin T10-L2 seviyelerinden çıkar.</p>\n<p>Sinir: Hipogastrik Sinir.</p>\n<p>Görev: İdrarı içeride tutmak (Depolama fazı).</p>\n<p>Reseptörler: * Mesane kubbesindeki (Gövde) Beta-3 reseptörlerine\nbağlanıp mesane kasını (detrüsörü) GEVŞETİR (Hacmi büyütür).</p>\n<p>Mesane boynundaki ve iç sfinkterdeki Alfa-1 reseptörlerine bağlanıp\nkapıyı sımsıkı KASAR.</p>\n<h3 id=\"2-parasempatik-sinir-sistemi-dinlen-ve-sindir---boşalt\">2.\nParasempatik Sinir Sistemi (Dinlen ve Sindir - \"Boşalt!\")</h3>\n<p>Köken: Omuriliğin Sakral S2-S4 seviyelerinden çıkar.</p>\n<p>Sinir: Pelvik Sinir.</p>\n<p>Görev: İdrarı dışarı atmak (İşeme fazı).</p>\n<p>Reseptörler: Mesane kasındaki Muskarinik (M2 ve en önemlisi M3)\nreseptörlerine Asetilkolin ile bağlanır ve detrüsörü şiddetle KASAR.\n(Antikolinerjik ilaçlar işte bu M3'ü bloke ederek kasılmayı\ndurdurur).</p>\n<h3 id=\"3-somatik-sinir-sistemi-benim-i̇radem\">3. Somatik Sinir Sistemi\n(\"Benim İradem!\")</h3>\n<p>Köken: Onuf Nükleusu (Omuriliğin S2-S4 seviyesi).</p>\n<p>Sinir: Pudendal Sinir.</p>\n<p>Görev: Pelvik taban kaslarını ve Dış (Eksternal) Çizgili Sfinkteri\nkontrol eder. Hapşırdığında, öksürdüğünde idrar kaçırmamak için kendi\niradenle kastığın o kasların siniridir.</p>\n<h3 id=\"c-depolama-ve-i̇şeme-fazlarinin-mekani̇ği̇\">C. DEPOLAMA VE İŞEME\nFAZLARININ MEKANİĞİ</h3>\n<p>Depolama (Storage) Fazı:</p>\n<p>Mesane yavaş yavaş dolarken basınç artmaz (Kompliyans). Gerilme\nreseptörleri omuriliğe sinyal gönderir. Omurilik, sempatik sistemi\n(Hipogastrik sinir) aktive eder. Mesane gevşer, mesane boynu kapanır.\nAynı zamanda pudendal sinir dış sfinkteri kasılı tutar. Parasempatik\nsistem (M3) tamamen susturulmuştur.</p>\n<p>İşeme (Voiding) Fazı:</p>\n<p>Kapasite dolduğunda (yaklaşık 400-500 cc), gerilme sinyalleri\nPons'taki PMC'ye ulaşır. Frontal lob \"Sosyal ortam uygun\" derse, PMC\nşalteri kapatır:</p>\n<p>Sempatik sistem (Hipogastrik) SUSAR. Mesane boynu (Alfa-1)\ngevşer.</p>\n<p>Pudendal sinir SUSAR. Dış sfinkter tamamen gevşer.</p>\n<p>Parasempatik sistem (Pelvik sinir) ATEŞLENİR. Asetilkolin salgılanır,\nM3 reseptörleri uyarılır ve detrüsör şiddetle kasılarak idrarı dışarı\nfırlatır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe inme (Serebrovasküler Olay - İnme/Stroke) geçirmiş\n65 yaşında bir hasta geldi. Hasta aniden idrara sıkıştığını hissediyor\nve tuvalete yetişemeden kaçırıyor (Urge İnkontinans). Bu hastada\nbeyindeki hangi anatomik bölge hasar görmüştür ve mesane fizyolojisi\nnasıl etkilenmiştir?\"</p>\n<p>Cevap: \"İnme (Stroke) gibi suprapontin (Pons'un üzerindeki)\nlezyonlarda, frontal korteksin o meşhur 'Baskılayıcı (İnhibitör)' etkisi\nortadan kalkar. Pontin İşeme Merkezi (PMC) üzerindeki fren koptuğu için,\nmesane azıcık dolsa bile PMC kendi kendine ateşlenir. Sfinkter ve\ndetrüsör uyumu bozulmamıştır (Sinerji vardır), ancak mesane sürekli ve\nistemsiz olarak kasılır. Bu duruma Aşırı Aktif Detrüsör (Detrusor\nOveractivity - DO) denir.\"</p>\n<p>Soru: \"Bir hastaya prostat büyümesi (BPH) nedeniyle Alfa-Bloker\n(Tamsulosin) verdin, idrarı rahatladı. Başka bir hastaya ise Aşırı Aktif\nMesanesi olduğu için Beta-3 Agonisti (Mirabegron/Betmiga) verdin,\nsıkışmaları geçti. Bu iki ilacın hedef aldığı reseptörler nerede bulunur\nve farmakolojik etkileri mesane dinamiğini nasıl değiştirir?\"</p>\n<p>Cevap: \"Tamsulosin (Alfa-bloker), mesane boynunda ve prostatın düz\nkaslarında yoğunlaşan Alfa-1 reseptörlerini bloke eder. Bu kapıyı\n(çıkışı) gevşeterek obstrüksiyonu (tıkanıklığı) ortadan kaldırır.\nMirabegron (Beta-3 agonisti) ise mesane kubbesindeki (gövdedeki) Beta-3\nreseptörlerini uyarır (aktive eder). Uyarılan Beta-3, detrüsör kasını\ngevşetir, mesanenin kapasitesini artırır ve istemsiz kasılmaları\nbaskılar. Biri kapıyı açar, diğeri depoyu genişletir.\"</p>\n<p>Soru: \"Trafik kazası geçirmiş ve beli L1-L2 seviyesinden kırılmış\n(Spinal Şok dönemini atlatmış) paraplejik bir genç acile geldi. İdrarını\nhiç yapamıyor, mesanesi göbeğine kadar şişmiş (Glob vezikale) ama hiç\nağrısı yok. Çizgili dış sfinkteri ve pelvik tabanı tamamen felç (flask).\nBu lezyon hangi otonomik merkezi tahrip etmiştir?\"</p>\n<p>Cevap: \"L1 altı ve özellikle Sakral (S2-S4) bölgeyi (veya Kauda\nEkina'yı) etkileyen travmalar, Alt Motor Nöron Lezyonu yaratır.\nParasempatik uyarı (Pelvik sinir) ve somatik uyarı (Pudendal sinir)\nkökünden kesilmiştir. Detrüsör motoru tamamen bozulmuştur\n(Arefleksik/Atonik mesane). Mesane kasılamaz, devasa boyutlara esner\nancak hasta hissetmez. Sfinkter de felç olduğu için kapasite dolunca\nidrar taşarak (Taşma İnkontinansı) sızar.\"</p>\n"}, {"id": "11.2", "t": "Ürodinami Endikasyonları, Fiziği ve Yorumlanması", "h": "<h3 id=\"a-fi̇zi̇ği̇n-temel-kurali-pdet-formülü-gerçek-suçluyu-bulmak\">A.\nFİZİĞİN TEMEL KURALI: Pdet Formülü (Gerçek Suçluyu Bulmak)</h3>\n<p>Ürodinaminin bütün felsefesi tek bir matematiksel denkleme dayanır.\nBizim asıl bilmek istediğimiz şey, mesane kasının (Detrüsör) kendi\nkendine ne kadar basınç ürettiğidir. Ancak mesanenin içine koyduğumuz\nkateter, detrüsörün basıncını <em>doğrudan</em> ölçemez; o kateter karın\niçindeki tüm organların mesaneye yaptığı baskıyı da ölçer.</p>\n<p>İşte bu yüzden denklemi çözmek için iki farklı ölçüm noktası\nkullanırız:</p>\n<p>Pves (Vezikal Basınç): Mesanenin içindeki toplam basınçtır (Kateter\n1).</p>\n<p>Pabd (Abdominal Basınç): Karın içi basıncıdır. Bunu ölçmek için\nhastanın rektumuna (makatına) veya vajinasına ikinci bir kateter\n(Kateter 2) yerleştiririz.</p>\n<p>Altın Formül:</p>\n<p>\\P_{det} (Detrüsör Basıncı) = P_{ves} - P_{abd}</p>\n<p><em>Neden bu kadar önemli?</em> Hasta test sırasında öksürdüğünde,\nıkındığında veya güldüğünde karın içi basıncı (Pabd) aniden fırlar.\nDoğal olarak mesane içi basınç (Pves) da fırlar. Eğer bilgisayar bu\nikisini birbirinden çıkarmazsa, sen o basınç sıçramasını mesanenin\nkasılması (Aşırı Aktif Mesane) sanırsın. Gerçek bir detrüsör\nkasılmasında Pabd sabit kalırken, sadece Pves (ve dolayısıyla Pdet)\nyükselir.</p>\n<h3 id=\"b-ki̇mlere-çeki̇li̇r-eau-2026-endikasyonları\">B. KİMLERE ÇEKİLİR?\n(EAU 2026 Endikasyonları)</h3>\n<p>Her idrar kaçıran veya prostatı büyüyen hastaya ürodinami YAPILMAZ.\nÜrodinami invazivdir, enfeksiyon riski taşır ve pahalıdır. Kılavuzlar\nnet çizgiler çizer:</p>\n<p>Zorunlu (Mutlak) Endikasyonlar: Nörolojik hastalığı olanlar (Spina\nbifida, MS, Parkinson, Spinal Kord Yaralanması). Böbrekleri korumak için\nbasınçları bilmek şarttır.</p>\n<p>Komplike Olgular: Daha önce prostat veya idrar kaçırma (Sling)\nameliyatı olmuş ama şikayetleri geçmemiş (başarısız cerrahi)\nhastalar.</p>\n<p>Karışık (Miks) İnkontinans: Hasta hem öksürünce (Stres) hem de aniden\nsıkışınca (Urge) kaçırıyorsa, hangi tipin daha baskın olduğunu\ncerrahiden önce kanıtlamak için.</p>\n<p>Ameliyat Kararı Öncesi Şüphe: BPH (Prostat büyümesi) düşünülen ancak\nnörolojik şüphesi olan (Örn: Diyabetik nöropatisi olan) yaşlı bir\nerkekte, \"Acaba mesane kası mı zayıf (Atonik), yoksa prostat mı tıkalı?\"\nsorusunu ayırmak için.</p>\n<h3 id=\"c-grafi̇ği̇n-i̇ki̇-yüzü-dolum-ve-i̇şeme-fazları\">C. GRAFİĞİN İKİ\nYÜZÜ: Dolum ve İşeme Fazları</h3>\n<p>Ürodinami testi iki ana aşamadan oluşur:</p>\n<h3 id=\"1-sistometri-dolum-fazı-mesanenin-depo-kapasitesi\">1. Sistometri\n(Dolum Fazı): Mesanenin Depo Kapasitesi</h3>\n<p>İçeriye 10-20 ml/dk hızla vücut ısısında serum fizyolojik basılır.\nİki şeye bakılır:</p>\n<p>Kompliyans (Esneklik): Normal bir mesane, hacmi (V) artsa bile\nbasıncını (P) düşük tutar (Δ V / Δ P). Eğer mesane dolarken Pdet yavaş\nyavaş ve sürekli artıyorsa, bu mesane betonlaşmıştır (Düşük Kompliyans)\nve böbrekleri tehlikeye atar.</p>\n<p>Aşırı Aktif Detrüsör (DO): Dolum sırasında hastanın isteği dışında\nPdet eğrisinde aniden oluşan tepe (dalga) şeklindeki kasılmalardır.\n(Nörolojikse buna <em>Nörojenik DO</em>, sebep yoksa <em>İdiyopatik\nDO</em> denir).</p>\n<h3 id=\"2-basınç-akım-çalışması-i̇şeme-fazı-tıkanıklığın-i̇spatı\">2.\nBasınç-Akım Çalışması (İşeme Fazı): Tıkanıklığın İspatı</h3>\n<p>Mesane dolduğunda hastadan cihazın üzerindeyken işemesi istenir. Bu\nsırada idrarın akım hızı (Qmax) ve o anki mesane basıncı (\\P_{det.Qmax})\nölçülür.</p>\n<p>İşte ürolojinin en büyük teşhis matrisi:</p>\n<p>Yüksek Basınç + Düşük Akım (High P, Low Q): Motor (Mesane) var\ngücüyle kasılıyor (Pdet &gt; 60-80 cmH2O) ama idrar ip gibi incecik\nçıkıyor (Qmax &lt; 10 ml/sn). <em>Teşhis:</em> Mesane Çıkım Tıkanıklığı\n(BOO - Prostat büyümesi veya Üretra darlığı). Bu hasta ameliyattan %100\nfayda görür.</p>\n<p>Düşük Basınç + Düşük Akım (Low P, Low Q): İdrar yine ip gibi çıkıyor,\nancak bu kez motor (Mesane) hiç kasılamıyor (Pdet &lt; 20 cmH2O).\n<em>Teşhis:</em> Detrüsör Az Aktivesi (Underactivity / Atonik Mesane).\nBu hastanın prostatını KESEMEZSİN. Sorun yolda değil, motordadır.\nAmeliyat edersen hasta ömür boyu idrar kaçırır.</p>\n<h3 id=\"d-ics-nomogrami-booi-formülü\">D. ICS NOMOGRAMI (BOOI\nFORMÜLÜ)</h3>\n<p>Prostatı olan bir hastada tıkanıklığı (Obstrüksiyonu) objektif bir\nsayıya dökmek için Uluslararası Kontinans Birliği'nin (ICS) Bladder\nOutlet Obstruction Index (BOOI) formülü kullanılır:</p>\n<p>\\BOOI = P_{det.Qmax} - (2 × Q_{max})</p>\n<p>BOOI &gt; 40: Kesin tıkanıklık (Obstrükte). Cerrahiye (TUR-P / HoLEP)\ngidin.</p>\n<p>BOOI &lt; 20: Tıkanıklık YOK. (Şikayetler aşırı aktif mesane veya\nzayıf kastan kaynaklıdır).</p>\n<p>20 - 40 Arası: Şüpheli bölge (Equivocal). Klinik tecrübe devreye\ngirer.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Ürodinami çekiyorsun. Dolum fazındayken (Sistometri) ekrandaki\nPves (Vezikal Basınç) çizgisinde aniden çok keskin, sivri ve yüksek bir\ndalgalanma (spike) gördün. Asistan 'Hocam hastada Aşırı Aktif Detrüsör\n(DO) var!' dedi. Oysa o dalganın mesane kasılması Mİ yoksa bir artefakt\n(hareket/öksürük) MI olduğunu anlamak için saniyeler içinde grafiğin\nneresine bakmalısın?\"</p>\n<p>Cevap: \"Derhal Pabd (Abdominal Basınç) ve Pdet (Detrüsör Basıncı)\nçizgilerine bakmalıyım. Eğer Pves'teki sıçramayla TAM AYNI ANDA ve aynı\nboyutta Pabd çizgisinde de bir sıçrama varsa ve en alttaki Pdet çizgisi\ndümdüz devam ediyorsa; bu kesinlikle bir detrüsör kasılması değildir.\nHasta o an öksürmüş, ıkınmış veya masada hareket etmiştir (Artefakt).\nAsıl tanı koydurucu olan, Pabd sabitken sadece Pves'in yükselmesiyle\noluşan gerçek Pdet (Detrüsör) dalgalarıdır.\"</p>\n<p>Soru: \"Stres Tipi İdrar Kaçırması (SUI) olan bir kadın hastaya\nürodinami yapıyorsun. Hastaya öksürmesini söyledin ve idrar kaçırdı. O\nkaçırma anındaki en düşük karın içi basınca ALPP (Abdominal Leak Point\nPressure) denir. ALPP'nin 60 cmH2O'nun altında olması ile 90 cmH2O'nun\nüzerinde olması sana cerrahi strateji açısından neyi ifade eder?\"</p>\n<p>Cevap: \"ALPP, sfinkterin (kapının) gücünü gösterir. Eğer ALPP &lt; 60\ncmH2O ise, sfinkter kendi kendine laçkalaşmış ve iflas etmiş demektir\n(İç Sfinkter Yetmezliği - ISD). Bu çok ağır bir kaçırmadır ve klasik TOT\n(Transobturator Tape) ameliyatı genellikle başarısız olur; retropubik\nTVT, fasyal sling veya periüretral enjeksiyon gerekir. Eğer ALPP &gt; 90\ncmH2O ise, sfinkter sağlamdır ama anatomik desteğini kaybetmiştir\n(Üretral Hipermobilite). Bu hastalarda standart mid-üretral sling (TOT)\nameliyatlarının başarı şansı %90'ın üzerindedir.\"</p>\n<p>Soru: \"Ürodinami işeme fazında (Basınç-Akım çalışması) Pdet.Qmax 50\ncmH2O, Qmax (maksimum akım hızı) ise 10 ml/sn geldi. Bu hastanın ICS\nnomogramına göre BOOI (Mesane Çıkım Tıkanıklığı İndeksi) değerini\nhesapla ve klinik yorumunu (cerrahi yapıp yapmayacağını) söyle.\"</p>\n<p>Cevap: \"Formül: BOOI = Pdet.Qmax - (2 x Qmax). Değerleri yerine\nkoyarsak: \\50 - (2 × 10) = 50 - 20 = 30. Çıkan sonuç 30'dur. BOOI değeri\n20 ile 40 arasında olduğu için bu hasta Şüpheli Bölgededir (Equivocal).\nYani kesin olarak prostat tıkanıklığı var diyemem, ama tıkanıklık yok da\ndiyemem. Bu hastayı doğrudan TUR-P ameliyatına almak yerine, önce\nmedikal tedavi (Alfa-bloker) verip klinik yanıtını izlemek kılavuzlara\ngöre çok daha rasyonel bir yaklaşımdır.\"</p>\n"}, {"id": "11.3", "t": "Aşırı Aktif Mesane (OAB): Patofizyoloji ve Farmakoterapi", "h": "<h3 id=\"a-patofi̇zyoloji̇-ürotelyum-sadece-bir-duvar-değildir\">A.\nPATOFİZYOLOJİ: Ürotelyum Sadece Bir Duvar Değildir!</h3>\n<p>Eskiden mesanenin içini döşeyen o zarın (Ürotelyum) idrarı\nsızdırmayan basit bir su yalıtımı (bariyer) olduğu sanılırdı. Modern\nnöroüroloji bu tabuyu yıktı.</p>\n<p>Sensör Ağı (Sensor Web): Ürotelyum, devasa ve son derece zeki bir\nsensör dokusudur. Mesane dolup gerildikçe, ürotelyum hücreleri\naltlarındaki sinir ağına (Subürotelyal Pleksus) kimyasal haberciler\nfırlatır.</p>\n<p>ATP ve Asetilkolin Fırtınası: Ürotelyum gerildiğinde ortama ATP\n(Adenozin Trifosfat) salgılar. Bu ATP, P2X3 reseptörlerine bağlanarak\nbeyne \"Sıkışıyorum\" (Urgency) hissini gönderir. OAB hastalarında bu\nürotelyal ATP salgısı anormal derecede abartılıdır. Mesane daha 50 cc\ndolduğunda bile beyne \"Patlamak üzereyim\" sinyali gider.</p>\n<p>Miyojenik ve Nörojenik Teoriler: Bazen sorun ürotelyumda değil, kasın\nkendisindedir (Miyojenik). Detrüsör kas hücreleri birbirleriyle\nelektriksel olarak o kadar sıkı bağlanır ki, bir hücredeki minik bir\nkasılma anında tüm mesaneye yayılır ve istemsiz bir dalga yaratır.</p>\n<h3 id=\"b-tani-ve-i̇şeme-günlüğü-altin-standardi\">B. TANI VE \"İŞEME\nGÜNLÜĞÜ\" ALTIN STANDARDI</h3>\n<p>EAU 2026 kılavuzları OAB'yi şöyle tanımlar: <em>İdrar yolu\nenfeksiyonu (İYE) veya başka bir patoloji olmaksızın, genellikle sık\nidrara çıkma (Frekans) ve gece uyanma (Nokturi) ile birlikte görülen,\nidrar kaçırmanın (Urge İnkontinans) eşlik ettiği veya etmediği Aniden\nSıkışma (Urgency) hissidir.</em></p>\n<p>Yani kilit kelime URGENCY (Aciliyet)'tir.</p>\n<p>Altın Standart (3 Günlük İşeme Günlüğü): Hastaya ürodinami YAPILMAZ.\nHastaya bir kağıt verilir. 3 gün boyunca saat kaçta su içtiğini, saat\nkaçta tuvalete gittiğini, kaç cc idrar yaptığını ve kaçırdıysa bunu\nişaretlemesini istersin.</p>\n<p>Eğer günlükte hasta günde 8'den fazla tuvalete gidiyor, gece 1'den\nfazla kalkıyor ve ortalama idrar hacmi çok düşük (örn: 100-150 cc)\nkalıyorsa, tanı konmuştur.</p>\n<h3 id=\"c-farmakoterapi̇-1-antimuskarinikler-m3-blokerleri\">C.\nFARMAKOTERAPİ 1: Antimuskarinikler (M3 Blokerleri)</h3>\n<p>Tedavinin birinci basamağı her zaman davranışsal terapidir (Sıvı\nkısıtlaması, kafein/alkol yasağı, mesane eğitimi). Ancak bu yetmediğinde\nelimizdeki en eski ve en güçlü farmakolojik silah Antimuskariniklerdir\n(Antikolinerjikler).</p>\n<p>Mekanizma: Parasempatik sinir sisteminin askerleri olan Asetilkolin\nmoleküllerinin, detrüsör kasındaki M3 (Muskarinik 3) reseptörlerine\nbağlanmasını engeller. Motorun ateşlemesi durur, mesane gevşer.</p>\n<p>İlaçlar: Solifenasin (Vesicare), Tolterodin (Detrusitol),\nFesoterodin, Oksibutinin (Üropan).</p>\n<p>Kabus Yan Etkiler: İlaç sadece mesanedeki M3'ü değil, tüm vücuttaki\nmuskarinik reseptörleri vurur.</p>\n<p><em>Tükürük Bezleri (M1/M3):</em> Şiddetli Ağız Kuruluğu (En sık\nilacı bırakma nedenidir).</p>\n<p><em>Bağırsaklar (M2/M3):</em> Şiddetli Kabızlık.</p>\n<p><em>Göz (M3):</em> Bulanık görme (Dar açılı glokomda KESİNLİKLE\nKONTRENDİKEDİR).</p>\n<p><em>Beyin (M1):</em> İlaç Kan-Beyin bariyerini geçerse yaşlılarda\nkognitif yıkım, unutkanlık ve demansta hızlanma (Deliryum) yapar.</p>\n<h3 id=\"d-farmakoterapi̇-2-beta-3-agonistleri-modern-kurtarıcılar\">D.\nFARMAKOTERAPİ 2: Beta-3 Agonistleri (Modern Kurtarıcılar)</h3>\n<p>Hasta ağız kuruluğundan veya kabızlıktan mahvoldu, \"Hocam ben bu\nilacı içemiyorum\" diyerek geri geldi. Veya hasta 75 yaşında, Alzheimer\nbaşlangıcı var, beynine dokunmamamız gerekiyor. İşte o zaman Campbell'ın\nbize sunduğu modern silah devreye girer: Mirabegron (Betmiga) veya\nVibegron.</p>\n<p>Mekanizma Farkı: Bu ilaç parasempatik sistemi (kasıcıları) bloke\netmez; tam tersine Sempatik sistemi (gevşeticileri) uyarır. Doğrudan\nmesane gövdesindeki Beta-3 Adrenerjik reseptörlere bağlanarak depolama\nfazında mesane kasını aktif olarak GEVŞETİR. Kapasiteyi artırır.</p>\n<p>Mucizesi: Muskarinik reseptörlere hiç dokunmadığı için Ağız Kuruluğu\nve Kabızlık YAPMAZ. Kan-beyin bariyeriyle işi yoktur, bunama (demans)\nyapmaz.</p>\n<p>Aşil Topuğu (Yan Etkisi): Beta reseptörleri kalpte ve damarlarda da\nbulunur. Bu ilacın en çok dikkat edilmesi gereken yan etkisi\nHipertansiyondur (Kan basıncı yüksekliği). Şiddetli ve kontrolsüz\ntansiyonu olan hastalarda (Sistolik &gt; 180 mmHg) kullanımı\nkontrendikedir. Başlanmadan önce ve başlandıktan sonra tansiyon takibi\nşarttır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe 78 yaşında, OAB şikayetleri olan ama aynı zamanda\nhafif kognitif bozukluğu (demans başlangıcı) olan bir teyze geldi.\nBeta-3 agonisti (Mirabegron) yazmak istedin ama hastanın tansiyonu\n190/100 (Kontrolsüz Hipertansiyon), yazamazsın. Mecburen Antimuskarinik\nvereceksin. Kan-Beyin bariyerini EN AZ geçen, beyni en iyi koruyan o\nspesifik antimuskarinik ajan hangisidir ve biyokimyasal nedeni\nnedir?\"</p>\n<p>Cevap: \"Demans riski olan yaşlılarda tercih etmem gereken ajan\nTropsiyum Klorür (Spasmex) olmalıdır. Diğer tüm antimuskarinikler\n(Oksibutinin, Solifenasin, Tolterodin) tersiyer amin yapısındadır;\nlipofiliktirler (yağda çözünürler) ve kan-beyin bariyerini kolayca geçip\nbeyne sızarlar. Tropsiyum ise bir Kuaterner Amin (Dörtlü Amin)\nyapısındadır. Molekül devasadır ve hidrofiliktir (suda çözünür); bu\nfizikokimyasal yapısı nedeniyle kan-beyin bariyerini geçemez ve Merkezi\nSinir Sistemi (SSS) yan etkileri (unutkanlık, deliryum) yaratmaz.\"</p>\n<p>Soru: \"Erkek bir hasta geldi. Şiddetli sıkışmaları (Urgency) ve gece\ntuvalete kalkmaları (Nokturi) var. 'Tamam, bu OAB' deyip hemen\nSolifenasin (Antimuskarinik) yazdın ve gönderdin. Hasta 3 gün sonra acil\nservise mesanesi patlayacak şekilde şişmiş, hiç idrar yapamaz halde\n(Akut İdrar Retansiyonu - Glob Vezikale) geldi ve sonda takıldı.\nReçeteyi yazmadan önce klinikte hangi hayati ölçümü atladın?\"</p>\n<p>Cevap: \"Erkeklerde OAB şikayetleri sıklıkla BPH'a bağlı Mesane Çıkım\nTıkanıklığının (BOO) ikincil bir sonucudur. Mesane tıkalı yola karşı\nkasılmaktan hiperaktifleşmiştir. Reçeteyi yazmadan önce mutlaka\nultrasonda PVR (İşeme Sonrası Kalan İdrar - Post-Void Residual)\nölçmeliydim. Eğer hastanın mesanesinde işeme sonrası zaten 150-200 cc\nidrar kalıyorsa (tıkanıklık varsa) ve ben gidip mesane kasını felç eden\n(Antimuskarinik) bir ilaç verirsem, o zayıf mesane tamamen durur ve\nhasta retansiyona (sondaya) mahkum olur. PVR yüksekse önce alfa-bloker\nbaşlanmalı, tıkanıklık açılmalı, gerekirse çok yakın takiple\nantikolinerjik eklenmelidir.\"</p>\n<p>Soru: \"Hastada hem OAB şikayetleri var (Sıkışma/Urgency) hem de\ngülerken, öksürürken idrar kaçırıyor (Stres İnkontinans). Bu duruma Miks\n(Karışık) Üriner İnkontinans denir. EAU kılavuzlarına göre bu hastada\ncerrahi bir müdahale (Askı/Sling ameliyatı) yapmadan önce tedaviye\nhangisinden başlamalısın?\"</p>\n<p>Cevap: \"Kılavuzlar Miks İnkontinans tablosunda cerrahiden önce her\nzaman İlk olarak OAB (Aşırı Aktif Mesane) bileşeninin medikal (ilaçla)\ntedavi edilmesini emreder. Hastaya önce Antimuskarinik veya Beta-3\nagonisti başlanır. Çünkü bazen OAB kontrol altına alındığında, hastanın\nstres kaçırmaları da tolere edilebilir seviyelere iner ve ameliyata\ngerek kalmaz. Eğer doğrudan askı (Sling/TOT) ameliyatı yaparsam,\nameliyatın yarattığı hafif tıkanıklık (direnç), altta yatan OAB'yi daha\nda alevlendirebilir ve hasta ameliyattan sonra eskisinden çok daha kötü\nbir urgency inkontinans ile karşıma çıkabilir.\"</p>\n"}, {"id": "11.4", "t": "Refrakter OAB: Botulinum Toksini ve Sakral Nöromodülasyon", "h": "<h3 id=\"a-botuli̇num-toksi̇ni̇-bo
