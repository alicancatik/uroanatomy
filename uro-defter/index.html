</h3>\n<p>BPH değerlendirmesinin ilk ve en basit testidir. Ancak doğru\nyorumlamak bir sanattır.</p>\n<h3 id=\"1-geçerlilik-kuralı-altın-kural\">1. Geçerlilik Kuralı (Altın\nKural):</h3>\n<ul>\n<li><p>Testin yorumlanabilir olması için hastanın EN AZ 150 ml idrar\nyapması gerekir.</p></li>\n<li><p><em>Neden?</em> 150 ml'nin altındaki hacimlerde mesane tam\ngerilemez, detrusor gücünü gösteremez. Akım hızı yapay olarak düşük\nçıkar.</p></li>\n<li><p><em>Aksiyon:</em> Hasta 80 cc işediyse, \"Prostatın tıkalı\" deme.\n\"Su iç, sıkış, tekrar gel\" de.</p></li>\n</ul>\n<h3 id=\"2-qmax-maksimum-akım-hızı\">2. Qmax (Maksimum Akım Hızı):</h3>\n<p>En önemli parametredir.</p>\n<ul>\n<li><p>&gt; 15 ml/sn: Normal (veya Obstrüksiyon yok).</p></li>\n<li><p>10 - 15 ml/sn: Gri bölge (Şüpheli).</p></li>\n<li><p>&lt; 10 ml/sn: CİDDİ OBSTRÜKSİYON (veya Zayıf Detrusor)\ngöstergesi.</p></li>\n</ul>\n<h3 id=\"3-i̇şeme-eğrisi-curve-tipleri\">3. İşeme Eğrisi (Curve)\nTipleri:</h3>\n<p>Kağıda baktığın an tanıyı koyabilirsin:</p>\n<ul>\n<li><p>Çan Eğrisi (Bell-Shaped): Normal. Hızla yükselir, tepe yapar,\nhızla düşer.</p></li>\n<li><p>Uzatılmış/Yayvan Eğri: BPH tipik görüntüsü. Tepeye zor çıkar,\nuzun süre işer, kuyruk uzar.</p></li>\n<li><p>Kutu/Plato (Box-Shaped): ÜRETRA DARLIĞI! (Darlık sabit olduğu\niçin akım belli bir hızı aşamaz, düz çizer).</p></li>\n<li><p>Kesik Kesik (Staccato/Intermittent):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Staccato:</em> Akım hiç sıfıra inmez ama dalgalıdır (Sfinkter\ndissinerjisi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Intermittent:</em> Akım sıfıra iner ve tekrar başlar (Karın kası\nile ıkınarak işeme - Valsalva).</li>\n</ul>\n<h3 id=\"b-post-void-resi̇düel-i̇drar-pmr--pvr\">B. POST-VOID RESİDÜEL İDRAR\n(PMR / PVR)</h3>\n<p>Hasta işedikten hemen sonra (tercihen USG ile) bakılan kalan\nidrardır.</p>\n<ul>\n<li><p>Normal: 0-50 ml.</p></li>\n<li><p>Kritik Sınır: EAU kesin bir sınır koymaz ama &gt; 150-200 ml\ntedavi kararı için uyarıcıdır.</p></li>\n<li><p>PMR Neden Önemli?</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Enfeksiyon (Sistit) riskini artırır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Mesane taşı oluşumuna zemin hazırlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Üst üriner sistemi (Böbrekleri) bozabilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Tuzak:</em> PMR yüksekliği her zaman tıkanıklık demek değildir;\nmesane divertikülü veya VUR (Reflü) da \"yalancı PMR\" yapabilir (İdrar\nişerken divertiküle dolar, işeme bitince mesaneye geri döner).</li>\n</ul>\n<h3 id=\"c-basinç-akim-çalişmasi-pfs---altin-standart\">C. BASINÇ-AKIM\nÇALIŞMASI (PFS) - ALTIN STANDART</h3>\n<p>Üroflowmetri sadece SONUCU (Akımı) gösterir. SEBEBİ (Tıkanıklık mı?\nTembellik mi?) göstermez. Bunu anlamak için mesaneye ve rektuma kateter\ntakıp basınç ölçmeliyiz.</p>\n<h3 id=\"1-kime-yapalım-eau-endikasyonları\">1. Kime Yapalım? (EAU\nEndikasyonları)</h3>\n<p>Her BPH hastasına yapılmaz! Sadece şunlara:</p>\n<ul>\n<li><p>Genç Hastalar (&lt; 50 yaş): BPH nadirdir, darlık veya nörojenik\nmesane olabilir.</p></li>\n<li><p>Yaşlı Hastalar (&gt; 80 yaş): Detrusor yetmezliği riski\nyüksektir.</p></li>\n<li><p>Yüksek PMR (&gt; 300 cc): Mesane \"Tembel\" mi diye bakmak\nlazım.</p></li>\n<li><p>Daha Önce Ameliyat Olmuş (TUR-P) ama Düzelmemiş: Yanlış tanı\nmıydı?</p></li>\n<li><p>Nörojenik Hastalık Şüphesi: Parkinson, MS, Diyabet.</p></li>\n</ul>\n<h3 id=\"2-temel-mantık-fizik-kuralı\">2. Temel Mantık (Fizik\nKuralı):</h3>\n<ul>\n<li><p>Obstrüksiyon (BPH): Mesane ÇOK basınç üretir ama idrar AZ akar.\n(Yüksek Basınç + Düşük Akım).</p></li>\n<li><p>Detrusor Underactivity (Tembel Mesane): Mesane basınç ÜRETEMEZ,\nidrar da az akar. (Düşük Basınç + Düşük Akım).</p></li>\n</ul>\n<p>3. ABRAMS-GRIFFITHS NOMOGRAMI ve BOOI (Bladder Outlet Obstruction\nIndex):</p>\n<p>Formülü ezberle (Basit matematik):</p>\n<p>\\BOOI = P_{det}Q_{max} - 2 × Q_{max}</p>\n<ul>\n<li><p>PdetQmax: Maksimum akım anındaki detrusor basıncı.</p></li>\n<li><p>Qmax: Maksimum akım hızı.</p></li>\n</ul>\n<p>Sonuçlar:</p>\n<ul>\n<li><p>BOOI &gt; 40: OBSTRÜKSİYON VAR. (Bu hasta ameliyattan %100 fayda\ngörür).</p></li>\n<li><p>BOOI &lt; 20: OBSTRÜKSİYON YOK. (Sorun başka yerde. Ameliyat\netme!).</p></li>\n<li><p>BOOI 20 - 40: Gri Bölge (Equivocal).</p></li>\n</ul>\n<h3 id=\"d-vi̇deo-ürodi̇nami̇\">D. VİDEO-ÜRODİNAMİ</h3>\n<p>Sıvı yerine kontrast madde verilir ve skopi altında işeme\nizlenir.</p>\n<ul>\n<li>Kullanım: Karmaşık olgularda (Sfinkter dissinerjisi, Divertikül,\nVUR, Mesane boynu darlığı) anatomik yeri görmek için. Standart BPH'da\ngerekmez.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Qmax 8 ml/sn olan bir hastaya direkt TUR-P kararı verilir\nmi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Sadece Qmax'a bakarak verilmez. Öncelikle işeme hacmine\nbakmalıyız (&gt;150 ml mi?). Sonra rektal tuşe ile prostat boyutunu ve\nilaç yanıtını değerlendirmeliyiz. Eğer hasta çok yaşlıysa veya\ndiyabetikse, 'Detrusor Yetmezliği'ni ekarte etmek için Basınç-Akım\nçalışması (Ürodinami) gerekebilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Tembel Mesane (Underactive Bladder) tanısı koyduğun hastayı\nameliyat edersen ne olur?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hasta idrarını yine yapamaz. Hatta prostatın direnci\nkalktığı için kontinans mekanizması zayıflayabilir ve kaçırma\n(inkontinans) başlayabilir. Ameliyat sonrası memnuniyet oranı çok\ndüşüktür. Hastaya CIC (Temiz Aralıklı Kateterizasyon) öğretmek daha\ndoğrudur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Üroflowmetride 'Testere Dişi' (Saw-tooth) görünümü neyi ifade\neder?\"</li>\n</ol>\n<ul>\n<li>Cevap: Genellikle Detrusor-Sfinkter Dissinerjisi (Nörojenik) veya\nkarın kaslarını kullanarak ıkınarak işeme (Valsalva) manevrasını\ngösterir.</li>\n</ul>\n<h3 id=\"1-soru-sessiz-böbrek-silent-kidney-nedir\">1. Soru: \"Sessiz\nBöbrek (Silent Kidney) nedir?\"</h3>\n<ul>\n<li>Cevap: Yüksek basınçlı kronik retansiyondur. Mesane o kadar doludur\nki artık hissetmez (Ağrı yok). Ancak basınç böbreklere vurur\n(Hidronefroz + Kreatinin yüksekliği). Bu hastada acil drenaj (sonda)\ngerekir, ürodinami değil.</li>\n</ul>\n"}, {"id": "3.4", "t": "Medikal Tedavi - I (Alfa-Blokerler)", "h": "<p>Bu ilaçlar prostatı KÜÇÜLTMEZ. Sadece prostatın ve mesane boynunun\nkaslarını GEVŞETİR (Dinamik komponenti çözer).</p>\n<h3 id=\"a-mekani̇zma-ve-reseptör-alt-ti̇pleri̇\">A. MEKANİZMA VE RESEPTÖR\nALT TİPLERİ</h3>\n<p>Vücutta Alfa-1 reseptörleri 3 alt tipe ayrılır. İlacın yan etkisi,\nhangi reseptörü vurduğuna bağlıdır.</p>\n<ol type=\"1\">\n<li><p>Alfa-1a: PROSTAT ve MESANE BOYNU. (Hedefimiz bu!). Gevşeme\nsağlar.</p></li>\n<li><p>Alfa-1b: DAMARLAR. (Kan damarları). Bloklarsan Tansiyon düşer\n(Hipotansiyon).</p></li>\n<li><p>Alfa-1d: MESANE GÖVDESİ ve OMURİLİK. Depolama semptomlarını\n(Sıkışma) etkiler.</p></li>\n</ol>\n<p>Amaç: Mümkün olduğunca Alfa-1a'yı bloklamak, Alfa-1b'den kaçmaktır\n(Üroselektivite).</p>\n<h3 id=\"b-i̇laç-seçenekleri̇-kime-hangisi\">B. İLAÇ SEÇENEKLERİ (Kime\nHangisi?)</h3>\n<h3 id=\"1-tamsulosin-flomax--tamprost\">1. Tamsulosin (Flomax /\nTamprost):</h3>\n<ul>\n<li><p>Doz: 0.4 mg (Günde 1 kez, kahvaltıdan sonra).</p></li>\n<li><p>Özellik: En sık yazılan \"Altın Standart\". Hem 1a hem 1d üzerinde\netkilidir.</p></li>\n<li><p>Yan Etki:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Retrograd Ejaculation (Kuru orgazm): %10-15.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hipotansiyon riski düşüktür ama ilk dozda olabilir.</li>\n</ul>\n<h3 id=\"2-alfuzosin-xatral\">2. Alfuzosin (Xatral):</h3>\n<ul>\n<li><p>Doz: 10 mg (Günde 1 kez, tok karnına - XL formülasyonu).</p></li>\n<li><p>Özellik:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Cinsel Aktif Genç Hasta İçin İDEAL: Retrograd ejakülasyon riski\ndiğerlerine göre daha düşüktür (neredeyse plasebo ile aynı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kalp hastalarında QT uzaması yapabilir (Dikkat!).</li>\n</ul>\n<h3 id=\"3-silodosin-urorec\">3. Silodosin (Urorec):</h3>\n<ul>\n<li><p>Doz: 8 mg (Günde 1 kez, yemekle).</p></li>\n<li><p>Özellik: EN SELEKTİF (Süper-Seçici) ilaçtır. Sadece Alfa-1a'yı\nvurur.</p></li>\n<li><p>Avantaj: Tansiyonu en az düşüren ilaçtır (Yaşlı/Kardiyak hastada\ngüvenli).</p></li>\n<li><p>Dezavantaj: ANEYAKÜLASYON (Meni Yokluğu)! Hastaların %20-30'unda\nmeni hiç gelmez veya mesaneye kaçar. (Genç hastaya yazarken mutlaka\nuyar!).</p></li>\n</ul>\n<h3 id=\"4-doksazosin-cardura-ve-terazosin\">4. Doksazosin (Cardura) ve\nTerazosin:</h3>\n<ul>\n<li><p>Özellik: NON-SELEKTİF. Hem prostata (1a) hem damarlara (1b) etki\neder.</p></li>\n<li><p>Kullanım: BPH + Hipertansiyonu olan hastalarda tercih edilirdi\n(Eskiden). Artık \"Titrasyon\" (doz artırma) gerektirdiği ve çok baş\ndönmesi yaptığı için ilk tercih değildir. Akşam yatarken\nverilir.</p></li>\n</ul>\n<h3 id=\"c-kri̇ti̇k-yan-etki̇ler-hasta-seni-aramasın-diye-söyle\">C. KRİTİK\nYAN ETKİLER (Hasta Seni Aramasın Diye Söyle!)</h3>\n<h3 id=\"1-retrograd-ejaculation-geriye-boşalma\">1. Retrograd Ejaculation\n(Geriye Boşalma):</h3>\n<ul>\n<li><p>Mekanizma: Mesane boynu normalde boşalma sırasında kapanır. Alfa\nblokerler burayı gevşettiği için boyun açık kalır. Meni dışarı (penise)\ngitmek yerine, direncin az olduğu yere (mesaneye) kaçar.</p></li>\n<li><p>Hasta Şikayeti: \"Hocam boşalıyorum, zevk alıyorum ama hiç sıvı\ngelmiyor (Kuru Orgazm).\" veya \"Menzilim kısaldı.\"</p></li>\n<li><p>Zararı: Yoktur. İlaç kesilince düzelir. Sonraki idrarda meni\nköpüklü olarak atılır.</p></li>\n</ul>\n<h3 id=\"2-ifis-intraoperative-floppy-iris-syndrome---gevşek-i̇ris\">2.\nIFIS (Intraoperative Floppy Iris Syndrome - Gevşek İris):</h3>\n<ul>\n<li><p>Mekanizma: İris kaslarında da Alfa-1 reseptörü vardır. İlaç\nburayı gevşetir.</p></li>\n<li><p>Risk: Katarakt ameliyatı sırasında göz bebeği (pupil) aniden\ndaralır ve iris dalgalanır. Göz cerrahı için kabustur!</p></li>\n<li><p>Kural: Katarakt ameliyatı olacak hastaya Tamsulosin başlama! Eğer\nkullanıyorsa, göz doktoruna söylemesi gerekir (Gözcü özel kancalarla\nirisi tutar). İlacı önceden kesmenin faydası tartışmalıdır (etki kalıcı\nolabilir).</p></li>\n</ul>\n<h3 id=\"3-ortostatik-hipotansiyon\">3. Ortostatik Hipotansiyon:</h3>\n<ul>\n<li><p>Ayağa kalkınca baş dönmesi.</p></li>\n<li><p><em>Önlem:</em> İlacı (özellikle Doksazosin) gece yatarken\nalmasını söyle. İlk doz senkobu (bayılması) riskini azaltır.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastaya Alfa-Bloker başladın, kontrole ne zaman çağırsın?\nİlaç ne zaman etki eder?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Etki Başlangıcı: Çok hızlıdır (Saatler/Günler içinde).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tam Etki: 2-4 hafta.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kontrol: 1. ayda (Yan etki ve fayda değerlendirmesi).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Genç, çocuk isteyen (infertilite tedavisi gören) bir hastada\nBPH semptomları var. Hangi ilacı verirsin, hangisini vermezsin?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Verme: Silodosin (Meni çıkışını bozar, sperm elde edilemez).\nTamsulosin (Riskli).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ver: Alfuzosin (Ejakülasyonu en az bozan).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Alternatif: Tadalafil 5mg (PDE5 inhibitörü) hem işemeyi rahatlatır\nhem ejakülasyonu bozmaz.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Alfa bloker prostat kanserini engeller mi veya PSA'yı düşürür\nmü?\"</li>\n</ol>\n<ul>\n<li>Cevap: HAYIR. Alfa blokerlerin prostat boyutu veya PSA üzerinde\nhiçbir etkisi yoktur. Sadece semptomatiktir. İlacı kesersen şikayetler\ngeri döner.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Akut Üriner Retansiyon (Glob) ile gelen hastaya sonda taktın.\nSondayı çekmeden önce ne yapmalısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hemen Alfa-Bloker (Tamsulosin/Alfuzosin) başlarım. İlacı en\naz 2-3 gün kullandırıp, prostatın gevşemesini sağladıktan sonra sondayı\nçekerim (TWOC - Trial Without Catheter). Başarılı işeme şansını\nartırır.\"</li>\n</ul>\n"}, {"id": "3.5", "t": "Medikal Tedavi - II (5-Arı, OAB İlaçları ve PDE5i)", "h": "<h3 id=\"a-5-alfa-redüktaz-i̇nhi̇bi̇törleri̇-5-ari\">A. 5-ALFA REDÜKTAZ\nİNHİBİTÖRLERİ (5-ARI)</h3>\n<p>Bunlar hormonal ilaçlardır. Prostatın \"yakıtını\" (DHT) keserler.</p>\n<h3 id=\"1-mekanizma-ve-i̇laçlar\">1. Mekanizma ve İlaçlar</h3>\n<ul>\n<li><p>Mekanizma: Testosteronun, prostat içinde daha potent (güçlü) olan\nDihidrotestosteron (DHT)'a dönüşmesini sağlayan <em>5-Alfa Redüktaz</em>\nenzimini bloke ederler.</p></li>\n<li><p>Sonuç: Prostat hücresi apoptoza (ölüme) gider. Hacim\nküçülür.</p></li>\n<li><p>İlaçlar:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Finasterid (Proscar): Sadece Tip 2 izoenzimi bloklar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Dutasterid (Avodart): Hem Tip 1 hem Tip 2 izoenzimi bloklar (Dual\nBlokaj). Teorik olarak DHT'yi daha fazla düşürür (%90 vs %70) ama klinik\nfark tartışmalıdır.</li>\n</ul>\n<h3 id=\"2-klinik-etkiler-eau-ezber-bilgisi\">2. Klinik Etkiler (EAU Ezber\nBilgisi)</h3>\n<ul>\n<li><p>Hacim Azalması: 6-12 ayda prostat hacmini %18-28\nküçültür.</p></li>\n<li><p>Semptom Skorunda (IPSS) Düşüş: Yaklaşık 3-4 puan (Alfa-blokerler\nkadar hızlı değildir).</p></li>\n<li><p>Uzun Vadeli Etki (En Önemlisi): Akut Üriner Retansiyon (AUR) ve\nCerrahi ihtiyacını AZALTAN TEK İLAÇ GRUBUDUR. (Alfa-blokerler riski\nazaltmaz, sadece semptomu giderir).</p></li>\n</ul>\n<h3 id=\"3-psa-kuralı-hayati̇\">3. PSA Kuralı (HAYATİ!)</h3>\n<ul>\n<li><p>5-ARI kullanan hastada PSA değeri 6. aydan itibaren %50\nDÜŞER.</p></li>\n<li><p>Kural: İlacı kullanan hastada ölçtüğün PSA'yı 2 İLE\nÇARP!</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Örnek:</em> Avodart kullanan hastada PSA 2.5 ng/mL geldi. Gerçek\ndeğeri 5.0 ng/mL'dir. Biyopsi yapmalısın!</li>\n</ul>\n<h3 id=\"4-yan-etkiler-hasta-uyarısı\">4. Yan Etkiler (Hasta Uyarısı)</h3>\n<ul>\n<li><p>Libido Kaybı (Cinsel isteksizlik): %5-10.</p></li>\n<li><p>Erektil Disfonksiyon (Sertleşme sorunu): %5-10.</p></li>\n<li><p>Jinekomasti (Meme büyümesi/hassasiyeti): %1-2.</p></li>\n<li><p><em>Not:</em> Yan etkiler genelde ilk 1 yıldan sonra\nazalır.</p></li>\n</ul>\n<h3 id=\"b-muskari̇ni̇k-antagoni̇stler-anti̇koli̇nerji̇kler\">B. MUSKARİNİK\nANTAGONİSTLER (ANTİKOLİNERJİKLER)</h3>\n<p>BPH hastalarının %50'sinde \"Mesane Aşırı Aktifliği\" (OAB) de vardır\n(Sıkışma, Sık idrar). Prostatı gevşetmek yetmez, mesaneyi de\nsakinleştirmek gerekir.</p>\n<ul>\n<li><p>İlaçlar: Solifenasin, Tolterodin, Fesoterodin.</p></li>\n<li><p>Kime Verilir? Alfa-bloker tedavisine rağmen Depolama Semptomları\n(Sıkışma/Urgency) devam eden hastalara.</p></li>\n<li><p>Korkulan Yan Etki: Retansiyon (İdrar yapamama).</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>EAU Kuralı:</em> Eğer hastanın PMR (Kalan İdrar) &lt; 150 ml ise\ngüvenle verebilirsin. PMR yüksekse verme, mesaneyi iyice felç edersin,\nhasta sonda takmak zorunda kalır!</li>\n</ul>\n<h3 id=\"c-beta-3-agoni̇stler-mi̇rabegron\">C. BETA-3 AGONİSTLER\n(MİRABEGRON)</h3>\n<p>Antikolinerjiklerin \"kurutucu\" yan etkilerinden (ağız kuruluğu,\nkabızlık, demans riski) kaçınmak için geliştirildi.</p>\n<ul>\n<li><p>Mekanizma: Mesaneyi kasılmayı engelleyerek değil, Gevşeme\n(Relaxation) sağlayarak (Beta-3 reseptörü üzerinden) kapasiteyi\nartırır.</p></li>\n<li><p>Avantajı: Ağız kuruluğu yapmaz. Yaşlılarda daha\ngüvenlidir.</p></li>\n<li><p>Dikkat: Şiddetli kontrolsüz hipertansiyonu olanlarda\nkontrendikedir.</p></li>\n</ul>\n<h3 id=\"d-fosfodi̇esteraz-5-i̇nhi̇bi̇törleri̇-pde5i\">D. FOSFODİESTERAZ-5\nİNHİBİTÖRLERİ (PDE5i)</h3>\n<p>Viagra/Cialis grubu sadece ereksiyon ilacı değildir!</p>\n<ul>\n<li><p>İlaç: Tadalafil 5 mg (Günlük doz).</p></li>\n<li><p>Mekanizma: Prostat, mesane boynu ve pelvik damarlardaki düz\nkasları gevşetir (NO/cGMP yoluyla). Enflamasyonu azaltır.</p></li>\n<li><p>Endikasyon:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>LUTS + ED (Erektil Disfonksiyon) olan hastalar için mükemmeldir.\n\"Bir taşla iki kuş.\"</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Alfa-bloker alamayan (hipotansiyonu olan) hastalarda\nalternatiftir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Uyarı: SGK (Türkiye'de) prostat tanısıyla bunu ödemez. Hastaya\nmaliyetini söylemelisin. Ayrıca kalp ilacı (Nitrat) kullananlarda\nKESİNLİKLE YASAKTIR (Ölümcül hipotansiyon).</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"5-ARI (Avodart) başladığın hasta 1 ay sonra geldi, 'Hocam\nhiçbir işe yaramadı' diyor. Ne dersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Normaldir. Bu ilacın prostatı küçültmesi ve idrar akımını\nrahatlatması en az 3-6 ay sürer. Sabırlı olması gerekir. Hızlı etki için\nyanına Alfa-Bloker ekleyebiliriz (Kombinasyon).\"</li>\n</ul>\n<h3\nid=\"1-soru-finasterid-ile-saç-i̇lacı-propecia-arasındaki-ilişki-nedir\">1.\nSoru: \"Finasterid ile Saç İlacı (Propecia) arasındaki ilişki\nnedir?\"</h3>\n<ul>\n<li>Cevap: İkisi de aynı moleküldür (Finasterid). BPH için 5 mg\n(Proscar), Saç dökülmesi için 1 mg (Propecia) kullanılır. Yan etki\nolarak kıllanma artışı görülebilir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"PCPT Çalışması (Prostate Cancer Prevention Trial) ve Yüksek\nDereceli Kanser riski nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Finasterid kullananlarda prostat kanseri riski genel olarak\n%25 azalır. ANCAK, görülen kanserlerin Yüksek Dereceli (Gleason 7-10)\nolma ihtimali hafifçe artar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Yorum:</em> Bu muhtemelen gerçek bir artış değil, prostat\nküçüldüğü için iğnenin kansere denk gelme olasılığının artmasıdır\n(Artefakt). Yine de hastaya söylenmelidir.</li>\n</ul>\n<h3\nid=\"1-soru-kombinasyon-tedavisini-alfa-bloker--5-ari-kime-verelim\">1.\nSoru: \"Kombinasyon tedavisini (Alfa Bloker + 5-ARI) kime verelim?\"</h3>\n<ul>\n<li>Cevap: İlerleme riski yüksek olan hastalara:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Prostat Hacmi &gt; 40 cc.</p></li>\n<li><p>PSA &gt; 1.5 ng/mL.</p></li>\n<li><p>Şiddetli semptomlar.</p></li>\n</ol>\n"}, {"id": "3.6", "t": "Kombinasyon Tedavileri (Dev Çalışmalar)", "h": "<h3 id=\"a-neden-kombi̇nasyon-mantık\">A. NEDEN KOMBİNASYON? (Mantık)</h3>\n<p>BPH'nın iki ayağı vardı:</p>\n<ol type=\"1\">\n<li><p>Dinamik (Kasılma): Alfa-Bloker çözer (Semptomu\ndüzeltir).</p></li>\n<li><p>Statik (Büyüme): 5-ARI çözer (İlerlemeyi durdurur).</p></li>\n</ol>\n<p>Teori: İkisini birden verirsen, hem hasta rahatlar hem de gelecekteki\nameliyat riskini sıfırlarsın.</p>\n<h3 id=\"b-landmark-ki̇li̇t-çalişmalar\">B. LANDMARK (KİLİT) ÇALIŞMALAR</h3>\n<p>Bu iki çalışmanın sonuçları, bugün yazdığımız reçetelerin\nkanıtıdır.</p>\n<h3 id=\"1-mtops-çalışması-medical-therapy-of-prostatic-symptoms\">1.\nMTOPS Çalışması (Medical Therapy of Prostatic Symptoms):</h3>\n<ul>\n<li><p>İlaçlar: Doksazosin + Finasterid.</p></li>\n<li><p>Sonuç:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kombinasyon, Klinik Progresyonu (İlerlemeyi) tekli ilaçlara göre çok\ndaha fazla (%66) azaltır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Akut Üriner Retansiyon (AUR) ve Cerrahi İhtiyacı riskini belirgin\ndüşürür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Öğrenilen Ders:</em> Uzun vadeli koruma için 5-ARI şarttır,\nhızlı rahatlama için Alfa-Bloker şarttır.</li>\n</ul>\n<h3 id=\"2-combat-çalışması-combination-of-avodart-and-tamsulosin\">2.\nCombAT Çalışması (Combination of Avodart and Tamsulosin):</h3>\n<ul>\n<li><p>İlaçlar: Tamsulosin + Dutasterid (Tek kapsülde:\nDuodart).</p></li>\n<li><p>Hasta Grubu: Prostat hacmi &gt; 30 cc ve PSA &gt; 1.5 ng/mL.\n(Yani riskli grup).</p></li>\n<li><p>Sonuç:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kombinasyon tedavisi, 4. yılda semptomları (IPSS) tekli tedavilerden\nçok daha iyi düzeltir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>BPH'ye bağlı cerrahi ve AUR riskini azaltır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kritik Bilgi:</em> Prostat hacmi küçük olanlarda (&lt;30 cc)\nkombinasyonun Alfa-Bloker monoterapisine üstünlüğü YOKTUR! (Boşuna yan\netki yükleme).</li>\n</ul>\n<h3 id=\"c-kombi̇nasyon-ki̇me-veri̇li̇r-eau-endikasyonları\">C. KOMBİNASYON\nKİME VERİLİR? (EAU Endikasyonları)</h3>\n<p>Her gelene \"Duodart\" yazıp gönderemezsin. Kriterler:</p>\n<ol type=\"1\">\n<li>Orta-Şiddetli LUTS (IPSS &gt; 13).</li>\n</ol>\n<h3 id=\"2-ve\">2. VE</h3>\n<h3 id=\"3-i̇lerleme-progresyon-riski-olanlar\">3. İlerleme (Progresyon)\nRiski Olanlar:</h3>\n<ul>\n<li>Prostat Hacmi &gt; 40 cc. (Rektal tuşede büyük, portakal gibi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>PSA &gt; 1.5 ng/mL.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Senaryo:</em> 50 yaşında, PSA 0.8, Prostat 25cc, IPSS 18 olan\nhastaya Kombinasyon VERİLMEZ. Sadece Alfa-Bloker verilir.</li>\n</ul>\n<h3 id=\"d-tedavi̇yi̇-ne-zaman-keseli̇m-de-eskalasyon\">D. TEDAVİYİ NE ZAMAN\nKESELİM? (De-eskalasyon)</h3>\n<p>İlaç ömür boyu mu kullanılacak?</p>\n<ul>\n<li>Alfa-Bloker Kesilebilir mi?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>EVET. 5-ARI (Finasterid/Dutasterid) prostatı küçülttükten sonra\n(yaklaşık 6-9 ay sonra), obstrüksiyon mekanik olarak azalır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>SMART Çalışması: 6 ay kombinasyon kullandıktan sonra Alfa-Bloker\nkesildiğinde, hastaların %60-70'i semptomsuz devam edebiliyor.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Strateji:</em> 1 yıl sonra Alfa-Blokeri kesmeyi dene. Şikayetler\nartarsa geri başla.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>5-ARI Kesilebilir mi?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>HAYIR. Kesersen prostat 3-6 ay içinde eski boyutuna döner ve tekrar\nbüyür. Bu ilaç (yan etki yoksa) ömür boyudur.</li>\n</ul>\n<h3 id=\"e-di̇ğer-kombi̇nasyonlar\">E. DİĞER KOMBİNASYONLAR</h3>\n<h3 id=\"1-alfa-bloker--muskarinik-antagonist-antikolinerjik\">1.\nAlfa-Bloker + Muskarinik Antagonist (Antikolinerjik):</h3>\n<ul>\n<li><p>Kime: Depolama semptomları (Sıkışma/Sık idrar) baskın olan ve tek\nbaşına Alfa-Bloker ile düzelmeyen hastalara.</p></li>\n<li><p>Şart: PMR &lt; 150 cc olmalı! (Yoksa glob gelişir).</p></li>\n</ul>\n<h3 id=\"2-alfa-bloker--pde5-i̇nhibitörü-tadalafil\">2. Alfa-Bloker + PDE5\nİnhibitörü (Tadalafil):</h3>\n<ul>\n<li><p>Kime: LUTS + Erektil Disfonksiyonu olan hastalara.</p></li>\n<li><p>Etki: IPSS skorunda anlamlı düşüş sağlar. Ancak SGK\nödemez.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastaya kombinasyon (Duodart) başladın. En sık görülen ve\nhastayı tedaviden vazgeçiren yan etki nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Retrograd Ejakülasyon + Libido Kaybı.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Alfa-bloker meniyi geri kaçırır, 5-ARI isteği azaltır. Hasta \"Hem\nisteğim azaldı hem de boşalamıyorum, kendimi hadım edilmiş gibi\nhissediyorum\" diyebilir. Buna hazırlıklı olmalı ve baştan\nkonuşmalısın.</li>\n</ul>\n<h3\nid=\"1-soru-kombinasyon-tedavisi-prostat-kanseri-tanısını-geciktirir-mi\">1.\nSoru: \"Kombinasyon tedavisi prostat kanseri tanısını geciktirir\nmi?\"</h3>\n<ul>\n<li>Cevap: Eğer PSA kuralını (2 ile çarpma) uygulamazsan geciktirir! PSA\n2.0 iken (Gerçekte 4.0) \"Normal\" deyip biyopsi yapmazsan kanseri\natlarsın.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"MTOPS çalışmasına göre Alfa-Blokerler (Doksazosin) akut\nretansiyonu (Glob) önler mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: HAYIR. Alfa-blokerler sadece semptomları (LUTS) düzeltir.\nUzun vadede prostat büyümesini durdurmadıkları için retansiyon riskini\nazaltmazlar. Bunu yapan sadece 5-ARI'dır.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Genç hastada (45 yaş), prostat 35cc, şikayeti çok.\nKombinasyon verelim mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: Dikkatli olunmalı. 5-ARI ilaçları genç hastalarda fertiliteyi\n(sperm sayısını/hacmini) bozabilir. Çocuk isteği varsa 5-ARI\nverilmemeli, sadece Alfa-Bloker (tercihen Alfuzosin) verilmelidir.</li>\n</ul>\n"}, {"id": "3.7", "t": "Cerrahi Tedavi - I (Endikasyonlar ve TUR-P)", "h": "<h3 id=\"a-ameli̇yat-karari-kime-bıçak-vuracağız\">A. AMELİYAT KARARI (Kime\nBıçak Vuracağız?)</h3>\n<p>EAU Kılavuzuna göre endikasyonlar ikiye ayrılır.</p>\n<h3 id=\"1-mutlak-endikasyonlar-tartışmasız---cerrahi-şart\">1. Mutlak\nEndikasyonlar (Tartışmasız - Cerrahi Şart!):</h3>\n<p>Bunları ezbere bilmelisin.</p>\n<ul>\n<li><p>Tekrarlayan Akut Üriner Retansiyon (Glob): Sondayı çektin, ilaç\nverdin, yine tıkandı. (En az 1 başarısız TWOC denemesi).</p></li>\n<li><p>BPH Kaynaklı Böbrek Yetmezliği: Tıkanıklığa bağlı hidronefroz ve\nkreatinin artışı.</p></li>\n<li><p>Mesane Taşı: BPH'a eşlik eden taş varsa, sadece taşı kırmak\nyetmez; nedeni (BPH) de çözmelisin.</p></li>\n<li><p>Tekrarlayan Makroskopik Hematüri: BPH kanaması ilaçla durmuyorsa\n(Finasteride rağmen).</p></li>\n<li><p>Tekrarlayan İYE: Tıkanıklık ve rezidü idrar (PMR) yüzünden\nsürekli enfeksiyon oluyorsa.</p></li>\n</ul>\n<h3 id=\"2-rölatif-endikasyonlar-hasta-tercihi\">2. Rölatif Endikasyonlar\n(Hasta Tercihi):</h3>\n<ul>\n<li><p>Medikal tedaviye yanıt vermeyen veya yan etkilerini tolere\nedemeyen hastalar.</p></li>\n<li><p>Medikal tedaviye rağmen yaşam kalitesi (QoL) düşük olan\nhastalar.</p></li>\n</ul>\n<h3 id=\"b-tur-p-cerrahi̇-prensi̇pler\">B. TUR-P: CERRAHİ PRENSİPLER</h3>\n<p>Mantık basittir: Portakalın kabuğunu (Cerrahi Kapsül/Periferal Zon)\nyerinde bırakıp, içindeki meyveyi (Adenom/Transizyonel Zon) parça parça\nkazımaktır (Rezeksiyon).</p>\n<h3 id=\"1-sınırlar-ve-landmarklar-deniz-fenerleri\">1. Sınırlar ve\nLandmarklar (Deniz Fenerleri):</h3>\n<p>Cerrahın kaybolmaması için 3 nirengi noktası vardır:</p>\n<ul>\n<li>Verumontanum (Seminal Colliculus):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>EN ÖNEMLİSİDİR!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Konumu:</em> Prostatik üretra tabanında, sfinkterin hemen\nproksimalindedir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kural:</em> Asla Verumontanum'un distaline (aşağısına) geçme!\nGeçersen Eksternal Sfinkteri kesersin -&gt; İnkontinans!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Mesane Boynu (Bladder Neck):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Prostat ile mesane birleşimi. Saat 5 ve 7 hizası boldur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Üreter Orifisleri:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Özellikle büyük median lobu olan hastalarda orifisler trigonda\ngizlenmiş olabilir. Rezeksiyona başlamadan önce yerlerini teyit\netmelisin.</li>\n</ul>\n<h3 id=\"2-teknik-nesbit-vs-barnes\">2. Teknik: Nesbit vs Barnes:</h3>\n<ul>\n<li><p>Nesbit Tekniği (Klasik): Önce mesane boynundan başlar, apexe\ndoğru gelir.</p></li>\n<li><p>Barnes Tekniği: Önce apexten (veru hizasından) başlar, yukarı\nçıkar.</p></li>\n<li><p><em>Asistan Kuralı:</em> Önce Median Lobu al (görüşü açar), sonra\nyan lobları, en son apexi (sfinktere yakın olduğu için en tehlikeli yer)\ntemizle.</p></li>\n</ul>\n<h3 id=\"3-cerrahi-kapsül-görünümü\">3. Cerrahi Kapsül Görünümü:</h3>\n<p>Adenom dokusu \"kabarık, granüler ve beyaz/sarı\"dır. Kapsüle\nyaklaştığında doku \"lifli, ağsı ve gri/pembe\" görünür. Bu lifleri\ngördüğünde durmalısın. Delersen (Perforasyon) irrigasyon sıvısı batına\nkaçar!</p>\n<h3 id=\"c-monopolar-vs-bi̇polar-tur-p-kritik-fark\">C. MONOPOLAR VS\nBİPOLAR TUR-P (Kritik Fark)</h3>\n<h3 id=\"1-monopolar-tur-p\">1. Monopolar TUR-P:</h3>\n<ul>\n<li><p>Sıvı: İletken OLMAYAN (Mannitol, Sorbitol, Glisin)\nkullanılır.</p></li>\n<li><p>Risk: TUR SENDROMU!</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Vücut bu hipotonik sıvıyı emerse (venöz sinüsler açılınca) -&gt;\nDilüsyonel Hiponatremi gelişir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Bulgular:</em> Hasta huzursuzlaşır, bulantı/kusma, bradikardi,\nhipertansiyon, konfüzyon. (Spinal anestezide hasta \"Karnım ağrıyor,\nmidem bulanıyor\" derse DUR!).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Süre Sınırı: Maksimum 60 dakika. (Risk artar).</li>\n</ul>\n<h3 id=\"2-bipolar-plazmakinetik-tur-p\">2. Bipolar (Plazmakinetik)\nTUR-P:</h3>\n<ul>\n<li><p>Sıvı: İzotonik (Serum Fizyolojik - NaCl) kullanılır.</p></li>\n<li><p>Avantaj: Vücut sıvıyı emse bile sodyum düşmez. TUR Sendromu riski\nYOKTUR.</p></li>\n<li><p>Süre: Daha uzun çalışılabilir (90 dk).</p></li>\n<li><p>Hemostaz: Kanama kontrolü daha iyidir (Koter etkisi daha\nderin).</p></li>\n</ul>\n<h3 id=\"d-kompli̇kasyonlar-hasta-onamı-i̇çin\">D. KOMPLİKASYONLAR (Hasta\nOnamı İçin)</h3>\n<p>Hastaya ameliyat öncesi şunları söylemek zorundasın:</p>\n<h3 id=\"1-retrograd-ejakülasyon-meni-gelmemesi\">1. Retrograd Ejakülasyon\n(Meni Gelmemesi):</h3>\n<ul>\n<li>Oran: %65-70. (Hastaya %100 de, garanti olsun).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Neden:</em> Mesane boynu alındığı için meni mesaneye kaçar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Uyarı:</em> \"Çocuğun olmaz demiyorum, normal yolla olmaz\ndiyorum. Tüp bebekle olur.\"</li>\n</ul>\n<h3 id=\"1-erektil-disfonksiyon-sertleşme-bozukluğu\">1. Erektil\nDisfonksiyon (Sertleşme Bozukluğu):</h3>\n<ul>\n<li>Oran: %5-10 (Kalıcı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Neden:</em> Kapsül perforasyonu yapılırsa kavernöz sinirler\n(termal hasar) zedelenir.</li>\n</ul>\n<h3 id=\"1-üretra-darlığı--mesane-boynu-darlığı\">1. Üretra Darlığı /\nMesane Boynu Darlığı:</h3>\n<ul>\n<li>Oran: %2-9.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Neden:</em> Aletin çapı (24-26 Fr) üretra için kalındır, mukoza\nhasarı yapar.</li>\n</ul>\n<h3 id=\"1-i̇nkontinans-i̇drar-kaçırma\">1. İnkontinans (İdrar\nKaçırma):</h3>\n<ul>\n<li>Stres İnkontinans: Sfinkter hasarı (%1-2).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Urge İnkontinans: Mesane irritasyonu (Geçicidir).</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"TUR Sendromu (Hiponatremi) gelişen hastada sodyumu ne kadar\nhızlı yükseltmelisin?\"</li>\n</ol>\n<ul>\n<li>Cevap: Çok yavaş! Saatte 0.5 - 1 mEq/L'den fazla yükseltilmez.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Risk:</em> Hızlı düzeltirsen Santral Pontin Miyelinolizis (Beyin\nsapı hasarı) gelişir, hasta felç kalır veya ölür.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Apikal dokuyu (Verumontanum yanlarını) temizlerken sfinkteri\nkorumak için ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Veru'yu Saat 6 hizasında referans alırım. Loop'u\n(rezektoskop ucunu) Veru'nun distaline asla geçirmem. Apexi keserken\naleti kendime doğru çekmem, sadece loop'u hareket ettiririm.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"80 cc üzeri prostatlarda neden Açık Prostatektomi veya Lazer\n(HoLEP) önerilir?\"</li>\n</ol>\n<ul>\n<li>Cevap: TUR-P ile 80 cc üzeri prostatı temizlemek 60-90 dakikadan\nuzun sürer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Monopolar ise TUR sendromu riski artar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kanama riski artar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Re-operasyon (dokunun tekrar büyümesi) riski daha yüksektir.</li>\n</ul>\n<h3 id=\"1-soru-tur-p-sonrası-sonda-ne-zaman-çekilir\">1. Soru: \"TUR-P\nsonrası sonda ne zaman çekilir?\"</h3>\n<ul>\n<li>Cevap: İdrar rengi açılınca (genelde 2-3. gün).</li>\n</ul>\n"}, {"id": "3.8", "t": "Cerrahi Tedavi - II (Lazer Enükleasyon - HoLEP / ThuLEP)", "h": "<h3 id=\"a-felsefe-rezeksi̇yon-mu-enükleasyon-mu\">A. FELSEFE: REZEKSİYON\nMU, ENÜKLEASYON MU?</h3>\n<p>Bu farkı anlamadan eline aleti alma.</p>\n<h3 id=\"1-tur-p-rezeksiyon\">1. TUR-P (Rezeksiyon):</h3>\n<ul>\n<li>Mantık: \"Oyma\". Prostatın içinden (üretra) başlarsın, kapsüle doğru\nküçük parçalar (cips) halinde keserek gidersin.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Risk: Kapsüle ne zaman geldiğini göremeyebilirsin (Perforasyon\nriski). Çok büyük prostatlarda işlem uzar, kanama artar.</li>\n</ul>\n<h3 id=\"1-holep-enükleasyon\">1. HoLEP (Enükleasyon):</h3>\n<ul>\n<li>Mantık: \"Soyma\". Prostatın kapsülü (kabuk) ile adenom (meyve)\narasındaki doğal plana (Avascular Plane) girersin. Adenomu bütün halde\nmesaneye atarsın.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Avantaj: Kanama neredeyse sıfırdır (Damarlar kapsülden adenoma\ngirerken mühürlenir). Prostatın boyutu süreyi çok uzatmaz.</li>\n</ul>\n<h3 id=\"b-tekni̇kler-holep-vs-thulep\">B. TEKNİKLER: HoLEP vs ThuLEP</h3>\n<p>İkisi de lazerdir ama fiziksel özellikleri farklıdır.</p>\n<h3 id=\"1-holep-holmium-laser-enucleation-of-prostate\">1. HoLEP (Holmium\nLaser Enucleation of Prostate):</h3>\n<ul>\n<li><p>Lazer: Holmium:YAG (Pulsed - Atımlı).</p></li>\n<li><p>Etki: Mekanik + Termal. Lazer atışlarıyla dokuyu hem iter\n(diseksiyon yapar) hem de keser. Kabarcık (Bubble) etkisiyle planları\naçar.</p></li>\n<li><p>Kanama Kontrolü: İyidir ama mükemmel değildir (Derin hemostazı\nazdır).</p></li>\n<li><p>Tarihçe: En çok kanıtı olan, en eski yöntemdir.</p></li>\n</ul>\n<h3 id=\"2-thulep-thulium-laser-enucleation\">2. ThuLEP (Thulium Laser\nEnucleation):</h3>\n<ul>\n<li><p>Lazer: Thulium Fiber (Continuous - Sürekli Dalga).</p></li>\n<li><p>Etki: Sadece Termal Kesici. Bıçak gibi pürüzsüz keser. Kabarcık\nçıkarmaz.</p></li>\n<li><p>Kanama Kontrolü: Mükemmeldir (Kömürleştirme yapar).</p></li>\n<li><p>Avantaj: Daha az irritasyon, daha hızlı iyileşme iddiaları\nvardır.</p></li>\n</ul>\n<h3 id=\"c-ameli̇yat-basamaklari-kafanda-canlandır\">C. AMELİYAT\nBASAMAKLARI (Kafanda Canlandır)</h3>\n<p>Bir asistan olarak ekrana baktığında ne yapıldığını anlamalısın.</p>\n<h3 id=\"1-i̇nsizyon-saat-5-ve-7\">1. İnsizyon (Saat 5 ve 7):</h3>\n<ul>\n<li>Verumontanum'un yanlarından mesane boynuna kadar çizilir.</li>\n</ul>\n<h3 id=\"1-apikal-diseksiyon-en-kritik-an\">1. Apikal Diseksiyon (En\nKritik An):</h3>\n<ul>\n<li>Veru'nun hemen önünden kapsül planı bulunur. Sfinkter lifleri burada\ngörülür. Onları koruyarak adenom yukarı doğru sıyrılır (Early Apical\nRelease).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Hata:</em> Burada sfinkteri zedelersen hasta kalıcı idrar\nkaçırır!</li>\n</ul>\n<h3 id=\"1-lateral-ve-median-lobların-ayrılması\">1. Lateral ve Median\nLobların Ayrılması:</h3>\n<ul>\n<li>Kapsül (beyaz lifli yapı) takip edilerek adenom tamamen\nserbestleştirilir. Sadece mesane boynunda (saat 12'de) asılı kalır.</li>\n</ul>\n<h3 id=\"1-adenomun-mesaneye-atılması\">1. Adenomun Mesaneye\nAtılması:</h3>\n<ul>\n<li>Son köprü kesilir ve koca adenom (top gibi) mesanenin içine\ndüşer.</li>\n</ul>\n<h3 id=\"1-morselasyon-kıyma-makinesi\">1. MORSELASYON (Kıyma\nMakinesi):</h3>\n<ul>\n<li>Mesane içine Morselatör (Mekanik öğütücü) sokulur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yüzen adenom parçaları vakumla çekilir, bıçaklarla kıyılır ve dışarı\nalınır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ KABUS SENARYOSU:</em> Morselatör mesane duvarını (mukozayı)\nkaparsa, mesaneyi deler! Asistanın görevi mesaneyi sürekli dolu\ntutmaktır (Kollabe olmasın diye).</li>\n</ul>\n<h3 id=\"d-avantajlar-ve-dezavantajlar\">D. AVANTAJLAR VE\nDEZAVANTAJLAR</h3>\n<p>Avantajlar:</p>\n<ul>\n<li><p>Boyut Bağımsız: 200 gram prostatı bile kapalı yöntemle\nalabilirsin.</p></li>\n<li><p>Kanama Az: Antikoagülan (Kan sulandırıcı) kullanan hastalarda en\ngüvenli yöntemdir.</p></li>\n<li><p>Sonda Süresi: Çok kısadır (Genelde 1 gün).</p></li>\n<li><p>Re-operasyon Riski: Çok düşüktür (%1). Çünkü geride adenom dokusu\nkalmaz (Kapsüle kadar inersin).</p></li>\n</ul>\n<p>Dezavantajlar (Komplikasyonlar):</p>\n<ul>\n<li><p>Öğrenme Eğrisi: Zordur. Asistanın öğrenmesi 20-50 vaka\nalabilir.</p></li>\n<li><p>Geçici Stres İnkontinans (%5-10):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sfinkterin gerilmesine (traksiyon) bağlıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hasta öksürünce/hapşırınca kaçırır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Yönetim:</em> Kegel egzersizleri ile 3-6 ayda %99 düzelir.\nKalıcı hasar nadirdir (&lt;%1).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Morselatör Yaralanması: Mesane perforasyonu.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"HoLEP sonrası hasta 'İdrarımı tutamıyorum' diye ağlayarak\ngeldi. Ne diyeceksin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Panik yapmayın. Bu beklenen bir durumdur (Sfinkter\nNöropraxisi). Büyük prostatı çekerken sfinkter kası biraz\nyoruldu/gerildi. 3 ay içinde kendi kendine düzelecek. Günde 100 kez\nKegel (İdrar tutma-bırakma) egzersizi yapın.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Morselasyon sırasında görüntü neden bulanıklaşır? Ne\nyapmalısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: Kanama olursa görüntü gider. Hemen irrigasyon sıvısının\nhızını artır ve mesaneyi doldur. Görüntü netleşmeden pedala basma!\n(Mesane duvarını kaparsın).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Bipolar Enükleasyon (BipoLEP) ile HoLEP arasındaki fark\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Mantık aynıdır (Portakal soyma). Sadece enerji kaynağı\nfarklıdır. Bipolar koter (loop veya plazma butonu) kullanılır. Lazer\nkadar pahalı değildir ama kanama kontrolü lazer kadar hızlı\nolmayabilir.</li>\n</ul>\n<h3 id=\"1-soru-kapsül-planını-nasıl-tanırsın\">1. Soru: \"Kapsül planını\nnasıl tanırsın?\"</h3>\n<ul>\n<li>Cevap: Adenom dokusu sarı/beyaz ve nodülerdir. Kapsül ise düz, lifli\nve parlak beyaz görünür. Damarlar kapsül yüzeyinde enlemesine\nseyreder.</li>\n</ul>\n"}, {"id": "3.9", "t": "MIST - Minimal İnvaziv Cerrahi Tedaviler", "h": "<h3 id=\"a-rezum-su-buharı-tedavisi\">A. REZUM (Su Buharı Tedavisi)</h3>\n<p>Prostatı \"pişirerek\" küçültme sanatı.</p>\n<h3 id=\"1-mekanizma\">1. Mekanizma:</h3>\n<ul>\n<li><p>Radyofrekans enerjisi ile suyu buharlaştırır. Prostat dokusu\niçine (Transizyonel Zon) 9 saniyelik buhar enjeksiyonları\nyapılır.</p></li>\n<li><p>Konvektif Isı Transferi: Buhar doku içinde hızla yayılır, hücre\nzarlarını patlatır (Nekroz). Vücut ölen dokuyu zamanla (3 ayda) emer ve\nprostat küçülür.</p></li>\n</ul>\n<h3 id=\"2-avantajları\">2. Avantajları:</h3>\n<ul>\n<li><p>Ejakülasyon Korunur: %90-95 oranında retrograd ejakülasyon olmaz\n(Mesane boynu korunur).</p></li>\n<li><p>Lokal Anestezi: Ofis şartlarında veya sedasyonla\nyapılabilir.</p></li>\n<li><p>Median Lob Tedavisi: UroLift'in aksine, Median Lobu olan\nhastalara da uygulanabilir (Buhar her yere ulaşır).</p></li>\n</ul>\n<h3 id=\"3-dezavantajları-hasta-beklentisi\">3. Dezavantajları (Hasta\nBeklentisi):</h3>\n<ul>\n<li><p>SONDA ŞARTTIR: İşlem sonrası prostat çok şişer (Ödem). Hasta 3-7\ngün sonda ile gezmek zorundadır.</p></li>\n<li><p>Geç Etki: Hasta hemen rahatlamaz. Ölü dokunun atılması 3 ayı\nbulur. İlk haftalar irritasyon (yanma) çok olur.</p></li>\n</ul>\n<h3 id=\"b-urolift-prostatik-üretral-lift\">B. UROLIFT (Prostatik Üretral\nLift)</h3>\n<p>Prostatı kesmek veya yakmak yok; \"Perdeleri kenara bağlamak\" var.</p>\n<h3 id=\"1-mekanizma-1\">1. Mekanizma:</h3>\n<ul>\n<li><p>Sistoskop benzeri bir aletle girilir.</p></li>\n<li><p>Yan lobları (Lateral Lobes) prostat kapsülüne doğru sıkıştıran\nkalıcı implantlar (Zımba gibi) yerleştirilir.</p></li>\n<li><p>Üretra kanalı mekanik olarak açılır.</p></li>\n</ul>\n<h3 id=\"2-avantajları-1\">2. Avantajları:</h3>\n<ul>\n<li><p>Anında Etki: Dokuyu yakmadığın için ödem olmaz. Hasta masadan\nkalktığı gibi rahat işer.</p></li>\n<li><p>Sonda Yok: Genellikle gerekmez (veya 1 gece).</p></li>\n<li><p>Cinsel Fonksiyon: Ejakülasyonu ve ereksiyonu %100 koruyan tek\nyöntemdir.</p></li>\n</ul>\n<h3 id=\"3-dezavantajları-ve-kontrendikasyonlar-kime-yapılmaz\">3.\nDezavantajları ve Kontrendikasyonlar (Kime Yapılmaz?):</h3>\n<ul>\n<li><p>Median Lob: Eğer hastada Median Lob varsa UroLift YAPILAMAZ (Veya\nözel teknik gerekir, başarı düşer).</p></li>\n<li><p>Büyük Prostat: &gt; 80-100 cc prostatlarda implantlar yetersiz\nkalır.</p></li>\n<li><p>Maliyet: İmplantlar çok pahalıdır.</p></li>\n</ul>\n<h3 id=\"c-prostat-arter-emboli̇zasyonu-pae\">C. PROSTAT ARTER\nEMBOLİZASYONU (PAE)</h3>\n<p>Ürologların değil, Girişimsel Radyologların yaptığı ama hastayı bizim\nseçtiğimiz yöntem.</p>\n<h3 id=\"1-mekanizma-2\">1. Mekanizma:</h3>\n<ul>\n<li><p>Kasık damarından (Femoral Arter) anjiyo ile girilir.</p></li>\n<li><p>Prostatı besleyen Prostatik Arterlere mikro-kürecikler\n(partiküller) verilir.</p></li>\n<li><p>Damar tıkanır -&gt; Prostat beslenemez -&gt; İskemi ve Atrofi\n(Küçülme) olur.</p></li>\n</ul>\n<h3 id=\"2-kime-yapalım-i̇deal-hasta\">2. Kime Yapalım? (İdeal Hasta):</h3>\n<ul>\n<li><p>Çok Yaşlı / Komorbid: Anestezi alması imkansız olan, kan\nsulandırıcı (Coumadin/Plavix) kesilemeyen hastalar.</p></li>\n<li><p>Dev Prostatlar: Cerrahi riskli ise.</p></li>\n<li><p>İnatçı Hematüri: Prostattan kaynaklanan kanamayı durdurmak için\nhayat kurtarıcıdır.</p></li>\n</ul>\n<h3 id=\"3-riskler\">3. Riskler:</h3>\n<ul>\n<li><p>Non-Target Embolizasyon: Yanlışlıkla mesane veya rektum damarı\ntıkanırsa doku nekrozu (çürüme) olur.</p></li>\n<li><p>Radyasyon maruziyeti.</p></li>\n</ul>\n<h3 id=\"d-aquablation-robotik-su-jeti\">D. AQUABLATION (Robotik Su\nJeti)</h3>\n<p>Robotik cerrahinin BPH'daki en yeni oyuncusu.</p>\n<ul>\n<li><p>Mekanizma: TRUS (Ultrason) rehberliğinde, robotik bir kol Yüksek\nBasınçlı Su Jeti ile prostat dokusunu (ısı kullanmadan)\nparçalar/keser.</p></li>\n<li><p>Avantajı:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Isı Hasarı Yok: Sinirleri korur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hız: Prostat 30cc de olsa 150cc de olsa işlem süresi çok kısadır\n(Robot tarar ve keser).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Dezavantaj: Kanama kontrolü lazer kadar iyi değildir (Isı olmadığı\niçin damarlar mühürlenmez). İşlem sonrası traksiyon veya koterizasyon\ngerekebilir.</li>\n</ul>\n<h3 id=\"e-açik--roboti̇k-basi̇t-prostatektomi̇-millin--freyer\">E. AÇIK /\nROBOTİK BASİT PROSTATEKTOMİ (Millin / Freyer)</h3>\n<p>MIST değil ama cerrahinin son durağıdır.</p>\n<ul>\n<li>Kime:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Prostat &gt; 80-100 cc (EAU Kılavuzu).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eşlik eden dev mesane taşı veya divertikülü olanlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ortopedik sorunu (Litotomi pozisyonu) olanlar (Bacaklarını\naçamayanlar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yöntem:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Açık (Millin): Göbek altı kesi. Mesane açılmaz, kapsülden girilir.\n(Kanama riski yüksek).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Robotik (RASP): Açık cerrahinin aynısıdır ama laparoskopik/robotik\nyapılır. Kanama az, yatış kısadır. HoLEP yapamayan merkezler için büyük\nprostatlarda altın standarttır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Genç hasta (45 yaş), cinsel hayatı çok aktif, prostatı 40cc\nama Median Lobu var. UroLift mi, Rezum mu?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"REZUM. Çünkü UroLift median lobu ekarte edemez, kanalın\nortasında tıkaç gibi kalır. Rezum buharı ise median lobu eritir.\nEjakülasyonu koruma oranı da %95'tir.\"</li>\n</ul>\n<h3 id=\"1-soru-hangi-hastaya-pae-embolizasyon-önerilmez\">1. Soru: \"Hangi\nhastaya PAE (Embolizasyon) önerilmez?\"</h3>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Kanser Şüphesi Olanlar: Patoloji alınamaz, PSA takibi\nbozulur.</p></li>\n<li><p>Damar Yapısı Bozuk Olanlar: Ağır ateroskleroz (Damar\nkireçlenmesi) nedeniyle kateter ilerletilemez.</p></li>\n<li><p>Böbrek Yetmezliği: Kontrast madde nefropati yapar.</p></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Soru: \"Rezum sonrası hasta 1. hafta kontrole geldi, 'Hocam\neskisinden daha kötü işiyorum' diye bağırıyor. Hata mı yaptık?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır, bu beklenen süreç (Post-op Ödem). Prostat dokusu\nyandığı için şişti. Nekrotik dokular atıldıkça (3. aydan sonra) kanal\naçılacak. Hastayı sakinleştir ve sabırlı olmasını söyle.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"MIST yöntemleri (Rezum/UroLift) TUR-P kadar dayanıklı mı?\nNüks eder mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: TUR-P kadar uzun ömürlü değildir. 5 yıllık nüks (tekrar\ncerrahi) oranları %10-15 civarındadır (TUR-P'de %3-5). Bu bedel, cinsel\nfonksiyonu korumak için ödenir.</li>\n</ul>\n"}, {"id": "3.10", "t": "Noktüri ve Poliüri Yönetimi", "h": "<h3 id=\"a-matemati̇ksel-tanimlar-ezberle\">A. MATEMATİKSEL TANIMLAR\n(Ezberle)</h3>\n<p>Hastanın \"Gece çok kalkıyorum\" demesi yetmez. Bunu İşeme Günlüğü\n(FVC) ile ispatlamalısın.</p>\n<h3 id=\"1-noktüri\">1. Noktüri:</h3>\n<ul>\n<li><p>Ana uyku evresinde, idrar yapmak için uyanmaktır. (Uyuyamayıp\ntuvalete gitmek değil!).</p></li>\n<li><p>Genellikle ≥ 2 kez kalkmak yaşam kalitesini bozar ve tedavi\ngerektirir.</p></li>\n</ul>\n<h3 id=\"2-24-saatlik-poliüri-global-poliüri\">2. 24 Saatlik Poliüri\n(Global Poliüri):</h3>\n<ul>\n<li><p>Tanım: Günlük toplam idrar hacminin \\&gt; 40 ml/kg (veya &gt;\n3 Litre) olmasıdır.</p></li>\n<li><p>Sebep: Diyabet (Mellitus/Insipidus), Polidipsi (Psikolojik su\niçme).</p></li>\n<li><p>Yönetim: Bu hasta Ürolojik değildir! Dahiliye/Endokrin'e sevk\net.</p></li>\n</ul>\n<h3 id=\"3-noktürnal-poliüri-np---bi̇zi̇m-konumuz\">3. Noktürnal Poliüri\n(NP) - (BİZİM KONUMUZ):</h3>\n<ul>\n<li><p>Tanım: 24 saatlik idrar normaldir, ancak üretim geceye\nkaymıştır.</p></li>\n<li><p>Noktürnal Poliüri İndeksi (NPI):<br />\n\\NPI = \\frac{Gece İdrar Hacmi}{24 Saatlik Toplam Hacim}</p></li>\n<li><p>Sınır:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gençlerde: \\&gt; 20</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yaşlılarda (&gt;65 yaş): \\&gt; 33 (Gecenin idrarı, günün 3'te 1'ini\ngeçiyorsa).</li>\n</ul>\n<h3 id=\"b-eti̇yoloji̇-suçlu-ki̇m\">B. ETİYOLOJİ: SUÇLU KİM?</h3>\n<p>Noktüri bir hastalık değil, semptomdur. Altında yatan 3 ana mekanizma\nvardır:</p>\n<ol type=\"1\">\n<li>Global Poliüri: (Diyabet, çok su içme).</li>\n</ol>\n<h3 id=\"2-mesane-depolama-sorunu-azalan-kapasite\">2. Mesane Depolama\nSorunu (Azalan Kapasite):</h3>\n<ul>\n<li>BPH (Tıkanıklık yüzünden mesane hassaslaşır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>OAB (Aşırı Aktif Mesane).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Taş, Tümör.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Özellik:</em> Hasta az az, sık sık işer. (Gece 5 kere kalkar ama\ntoplam 300 cc işer).</li>\n</ul>\n<h3 id=\"1-noktürnal-poliüri-sistemik\">1. Noktürnal Poliüri\n(Sistemik):</h3>\n<ul>\n<li>Kalp Yetmezliği (KKY): Gündüz bacaklarda biriken ödem, gece yatınca\ndolaşıma katılır -&gt; Böbrek süzmeye başlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Uyku Apnesi (OSAS): Hipoksi -&gt; Kalpten ANP (Atriyal Natriüretik\nPeptid) salgılanır -&gt; Tuz ve su atılımı artar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Venöz Yetmezlik: Varisler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Özellik:</em> Hasta bol bol işer. (Gece 2 kere kalkar ama her\nseferinde 400-500 cc işer).</li>\n</ul>\n<h3 id=\"c-tani-i̇şeme-günlüğü-fvc-olmadan-asla\">C. TANI: İŞEME GÜNLÜĞÜ\n(FVC) OLMADAN ASLA!</h3>\n<p>Tekrar ediyorum: İşeme günlüğü olmayan hastaya ilaç yazma.</p>\n<ul>\n<li>Eğer hasta gece toplam 1500 cc idrar yapıyorsa, sen ona prostat\nilacı (Alfa bloker) versen ne yazar? O idrar bir şekilde çıkacak!</li>\n</ul>\n<h3 id=\"d-tedavi̇-strateji̇si̇\">D. TEDAVİ STRATEJİSİ</h3>\n<p>Önce davranışsal, sonra medikal tedavi.</p>\n<h3 id=\"1-davranışsal-tedaviler-i̇lk-basamak\">1. Davranışsal Tedaviler\n(İlk Basamak):</h3>\n<ul>\n<li><p>Sıvı Kısıtlaması: Akşam yemeğinden sonra (saat 18:00-19:00) sıvı\nalımını kes.</p></li>\n<li><p>Kafein/Alkol: Diüretik etkisi vardır, akşam içilmemeli.</p></li>\n<li><p>Bacak Elevasyonu: Akşam saatlerinde ayaklarını kalp seviyesine\nkaldır. (Ödemin gece değil, akşam atılmasını sağlar).</p></li>\n<li><p>Varis Çorabı: Gündüz takılmalı.</p></li>\n<li><p>Diüretik Saati: Eğer tansiyon ilacı (Furosemid/Tiazid)\nkullanıyorsa, sabah değil ÖĞLEDEN SONRA (14:00-16:00) almasını söyle.\nBöylece geceye kadar idrarı atar, gece rahat uyur.</p></li>\n</ul>\n<h3 id=\"2-medikal-tedavi-desmopressi̇n-minirin\">2. Medikal Tedavi:\nDESMOPRESSİN (Minirin)</h3>\n<ul>\n<li><p>Nedir: Sentetik Vazopressin (ADH) analoğudur. Böbrekten suyun\ngeri emilimini artırır, idrarı azaltır.</p></li>\n<li><p>Kime Verilir:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Noktürnal Poliürisi kanıtlanmış (NPI &gt; %33).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Diğer nedenler (KKY, OSAS) dışlanmış veya kontrol altına alınmış\nhastalara.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Formlar:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tablet: 0.1 - 0.2 mg.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Melt (Dilaltı): 60 mcg - 120 mcg. (Kadınlarda daha düşük doz\nyeterlidir - 25 mcg).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Zamanlama: Yatmadan 1 saat önce alınır. Su içilmez!</li>\n</ul>\n<h3 id=\"e-kri̇ti̇k-güvenli̇k-uyarisi-hi̇ponatremi̇\">E. KRİTİK GÜVENLİK\nUYARISI: HİPONATREMİ</h3>\n<p>Desmopressin masum bir ilaç değildir. Yaşlılarda ölümcül\nolabilir.</p>\n<ul>\n<li><p>Risk: İlaç suyu tutar -&gt; Kanı sular -&gt; Sodyum (Na)\nDüşer.</p></li>\n<li><p>Semptomlar: Bulantı, kusma, baş ağrısı, konfüzyon, nöbet,\nkoma.</p></li>\n<li><p>Kontrendikasyonlar (Kime VERİLMEZ?):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>&gt; 65 yaş (Çok dikkatli verilmeli).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kalp Yetmezliği (Sıvı tutulumu kalbi yorar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hiponatremisi olanlar (Na &lt; 135 mEq/L).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Takip Protokolü (Zorunlu):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İlacı başlamadan önce Na bak.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Başladıktan 3. gün ve 7. gün Na kontrolü yap. Düşüyorsa ilacı\nkes!</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 3 Final Soruları)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastanın gece idrar hacmi 1200 cc (Poliüri var). Ancak\nhastada aynı zamanda prostat büyümesi (BPH) de var. Önce hangisini\ntedavi edelim?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Önce BPH'yı (Alfa-bloker ile) tedavi ederiz. Çünkü\ntıkanıklık düzelirse mesane kapasitesi artabilir. Ancak hasta\nbilgilendirilmeli: 'Prostat ilacı gece kalkmanı tamamen bitirmez, sadece\nazaltır.' Eğer 3 ay sonra şikayet sürerse Desmopressin eklenir.\"</li>\n</ul>\n<h3\nid=\"1-soru-uyku-apnesi-horlama-olan-hastaya-desmopressin-verilir-mi\">1.\nSoru: \"Uyku Apnesi (Horlama) olan hastaya Desmopressin verilir mi?\"</h3>\n<ul>\n<li>Cevap: Hayır, verilmemeli.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Çünkü sorun ADH eksikliği değil, kalbin ANP salgılamasıdır. Tedavi\nCPAP cihazıdır. Cihazı kullanınca noktüri kendiliğinden geçer.\nDesmopressin verirsen sıvı yükünü artırıp apneyi/kalbi\nkötüleştirebilirsin.</li>\n</ul>\n<h3 id=\"1-soru-kadınlarda-desmopressin-dozu-neden-daha-düşüktür\">1.\nSoru: \"Kadınlarda Desmopressin dozu neden daha düşüktür?\"</h3>\n<ul>\n<li>Cevap: V2 reseptör genindeki duyarlılık farkından dolayı kadınlar\nilaca daha hassastır. 25 mcg (Melt) doz çoğu kadında yeterlidir.\nErkeklerde genelde 50-100 mcg gerekir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Yaşlı bir hastada Desmopressin başladın, 3. gün sodyumu 130'a\ndüştü. Ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: İlacı hemen kes. Sıvı kısıtlaması yap. Sodyumun normale\ndönmesini bekle. Bir daha bu hastaya bu ilacı verme (Hiponatremiye\neğilimli demektir).</li>\n</ul>\n"}]}, {"n": 4, "t": "Ürolitiyazis (Taş Hastalığı)", "s": [{"id": "4.1", "t": "Epidemiyoloji ve Etyopatogenez", "h": "<h3 id=\"a-epi̇demi̇yoloji̇-ki̇mde-taş-olur\">A. EPİDEMİYOLOJİ: KİMDE TAŞ\nOLUR?</h3>\n<p>Taş hastalığı (Ürolithiazis) hayat boyu görülme oranı erkeklerde\nyaklaşık %10-12, kadınlarda %5-6'dır. Ancak son yıllarda beslenme\nalışkanlıkları ve obezite nedeniyle kadın-erkek oranı birbirine\nyaklaşmaktadır.</p>\n<ul>\n<li><p>Yaş: En sık 30-50 yaşları arasında görülür.</p></li>\n<li><p>İklim: Sıcak iklimlerde (Türkiye gibi) dehidratasyon nedeniyle\ninsidans artar (\"Taş Kuşağı\").</p></li>\n<li><p>Rekürrens (Tekrarlama): Bir kez taş düşüren birinin 5-10 yıl\niçinde ikinci taşı düşürme olasılığı %50'dir. Bu yüzden \"Metafilaksi\"\n(önleme) çok önemlidir.</p></li>\n</ul>\n<h3 id=\"b-taş-oluşum-teori̇leri̇-hoca-ne-sorar\">B. TAŞ OLUŞUM TEORİLERİ\n(Hoca Ne Sorar?)</h3>\n<p>Taş durup dururken oluşmaz. İdrardaki denge bozulmalıdır.</p>\n<ol type=\"1\">\n<li><p>Süpersatürasyon (Aşırı Doygunluk): İdrardaki kristal yapıcı\nmaddelerin (Kalsiyum, Oksalat, Ürik asit) konsantrasyonu, çözünürlük\nsınırını aşarsa kristaller çökmeye başlar.</p></li>\n<li><p>İnhibitör Eksikliği: Normalde idrarda taş oluşumunu engelleyen\nmaddeler vardır. En önemlileri Sitrat, Magnezyum ve Pirofosfat'tır.\nSitrat düşükse (Hipositratüri) taş riski artar.</p></li>\n</ol>\n<h3 id=\"3-randall-plakları-kritik-bilgi\">3. Randall Plakları (Kritik\nBilgi!):</h3>\n<ul>\n<li>Nedir? Renal papillaların derinlerinde, henle kulpunun bazal\nmembranında biriken Kalsiyum Fosfat birikintileridir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Neden Önemli? Bu plaklar papilla yüzeyine erozyon yaparak açılırlar\nve idrarla temas ederler. Kalsiyum oksalat kristalleri bu \"plak\" üzerine\nyapışarak büyür. Yani plak, taş için bir \"çapa\" görevi görür.</li>\n</ul>\n<h3 id=\"c-taş-ti̇pleri̇-ve-özelli̇kleri̇\">C. TAŞ TİPLERİ VE ÖZELLİKLERİ</h3>\n<p>Hangi taşın neye benzediğini ve neden oluştuğunu bilmek tedaviyi\nbelirler.</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Taş Tipi</th>\n<th>Sıklık</th>\n<th>Özellik</th>\n<th>Radyoloji (X-Ray)</th>\n<th>pH İlişkisi</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kalsiyum Oksalat</td>\n<td>%75-80</td>\n<td>En sık görülen tip. Diyet ve genetik odaklı.</td>\n<td>Radyoopak (Belirgin beyaz)</td>\n<td>pH'tan bağımsız</td>\n</tr>\n<tr class=\"even\">\n<td>Kalsiyum Fosfat</td>\n<td>%5-10</td>\n<td>Renal Tübüler Asidoz (RTA) veya Hiperparatiroidi düşündürür.</td>\n<td>Radyoopak</td>\n<td>Alkali pH (&gt;6.5)</td>\n</tr>\n<tr class=\"odd\">\n<td>Ürik Asit</td>\n<td>%5-10</td>\n<td>Obezite, Gut, Diabet. İlaçla eritilebilir!</td>\n<td>Radyolüsent (Görünmez!)</td>\n<td>Asidik pH (&lt;5.5)</td>\n</tr>\n<tr class=\"even\">\n<td>Struvit (Magnezyum Amonyum Fosfat)</td>\n<td>%5-10</td>\n<td>Enfeksiyon Taşı. Üreaz üreten bakteriler (Proteus, Klebsiella)\nyapar.</td>\n<td>Semiopak (Geyik boynuzu/Staghorn)</td>\n<td>Alkali pH (&gt;7.0)</td>\n</tr>\n<tr class=\"odd\">\n<td>Sistin</td>\n<td>%1</td>\n<td>Nadir, Genetik (Sistinüri). Çok serttir, ESWL'ye dirençlidir.</td>\n<td>Semiopak (Buzlu cam)</td>\n<td>Asidik pH</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"d-metaboli̇k-ri̇sk-faktörleri̇\">D. METABOLİK RİSK FAKTÖRLERİ</h3>\n<p>Taş analizinde en sık bulduğumuz anormallikler:</p>\n<ul>\n<li><p>Hiperkalsiüri: İdrarda kalsiyum yüksekliği. (En sık metabolik\nbozukluk).</p></li>\n<li><p>Hiperoksalüri: Ispanak, kuruyemiş, çay tüketimi veya barsak\nemilim bozuklukları (Crohn vb.) sonucu.</p></li>\n<li><p>Hipositratüri: İdrar pH'ını yükselten ve kalsiyuma bağlanan\nsitratın azlığı. (Distal RTA'da sık görülür).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3 id=\"1-soru-üreaz-üreten-bakteriler-proteus-gibi-nasıl-taş-yapar\">1.\nSoru: \"Üreaz üreten bakteriler (Proteus gibi) nasıl taş yapar?\"</h3>\n<ul>\n<li>Cevap: Üreaz enzimi, üreyi amonyak ve CO2'ye parçalar. Amonyak idrar\npH'ını hızla yükseltir (Alkali yapar). Alkali ortamda magnezyum amonyum\nfosfat kristalleri çöker ve kısa sürede koca bir \"Staghorn\" (geyik\nboynuzu) taş oluşur.</li>\n</ul>\n<h3 id=\"1-soru-bir-taşın-röntgende-düsg-görünmemesi-ne-anlama-gelir\">1.\nSoru: \"Bir taşın röntgende (DÜSG) görünmemesi ne anlama gelir?\"</h3>\n<ul>\n<li>Cevap: Taşın Radyolüsent olduğunu düşündürür. Akla ilk gelen Ürik\nAsit taşıdır. Diğer ihtimaller Ksantin ve ilaç taşlarıdır\n(İndinavir).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Kronik ishali veya Crohn hastalığı olanlarda neden sık\nkalsiyum oksalat taşı görülür?\"</li>\n</ol>\n<ul>\n<li>Cevap: Bağırsakta yağ emilimi bozulunca, yağlar kalsiyumu bağlar.\nNormalde oksalata bağlanması gereken kalsiyum kalmadığı için \"serbest\noksalat\" emilir ve böbrekten atılır (Enterik Hiperoksalüri).</li>\n</ul>\n<h3 id=\"1-soru-hangi-taşları-medikal-olarak-eritebiliriz-kemolizis\">1.\nSoru: \"Hangi taşları medikal olarak eritebiliriz (Kemolizis)?\"</h3>\n<ul>\n<li>Cevap: Saf Ürik Asit taşlarını idrarı alkalize ederek (Potasyum\nSitrat ile pH &gt; 6.5 yaparak) eritebiliriz.</li>\n</ul>\n"}, {"id": "4.2", "t": "Tanı ve Görüntüleme Stratejileri", "h": "<h3 id=\"a-altin-standart-kontrastsiz-heli̇kal-bt-ncct\">A. ALTIN STANDART:\nKONTRASTSIZ HELİKAL BT (NCCT)</h3>\n<p>Ürolithiazis şüphesinde ilk tercih ve altın standart kontrastsız\ndüşük doz BT'dir.</p>\n<ul>\n<li><p>Duyarlılık ve Özgüllük: %95'in üzerindedir.</p></li>\n<li><p>BT'nin Bize Söyledikleri:</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Taşın tam lokalizasyonu (Üst, orta, alt üreter veya\nböbrek).</p></li>\n<li><p>Taşın boyutu (Üç boyutlu ölçüm: En büyük çap değil, hacim\nönemlidir).</p></li>\n<li><p>Taşın dansitesi (Hounsfield Unit - HU): Taşın sertliğini\nbelirler.</p></li>\n<li><p>Cilt-Taş Mesafesi (SSD): ESWL başarısını öngörmek için.</p></li>\n<li><p>Ek patolojiler (Apendisit, divertikülit, anevrizma gibi ayırıcı\ntanılar).</p></li>\n</ol>\n<h3 id=\"b-dansi̇te-hu-sertli̇k-anali̇zi̇\">B. DANSİTE (HU): SERTLİK\nANALİZİ</h3>\n<p>Radyoloji raporunda HU değerini görmek, cerrahi stratejini\nbelirler:</p>\n<ul>\n<li><p>&lt; 500 HU: Yumuşak taş (Ürik asit). ESWL veya Dusting\n(tozlaştırma) ile kolay biter.</p></li>\n<li><p>500 - 1000 HU: Orta sertlik (Kalsiyum oksalat dihidrat).</p></li>\n<li><p>&gt; 1000 HU: Çok sert taş (Kalsiyum oksalat monohidrat veya\nSistin). ESWL başarısı düşüktür; direkt üreteroskopi (URS/RIRS)\ndüşünülmelidir.</p></li>\n</ul>\n<h3 id=\"c-düşük-doz-bt-low-dose-ct\">C. DÜŞÜK DOZ BT (LOW-DOSE CT)</h3>\n<p>EAU Kılavuzu, radyasyon maruziyetini azaltmak için vücut kitle\nindeksi (BMI) &lt; 30 olan hastalarda \"Low-dose CT\" protokolünü önerir.\nTanısal doğruluğu standart BT'ye yakındır.</p>\n<h3 id=\"d-di̇ğer-görüntüleme-araçlari\">D. DİĞER GÖRÜNTÜLEME ARAÇLARI</h3>\n<h3 id=\"1-ultrasonografi-usg\">1. Ultrasonografi (USG):</h3>\n<ul>\n<li>İlk basamak değerlendirmede güvenli ve ucuzdur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Taşın kendisinden ziyade, yaptığı etkiyi (Hidronefroz) görmek için\nharikadır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kısıtlılık: 5 mm altındaki üreter taşlarını ve orta üreter taşlarını\nçoğu zaman kaçırır.</li>\n</ul>\n<h3 id=\"1-düsg-direkt-üriner-sistem-grafisi\">1. DÜSG (Direkt Üriner\nSistem Grafisi):</h3>\n<ul>\n<li>Tanıdan ziyade takip için kullanılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>BT'de görülen taş röntgende de görülüyorsa (radyoopak ise), ESWL\nsonrası taşın kırılıp kırılmadığını kontrol etmek için sadece DÜSG\nçekmek yeterlidir (Hastayı BT radyasyonundan korur).</li>\n</ul>\n<h3 id=\"1-ivp-i̇ntravenöz-piyelografi\">1. IVP (İntravenöz\nPiyelografi):</h3>\n<ul>\n<li>Tarihsel önemi büyüktür ama artık rutin tanıda NCCT'nin yerini\ntutmaz.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sadece anatominin çok karmaşık olduğu (At nalı böbrek, üreteral\ndarlıklar) durumlarda cerrahi öncesi yol haritası için nadiren\nistenir.</li>\n</ul>\n<h3 id=\"e-özel-durum-gebelerde-görüntüleme\">E. ÖZEL DURUM: GEBELERDE\nGÖRÜNTÜLEME</h3>\n<p>Gebelikte radyasyon kontrendikedir.</p>\n<ol type=\"1\">\n<li><p>İlk Tercih: Ultrasonografi.</p></li>\n<li><p>USG yetersiz kalırsa: MR Ürografi (Taşın kendisini değil,\nobstrüksiyon seviyesini gösterir).</p></li>\n<li><p>Hala tanı konulamadıysa (Son çare): Düşük doz BT (2. ve 3.\ntrimesterde, hastayla riskler konuşularak).</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"NCCT raporunda taşın HU değerini 1300 gördün. Hastaya ESWL\nplanlar mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. 1000 HU üzerindeki taşlar çok serttir ve ESWL ile\nkırılma olasılıkları çok düşüktür. Bu hastaya endoskopik cerrahi (URS\nveya RIRS) önermek daha doğru olur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"BT'de üreter taşı gördüğün her hastaya kontrastlı film (IVP\nveya kontrastlı BT) gerekir mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Rutin tanıda gerekmez. Ancak renal anatominin\ndeğerlendirilmesi gereken anomaliler varsa veya böbrek fonksiyonu\nşüpheliyse (non-fonksiyon olasılığı) cerrahi planlama için\neklenebilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"BT'de taşın etrafındaki 'Rim Sign' (Hale belirtisi) neyi\nifade eder?\"</li>\n</ol>\n<ul>\n<li>Cevap: Üreter taşının etrafındaki üreter duvarının ödemli olduğunu\ngösterir. Taşı flebolitten (damar içi kireçlenme) ayırt etmemizi\nsağlar.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sadece USG ile hidronefroz gördüğün bir hastada üreter taşı\ndiyebilir misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: Hayır. Hidronefroz taşın habercisi olabilir ama kesin tanı\niçin taşın kendisinin gösterilmesi (NCCT ile) şarttır. Gebelik veya\nvezikoüreteral reflü gibi durumlar taşsız hidronefroz yapabilir.</li>\n</ul>\n"}, {"id": "4.3", "t": "Akut Renal Kolik Yönetimi", "h": "<p>Renal kolik ağrısı, taşın üreteri tıkaması sonucu proksimalde basınç\nartışı ve üreter düz kaslarının spazmı nedeniyle oluşur.</p>\n<h3 id=\"a-analjezi̇-ağrıyı-nasıl-keseceğiz\">A. ANALJEZİ (Ağrıyı Nasıl\nKeseceğiz?)</h3>\n<p>EAU ve AUA kılavuzları bu konuda çok nettir.</p>\n<h3 id=\"1-i̇lk-tercih-nsai̇i̇-non-steroid-anti-i̇nflamatuar-i̇laçlar\">1. İlk\nTercih: NSAİİ (Non-Steroid Anti-İnflamatuar İlaçlar):</h3>\n<ul>\n<li>İlaçlar: Diklofenak (Dikloron/Miyorel), İndometazin, İbuprofen.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Neden? Sadece ağrıyı kesmezler, aynı zamanda prostaglandin sentezini\ninhibe ederek renal kan akımını ve üreter ödemini azaltırlar. Bu da\npelvik basıncı düşürür.</li>\n</ul>\n<h3 id=\"1-i̇kinci-tercih-opioidler\">1. İkinci Tercih: Opioidler:</h3>\n<ul>\n<li>İlaçlar: Hidromorfon, Morfin, Pethidin (Aldolan).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kullanım: NSAİİ kontrendike olduğunda veya ağrı kontrol altına\nalınamadığında eklenir. Bulantı/kusma yapma riskleri yüksektir.</li>\n</ul>\n<h3 id=\"1-spazmolitikler-buscopan-vb\">1. Spazmolitikler (Buscopan\nvb.):</h3>\n<ul>\n<li>Rutin kullanımda ağrı krizini dindirmede plasebodan üstünlüğü\nkanıtlanmamıştır. Kılavuzlarda \"önerilmez\" düzeyindedir.</li>\n</ul>\n<h3 id=\"b-aci̇l-dekompresyon-kimin-böbreğini-hemen-kurtarmalıyız\">B. ACİL\nDEKOMPRESYON (Kimin Böbreğini Hemen Kurtarmalıyız?)</h3>\n<p>Her taş hastası acil ameliyat edilmez ama bazıları **\"HAYATİ\nACİL\"**dir. Eğer aşağıdaki 3 durumdan biri varsa, taşı kırmayı\nbeklemeden böbreği drene etmelisin:</p>\n<ol type=\"1\">\n<li><p>Tıkanıklık + Enfeksiyon (Ürosepsis): Hastanın ateşi varsa,\nCRP/WBC yüksekse ve hidronefrozu varsa bu bir cerrahi acildir. İrinli\nidrar (Piyonefroz) içeride hapsolmuştur.</p></li>\n<li><p>Durdurulamayan Ağrı: Maksimum doz analjeziye rağmen hastanın\nağrısı kesilmiyorsa.</p></li>\n<li><p>Risk Altındaki Böbrek: * Soliter böbrekte tam\ntıkanıklık.</p></li>\n</ol>\n<ul>\n<li>Bilateral (iki taraflı) tıkanıklık.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kreatinin yükselmesi (Akut Böbrek Hasarı).</li>\n</ul>\n<h3 id=\"c-drenaj-yöntemleri̇-jj-stent-vs-perkütan-nefrostomi̇-pns\">C.\nDRENAJ YÖNTEMLERİ: JJ STENT VS PERKÜTAN NEFROSTOMİ (PNS)</h3>\n<p>Hoca vizitte sorar: \"Enfekte hidronefrozda hangisini yapalım?\"</p>\n<ul>\n<li>JJ Stent (Double-J): * Ameliyathane ve anestezi gerektirir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Retrograd (aşağıdan yukarı) takılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Taşın yanından geçilmeye çalışılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Perkütan Nefrostomi (PNS): * Lokal anestezi ile ultrason eşliğinde\nciltten yapılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Avantajı: Tıkalı ve kirli sistemden \"yukarıdan\" direk çıkış sağlar.\nEğer hasta septik ve instabilse (tansiyonu düşükse), ameliyathaneye\nindirmeden yatağında PNS takmak hayat kurtarır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>EAU Görüşü: İki yöntem de drenaj açısından eşittir; ancak sepsisteki\nhastada hangisi daha hızlı ve güvenli uygulanabiliyorsa o\nseçilmelidir.</li>\n</ul>\n<h3 id=\"d-taşin-kendi̇si̇ne-aci̇l-müdahale-yapilir-mi\">D. TAŞIN KENDİSİNE\nACİL MÜDAHALE YAPILIR MI?</h3>\n<p>Genellikle HAYIR. * Eğer enfeksiyon varsa, önce drenaj yapıp\nantibiyotik başlanır; taş tedavisi (URS/ESWL) 1-2 hafta sonraya,\nenfeksiyon gerilediğinde planlanır.</p>\n<ul>\n<li>İstisna: Enfeksiyon yoksa, sadece ağrı varsa ve taş küçükse (distal\nüreterde), bazen \"Primary URS\" (acil üreteroskopi) yapılarak taş o an\nalınabilir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Acile gelen taş hastasında ilk hangi kan tetkiklerini\nistersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: Kreatinin (Böbrek fonksiyonu için), WBC ve CRP (Enfeksiyon\niçin), Tam İdrar Tahlili (Nitrit ve lökosit varlığı için).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta septik, ateşi 39, tansiyonu 80/40 ve üreterde 8 mm taşı\nvar. Direkt üreteroskopi yapıp taşı kıralım mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: KESİNLİKLE HAYIR. Septik hastada üreteroskopi sırasında\nverilen irrigasyon sıvısı, bakterilerin kan dolaşımına geçişini\n(pyelovenöz reflü) artırarak hastayı septik şoka sokar ve öldürür. Önce\nsadece drenaj (JJ veya PNS), sonra taş tedavisi.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"NSAİİ kullanırken dikkat etmen gereken en önemli hasta grubu\nhangisidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: GFR'si düşük (Böbrek yetmezliği olan) hastalar ve mide ülseri\nolanlar. NSAİİ'ler böbrek perfüzyonunu azaltarak yetmezliği\nderinleştirebilir.</li>\n</ul>\n<h3 id=\"1-soru-sessiz-ağrısız-taş-tehlikeli-midir\">1. Soru: \"Sessiz\n(Ağrısız) Taş tehlikeli midir?\"</h3>\n<ul>\n<li>Cevap: Evet. Bazen tam tıkanıklık ağrı yapmayabilir\n(Kronikleşmişse). Bu durum böbreğin sessizce fonksiyonunu kaybetmesine\n(Afonskiyon böbrek) neden olabilir.</li>\n</ul>\n"}, {"id": "4.4", "t": "Medikal Ekspulsif Tedavi (MET)", "h": "<h3 id=\"a-taşin-kendi̇li̇ği̇nden-düşme-olasiliği-spontan-pasaj\">A. TAŞIN\nKENDİLİĞİNDEN DÜŞME OLASILIĞI (Spontan Pasaj)</h3>\n<p>Bir taşın düşüp düşmeyeceğini belirleyen en önemli iki faktör boyut\nve lokalizasyondur.</p>\n<ul>\n<li>Boyut:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>&lt; 5 mm: %70-90 oranında kendiliğinden düşer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>5 - 10 mm: %40-50 oranında düşer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>&gt; 10 mm: Kendiliğinden düşme olasılığı çok düşüktür (&lt;%10),\ncerrahi düşünülmelidir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Lokalizasyon: Distal üreterdeki (mesaneye yakın) taşlar,\nproksimaldeki (böbreğe yakın) taşlara göre çok daha kolay düşer.</li>\n</ul>\n<h3 id=\"b-met-kullanilan-i̇laçlar-ve-mekani̇zma\">B. MET: KULLANILAN\nİLAÇLAR VE MEKANİZMA</h3>\n<p>MET'in amacı, üreter düz kaslarını gevşeterek taşın ilerlemesini\nkolaylaştırmak ve spazmı azaltmaktır.</p>\n<h3 id=\"1-alfa-blokerler-örn-tamsulosin-silodosin\">1. Alfa-Blokerler\n(Örn: Tamsulosin, Silodosin):</h3>\n<ul>\n<li>Mekanizma: Üreterin distal 1/3'lük kısmında yoğun olarak Alfa-1a ve\n1d reseptörleri bulunur. Alfa-blokerler bu reseptörleri bloke ederek\nüreter düz kaslarını gevşetir, bazal tonusu düşürür ve peristaltizmi\ndüzenler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>EAU 2025/2026 Görüşü: Alfa-blokerler, özellikle &gt; 5 mm ve distal\nüreter taşlarında taşın düşme hızını ve oranını artırır, kolik\nataklarını azaltır. 5 mm altındaki taşlarda etkisi plaseboya yakındır\nama yine de konfor için verilebilir.</li>\n</ul>\n<h3 id=\"1-kalsiyum-kanal-blokerleri-örn-nifedipin\">1. Kalsiyum Kanal\nBlokerleri (Örn: Nifedipin):</h3>\n<ul>\n<li>Eskiden çok popülerdi ancak güncel kılavuzlarda alfa-blokerlerin\netkinliği daha yüksek olduğu için \"ikinci planda\" kalmıştır.</li>\n</ul>\n<h3 id=\"1-kortikosteroidler-örn-metilprednizolon\">1. Kortikosteroidler\n(Örn: Metilprednizolon):</h3>\n<ul>\n<li>Tek başına kullanılmazlar. Alfa-blokerlerle kombine edildiklerinde,\ntaşın etrafındaki üreter ödemini azaltarak pasajı kolaylaştırabilirler\n(Genelde 3-5 günlük kısa kürler).</li>\n</ul>\n<h3 id=\"c-met-ne-kadar-süre-uygulanmali\">C. MET NE KADAR SÜRE\nUYGULANMALI?</h3>\n<p>Hoca vizitte sorar: \"Ne kadar bekleyelim?\"</p>\n<ul>\n<li><p>Süre: Genellikle 4 ila 6 hafta.</p></li>\n<li><p>Bu süre zarfında hasta haftalık veya iki haftalık aralarla (USG\nveya DÜSG ile) takip edilmelidir.</p></li>\n<li><p>Beklemeyi ne zaman bırakmalısın?</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ateş çıkarsa (Enfeksiyon).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ağrı kontrol edilemezse.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Böbrek fonksiyonları bozulursa (Kreatinin artışı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>4-6 hafta sonunda taş hala aynı yerindeyse (Üreterde \"Impacted\" taş\nriski ve kalıcı fonksiyon kaybı riski başlar).</li>\n</ul>\n<h3 id=\"d-hastaya-ev-ödevi̇-hayat-tarzı-önerileri\">D. HASTAYA EV ÖDEVİ\n(Hayat Tarzı Önerileri)</h3>\n<p>Sadece ilaç vermek yetmez, hastaya \"dinamik\" bir süreç\nanlatmalısın:</p>\n<ul>\n<li><p>Hidrasyon: Günde 2.5 - 3 litre su (İdrar miktarını artırıp taşı\nitmek için).</p></li>\n<li><p>Hareket: İp atlama, merdiven çıkma veya zıplama (Mekanik\nvibrasyon).</p></li>\n<li><p>İdrar Süzme: Taşı düşürdüğünü ispatlaması ve taş analizi\nyapılabilmesi için hastaya idrarını süzmesi söylenmelidir.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Distal üreterde 7 mm taşı olan hastaya neden Tamsulosin\nveriyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Distal üreterde Alfa-1 reseptörleri yoğundur. Tamsulosin bu\nbölgeyi gevşeterek hem taşın düşme şansını artırır hem de taşın yaptığı\nbasıncı (kolik ağrısını) azaltır.</li>\n</ul>\n<h3 id=\"1-soru-met-uyguladığın-hastada-takipte-neye-dikkat-edersin\">1.\nSoru: \"MET uyguladığın hastada takipte neye dikkat edersin?\"</h3>\n<ul>\n<li>Cevap: Hidronefroz artışına ve kreatinin değerine. Eğer taş düşmüyor\nve böbrekteki şişlik (hidronefroz) ilerliyorsa, böbrek parankimini\nkorumak için beklemeyi bırakıp cerrahiye (URS) geçmek gerekir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Alfa-blokerlerin MET sırasında en sık görülen yan etkisi\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Retrograd ejakülasyon (erkeklerde) ve ortostatik\nhipotansiyon. Hastayı bu konuda uyarmak gerekir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Üreteropelvik bileşke (UPJ) seviyesindeki 8 mm taş için MET\nuygun mudur?\"</li>\n</ol>\n<ul>\n<li>Cevap: UPJ'de alfa reseptör yoğunluğu çok azdır. 8 mm taşın UPJ'den\ndüşme şansı düşüktür. MET denenebilir ancak başarı şansının distal\ntaşlara göre çok daha düşük olduğu bilinmelidir.</li>\n</ul>\n"}, {"id": "4.5", "t": "Şok Dalga Litotripsi (ESWL)", "h": "<h3 id=\"a-mekani̇zma-ve-prensi̇pler\">A. MEKANİZMA VE PRENSİPLER</h3>\n<p>ESWL cihazı, vücut dışında (elektromanyetik veya piezoelektrik\nkaynakla) yüksek enerjili şok dalgaları üretir. Bu dalgalar su ve\nyumuşak dokudan geçer, ancak farklı akustik empedansa sahip olan taşa\nçarptığında enerjisini boşaltır.</p>\n<ul>\n<li>Kırma Mekanizması: İki yönlüdür:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Direkt Stres: Dalganın taşa çarpmasıyla oluşan mekanik\ngüç.</p></li>\n<li><p>Kavitasyon (Köpüklenme): Taşın etrafındaki sıvı içinde oluşan\nmikro-baloncukların patlayarak taşı aşındırması.</p></li>\n</ol>\n<h3 id=\"b-başariyi-etki̇leyen-faktörler-kime-yapalım\">B. BAŞARIYI\nETKİLEYEN FAKTÖRLER (Kime Yapalım?)</h3>\n<p>Hoca vizitte sorar: \"Bu hastayı ESWL'ye mi alalım, RIRS'a mı?\nKararını neye göre verdin?\"</p>\n<ol type=\"1\">\n<li>Taşın Boyutu: * Böbrek taşları: &lt; 20 mm (2 cm) için idealdir. (20\nmm üzerinde başarı oranı hızla düşer).</li>\n</ol>\n<ul>\n<li>Alt pol taşları: Burada yer çekimi devreye girer. &lt; 10 mm ise\nuygun, 10-20 mm ise tartışmalıdır.</li>\n</ul>\n<ol type=\"1\">\n<li>Taşın Dansitesi (HU): * &lt; 1000 HU: Başarı şansı yüksek.</li>\n</ol>\n<ul>\n<li>&gt; 1000 HU: (Sistin, Kalsiyum Oksalat Monohidrat). Taş çok\nserttir, ESWL ile kırılması zordur.</li>\n</ul>\n<ol type=\"1\">\n<li>Cilt-Taş Mesafesi (SSD - Skin-to-Stone Distance): * &gt; 10 cm\n(Özellikle obez hastalarda): Şok dalgaları derine inene kadar enerjisini\nkaybeder. Başarı düşer.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Anatomi: İnfundibulo-pelvik açı (IPA) çok darsa, kırılan taşlar\ndökülemez.</li>\n</ol>\n<h3 id=\"c-kesi̇n-kontrendi̇kasyonlar-kime-asla-yapılmaz\">C. KESİN\nKONTRENDİKASYONLAR (Kime ASLA Yapılmaz?)</h3>\n<p>Bunları bilmek hayat kurtarır, komplikasyonu önler:</p>\n<ol type=\"1\">\n<li><p>Gebelikte: Bebeğe zarar verir.</p></li>\n<li><p>Düzeltilmemiş Koagülopati (Kanama Bozukluğu): Renal hematom\n(kanama) riski çok yüksektir. (Kan sulandırıcılar en az 1 hafta önce\nkesilmelidir).</p></li>\n<li><p>Kontrolsüz Hipertansiyon: Ciddi böbrek kanamasına yol\naçar.</p></li>\n<li><p>Aktif İdrar Yolu Enfeksiyonu: Kırılan taştan çıkan bakteriler\nürosepsise yol açar.</p></li>\n<li><p>Distal Tıkanıklık: Taşın döküleceği yol (üreter) tıkalıysa\n(darlık varsa) kırmanın anlamı yoktur.</p></li>\n<li><p>Aort Anevrizması: Aorttaki anevrizma şok dalgalarıyla\npatlayabilir.</p></li>\n</ol>\n<h3 id=\"d-kompli̇kasyonlar\">D. KOMPLİKASYONLAR</h3>\n<ul>\n<li><p>Hematom: Böbrek etrafında kanama (Hafif subkapsüler kanama\nsıktır, %20-25).</p></li>\n<li><p>Steinstrasse (Taş Yolu): Kırılan taş parçalarının üreteri \"arka\narkaya dizilerek\" tıkaması. (Eğer parça yükü fazlaysa işlem öncesi JJ\nStent takmak bunu önleyebilir).</p></li>\n<li><p>Renal Hasar: Uzun vadede hipertansiyon veya diyabet riski (hala\ntartışmalı ama doku hasarı gerçektir).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Alt polde 15 mm taşı olan bir hastada ESWL başarısını\netkileyen anatomik faktörler nelerdir?\"</li>\n</ol>\n<ul>\n<li>Cevap: İnfundibulo-pelvik açı (dar olması kötüdür), infundibulum\nuzunluğu (uzun olması kötüdür) ve infundibulum genişliği (dar olması\ndökülmeyi zorlaştırır). Yer çekimi nedeniyle alt pol taşlarını dökmek\nher zaman zordur.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Steinstrasse (Taş yolu) gelişen bir hastada ilk yaklaşım ne\nolmalıdır?\"</li>\n</ol>\n<ul>\n<li>Cevap: Eğer hasta sepsiste değilse ve ağrısı kontrol altındaysa, MET\n(ilaçla takip) veya distal parçaya tekrar ESWL denenebilir. Ancak\nhidronefroz artıyorsa veya enfeksiyon varsa JJ Stent veya Nefrostomi ile\ndekompresyon şarttır.</li>\n</ul>\n<h3 id=\"1-soru-eswl-sırasında-atım-hızı-frequency-ne-olmalıdır\">1. Soru:\n\"ESWL sırasında atım hızı (Frequency) ne olmalıdır?\"</h3>\n<ul>\n<li>Cevap: EAU Kılavuzu, yüksek hızdan (120 atım/dk) ziyade düşük hızın\n(60-90 atım/dk) daha efektif kırma sağladığını ve doku hasarını\nazalttığını belirtir.</li>\n</ul>\n<h3 id=\"1-soru-sistin-taşlarında-neden-eswl-ilk-tercih-değildir\">1.\nSoru: \"Sistin taşlarında neden ESWL ilk tercih değildir?\"</h3>\n<ul>\n<li>Cevap: Sistin taşları \"plastik\" kıvamındadır, elastiktir. Şok\ndalgasının enerjisini emerek kırılmak yerine zıplarlar. Bu yüzden direkt\ncerrahi (URS/PCNL) daha mantıklıdır.</li>\n</ul>\n"}, {"id": "4.6", "t": "Üreteroskopi (URS) ve RIRS", "h": "<h3 id=\"a-ri̇gi̇d-sert-üreteroskopi̇-urs\">A. RİGİD (SERT) ÜRETEROSKOPİ\n(URS)</h3>\n<p>Genellikle alt ve orta üreter taşları için kullanılır.</p>\n<ul>\n<li><p>Ekipman: Genellikle 6-9.5 French (Fr) kalınlığında, fiberoptik\nveya dijital aletler.</p></li>\n<li><p>Teknik: Üretra ve mesane geçildikten sonra üreteral orifisten\ngirilir.</p></li>\n<li><p>Tuzak: Üst üreter taşlarında rigid URS kullanırsan, irrigasyon\nsıvısının basıncıyla taş böbreğe geri kaçabilir (\"Upward Migration\"). Bu\ndurumda \"flexible\" alete geçmek veya bir \"Stone Cone/N-Trap\" kullanmak\ngerekir.</p></li>\n</ul>\n<h3 id=\"b-flexi̇ble-esnek-urs--rirs\">B. FLEXİBLE (ESNEK) URS / RIRS</h3>\n<p>Üst üreter ve böbrek içindeki (intrarenal) taşlar için altın\nstandarttır.</p>\n<ul>\n<li><p>Mekanizma: Aletin ucu yaklaşık 270 derece aşağı ve yukarı\nbükülebilir (Defleksiyon). Bu sayede tüm kalis yapılarına (özellikle alt\npol) girilebilir.</p></li>\n<li><p>UAS (Ureteral Access Sheath): * Mesaneden böbreğe kadar uzanan\nbir \"kılıf\"tır.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Avantajı: İntrarenal basıncı düşürür (sepsisi önler), görüşü\nnetleştirir ve taş parçalarının kolayca dışarı alınmasını sağlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Risk: Üreteri çizebilir veya koparabilir (Avülsiyon). Her zaman\nkılavuz tel (Guide wire) üzerinden yerleştirilmelidir.</li>\n</ul>\n<h3 id=\"c-lazer-teknoloji̇si̇-holmi̇umyag\">C. LAZER TEKNOLOJİSİ:\nHOLMİUM:YAG</h3>\n<p>Taşı kırmak için kullandığımız ana enerji kaynağıdır. Daha önce\n1.10'da bahsetmiştik ama cerrahi bağlamda iki ana ayarı bilmelisin:</p>\n<ol type=\"1\">\n<li>Fragmentation (Parçalama): * <em>Ayarlar:</em> Yüksek Enerji\n(1.0-1.5 J) / Düşük Frekans (5-10 Hz).</li>\n</ol>\n<ul>\n<li><em>Amaç:</em> Taşı basketle alınabilecek büyük parçalara\nbölmek.</li>\n</ul>\n<ol type=\"1\">\n<li>Dusting (Tozlaştırma): * <em>Ayarlar:</em> Düşük Enerji (0.2-0.5 J)\n/ Yüksek Frekans (20-80 Hz).</li>\n</ol>\n<ul>\n<li><em>Amaç:</em> Taşı kum haline getirip hastanın kendiliğinden\ndökmesini sağlamak. Basketle uğraşmadığın için ameliyat süresini\nkısaltır.</li>\n</ul>\n<h3 id=\"d-kompli̇kasyonlar-kabusa-hazır-ol\">D. KOMPLİKASYONLAR (Kabusa\nHazır Ol)</h3>\n<ol type=\"1\">\n<li><p>Üreteral Yaralanma: Hafif mukoza çizilmesinden tam kat delinmeye\n(Perforasyon) kadar değişebilir.</p></li>\n<li><p>Üreter Avülsiyonu: En korkulan komplikasyon. Üreterin tamamen\nkopup gelmesi. Genellikle zorlamalı \"basket\" manevralarında olur.\nTedavisi büyük rekonstrüktif cerrahi gerektirir.</p></li>\n<li><p>Ürosepsis: Ameliyat sırasında yüksek basınçlı su vermek\nbakterileri kana iter.</p></li>\n<li><p>Üreter Darlığı: Geç dönem komplikasyonu. Travmatik girişimlerden\naylar sonra gelişir.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Flexible URS yaparken alt poldeki taşı neden bazen üst pole\nveya orta pole taşıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Taş Yerinden Oynatma\" (Relocation) tekniğidir. Alt polde\nlazer atışı yapmak hem aletin ömrünü kısaltır (aşırı bükülme nedeniyle\nlazer fiberi alete zarar verebilir) hem de kırma açısı zordur. Taşı\nbasketle daha kolay bir kalise (üst/orta) taşıyıp orada kırmak cerrahiyi\nkolaylaştırır.</li>\n</ul>\n<h3 id=\"1-soru-lazer-yaparken-retropulsiyon-nedir-ve-nasıl-önlenir\">1.\nSoru: \"Lazer yaparken 'Retropulsiyon' nedir ve nasıl önlenir?\"</h3>\n<ul>\n<li>Cevap: Lazer enerjisinin taşı iterek böbreğe veya yukarı\nkaçırmasıdır. Önlemek için frekansı artırıp enerjiyi düşürebiliriz\n(Dusting), Stone Cone kullanabiliriz veya taşı bir duvara (kalis\nduvarına) yaslayabiliriz.</li>\n</ul>\n<h3 id=\"1-soru-ameliyat-sonunda-neden-jj-stent-takıyoruz\">1. Soru:\n\"Ameliyat sonunda neden JJ Stent takıyoruz?\"</h3>\n<ul>\n<li>Cevap: Üreter ödemini önlemek, kalan küçük tozların dökülmesini\nkolaylaştırmak ve varsa perforasyonu iyileştirmek için. Genellikle 1-2\nhafta sonra poliklinikte çekilir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Lazer fiberini aletin içinden ilerletirken aletin bükülü\n(defleksiyon) olmaması neden önemlidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Fiberin ucu aletin çalışma kanalını delip pahalı olan\nflexible cihazı bozabilir. Fiber her zaman alet düzken\nyerleştirilmelidir.</li>\n</ul>\n"}, {"id": "4.7", "t": "Perkütan Nefrolitotomi (PCNL)", "h": "<h3 id=\"a-pozi̇syon-prone-vs-supi̇ne\">A. POZİSYON: PRONE VS SUPİNE</h3>\n<ol type=\"1\">\n<li><p>Prone (Yüzüstü): Klasik pozisyondur. Böbreğe ulaşmak için geniş\nbir alan sağlar, posterior kalislere giriş daha rahattır. Cerrahın\nanatomik hakimiyeti yüksektir.</p></li>\n<li><p>Supine (Sırtüstü/Galdakao): Son yıllarda popülerliği\nartmıştır.</p></li>\n</ol>\n<ul>\n<li>Avantajı: Anestezi açısından daha güvenlidir (akciğer kapasitesi).\nAynı anda aşağıdan üreteroskopi yapılmasına izin verir (ECIRS). Cerrah\noturarak çalışabilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Dezavantajı: Kolon yaralanma riski teorik olarak biraz daha\nyüksektir.</li>\n</ul>\n<h3 id=\"b-ponksi̇yon-ve-di̇latasyon-böbreğe-yol-açmak\">B. PONKSİYON VE\nDİLATASYON (Böbreğe Yol Açmak)</h3>\n<ol type=\"1\">\n<li><p>Giriş (Access): Floroskopi (C-kollu skopi) veya Ultrasonografi\neşliğinde iğne ile hedeflenen kalise (genelde alt veya orta pol\nposterior kalis) girilir.</p></li>\n<li><p>Kılavuz Tel (Guide Wire): İğnenin içinden bir tel gönderilir. Bu\ntel bizim \"emniyet kemerimiz\"dir.</p></li>\n<li><p>Dilatasyon: Yolun genişletilmesidir.</p></li>\n</ol>\n<ul>\n<li><em>Teleskopik (Alken) dilatörler:</em> Metal çubuklar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Amplatz dilatörler:</em> Plastik ardışık dilatörler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Balon dilatör:</em> En az travmatik olanıdır, yolu tek seferde\nşişirerek açar.</li>\n</ul>\n<ol type=\"1\">\n<li>Amplatz Kılıfı: Çalışma kanalımızdır. Genelde 24-30 French (Fr)\narasındadır.</li>\n</ol>\n<h3 id=\"c-taşin-kirilmasi-ve-çikarilmasi\">C. TAŞIN KIRILMASI VE\nÇIKARILMASI</h3>\n<ul>\n<li><p>Pnömatik Litotriptör: \"Hilti\" mantığıyla çalışır. Sert taşları\nhızla parçalar.</p></li>\n<li><p>Ultrasonik Litotriptör: Taşı hem kırar hem de vakumla\nçeker.</p></li>\n<li><p>Lazer: Özellikle minyatür PCNL'lerde tercih edilir.</p></li>\n</ul>\n<h3 id=\"d-mi̇nyatür-pcnl-mini-ultra-mini-micro\">D. MİNYATÜR PCNL (Mini,\nUltra-Mini, Micro)</h3>\n<p>Geleneksel PCNL kılıfları (30 Fr) böbreğe zar
