nesyum-99m DMSA\nSintigrafisi'dir. DMSA doğrudan böbrek hücrelerine yapışır; skar olan\n(ölü) bölgede ilaç tutulumu olmaz ve o bölge kapkaranlık (defekt) olarak\ngörünür.</p>\n<h3 id=\"d-enfeksi̇yon-ve-profi̇laksi̇-yöneti̇mi̇-kimi-koruyacağız\">D.\nENFEKSİYON VE PROFİLAKSİ YÖNETİMİ (Kimi Koruyacağız?)</h3>\n<p>Cerrahiden önce tıbbi yönetimin temeli CAP (Continuous Antibiotic\nProphylaxis - Sürekli Antibiyotik Profilaksisi)'dir. Amaç çocuğun\nidrarını steril (bakterisiz) tutmaktır ki, idrar böbreğe kaçsa bile\n(Steril Reflü) böbreği yakmasın.</p>\n<p>EAU ve AUA 2026 Kılavuzları kime koruyucu antibiyotik verileceğini\nçok net belirler:</p>\n<p>Yaş &lt; 1 (Bebekler): Evresi ne olursa olsun (Evre 1-5), 1 yaşın\naltındaki ve VUR saptanan tüm bebeklere, böbrekleri çok hassas olduğu\niçin MUTLAKA düşük doz (gece tek doz) profilaktik antibiyotik\nbaşlanır.</p>\n<p>Tuvalet Eğitimini Tamamlamış Çocuklar (&gt; 1-2 Yaş):</p>\n<p>Düşük Evre (Evre 1-2) ve idrar yolu enfeksiyonu (İYE) geçirmiyorsa:\nProfilaksi VERİLMEZ, sadece izlenir.</p>\n<p>Yüksek Evre (Evre 3-5): Mesane/Bağırsak Disfonksiyonu (BBD -\nkabızlık, idrar kaçırma) varsa profilaksi VERİLİR.</p>\n<p><em>İlaç Seçimi:</em> Yenidoğanlarda Amoksisilin; 2 aydan büyüklerde\nTrimetoprim-Sülfametoksazol (Bactrim) veya Nitrofurantoin\nkullanılır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Bir kız çocuğunda ateşli idrar yolu enfeksiyonu (Piyelonefrit)\nsaptadık ve tedavi ettik. Çocuğun böbreğinde kalıcı bir skar (nedbe)\nkalıp kalmadığını görmek için DMSA sintigrafisini enfeksiyondan hemen\nsonraki hafta mı çekersin?\"</p>\n<p>Cevap: \"Kesinlikle hayır. Akut piyelonefrit sırasında böbrek dokusu\nödemlidir ve DMSA çekersen o bölge geçici olarak karanlık (defektli)\ngörünür. Buna akut faz yanılgısı denir. O dokunun gerçekten ölüp\nölmediğini (kalıcı skar olup olmadığını) anlamak için, DMSA\nsintigrafisini akut enfeksiyon geçtikten en az 4 ila 6 ay SONRA\nçekmeliyiz.\"</p>\n<p>Soru: \"Primer VUR (doğuştan kısa tünel) ile Sekonder VUR arasındaki\nfark nedir? Sekonder VUR saptadığın bir erkek bebekte ilk aklına gelmesi\ngereken ölümcül hastalık nedir?\"</p>\n<p>Cevap: \"Primer VUR üreterovezikal bileşkenin kendi anatomik\nkusurudur. Sekonder VUR ise kapak (tünel) tamamen sağlam olmasına\nrağmen, mesanenin içindeki devasa basıncın kapağı zorla patlatıp idrarı\nyukarı basmasıdır. Eğer bir erkek bebekte sekonder (ve genellikle\nbilateral) VUR varsa, aksi ispat edilene kadar mesane çıkışını tıkayan\nPosterior Üretral Valv (PUV) veya nörojenik mesane düşünülmeli ve hemen\nmesane çıkışı (üretra) incelenmelidir.\"</p>\n<p>Soru: \"Steril reflü (içinde bakteri olmayan, temiz idrarın böbreğe\nkaçması) böbrekte kalıcı skar ve hasar yapar mı?\"</p>\n<p>Cevap: \"Hayır, yapmaz. Domuz yavrularında yapılan o meşhur klasik\nçalışmalarda (Ransley ve Risdon) gösterilmiştir ki; mesane basıncı aşırı\nyüksek (nörojenik) olmadığı sürece, sadece idrarın böbreğe gidip gelmesi\n(steril reflü) böbrek parankimini öldürmez. Böbreği öldüren ve skar\nbırakan şey Reflü + Enfeksiyon (Bakteri) birlikteliğidir. Bu yüzden\ntedavinin temeli idrarı steril tutmaktır.\"</p>\n"}, {"id": "12.6", "t": "VUR Cerrahisi - Endoskopik Stıng vs. Açık/robotik Üreteral Reimplantasyon", "h": "<h3 id=\"a-mi̇ni̇mal-i̇nvazi̇v-si̇lah-endoskopik-enjeksiyon-sting-ve-hit\">A.\nMİNİMAL İNVAZİV SİLAH: Endoskopik Enjeksiyon (STING ve HIT)</h3>\n<p>Aileler açık ameliyattan (mesanenin kesilmesinden) çok korktukları\niçin 1980'lerde geliştirilen ve günümüzde Dextranomer/Hyalüronik Asit\n(Deflux) gibi biyobozunur dolgu maddelerinin kullanıldığı, günübirlik,\nkesisiz bir ameliyattır.</p>\n<p>Mekanizma: Sistoskop ile idrar kanalından mesaneye girilir. Üreterin\nmesaneye açıldığı deliğin (orifis) hemen altına veya içine iğneyle\ngirilip bu yoğun kıvamlı jel sıkılır. Jel orada bir tepecik oluşturur,\nüreterin ağzını (lüminal çatıyı) yukarı doğru kaldırıp kapatır ve\nidrarın geri kaçmasını engeller.</p>\n<p>Teknikler:</p>\n<p>STING (Subtrigonal Injection): Saat 6 hizasından, orifisin birkaç\nmilimetre altından sıkılır.</p>\n<p>HIT (Hydrodistention Implantation Technique): Daha modern ve\nbaşarılıdır. İğne doğrudan üreterin içindeki submukozal tünele sokulur\nve tünelin içi doldurularak duvarların birbirine yapışması (koaptasyon)\nsağlanır.</p>\n<p>Başarı Oranı: Evre 1-3 reflülerde başarı %80-90 iken, Evre 4-5 devasa\nreflülerde (veya golf deliği gibi açılmış orifislerde) başarı %50'lere\ndüşer. Avantajı çocuğun aynı gün taburcu olmasıdır, ancak uzun vadede\njelin erimesiyle reflünün nüks etme riski vardır.</p>\n<h3 id=\"b-altin-standart-95-99-başarı-üreteral-reimplantasyon\">B. ALTIN\nSTANDART (%95-99 Başarı): Üreteral Reimplantasyon</h3>\n<p>Eğer reflü çok yüksek evreliyse, endoskopik enjeksiyon başarısız\nolmuşsa veya üreterde eş zamanlı bir darlık/divertikül varsa, o idrar\nkanalını yerinden söküp (re-implant) o kusursuz 5:1 submukozal tünel\noranını kendi ellerimizle sıfırdan yaratmak ZORUNDAYIZ.</p>\n<p>Cerrahinin nereden yapılacağına göre iki ana kampa ayrılırız:</p>\n<h3 id=\"1-i̇ntravezikal-mesane-i̇çinden-yapılan-teknikler\">1. İntravezikal\n(Mesane İçinden Yapılan) Teknikler:</h3>\n<p>Mesane önden (suprapubik kesiyle) açılır, idrarın içine girilir ve\nameliyat tamamen mesanenin mukozasında yapılır.</p>\n<p>Cohen Cross-Trigonal Tekniği (En Sık Kullanılan): Üreter eski\nyerinden sökülür. Mesanenin tabanında (trigonda), karşı taraftaki sağlam\nüreterin altına doğru uzun, yatay bir tünel kazılır ve üreter bu\ntünelden geçirilip karşı tarafa dikilir.</p>\n<p><em>Zayıf Yönü:</em> Üreterin anatomik yönü değişip yatay\n(horizontal) hale geldiği için, ileride bu çocuk böbrek taşı düşürürse,\naşağıdan endoskopla (URS) o üretere girmek neredeyse imkansız hale\ngelir.</p>\n<p>Politano-Leadbetter Tekniği: Üreter sökülür, mesanenin çok daha\nüst/arka kısmından (yeni bir delik açılarak) mesaneye tekrar sokulur ve\naşağıya doğru dikey bir tünel kazılır.</p>\n<p><em>Avantajı:</em> Anatomik (dikey) yön korunur, ileride endoskopi\nyapılabilir.</p>\n<p><em>Dezavantajı:</em> Mesanenin arkasında (körkuyuda) çalışıldığı\niçin, iğneyle yanlışlıkla bağırsağı (rektumu) veya vajinayı delme riski\nen yüksek olan tekniktir.</p>\n<h3 id=\"2-ekstravezikal-mesane-dışından-yapılan-teknikler\">2.\nEkstravezikal (Mesane Dışından Yapılan) Teknikler:</h3>\n<p>Mesane KESİNLİKLE AÇILMAZ. İdrarla hiç temas edilmez. İyileşme çok\nhızlıdır, mesane spazmı/kanaması olmaz. Günümüzde Robotik Cerrahinin\n(RALUR) de en çok tercih ettiği yöntemdir.</p>\n<p>Lich-Gregoir Tekniği: Mesanenin dışındaki o kalın kas tabakası\n(Detrüsör), tam üreterin girdiği yerde bir oluk (hendek) şeklinde,\nsadece altındaki zar (mukoza) görünene kadar kesilir. Üreter bu hendeğin\niçine yatırılır. Kesilen kaslar, üreterin \"üzerine\" bir yorgan gibi\ndikilerek kapatılır. Böylece mesane basıncı arttığında, bu yeni kas\ntüneli üreteri ezer ve sübap mekanizmasını kusursuz çalıştırır.</p>\n<h3\nid=\"c-megaüreter-ve-tapering-üreteri-daraltmatıraşlama-zorunluluğu\">C.\nMEGAÜRETER VE \"TAPERING\" (Üreteri Daraltma/Tıraşlama) ZORUNLULUĞU</h3>\n<p>Bazen VUR Evre 5'tir. Karşında parmak kadar kalın (Örn: 2 cm çapında)\ndevasa bir üreter (Megaüreter) vardır.</p>\n<p><em>Kural:</em> Eğer 2 cm'lik bir üretere 5:1 kuralını uygulamaya\nkalkarsan, mesanenin içinde 10 cm'lik (2x5) devasa bir tünel açman\ngerekir. Bir çocuğun mesanesi bu kadar büyük DEĞİLDİR.</p>\n<p><em>Çözüm:</em> Reimplantasyon yapmadan önce, o devasa üreterin alt\nucu uzunlamasına kesilir, fazla dokular tıraşlanıp atılır ve üreter ince\nbir spagetti borusu (yaklaşık 5 mm çapında) haline getirilerek dikilir.\nBuna Tapering (Eksizyonel Daraltma) veya <em>Starr Pilosyonu\n(Katlama)</em> denir. İncelen üreter, 2.5 cm'lik kısa bir tünelle\nkolayca mesaneye gömülür.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Robotik cerrahiyle (veya açık yöntemle) Bilateral (İki\nTaraflı) Lich-Gregoir ameliyatı yaptın. Mesaneyi hiç açmadın, kanama\nsıfır, ameliyat kusursuz geçti. Çocuğun sondasını 2. gün çektin ancak\nçocuk idrarını kesinlikle yapamıyor (Üriner Retansiyon). Bu krizin\nnöroanatomik sebebi nedir?\"</p>\n<p>Cevap: \"Lich-Gregoir ekstravezikal bir tekniktir ve mesanenin\narka/alt kısmında (trigon arkasında) çalışılır. Mesanenin kasılmasını\nsağlayan otonom sinirler (Pelvik Pleksus) tam olarak bu bölgeden\nmesaneye girer. Tek taraflı ameliyatlarda sorun olmaz ancak bilateral\n(iki taraflı) derin ekstravezikal diseksiyon yapıldığında, mesanenin her\niki tarafındaki sinirler geçici olarak felç olur (Nöropraksi). Bu\nçocukların %10-15'inde ameliyat sonrası geçici idrar retansiyonu\n(yapamama) görülür. Sonda birkaç hafta daha içeride bırakılarak mesane\nkasının toparlaması beklenir.\"</p>\n<p>Soru: \"Poliklinikte ultrason raporunu okuyorsun. Her iki böbrekte\nEvre 4 hidronefroz var. Mesane duvarı çok kalınlaşmış ve trabeküle\n(kaslı) hale gelmiş. Bu çocuğa direkt VUR teşhisi koyup hemen Cohen\n(reimplantasyon) ameliyatı planlar mısın?\"</p>\n<p>Cevap: \"Asla planlamam. Kalınlaşmış, trabeküle (sinirli) bir mesane,\naltta yatan devasa bir yüksek basınç sorunu olduğunu (Örn: Nörojenik\nMesane veya Posterior Üretral Valv - PUV) gösterir. Bu durumda\ngördüğümüz VUR 'Sekonder' bir VUR'dur. Sen yüksek basınçlı, patlamaya\nhazır bir mesaneye gidip yeni bir tünel (Cohen) dikersen, o yüksek\nbasınç senin diktiğin tüneli de patlatır veya idrarı hiç dışarı atamaz.\nÖnce mutlaka mesane basıncını (Ürodinami ile) ve çıkışını\n(Sistoskopi/VCUG ile) değerlendirip o sorunu çözmeliyim.\"</p>\n<p>Soru: \"Endoskopik enjeksiyon (STING/Deflux) yaptın ama ameliyat\nmasasında maddeyi sıktıktan hemen sonra iğneyi çektin ve ilacın\nyanlardan fışkırıp döküldüğünü (veya tepecik oluşturmadığını) gördün.\nAnatomik olarak neyi yanlış yapmış olabilirsin?\"</p>\n<p>Cevap: \"İğneyi çok yüzeyel (hemen mukozanın altına) sokmuş\nolabilirim. Eğer madde mesane kasının (detrüsör) sağlam desteğinin\nüzerine değil de sadece zarın altına sıkılırsa, volkanik bir krater gibi\npatlar ve lümeni kapatmaz (Volcano effect). İkinci ihtimal; üreter\ndoğuştan tamamen ektopiktir ve altında dayanabileceği bir kas tabakası\n(backing) yoktur. Madde tutunacak yer bulamaz.\"</p>\n"}, {"id": "12.7", "t": "Üreterovezikal Bileşke (UVJ) Darlığı ve Primer Obstrüktif Megaüreter (Pom)", "h": "<h3 id=\"a-tanim-ve-patofi̇zyoloji̇-megaüreter-nedir\">A. TANIM VE\nPATOFİZYOLOJİ: Megaüreter Nedir?</h3>\n<p>Yenidoğan bir bebekte normal üreterin çapı yaklaşık 3-5 milimetredir\nve ultrasonda neredeyse hiç görünmez. Eğer bir üreterin çapı 7\nmilimetreyi geçiyorsa, buna Megaüreter denir.</p>\n<p>POM'un (Primer Obstrüktif Megaüreter) Anatomik Sırrı:</p>\n<p>Tıpkı UPJ darlığında olduğu gibi, burada da anatomik (et parçasının\ntıkadığı) tam bir kapalılık yoktur. Sorun, üreterin mesaneye girdiği o\nen uç kısımdaki (Jukstavezikal) aperistaltik (kasılamayan)\nsegmenttir.</p>\n<p>Embriyolojik gelişim sırasında, bu son 1-2 cm'lik kısımdaki düz kas\nlifleri dairesel (sirküler) şekilde dizilmek yerine anormal bir kollajen\nyığınına dönüşmüştür.</p>\n<p>Yukarıdan inen idrar dalgası (peristaltizm) bu sert ve hareketsiz\nsegmente çarpar, aşağı inemez. Geriye doğru biriken idrar, üreteri\ndevasa bir kalınlığa ve kıvrımlı (tortüöz) bir yapıya ulaştırır.</p>\n<h3 id=\"b-megaüreteri̇n-dört-yüzü-klinik-sınıflama\">B. MEGAÜRETERİN DÖRT\nYÜZÜ (Klinik Sınıflama)</h3>\n<p>Karşında 15 mm çapında devasa bir üreter var. Her şişkin üreter POM\ndeğildir. Kılavuzlar tedaviyi belirlemek için megaüreterleri 4 ana\nkategoriye ayırır:</p>\n<p>Obstrüktif Megaüreter (POM): Tıkanıklık vardır, reflü yoktur.\n(Bugünkü konumuz).</p>\n<p>Reflüksif Megaüreter: Tıkanıklık yoktur. Sadece Evre 5 VUR olduğu\niçin idrar yukarı kaçıp kanalı şişirmiştir. (VCUG ile teşhis\nedilir).</p>\n<p>Reflüksif ve Obstrüktif Megaüreter: Hem tıkanıklık hem reflü aynı\nanda vardır (En zorlu olanıdır, cerrahi düzeltme şarttır).</p>\n<p>Non-Reflüksif Non-Obstrüktif Megaüreter (İdiyopatik): Ne tıkanıklık\nne de kaçak vardır. Üreter sadece geniştir ama idrarı mükemmel bir\nşekilde mesaneye boşaltır. (Dokunulmaz, kendiliğinden düzelir).</p>\n<h3 id=\"c-tani-algori̇tmasi-ve-si̇nti̇grafi̇ni̇n-rezervuar-tuzaği\">C. TANI\nALGORİTMASI VE SİNTİGRAFİNİN \"REZERVUAR\" TUZAĞI</h3>\n<h3 id=\"1-ultrasonda-usg-ne-görürüz\">1. Ultrasonda (USG) Ne\nGörürüz?</h3>\n<p>UPJ darlığının aksine, POM hastasında böbrek pelvisinin yanı sıra\nüreter de (mesanenin arkasına kadar) devasa şekilde genişlemiş olarak\ngörülür (Üreterohidronefroz).</p>\n<h3 id=\"2-vcug-i̇şeme-filmi-neden-zorunludur\">2. VCUG (İşeme Filmi) Neden\nZorunludur?</h3>\n<p>Ultrasonda megaüreteri gördüğün an ilk yapman gereken test VCUG'dir.\nÇünkü o üreterin reflü (VUR) veya Posterior Üretral Valv (PUV) yüzünden\nmi şiştiğini dışlamak zorundasın. POM tanısı koyabilmek için VCUG'de\nreflü OLMAMASI gerekir.</p>\n<h3 id=\"3-mag3-sintigrafisindeki-göllenme-yanılgısı\">3. MAG3\nSintigrafisindeki \"Göllenme\" Yanılgısı:</h3>\n<p>İşte asistanların en çok hata yaptığı yer. MAG3 sintigrafisi çektin,\nFurosemid (Lasix) yaptın ama radyoaktif ilaç böbrekten ve üreterden bir\ntürlü inmiyor.</p>\n<p><em>Kritik Detay:</em> Devasa megaüreter o kadar büyüktür ki, idrar\norada adeta bir \"göl\" oluşturur (Rezervuar Etkisi). Verilen idrar\nsöktürücü (Lasix), o gölün içindeki radyoaktif ilacı süpürmeye yetmez.\nBu yüzden sintigrafi \"tam tıkanıklık\" gibi yanlış (yalancı pozitif) bir\neğri verebilir. Nükleer tıp uzmanı, eğriyi çizerken sadece böbreği\ndeğil, tüm üreteri içine alan bir \"İlgi Alanı (ROI)\" çizmelidir.</p>\n<h3 id=\"d-yöneti̇m-ve-cerrahi̇-bekle-ve-gör-mü-bıçak-mı\">D. YÖNETİM VE\nCERRAHİ: \"Bekle ve Gör\" mü, Bıçak mı?</h3>\n<p>Eskiden megaüreter görüldüğü an ameliyat edilirdi. Günümüz EAU 2026\nkılavuzları ise tam tersini söyler: \"İlk 1-2 yaşa kadar POM'ların\n%70-80'i KENDİLİĞİNDEN DÜZELİR (Spontan Rezolüsyon).\" Çocuk büyüdükçe o\nkasılamayan segment olgunlaşır ve açılır.</p>\n<p>Konservatif İzlem (İlk Seçenek): Çocuğa koruyucu antibiyotik\n(Amoksisilin/Bactrim) başlanır ve 3-6 aylık aralarla USG/Sintigrafi\ntakibi yapılır.</p>\n<p>Cerrahi Ne Zaman Şarttır? (Mutlak Endikasyonlar):</p>\n<p>Sintigrafide o taraf böbreğin fonksiyonu (SRF) %40'ın altına\ndüşmüşse.</p>\n<p>Takiplerde böbrek fonksiyonu &gt; %5 azalıyorsa.</p>\n<p>Çocuk koruyucu antibiyotik almasına rağmen ateşli idrar yolu\nenfeksiyonu geçiriyorsa.</p>\n<p>Çapı çok devasa (&gt; 15-20 mm) ve böbreği eziyorsa.</p>\n<p>Cerrahi Stratejiler:</p>\n<p>Endoskopik Balon Dilatasyonu ve Stentleme (Modern Yaklaşım):<br />\nAçık ameliyat yapmadan, idrar kanalından sistoskopla girilir. Yüksek\nbasınçlı bir balon o dar UVJ segmentine yerleştirilip şişirilir, o\nkasılamayan dar alan yırtılarak genişletilir ve içine 2-3 ay kalacak bir\nDouble-J stent konur. Minimal invazivdir, başarı oranı\n%70-80'lerdedir.</p>\n<p>Üreteral Reimplantasyon ve Tapering (Altın Standart):<br />\nBalon işe yaramazsa veya üreter çok kalınsa (Örn: 2 cm); o hastalıklı,\nkasılamayan son 2 santimetrelik segment tamamen kesilir (eksize edilir).\nÜreter çok kalın olduğu için mesaneye gömülemez; bu yüzden üreter\nuzunlamasına kesilip daraltılır (Tapering - Starr veya Kalicinski\nteknikleri) ve yepyeni bir submukozal tünel (Cohen veya Lich-Gregoir)\naçılarak mesaneye dikilir.</p>\n<p>Kutanöz Üreterostomi (Geçici Hayat Kurtarıcı):<br />\nBebek henüz 1 aylık, üreter 20 mm çapında (mesaneden daha büyük) ve\nböbrek boğuluyor. Bu küçücük mesaneye o devasa üreteri dikemezsin\n(Tapering bile kurtarmaz). Bu durumda üreteri karın cildine\nağızlaştırırsın (Üreterostomi). İdrar aylarca doğrudan beze (cilde)\nakar, böbrek rahatlar. Bebek 1-2 yaşına gelip mesanesi büyüdüğünde,\nüreteri ciltten söküp asıl yerine (mesaneye) dikersin.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Poliklinikte megaüreteri olan bir bebeğin VCUG (işeme filmi)\nraporunu okuyorsun. Raporda reflü (VUR) saptanmamış. Ancak 'Mesane\nduvarında yaygın trabekülasyon (kalınlaşma) ve çam ağacı (pine-cone)\ngörünümü' yazıyor. Bu çocuğun tanısı Primer Obstrüktif Megaüreter (POM)\nmidir?\"</p>\n<p>Cevap: \"Kesinlikle hayır! Trabeküle olmuş, duvarı kalınlaşmış bir\nmesane, altta yatan devasa bir mesane çıkış tıkanıklığı (Örn: PUV) veya\nNörojenik Mesane (Spina Bifida) olduğunu gösterir. Bu durumda gördüğümüz\nmegaüreter 'Primer' değil, yüksek basınca bağlı gelişen **'Sekonder\nMegaüreter'**dir. POM tanısı koyabilmek için mesanenin tamamen normal,\nince duvarlı ve pürüzsüz olması şarttır. Tedavi megaüretere değil, altta\nyatan mesane hastalığına yönelik olmalıdır.\"</p>\n<p>Soru: \"MAG3 sintigrafisinde 'Rezervuar Etkisi' (göllenme) yüzünden\nyalancı pozitif obstrüksiyon gördüğümüzü nasıl kanıtlarız? Tıkanıklık\nile göllenmeyi ayırt etmenin pratik bir radyolojik manevrası var\nmıdır?\"</p>\n<p>Cevap: \"Evet. Klasik Furosemid (Lasix) enjeksiyonundan sonra\nradyoaktif madde hala üreterde gölleniyorsa, çocuğun pozisyonunu\ndeğiştiririz. Yerçekimi (Gravity) Manevrası uygulanır; çocuk ayağa\nkaldırılır veya dik oturtulur ve mesanesini boşaltması (işemesi)\nistenir. Eğer tıkanıklık (POM) yoksa ve sadece geniş, tembel bir\nüreterse, yerçekiminin etkisiyle o göllenen ilaç hızla mesaneye dökülür\nve eğri aniden normale döner. Tıkanıklık varsa, ayağa kalksa da ilaç\ninmez.\"</p>\n<p>Soru: \"Açık reimplantasyon (Cohen) yapıyorsun ve devasa megaüreterin\nalt ucunu kesip çıkardın. Geriye kalan üreteri mesaneye dikebilmek için\n'Eksizyonel Tapering (Hendren)' tekniğiyle daralttın. Bu daraltma işlemi\nsırasında üreterin kanlanmasını (iskemi) bozmamak için hangi altın\nkurala dikkat etmelisin?\"</p>\n<p>Cevap: \"Üreterin kanlanması (vaskülarizasyonu) boylamasına seyreden\nincecik damar ağlarıyla (Vazo vazorum) sağlanır. Pelvik bölgede (alt\nüreterde) bu damarlar üreterin medialinden (iç tarafından) gelir. Bu\nyüzden eksizyonel tapering yaparken (üreterden doku çıkarırken), kesiyi\nASLA medialden yapmamalıyız. Kesi ve daraltma işlemi her zaman\nkanlanmanın en az olduğu lateral (dış) veya antimesenterik kenardan\nyapılmalıdır. Aksi takdirde üreter iskemiden (kansızlıktan) çürür ve\ndikişler açılır.\"</p>\n"}, {"id": "12.8", "t": "Duplikasyon Anomalileri, Ektopik Üreter ve Üreterosel", "h": "<h3 id=\"a-altin-kural-weigert-meyer-yasası\">A. ALTIN KURAL:\nWeigert-Meyer Yasası</h3>\n<p>Eğer bir böbrekten tam (komplet) iki ayrı üreter çıkıyorsa, bu iki\nkanal mesaneye doğru inerken mutlaka kendi etraflarında bir kez dönerler\n(çaprazlaşırlar).</p>\n<p>Bu çaprazlaşmanın sonucunda mesaneye giriş yerleri şöyle olur:</p>\n<p>Üst Pol Üreteri (Yukarıdaki Havuzcuk): Mesaneye olması gerekenden çok\ndaha AŞAĞIDAN ve İÇERİDEN (İnferomedial / Ektopik) girer. Bu bölgede\ntünel çok uzundur veya hiç yoktur. Bu kanal sürekli TIKANMAYA\n(Obstrüksiyon) ve ucunun balonlaşmasına (Üreterosel) mahkumdur.</p>\n<p>Alt Pol Üreteri (Aşağıdaki Havuzcuk): Mesaneye olması gerekenden çok\ndaha YUKARIDAN ve DIŞARIDAN (Süperolateral) girer. Burada tünel boyu\naşırı kısadır (Sübap mekanizması bozuktur). Bu kanal sürekli idrarı\nyukarı kaçırmaya (Vezikoüreteral Reflü - VUR) mahkumdur.</p>\n<p><em>Klinik Özet:</em> Üst pol tıkanır, alt pol reflü yapar! (Böbreğin\nfonksiyonel yükünün %80'ini alt pol, %20'sini üst pol taşır).</p>\n<h3 id=\"b-üreterosel-mesanenin-i̇çindeki-saatli-bomba\">B. ÜRETEROSEL:\nMesanenin İçindeki Saatli Bomba</h3>\n<p>Üst pol üreteri (aşağıdan giren) mesane mukozasının altına\ngirdiğinde, ağzı (orifisi) embriyolojik olarak çok dardır. Yukarıdan\ngelen idrar bu dar ağızdan çıkamaz ve üreterin o son kısmı mesanenin\niçinde devasa bir ince zarlı balon gibi şişer. Buna Üreterosel\ndenir.</p>\n<p>Klinik Tehlike: Bu kistik balon sadece kendi üst polünü tıkamakla\nkalmaz; o kadar büyür ki mesane boynunu (çıkışı) tıkayıp idrar\nyapamamaya veya yanındaki sağlam alt pol üreterine bası yapıp onu da\ntıkamaya başlar. Kız çocuklarında idrar kanalından (üretradan) dışarı\nsarkıp vajinada kızarık bir kitle olarak belirebilir.</p>\n<p>Cerrahi Yönetim (EAU 2026):</p>\n<p><em>Endoskopik İnsizyon (Patlatma):</em> Yenidoğan döneminde bebek\nateşli enfeksiyonla (Ürosepsis) gelirse ilk ve en hayat kurtarıcı\nişlemdir. Sistoskopla girilir, o balonun en altından bistüri veya\nlazerle ufak bir delik (insizyon) açılır. İdrar boşalır, balon söner,\nböbrek rahatlar. (Ancak bu delik ileride iatrojenik VUR'a neden\nolabilir).</p>\n<p><em>Üst Pol Heminefrektomi:</em> Eğer DMSA sintigrafisinde o tıkalı\nüst pol tamamen ölmüşse (fonksiyon &lt; %10), o hastalıklı böbrek\nparçasını (üst polü) ve ona ait üreteri robotik/laparoskopik olarak\nkesip çıkarmak kesin çözümdür.</p>\n<h3 id=\"c-ektopi̇k-üreter-sürekli-i̇drar-kaçıran-kız-çocuğu-sırrı\">C.\nEKTOPİK ÜRETER: Sürekli İdrar Kaçıran Kız Çocuğu Sırrı</h3>\n<p>Bazen üst pol üreteri o kadar aşağıya iner ki, mesanenin içine\n(trigona) değil, mesane boynunun bile ötesine (sfinkterin dışına)\naçılır. İşte ürolojinin cinsiyete göre en dramatik klinik farkı burada\nyaşanır.</p>\n<h3 id=\"1-kız-çocuklarında-ektopik-üreter\">1. Kız Çocuklarında Ektopik\nÜreter:</h3>\n<p>Kızlarda sfinkter (idrar tutan kas) kısadır. Ektopik üreter mesane\nboynunu aşar ve üretra, vajina veya vulvaya (sfinkterin DIŞINA)\naçılır.</p>\n<p><em>Klasik Şikayet:</em> Aile gelir ve \"Hocam bu çocuk normal\ntuvaletine gidip şarıl şarıl idrarını yapıyor, ama gün içinde çamaşırı\nsürekli, damla damla ıslak kalıyor\" der. Çünkü alt pol (ve karşı böbrek)\nidrarı mesanede biriktirir (normal işeme), ama ektopik üst polün idrarı\nsfinkterin dışında olduğu için tutulamaz, 7/24 damlar. Tuvalet eğitimli\nbir kızda \"Normal işeme + Sürekli inkontinans\" = Ektopik Üreterdir.</p>\n<h3 id=\"2-erkek-çocuklarında-ektopik-üreter\">2. Erkek Çocuklarında\nEktopik Üreter:</h3>\n<p>Erkeklerde sfinkter ve idrar yolları embriyolojik olarak farklıdır\n(Wolff kanalı). Erkeklerde ektopik üreter ne kadar aşağıya inerse insin\nASLA eksternal sfinkterin dışına AÇILAMAZ. Prostatik üretraya veya\nseminal veziküle açılır.</p>\n<p><em>Klinik:</em> Erkek çocuk ektopik üreter yüzünden ASLA idrar\nkaçırmaz. Ancak idrar sürekli meni kanallarına (seminal veziküle)\ndolduğu için, bu erkek çocuklar bebeklik/çocukluk çağında tekrarlayan\nEpididimit (Testis iltihabı) veya pelvik ağrı atakları ile gelirler.</p>\n<h3 id=\"d-rekonstrükti̇f-cerrahi̇-strateji̇leri̇-i̇ki-boruyu-birleştirmek\">D.\nREKONSTRÜKTİF CERRAHİ STRATEJİLERİ (İki Boruyu Birleştirmek)</h3>\n<p>Eğer ektopik üreter veya üreterosel var ama üst pol böbrek dokusu\nDMSA'da \"hala yaşıyor (fonksiyonu &gt; %15-20)\" ise, o böbreği kesip\natmayız (Heminefrektomi yapmayız). Kanalı onarmamız gerekir.</p>\n<p>Üretero-Üreterostomi (İpsilateral): Karnın içinden\n(Robotik/Laparoskopik) o hastalıklı (ektopik/tıkalı) üst pol üreterini\nkeseriz. Normal çalışan alt pol üreterinin yan duvarına bir delik açıp,\nüst pol üreterini sağlam alt pol üreterine dikeriz (Y-şeklinde\nbirleşim). Böylece tek bir sağlam tünelden mesaneye akarlar.</p>\n<p>Ortak Kılıf (Common Sheath) Reimplantasyonu: Alt pol reflü (VUR)\nyapıyor, üst pol tıkanıyorsa; her iki üreteri de mesaneden tek bir blok\n(çift namlulu tüfek gibi) halinde sökeriz. Mesanede devasa yeni bir\ntünel kazar, iki üreteri yan yana (ortak kılıf içinde) yeni bir sübap\nmekanizmasıyla mesaneye gömeriz (Cohen veya Lich-Gregoir).</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Hastaya bir İVP (İntravenöz Pyelografi) veya Ultrason çektin.\nAlt pol kaliksleri ve renal pelvisi sanki aşağıya doğru itilmiş, boynu\nbükük bir çiçek gibi (Aşağı doğru deplase) görünüyor. Üst pol ise ortada\nhiç görünmüyor. Bu klasik radyolojik belirtinin adı nedir ve ne anlama\ngelir?\"</p>\n<p>Cevap: \"Buna 'Sarkan Zambak Belirtisi' (Drooping Lily Sign) denir.\nÜst pol o kadar şiddetli tıkanmış veya kistik hale gelmiştir ki, böbrek\nfonksiyonunu yitirmiştir ve kontrast maddeyi tutmaz (radyolojide\ngörünmez). Ancak o görünmeyen devasa hidronefrotik kitle/kist, fiziksel\nolarak alttaki sağlam böbrek dokusunu ve pelvisini aşağıya ve dışa doğru\niter. Bu görüntü aksi ispat edilene kadar, tıkalı ve fonksiyonunu\nyitirmiş (genellikle ektopik üreter/üreteroselli) bir üst pol\nduplikasyonunu kanıtlar.\"</p>\n<p>Soru: \"Sürekli idrar kaçıran bir kız çocuğu geldi. Ektopik üreterden\nşüphelendin. Ultrason yaptın ama ultrason tamamen 'NORMAL' geldi,\nduplikasyon göremedin. Şüphen devam ediyor, çünkü ektopik üst poller\nultrasonla her zaman görülemeyecek kadar küçük (displastik) olabilir.\nTanıyı kesinleştirmek ve o kayıp böbreği bulmak için altın standart\ngörüntüleme nedir?\"</p>\n<p>Cevap: \"Ultrasonun göremediği, küçülmüş (displastik) ve milimetrik\nektopik kanalları saptamanın ve anatomik haritayı tüm detaylarıyla\nçıkarmanın günümüzdeki altın standardı Kontrastlı Manyetik Rezonans\nÜrografi (MR Ürografi)'dir. MRÜ bize o kayıp üst polün yerini,\nfonksiyonunu ve üreterin tam olarak vajinada/sfinkterde nereye\naçıldığını milimetrik olarak gösterir.\"</p>\n<p>Soru: \"Yenidoğan kız bebekte devasa bir ektopik üreterosel saptadın.\nBebek ateşli. Endoskopik olarak (sistoskopla) üreteroseli deldin\n(puncture) ve bebeği sepsisten kurtardın. Bu bebeğin ilerleyen\nyıllarında karşılaşacağı en yüksek ihtimalli (%50-60) uzun dönem\nkomplikasyon nedir ve aileye ne söylemelisin?\"</p>\n<p>Cevap: \"Aileye şunu söylemeliyim: 'Kisti patlatarak böbreği\nrahatlattık ve ateşi düşürdük. Ancak o kisti deldiğimiz yer, mesane\nbasıncı arttığında idrarın geri kaçması için açık bir kapı haline\ngeldi.' Yani bu bebeklerin yarıdan fazlasında ileride o delinen üst pole\nveya yanındaki alt pole doğru İatrojenik Vezikoüreteral Reflü (VUR)\ngelişir. Bebek antibiyotik profilaksisine alınmalı ve birkaç ay sonra\nmutlaka kontrol VCUG (işeme filmi) çekilerek reflü olup olmadığı teyit\nedilmeli, gerekirse ileride reimplantasyon (açık/robotik onarım)\nyapılmalıdır.\"</p>\n"}, {"id": "12.9", "t": "Posterior Üretral Valv (PUV) ve Sekonder Mesane Hasarı", "h": "<h3 id=\"a-düşmanin-anatomi̇si̇-ve-fetal-keyhole-beli̇rti̇si̇\">A. DÜŞMANIN\nANATOMİSİ VE FETAL \"KEYHOLE\" BELİRTİSİ</h3>\n<p>Posterior Üretral Valv, embriyolojik gelişim sırasında (Wolff kanalı\nkalıntıları) sadece ERKEK fetüslerde görülen, prostatik üretranın içine\nyelken gibi gerilmiş anormal bir mukoza katlantısıdır (zardır).</p>\n<p>Ana Vana Kapalı: İdrar mesaneden çıkar ama üretradan (penisten)\ndışarı akamaz. Bu zar, içeriden dışarıya doğru tek yönlü bir tıkaç gibi\nçalışır.</p>\n<p>Oligohidramnios ve Ölümcül Sonuç: Anne karnındaki suyun (amniyon\nsıvısı) kaynağı fetal idrardır. Bebek idrar yapamadığı için sıvı biter.\nSıvı bittiği için bebeğin akciğerleri gelişemez (Pulmoner Hipoplazi).\nPUV hastalarında en sık ölüm nedeni böbrek yetmezliği değil, doğumdan\nhemen sonra nefes alamamaktır.</p>\n<p>Ultrasondaki Klasik Görüntü (Anahtar Deliği): Fetal ultrasonda\ndevasa, kalın duvarlı bir mesane (anahtarın yuvarlak kısmı) ve mesanenin\nhemen altında genişlemiş, idrarla dolu prostatik üretra (anahtar\ndeliğinin uzun kısmı) görülür. Buna Keyhole Sign (Anahtar Deliği\nBelirtisi) denir.</p>\n<h3 id=\"b-düdüklü-tencere-pop-off-mekanizmaları-ve-vurd-sendromu\">B.\nDÜDÜKLÜ TENCERE: \"Pop-Off\" Mekanizmaları ve VURD Sendromu</h3>\n<p>Sistemde muazzam bir hidrostatik basınç var. Doğa, böbrekleri tamamen\npatlamaktan kurtarmak için bazı \"kaçış (pop-off)\" supapları yaratır. Bu\nsupaplar açılırsa bir böbrek feda edilir ama diğer böbrek o devasa\nbasınçtan korunarak kurtulur:</p>\n<p>İdrar Kaçağı (Fetal Asit / Ürinoma): Böbrek fornkslerinden biri\npatlar ve idrar böbrek etrafına (perirenal mesafeye) veya karın içine\n(üriner asit) sızar. Basınç düşer.</p>\n<p>Devasa Mesane Divertikülü: Mesane duvarı o kadar zorlanır ki,\nfıtıklaşarak kocaman bir baloncuk (divertikül) oluşturur ve basıncı\nemer.</p>\n<p>VURD Sendromu (Vizitlerin Popüler Sorusu): * Valv (PUV varlığı)</p>\n<p>Unilateral Reflü (Tek taraflı devasa VUR)</p>\n<p>Displazi (Reflü olan böbreğin çürümesi/displastik hale gelmesi)</p>\n<p><em>Mantığı:</em> Sol böbreğin kapağı patlar ve tüm basınç sol\nböbreğe vurur (şiddetli reflü). Sol böbrek tamamen çürür (displazi),\nancak bir \"paratoner\" gibi tüm basıncı üzerine çektiği için SAĞ böbrek\ntamamen sağlam kalır.</p>\n<h3 id=\"c-postnatal-aci̇l-yöneti̇m-o-i̇lk-24-saat\">C. POSTNATAL ACİL\nYÖNETİM: O İlk 24 Saat</h3>\n<p>Bebek doğdu, yoğun bakıma alındı ve solunumu cihaza bağlandı. Üroloji\nasistanı olarak senin yapacağın ilk ve en hayati hamle ameliyat değil,\ndrenajdır.</p>\n<p>Beslenme Sondası (Feeding Tube): Üretradan içeri asla balonlu Foley\nsonda takılmaz! Mesane boynunu tahriş eder veya üreter orifislerini\ntıkar. Hemen incecik (5F veya 6F) bir beslenme sondası (Feeding Tube)\ntakılır ve mesane boşaltılır.</p>\n<p>Kreatinin Takibi: Doğumdaki kreatinin annenin kreatininidir. Bebeğin\nkendi böbrek fonksiyonunu görmek için sonda takıldıktan sonraki 3.-5.\ngünlerdeki bazal kreatinin seviyesine bakılır.</p>\n<p>Altın Standart Tanı (VCUG): Sonda takılıyken mesaneye ilaç verilir.\nİdrar yaparken çekilen filmde (İşeme Sistouretrografisi) o meşhur\ngenişlemiş prostatik üretra, ani daralma noktası (valv) ve trabeküle\nmesane net olarak görülür.</p>\n<h3 id=\"d-cerrahi̇-valv-ablasyonu-ve-vesikostomi\">D. CERRAHİ: Valv\nAblasyonu ve Vesikostomi</h3>\n<p>Bebek stabilize olduktan (enfeksiyon yok, böbrek fonksiyonu\noturduktan) sonra o zarı ortadan kaldırmak zorundayız.</p>\n<p>Endoskopik Valv Ablasyonu (Altın Standart):<br />\nMinik bir yenidoğan sistoskopuyla (pediatrik rezektoskop) üretradan\ngirilir. Saat 5 ve 7 hizalarındaki o yelken gibi zarlar soğuk bıçak\n(cold knife) veya Holmium/Thulium Lazer ile kesilerek (ablasyon) yol\naçılır. Koter (elektrik) kullanmaktan olabildiğince kaçınılır çünkü o\nincecik üretrayı yakıp ileride darlığa (striktür) neden olabilir.</p>\n<p>Kutanöz Vesikostomi (Kurtarma Hamlesi):<br />\nEğer bebek prematüreyse, üretra o kadar incedir ki elindeki en küçük\nendoskop bile içeri girmez. Üretrayı parçalamak yerine, göbeğin hemen\naltından (açık cerrahiyle) mesaneyi doğrudan cilde ağızlaştırırsın\n(Vesikostomi). İdrar aylarca doğrudan bezine akar. Bebek 1-2 yaşına\ngelip üretra büyüdüğünde, aşağıdan girip valvi kesersin ve vesikostomiyi\nkapatırsın.</p>\n<h3 id=\"e-en-büyük-kabus-valve-bladder-syndrome-valv-mesanesi\">E. EN\nBÜYÜK KABUS: Valve Bladder Syndrome (Valv Mesanesi)</h3>\n<p>Valvi kestin, yol tamamen açıldı. Aileye \"Bitti, kurtuldu\" diyebilir\nmisin? ASLA.</p>\n<p>Campbell'ın o acı gerçeği şudur: Valv sadece bir buzdolabı kapısıdır,\nasıl sorun motorun yanmasıdır. Anne karnında aylarca o devasa basınca\nkarşı kasılmaya çalışan mesane kası (Detrüsör), geri dönüşümsüz olarak\nhipertrofiye uğramış, kollajen dolmuş ve beton gibi sertleşmiştir (Kötü\nKompliyans).</p>\n<p>Valv açılsa bile mesane artık normal esneyemez. İçine azıcık idrar\ndolsa bile basınç aniden fırlar. Bu yüksek basınç ömür boyu böbreklere\nvurmaya devam eder.</p>\n<p>PUV hastalarının yaklaşık %30'u, valv çok başarılı kesilmiş olsa\nbile, ergenlikte veya 20'li yaşlarında bu mesane hasarı yüzünden Son\nDönem Böbrek Yetmezliğine (SDBY) gider ve böbrek nakli olmak zorunda\nkalır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Yenidoğan yoğun bakıma PUV şüphesiyle konsültasyona çağrıldın.\nBebeğe 6F beslenme sondası takmaya çalışıyorsun ama sonda bir türlü\nmesaneye geçmiyor, prostatik üretrada o valvin (zarın) olduğu yerde\nkıvrılıp kalıyor. Ne yaparsın?\"</p>\n<p>Cevap: \"Sondayı asla zorlamam, çünkü yenidoğan üretrası kağıt gibi\nincedir ve kolayca delinip (false passage) kalıcı hasar görebilir. Eğer\nüretral sonda geçmiyorsa, ultrason eşliğinde mesaneye karın cildinden\n(suprapubik bölgeden) ince bir iğneyle girerek Perkütan Suprapubik\nKateter takarım. Mesaneyi yukarıdan boşaltır, bebek stabilize olduktan\nsonra endoskopik olarak aşağıdan müdahale ederim.\"</p>\n<p>Soru: \"Sonda taktın, mesaneyi boşalttın. Bebek günde 1.5 litre idrar\n(poliüri) çıkarmaya başladı! Yenidoğan bir bebek için bu devasa bir\nrakam. Bunun fizyolojik sebebi nedir ve nasıl yönetirsin?\"</p>\n<p>Cevap: \"Bu klasik bir Post-Obstrüktif Diürez tablosudur. Tıkalı kalan\nböbreklerin tübülleri (konsantrasyon yeteneği) hasar görmüştür.\nTıkanıklık aniden açılınca, böbrek suyu ve sodyumu tutamaz, ne varsa\ndışarı atar. Bebeği hızla dehidratasyona ve ölümcül elektrolit\ndengesizliğine sokabilir. Bu sıvıyı damardan (IV) anında, saatlik idrar\ntakibiyle birebir veya 1/2 oranında replase etmek (yerine koymak)\nyenidoğan ekibiyle yapacağımız en hayati tıbbi müdahaledir.\"</p>\n<p>Soru: \"Valv ablasyonu yaptığın bir çocuk 5 yaşına geldi. Geceleri\naltını ıslatıyor, gündüzleri de sürekli idrar kaçırıyor. Ultrasonunda\nböbrekleri tekrar şişmeye başlamış (Bilateral Hidronefroz). Ne\ndüşünürsün?\"</p>\n<p>Cevap: \"İlk aklıma gelen 'Acaba valv nüks mü etti (tekrar mı\nbüyüdü)?' sorusu olur ancak bu nadirdir. Asıl düşünmem gereken şey Valve\nBladder Syndrome (Valv Mesanesi)'dir. Betonlaşmış, sert (düşük\nkompliyanslı) mesane yüksek basınç yaratıyordur. Tanıyı koymak için\nacilen Ürodinami yapmalıyım. Eğer basınçlar yüksekse, mesaneyi gevşetmek\niçin Antikolinerjik ilaçlar (Oksibutinin) başlar ve çocuğa ailesi\ntarafından günde 4-6 kez Temiz Aralıklı Kateterizasyon (TAK) yapmasını\nöğretirim.\"</p>\n"}, {"id": "12.10", "t": "Pediatrik Kistik Hastalıklar ve Prune Belly Sendromu", "h": "<p>A. MULTİKİSTİK DİSPLASTİK BÖBREK (MCDK): Kendi Kendini Yok Eden Üzüm\nSalkımı</p>\n<p>Yenidoğanlarda saptanan karın içi kitlelerin (hidronefrozdan sonra)\nen sık ikinci nedenidir. Aileye \"Bebeğinizin bir böbreği tamamen kist\ndolu ve hiç çalışmıyor\" demek zor bir an olsa da, bu hastalığın doğal\nseyri aslında ürolojinin en büyük iyileşme hikayelerinden biridir.</p>\n<p>Patofizyoloji: İlk derste konuştuğumuz o \"Hücresel Diyalog\" (Üreterik\ntomurcuk ile metanefrik blastem arasındaki sinyalleşme) 8-10. haftalarda\ntamamen iflas eder. Gerçek bir böbrek dokusu (nefron) oluşmaz. Bunun\nyerine böbrek, birbirleriyle bağlantısı olmayan (non-communicating),\nfarklı boyutlarda kistlerden oluşan ve üzüm salkımına benzeyen\ndisplastik bir kitleye dönüşür. Üreter (kanal) ise genellikle ip gibi\n(atretik) kalır veya hiç yoktur.</p>\n<p>Tanı ve Altın Kural: Ultrasonda devasa kistler görülür. En kritik\nayırıcı tanı, şiddetli bir UPJ darlığı (Evre 5 hidronefroz) ile MCDK'yı\nayırmaktır. MCDK'da kistler arasında bağlantı yoktur ve merkezde bir\nRenal Pelvis (Havuzcuk) GÖRÜLMEZ. (UPJ'de ise tüm kistler/kaliksler\nmerkezdeki devasa pelvise açılır). Kesin tanı DMSA sintigrafisi ile\nkonur: MCDK olan tarafta ilaç tutulumu (fonksiyon) SIFIRDIR (%0).</p>\n<p>Yönetim (EAU 2026): Bıçak Yok, İzlem Var!<br />\nGeçmişte bu fonksiyonu olmayan böbrekler kanser yapar veya tansiyonu\nyükseltir korkusuyla (Nefrektomi ile) alınırdı. Bugün biliyoruz ki\nMCDK'lı böbreklerin %60-70'i ilk 5 yıl içinde kendiliğinden küçülerek\n(involüsyon) tamamen kaybolur. * Sadece USG ile izlenir.</p>\n<p><em>Nefrektomi Endikasyonları:</em> Kist o kadar devasadır ki bebeğin\nsolunumunu/beslenmesini engeller, yıllar içinde küçülmez (büyümeye devam\neder) veya tedaviye dirençli hipertansiyon yaparsa laparoskopik olarak\nçıkarılır.</p>\n<p>B. OTOZOMAL RESESİF POLİKİSTİK BÖBREK HASTALIĞI (ARPKD): Bebeklik\nÇağının Katili</p>\n<p>Yetişkinlerdeki o meşhur ADPKD'yi (Otozomal Dominant)\nonkoloji/yetişkin vizitlerinden biliyorsun. Ancak onun \"Resesif\"\n(çekinik) versiyonu olan ARPKD, anne karnında veya yenidoğan döneminde\nortaya çıkan, son derece ölümcül bir genetik mutasyondur (PKHD1 geni -\nFibrokistin proteini).</p>\n<p>Klinik Tablo: Her iki böbrek de anne karnında devasa boyutlara\nulaşır. Ancak MCDK'nın aksine kistler makroskobik (büyük) değildir;\nmikroskobik düzeydedir. Bu mikrokistler böbreği bir sünger gibi kaplar\nve ultrasonda böbrekler bembeyaz (Artmış Ekojenite) görünür.</p>\n<p>Ölümcül Sonuçlar: Böbrekler idrar üretemediği için Oligohidramnios ve\nona bağlı Potter Sekansı (Pulmoner Hipoplazi - Akciğer gelişememesi)\ngelişir. Bebeklerin çoğu doğumdan hemen sonra solunum yetmezliğinden\nkaybedilir.</p>\n<p>Karaciğer Bağlantısı: Yaşayan çocuklarda böbrek yetmezliğinin yanında\nmutlaka Konjenital Hepatik Fibrozis (karaciğer sirozu ve portal\nhipertansiyon) gelişir. Ürolog ve Hepatolog bu çocukları birlikte takip\neder.</p>\n<h3 id=\"c-prune-belly-sendromu-eagle-barrett-kuru-erik-görünümü\">C.\nPRUNE BELLY SENDROMU (EAGLE-BARRETT): Kuru Erik Görünümü</h3>\n<p>Sadece erkek çocuklarda görülen, insidansı 1/40.000 olan ve bir kez\ngördüğünde hayatın boyunca unutamayacağın o dramatik sendrom. Hastalık 3\nana kusurdan (Triad) oluşur:</p>\n<p>Karın Duvarı Kaslarının Yokluğu (Aplasia): Bebeğin karın kasları\n(rektus abdominis) hiç gelişmemiştir. Karın zarı doğrudan derinin\naltındadır. Cilt, içi boşaltılmış bir çuval veya \"kuru erik (prune)\"\ngibi buruşuk, kat kat ve incedir. Bağırsak hareketleri dışarıdan gözle\nizlenebilir.</p>\n<p>Bilateral Kriptorşidizm (İnmemiş Testis): Testislerin her ikisi de\nkarın içinde, böbrek seviyelerinde (çok yüksekte) kalmıştır, torbaya\ninmemiştir.</p>\n<p>Şiddetli Üriner Sistem Anomalileri: Mesane devasa boyutta ve\natoniktir (kasılmaz). Üreterler inanılmaz derecede genişlemiş ve\nkıvrımlı (Megaüreter) haldedir. Prostatik üretra çok geniştir.</p>\n<p>Neden Olur? (Patofizyoloji Teorileri):</p>\n<p><em>Üretral Obstrüksiyon Teorisi:</em> Anne karnında üretra tıkanır\n(PUV benzeri). Mesane ve üreterler patlayacak kadar şişer. Bu devasa\nşişlik, karın duvarı kaslarının içeriden ezilerek (basınç nekrozu)\ngelişmesini engeller. Ayrıca devasa mesane, testislerin kasıktan aşağı\ninme (desensus) yolunu fiziksel olarak kapatır.</p>\n<p><em>Mezenkimal Defekt Teorisi:</em> Embriyolojik dönemde karın\nduvarını ve idrar yollarının düz kaslarını oluşturacak olan mezenkimal\ndokunun genetik olarak hatalı gelişimidir.</p>\n<p>Yönetim: Böbrekleri korumak için koruyucu antibiyotikler, gerekirse\nidrarı cilde ağızlaştırma (Vesikostomi). Çocuk büyüdükçe karın duvarını\ntoparlamak için estetik cerrahi (Abdominoplasti) ve testisleri kanser\nriskine karşı aşağı indirme (Orşiopeksi) yapılır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Poliklinikte sol MCDK (Multikistik Displastik Böbrek) tanılı\nbir bebeği takip ediyorsun. Sol böbrek zaten fonksiyonsuz. Ancak\nkılavuzlar sana SAĞ (sağlam) böbreği de çok yakından, VCUG çekerek\nincelemeni söyler. Neden sağlam tarafla bu kadar ilgileniyoruz?\"</p>\n<p>Cevap: \"Çünkü MCDK izole bir hastalık değildir; sıklıkla karşı\ntarafın (sağlam böbreğin) anomalileriyle birliktedir. Hastaların\nyaklaşık %20-30'unda SAĞ (karşı) böbrekte Vezikoüreteral Reflü (VUR)\nveya UPJ darlığı saptanır. Hastanın hayatta kalması o tek sağlam böbreğe\nbağlıdır. Eğer o sağlam böbrek de VUR yüzünden enfekte olup çürürse,\nhasta doğrudan diyalize gider. Bu yüzden karşı böbrek altın değerindedir\nve kusursuz korunmalıdır.\"</p>\n<p>Soru: \"Prune Belly sendromlu bir çocukta, bilateral inmemiş\ntestisleri (Kriptorşidizm) torbaya indirmek için standart kasık kesisi\n(İnguinal Orşiopeksi) mi yaparsın, yoksa cerrahi planın farklı mı\nolur?\"</p>\n<p>Cevap: \"Standart inguinal kesi işe yaramaz. Prune Belly sendromunda\ntestisler inguinal kanalda değil, çok daha yüksekte, karın içinde\n(İntra-abdominal) kalmıştır. Ayrıca bu testislerin damarları (spermatik\nkordon) çok kısadır. Bu testisleri indirmek için karın içinden\n(Laparoskopik) girmek ve genellikle damarları keserek testisi sadece vaz\ndeferens damarları üzerinden besleyip aşağı aldığımız Fowler-Stephens\nOrşiopeksi tekniğini kullanmak zorundayız.\"</p>\n<p>Soru: \"Yenidoğan yoğun bakımda, oligohidramnios öyküsü olan, karnı\nburuşuk (Prune Belly görünümü) bir erkek bebek var. Acaba bu gerçek bir\nPrune Belly sendromu mu, yoksa Posterior Üretral Valv (PUV) sekonderi\nbir 'Yalancı Prune Belly' mi? Bunu ayırmak için kliniğe/görüntülemeye\nbakarak ipucunu nereden yakalarsın?\"</p>\n<p>Cevap: \"En kritik klinik ipucu Testislerdir. Gerçek Prune Belly\nsendromunda testisler KESİNLİKLE her iki tarafta da inmemiştir\n(Bilateral kriptorşidizm). PUV hastalarında ise, karnı çok şişip buruşuk\ngörünse bile, testisler genellikle torbaya (skrotuma) inmiş durumdadır.\nAyrıca VCUG yapıldığında, PUV'da o klasik yelken gibi zarı (valvi)\ngörürüz, Prune Belly'de ise prostatik üretra sadece devasa genişlemiştir\nama tıkayıcı bir zar yoktur.\"</p>\n"}]}, {"n": 13, "t": "Pediatrik Üroloji II", "s": [{"id": "13.1", "t": "Hipospadias Embriyolojisi, Sınıflaması ve Kordi (Eğrilik) Patofizyolojisi", "h": "<h3 id=\"a-embri̇yoloji̇-yarım-kalan-fermuar-ve-dht-mucizesi\">A.\nEMBRİYOLOJİ: Yarım Kalan Fermuar ve DHT Mucizesi</h3>\n<p>Anne karnında erkek dış genitalyasının gelişimi, testisten salgılanan\nTestosteron'un, 5-alfa redüktaz enzimi ile daha güçlü formu olan\nDihidrotestosteron'a (DHT) dönüşmesiyle başlar.</p>\n<p>Fermuarın Kapanması (8-14. Haftalar): DHT'nin etkisiyle, penisin alt\nyüzeyindeki (ventralindeki) üretral katlantılar (urethral folds), tıpkı\nbir ceket fermuarı gibi tabandan (proksimalden) uca (distale) doğru\nyavaş yavaş birleşerek kapanır. Bu kapanma, idrar kanalını (üretrayı)\npenisin içine hapseder.</p>\n<p>Hipospadias Nasıl Oluşur? Eğer genetik bir defekt, androjen reseptör\nduyarsızlığı veya çevresel endokrin bozucular yüzünden bu DHT sinyali\nzayıflarsa, fermuar kapanmayı yarıda bırakır. İdrar deliği (Meatus),\npenisin ucuna (glansa) ulaşamadan alt yüzeyde bir yerde açık kalır.</p>\n<p>Dorsal Kukuleta (Prepusyal Asimetri): Fermuar alttan kapanamadığı\niçin, sünnet derisi de penisin altını saramaz. Sünnet derisi penisin\nsadece üstünde (dorsalinde) yığılır ve şapka gibi bir görünüm oluşturur.\n(Buna klasik 'Dorsal Hood' denir).</p>\n<h3 id=\"b-kli̇ni̇k-siniflama-delik-nerede\">B. KLİNİK SINIFLAMA: Delik\nNerede?</h3>\n<p>Hipospadiasın ciddiyetini ve ameliyatın zorluğunu belirleyen tek şey\ndeliğin (meatusun) glanstan (uçtan) ne kadar uzaklaştığıdır. Kılavuzlar\nanatomik yerleşime göre 3 ana gruba ayırır:</p>\n<p>Anterior (Distal) Hipospadias (%70): En sık görülen ve en hafif\nformdur. Delik glansın altındadır (Glandüler), hemen glansın altındaki\nboğumdadır (Koronal) veya boğumun bir tık altındadır (Subkoronal).\nGenellikle tek seanslık, yüksek başarı oranlı cerrahilerle\ndüzeltilir.</p>\n<p>Orta (Mid-shaft) Hipospadias (%10-15): Delik penisin gövdesinin\nortalarındadır.</p>\n<p>Posterior (Proksimal) Hipospadias (%15-20): En ağır, en komplike\nformdur. Delik penisin torbayla birleştiği yerdedir (Penoskrotal),\ntorbanın ikiye ayrıldığı yerdedir (Skrotal) veya makata çok yakındır\n(Perineal). Bu hastalarda sadece idrar kanalı kısa değildir, penis de\ngenellikle çok küçüktür ve cinsel farklılaşma bozuklukları (DSD) riski\nmuazzam derecede yüksektir.</p>\n<h3 id=\"c-kordi̇-chordee-penisin-aşağıya-eğilmesi-ventral-curvature\">C.\nKORDİ (CHORDEE): Penisin Aşağıya Eğilmesi (Ventral Curvature)</h3>\n<p>Hipospadias sadece \"deliğin yanlış yerde olması\" hastalığı DEĞİLDİR.\nDeliğin yanlış yerde olmasına eşlik eden ve ameliyatın asıl zorluğunu\noluşturan Kordi (Ventral Eğrilik) tablosudur. Penis ereksiyon\nhalindeyken aşağıya doğru şiddetle bükülür.</p>\n<p>Eğer kordiyi düzeltmeden deliği yukarı taşırsan, o çocuk ileride\ncinsel ilişkiye giremez. Peki penis neden aşağı bükülür? (İşte cerrahi\nanatominin 3 suçlusu):</p>\n<p>Cilt Eksikliği (Skin Tethering): Penisin altındaki (ventral) cilt\nyeterince gelişmemiştir ve kısa kaldığı için penisi bir yay kirişi gibi\naşağı çeker.</p>\n<p>Fibröz Bant (Displastik Doku): Deliğin bittiği yerden glansa kadar\nolan kısımda, normalde idrar kanalını saran o yumuşak süngerimsi doku\n(Korpus Spongiozum) yoktur. Vücut onun yerine oraya taş gibi sert,\nesnemeyen fibröz bir doku (nedbe/kordon) örmüştür. Ereksiyon anında sırt\n(dorsal) esnerken, bu alt doku esnemez ve penisi aşağı büker.</p>\n<p>Korporal Disproporsiyon (En Zoru): Sorun ciltte veya fibröz bantta\ndeğildir; ereksiyonu sağlayan ana silindirlerin (Korpus Kavernozumların)\nalt ve üst uzunlukları birbirinden farklı gelişmiştir (Üst taraf uzun,\nalt taraf kısadır). Bu anatomik orantısızlık penisi kemikten bükülmüş\ngibi aşağı eğer.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe birinci basamaktan veya acilden bir aile geldi.\nBebekte basit bir koronal (ön) hipospadias var. Aile, 'Hocam bizim\nbölgemizde sünnetçi var, bari çocuğu hazır küçükken hemen sünnet\nettirelim, idrar deliği ameliyatını siz sonra yaparsınız' diyor.\nYaklaşımın ne olmalıdır?\"</p>\n<p>Cevap: \"Kesin ve net bir şekilde aileyi uyarır ve SÜNNETİ YASAKLARIM.\nHipospadiaslı bir çocukta sünnet derisi (Dorsal Hood), o eksik olan\nidrar kanalını (üretrayı) sıfırdan yaratmak (flep/greft) ve penisin\naltındaki cilt defektini kapatmak için kullanacağımız en hayati, altın\ndeğerindeki yedek dokudur. Sünnet derisi kesilip atılırsa, çocuğu kendi\ndokusuyla tedavi etme şansımızı çöpe atmış oluruz (ağız içinden mukoza\nalmak zorunda kalırız).\"</p>\n<p>Soru: \"Ameliyattasın. Cildi soydun (Degloving), fibröz bantları\ntemizledin ama penisin kordisi (eğriliği) düzeldi mi düzelmedi mi emin\ndeğilsin. Bunu ameliyat masasında, inik (flaksid) bir peniste objektif\nolarak nasıl test edersin?\"</p>\n<p>Cevap: \"Bunun için Yapay Ereksiyon Testi (Gittes Testi) yaparım.\nPenisin köküne (tabanına) ince bir lastik turnike sararak kanın geri\ndönüşünü engellerim. Ardından korpus kavernozumların içine ince bir iğne\n(kelebek) ile Serum Fizyolojik (SF) basarak penisi suni olarak şişiririm\n(Ereksiyon yaratırım). Penis tam rijit hale geldiğinde, yandan bakarak\neğriliğin (kordinin) açısını ölçerim. Eğrilik tamamen düzelene kadar\ncerrahi manevralara devam ederim.\"</p>\n<p>Soru: \"Yenidoğan ünitesine çağrıldın. Bebekte çok ağır bir 'Perineal\nHipospadias' (delik makata yakın) ve her iki testisi de torbada YOK\n(Bilateral Kriptorşidizm). Bebeğin genel durumu iyi görünüyor. Bu tablo\nsadece ürolojik bir anomali midir, yoksa arkasında yatan gizli ve\nölümcül bir tehlike var mıdır?\"</p>\n<p>Cevap: \"Bu tablo aksi ispat edilene kadar bir Cinsiyet Gelişim\nBozukluğudur (DSD - Disorder of Sex Development). Şiddetli hipospadias +\nbilateral inmemiş testis kombosu, aslında bu bebeğin genetik olarak bir\nkız çocuğu (46, XX) olduğu, ancak Konjenital Adrenal Hiperplazi (KAH)\nnedeniyle aşırı androjen salgılayıp dışarıdan erkek gibi göründüğü\n(Virilizasyon) anlamına gelebilir. KAH hastası bir bebek ilk 1-2 hafta\niçinde ölümcül bir Tuz Kaybı Krizine (Salt-wasting crisis / Adrenal\nkriz) girebilir. Acilen serum elektrolitlerine (Sodyum/Potasyum), 17-OH\nProgesteron seviyesine bakılmalı ve Karyotip analizi istenmelidir.\nHayati bir endokrin acilidir.\"</p>\n"}, {"id": "13.2", "t": "Hipospadias Cerrahisi (TIP/SNODGRASS, Flepler ve Komplikasyon Yönetimi)", "h": "<h3\nid=\"a-devri̇m-yaratan-tekni̇k-tip-tubularized-incised-plate--snodgrass\">A.\nDEVRİM YARATAN TEKNİK: TIP (Tubularized Incised Plate / Snodgrass)</h3>\n<p>1994 yılında Warren Snodgrass tarafından tanımlanan bu teknik,\ngünümüzde distal (ön) ve mid-shaft (orta) hipospadiasların dünya\nçapındaki tartışmasız altın standardıdır.</p>\n<p>Sorun: İdrar deliği ile glansın ucu arasında kalan o düz, mukoza\nbenzeri şeride Üretral Plak denir. Eskiden bu plak çok dar olduğunda,\ndoktorlar onu boru (tüp) haline getiremez, kıvrılmaz diye kesip\natarlardı.</p>\n<p>Snodgrass'ın Dehası (İnsizyon): Plak darsa, onu kesip atmak yerine\ntam ortasından, uzunlamasına derin bir çizik (insizyon) atılır. Bu\nçizik, plağın bir kitabın sayfaları gibi iki yana açılmasını ve\nesnemesini sağlar.</p>\n<p>Tübülerizasyon (Boru Yapma): Genişleyen bu plak, 6-0 veya 7-0 PDS\ndikişlerle, ince bir sondanın (stentin) üzerinden dikilerek bir tüp\n(üretra) haline getirilir.</p>\n<p>İkincil İyileşme: \"Peki o ortadan attığımız derin kesi (insizyon) ne\nolacak?\" O bölge açık kalır, ancak üzeri mukoza ile örtüldüğü için\nhaftalar içinde vücut tarafından kendi kendine (sekonder iyileşme ile)\nonarılır ve yeni üretranın tavanını oluşturur.</p>\n<h3\nid=\"b-ağir-vakalar-flep-ve-greftlerin-savaşı-proksimal-hipospadias\">B.\nAĞIR VAKALAR: Flep ve Greftlerin Savaşı (Proksimal Hipospadias)</h3>\n<p>Eğer delik çok gerideyse (skrotuma yakınsa), kordi (eğrilik) çok\nşiddetliyse ve üretral plak kullanılamayacak kadar hastalıklıysa, TIP\ntekniği işe yaramaz. Yeni bir boru yapmak için dışarıdan doku getirmek\nzorundayız.</p>\n<p>Vaskülarize Flepler (Kendi Damarıyla Gelen Dokular):</p>\n<p>Penis cildi veya o çok kıymetli Sünnet Derisi (Prepusyum), altındaki\ndamar ağıyla (pedikül) birlikte serbestleştirilir, penisin altına\nkaydırılır ve boru şeklinde dikilir (Örn: <em>Duckett Onlay veya\nTransvers Ada Flebi</em>). Damarı olduğu için tutma şansı yüksektir ama\nyapması teknik olarak çok zordur.</p>\n<p>Serbest Greftler (Aşamalı Cerrahiler - Bracka Tekniği):</p>\n<p>Eğer elde kullanacak sünnet derisi kalmamışsa (daha önce yanlışlıkla\nsünnet edilmişse veya ameliyat başarısız olup nüks etmişse -\n<em>Hypospadias Cripple</em>), vücudun başka bir yerinden yama (greft)\nalınır.</p>\n<p>Altın Standart Greft: Bukkal Mukoza (Yanak İçi Zarı). Neden? Çünkü\nkılsuzdur, kalın bir epiteli vardır, çok zengin bir damar yatağından\n(pan-pleksus) beslenir ve ıslak/nemli ortama (idrara) anatomik olarak\nzaten alışıktır.</p>\n<p><em>2 Aşamalı (Staged) Onarım:</em> İlk ameliyatta yanak mukozası\npenisin altına serilir ve tutması beklenir (6 ay). İkinci ameliyatta o\ntutmuş olan mukoza kıvrılarak boru (üretra) haline getirilir.</p>\n<h3 id=\"c-cerrahin-si̇gortasi-su-geçirmez-bariyer-waterproofing\">C.\nCERRAHIN SİGORTASI: Su Geçirmez Bariyer (Waterproofing)</h3>\n<p>Oluşturduğun yeni üretradaki o incecik dikiş hatları, idrarın\nbasıncıyla karşılaştığında sızdırmaya çok müsaittir. Eğer idrar cilt\naltına sızarsa cilt delinir ve Fistül oluşur.</p>\n<p>Bunu engellemek için, yeni diktiğin üretranın üzerine sağlam,\nkanlanan ekstra bir doku tabakası örtmek ZORUNDASIN.</p>\n<p>Kılavuzların emrettiği altın standart bariyerler: Dartos Fasyası\nFlebi (sünnet derisinin altından alınan damarlı zar) veya Tunika\nVajinalis Flebi (testisin etrafındaki zardan alınıp yukarı taşınan\ndoku). Bu katman, bir su borusunun üzerine sarılan teflon bant gibi\nsızıntıyı engeller.</p>\n<h3 id=\"d-kabus-kompli̇kasyonlar-fistül-ve-darlık\">D. KABUS\nKOMPLİKASYONLAR: Fistül ve Darlık</h3>\n<p>Cerrahisi kadar, sonrası da sancılıdır. En deneyimli ellerde bile\nkomplikasyon oranları vardır.</p>\n<p>Üretrokütanöz Fistül (En Sık): Yeni idrar kanalının bir yerinden\ndikişler açılır ve çocuk işerken idrarın bir kısmı penisin altından\n(ikinci bir delikten) fışkırır.</p>\n<p>Meatal Stenoz (Deliğin Daralması): Glansın ucuna taşıdığımız yeni\nidrar deliği (meatus) iyileşirken skar dokusu (nedbe) oluşturup büzüşür.\nÇocuk idrarını iğne deliği kadar bir yerden, ıkınarak ve çok\nince/tazyikli yapar.</p>\n<p>Glans Dehisensi (Yarık Glans): Glansı kapatan dikişler atar ve penis\nucu tekrar ameliyat öncesi o yarık (açık) haline geri döner.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Hastaya TIP (Snodgrass) ameliyatı yaptın. Sondasını çektin,\nher şey yolunda görünüyor. Ancak 3. hafta polikliniğe geldiklerinde aile\nçocuğun penisinin ortasından idrar sızdığını (Fistül geliştiğini)\nsöyledi. Aile çok panik, 'Hocam yarın hemen o deliği tekrar dikin'\ndiyorlar. Fistülü hemen yarın (veya 1 ay içinde) kapatır mısın?\"</p>\n<p>Cevap: \"Kesinlikle HAYIR. Yeni ameliyat olmuş bir dokuda inanılmaz\nbir inflamasyon, ödem ve skar dokusu aktivitesi vardır. O doku tereyağı\ngibidir; dikiş tutmaz, atarsan daha da büyük yırtılır. EAU ve AUA\nrekonstrüktif cerrahi kılavuzlarının altın kuralı şudur: Bir hipospadias\nkomplikasyonuna (fistül veya darlık) müdahale etmek için ilk ameliyatın\nüzerinden en az 6 AY (ideali 6-12 ay) geçmesi ve dokunun tamamen\nyumuşayıp sönmesi (matürasyonu) beklenmelidir.\"</p>\n<p>Soru: \"Ameliyat sonrası 2. ayında polikliniğe gelen çocuğun annesi\n'Hocam çocuk çok ıkınarak işiyor ve idrarı iplik gibi uzağa fışkırıyor'\ndedi. Fizik muayenede deliğin (meatusun) toplu iğne başı kadar\ndaraldığını (Meatal Stenoz) gördün. Bunu 6 ay bekleyerek mi çözersin,\nyoksa acil bir manevra gerekir mi?\"</p>\n<p>Cevap: \"Meatal stenozda (deliğin tıkanması) 6 ay BEKLENMEZ. Çünkü o\ndar delik idrar yolunun içinde devasa bir geri basınç yaratır. Eğer o\nbasıncı hemen boşaltmazsan, içeride yeni diktiğin o narin üretrayı\npatlatır ve devasa 'Blow-out' fistüllere neden olur. Poliklinik\nşartlarında lokal anesteziyle hemen deliği genişletmeli (Meatal\nDilatasyon) veya bistüri ucuyla minik bir kesi atarak (Meatotomi) o\nbasıncı derhal düşürmeliyim.\"</p>\n<p>Soru: \"Çok ağır, defalarca ameliyat olmuş (Cripple) bir hipospadias\nhastası. Artık kullanacak deri kalmamış. Aşamalı (Staged) greft onarımı\nyapacaksın ve hastadan Bukkal Mukoza (yanak içi zarı) alacaksın. Yanağın\niçinden bu yamayı alırken en çok hangi anatomik yapıya dikkat etmeli ve\nona zarar vermemelisin?\"</p>\n<p>Cevap: \"Yanak içinden mukoza alırken cerrahın en büyük korkusu (ve\nsınırı) Stensen Kanalı'dır (Duktus Parotideus). Bu kanal, kulak altı\ntükürük bezinin (Parotis) ağız içine açıldığı yerdir ve genellikle üst\n2. molar diş hizasında yer alır. Greft alırken bu kanalın deliği mutlaka\nkorunmalı ve etrafından dolaşılmalıdır; aksi takdirde çocukta kalıcı\ntükürük yolu tıkanıklıkları, ağrılı parotis şişmeleri veya ağız kuruluğu\n(kserostomi) gelişir.\"</p>\n"}, {"id": "13.3", "t": "İnmemiş Testis (Kriptorşidizm) Patofizyolojisi, Kanser Riski ve İnfertilite", "h": "<h3 id=\"a-kusursuz-göç-desensus-ve-kilavuz-kaptan-gubernakulum\">A.\nKUSURSUZ GÖÇ (DESENSUS) VE KILAVUZ KAPTAN: GUBERNAKULUM</h3>\n<p>Anne karnında testisler, tıpkı böbrekler gibi karın boşluğunda (L1-L2\nseviyesinde) gelişmeye başlar. Erkek fetüs büyüdükçe, bu testislerin\nyaklaşık 15-20 cm'lik bir yolculuk yaparak kasık kanalından geçip\nskrotuma inmesi gerekir. Bu göç iki aşamada ve iki farklı hormonun\nkontrolünde gerçekleşir:</p>\n<p>Transabdominal Faz (Karın İçi Yolculuk): Testisin böbrek altından\nkasık iç halkasına (İnternal ring) kadar olan göçüdür. Bu süreci Leydig\nhücrelerinden salgılanan INSL3 (İnsülin-benzeri faktör 3) hormonu\nyönetir.</p>\n<p>İnguinoskrotal Faz (Kasık-Torba Yolculuğu): Testisin kasık kanalından\ngeçip skrotuma yerleşmesidir. Bu aşamayı tamamen Testosteron yönetir.\n(Prematüre bebeklerde testislerin inmemiş olmasının sebebi, gebeliğin\nson aylarındaki bu testosteron patlamasını anne karnında yaşayamamış\nolmalarıdır).</p>\n<p>Gubernakulum'un Rolü: Testisin alt kutbundan skrotumun tabanına kadar\nuzanan kalın, jölemsi ve fibromüsküler bir kordondur. Testis aşağı\ninmez, aslında Gubernakulum kasılıp kısalır ve testisi bir çapa (veya\nhalat) gibi çekerek torbaya indirir.</p>\n<h3 id=\"b-isi-stresi̇-ve-i̇nferti̇li̇te-kök-hücrelerin-i̇ntiharı-apoptoz\">B.\nISI STRESİ VE İNFERTİLİTE: Kök Hücrelerin İntiharı (Apoptoz)</h3>\n<p>Peki testis neden vücudun dışında, o savunmasız torbada sallanmak\nzorundadır? Çünkü insan spermatogenezi (sperm üretimi) 37°C vücut\nısısında çalışamaz. Kusursuz üretim için ısının 33-34°C olması\nşarttır.</p>\n<p>Eğer testis karın içinde veya kasık kanalında kalırsa, o 37°C'lik\nfırın ısısı mikroskobik düzeyde şu yıkıma yol açar:</p>\n<p>6. Ay Dönüm Noktası: Normal bir erkek bebekte, doğumdan sonraki ilk\naylarda primitif germ hücreleri (Gonositler), kalıcı kök hücrelere (Ad\nSpermatogonyum) dönüşür. Bu dönüşüm infertiliteye karşı en büyük\nsigortadır.</p>\n<p>Isı Hasarı: İnmemiş testiste, 37°C'lik ısı stresi bu dönüşümü\ndurdurur. Spermatogonyumlar gelişemez ve 6. aydan itibaren Apoptoza\n(Programlı Hücre Ölümüne) uğramaya başlar.</p>\n<p>Sonuç: Eğer testis 1-1.5 yaşına kadar indirilmezse, o testisin\niçindeki sperm üretecek kök hücre rezervi kalıcı ve geri dönüşümsüz\nolarak tükenir. Çift taraflı (bilateral) inmemiş testisi olan ve geç\nameliyat edilen erkeklerin ileride ciddi infertilite\n(Azoospermi/Oligozoospermi) yaşama ihtimali %80'lere dayanır.</p>\n<h3 id=\"c-onkoloji̇k-saatli̇-bomba-kanser-riski-neden-fırlar\">C. ONKOLOJİK\nSAATLİ BOMBA: Kanser Riski Neden Fırlar?</h3>\n<p>İnmemiş testis (Kriptorşidizm), Testis Kanseri (Germ Hücreli\nTümörler) için bilinen en büyük risk faktörüdür. Risk, normal\npopülasyona göre yaklaşık 4 ila 10 kat (karın içi yerleşimlilerde 40\nkata kadar) artmıştır. En sık görülen tümör tipi Seminom'dur.</p>\n<p><em>Neden Kanser Olur?</em> Isı stresi ve anormal anatomik\nmikroçevre, germ hücrelerinin genetik kararsızlık yaşamasına ve kanser\nöncüsü olan İntratübüler Germ Hücreli Neoplazi (ITGCN) hücrelerine\ndönüşmesine neden olur.</p>\n<p><em>Altın Kural:</em> Testisi ameliyatla (Orşiopeksi) torbaya\nindirmek kanser riskini tamamen SIFIRLAMAZ. Peki o zaman neden\nindiriyoruz? Çünkü testis karın içindeyken tümörleşirse kitle devasa\nboyutlara ulaşıp metastaz yapana kadar kimse fark edemez. Testis torbaya\nindirildiğinde, hasta 20-30'lu yaşlara geldiğinde duşta kendi kendini\nmuayene edebilir ve fındık kadar bir kitleyi bile erken evrede\nyakalayabilir.</p>\n<p>D. KLİNİK DEDEKTİFLİK: Utangaç Testis (Retraktil) vs. Gerçek\nKriptorşidizm</p>\n<p>Poliklinikte her yukarıda duran testis, ameliyat masasına yatırılmaz.\nAileyi gereksiz cerrahiden kurtaran o muazzam fizik muayene ayrımı:</p>\n<p>Retraktil (Utangaç) Testis: Testis aslında torbaya inmiştir. Ancak\nçocuğun Kremasterik Refleksi çok aşırı çalışmaktadır. Çocuk ağladığında,\nüşüdüğünde veya muayene stresiyle kremaster kası kasılır ve testisi\nasansör gibi kasığa çeker.</p>\n<p><em>Muayene:</em> Çocuğu sıcak bir odaya alıp, bağdaş kurdurup\n(kurbağa pozisyonu) kaslarını gevşettiğinde, testisi elinle yavaşça\nsağarak torbaya indirebilirsin. İndirdikten sonra elini çektiğinde\ntestis torbada KALIR (hemen yukarı kaçmaz).</p>\n<p><em>Tedavi:</em> Ameliyata GEREK YOKTUR. Testis normal gelişir.\nSadece yılda bir kez ergenliğe kadar kontrol edilir.</p>\n<p>Gerçek İnmemiş Testis: Testis kasık kanalında bir yere takılmıştır\n(veya karın içindedir).</p>\n<p><em>Muayene:</em> Testisi zorlayarak torbaya kadar indirsen bile,\nelini çektiğin an testis paket lastiği gibi gergin bir şekilde anında\ntekrar yukarı fırlar. Gubernakulum ve damarlar (kordon) kısadır.</p>\n<p><em>Tedavi:</em> Mutlak cerrahidir (Orşiopeksi).</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Bir yaşındaki çocuğun tek taraflı inmemiş testisi var. EAU\n2026 kılavuzlarına göre bu çocuğun ameliyat (Orşiopeksi) zamanlaması\niçin altın pencere nedir? Neden 2 yaşına kadar beklememeliyiz?\"</p>\n<p>Cevap: \"Bebek doğduğunda testis inmemişse, ilk 6 ay 'kendiliğinden\ninme' (spontan desensus) ihtimaline karşı beklenir. Ancak 6. aydan sonra\nkendiliğinden inme ihtimali sıfıra yakındır ve kök hücre ölümü (apoptoz)\ntam bu aylarda hızlanır. Bu yüzden cerrahi için altın pencere 6. ay ile\n12. ay arasıdır (en geç 18. ay). 2 yaşına kadar beklemek, testisin\nfonksiyonel rezervini geri dönüşümsüz olarak kaybetmesi ve malpraktis\nanlamına gelir.\"</p>\n<p>Soru: \"Askerlik muayenesi veya infertilite polikliniği için gelen 25\nyaşında bir genç. Sağ testisi normal, ancak sol testisi karın içinde\n(İntra-abdominal inmemiş testis). Bu hastaya testisi torbaya indirme\n(Orşiopeksi) ameliyatı yapar mısın?\"</p>\n<p>Cevap: \"EAU/AUA kılavuzlarına göre, post-pubertal (ergenlik sonrası)\ndönemde saptanan tek taraflı intra-abdominal inmemiş testislerde\norşiopeksi yapılmaz. Çünkü o testis 25 yıl boyunca vücut ısısında\nkalmıştır, sperm üretme kapasitesi SIFIRDIR ancak kanser (ITGCN) riski\ndevasadır. Sağlam karşı testisi olduğu için, o hastalıklı\nintra-abdominal testise doğrudan Orşiektomi (ameliyatla tamamen\nçıkarılma) yapılması zorunludur.\"</p>\n<p>Soru: \"Yenidoğan muayenesi yapıyorsun. Bebeğin her iki testisi de\ntorbada yok (Bilateral Non-palpable Testis) ve aynı zamanda hipospadiası\nvar. Sadece ürolojik bir anomali deyip 6 ay bekler misin?\"</p>\n<p>Cevap: \"Asla beklemem. Yenidoğanda 'Bilateral ele gelmeyen testis +\nHipospadias' tablosu, aksi ispat edilene kadar Cinsiyet Gelişim\nBozukluğu (DSD - Disorder of Sex Development) kabul edilir. En çok\nkorktuğumuz durum, bebeğin genetik olarak kız (46, XX) olup Konjenital\nAdrenal Hiperplazi (KAH) nedeniyle erkek görünümüne sahip olmasıdır. Bu\nbebek birkaç gün içinde ölümcül bir tuz kaybı (Adrenal kriz)\nyaşayabilir. Acil Karyotip, 17-OH Progesteron ve elektrolit paneli\nistenir, Endokrinoloji hızla konsülte edilir.\"</p>\n"}, {"id": "13.4", "t": "İnmemiş Testiste Cerrahi Prensipler (İnguinal Orşiopeksi, Fowler-Stephens ve Laparoskopi)", "h": "<h3\nid=\"a-palpe-edi̇lebi̇len-kasikta-hi̇ssedi̇len-testi̇s-i̇nguinal-orşiopeksi\">A.\nPALPE EDİLEBİLEN (KASIKTA HİSSEDİLEN) TESTİS: İnguinal Orşiopeksi</h3>\n<p>Poliklinikte testisi kasık (inguinal) kanalın içinde elinle\nhissedebiliyorsan, altın standart açık cerrahidir.</p>\n<p>Kesi ve Kordonun Bulunması: Kasık kıvrımından minik bir kesi yapılır.\nEksternal oblik fasyası (kasık kanalının çatısı) açılır. Testis ve ona\nyapışık olan o kalın damar paketi (spermatik kordon) bulunur.</p>\n<p>Damarları Uzatmanın Sırrı (Prosesus Vajinalis): İnmemiş testislerin\n%90'ında, testisle birlikte karın içinden aşağı inen bir periton zarı\n(Prosesus Vajinalis / Fıtık kesesi) açıklığı vardır. Kordonun kısa\nkalmasının asıl sebebi, damarların etrafını saran bu sert fıtık kesesi\nve kremaster kası lifleridir.</p>\n<p><em>Cerrahi Hamle:</em> Fıtık kesesi damarlardan zar gibi incecik\nsıyrılır (diseke edilir) ve kasık iç halkasının (İnternal Ring) ta\ndibinden, çok yüksekten bağlanıp kesilir (Yüksek Ligasyon). Sadece bu\nişlemi yapmak bile damarlara ekstra 2-3 cm uzunluk kazandırır ve\ntestisin torbaya inmesini sağlar.</p>\n<p>Dartos Cebi (Sub-dartos Pouch): Skrotumun (torbanın) cildine minik\nbir kesi yapılır. Cilt ile altındaki Dartos kası arasında kanamasız bir\ncep (yuva) açılır. Testis kasıktan bir tünel yardımıyla aşağı çekilir ve\nbu cebin içine yerleştirilir. Boynu daraltılarak testisin tekrar yukarı\nkaçması mekanik olarak engellenir (Orşiopeksi).</p>\n<h3 id=\"b-palpe-edi̇lemeyen-ele-gelmeyen-testi̇s-laparoskopinin-gücü\">B.\nPALPE EDİLEMEYEN (ELE GELMEYEN) TESTİS: Laparoskopinin Gücü</h3>\n<p>Muayenede skrotum BOŞ, kasık BOŞ. Testis hiçbir yerde yok.</p>\n<p><em>Altın Kural:</em> Ele gelmeyen bir testisi bulmak için asla\nkasığı veya karnı körlemesine açık cerrahiyle KESEMEZSİN. İlk ve zorunlu\nadım her zaman Tanısal Laparoskopi'dir.</p>\n<p>Göbekten kamerayla karın içine girilir ve kasık iç halkasına\n(İnternal Ring) bakılır. Üç şeyden birini görürsün:</p>\n<p>Peeping (Göz Atan) Testis: Testis tam halkanın ağzındadır, bir içeri\nbir dışarı giriyordur. Laparoskopik olarak kolayca aşağı alınır.</p>\n<p>Vanishing (Yok Olmuş/Kör Sonlanan) Testis: Damarlar (Testiküler arter\nve ven) gelir, gelir ve halkanın ucunda kör bir şekilde biter. Testis\nanne karnında kendi etrafında dönmüş (torsiyon) ve çürüyüp yok olmuştur.\nYapacak bir şey yoktur, ameliyat sonlandırılır.</p>\n<p>İntra-Abdominal (Karın İçi) Testis: Testis böbreğe yakın, çok yüksek\nbir yerdedir. Ve en büyük kabus: Damarları torbaya inemeyecek kadar\nKISADIR.</p>\n<h3 id=\"c-damarlar-çok-kisaysa-fowler-stephens-cerrahi-dehası\">C.\nDAMARLAR ÇOK KISAYSA: Fowler-Stephens Cerrahi Dehası</h3>\n<p>Karın içindeki testisi bulduk ama ana damarı (Testiküler Arter)\nçeksek bile testis torbaya ulaşmıyor. Damarı çekiştirirsen spazma girer\nve testis ölür. İşte o zaman ürolojinin en çılgın anatomik\nmanevralarından biri olan Fowler-Stephens Tekniği devreye girer.</p>\n<p>Mantık (Kollateral Kanlanma): Testis sadece ana testiküler arterden\nbeslenmez. Sperm taşıyan kanalın (Vaz Deferens) etrafında da incecik bir\ndamar ağı (Diferansiyel Arter) vardır ve bu ağ testis içinde ana damarla\nbirleşir.</p>\n<p>Cerrahi Hamle: Fowler-Stephens ameliyatında, cerrah bilerek ve\nisteyerek testisin ana damarını (Testiküler Arter ve Veni) böbrek\nseviyesinde çok yüksekten KLİPLER VE KESER. * Beslenme Nasıl Olacak? Ana\ndamar kesilince, testis tamamen o incecik yedek damara (Vazal Arter)\nmuhtaç kalır.</p>\n<p>Aşamalı (Staged) Yaklaşım (%90 Başarı):</p>\n<p><em>1. Aşama:</em> Sadece laparoskopik olarak ana damarlar kliplenip\nkesilir, testise dokunulmaz ve çocuk eve gönderilir. Amaç, testisin 6 ay\nboyunca oksijensiz kalarak o ince yedek damarları (kollateralleri)\nkalınlaştırmasıdır (Hipertrofi).</p>\n<p><em>2. Aşama (6 ay sonra):</em> Tekrar karın içine girilir. Testis,\nsadece vaz deferens etrafındaki o genişlemiş, periton zarıyla\ndesteklenmiş devasa bir flep (yama) ile birlikte serbestleştirilir ve\nana damar (kısa olan bağ) artık olmadığı için çok rahat bir şekilde\nskrotuma indirilir.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Açık inguinal orşiopeksi yapıyorsun. Prosesus vajinalisi\n(fıtık kesesini) yüksekten bağladın ama testis hala torbaya (skrotuma)\ninecek kadar uzamadı, çok gergin. Kordonu daha fazla uzatmak için\nameliyat masasında hangi anatomik hamleyi (Prentiss Manevrası)\nyaparsın?\"</p>\n<p>Cevap: \"Spermatik kordon normalde kasık kanalının içinden, İnferior\nEpigastrik Damarların 'lateralinden (dışından)' dolanarak aşağı iner ve\nbu yolu uzatır. Eğer boy yetmiyorsa Prentiss Manevrası yaparım: Kasık\nkanalının arka duvarını (Fasya Transversalis) delerim ve testisi\nepigastrik damarların 'medialinden (içinden)', yani çapraz ve en\nkestirme yoldan doğrudan skrotuma alırım. Bu kestirme yol kordona ekstra\n1-2 cm daha uzunluk kazandırır.\"</p>\n<p>Soru: \"Laparoskopide kasık iç halkasına (İnternal Ring) baktın.\n'Testiküler damarları' göremedin ama sperm taşıyan o sert kanalın (Vaz\nDeferens) tek başına kasık halkasından içeri girip aşağı doğru\n(skrotuma) indiğini gördün. Bu durumda 'Demek ki testis torbada' deyip\nameliyatı bitirir misin?\"</p>\n<p>Cevap: \"Kesinlikle BİTİRMEM. Vaz deferens ve testiküler damarların\nembriyolojik kökenleri tamamen farklıdır (Biri Wolff kanalından, diğeri\ngenital kabartıdan gelir). Vaz deferens tek başına skrotuma inmiş\nolabilir, bu testisin de orada olduğu anlamına gelmez. Benim için\ntestisin akıbetini belirleyen tek anatomik yapı Testiküler Damarlardır\n(Arter ve Ven). Eğer o damarları karın içinde bulup nereye gittiklerini\n(veya nerede kör sonlandıklarını) gözümle görmeden ameliyatı bitirirsem,\niçerde kanserleşmeye hazır bir testis bırakmış olabilirim.\"</p>\n<p>Soru: \"Fowler-Stephens ameliyatının 2. aşamasındasın. Testisi torbaya\nindirmek için serbestleştiriyorsun. Diseksiyon sırasında testisin arka\nyüzü ile vaz deferens arasındaki zarı (peritonu) neşterle temizleyip\nkordonu inceltmeli misin?\"</p>\n<p>Cevap: \"ASLA! Bu yapılabilecek en ölümcül hatadır. Fowler-Stephens\nameliyatında ana damarı zaten kestik. Testisi hayatta tutan TEK şey,\ntestis ile vaz deferens arasında kalan o incecik zarın (peritonun)\niçinden geçen mikroskobik kollateral damarlardır. O aralığı diseke\nedersen yedek damarları da kesmiş olursun ve testis ameliyat masasında\nkararır, ölür (Atrofi). Testis, vaz deferens ve o aradaki periton zarı\ngeniş bir blok (flep) halinde, KESİNLİKLE araları açılmadan aşağı\nindirilmelidir.\"</p>\n"}, {"id": "13.5", "t": "Cinsiyet Gelişim Bozuklukları (DSD) Sınıflaması ve KAH", "h": "<h3 id=\"a-kusursuz-kaskad-bir-i̇nsan-nasıl-erkek-olur\">A. KUSURSUZ\nKASKAD: Bir İnsan Nasıl Erkek Olur?</h3>\n<p>Anne karnındaki ilk 6 haftada embriyonun cinsiyeti yoktur; gonadlar\n(üreme bezleri) ve kanallar bipotansiyeldir (hem erkek hem kız olmaya\nhazırdır). Cinsiyetin belirlenmesi aktif bir mücadeledir ve 3 basamakta\ngerçekleşir:</p>\n<p>Kromozomal Cinsiyet (Döllenme Anı): Spermdeki Y kromozomu yumurtaya\ngirerse kaskad tetiklenir (46,XY).</p>\n<p>Gonadal Cinsiyet (SRY Geni): Y kromozomunun kısa kolundaki SRY geni,\no cinsiyetsiz bipotansiyel gonada \"Testis ol!\" emrini verir. SRY yoksa\n(örn: 46,XX), gonad varsayılan (default) ayar olarak \"Ovaryum\n(Yumurtalık)\" olur.</p>\n<p>Fenotipik (Dış) Cinsiyet (Hormonların Savaşı): Bütün mesele\ntestisteki iki hücrenin çalışmasına bağlıdır. Testis oluşur oluşmaz iki\nhormon salgılar:</p>\n<p>Sertoli Hücrelerinden AMH (Anti-Müllerian Hormon): Kız iç organlarını\n(Rahim, fallop tüpleri, üst vajina) oluşturacak olan Müllerian kanalları\nYIKAR, ERİTİR.</p>\n<p>Leydig Hücrelerinden Testosteron: Erkek iç organlarını (Epididim, vaz\ndeferens) geliştirir. Testosteron daha sonra 5-alfa redüktaz enzimiyle\nDHT'ye (Dihidrotestosteron) dönüşür. DHT, dış genitalyaya o meşhur\nfermuarı çektirir: Labialar birleşip skrotum olur, klitoris büyüyüp\npenis olur ve üretra penisin ucuna taşınır.</p>\n<p><em>Altın Kural:</em> Eğer bu kaskadda testosteron veya AMH yoksa (ya\nda reseptörleri bozuksa), doğa otomatik olarak dışarıyı KIZ (Dişi\nfenotip) yapar. Erkek olmak, sürekli hormon pompalamayı gerektiren aktif\nve zorlu bir süreçtir.</p>\n<h3 id=\"b-dsd-siniflamasi-chicago-konsensüsü\">B. DSD SINIFLAMASI\n(Chicago Konsensüsü)</h3>\n<p>Kromozom ile dış görünüşün (fenotipin) uyuşmadığı tablolar 3 ana\ngruba ayrılır:</p>\n<p>Seks Kromozomu DSD'leri:<br />\nKromozomların kendisi karışıktır. Örn: 45,X/46,XY (Mikst Gonadal\nDisgenezis). Bir tarafta testis, diğer tarafta gelişmemiş bir \"çizgi\n(streak)\" gonad vardır. Asimetrik genitalya ile doğarlar. Diğer örnekler\nKlinefelter (47,XXY) ve Turner (45,X) sendromlarıdır.</p>\n<p>46,XY DSD (Yetersiz Erkekleşme - Undermasculinization):<br />\nBebek genetik olarak tam bir erkektir (Testisleri vardır). Ancak\ndışarıdan kız gibi veya ağır hipospadiaslı/mikropenisli doğar.</p>\n<p>Nedenler: Testosteron üretilemiyordur veya üretilse bile hücreler\nbunu algılamıyordur (Androjen Duyarsızlığı Sendromu - AIS). Ya da\nTestosteron DHT'ye dönüşemiyordur (5-alfa redüktaz eksikliği).</p>\n<p>46,XX DSD (Aşırı Erkekleşme - Virilizasyon):<br />\nBebek genetik olarak tam bir kızdır (Yumurtalıkları ve rahmi\nkusursuzdur). Ancak dışarıdan testisleri olmayan (Boş skrotumlu) bir\nerkek gibi doğar.</p>\n<p>En sık ve en ölümcül nedeni: Konjenital Adrenal Hiperplazi (KAH).</p>\n<h3 id=\"c-konjeni̇tal-adrenal-hi̇perplazi̇-kah-moleküler-bir-felaket\">C.\nKONJENİTAL ADRENAL HİPERPLAZİ (KAH): Moleküler Bir Felaket</h3>\n<p>Yenidoğanda belirsiz genitalyanın en sık nedenidir ve saatler içinde\nteşhis edilmezse bebeği öldürür.</p>\n<p>Enzim Eksikliği: Vakaların %95'inde böbreküstü bezindeki (Adrenal\nkordeks) 21-Hidroksilaz enzimi genetik olarak yoktur.</p>\n<p>Biyokimyasal Tıkanıklık: Bu enzim olmayınca böbreküstü bezi Kortizol\n(stres hormonu) ve Aldosteron (tuz tutucu hormon) üretemez.</p>\n<p>ACTH Patlaması: Beyin (Hipofiz) kanda kortizol olmadığını görünce\npanikler ve böbreküstü bezini kırbaçlamak için devasa miktarda ACTH\nsalgılar. Adrenal bez çılgınca büyür (Hiperplazi).</p>\n<p>Şant (Androjen Fırtınası): Kortizol ve aldosteron yolları tıkalı\nolduğu için, beze gelen tüm kolesterol mecburen tek açık yola, yani\nAndrojen (Erkeklik hormonu / Testosteron) üretim yoluna kayar.</p>\n<p>Fenotipik Sonuç (Kız Bebekte): Bebek anne karnında (8-12. haftalarda)\ndevasa bir testosteron fırtınasına maruz kalır. Kızın klitorisi büyür\npenis olur, vajina girişi kapanır ve dudaklar skrotum gibi birleşir.\nDışarıdan bakıldığında ağır hipospadiaslı (veya tamamen normal\ngörünümlü) bir erkek bebek doğar. Ama o aslında rahmi ve yumurtalıkları\nolan bir kızdır!</p>\n<h3 id=\"d-aci̇li̇yet-tuz-kaybı-krizi-salt-wasting-crisis\">D. ACİLİYET: Tuz\nKaybı Krizi (Salt-Wasting Crisis)</h3>\n<p>Üroloğu ilgilendiren kısım dış görünüş olsa da, bebeğin hayatını\ntehdit eden şey Aldosteron eksikliğidir. Aldosteron böbreklerde sodyumu\n(\\Na+) tutar, potasyumu (\\K+) atar.</p>\n<p>Aldosteron olmayınca bebek idrarla çılgınca tuz (\\Na+) kaybetmeye\nbaşlar.</p>\n<p>İlk 1-2 Hafta: Kanda Sodyum dibe vurur (Hiponatremi), Potasyum\nzehirli seviyelere çıkar (Hiperkalemi). Bebek kusmaya başlar,\ndehidratasyona girer ve Kardiyojenik Şoktan kaybedilir.</p>\n<p>Kriz Yönetimi: Bebeğin cinsiyetine veya hipospadiasına dokunmadan\nönce acilen Damar Yolu + İzotonik SF sıvı resüsitasyonu + Hidrokortizon\n(Kortizol yerine) + Fludrokortizon (Aldosteron yerine)\nbaşlanmalıdır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Doğumhanede genitalyası belirsiz bir bebek var. Klitoris mi\npenis mi belli değil. Ancak kasıkları ve torbayı muayene ettin, Gonk\n(Testis/Yumurtalık) ele GELMİYOR (Bilateral Non-palpable). İlk düşünmen\ngereken ve acil eylem planı başlatman gereken tanı nedir?\"</p>\n<p>Cevap: \"Bilateral ele gelmeyen gonad + belirsiz genitalya, aksi ispat\nedilene kadar 46,XX KAH (Konjenital Adrenal Hiperplazi) kabul edilir.\nÇünkü eğer bebek XY (erkek) olsaydı ve hipospadiası/belirsiz genitalyası\nolsaydı, genellikle testislerden en az biri inmiş veya kasıkta\nhissediliyor olurdu. Gonadlar hiç yoksa, o bebek muhtemelen karnında\nyumurtalıkları (ovaryumları) olan aşırı virilize bir kızdır. Acilen\nkanda 17-OH Progesteron (tıkanıklığın hemen öncesindeki biriken madde)\nseviyesi ve elektrolit (\\Na+ / K+) istenir.\"</p>\n<p>Soru: \"16 yaşında 'kız' bir hasta amenore (hiç adet görmeme)\nşikayetiyle jinekolojiye, oradan da sana geldi. Boyu uzun, göğüsleri\nmükemmel gelişmiş, ancak vajinası çok sığ (kör sonlanıyor) ve ultrasonda\nRAHMİ YOK. Kasıklarında ise iki tane şişlik (Testis) saptadın. Karyotipi\n46,XY geldi. Bu tamamen kız görünen erkek hastanın tanısı ve tedavisi\nnedir?\"</p>\n<p>Cevap: \"Bu tablo Tam Androjen Duyarsızlığı Sendromu'dur (CAIS -\nMorris Sendromu). Hastanın testisleri vardır, AMH salgılamıştır (bu\nyüzden rahim ve tüpler erimiş/yoktur). Testisler Testosteron da üretir,\nancak vücuttaki hiçbir androjen reseptörü çalışmadığı için testosteron\ndış genitalyayı erkek yapamaz (bebek dışarıdan kız doğar). Artan\ntestosteron kanda östrojene (Aromatizasyon) dönüşerek ona mükemmel bir\ndişi görünümü ve meme gelişimi sağlar. Bu hastalar psikolojik olarak\ntamamen kadındır ve kadın olarak kalmalıdır. Ancak o kasıktaki testisler\nvücut ısısında kanser (Disgerminom) riski taşıdığı için ergenlik (kemik\ngelişimi) tamamlandıktan sonra Laparoskopik Gonadektomi (testislerin\nalınması) ameliyatı yapılmalıdır.\"</p>\n<p>Soru: \"KAH tanısı koyduğumuz 46,XX bir kız bebekte, dış genitalyası\ntamamen erkeğe benzemiş (Prader Evre 5). Aileye 'Hemen yarın ameliyata\n(Klitorektomi/Vajinoplasti) alıp dışarıyı kız yapacağız' diyebilir\nmisin? Kılavuzların cerrahi zamanlaması nedir?\"</p>\n<p>Cevap: \"Asla diyemem. DSD vakalarında acil ve geri dönüşümsüz genital\nrekonstrüksiyon cerrahileri günümüzde (medikolegal ve etik olarak) terk\nedilmiştir. EAU 2026 kılavuzları, bu ameliyatların bebeklikte sadece\nfonksiyonel bir engel varsa (idrar yapamama) yapılmasını, kozmetik\nrekonstrüksiyonların ise multidisipliner bir konsey kararıyla, ideal\nolarak çocuğun kendi cinsiyet kimliğinin (Gender Identity) oturduğu ve\nkendi rızasını verebileceği ileri yaşlara ertelenmesini güçlü bir\nşekilde tavsiye eder.\"</p>\n"}, {"id": "13.6", "t": "Pediatrik Üroonkoloji (Wilms Tümörü ve Nöroblastom)", "h": "<h3 id=\"a-wi̇lms-tümörü-nefroblastom-böbreğin-kendi-i̇haneti\">A. WİLMS\nTÜMÖRÜ (NEFROBLASTOM): Böbreğin Kendi İhaneti</h3>\n<p>Çocukluk çağının en sık görülen primer böbrek kanseridir (genellikle\n2-5 yaş arası). Embriyolojik dönemde böbreği oluşturan o ilkel hücre\nyumağının (Metanefrik Blastem) nefrona dönüşemeyip kontrolsüzce\nçoğalmasıyla oluşur.</p>\n<p>Klinik Tablo: En sık bulgu, annenin fark ettiği Asemptomatik\nAbdominal Kitledir. Kitle genellikle düzgündür, yuvarlaktır ve <em>altın\nkural olarak</em> ORTA HATTI GEÇMEZ (Sadece kendi tarafındaki karnı\nşişirir). Çocukta mikroskobik hematüri ve tümörün böbrek damarlarına\nbası yapmasına (Renin artışına) bağlı Hipertansiyon görülebilir.</p>\n<p>Genetik Sendromların Gölgesi: Wilms tümörü sadece bir kitle değildir,\nsıklıkla genetik sendromların bir parçasıdır.</p>\n<p>WAGR Sendromu: Wilms, Aniridia (gözde iris tabakasının olmaması),\nGenitoüriner anomaliler (inmemiş testis/hipospadias) ve Retardasyon\n(zihinsel gerilik). <em>WT1 gen mutasyonu.</em></p>\n<p>Beckwith-Wiedemann Sendromu: Çocuğun vücudunun bir yarısı diğerinden\nbüyüktür (Hemihitpertrofi), dili devasadır (Makroglossi) ve göbek fıtığı\n(Omfalosel) vardır. <em>WT2 gen mutasyonu.</em></p>\n<p>Cerrahi ve Ekollerin Savaşı (SIOP vs. COG):<br />\nİşte ürolojinin en büyük okyanus ötesi tartışması!</p>\n<p>Amerika Ekolü (COG): Eğer kitle ameliyat edilebilir (rezektabl)\ngörünüyorsa, yetişkinlerdeki gibi <em>önce Radikal Nefrektomi</em>\nyapılır, kemoterapi patoloji sonucuna göre verilir.</p>\n<p>Avrupa Ekolü (SIOP - EAU'nun benimsediği): Kitle ne kadar küçük veya\nkolay görünürse görünsün, tanı konduğu an TÜM hastalara önce Preoperatif\nKemoterapi (4-6 hafta) verilir. <em>Neden?</em> Çünkü Wilms tümörü balon\ngibi ince zarlı, devasa ve jelatinöz bir kitledir. Ameliyatta\nyanlışlıkla patlarsa tüm batına yayılır (Evre 3 olur). Kemoterapi bu\nkitleyi %50 küçültür, zarı (kapsülü) sertleştirip kalınlaştırır ve\nameliyatta tümörün patlama riskini sıfıra indirir. Ardından Radikal\nNefrektomi yapılır.</p>\n<h3 id=\"b-nöroblastom-orta-hattı-aşan-ahtapot\">B. NÖROBLASTOM: Orta\nHattı Aşan Ahtapot</h3>\n<p>Wilms böbreğin içinden çıkarken, Nöroblastom böbreğin hemen üstündeki\nAdrenal (Böbreküstü) Bezinin medullasından veya sempatik zincir\nganglia'larından çıkar. Kökeni sinir sistemi hücreleridir (Nöral Krest).\nWilms'e göre çok daha sinsi, çok daha sistemik (hasta eden) ve kötü\nseyirlidir.</p>\n<p>Klinik Tablo ve Ahtapot Belirtisi: Kitle devasadır, serttir,\nnodülerdir ve ORTA HATTI GEÇER (Karşı tarafa kadar uzanır). Nöroblastom\ndamarları itmez; aortu, vena kavayı ve mezenterik damarları bir ahtapot\ngibi sarar (Encasement), içine alır ama damarın içini tıkamaz (lümen\naçıktır).</p>\n<p>Sistemik Yıkım: Wilms'li çocuk genellikle neşelidir, sadece karnı\nşiştir. Nöroblastomlu çocuk ise bitkindir, ateşlidir, kilo kaybetmiştir.\nÇünkü sempatik sinir sistemi kaynaklı olduğu için kana sürekli\nKatekolamin (Adrenalin/Noradrenalin) pompalar. Terleme, çarpıntı ve\nishal yapar.</p>\n<p>Kemik Metastazı ve \"Rakun Gözü\": Nöroblastom çok erken kemik\nmetastazı yapar. Çocuğun gözlerinin arkasındaki (retrobulber) kemiklere\nmetastaz yaptığında, gözleri öne fırlar (Proptozis) ve göz etrafında\ndevasa morluklar oluşur. Buna Raccoon Eyes (Rakun Gözü) belirtisi denir\nve bu görünüm Nöroblastom için patognomonik kabul edilir.</p>\n<h3 id=\"c-radyoloji̇k-ve-laboratuvar-ayrimi\">C. RADYOLOJİK VE LABORATUVAR\nAYRIMI</h3>\n<p>Bu iki devi ameliyattan önce ayırmak cerrahın hayatını kurtarır:</p>\n<p>Kalsifikasyon (Kireçlenme): BT veya Ultrasonda kitlenin içinde ince,\nkum gibi kalsifikasyonlar (kireçlenmeler) varsa bu %90 Nöroblastomdur.\n(Wilms tümörleri nadiren kalsifiye olur).</p>\n<p>Damar İstilası: Nöroblastom damarı dışarıdan sarar (ahtapot). Wilms\ntümörü ise tıpkı yetişkin RCC'si gibi, böbrek veninin içine girip Vena\nKava'da kalbe kadar uzanan bir Tümör Trombüsü (Tıkaç) yapar.</p>\n<p>İdrar Tahlili: Nöroblastom katekolamin ürettiği için, hastanın 24\nsaatlik idrarında bu hormonların yıkım ürünleri olan VMA (Vanilmandelik\nAsit) ve HVA (Homovanilik Asit) inanılmaz derecede yüksek çıkar.\nWilms'te bu değerler normaldir.</p>\n<p>Altın Standart Nükleer Tıp: Nöroblastom şüphesinde, sinir hücrelerine\nözel tutunan MIBG Sintigrafisi çekilir. Sadece tümörü değil, kemikteki\ngizli metastazları da parıl parıl aydınlatır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe annesi tarafından getirilen 3 yaşındaki erkek\nçocuğun sol karnında devasa bir kitle (Wilms şüphesi) saptadın. Aile\nmuayene odasına girdiğinde asistanlardan biri kitleyi hissetmek için\nçocuğun karnına derin derin bastırarak (palpe ederek) muayene etmeye\nbaşladı. Buna neden şiddetle engel olmalısın?\"</p>\n<p>Cevap: \"Wilms tümörü şüphesi olan bir çocukta KARIN PALPASYONU (DERİN\nMUAYENE) KESİNLİKLE YASAKTIR. Bu kitlelerin kapsülü kağıt gibi incedir\nve içi çok yüksek basınçlı, nekrotik/kistik tümör dokusuyla doludur.\nSert bir muayene o kapsülü patlatabilir. Kapsül patlarsa tümör hücreleri\nkarın zarına (peritona) yayılır; hastalık anında erken evreden (Evre\n1-2), çok daha ölümcül olan Evre 3'e yükselir ve çocuğun karnına ağır\nradyoterapi verilmesi gerekir.\"</p>\n<p>Soru: \"Sol Wilms
