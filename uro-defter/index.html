tümörü nedeniyle SIOP protokolü (Preoperatif\nkemoterapi) verdin ve çocuğu Radikal Nefrektomiye (Açık cerrahi) aldın.\nKarnı açtın. Sol böbreği ve kitleyi çıkarmadan önce, karnın İLK olarak\nneresine bakmalı ve ne yapmalısın?\"</p>\n<p>Cevap: \"Karnı açar açmaz ilk yapmam gereken şey, tümörü bırakıp karşı\ntaraftaki SAĞ (sağlam) BÖBREĞİ gözümle görmek ve elimle (ön ve arka\nyüzünü) palpe etmektir. Wilms tümörlerinin yaklaşık %5-10'u bilateraldir\n(iki taraflıdır). Ultrasonda veya BT'de görünmeyen milimetrik bir tümör\nodağı karşı böbrekte saklanıyor olabilir. Eğer sağlam sandığım böbrekte\nde tümör varsa, sol böbreğin tamamını alıp çocuğu diyalize mahkum\nedemem; ameliyat planını anında 'Nefron Koruyucu Cerrahiye' (sadece\nkitlelerin çıkarılmasına) çevirmem gerekir.\"</p>\n<p>Soru: \"Nöroblastom tanısı konmuş, katekolamin (Adrenalin) salgılayan\nbir çocukta, anestezi ekibi ameliyat masasında kitleye dokunduğun an\ninanılmaz bir hipertansif kriz (tansiyon fırlaması) yaşanabileceğini\nsöyler. Bu kitleleri çıkarırken damar kontrolünde ilk hangi damarı\nbağlamalısın?\"</p>\n<p>Cevap: \"Tıpkı Feokromasitoma cerrahisinde olduğu gibi, Nöroblastomda\nda kitleyi mobilize etmeden (kımıldatmadan) önce İLK OLARAK VEN\n(Toplardamar) EKSENİ (Adrenal Ven) bulunup bağlanmalıdır. Eğer önce\narteri bağlar veya kitleyi mıncıklamaya başlarsan, kitle içindeki devasa\nadrenalin deposunu kana (venlere) fırlatır ve çocuk ameliyat masasında\nölümcül bir hipertansif kriz ve beyin kanaması geçirir. Ven bağlandıktan\nsonra sistemik dolaşımla ilişki kesilmiş olur.\"</p>\n"}, {"id": "13.7", "t": "Pediatrik Nörojenik Mesane (Spina Bifida) ve Ürodinami", "h": "<h3 id=\"a-spi̇na-bi̇fi̇da-ve-si̇ni̇rsel-bağlantinin-kopuşu\">A. SPİNA BİFİDA\nVE SİNİRSEL BAĞLANTININ KOPUŞU</h3>\n<p>Anne karnında nöral tüpün (omuriliğin) kapanamaması sonucu gelişen bu\ndefekt, mesaneye giden otonom (parasempatik/sempatik) ve somatik\n(pudendal) sinirleri aynı anda tahrip eder. Lezyonun seviyesine göre\nmesane iki zıt karaktere bürünebilir:</p>\n<p>Üst Motor Nöron Lezyonu (Spastik / Düşmanca Mesane): Refleks arkı\nsağlamdır ama beynin baskılayıcı (inhibitör) kontrolü yoktur. Mesane\nsürekli ve kontrolsüzce kasılır (Aşırı Aktif Detrüsör). En büyük kabus\nise Detrüsör-Sfinkter Dissinerjisidir (DSD). Normalde idrar yaparken\nkapı (sfinkter) açılır, motor (mesane) kasılır. DSD'de ise motor tüm\ngücüyle kasılırken, sfinkter de inatla kapanır. İçerideki basınç patlama\nnoktasına gelir ve idrar zorla böbreklere geri şutlanır (Sekonder\nVUR).</p>\n<p>Alt Motor Nöron Lezyonu (Flask / Atonik Mesane): Sakral merkez\n(S2-S4) veya periferik sinirler ölmüştür. Mesane kası felçtir, hiç\nkasılmaz. İçi litrelerce idrarla dolar, bir torba gibi esner. Sfinkter\nde gevşek olduğu için çocuk sürekli, damla damla idrar kaçırır (Taşma\nİnkontinansı). Böbrekler için nispeten daha güvenlidir ancak enfeksiyon\nriski çok yüksektir.</p>\n<h3 id=\"b-ürodi̇nami̇ni̇n-di̇li̇-ve-40-cm-h2o-kurali-mcguire-kurali\">B.\nÜRODİNAMİNİN DİLİ VE 40 CM H2O KURALI (MCGUIRE KURALI)</h3>\n<p>Hangi mesanenin böbreği öldüreceğini ultrasondan veya dışarıdan\nbakarak anlayamazsın. Bunun tek yolu Ürodinami testidir. Bebeğin\nmesanesine incecik bir basınç kateteri, rektumuna (makata) ise karın içi\nbasıncı ölçen ikinci bir kateter yerleştirilir. İçeriye yavaş yavaş su\n(Serum Fizyolojik) basılırken bilgisayar ekranında grafikler\nçizilir.</p>\n<p>Bizim için hayati olan tek bir kırmızı çizgi vardır:</p>\n<p>DLPP (Detrusor Leak Point Pressure - Detrüsör Kaçak Akım Basıncı):\nMesane dolarken, idrarın aniden üretradan (dışarı) sızdığı andaki mesane\niçi basınçtır.</p>\n<p>Altın Kural: EAU/AUA kılavuzlarına yön veren McGuire kuralına göre;\neğer DLPP 40 cm H2O'nun altındaysa, mesane idrarı düşük basınçla dışarı\natıyor demektir. Böbrekler %90 oranında güvendedir.</p>\n<p>Ölümcül Sınır: Eğer sızıntı anındaki basınç 40 cm H2O'nun\nüzerindeyse, idrar dışarı çıkmaktansa yukarıya (böbreğe) kaçmayı tercih\neder. Bu bir \"Düşmanca (Hostile) Mesanedir\". Çocuğun böbreklerinde hızla\nhidronefroz, VUR ve kalıcı skar gelişimi başlar. Bu basıncı derhal\ndüşürmek zorundayız!</p>\n<h3 id=\"c-tedavi̇-algori̇tmasi-basıncı-düşür-mesaneyi-boşalt\">C. TEDAVİ\nALGORİTMASI: Basıncı Düşür, Mesaneyi Boşalt</h3>\n<p>Amacımız çocuğu sadece kuru (kuru bez/çamaşır) tutmak değil, düşük\nbasınçlı bir rezervuar (depo) yaratmaktır. Tedavi iki silahın ayrılmaz\nbir kombinasyonudur:</p>\n<p>Farmakolojik Felç (Antikolinerjikler): O çılgınca kasılan, basıncı\n40'ın üzerine çıkaran Detrüsör kasını ilaçla gevşetmek (felç etmek)\nzorundayız. Altın standart Oksibutinin veya Tolterodin gibi\nantikolinerjik ilaçlardır. İlaç mesaneyi gevşetir, hacmini büyütür ve\nbasıncı düşürür. (Yeni nesil alternatif: Beta-3 agonistleri /\nMirabegron).</p>\n<p>Temiz Aralıklı Kateterizasyon (TAK / CIC): İlaç verdin, mesaneyi\ngevşettin. Artık mesane kasılamadığı için çocuk idrarını HİÇ yapamaz.\nİşte burada ailenin hayat rutini değişir. Aileye (veya büyüdüğünde\nçocuğun kendisine) günde 4 ila 6 kez, temiz (steril değil, sadece temiz)\ntek kullanımlık ince sondalarla idrar kanalından girip mesaneyi tamamen\nboşaltması öğretilir.</p>\n<p><em>TAK'ın Mucizesi:</em> TAK sayesinde içeride hiç rezidü (artık\nidrar) kalmaz, enfeksiyon riski sıfırlanır, basınç yükselmez ve çocuk\ntamamen kuru kalır.</p>\n<h3 id=\"d-i̇laçlar-i̇şe-yaramazsa-cerrahi-basamaklar\">D. İLAÇLAR İŞE\nYARAMAZSA: Cerrahi Basamaklar</h3>\n<p>Bazen mesane o kadar kalındır (fibrotik) ki, ilaca yanıt vermez ve\nbasınç 40 cm H2O'nun altına düşmez.</p>\n<p>İntradetrüsörel OnabotulinumtoxinA (Botoks): Sistoskopla girilip\nmesane kasının içine 20-30 farklı noktadan Botoks enjekte edilir. Kas\n6-9 ay boyunca felç olur, basınç düşer. (Kalıcı değildir, tekrarlamak\ngerekir).</p>\n<p>Ogmentasyon Sistoplasti (Mesane Büyütme): Son çaredir. Çocuğun kendi\nbağırsağından (İleum) 15-20 cm'lik bir parça kesilir, top şekline\ngetirilir ve ortadan ikiye yarılan mesanenin üzerine devasa bir yama\n(şapka) gibi dikilir. Mesane devasa, düşük basınçlı bir depoya\ndönüşür.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Yenidoğan yoğun bakımda 3 günlük bir Spina Bifida\n(Meningomyelosel) bebeği var. Sırtı kapatılmış. Ultrasonda böbrekleri\ntamamen NORMAL görünüyor. Aileye 'Böbrekler şu an iyi, 1 yaşına gelince\nürodinami çekeriz, şimdi gerek yok' diyebilir misin?\"</p>\n<p>Cevap: \"Kesinlikle diyemem. EAU/AUA kılavuzlarına göre bu 'Proaktif\n(Önleyici)' yaklaşımın ihlalidir. Ultrasonda böbreklerin normal\ngörünmesi, mesane içinin güvenli olduğu anlamına gelmez. Böbrekler hasar\ngörmeden önce o yüksek basıncı (Düşmanca Mesaneyi) yakalamak için,\nbebeğin sırtındaki yara iyileşir iyileşmez (genellikle ilk 1-3 ay\niçinde) Erken Bazal Ürodinami çekilmesi ZORUNLUDUR. Basınç yüksekse\nböbrekler bozulmadan hemen Antikolinerjik+TAK başlanır.\"</p>\n<p>Soru: \"Spina Bifidalı, 5 yaşında, günde 5 kez TAK (Sonda) yapan ve\nOksibutinin kullanan bir kız çocuğu polikliniğe rutin kontrole geldi.\nAteşi yok, ağrısı yok. Yapılan tam idrar tahlilinde (TİT) bol lökosit,\nidrar kültüründe ise &gt;100.000 koloni <em>E. coli</em> üredi\n(Asemptomatik Bakteriüri). Hemen geniş spektrumlu antibiyotik başlar\nmısın?\"</p>\n<p>Cevap: \"Asla başlamam. Düzenli TAK yapan çocukların mesanelerinde\nkolonizasyon (bakteri varlığı) neredeyse kaçınılmazdır ve %70-80'inde\nkültür pozitif gelir. Kılavuzlar der ki; eğer çocukta semptom yoksa\n(ateş, titreme, yan ağrısı, idrarda ani kötü koku/kanama yoksa),\nAsemptomatik Bakteriüri KESİNLİKLE ANTİBİYOTİKLE TEDAVİ EDİLMEZ. Tedavi\netmek sadece o bakterilerin direncini artırır ve çocuk gerçekten ateşli\npiyelonefrit geçirdiğinde elinde kullanacak antibiyotik kalmaz.\"</p>\n<p>Soru: \"Ogmentasyon Sistoplasti (bağırsaktan mesane yapma) ameliyatı\ngeçiren bir hasta, ameliyattan yıllar sonra polikliniğe geldi. Rutin\ntakiplerinde özellikle hangi kan vitamin düzeyini kontrol etmelisin ve\nbu ameliyatın en korkulan, uzun dönem (10-15 yıl) komplikasyonu\nnedir?\"</p>\n<p>Cevap: \"Mesaneyi büyütmek için genellikle ince bağırsağın son kısmı\nolan Terminal İleum kullanılır. Bu bölge, vücutta B12 Vitamini'nin\nemildiği tek yerdir. O bölgeyi kesip mesaneye yamadığımız için hastada\nzamanla B12 eksikliği ve Megaloblastik Anemi / Nörolojik hasar\ngelişebilir; kan düzeyi yıllık takip edilmelidir. En korkulan uzun dönem\nkomplikasyon ise, idrar ve bağırsağın (mukozanın) kronik teması sonucu\ngelişen Sekonder Mesane Kanseridir (Adenokarsinom). Bu yüzden bu\nhastalar ergenlikten itibaren yıllık Sistoskopi ile taranmalıdır.\"</p>\n"}, {"id": "13.8", "t": "Gece Alt Islatma (Enürezis Nokturna) ve Gündüz İdrar Kaçırma", "h": "<h3 id=\"a-tanim-ve-siniflama-5-yaş-barajı\">A. TANIM VE SINIFLAMA: 5 Yaş\nBarajı</h3>\n<p>Bir çocuğun yatağını ıslatmasına \"hastalık\" diyebilmemiz için, sinir\nsisteminin mesane kontrolünü fizyolojik olarak tamamlaması beklenen o\nyaş sınırını geçmesi gerekir. Kılavuzlara göre tanı 5 yaşından KÜÇÜK\nçocuklara KONMAZ.</p>\n<p>Monosemptomatik (MNE): Çocuğun tek sorunu gece altını ıslatmasıdır.\nGündüzleri hiçbir şikayeti yoktur, idrar kaçırmaz, sık tuvalete\ngitmez.</p>\n<p>Non-Monosemptomatik (NMNE): Gece alt ıslatmaya, gündüz idrar kaçırma\n(İnkontinans), aniden sıkışma (Urgency), bacak bacak üstüne atıp tutmaya\nçalışma veya kabızlık (BBD) eşlik eder. (Bu grup daha dirençlidir).</p>\n<p>Primer vs. Sekonder:</p>\n<p><em>Primer:</em> Çocuk doğduğundan beri en az 6 ay boyunca hiç \"kuru\"\nkalmamıştır. (Genellikle genetik/fizyolojiktir).</p>\n<p><em>Sekonder:</em> Çocuk en az 6 ay boyunca kuru kalmayı başarmış,\ntuvalet eğitimini almış ancak aniden tekrar altını ıslatmaya\nbaşlamıştır. (Aksi ispat edilene kadar Psikolojik travma, İYE veya Tip 1\nDiyabet aranır).</p>\n<h3 id=\"b-patofi̇zyoloji̇-3-ayaklı-sehpa-mne-neden-olur\">B. PATOFİZYOLOJİ:\n3 Ayaklı Sehpa (MNE Neden Olur?)</h3>\n<p>Eğer çocuk monosemptomatikse (sadece gece kaçırıyorsa), sorun\nkesinlikle \"tembellik\" değildir. Bu durum, 3 fizyolojik kusurdan birinin\nveya birkaçının birleşimidir:</p>\n<p>Nokturnal Poliüri (Gece Aşırı İdrar Üretimi): Sağlıklı insanlarda\nbeyin (Hipofiz), gece uyurken Antidiüretik Hormon (ADH / Vazopressin)\nsalgısını zirveye çıkarır. Böbrekler suyu tutar, gece idrar üretimi\nazalır. Bu çocuklarda gece ADH dalgalanması (pik) olmaz. Böbrekler gece\nde gündüzmüş gibi litrelerce idrar üretir; mesanenin kapasitesi bunu\ntaşıyamaz ve taşar.</p>\n<p>Azalmış Nokturnal Mesane Kapasitesi: Çocuğun gündüz mesane kapasitesi\nnormaldir. Ancak gece uykudayken mesane kası (Detrüsör) hiperaktifleşir\nveya tam dolmadan kasılma sinyali gönderir.</p>\n<p>Arousal Defekt (Uyanma Bozukluğu): Asıl kilit nokta budur. Sağlıklı\nbir insan uykusunda mesanesi dolduğunda o basınç sinyali beyni uyarır ve\nkişiyi uyandırır. Bu çocukların uykusu inanılmaz derecede derindir\n(Derin yavaş dalga uykusu). Mesaneden gelen \"Doldum, patlıyorum!\"\nsinyali beynin uyanıklık merkezine (Retiküler Aktive Edici Sistem)\nulaşamaz. Çocuk idrarını rüyasında tuvalete yapıyormuş gibi hisseder ve\nyatağa bırakır.</p>\n<h3 id=\"c-gündüz-semptomlari-aşırı-aktif-mesane-ve-vincent-selamı\">C.\nGÜNDÜZ SEMPTOMLARI: Aşırı Aktif Mesane ve \"Vincent Selamı\"</h3>\n<p>Eğer çocuk gündüz de kaçırıyorsa (NMNE), olay tamamen değişir.</p>\n<p>Aşırı Aktif Mesane (OAB): Çocuğun mesanesi aniden, durduk yere\nkasılır. Çocuk oyuna dalmıştır, aniden yüzü değişir. İdrarı tutmak için\nbacaklarını çaprazlar, çömelir, eliyle perinesine/penisine bastırır veya\ntopuğuyla vajinasına baskı yapar. Bu duruşa klasik olarak \"Vincent's\nCurtsy\" (Vincent Selamı / Çömelmesi) denir.</p>\n<p>Disfonksiyonel İşeme (Staccato İşeme): Çocuk çişini yaparken pelvik\ntaban kaslarını gevşetemez. İdrarı kesik kesik, ıkınarak, kasılarak\nyapar. İdrar yollarında sürekli basınç ve idrar yolu enfeksiyonu (İYE)\nriski vardır.</p>\n<h3 id=\"d-tedavi̇-algori̇tmasi-zil-mi-hap-mı\">D. TEDAVİ ALGORİTMASI: Zil\nmi, Hap mı?</h3>\n<p>Tedavi, aileyi eğitmekle başlar. Çocuğun suçlanması KESİNLİKLE\nyasaklanır.</p>\n<h3 id=\"1-basamak-üroterapi-davranışsal-eğitim\">1. Basamak: Üroterapi\n(Davranışsal Eğitim)</h3>\n<p>Her hastaya ilk 2-3 ay sadece bu uygulanır. Akşam yemeğinden sonra\n(yatmadan 2 saat önce) sıvı alımı tamamen kesilir. Kafeinli, asitli,\nşekerli içecekler yasaklanır. Gündüzleri saatli işeme (her 2-3 saatte\nbir tuvalete gitme) ve bağırsak yönetimi (kabızlığın tedavisi) sağlanır.\n(Kabızlık, mesaneye arkadan baskı yaparak kapasiteyi inanılmaz\ndüşürür).</p>\n<h3 id=\"2-basamak-enürezis-alarm-cihazı-altın-standart---küratif\">2.\nBasamak: Enürezis Alarm Cihazı (Altın Standart - Küratif)</h3>\n<p><em>Mekanizma:</em> Çocuğun iç çamaşırına minik bir ıslaklık sensörü\ntakılır. Çocuk gece ilk damlayı kaçırdığı an, cihaz 80 desibel\nşiddetinde bir alarm (veya titreşim) çalar.</p>\n<p><em>Amaç:</em> Çocuğu sadece uyandırmak değil, beyni Klasik\nKoşullanma (Pavlov) ile eğitmektir. Beyin haftalar içinde \"Tam mesane =\nGürültü\" bağlantısını kurar. Bir süre sonra çocuk cihaz çalmadan, kendi\nkendine mesane doluluğunu hissedip uyanmaya başlar.</p>\n<p><em>Başarı:</em> Etkisi yavaştır (2-3 ay sürer) ama bırakıldığında\nNÜKS (tekrarlama) oranı EN DÜŞÜK olan, en kalıcı (küratif) yöntemdir.\nAilenin yüksek motivasyonu şarttır.</p>\n<h3 id=\"3-basamak-farmakoterapi-desmopressin---minirin\">3. Basamak:\nFarmakoterapi (Desmopressin - Minirin)</h3>\n<p><em>Mekanizma:</em> Sentetik ADH (Antidiüretik Hormon) analoğudur.\nDil altı (Melt) tablet olarak gece yatmadan hemen önce alınır. Doğrudan\nböbrekteki V2 reseptörlerine bağlanıp gece idrar üretimini durdurur\n(Suyu tutar).</p>\n<p><em>Başarı:</em> Etkisi MUCİZEVİ derecede hızlıdır. İlacı aldığı ilk\ngece çocuk kuru kalkar. Ancak ilacı kestiğin an, ertesi gün yatak tekrar\ngöl olur (Nüks oranı çok yüksektir). Genellikle alarmı tolere edemeyen\nailelerde veya \"çocuğun kampa/akrabaya gideceği\" kısa süreli kuru kalma\nihtiyaçlarında ilk tercih edilir.</p>\n<p><em>(Not: Eskiden kullanılan bir antidepresan olan İmipramin, ölümcül\nkardiyotoksik yan etkileri nedeniyle EAU 2026'da artık son çare (3.\nbasamak) olarak bile zorlukla önerilmektedir).</em></p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Poliklinikte 7 yaşındaki monosemptomatik enürezisli çocuğa\nDesmopressin (Melt tablet) reçete ettin. Aileyi ilacın kullanımıyla\nilgili uyarırken, hayati tehlike yaratan o meşhur 'Su Zehirlenmesi' yan\netkisini önlemek için hangi katı kuralı tembihlemelisin?\"</p>\n<p>Cevap: \"Desmopressin vücutta suyu (serbest suyu) inanılmaz derecede\ntutar. Aileye şu kesin kuralı vermeliyim: 'İlacı vermeden 1 saat önce ve\nilacı verdikten sonra sabaha kadar çocuğa su veya herhangi bir sıvı\niçirmek KESİNLİKLE YASAKTIR.' Eğer çocuk ilaçlıyken gece kalkıp bardak\nbardak su içerse, böbrek o suyu atamayacağı için kanda sodyum hızla\ndüşer (Seyreltik Hiponatremi). Bu durum çocukta beyin ödemine, şiddetli\nnöbetlere (konvülsiyon) ve komaya (Su Zehirlenmesi) yol açabilir.\"</p>\n<p>Soru: \"7 yaşında bir kız çocuğu geldi. Aile, 'Hocam bu çocuk 2\nyaşındayken tuvalet eğitimini mükemmel aldı, 5 yıl boyunca geceleri\nkupkuruydu. Ama son 2 aydır her gece yatağı ıslatıyor, gündüzleri de çok\nsu içip çok tuvalete gidiyor' dedi. Primer Enürezis deyip Alarm cihazı\nyazar mısın?\"</p>\n<p>Cevap: \"Asla yazmam. Bu klasik bir Sekonder Enürezis Nokturna\ntablosudur ve genellikle altta yatan organik veya psikolojik bir\nhastalığın çığlığıdır. Çok su içme (polidipsi), çok idrara çıkma\n(poliüri) ve aniden başlayan alt ıslatma kombinasyonu, aksi ispat\nedilene kadar Tip 1 Diabetes Mellitus (Şeker Hastalığı) şüphesi taşır.\nDerhal Açlık Kan Şekeri, HbA1c ve Tam İdrar Tahlilinde glukoz/keton\nbakılmalıdır. Ayrıca İYE veya evde yeni bir kardeş/boşanma gibi akut\nstres faktörleri de sorgulanmalıdır.\"</p>\n<p>Soru: \"Üroterapi uyguladın, Alarm cihazı denedin ama aile 'Hocam biz\nuyanıyoruz, alarm ortalığı yıkıyor ama çocuk top patlasa uyanmıyor,\ncihazı kapattık' dedi. Desmopressin başladın, ancak o da işe yaramadı\n(Dirençli MNE). Kombinasyon tedavisinde Desmopressin'in yanına eklemen\ngereken ilaç grubu nedir?\"</p>\n<p>Cevap: \"Desmopressin idrar miktarını azaltır ama mesane uykuda hala\nhiperaktif olup küçük hacimlerde bile kasılıyor olabilir. EAU\nkılavuzlarına göre Desmopressin direncinde, tedavinin yanına mesane\nkapasitesini artırmak ve gece kasılmaları durdurmak için bir\nAntikolinerjik (Oksibutinin veya Tolterodin) eklenmesi (Kombinasyon\nTerapisi) en etkili ikinci basamak medikal hamledir.\"</p>\n"}, {"id": "13.9", "t": "Pediatrik Ürolitiyazis (Çocuklarda Böbrek Taşı Hastalığı)", "h": "<h3 id=\"a-metaboli̇k-zorunluluk-neden-her-çocuğa-24-saatlik-i̇drar\">A.\nMETABOLİK ZORUNLULUK: Neden Her Çocuğa 24 Saatlik İdrar?</h3>\n<p>Yetişkinlerde sadece yüksek riskli gruplara (tekrarlayan taş, tek\nböbrek vb.) metabolik analiz yapılırken, istisnasız her pediatrik taş\nhastasına TAM metabolik değerlendirme (Kanda ve 24 saatlik idrarda)\nYAPILMAK ZORUNDADIR. Çünkü çocukların %70-80'inde altta yatan metabolik\nbir anormallik bulunur.</p>\n<p>En sık görülen metabolik suçlular:</p>\n<p>Hiperkalsiüri (İdrarda Fazla Kalsiyum Atılımı): Açık ara en sık\nnedendir. Böbrek kalsiyumu tutamaz veya bağırsak kalsiyumu aşırı\nemer.</p>\n<p>Hipositratüri (İdrarda Sitrat Eksikliği): Sitrat, idrardaki kalsiyuma\nbağlanıp onun çökmesini (kristalleşmesini) engelleyen en güçlü doğal taş\ninhibitörüdür (koruyucusudur). Çocuklarda sitrat eksikliği taşı\nkaçınılmaz kılar. (Tedavide dışarıdan Potasyum Sitrat şurupları\nverilir).</p>\n<p>Hiperoksalüri: Oksalatın idrarda aşırı atılmasıdır (Diyetle veya\nkaraciğerdeki nadir bir enzim eksikliği olan Primer Hiperoksalüri\nile).</p>\n<h3 id=\"b-di̇yet-paradoksu-kalsiyumu-kesmek-neden-en-büyük-hatadır\">B.\nDİYET PARADOKSU: Kalsiyumu Kesmek Neden En Büyük Hatadır?</h3>\n<p>Polikliniğe gelen ailelerin %90'ı şu hatayı yapar: \"Hocam çocuğun\ntaşı Kalsiyum Oksalat çıktı, biz de yoğurdu, sütü ve peyniri tamamen\nkestik.\"</p>\n<p>Fizyolojik Gerçek (Bağırsak Kenetlenmesi): Mide-bağırsak sisteminde,\ndiyetle alınan kalsiyum ile oksalat (ıspanak, çay, çikolata vb. içindeki\nmadde) birbirine bağlanarak dışkıyla atılır.</p>\n<p>Kalsiyum Kısıtlamasının Felaketi: Eğer çocuğun diyetinden kalsiyumu\n(sütü) kesersen, bağırsaktaki oksalat bağlanacak kalsiyum bulamaz.\nTamamen serbest kalan oksalat, kana ve oradan da doğrudan böbreklere\nemilir. İdrardaki oksalat miktarı çılgınca artar (Enterik Hiperoksalüri)\nve kalsiyum kısıtlandığı halde çocuk çok daha agresif, devasa Kalsiyum\nOksalat taşları üretmeye başlar.</p>\n<p><em>Altın Kural:</em> Çocuklarda kalsiyum kısıtlaması YASAKTIR.\nKısıtlanması gereken tek şey TUZ (Sodyum) ve aşırı hayvansal proteindir.\n(Tuz, böbrekten kalsiyum atılımını tetikler).</p>\n<h3 id=\"c-geneti̇k-beton-sistinüri-ve-çözülemeyen-taşlar\">C. GENETİK\nBETON: Sistinüri ve Çözülemeyen Taşlar</h3>\n<p>Ürolojinin en sinir bozucu, en sert ve ESWL (şok dalgası) ile\nkırılması neredeyse imkansız olan taşıdır.</p>\n<p>Patofizyoloji: Otozomal resesif (SLC3A1 ve SLC7A9 gen mutasyonu)\ngeçer. Böbrek proksimal tübüllerinden 4 temel aminoasidin (COLA: Sistin,\nOrnitin, Lizin, Arjinin) geri emilimi bozuktur. Bunlardan sadece Sistin\nidrarda çözünemez (insoluble) ve kristalleşerek taşlaşır.</p>\n<p>Klinik İpuçları: İdrar mikroskopisinde o meşhur Altıgen (Hegzagonal)\nkristaller görülür. Röntgen (DÜSG) filminde yarı-opak (buzlu cam gibi)\ngörünürler.</p>\n<p>Tedavi: Bu taşlar ESWL ile parçalanmaz, genellikle RIRS veya PCNL\n(lazer) ile un ufak edilmeleri gerekir. Tıbbi tedavide idrar pH'ı 7.5'un\nüzerine (çok alkaliye) çıkarılmaya çalışılır (Sitrat ile) ve Tiopronin\n(Tiyol bağlayıcılar) verilerek sistinin çözünürlüğü artırılır.</p>\n<h3 id=\"d-mi̇nyatür-cerrahi̇-eswl-rirs-ve-micro-pcnl\">D. MİNYATÜR CERRAHİ:\nESWL, RIRS ve Micro-PCNL</h3>\n<p>Pediatrik taş cerrahisinde yetişkinlere göre bazı devasa\navantajlarımız ve dezavantajlarımız vardır.</p>\n<p>ESWL (Vücut Dışından Şok Dalgasıyla Taş Kırma):</p>\n<p><em>Yetişkin Farkı:</em> Çocuklarda (genel anestezi altında\nyapılmasına rağmen) ESWL'nin başarı oranı yetişkinlerden çok daha\nyüksektir. Çünkü çocuğun vücut hacmi (mesafesi) küçüktür, enerji taşa\ndaha kolay ulaşır. Ayrıca çocuğun üreteri (idrar kanalı) çok daha\nelastiktir; kırılan o kumları ve parçaları takılmadan (taş\nyolu/steinstrasse yapmadan) mükemmel şekilde döker. Kılavuzlarda 10-20\nmm arası böbrek taşlarında ilk seçenektir.</p>\n<p>RIRS (Retrograd İntrarenal Cerrahi / Fleksibl URS):</p>\n<p>İdrar kanalından girip böbreğin odacıklarına (kalikslere) kadar\nkıvrılabilen çok ince (7.5 - 8.5 French) endoskoplar kullanılır. Ucundan\nçıkan Holmium:YAG veya Thulium Fiber Lazer (TFL) taşı toza çevirir. 20\nmm altındaki taşlarda, anatomisi ESWL'ye uygun olmayan veya ESWL'ye\ndirençli (Sistin/Brushit) taşlarda altın standarttır.</p>\n<p>Mini/Micro-PCNL (Perkütan Nefrolitotomi):</p>\n<p>Taş çok devasaysa (&gt; 20 mm, Geyik Boynuzu/Staghorn taşlar),\nçocuğun sırtından incecik bir iğneyle (11-15 French) böbreğe doğrudan\ndelik açılır ve taşlar içeride kırılıp vakumlanarak alınır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe tekrarlayan, devasa böbrek taşlarıyla gelen 5\nyaşında bir çocuk var. Böbrek ultrasonunda taşların yanı sıra, böbrek\nparankiminin (piramitlerin) de kireçlendiğini, bembeyaz parladığını\n(Nefrokalsinoz) gördün. 24 saatlik idrarında kalsiyum yüksek, sitrat çok\ndüşük ve idrar pH'ı 7.5 (Sürekli alkali). Bu tablo aksi ispat edilene\nkadar hangi tübüler hastalıktır?\"</p>\n<p>Cevap: \"Bu klasik bir Distal Renal Tübüler Asidoz (RTA Tip 1)\ntablosudur. Böbreğin distal tübülü asit (\\H+) atamaz. Vücut asidik\nkalır, idrar ise sürekli alkali (bazik) olur. İdrar alkali olduğu ve\nkalsiyum çöktüğü için çok şiddetli Kalsiyum Fosfat taşları ve böbrek\ndokusunun kireçlenmesi (Nefrokalsinoz) gelişir. Çocuğun büyümesi\ngeriler. Acilen Alkali (Sitrat) replasmanı yapılmalıdır.\"</p>\n<p>Soru: \"Çocuğun idrar kültüründe sürekli Proteus mirabilis ürüyor.\nRöntgen (DÜSG) filminde tüm böbrek pelvisini ve kalikslerini dolduran\ndevasa bir 'Geyik Boynuzu (Staghorn)' taş gördün. Bu taşın kimyasal\ncinsi nedir ve taşı tamamen temizlemezsen ne olur?\"</p>\n<p>Cevap: \"Bu bir Enfeksiyon Taşıdır (Struvit / Magnezyum Amonyum\nFosfat). Proteus bakterisi üreaz enzimi salgılayarak idrardaki üreyi\namonyağa çevirir, idrarı aşırı alkali yapar (pH &gt; 7.2) ve bu taşın\nçökmesine neden olur. Altın kural: Bu taşın %99'unu kırıp %1'ini içeride\n(toz olarak) bıraksan bile, o kum tanesinin içinde saklanan bakteriler\nbirkaç ay içinde taşı tekrar devasa boyutlara ulaştırır. Enfeksiyon\ntaşları cerrahi olarak (genellikle PCNL ile) %100 temizlenmek\n(Stone-free) zorundadır.\"</p>\n<p>Soru: \"1 yaşındaki bir bebeğe sol böbrek alt poldeki 15 mm'lik taşı\niçin RIRS (Fleksibl Üreteroskopi) yapmak istiyorsun. Sistoskopla girdin\nancak bebeğin üreter orifisi (idrar kanalının mesaneye giriş deliği) o\nkadar dar ki, en ince cihazın bile içeri geçmiyor. Zorlayarak cihazı\nyukarı iter misin?\"</p>\n<p>Cevap: \"ASLA. Pediatrik üreter kağıt kadar ince ve narindir;\nzorlarsam yırtılır (Avülsiyon) ve böbreği kaybederim. Kılavuzlar buna\n'Pre-stenting (Ön Stentleme)' çözümünü sunar. Cihazı zorlamak yerine, o\ndar deliğe sadece ince bir Double-J (DJ) Stent takarım ve işlemi\nsonlandırırım. 2 hafta beklerim. O stent, üreteri pasif olarak esnetip\ngenişletir (dilatasyon). 2 hafta sonra tekrar ameliyata girdiğimde,\nüreterin devasa cihazların bile kolayca geçebileceği kadar genişlediğini\ngörürüm.\"</p>\n"}, {"id": "13.10", "t": "Akut Skrotum (Testis Torsiyonu vs. Epididimit) ve Acil Yaklaşım", "h": "<h3 id=\"a-düşmanin-anatomi̇si̇-çan-tokmağı-bell-clapper-deformitesi\">A.\nDÜŞMANIN ANATOMİSİ: Çan Tokmağı (Bell-Clapper) Deformitesi</h3>\n<p>Normal bir erkekte testis, kendisini saran o koruyucu zara (Tunika\nVajinalis) arka yüzünden geniş bir şekilde yapışıktır. Bu yapışıklık,\ntestisin torbanın içinde kendi etrafında dönmesini fiziksel olarak\nengeller.</p>\n<p>Ancak testis torsiyonu geçiren hastaların %90'ında doğuştan bir\nanatomik kusur vardır: Çan Tokmağı (Bell-clapper) Deformitesi.</p>\n<p>Bu hastalarda Tunika Vajinalis, testisi çok yüksekten (spermatik\nkordonun üzerinden) sarar. Testisin arka yüzü zara yapışık değildir.</p>\n<p>Sonuç: Testis, tıpkı bir çanın içindeki tokmak gibi o zarın içinde\ntamamen serbesttir. Gece uykuda (kremaster kasının fizyolojik\nkasılmalarıyla) veya ani bir spor hareketinde testis kendi etrafında\nfırıldak gibi dönmeye başlar.</p>\n<p>Biyokimyasal Saat (İskemi Şelalesi):</p>\n<p>Testis döndüğünde kordon (damarlar) burulur. Önce basıncı düşük olan\nVenler (toplardamarlar) tıkanır. Kan testise girer ama çıkamaz; testis\ndevasa şekilde şişer (Venöz Konjesyon). Şişlik arttıkça içerideki basınç\nArterleri (atardamarları) de tıkar. Oksijen kesilir ve Hemorajik Nekroz\n(Çürüme) başlar. 6. saatten sonra testisin yaşama şansı %20'lere, 12.\nsaatte ise %0'a düşer.</p>\n<h3 id=\"b-kli̇ni̇k-dedekti̇fli̇k-ve-fi̇zi̇k-muayene-ultrasonun-tuzağı\">B.\nKLİNİK DEDEKTİFLİK VE FİZİK MUAYENE (Ultrasonun Tuzağı)</h3>\n<p>Karşında ağrıdan iki büklüm olmuş, kıvranan bir çocuk var. Acaba\ntestis kendi etrafında mı döndü (Torsiyon), yoksa idrar yolundan gelen\nbir bakteri testisin arkasındaki boruyu mu iltihaplandırdı (Akut\nEpididimit)?</p>\n<p>İşte seni o gece gereksiz bir ameliyattan kurtaracak veya acilen\nmasaya almanı sağlayacak o altın muayene bulguları:</p>\n<p>Kremaster Refleksi (En Hayati Bulgu): Uyluğun iç kısmını (bacağını)\nhafifçe çizdiğinde veya dokunduğunda, kremaster kası refleks olarak\ntestisi yukarı çeker.</p>\n<p><em>Torsiyon:</em> Kordon zaten burulmuş ve sinirler sıkışmış olduğu\niçin Kremaster refleksi KESİNLİKLE YOKTUR. (Torsiyonu dışlamak için en\ngüvenilir fiziksel bulgudur).</p>\n<p><em>Epididimit:</em> Refleks genellikle sağlamdır.</p>\n<p>Testisin Pozisyonu: Torsiyonda kordon burulup kısaldığı için, ağrıyan\ntestis diğerine göre çok daha YUKARIDA (High-riding) ve genellikle yan\nyatmış (Transvers) durur.</p>\n<p>Prehn Belirtisi: * Çocuğun ağrıyan testisini elinle hafifçe yukarı\n(kasığa doğru) kaldırdığında ağrı <em>HAFİFLİYORSA</em>, bu\nEpididimit'tir (Pozitif Prehn); çünkü iltihaplı kordonun gerginliğini\nazaltmış olursun.</p>\n<p>Eğer yukarı kaldırdığında ağrı <em>ARTIYOR</em> veya hiç\ndeğişmiyorsa, bu Torsiyondur (Negatif Prehn).</p>\n<p>Mavi Nokta Belirtisi (Blue Dot Sign): Sorun testisin kendisinde\ndeğil, testisin üst kutbundaki o minik embriyolojik kalıntının (Appendix\nTestis) burulmasıdır. Ağrı daha hafiftir ve deriyi gerdirip ışık\ntuttuğunda o morarmış dokuyu derinin altından mavi bir nokta gibi\ngörürsün. (Ameliyata gerek yoktur, ağrı kesiciyle geçer).</p>\n<p>Ultrason Malpraktisi:</p>\n<p>Gece saat 03:00. Şüphen çok yüksek, çocuk kıvranıyor, kremaster\nrefleksi yok. Doppler Ultrason istedin ama radyolog evden 1 saatte\ngelecek. BEKLEYEMEZSİN. EAU kılavuzları çok nettir: <em>\"Klinik şüphe\nyüksekse, ultrasonu bekleyerek zaman kaybetmek ve iskemi süresini\nuzatmak tıbbi bir hatadır. Derhal skrotal eksplorasyon (ameliyat)\nyapılmalıdır.\"</em></p>\n<h3 id=\"c-ameli̇yathane-skrotal-eksplorasyon-ve-ölümkalım-kararı\">C.\nAMELİYATHANE: Skrotal Eksplorasyon ve Ölüm/Kalım Kararı</h3>\n<p>Hızla çocuğu uyuttun ve skrotumu (torbayı) ortadan kestin (Mid-rafe\ninsizyonu). Karşına kapkara, morarmış bir testis çıktı.</p>\n<p>Detorsiyon (Düzeltme): Testisi eline alıp o burulmayı tersine doğru\naçarsın (Genellikle bir kitabı açar gibi, içten dışa doğru\ndönerler).</p>\n<p>Sıcak Kompres ve Sabır: Testisi ılık serum fizyolojikli kompreslere\nsarar ve anesteziye \"%100 oksijen ver\" dersin. 5-10 dakika o kapkara\ntestisin kanlanıp pembeleşmesini beklersin.</p>\n<p>Karar Anı:</p>\n<p>Pembeleşti, damarlar atmaya başladı: Orşiopeksi. Testis kurtuldu. Bir\ndaha dönmemesi için torbaya 3-4 farklı noktadan erimeyen (Prolen)\ndikişlerle sabitlenir.</p>\n<p>10 dakika geçti, testis hala kapkara, kesik attın kanamıyor:\nOrşiektomi. O ölü dokuyu içeride bırakamazsın (kangren olur ve vücudun\nbağışıklık sistemi ölü testise karşı antikor üretip sağlam testise de\nsaldırabilir - Sempatik Orşiyopati). Testisi tamamen kesip\nçıkarırsın.</p>\n<h3\nid=\"d-medi̇kolegal-zorunluluk-karşı-testisin-sağlamın-sabitlenmesi\">D.\nMEDİKOLEGAL ZORUNLULUK: Karşı Testisin (Sağlamın) Sabitlenmesi</h3>\n<p>Ameliyatta sol testisi kurtardın (veya aldın). İşin bitti mi?\nHAYIR.</p>\n<p>Çan tokmağı (Bell-clapper) deformitesi doğuştan gelen bir anomalidir\nve hastaların %90'ından fazlasında İKİ TARAFLIDIR. Yani sağ testis de\nher an dönmeye hazırdır.</p>\n<p>Altın Kural: Torsiyon ameliyatlarında, hasta/sağlam fark etmeksizin\nmutlaka KARŞI (SAĞLAM) TESTİS DE AÇILIP TORBAYA SABİTLENMEK (Bilateral\nOrşiopeksi) ZORUNDADIR. Eğer sadece hastalıklı tarafı ameliyat edip\nçocuğu taburcu edersen ve 1 yıl sonra o çocuk sağ testisi de dönmüş ve\nçürümüş olarak acile gelirse, bu tam bir medikolegal faciadır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"15 yaşında çocuk, 2 saat önce aniden başlayan şiddetli skrotal\nağrıyla geldi. Muayenede testisi çok ağrılı. Radyolog geldi, Doppler\nUltrason yaptı ve raporda şöyle yazdı: <em>'Sağ testiste kanlanma\n(vaskülarizasyon) azalmamış, aksine NORMALDEN ÇOK DAHA FAZLA (Hiperemi)\nartmıştır.'</em> Radyolog 'Bu Epididimit, kanlanma artmış' diyerek\nçocuğu sana gönderdi. Çocuğu antibiyotik verip eve mi gönderirsin?\"</p>\n<p>Cevap: \"Kesinlikle göndermem! Bu tablo klasik bir Aralıklı\n(İntermittan) Torsiyon veya spontan düzelmiş torsiyon tablosudur. Testis\ndönmüş, acıyla kıvrandırmış, sonra çocuk acile gelirken veya\nultrasondayken kendiliğinden geri dönüp (detorsiyone olup) açılmıştır.\nTıkanıklık aniden açıldığı için vücut oraya çılgınca kan pompalar\n(Reaktif Hiperemi). Ultrason bunu Epididimit (iltihap kanlanması) ile\nkarıştırabilir. Ancak klinik hikaye 'ani başlangıçlı' ise, bu çocuk\nyarın tekrar torsiyon olacaktır. Acilen (veya elektif şartlarda hızla)\nbilateral orşiopeksi yapılmalıdır.\"</p>\n<p>Soru: \"Polikliniğe ağrısız, yavaş yavaş şişen bir skrotum şikayetiyle\ngelen bir bebek var. Işık tuttuğunda (Transillüminasyon) torba ampul\ngibi kırmızı parlıyor. Tanı Hidrosel (su toplanması). Aile ameliyat\nistiyor. Bu bebeği hemen ameliyata alır mısın?\"</p>\n<p>Cevap: \"Bebeklerdeki hidrosel, testislerin torbaya inerken\narkalarında bıraktığı o periton zarının (Prosesus Vajinalis) kapanmaması\nsonucu karın içinden torbaya sıvı sızmasıdır (Komünikan Hidrosel). Çoğu\nzaman bu zar 1-2 yaşına kadar kendiliğinden kapanır ve sıvı emilir.\nKılavuzlara göre, eğer beraberinde belirgin bir kasık fıtığı (İnguinal\nHerni) yoksa, 2 yaşına kadar ameliyat EDİLMEZ, beklenir. 2 yaşından\nsonra hala devam ediyorsa, kasıktan girilip o zar (prosesus vajinalis)\nyüksekten bağlanır.\"</p>\n<p>Soru: \"Bir hasta saatler süren şiddetli ağrı sonrası acile geldi.\nMuayenede testisin Torsiyon olduğunu anladın ama ameliyathane dolu veya\nhastane şartları uygun değil. Çocuğu ambulansla başka merkeze sevk\netmeden önce acilde yapabileceğin hayat kurtarıcı manevra nedir ve\ntestisi hangi yöne doğru çevirmelisin?\"</p>\n<p>Cevap: \"Buna Manuel Detorsiyon denir. Torsiyonların üçte ikisi,\ntestisin medialden (içeriden) dışarıya doğru dönmesiyle oluşur. Acil\nserviste, testise lokal anestezi (kordon bloğu) yaparak veya hastayı\nsakinleştirerek testisi elime alır ve tıpkı 'Bir kitabın kapağını açar\ngibi' (Ortadan dışa/laterale doğru) 180-360 derece çeviririm. Eğer çocuk\naniden 'Ağrım geçti' derse, damarlar açılmış demektir. Testis\nkurtulmuştur ancak bu kalıcı bir tedavi değildir; cerrahi sadece birkaç\nsaatliğine ertelenmiş olur, testis yine de ameliyatla\nsabitlenmelidir.\"</p>\n"}]}, {"n": 14, "t": "Ürolojik Travma ve Rekonstrüktif Cerrahi", "s": [{"id": "14.1", "t": "Renal Travma (Derecelendirme, Konservatif Yönetim ve Cerrahi)", "h": "<h3 id=\"a-mekani̇zma-ve-gi̇zli̇-tehli̇ke\">A. MEKANİZMA VE \"GİZLİ\"\nTEHLİKE</h3>\n<p>Künt Travmalar (%80-90): Motorlu taşıt kazaları, yüksekten düşmeler,\ndarpler. Böbrek, altındaki psoas kası ile önündeki karın organları\narasında ezilir veya ani yavaşlama (deselerasyon) kopma kuvveti\nyaratarak böbrek sapındaki (hilum) damarları yırtar.</p>\n<p>Penetran (Delici-Kesici) Travmalar (%10-20): Ateşli silah veya bıçak\nyaralanmaları. Kinetik enerji çok yüksek olduğu için hasar genellikle\ntahmin edilenden çok daha ağırdır ve sıklıkla bağırsak/karaciğer\nyaralanmaları da eşlik eder.</p>\n<p>Görüntüleme Endikasyonu (Kime BT Çekelim?):</p>\n<p>Her düşene veya idrarında bir-iki eritrosit görene Tomografi (BT)\nçekilmez. EAU/AUA kılavuzlarına göre altın standart endikasyonlar\nşunlardır:</p>\n<p>Gözle görülür kanaması (Gross Hematüri) olan her travma hastası.</p>\n<p>Mikroskobik hematürisi olup, beraberinde Şok tablosu (Sistolik Kan\nBasıncı &lt; 90 mmHg) olan hastalar.</p>\n<p>Şok veya hematüri olmasa bile; ani deselerasyon (yüksek hızdan\ndurma), kaburga kırıkları veya ciddi yandaş organ yaralanması\nolanlar.</p>\n<h3 id=\"b-altin-standart-tani-çok-fazlı-ve-gecikmiş-kontrastlı-bt\">B.\nALTIN STANDART TANI: Çok Fazlı ve \"Gecikmiş\" Kontrastlı BT</h3>\n<p>Travma hastasında tek bir saniyelik \"Rutin Karın BT\" çekmek ürolojik\nbir hatadır. İdrar yollarının (toplayıcı sistemin) yırtılıp\nyırtılmadığını görmek için, böbreklerin ilacı süzüp idrar havuzuna\ndöktüğü o son anı beklemek zorundasın.</p>\n<p>Arteriyel Faz: Aktif kanamayı (Contrast blush) ve damar kopmalarını\n(Hilal avülsiyonu) gösterir.</p>\n<p>Nefrojenik (Venöz) Faz: Böbrek dokusundaki (parankim) yırtıkları\n(Lazerasyon) ve kanama alanlarını (Hematom) netleştirir.</p>\n<p>Gecikmiş Faz (Delayed Phase - 10-15. Dakika): En Kritik Olanı! Böbrek\nilacı süzdükten sonra çekilir. Eğer toplayıcı sistemde (pelvis veya\nkalikslerde) bir yırtık varsa, bembeyaz kontrast maddenin böbrek dışına,\nretroperitona sızdığını (Ekstravazasyon) sadece bu fazda\ngörebilirsin.</p>\n<h3 id=\"c-aast-amerikan-travma-cerrahisi-derneği-derecelendi̇rmesi̇\">C.\nAAST (Amerikan Travma Cerrahisi Derneği) DERECELENDİRMESİ</h3>\n<p>Ameliyat edip etmeyeceğimize ve hastayı nasıl takip edeceğimize karar\nverdiğimiz o evrensel dil. Böbrek hasarı 1'den 5'e kadar\nderecelendirilir:</p>\n<p>Evre I: Kontüzyon (Ezik) veya büyümeyen Subkapsüler Hematom.\nLazerasyon (Yırtık) YOKTUR.</p>\n<p>Evre II: Kortikal yırtık 1 cm'den KÜÇÜKTÜR. İdrar kaçağı\n(ekstravazasyon) yoktur. Perirenal hematom büyümüyordur.</p>\n<p>Evre III: Kortikal yırtık 1 cm'den BÜYÜKTÜR. Ancak yırtık hala\nböbreğin dış kısmındadır, toplayıcı sisteme (idrar havuzuna)\nulaşmamıştır. İdrar kaçağı yoktur.</p>\n<p>Evre IV (Kritik Dönemeç): * Yırtık o kadar derindir ki, toplayıcı\nsistemi (pelvis/kaliks) parçalamıştır. Gecikmiş fazda İdrar Kaçağı\n(Ekstravazasyon) görülür.</p>\n<p>VEYA böbreğin ana damarı değil ama Segmental (dal) arter veya venleri\nkopmuştur, içeride kanama vardır.</p>\n<p>Evre V (Yıkım): * Shattered Kidney: Böbrek paramparça olmuş, sayısız\nparçaya ayrılmıştır (Böbrek bütünlüğü yok).</p>\n<p>Hiler Avülsiyon: Böbreğin can damarı (Ana Renal Arter veya Ven)\nkopmuştur. Böbreğe giden kan tamamen kesilmiş ve böbrek BT'de simsiyah\n(iskemik) görünür.</p>\n<h3 id=\"d-tedavi̇-algori̇tmasi-bıçağı-bekletmek-konservatif-yönetim\">D.\nTEDAVİ ALGORİTMASI: Bıçağı Bekletmek (Konservatif Yönetim)</h3>\n<p>Eskiden Evre 4 ve 5 böbrekler hemen ameliyata alınıp \"alınır\n(nefrektomi)\" geçilirdi. Modern ürolojinin ve EAU 2026 kılavuzlarının\naltın kuralı ise şudur: \"Hasta Hemodinamik Olarak Stabilse (Tansiyonu\nnormal, nabzı sakin ve kan replasmanına yanıt veriyorsa), Evre kaç\nolursa olsun ilk seçenek KONSERVATİF (Ameliyatsız) YÖNETİMDİR.\"</p>\n<h3 id=\"1-konservatif-non-operatif-yönetim-nom\">1. Konservatif\n(Non-Operatif) Yönetim (NOM):</h3>\n<p>Kimlere? Tüm Evre 1, 2, 3 ve hemodinamisi stabil olan Evre 4-5 künt\ntravmalar.</p>\n<p>Nasıl? Hasta mutlak yatak istirahatine alınır. Sonda takılır. Seri\nHemogram (Htc) ve tansiyon takibi yapılır. Geniş spektrumlu antibiyotik\nbaşlanır.</p>\n<h3 id=\"2-anjiyoembolizasyon-minimal-i̇nvaziv-kurtarıcı\">2.\nAnjiyoembolizasyon (Minimal İnvaziv Kurtarıcı):</h3>\n<p>Hasta stabil, Evre 3 veya 4 böbreği var ama BT'de damardan dışarı\nsızan aktif bir kanama (Contrast Blush / Pseudoanevrizma) var. Veya\nhastanın kan değeri (Htc) sürekli düşüyor.</p>\n<p>Açık ameliyat yerine Girişimsel Radyoloji kasıktan girer, o kanayan\nminik damar dalını bulur ve içine 'coil' (sarmal tel) atarak kanamayı\niçeriden tıkar. Böbrek kurtulur!</p>\n<h3 id=\"3-mutlak-cerrahi-endikasyonlar-açık-eksplorasyon\">3. Mutlak\nCerrahi Endikasyonlar (Açık Eksplorasyon):</h3>\n<p>Hemodinamik İnstabilite: Çocuğa/Hastaya kan veriyorsun, sıvı\nveriyorsun ama tansiyon 60'larda sürünüyor. Kanama durmuyor. (Gecikirsen\nhasta masada kalır).</p>\n<p>Genişleyen (Pulsatil) Retroperitoneal Hematom: Laparotomi (Karın\nameliyatı) açılmış, bağırsaklara bakılırken böbrek bölgesindeki kan\npıhtısının gözünün önünde kalp gibi atıp büyüdüğü görülür.</p>\n<p>Evre V Hiler Avülsiyon: Ana damar kopmuş ve hasta kanıyor.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Acile bıçaklanma (Penetran travma) ile gelen bir hasta var. BT\nçektin, sol böbrekte Evre 3 (1 cm'den büyük) bir yırtık var. İdrar\nkaçağı yok. Hastanın tansiyonu 120/80 (Hemodinamik stabil). Ancak bıçak,\nböbreği delmeden önce kalından (Kolon) da geçmiş. Karın içinde serbest\nhava ve dışkı kaçağı var. Bu stabil böbreğe dokunur musun?\"</p>\n<p>Cevap: \"Böbrek stabil olsa da, hastanın Genel Cerrahi tarafından\nbağırsak delinmesi (peritonit) nedeniyle acil Laparotomiye alınması\nZORUNLUDUR. Karın içi dışkı (gaita) ile enfekte olmuşsa ve\nböbrek/retroperiton açılmışsa, konservatif kalamayız. Bağırsak\nonarılırken üroloji olarak biz de böbreği eksplore etmeli, ölü dokuları\ntemizlemeli (Debridman), yırtığı dikmeli (Renorafi) ve alanı bolca\nyıkamalıyız. Aksi takdirde retroperitonal apse ve fatal sepsis\nkaçınılmazdır.\"</p>\n<p>Soru: \"Evre 4 künt böbrek travmalı bir hastayı yatarak (Konservatif)\ntakip ediyorsun. BT'sinde idrar kaçağı (Ekstravazasyon) var. Hasta 4.\ngünde aniden ateşlendi (39 derece) ve böbrek ağrısı şiddetlendi.\nÇektiğin kontrol BT'sinde kaçan idrarın böbrek etrafında devasa bir göl\n(Ürinoma) oluşturduğunu ve enfekte olduğunu gördün. Böbreği kurtarmak\niçin ilk hamlen nedir?\"</p>\n<p>Cevap: \"Evre 4'teki idrar kaçaklarının çoğu sondalı ve yatak\nistirahatli takipte kendiliğinden kapanır. Ancak enfekte ürinoma (Apse)\nveya günlerce kesilmeyen idrar sızıntısı gelişirse, aşağıdan idrar\nyoluna sistoskopla girip bir Double-J (DJ) Stent takarım. DJ stent,\nidrarın o yırtık alandan dışarı sızmasını engeller, idrarı bypass edip\ndoğrudan mesaneye akıtır. Retroperitondaki o enfekte sıvı (ürinoma) için\nde radyoloji eşliğinde dışarıdan bir Perkütan Dren takarak apsenin\nboşalmasını sağlarım.\"</p>\n<p>Soru: \"Trafik kazası sonrası masaya aldığın, tansiyonu alınamayan\n(şokta) bir hastanın karnını açtın. Retroperitonda devasa bir hematom\nvar. Böbrek paramparça (Shattered Kidney - Evre V). Böbreği kurtarmak\niçin ince ince dikmeye (Renorafi veya Parsiyel Nefrektomi) çalışır\nmısın?\"</p>\n<p>Cevap: \"ASLA. Hasar kontrol cerrahisinde (Damage Control Surgery)\nşoktaki bir hastada öncelik böbreği değil, HAYATI (Hastayı)\nkurtarmaktır. Eğer karşı böbreğin normal olduğunu ameliyat öncesi BT'de\nteyit ettiysem ve elimdeki böbrek Evre 5 parçalanmış, kanayan bir\nböbrekse; o kanamayı onarmak için zaman kaybedemem. Klempi koyar,\npedikülü bağlar ve Acil Radikal Nefrektomi yaparak o taraf böbreği feda\nedip hastanın hayatını kurtarırım.\"</p>\n"}, {"id": "14.2", "t": "Mesane ve Üreter Travmaları (Ekstraperitoneal vs. İntraperitoneal)", "h": "<h3 id=\"a-mesane-travmasi-patlayan-balonun-yönü\">A. MESANE TRAVMASI:\nPatlayan Balonun Yönü</h3>\n<p>Mesane travmaları sıklıkla (%80-90) şiddetli motorlu taşıt kazaları\nveya yüksekten düşmeler sonucu, özellikle de Pelvis (Leğen Kemiği)\nKırıklarıyla birlikte görülür. Yırtığın nerede olduğu, tedavinin\nkaderini belirler:</p>\n<h3 id=\"1-i̇ntraperitoneal-yırtıklar-karın-i̇çine-patlama\">1.\nİntraperitoneal Yırtıklar (Karın İçine Patlama):</h3>\n<p>Mekanizma: Hasta arabaya binmeden önce bol su içmiş veya idrarını\ntutmuştur. Mesane dolu ve gergindir (Tam şişmiş bir balon). Kaza anında\nemniyet kemeri veya direksiyon karnın alt kısmına şiddetle çarpar.</p>\n<p>Fizyoloji: Dolu mesane, basınca dayanamaz ve en zayıf noktası olan,\nkarın boşluğuna bakan Kubbenden (Dome) yırtılır. İdrar (ve içindeki tüm\natıklar) doğrudan karın boşluğuna (peritona) dolar.</p>\n<p>Klinik: Hasta çok şiddetli karın ağrısı çeker (Akut Batın). İdrardaki\nüre ve kreatinin kana geri emilir (Yalancı böbrek yetmezliği /\nOto-diyaliz). Karın zarı idrardan dolayı yanar (Kimyasal Peritonit).</p>\n<p>Tedavi (Mutlak Cerrahi): İntraperitoneal yırtıklar ASLA kendiliğinden\niyileşmez. Hasta acil olarak Laparotomiye (veya laparoskopiye) alınır,\nkarın içi idrardan temizlenir ve yırtık mesane kubbesi 2 kat (emilebilir\ndikişlerle) su sızdırmaz şekilde dikilir.</p>\n<h3 id=\"2-ekstraperitoneal-yırtıklar-kemik-kıymıkları\">2.\nEkstraperitoneal Yırtıklar (Kemik Kıymıkları):</h3>\n<p>Mekanizma: Genellikle mesane boş veya yarı doluyken olur. Şiddetli\nkazada Pelvis kemikleri (Örn: Pubis kolları) kırılır. Kırılan o sivri\nkemik uçları, bir mızrak gibi mesanenin ön/yan duvarına (karın zarının\naltındaki kısma) saplanarak mesaneyi yırtar.</p>\n<p>Fizyoloji: İdrar karın içine girmez; mesane ile kemik arasındaki o\ndar, yağlı bölgeye (Retzius mesafesine) veya skrotuma sızar.</p>\n<p>Tedavi (Mucizevi Bekleyiş): EAU kılavuzlarına göre, ekstraperitoneal\nyırtıkların büyük çoğunluğunda AMELİYATA GEREK YOKTUR. Mesane kası çok\nkanlanan ve hızla iyileşen bir dokudur. Sadece idrar yolundan geniş bir\nFoley Sonda (20-22F) takılır. Sonda idrarı sürekli dışarı akıttığı için\nmesane basıncı sıfırlanır, yırtık dudakları birbirine yapışır ve 10-14\ngün içinde kendi kendine kaynayarak kapanır.</p>\n<h3 id=\"b-altin-standart-tani-retrograd-bt-sistografi\">B. ALTIN STANDART\nTANI: \"Retrograd\" BT Sistografi</h3>\n<p>Mesane travmasından şüphelendiğin hastaya (Örn: Pelvis kırığı + Gross\nhematürisi olan hasta) sadece damardan ilaç vererek normal bir Tomografi\nçekemezsin.</p>\n<p>Yapılan En Büyük Hata: Damardan (IV) kontrast verip böbreklerin\nmesaneyi doldurmasını beklemek, mesane yırtıklarını atlamanın (False\nNegative) en garantili yoludur.</p>\n<p>Doğrusu: Hastaya sonda takılır. Sondanın ucundan, yerçekimi\nyardımıyla en az 300-350 cc seyreltilmiş kontrast madde (ilaçlı su)\nmesaneye doldurulur ve sonda klemplenir. Mesane iyice gerdirildikten\nsonra BT çekilir. Sadece bu gerginlik, o küçük yırtıkları açıp ilacın\ndışarı sızmasını (Ekstravazasyon) gösterebilir. İntraperitoneal\nyırtıklarda ilaç bağırsakların arasına dağılırken, ekstraperitoneal\nyırtıklarda pelvis tabanında (alev gibi) birikir.</p>\n<h3 id=\"c-üreter-travmalari-i̇atrojenik-savaş-alanı\">C. ÜRETER\nTRAVMALARI: İatrojenik Savaş Alanı</h3>\n<p>Üreterler (idrar kanalları) retroperitonda çok derinlerde olduğu ve\nçok esnek oldukları için künt travmalarda (trafik kazalarında) nadiren\nkoparlar (Sadece çocuklarda şiddetli hiperekstansiyonda UPJ kopması\ngörülebilir).</p>\n<p>Üreter travmalarının %80'i İATROJENİKTİR (Doktor eliyle olur).</p>\n<p><em>Kadın Doğum (Jinekoloji):</em> Histerektomi (rahim alınması) veya\nsezaryen sırasında üreter yanlışlıkla bağlanır, kesilir veya koterle\nyakılır.</p>\n<p><em>Genel Cerrahi:</em> Rektum kanseri (LAR) ameliyatlarında pelvik\ntabanda üreter yaralanabilir.</p>\n<p><em>Üroloji:</em> Kendi yaptığımız URS (üreteroskopi) ameliyatlarında\nkanalı boydan boya yırtabiliriz (Avülsiyon).</p>\n<p>Rekonstrüksiyon Prensipleri (Üreteri Nasıl Dikeriz?):</p>\n<p>Eğer üreter koptuysa, onu uç uca dikmenin (Üretero-üreterostomi) 4\naltın kuralı vardır:</p>\n<p>Debridman: Kopan uçlardaki o ezilmiş, morarmış, ölü dokular\n(sağlıklı, kanayan doku gelene kadar) kesilip atılmalıdır.</p>\n<p>Spatülizasyon: Uçlar yılan ağzı gibi uzunlamasına kesilip\ngenişletilir (Darlık olmasın diye).</p>\n<p>Tansiyonsuz Anastomoz: Üreter gergin (tansiyonlu) dikilmez,\nkopar.</p>\n<p>Stentleme: Mutlaka içerisine Double-J (DJ) Stent konularak üzerinden\ndikilir (Absorbe olabilen sütürlerle).</p>\n<p><em>Aşağı Uç (Distal) Koptuysa:</em> Alt üreter koptuysa üreteri\nbirbirine dikemezsin, kanlanması bozulur. Doğrudan üreteri mesaneye\nyeniden gömersin (Üreteroneosistostomi). Eğer mesafe yetmiyorsa,\nmesaneyi yukarı, psoas kasına doğru asarak (uzatarak) üretere\nulaştırırsın (Psoas Hitch) veya mesaneden bir flep (dil) kaldırıp\nüretere boru yaparsın (Boari Flep).</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Acile çok ağır bir trafik kazası geldi. Pelvis kemiği\nparamparça olmuş. BT Sistografi çektin, mesanede Ekstraperitoneal Yırtık\nvar. İdrar karın içine sızmıyor. Kılavuzlara göre bu hastaya sadece\nFoley sonda takıp (konservatif) beklemelisin. Ancak ortopedi ekibi 'Biz\nbu hastanın pelvisini toparlamak için açık cerrahi (ORIF - Plak/Vida)\nyapacağız' dedi. Cerrahi planın değişir mi?\"</p>\n<p>Cevap: \"Kesinlikle değişir. Ekstraperitoneal yırtıklar normalde\nameliyat edilmez, ANCAK eğer ortopedi o bölgeye ortopedik donanım (plak,\nvida, protez) koymak için açık cerrahi yapacaksa, mesaneyi mutlaka açıp\no yırtığı içeriden onarmak ZORUNDAYIM. Aksi takdirde mesaneden sızan\nidrar, ortopedinin koyduğu o metal vidaları enfekte eder ve hastada\nölümcül bir pelvik osteomyelit başlar. (Diğer mutlak ameliyat\nendikasyonları: Mesane içine saplanmış kemik kıymığı olması, eş zamanlı\nrektum/vajina yırtığı veya mesane boynunun kopması).\"</p>\n<p>Soru: \"Kadın doğum uzmanı, zorlu bir histerektomi (rahim alma)\nameliyatından 3 GÜN SONRA seni aradı. Hastanın vajinasından sürekli su\n(idrar) geldiğini (Vezikovajinal veya Üreterovajinal fistül şüphesi)\nsöylüyor. İncelemelerde sağ üreterin alt ucunun ameliyatta yanlışlıkla\nkesildiğini fark ettin. Hastayı hemen acil ameliyata alıp o üreteri\nmesaneye (Reimplantasyon) diker misin?\"</p>\n<p>Cevap: \"Asla hemen dikmem. Travmanın/Kesinin üzerinden 72 saat\ngeçtikten sonra o pelvik bölgede inanılmaz bir inflamasyon, ödem ve\nenfeksiyon tablosu başlar. O dokular tereyağı gibidir, attığın hiçbir\ndikiş (anastomoz) tutmaz ve tekrar kopar. Kılavuzlara göre bu 'Geç Fark\nEdilen (Delayed)' iatrojenik yaralanmalarda, acil dönemde sadece böbreğe\nsırtından bir delikle Perkütan Nefrostomi takılır. İdrar dışarı alınır,\nhasta 6 ila 12 hafta boyunca inflamasyon sönene kadar evine gönderilir.\nDokular iyileşip yumuşadıktan sonra elektif şartlarda kalıcı\nrekonstrüksiyon (Psoas Hitch / Reimplantasyon) yapılır.\"</p>\n<p>Soru: \"Mesane travması sonrası hastaya Foley sonda taktın ve sondadan\nsapsarı, temiz idrar geliyor. Ancak hasta sürekli kanamasının olduğunu\nve idrar yapamadığını söylüyor. Muayenede skrotumun (torbanın) devasa\nbir şekilde şiştiğini ve morardığını (Kelebek şeklinde hematom /\nButterfly Hematoma) gördün. Bu klinik tablo mesane yırtığından çok neyin\nkopmasını işaret eder?\"</p>\n<p>Cevap: \"Sondanın mesanede olmasına rağmen perine ve skrotumun\nidrar/kanla şişmesi, asıl yaralanmanın mesanede değil, mesanenin\nçıkışındaki kanalda, yani Üretrada olduğunu gösterir. Pelvis\nkırıklarında sıklıkla prostatik üretra kopar (Posterior Üretra Travması)\nveya ata biner tarzı (straddle) düşmelerde ön üretra patlar. Bu durumda\nFoley sondayı zorlamak üretrayı tamamen parçalar.\"</p>\n"}, {"id": "14.3", "t": "Üretra Travmaları (Anterior vs. Posterior) ve Rekonstrüksiyon", "h": "<h3 id=\"a-i̇ki̇-farkli-dünya-anterior-ve-posterior-üretra\">A. İKİ FARKLI\nDÜNYA: Anterior ve Posterior Üretra</h3>\n<p>Üretra (idrar kanalı), urogenital diyafram adı verilen sert bir kas\ntabakası (eksternal sfinkterin olduğu yer) ile iki anatomik bölgeye\nayrılır. Bu iki bölgenin travma mekanizmaları ve yarattıkları yıkım\nbirbirinden tamamen farklıdır.</p>\n<h3 id=\"1-posterior-üretra-membranöz-ve-prostatik-pelvisin-kırılışı\">1.\nPosterior Üretra (Membranöz ve Prostatik): Pelvisin Kırılışı</h3>\n<p>Mekanizma: Genellikle çok yüksek enerjili motorlu taşıt kazaları veya\nyüksekten düşmeler sonucu gelişir. Leğen kemiği (Pelvis) kırıldığında,\nüretranın urogenital diyaframdan geçtiği o en sabit, en hareketsiz\nnoktası (Membranöz Üretra) bir giyotin gibi kesilir veya yırtılır.</p>\n<p>\"High-Riding\" Prostat: Pelvis tabanı parçalandığında, puboprostatik\nbağlar kopar. İçinde idrar dolu olan mesane ve altındaki prostat, devasa\npelvik hematomun (kanamanın) itmesiyle karın içine doğru fırlar.\nParmakla rektal muayene (DRE) yaptığında prostatı yerinde bulamazsın;\nprostat çok yukarıya kaçmıştır.</p>\n<p>Klinik: Hasta idrar yapamaz (Glob vezikale). Penis ucunda kan\nvardır.</p>\n<h3 id=\"2-anterior-üretra-bulbar-ve-penil-ata-biner-tarzı-düşme\">2.\nAnterior Üretra (Bulbar ve Penil): Ata Biner Tarzı Düşme</h3>\n<p>Mekanizma (Straddle Injury): Bisikletin demirine, rögar kapağına,\nçite veya inşaat iskelesine bacaklar açık şekilde (ata biner gibi)\ndüşmekle oluşur. Üretranın perine (apış arası) bölgesindeki en şişkin\nkısmı olan Bulbar Üretra, alttan gelen o sert cisim ile hastanın kendi\nleğen kemiği (Symphysis Pubis) arasında preslenerek ezilir ve\npatlar.</p>\n<p>Kelebek Hematomu (Fasyaların Sınırı): Eğer idrar kanalını saran o\nsağlam Buck Fasyası yırtılırsa, idrar ve kan cilt altına sızar. Bu\nsızıntı, perineyi saran Colles fasyasının sınırları içinde kalmak\nzorundadır. Kan arkada anüse, yanlarda uyluklara geçemez; doğrudan\nskrotuma (torbaya) ve karın ön duvarına yayılır. Hastanın perine ve\ntorbası devasa, mor bir kelebek (Butterfly Hematoma) şeklini alır.</p>\n<h3 id=\"b-altin-standart-tani-retrograd-üretrografi-rug\">B. ALTIN\nSTANDART TANI: Retrograd Üretrografi (RUG)</h3>\n<p>Penis ucunda kan (Meatal Kanama), idrar yapamama (Retansiyon) veya\nperineal morluk/hematom varsa, KÖRLEMESİNE SONDA TAKMAK KESİNLİKLE\nYASAKTIR. Yapılması gereken tek ve altın standart test Retrograd\nÜretrografi'dir.</p>\n<p>Nasıl Yapılır? Penisin ucuna (fossa navikülarise) enjektörle veya çok\nince bir sondayla (Foley balonunu sadece 1-2 cc şişirip uca\nsabitleyerek) girilir. İçeriye 20-30 cc kontrast madde (ilaçlı su)\nyavaşça sıkılırken röntgen çekilir.</p>\n<p>Görüntü: İlaç mesaneye kadar kesintisiz ulaşıyorsa yollar sağlamdır\n(Sonda takılabilir). Eğer ilaç bir noktada duruyor ve etraftaki dokulara\nbir alev topu gibi saçılıyorsa (Ekstravazasyon), üretra o noktada kopmuş\ndemektir.</p>\n<h3 id=\"c-yöneti̇m-ve-rekonstrüksi̇yon-akut-dönemde-ne-yapacağız\">C.\nYÖNETİM VE REKONSTRÜKSİYON: Akut Dönemde Ne Yapacağız?</h3>\n<p>Üretra kopmuş (Tam kat rüptür). İdrar dışarı akamıyor ve mesane\nşişiyor. Hastanın pelvisi kırık ve her yeri kanıyor.</p>\n<h3 id=\"1-akut-dönem-i̇lk-müdahale-sadece-yolu-değiştir\">1. Akut Dönem\n(İlk Müdahale): Sadece Yolu Değiştir!</h3>\n<p>EAU 2026 kılavuzlarına göre bu kan gölünün (pelvik hematomun) içine\ngirip üretrayı açık ameliyatla dikmeye çalışmak bir cerrahi intihardır.\nKanamayı durduramazsın ve sinirleri (sertleşmeyi sağlayan kavernöz\nsinirleri) kesinlikle kesersin.</p>\n<p>Suprapubik Kistostomi (SPC): Yapman gereken tek şey, idrarı bypass\netmektir. Göbeğin altından (kasıktan) cildi delerek doğrudan mesanenin\niçine bir tüp (kateter) yerleştirirsin. İdrar karnından torbaya akar.\nÜretraya DOKUNULMAZ. (Bazı ileri merkezlerde, hasta stabilse ilk 7 gün\niçinde sistoskopla girilip 'Primer Endoskopik Realignment' yani bir\nkılavuz tel üzerinden narin bir sonda geçirme denenebilir, ancak açık\ncerrahi kesinlikle yasaktır).</p>\n<h3 id=\"2-gecikmiş-rekonstrüksiyon-üretroplasti-sabrın-sonu\">2. Gecikmiş\nRekonstrüksiyon (Üretroplasti): Sabrın Sonu</h3>\n<p>Hasta suprapubik sondayla taburcu edilir. Pelvis kırıkları kaynayana,\no devasa pelvik kanama (hematom) tamamen emilene ve üretradaki kopuk\nalan iyileşip sert bir nedbe (skar) dokusuna dönüşene kadar en az 3 ila\n6 ay BEKLENİR.</p>\n<p>Eksizyon ve Primer Anastomoz (EPA): Aylar sonra hasta elektif\nşartlarda ameliyata alınır. Perineden (apış arasından) girilir. O\naradaki 2-3 cm'lik kopmuş ve taş gibi sertleşmiş skar dokusu tamamen\nkesilip çıkartılır (Eksizyon). Sağlam üretra uçları bulunup, gerilimsiz\n(tansiyonsuz) bir şekilde, genellikle yılan ağzı (spatüle) yapılarak uç\nuca dikilir. Başarı oranı %90-95'tir.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Acile trafik kazasıyla gelen bir hastanın penis ucunda kan\ngördün. Retrograd Üretrografi (RUG) çektin. Raporda <em>'Kısmi\n(Parsiyel) Üretra Rüptürü: Kontrast madde hem mesaneye geçiyor hem de\nkopuk alandan etrafa sızıyor'</em> yazıyor. Tam kopmamış. Bu hastaya\nSuprapubik Kistostomi mi açarsın, yoksa aşağıdan (üretradan) narin bir\nşekilde sonda mı denersin?\"</p>\n<p>Cevap: \"Eğer üretra kısmi (parsiyel) yırtılmışsa ve RUG ile tanıyı\nkesinleştirdiysem, EAU kılavuzlarına göre bir ürolog tarafından tek bir\nkez, çok narin ve nazik bir şekilde (tercihen sistoskop veya kılavuz tel\neşliğinde) silikon bir Foley sonda takılması denenebilir. Sonda geçerse,\nidrarı drene eder ve o kısmi yırtığın bir kalıp etrafında iyileşmesini\nsağlar. Sonda içeride 2-3 hafta tutulur. Asla zorlanmaz, dirençle\nkarşılaşılırsa derhal vazgeçilir ve Suprapubik Kistostomi açılır.\"</p>\n<p>Soru: \"Anterior üretra travması (Bulbar rüptür) nedeniyle Suprapubik\nKistostomi açtığın ve 3 ay beklettiğin bir hastayı 'Üretroplasti (Açık\nOnarım)' ameliyatına hazırlıyorsun. Ameliyattan önce kopuk olan o skar\ndokusunun (darlığın) tam uzunluğunu milimetrik olarak nasıl\nölçersin?\"</p>\n<p>Cevap: \"Sadece aşağıdan RUG çekmek yetmez, çünkü aşağıdan verilen\nilaç kopuklukta kalır, yukarısını (mesane tarafını) göstermez. Aradaki\nmesafeyi (defekti) ölçmek için 'Up-and-Down' (Antegrade ve Retrograde\nkombine) Üretrografi çekmeliyim. Aynı anda hem aşağıdan (penisten)\nkontrast veririm, hem de yukarıdaki Suprapubik Kistostomi tüpünden\n(mesaneden) kontrast verip hastaya 'işemesini' söylerim. İki ilaç\nsütununun arasında hiç ilaç dolmayan o kör karanlık alan, bana keseceğim\ndarlığın (defektin) tam uzunluğunu gösterir.\"</p>\n<p>Soru: \"Pelvis kırığına bağlı Posterior Üretra tam kopması\n(Distraksiyon defekti) olan bir hastada, 6 ay sonra perineal yoldan\n'Eksizyon ve Primer Anastomoz (EPA)' yapıyorsun. Ancak kestiğin iki uç\nbirbirine kavuşmuyor (Mesafe çok uzun, 4-5 cm). İki ucu birleştirmek\n(üretrayı uzatmak) için yapman gereken o meşhur 'Uzama Manevraları'\nsırasıyla nelerdir?\"</p>\n<p>Cevap: \"Üretrayı gergin (tansiyonlu) dikersek kesinlikle tekrar\nkopar. Esneklik kazanmak için sırasıyla şu basamakları (Webster\nManevraları) uygularım:</p>\n<p>Üretrayı saran korpus kavernozumlar arasındaki <em>septumu (zarı)\nayırmak</em>.</p>\n<p>Uçların daha rahat kavuşması için, <em>Symphysis Pubis kemiğinin alt\nbacağını (İnferior pubik rami) bir osteotom ile kesmek/kırmak (İnferior\nPubisektomi)</em>.</p>\n<p>Daha da yetmezse, üretrayı kavernozumların bacakları (kruralar)\narasından dolaştırmak yerine <em>kruraların arasını yarıp kestirme bir\nyoldan (Supracrural rerouting)</em> yukarı almak.\"</p>\n"}, {"id": "14.4", "t": "Üretral Darlıklar (Striktür), Bukkal Mukoza Greftleri ve Peyronie Hastalığı", "h": "<h3\nid=\"a-üretral-darlik-i̇skemik-spongiyofibrozis-ve-soğuk-bıçağın-i̇haneti\">A.\nÜRETRAL DARLIK: İskemik Spongiyofibrozis ve \"Soğuk Bıçağın\" İhaneti</h3>\n<p>İdrar kanalı (üretra), etrafını saran bol kanlanmalı, süngerimsi bir\ndoku olan Korpus Spongiyozum'un içinde seyreder. Endoskopik travmalar\n(sonda/sistoskopi) veya enfeksiyonlar bu süngerimsi dokunun kanlanmasını\nbozar. Dokuda iskemi başlar ve o yumuşak sünger, taş gibi sert,\nesnemeyen beyaz bir nedbe dokusuna (Spongiyofibrozis) dönüşür. Kanal\nbüzüşür, idrar ip gibi incecik akmaya başlar.</p>\n<p>DVIU (İnternal Üretrotomi) Neden Bir Çıkmaz Sokaktır?</p>\n<p>Poliklinikte asistanların en sık yaptığı hata, darlığı gören her\nhastayı endoskopiye alıp ucunda soğuk bıçak olan cihazla o darlığı saat\n12 hizasından kesmektir (DVIU).</p>\n<p><em>Fizyolojik Gerçek:</em> Bıçakla o sert dokuyu kestiğinde kanal\nanlık olarak açılır, idrar fışkırır. Ancak sen oraya yeni ve derin bir\nyara açtın. Vücut o yarayı iyileştirmek için daha fazla kollajen (skar)\nyığar.</p>\n<p><em>EAU 2026 Kılavuz Kuralı:</em> Soğuk bıçak (DVIU) veya dilatasyon\n(buji ile genişletme), sadece ilk kez olan, bulbar bölgedeki ve 1.5 - 2\ncm'den kısa darlıklarda TEK BİR KEZ denenebilir. Başarı şansı %50'dir.\nEğer darlık nüks ederse, tekrar tekrar kesmek darlığı daha da uzatır ve\nbetonlaştırır. Açık cerrahi (Üretroplasti) şarttır!</p>\n<h3 id=\"b-altin-standart-yama-bukkal-mukoza-grefti-bmg\">B. ALTIN\nSTANDART YAMA: Bukkal Mukoza Grefti (BMG)</h3>\n<p>Darlık uzunsa (&gt; 2 cm) veya defalarca bıçakla kesilip bozulmuşsa,\no fibrotik dokuyu kesip uç uca dikemezsin (kanal kısalır, penis aşağı\nbükülür). Kanalı uzunlamasına yarıp, araya bir yama (Greft) koyarak\nçatıyı genişletmek zorundasın.</p>\n<p>Neden Ağız İçi (Yanak) Zarı?</p>\n<p>Ürolojinin tartşmasız en iyi yedek parçasıdır.</p>\n<p>Islak Ortam: Zaten tükürüğe (sıvıya) alışıktır, idrarın asidik ve\nyakıcı ortamına inanılmaz dirençlidir.</p>\n<p>Pan-pleksus Kanlanma: Altında çok zengin, ağ gibi bir damar yatağı\nvardır.</p>\n<p>Kıl Folikülü Yoktur: Eğer penisin dışından kıllı bir deri (cilt)\nyaması koyarsan, o kıllar idrar yolunun içinde büyür, üzerinde taş\nbirikir ve devasa enfeksiyonlar yapar. Bukkal mukoza tamamen pürüzsüz ve\nkılsızdır.</p>\n<p>Barbagli Tekniği (Dorsal Onlay): Greftin Hayatta Kalma Savaşı</p>\n<p>Vücudun bir yerinden kopardığın serbest bir yama (greft), kendi\ndamarı olmadığı için konduğu yerin damarlarından beslenmek zorundadır\n(Önce serumu emer <em>'İmbibisyon'</em>, sonra yeni damarlar filizlenir\n<em>'İnoskülasyon'</em>).</p>\n<p><em>Nereye Dikelim?</em> Grefti idrar kanalının altına (ventraline)\ndikersen, altında sadece ince bir fasya olur, kanlanamaz ve çürür.\nİtalyan cerrah Barbagli'nin dehası şudur: İdrar kanalını üstten\n(dorsalden) yar. Üstte, penisin ana kan damarlarını barındıran devasa ve\nsımsıcak Korpus Kavernozumlar vardır. Grefti bu kanlı yatağın\n(kavernozumların) üzerine serip, idrar kanalını yorgan gibi greftin\nüzerine kapatırsan, yama %95 oranında kusursuz tutar.</p>\n<h3 id=\"c-peyroni̇e-hastaliği-tunika-albugineanın-i̇syanı\">C. PEYRONİE\nHASTALIĞI: Tunika Albuginea'nın İsyanı</h3>\n<p>Şimdi idrar kanalından (spongiyozumdan) çıkıp, penisin ereksiyonunu\nsağlayan o devasa silindirlerin (Kavernozumların) kılıfına, Tunika\nAlbuginea'ya geçiyoruz.</p>\n<p>Peyronie, cinsel ilişki sırasındaki mikroskobik bükülmeler\n(mikrotravmalar) sonucu tunika albuginea liflerinin yırtılması ve\nvücudun oraya anormal, asimetrik bir yara dokusu (Fibröz Plak)\nörmesidir.</p>\n<p>Patofizyoloji: Plak (sert kitle) hangi taraftaysa, o taraf\nesnekliğini kaybeder. Penis ereksiyon olduğunda sağlam taraf uzar,\nplaklı taraf uzayamaz. Sonuç: Penis, plak yönüne doğru 30, 60 hatta 90\nderece şiddetle bükülür (Eğrilik).</p>\n<p>Faz 1 - Akut (İnflamatuar) Dönem: İlk 6-12 ay. Plak yeni oluşuyordur,\nhenüz kireçlenmemiştir. Hasta ereksiyon anında Şiddetli Ağrı hisseder ve\neğrilik her geçen ay artar. <em>Bu dönemde cerrahi YASAKTIR!</em></p>\n<p>Faz 2 - Kronik (Stabil) Dönem: Ağrı tamamen geçmiştir. Eğrilik son\n3-6 aydır aynıdır (ilerlemiyordur). Plak taş gibi sertleşmiş, hatta\nkalsifiye (kireçlenmiş) olmuştur. Cerrahi veya müdahale zamanı\ngelmiştir.</p>\n<h3 id=\"d-peyroni̇e-yöneti̇mi̇-i̇ğnelerden-dikişlere\">D. PEYRONİE YÖNETİMİ:\nİğnelerden Dikişlere</h3>\n<h3 id=\"1-medikal-tedavi-plak-i̇çi-enjeksiyon---xiaflex\">1. Medikal\nTedavi (Plak İçi Enjeksiyon - Xiaflex):</h3>\n<p>FDA onaylı tek tedavidir (Kollajenaz Clostridium Histolyticum). Plak\nhenüz çok kireçlenmemişse, doğrudan plağın içine iğneyle bu enzim\nenjekte edilir. Enzim o sert kollajen bağlarını eritir. Hasta evde\npenisine \"modelleme\" (ters yöne germe) egzersizleri yapar ve eğrilik\n15-20 derece düzelebilir. (Eski tedaviler: Verapamil veya İnterferon\nenjeksiyonları).</p>\n<h3 id=\"2-cerrahi-strateji-altın-standart\">2. Cerrahi Strateji (Altın\nStandart):</h3>\n<p>Hasta kronik fazda ve eğrilik cinsel ilişkiyi engelliyorsa:</p>\n<p>Eğrilik &lt; 60 Derece ve Penis Boyu Uzunsa (Plikasyon\nTeknikleri):<br />\nPlağa hiç DOKUNULMAZ. Plağın tam karşısındaki \"sağlam ve uzun\" tarafa,\nerimeyen (Prolen/Gore-Tex) kalın dikişler atılarak o taraf büzüştürülür\n(Örn: Nesbit veya Yachia prosedürü). Yay gibi bükülen penisin iki tarafı\neşitlenir ve dümdüz olur.</p>\n<p><em>Bedeli:</em> Eğrilik düzelir ama Penis Boyu Kısalır (1-3 cm).\nHastaya ameliyat öncesi bu kesinlikle söylenmelidir.</p>\n<p>Eğrilik &gt; 60 Derece, Kum Saati Deformitesi veya Penis Boyu Kısaysa\n(Plak İnsizyonu ve Greft):<br />\nPenisi daha fazla kısaltamazsın. Plağın olduğu (kısa kalan) taraf H\nharfi veya çift Y şeklinde kesilir (İnsizyon), penis zorla düzeltilir.\nOrtada açılan o devasa boşluğa dışarıdan yama (Greft - Perikard, SIS,\nBukkal mukoza veya Dacron) dikilir.</p>\n<p><em>Bedeli:</em> Penis boyu korunur ancak greft, alttaki damar\nmekanizmasını (Veno-oklüzif mekanizma) bozabileceği için hastada\nŞiddetli Erektil Disfonksiyon (İktidarsızlık) gelişme riski\nyüksektir.</p>\n<p>Şiddetli Eğrilik + Mevcut Erektil Disfonksiyon (ED):<br />\nEğer hastanın eğriliğinin yanında zaten sertleşme sorunu (ED) varsa, ne\ngreft ne de dikiş işe yarar. Plak kesilir, penis düzeltilir ve içine\ndoğrudan Penil Protez (Mutluluk Çubuğu) yerleştirilerek her iki sorun\ntek seansta kesin olarak çözülür.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Polikliniğe anterior üretra darlığı (Bulbar striktür) ile\ngelen bir hastaya Bukkal Mukoza Grefti (BMG) ile açık üretroplasti\nplanladın. Ağız içinden greft alırken, yanak anatomisinde en çok\nkorktuğun ve KESİNLİKLE zedelememen gereken o meşhur kanalın adı nedir\nve nerededir?\"</p>\n<p>Cevap: \"Yanak içinden mukoza alırken cerrahın en büyük kabusu (ve\nanatomik sınırı) Stensen Kanalı'dır (Duktus Parotideus). Bu kanal, kulak\naltı tükürük bezinin (Parotis) ağız içine açıldığı yerdir ve genellikle\nüst 2. büyük azı dişi (molar diş) hizasında, mukozada minik bir papilla\nolarak yer alır. Greft alırken bu kanalın deliği mutlaka korunmalı ve\naltından/etrafından dolaşılmalıdır; aksi takdirde hastada kalıcı tükürük\nyolu tıkanıklıkları, ağrılı parotis şişmeleri veya şiddetli ağız\nkuruluğu (kserostomi) gelişir.\"</p>\n<p>Soru: \"Peyronie hastası geldi. Eğriliği yeni başlamış, ereksiyonları\ninanılmaz AĞRILI. Sana 'Hocam param var, bu eğriliği hemen yarın kesip\ndüzeltin (Nesbit yapın)' dedi. Hastanın isteğini kabul edip ameliyata\nalır mısın?\"</p>\n<p>Cevap: \"Asla almam. Ağrılı ereksiyon ve yeni başlayan eğrilik,\nhastalığın henüz Akut (İnflamatuar) Fazında olduğunu gösterir. Bu\ndönemde plak sürekli şekil değiştirmekte ve büyümektedir. Eğer şimdi\ndüzeltici bir ameliyat (Plikasyon/Nesbit) yaparsam, 3 ay sonra plak\nfarklı bir yöne doğru tekrar büyür ve ameliyatım tamamen boşa gider\n(Nüks). EAU/AUA kılavuzlarına göre cerrahi yapabilmek için hastanın\nağrısının tamamen geçmiş olması ve eğriliğin en az 3 ila 6 ay boyunca\nSTABİL (hiç değişmemiş) olması ZORUNLUDUR.\"</p>\n<p>Soru: \"Kısa bir bulbar üretra darlığı (&lt; 2 cm) saptadın. Bukkal\nmukoza yaması (BMG) kullanmak yerine, o 2 cm'lik dar, fibrotik kısmı\ntamamen kesip çıkarıp, iki sağlam ucu birbirine yılan ağzı (spatüle)\nşeklinde diktin (Eksizyon ve Primer Anastomoz - EPA). Ameliyat kusursuz\ngeçti. Ancak hastayı taburcu ederken, ilerleyen haftalarda\nyaşayabileceği hangi özel (mekanik) cinsel komplikasyona karşı onu\nuyarmalısın?\"</p>\n<p>Cevap: \"Bulbar üretradaki fibrotik dokuyu kesip çıkarıp iki ucu\nbirbirine çektiğimizde, idrar kanalını (ve onu saran korpus\nspongiyozumu) anatomik olarak kısaltmış oluruz. İdrar kanalı kısaldığı\niçin, hasta ameliyattan sonraki haftalarda ereksiyon olduğunda\n(kavernozumlar uzadığında), alttaki kısa kalan idrar kanalı penisi aşağı\ndoğru bir yay kirişi gibi çekebilir. Buna 'Chordee (Aşağı doğru\neğrilik)' veya cinsel ilişki sırasında gerilme ağrısı denir. Genellikle\naylar içinde doku esnedikçe düzelir, ancak hastaya ameliyat öncesi ve\nsonrası bu geçici kordi riski mutlaka anlatılmalıdır.\"</p>\n<p>Teknolojiler**</p>\n"}]}, {"n": 15, "t": "Adrenal, Laparoskopi/Robotik ve Yeni Teknolojiler", "s": [{"id": "15.1", "t": "Adrenal Kitleler (İnsidentaloma) ve Feokromasitoma Kriz Yönetimi", "h": "<h3 id=\"a-i̇nsi̇dentaloma-tesadüfen-bulunan-kitle-algoritması\">A.\nİNSİDENTALOMA: Tesadüfen Bulunan Kitle Algoritması</h3>\n<p>Başka bir sebeple çekilen görüntülemede tesadüfen saptanan böbreküstü\nbezi kitlelerine İnsidentaloma denir. Karşına böyle bir rapor geldiğinde\nbir ürolog olarak yanıtlaman gereken sadece iki hayati soru vardır:</p>\n<h3 id=\"1-bu-kitle-hormon-üretiyor-mu-fonksiyonel-mi\">1. Bu Kitle Hormon\nÜretiyor mu? (Fonksiyonel mi?)</h3>\n<p>Hasta hiçbir şikayeti olmadığını söylese bile, gizli bir fırtına\nkopuyor olabilir. EAU kılavuzlarına göre her insidentaloma hastasından\nKESİNLİKLE istenmesi gereken 3 temel test vardır:</p>\n<p><em>Feokromasitoma için:</em> 24 saatlik idrarda veya kanda\nFraksiyone Metanefrinler.</p>\n<p><em>Cushing Sendromu (Kortizol) için:</em> 1 mg Deksametazon\nBaskılama Testi.</p>\n<p><em>Conn Sendromu (Aldosteron) için:</em> Sadece hastanın tansiyonu\nyüksekse veya potasyumu düşükse (Hipokalemi) Aldosteron/Renin Oranı\n(ARR) bakılır.</p>\n<h3 id=\"2-bu-kitle-kanser-mi-radyolojik-şifreler\">2. Bu Kitle Kanser mi?\n(Radyolojik Şifreler)</h3>\n<p>Kitle fonksiyonel (hormonsuz) çıkarsa derin bir nefes alırız. Peki\nkanser midir (Adrenokortikal Karsinom)? Bunu Kontrastsız BT'deki\nHounsfield Ünitesi (HU) belirler.</p>\n<p>\\&lt; 10 HU: Kitle lipidden (yağdan) zengindir. Bu kesinlikle iyi\nhuylu bir Adrenal Adenomdur. Cerrahiye gerek yoktur, izlenir.</p>\n<p>\\&gt; 10 HU ve Boyut \\&gt; 4 cm: Yağdan fakirdir, şüphelidir.\nAdrenokortikal karsinom veya metastaz riski taşır. Boyutu 4-6 cm'yi\ngeçen veya hızla büyüyen kitleler cerrahi olarak çıkarılmalıdır\n(Adrenalektomi).</p>\n<h3 id=\"b-feokromasi̇toma-patlamaya-hazır-saatli-bomba\">B.\nFEOKROMASİTOMA: Patlamaya Hazır Saatli Bomba</h3>\n<p>Adrenal bezin iç kısmından (Medulla) köken alan, kontrolsüzce\nAdrenalin (Epinefrin) ve Noradrenalin pompalayan kromafin hücreli\ntümörlerdir.</p>\n<p>Klasik Triad: Çarpıntı (Taşikardi), Başağrısı ve Terleme. (Bu\nşikayetler ataklar halinde gelir, hasta kriz anında öleceğini\nhisseder).</p>\n<p>Meşhur 10'lar Kuralı (Rule of 10s):</p>\n<p>%10 Bilateraldir (İki taraflı).</p>\n<p>%10 Ekstra-adrenaldir (Böbreküstü bezi dışında, genellikle aort\netrafındaki sempatik zincirde yer alır. Buna <em>Paraganglioma</em>\ndenir).</p>\n<p>%10 Maligndir (Kanserdir ve metastaz yapar).</p>\n<p>%10 Çocukluk çağında görülür.</p>\n<p>%10 Aileseldir (MEN 2A/2B, Von Hippel-Lindau veya Nörofibromatozis\nTip 1 sendromları ile birliktedir).</p>\n<h3\nid=\"c-preoperati̇f-hazirlik-anesteziyi-ölümden-kurtaran-ölümcül-sıra\">C.\nPREOPERATİF HAZIRLIK: Anesteziyi Ölümden Kurtaran \"Ölümcül Sıra\"</h3>\n<p>Tanıyı koydun, ameliyat kararı aldın. Feokromasitoma hastasını\ndoğrudan ameliyathaneye indirmek bir CİNAYETTİR. Hasta anestezi alırken\nveya sen kitleye dokunduğunda kana devasa bir adrenalin denizi boşalır.\nBu fırtınayı önlemek için hastayı ameliyattan 10-14 gün önce medikal bir\nkalkanla korumaya almak zorundasın.</p>\n<p>İşte farmakolojinin o altın kuralı (Ölümcül Sıra):</p>\n<p>ÖNCE Alfa-Blokaj (Mutlak Kural): İlk olarak Doksazosin (Cardura) veya\nFenoksibenzamin başlanır. Bu ilaçlar damarlardaki alfa reseptörleri\nkapatır ve damarları genişletir (Vazodilatasyon).</p>\n<p>SONRA Beta-Blokaj: Kalp atım hızını (Taşikardiyi) düşürmek için\nPropranolol gibi beta-blokerler başlanır.</p>\n<p>Kabus Senaryosu (Neden Sıra Önemli?): Eğer asistan yanlışlıkla\n<em>ÖNCE beta-bloker</em> verirse ne olur? Beta reseptörler (damarı\ngenişleten mekanizma) bloke olur. Kana karışan devasa adrenalin, açık\nkalan Alfa reseptörlere (damar büzücülere) rakipsiz bir şekilde\nsaldırır. Çocuğun/Hastanın damarları \"Unopposed Alpha Stimulation\"\n(Rakipsiz alfa uyarımı) ile aniden beton gibi kasılır. Tansiyon 300'e\nfırlar, hasta Akut Kalp Yetmezliği ve Beyin Kanamasından kaybedilir.</p>\n<p><em>Not: Alfa blokaj damarları çok genişlettiği için hasta ameliyata\ngirene kadar bol tuzlu diyet ve damardan IV sıvı (volüm genişletmesi)\nile doldurulmalıdır.</em></p>\n<h3 id=\"d-cerrahi̇-adrenal-venin-krallığı-ve-sağ-sol-tuzağı\">D. CERRAHİ:\nAdrenal Venin Krallığı ve Sağ-Sol Tuzağı</h3>\n<p>Ameliyathanesin. Laparoskopik veya Robotik olarak böbreküstü bezine\nulaştın. Klasik cerrahide kitle yavaş yavaş etraftan serbestleştirilir,\ndeğil mi? Feokromasitomada bu yasaktır!</p>\n<p>İlk Hamle (Early Vein Ligation): Kitleyi asla mıncıklamaz, sıkmaz\nveya çekiştirmezsin. Kitleye dokunduğun an kana adrenalin fırlar. Yapman\ngereken ilk ve en hayati hamle, doğrudan Adrenal Veni (Toplardamarı)\nbulup kliplemek ve kesmektir. Ven kesildiği an, tümörün sistemik\ndolaşımla (kalple) olan bağı kopar. Artık kitleyi rahatça\nçıkarabilirsin.</p>\n<p>Sağ ve Sol Anatomik Ölüm Tuzağı:</p>\n<p>Sol Adrenal Ven: Nispeten uzundur ve güvenli bir şekilde Sol Renal\nVene dökülür. Bulması ve kliplemesi kolaydır.</p>\n<p>Sağ Adrenal Ven: Ürolojinin en tehlikeli damarlarından biridir.\nSadece birkaç milimetre (çok kısa) uzunluğundadır ve doğrudan, açılı bir\nşekilde Vena Kava İnferior'a (Ana Toplardamara) dökülür. Yanlış bir\ndiseksiyon, klipsin kayması veya damarın yırtılması durumunda, Vena\nKava'dan fışkıran devasa bir kanama saniyeler içinde masayı kırmızıya\nboyar. Sağ tarafta çalışırken Vena Kava duvarına paralel, milimetrik ve\nçok nazik çalışılmalıdır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Sol böbreküstü bezinde 5 cm Feokromasitoma olan bir hastayı\nlaparoskopik olarak ameliyat ediyorsun. Kılavuzlara uygun olarak ilk\nönce Sol Adrenal Veni buldun, klipsledin ve kestin. Tam o saniyede\nanestezi doktoru panikle bağırdı: 'Hocam hastanın tansiyonu aniden\n60/40'a düştü, kardiyovasküler kollapsa (şoka) giriyor!' Bu ani tansiyon\ndüşüşünün fizyolojik sebebi nedir ve nasıl çözersin?\"</p>\n<p>Cevap: \"Bu beklenen ve yönetilmesi gereken bir krizdir. Adrenal veni\nkestiğim an, hastanın damarlarını saatlerdir yüksek tansiyonda tutan o\ndevasa katekolamin (adrenalin) desteği aniden, bıçak gibi kesilir. Vücut\no yüksek adrenaline alıştığı için, destek kesilince damarlar aniden felç\nolmuş gibi gevşer (Vazopleji) ve şiddetli hipotansiyon gelişir. Çözüm\ncerrahide değil anestezidedir: Anestezi ekibi derhal yüksek hızda IV\nsıvı yüklemesi yapmalı ve gerekirse dışarıdan vazopressör\n(Noradrenalin/Efedrin) desteği açarak tansiyonu toparlamalıdır.\"</p>\n<p>Soru: \"Polikliniğe genç bir hasta geldi. Hipertansiyonu ve\nhipokalemisi (Potasyum düşüklüğü) var. Yapılan testlerde Aldosteron\nyüksek, Renin düşük geldi. Tomografide sağ sürrenal bezde 2 cm'lik bir\nAdenom (Conn Sendromu) saptadın. Bu hastayı ameliyata almadan önce,\nkitlenin gerçekten bu adenom olduğunu kanıtlamak için hangi ileri\ninvaziv testi istersin?\"</p>\n<p>Cevap: \"Özellikle 40 yaş üstü veya bilateral nodülü olan hastalarda,\nsadece BT görüntüsüne güvenerek ameliyat yapamayız. Gördüğümüz adenom\n'tesadüfi, çalışmayan' bir adenom olabilir ve asıl hiperplazi\n(aldosteron salgısı) diğer bezden veya her iki bezden geliyor olabilir.\nAltın standart invaziv test Adrenal Venöz Örnekleme (AVS)'dir.\nGirişimsel radyoloji her iki adrenal vene kateter gönderip kan alır.\nHangi tarafın aldosteron seviyesi diğerinden (ve Vena Kava'dan) kat kat\nyüksekse, suçlu ve ameliyat edilecek bez kesin olarak o taraftır.\"</p>\n<p>Soru: \"Laparoskopik Sağ Adrenalektomi yapıyorsun. Karaciğeri yukarı\nekarte ettin, Vena Kava İnferioru buldun. Ancak o kısa ve tehlikeli Sağ\nAdrenal Veni bir türlü göremiyorsun. Onu anatomik olarak en rahat\nbulacağın sabit 'landmark' (işaret noktası) neresidir?\"</p>\n<p>Cevap: \"Sağ adrenal veni bulmak için körlemesine yağ dokusunu\neşelemek Vena Kava'yı yırtma riski taşır. En güvenli yol, Vena Kava'nın\nlateral (dış) kenarını karaciğerin alt sınırından itibaren yukarı doğru\ntakip etmektir. Sağ adrenal ven, Vena Kava'nın arka-dış (posterolateral)\nyüzünden, genellikle üst pol seviyesine yakın bir noktada doğrudan kısa\nbir dal olarak çıkar. O bölgeyi nazikçe 'hook' veya aspiratör ucuyla\nsıyırmak damarı ortaya çıkarır.\"</p>\n"}, {"id": "15.2", "t": "Laparoskopi, Robotik Cerrahi Prensipleri ve Pnömoperitonyum Fizyolojisi", "h": "<h3 id=\"a-pnömoperi̇tonyum-karbondioksitin-co2-fizyolojik-yükü\">A.\nPNÖMOPERİTONYUM: Karbondioksitin (CO2) Fizyolojik Yükü</h3>\n<p>Karın içini (veya retroperitonu) bir çadır gibi şişirmeden, o incecik\naletleri içeride hareket ettiremeyiz. Bu şişirme işlemine\nPnömoperitonyum denir.</p>\n<p><em>Neden Oksijen veya Hava değil de CO2?</em> Çünkü CO2 ucuzdur,\nelektrikli koter kullanıldığında alev alıp patlamaz (yanıcı değildir) ve\nkanda inanılmaz hızlı çözünür (yanlışlıkla damara girerse ölümcül gaz\nembolisi riski havaya göre çok daha düşüktür).</p>\n<p>Ancak karın içi basıncını (İntra-Abdominal Basınç - IAP) 12 ila 15\nmmHg seviyesine çıkardığımızda, anestezi ekranında fizyolojik bir\nfırtına kopar:</p>\n<p>Kardiyovasküler Çöküş ve Direnç: Artan basınç, karın içindeki Vena\nKava'yı (ana toplardamarı) ezer. Kalbe dönen kan (Preload) azalır, buna\nbağlı olarak Kardiyak Output (Kalp debisi) düşer. Vücut bunu dengelemek\niçin damarları büzer, Sistemik Vasküler Rezistans (SVR) artar ve\ntansiyon yükselme eğilimine girer.</p>\n<p>Solunum (Ventilasyon) Kabusu: Gazın basıncı diyaframı göğüs boşluğuna\n(yukarıya) iter. Akciğerlerin hacmi (Fonksiyonel Rezidüel Kapasite -\nFRC) daralır. Hava yolu basınçları fırlar. Üstelik karın içindeki CO2\nkana emilir (Hiperkarbi). Anestezi bu asidozu atmak için hastayı çok\ndaha hızlı ve basınçlı solutmak (Hiperventilasyon) zorunda kalır.</p>\n<p>Renal Etki (Oligüri Yanılgısı): Ameliyatın 2. saatindesin. Anestezi\n\"Hocam sondadan idrar gelmiyor, böbreği mi kestiniz?\" diye sorar.\n<em>Korkma.</em> 15 mmHg basınç, renal veni ve böbrek parankimini ezer.\nBöbrek kan akımı ve Glomerüler Filtrasyon Hızı (GFR) geçici olarak\ndüşer. ADH ve Renin salgısı artar. Ameliyat bitip gazı boşalttığın an,\nböbrekler tekrar litrelerce idrar üretmeye başlar.</p>\n<h3\nid=\"b-cerrahi̇-felsefe-transperitoneal-vs-retroperitoneal-yaklaşım\">B.\nCERRAHİ FELSEFE: Transperitoneal vs. Retroperitoneal Yaklaşım</h3>\n<p>Böbreğe iki farklı otobandan gidebiliriz. İkisinin de birbirine üstün\nolduğu altın senaryolar vardır.</p>\n<h3 id=\"1-transperitoneal-bağırsakların-i̇çinden\">1. Transperitoneal\n(Bağırsakların İçinden):</h3>\n<p>Göbekten (umblikus) girilir, tüm bağırsaklar görünür. Böbreğe ulaşmak\niçin kolon (kalın bağırsak) medial'e (içe doğru) yatırılır (Toldt\nfasyası kesilerek).</p>\n<p><em>Avantajı:</em> Çalışma alanı devasadır. Anatomik işaretler\n(landmarklar) çok nettir. Çok büyük tümörlerde veya geniş\nrekonstrüksiyon (Piyeloplasti) gerektiren işlerde rahatlık sağlar.</p>\n<p><em>Dezavantajı:</em> Bağırsaklara dokunduğun için ameliyat sonrası\nbağırsak felci (Paralitik İleus) riski yüksektir. Daha önce çok sayıda\nkarın ameliyatı olmuş hastalarda yapışıklıklardan dolayı girilmesi çok\nzordur.</p>\n<h3 id=\"2-retroperitoneal-sırttan-kendi-arka-bahçemiz\">2.\nRetroperitoneal (Sırttan, Kendi Arka Bahçemiz):</h3>\n<p>Karın zarı (periton) hiç açılmaz. Sırttan, doğrudan böbreğin ve psoas\nkasının olduğu o daracık, yağlı boşluğa girilir. İlk giren trokardaki\nbir balon şişirilerek yapay bir çalışma boşluğu yaratılır.</p>\n<p><em>Avantajı:</em> İdrar yollarının doğal anatomisidir. Bağırsak\nyaralanma riski veya ileus sıfıra yakındır. Ameliyat sonrası hasta çok\nhızlı toparlar. İdrar sızarsa karın içine yayılmaz, retroperitonda\nsınırlı kalır.</p>\n<p><em>Dezavantajı:</em> Çalışma alanı bir kutu kadar dardır. Anatomik\nlandmark yoktur, cerrah tamamen psoas kasına ve damar atımlarına\n(oryantasyona) güvenmek zorundadır. Öğrenme eğrisi (Learning curve) çok\ndiktir.</p>\n<h3 id=\"c-da-vinci-roboti̇k-cerrahi̇-i̇nsan-elinin-sınırlarını-aşmak\">C. DA\nVINCI ROBOTİK CERRAHİ: İnsan Elinin Sınırlarını Aşmak</h3>\n<p>Standart laparoskopi ürolojide devrim yarattı, ancak iki büyük kusuru\nvardı: Birincisi, kamera iki boyutluydu (derinlik hissi yoktu).\nİkincisi, uzun çubuklar (enstrümanlar) düzdü ve fulcrum etkisiyle (ters\nhareket prensibi) çalışıyordu; incecik bir dikiş atmak saatler\nalıyordu.</p>\n<p>İşte Robotik Cerrahi (Da Vinci) bu sınırları yıktı:</p>\n<p>3D Yüksek Çözünürlük (HD) ve Büyütme: Konsoldaki cerrah, prostatın\netrafındaki o saç teli inceliğindeki sinirleri (Nörovasküler Demet) 10\nkat büyütülmüş ve gerçek 3 boyutlu olarak görür.</p>\n<p>EndoWrist Teknolojisi (7 Serbestlik Derecesi): Robotun kolları düz\nbir çubuk değildir. Ucundaki aletler, bir insan bileğinden çok daha\nesnek bir şekilde 540 derece dönebilir ve kıvrılabilir. Bu sayede\nRadikal Prostatektomide o daracık pelvisin dibinde veya Parsiyel\nNefrektomide kanayan böbreği dikerken kusursuz manevra sağlar.</p>\n<p>Tremor Filtrasyonu: Cerrahın elindeki o yorgunluğa veya strese bağlı\nince fizyolojik titremeleri (tremor) bilgisayar filtreler. Robotun ucu\niçeride milim titremez.</p>\n<p>Ergonomi: Cerrah ayakta, kolları havada saatlerce eziyet çekmek\nyerine; konsolda rahatça oturur, yorulmaz, dikkati dağılmaz.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Ameliyata başladın. Göbekten ilk girişi kapalı yöntemle\n(Veress İğnesi ile) yaptın ve gazı (CO2) açtın. Karın şişmeye başladığı\nilk saniyelerde anestezi panikle bağırdı: 'Hocam hastanın nabzı aniden\n30'a düştü (Şiddetli Bradikardi), kalp duracak!' Bu ani refleksin\nfizyolojik adı nedir ve cerrah olarak anında yapman gereken fiziksel\nhamle nedir?\"</p>\n<p>Cevap: \"Bu klasik bir Vagovagal Reflekstir. Periton zarı, hızlı ve\nyüksek basınçlı gazla aniden gerildiğinde, vagus siniri aşırı uyarılır\nve kalbi durma noktasına getirir. Cerrah olarak yapmam gereken İLK VE\nTEK ŞEY, insüflasyon cihazını kapatıp, trokarın valfini açarak karın\niçindeki gazı hızla BOŞALTMAKTIR (Desüflasyon). Periton gerginliği\ngidince nabız genellikle saniyeler içinde toparlar. Toparlamazsa\nanestezi Atropin yapar. Ardından gaz, çok daha düşük bir akım hızıyla\n(düşük litre/dakika) yavaş yavaş tekrar verilir.\"</p>\n<p>Soru: \"Laparoskopik parsiyel nefrektomi yapıyorsun. Böbrek venini\nyanlışlıkla yırttın ve içeriye hızla CO2 gazı girdi (Venöz Gaz\nEmbolisi). Anestezi monitöründe bu felaketi gösteren ilk ve en spesifik\nbulgu nedir? Hastayı ölümden kurtarmak için masayı acilen hangi\npozisyona çevirmelisin?\"</p>\n<p>Cevap: \"Gaz embolisinin anestezi ekranındaki en erken ve spesifik\nbulgusu, End-Tidal CO2 (\\ETCO_2) değerinin ANİDEN DÜŞMESİDİR (Çünkü kan\nakımı kesildiği için akciğerlere gaz gelmez). Tansiyon dibe vurur.\nSteteskopla dinlendiğinde kalpte 'Değirmen Çarkı Üfürümü (Mill-wheel\nmurmur)' duyulur. Tedavide gaz derhal kapatılır, hastaya %100 oksijen\nverilir ve masa acilen Sol Lateral Dekübitus ve Trendelenburg (Durant\nPozisyonu) pozisyonuna alınır. Bu pozisyon, sağ kalbe giren gaz\nbaloncuğunun sağ ventrikülün tepesinde (apeksinde) asılı kalmasını\nsağlar ve pulmoner artere (akciğere) gidip sistemi tıkamasını (fatal\nemboliyi) önler.\"</p>\n<p>Soru: \"Polikliniğe böbrek tümörü olan bir hasta geldi. Kitle arka\ntarafta, Retroperitoneal laparoskopi için mükemmel bir aday. Ancak\nhastanın özgeçmişinde 10 yıl önce aynı taraftan 'Açık Böbrek Taşı\nAmeliyatı (Açık Piyelolitotomi)' hikayesi var. Bu hastaya\nretroperitoneal yoldan girmeyi planlar mısın?\"</p>\n<p>Cevap: \"Kesinlikle planlamam. Retroperitoneal laparoskopinin en büyük\nkontrendikasyonu aynı bölgeden geçirilmiş eski açık cerrahilerdir. O\nameliyat, retroperitondaki o narin yağlı planları yok etmiş, yerine taş\ngibi sert, yapışık ve kanamalı bir fibröz doku (skar) örmüştür. Balonu\nşişirip çalışma alanı yaratmaya çalıştığımda balon patlar veya dokular\naçılmaz. Bu hastada o eski
