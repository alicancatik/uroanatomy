tur. Ne kadar çok sağlam parankim bırakırsan, böbrek o\nkadar iyi çalışır.</p>\n<h3 id=\"b-i̇skemi̇-süreleri̇-cerrahın-zamanla-yarışı\">B. İSKEMİ SÜRELERİ\n(Cerrahın Zamanla Yarışı)</h3>\n<p>Parsiyel nefrektomi yaparken kanamayı durdurmak ve tümörü net\ngörebilmek için böbreğe giden ana damarı (Renal Arter) bir klemp ile\ngeçici olarak kapatman gerekir. Ancak oksijen kesildiği an, o çok\ndeğerli nefronlar ölmeye başlar.</p>\n<h3 id=\"1-sıcak-i̇skemi-warm-ischemia-time---wit\">1. Sıcak İskemi (Warm\nIschemia Time - WIT):</h3>\n<ul>\n<li>Böbreğin normal vücut ısısında kan akımının kesildiği süredir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Altın Sınır: Nefronlarda geri dönüşümsüz akut tübüler nekrozun (ATN)\nbaşlamaması için bu süre ideal olarak 20-25 dakikayı (maksimum 30 dk)\naşmamalıdır. Cerrah, tümörü kesip çıkarmak ve böbrekteki açılan\ndamarları/toplayıcı sistemi dikip klempi açmak için bu dakikalar içinde\nişini bitirmek zorundadır.</li>\n</ul>\n<h3 id=\"1-soğuk-i̇skemi-cold-ischemia-time---cit\">1. Soğuk İskemi (Cold\nIschemia Time - CIT):</h3>\n<ul>\n<li>Eğer tümör çok büyük veya karmaşıksa ve 25 dakikada\nbitirilemeyecekse, arter klemplendikten sonra böbreğin etrafı steril buz\nkırıklarıyla (ice slush) kaplanır (genellikle açık cerrahide yapılır).\nBöbrek ısısı 15°C'ye düşürüldüğünde metabolizma yavaşlar ve böbrek\niskemik hasara 2 saate kadar dayanabilir.</li>\n</ul>\n<h3 id=\"1-sıfır-i̇skemi-off-clamp-tekniği\">1. Sıfır İskemi (Off-Clamp\nTekniği):</h3>\n<ul>\n<li>Özellikle robotik cerrahide, arter tamamen klemplenmez, sadece\ntümörü besleyen spesifik küçük dal (tersiyer dal) süper-selektif\nklemplenir veya kanama göze alınarak hiç klemp konmadan (pnömoperitonyum\nbasıncı artırılarak) tümör çıkarılır.</li>\n</ul>\n<h3 id=\"c-tri̇fecta-üçlü-başari-kri̇teri̇\">C. \"TRİFECTA\" (ÜÇLÜ BAŞARI\nKRİTERİ)</h3>\n<p>Lokalize böbrek tümörü cerrahisinde, bir ameliyatın mükemmel\ngeçtiğini söyleyebilmek için cerrahın aynı anda şu 3 hedefi tutturması\ngerekir:</p>\n<ol type=\"1\">\n<li><p>Onkolojik Başarı: Cerrahi sınırların negatif olması (Geride\nkanser kalmamalı).</p></li>\n<li><p>Fonksiyonel Başarı: Sıcak iskemi süresinin (WIT) 25 dakikanın\naltında tutulması (Böbrek ölmemeli).</p></li>\n<li><p>Güvenlik: Majör perioperatif komplikasyon (idrar kaçağı, şiddetli\nkanama) olmaması.</p></li>\n</ol>\n<h3 id=\"d-radi̇kal-nefrektomi̇-ne-zaman-terk-edemeyiz\">D. RADİKAL\nNEFREKTOMİ (Ne Zaman Terk Edemeyiz?)</h3>\n<p>Artık ilk tercihimiz değil ama hala hayat kurtaran en majör\nsilahımız.</p>\n<ul>\n<li>Endikasyon: Tümör çok büyükse (T2, &gt;7 cm), böbreğin tam\nmerkezindeyse (hilusa, ana damarlara oturmuşsa) veya tümör böbrek\nvenine/Vena Kava'ya uzanmışsa (Tümör Trombüsü) parsiyel yapılamaz.</li>\n</ul>\n<p>Radikal Nefrektominin Kutsal Kuralları:</p>\n<ol type=\"1\">\n<li><p>Gerota Fasyası: Böbrek, etrafındaki yağ dokusu ve onu saran ince\nzar (Gerota fasyası) <em>kesinlikle açılmadan</em>, bütün (en-blok)\nhalinde çıkarılır. Çünkü tümör hücreleri mikroskobik olarak bu yağ\ndokusunun içine (pT3a) sızmış olabilir.</p></li>\n<li><p>Damar Bağlama Sırası (Ölümcül Hata): Hilar diseksiyonda DAİMA\nÖNCE RENAL ARTER bağlanır ve kesilir. Eğer önce renal veni bağlarsan,\narterden böbreğe kan pompalanmaya devam eder ama çıkamaz. Böbrek devasa\nbir şekilde şişer (engorgement), basınçtan tümör yırtılır ve batın içine\nkanser hücreleri (seeding) ile birlikte ölümcül bir kanama\npatlar.</p></li>\n</ol>\n<h3 id=\"3-adrenal-bez-çıkarılmalı-mı-i̇psilateral-adrenalektomi\">3.\nAdrenal Bez Çıkarılmalı mı (İpsilateral Adrenalektomi)?</h3>\n<ul>\n<li>Eskiden böbrekle birlikte böbreküstü bezi de standart alınırdı. EAU\n2026'ya göre bu artık rutin olarak kontrendikedir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Sadece:</em> Tümör böbreğin üst polündeyse (üst kısımdaysa) ve\ndirekt adrenal beze invaze olmuşsa veya BT'de adrenal bezde şüpheli\nmetastaz görünümü varsa alınır. Yoksa hastanın o taraftaki böbreküstü\nbezi yerinde bırakılır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Parsiyel nefrektomi yaptık, hastayı servise aldık. 3. gün\ndreninden berrak, sarı renkli ve çok miktarda sıvı gelmeye başladı. Ne\ndüşünürsün ve tanıyı nasıl kesinleştirirsin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ameliyat sırasında böbreğin toplayıcı sistemini (kaliksleri)\nyanlışlıkla açmış ve yeterince iyi dikememiş olabiliriz. Drenden gelen\nsıvı İdrar Kaçağıdır (Ürinoma/Fistül). Kesin tanı için drenden gelen\nsıvıdan Biyokimya'ya örnek gönderir ve Kreatinin seviyesine bakarım.\nEğer drendeki kreatinin, hastanın kan (serum) kreatinininden kat kat\nyüksekse, bu kesinlikle idrardır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"İdrar kaçağını (ürinoma) kesinleştirdin. Hemen hastayı tekrar\nameliyata mı alırsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Çoğu idrar kaçağı konservatif (bekleyerek) iyileşir.\nSondayı içeride tutarak mesane basıncını düşürürüm. Eğer kaçak\nhaftalarca kesilmezse veya hasta ateşe/sepsise girerse, toplayıcı\nsistemin iç basıncını sıfırlamak için endoskopik olarak bir Double-J\n(DJ) Stent takarım. Cerrahi onarım en son çaredir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Robotik Parsiyel Nefrektomide sadece Renal Arteri klempleyip,\nRenal Veni açık bıraktığımızda ne gibi bir dezavantaj yaşarız?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Veni açık bırakmak böbreğin tamamen kansız kalmasını (ve\niskemik hasarı) bir miktar hafifletse de, tümörü keserken çalışma\nalanına venöz sistemden (back-flow) kanamaya neden olur. Görüntü\nbulanıklaşır (özellikle retrograd kanama fazlaysa cerrahın görüşü\nbozulur). Çoğu cerrah kanamasız ve net bir alan için hem arteri hem veni\nklemplemeyi tercih eder.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Böbrek cerrahisi sonrası kanama oldu, hasta şoka giriyor.\nArteriyel mi venöz mü olduğunu drenden veya klinik olarak nasıl\nanlarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Arteriyel kanamalar şiddetli, zonklayıcıdır ve dreni\nsaniyeler içinde parlak kırmızı (açık renk) kanla doldurur, hasta hızla\nhipotansif şoka girer (Cerrahi sütür/klips atması). Venöz kanamalar daha\nyavaş, sızıntı tarzında, koyu renklidir (Parenkim kanaması). Venöz\nkanamalar bekle-gör veya anjiyografik embolizasyon ile durabilir, ancak\nmajör arteriyel patlamalar acil açık eksplorasyon gerektirir.\"</li>\n</ul>\n"}, {"id": "7.8", "t": "Lokal İleri Evre RCC ve Venöz Tümör Trombüsü", "h": "<h3 id=\"a-cerrahi̇-hari̇ta-mayo-kli̇ni̇k-siniflamasi\">A. CERRAHİ HARİTA:\nMAYO KLİNİK SINIFLAMASI</h3>\n<p>Ameliyatın ne kadar kanlı geçeceğini, göğüs kafesini açıp\naçmayacağımızı (sternotomi) ve hastayı kalp-akciğer makinesine bağlayıp\nbağlamayacağımızı belirleyen tek ve en önemli kriter, trombüsün Vena\nKava içindeki seviyesidir. EAU ve AUA kılavuzları cerrahi planlamayı bu\nsınıflamaya göre yapar.</p>\n<ul>\n<li><p>Seviye 0: Tümör trombüsü sadece Böbrek Veni (Renal Ven)\niçindedir. Vena Kava'ya (ana toplardamara) taşmamıştır.</p></li>\n<li><p>Seviye I: Trombüs Vena Kava'ya girmiştir ancak renal venin\ndöküldüğü yerin (ostium) 2 cm'den daha az yukarısındadır.</p></li>\n<li><p>Seviye II: Trombüs Vena Kava içinde 2 cm'den daha yukarı\nçıkmıştır, ancak Karaciğer Venlerinin (Hepatik Venler) altındadır\n(İnfrahepatik).</p></li>\n<li><p>Seviye III: Trombüs Hepatik venlerin seviyesine veya daha\nyukarısına (Retrohepatik/Suprahepatik) ulaşmıştır ancak Diyaframın\naltındadır.</p></li>\n<li><p>Seviye IV: Trombüs diyaframı aşmış ve kalbin içine, Sağ Atriyuma\nkadar girmiştir.</p></li>\n</ul>\n<h3 id=\"b-cerrahi̇-strateji̇ler-ve-multi̇di̇si̇pli̇ner-yaklaşim\">B. CERRAHİ\nSTRATEJİLER VE MULTİDİSİPLİNER YAKLAŞIM</h3>\n<p>Hedef basittir ama uygulaması korkunç derecede zordur: Tümörü\nkoparmadan, akciğere emboli attırmadan damarı açıp (Kavotomi) içini\ntemizlemek ve damarı tekrar dikmek. Bunun için tümörün hem altından hem\nüstünden kan akışını kesmek (Kros-Klemp) gerekir.</p>\n<h3 id=\"1-seviye-i-ve-ii-trombüsler-üroloğun-kendi-sahası\">1. Seviye I\nve II Trombüsler (Üroloğun Kendi Sahası):</h3>\n<ul>\n<li>KVC'ye gerek yoktur. Ürolog, Vena Kava'yı böbrek veninin altından\n(distal) ve üstünden (proksimal) klempler. Karşı tarafın böbrek veni de\nklemplenir. Damar boylamasına açılır, trombüs sağım (milking)\nhareketiyle çıkarılır ve damar dikilir.</li>\n</ul>\n<h3 id=\"2-seviye-iii-trombüsler-karaciğer-cerrahı-sahaya-girer\">2.\nSeviye III Trombüsler (Karaciğer Cerrahı Sahaya Girer):</h3>\n<ul>\n<li>Trombüs karaciğerin arkasındaki damarı doldurduğu için, karaciğeri\ntamamen serbestleştirip yana yatırmak (Piggyback manevrası) gerekir.\nHepatik venlerin kanamasına engel olmak için Pringle Manevrası\n(karaciğerin kan akımını sağlayan portal triadın geçici olarak\nsıkılması) yapılabilir.</li>\n</ul>\n<h3 id=\"3-seviye-iv-trombüsler-kvc-ve-kalp-akciğer-makinesi\">3. Seviye\nIV Trombüsler (KVC ve Kalp-Akciğer Makinesi):</h3>\n<ul>\n<li><p>Göğüs kafesi açılır (Medyan Sternotomi). Kalp\ndurdurulur.</p></li>\n<li><p>Hasta Kardiyopulmoner Bypass (CPB) makinesine bağlanır.</p></li>\n<li><p>Kanama kontrolü sağlanamıyorsa, hastanın vücut ısısı 18-20°C'ye\nkadar soğutulur ve vücuttaki tüm kan akışı tamamen durdurulur: Derin\nHipotermik Sirkülatuar Arrest (DHCA). Cerrahın beynin hasar görmemesi\niçin tümörü kalpten ve kava'dan temizlemek için sadece 30-40 dakikası\nvardır.</p></li>\n</ul>\n<h3 id=\"c-neoadjuvan-tedavi̇-trombüsü-i̇laçla-küçültebilir-miyiz\">C.\nNEOADJUVAN TEDAVİ (Trombüsü İlaçla Küçültebilir Miyiz?)</h3>\n<p>Metastatik olmayan (M0) ama büyük bir tümör trombüsü olan hastada\nameliyattan önce TKI (Pazopanib/Sunitinib) veya İmmünoterapi verip\ntrombüsü Seviye IV'ten Seviye II'ye düşürebilir miyiz?</p>\n<ul>\n<li>EAU 2026 Kılavuzu: Bu yaklaşım (Neoadjuvan) lokal ileri evre RCC'de\nstandart dışıdır ve önerilmez. Çünkü ilaçlar her zaman işe yaramaz, işe\nyarasa bile trombüsü oluşturan hücreleri öldürüp onu kırılgan hale\ngetirebilir (Pulmoner emboli riski!). Ayrıca ilaçların toksisitesi\nhastanın bu devasa ameliyattan sağ çıkma şansını (yara iyileşmesi vb.)\nazaltır. Doğrudan cerrahi esastır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Sağ böbrek tümörü kaynaklı bir trombüs mü, yoksa sol böbrek\nkaynaklı bir trombüs mü cerrahi olarak daha zordur?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Anatomik olarak Sol böbrek kaynaklı trombüs çok daha zordur.\nSağ böbrek veni kısadır ve doğrudan Vena Kava'ya dökülür. Ancak sol\nböbrek veni uzundur, aortanın önünden geçer ve içine sol gonadal ven,\nsol adrenal ven ve lomber venler dökülür. Bu devasa kollateral ağ,\ntümörün buralara da yayılmasına neden olur ve kanama kontrolünü\ninanılmaz zorlaştırır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"MR çektik. Vena Kava'nın içinde kitle var. Bunun gerçekten\nkanser hücresi (Tümör Trombüsü) mi, yoksa sadece kanın pıhtılaşması\n(Bland Trombüs / Kan Pıhtısı) mı olduğunu nasıl anlarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Radyolojik olarak kontrast madde (Gadolinyum) kullanımıyla\nanlarız. Eğer Vena Kava'nın içindeki o kitle kontrast tutuyorsa\n(parlıyorsa), o canlı bir dokudur, yani Tümör Trombüsüdür. Eğer kontrast\ntutmuyorsa ve kapkaranlık kalıyorsa, o sadece tümörün yarattığı yavaş\nakıma bağlı oluşmuş basit bir Bland Trombüstür (Kan pıhtısı).\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Trombüsü Vena Kava'dan çıkarırken damar duvarına yapıştığını\nfark ettin. Sıyıramıyorsun. Ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Tümör sadece lümenin içinde yüzmüyor, damar duvarını da\ninvaze etmiş demektir. Bu durumda trombüsü sıyırmaya çalışmak geride\nkanser bırakmak (pozitif sınır) anlamına gelir. Yapılması gereken işlem\nKavektomi'dir; Vena Kava'nın o invaze olan segmenti tamamen (tüp\nşeklinde veya yama şeklinde) kesilip çıkarılır. Yerine sentetik\n(Gore-Tex) bir damar grefti dikilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Tümör trombüsü cerrahisi sırasında en çok korktuğumuz akut ve\nölümcül intraoperatif komplikasyon nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Trombüsün ucundan bir parçanın kopup (veya cerrahın\nmanevrasıyla kırılıp) sağ kalbe, oradan da akciğer atardamarına gitmesi,\nyani Masif Pulmoner Emboli'dir. Bu durum saniyeler içinde masada arrest\n(kalp durması) ile sonuçlanır. Bu yüzden cerrahide ilk kural her zaman\ntrombüsün <em>en üstünden (kafasından)</em> kontrolü (klempi)\nsağlamaktır.\"</li>\n</ul>\n"}, {"id": "7.9", "t": "Adjuvan Tedaviler ve Takip Algoritmaları", "h": "<h3 id=\"a-hastanin-kaderi̇ni̇-hesaplamak-ri̇sk-skorlamalari\">A. HASTANIN\nKADERİNİ HESAPLAMAK: RİSK SKORLAMALARI</h3>\n<p>Her hastaya pahalı ve yan etkileri olan koruyucu immünoterapiyi\nveremeyiz. Önce hastanın nüks etme (metastaz) riskini matematiksel\nolarak kanıtlamamız gerekir. Bunun için patoloji raporu masaya yatırılır\nve dünyaca kabul görmüş skorlama sistemleri (UISS, SSIGN veya en meşhuru\nLeibovich) kullanılır.</p>\n<p>Leibovich Skoru (Şeffaf Hücreli RCC İçin):</p>\n<p>Patoloğun verdiği şu 5 parametreye puan verilir:</p>\n<ol type=\"1\">\n<li><p>T Evresi: pT1'den pT4'e kadar yükseldikçe puan artar.</p></li>\n<li><p>Lenf Nodu (N Evresi): pN1 (Pozitif lenf nodu) direkt en yüksek\npuanı getirir.</p></li>\n<li><p>Tümör Boyutu: \\&gt; 10 cm olması riski katlar.</p></li>\n<li><p>Nükleer Derece (WHO/ISUP Grade): Grade 3 veya 4 olması.</p></li>\n<li><p>Histolojik Nekroz: Tümörün içinde ölü (nekrotik) doku var mı?\n(Varlığı, tümörün beslenemeyecek kadar hızlı ve vahşi büyüdüğünün\nkanıtıdır).</p></li>\n</ol>\n<p><em>Bu puanlar toplanır ve hasta Düşük (0-2), Orta (3-5) veya Yüksek\n(≥ 6) risk grubuna yerleştirilir. Yüksek riskli bir hastanın 5 yıl\niçinde metastaz yapma ihtimali %60-70'leri bulur.</em></p>\n<h3 id=\"b-oyun-deği̇şti̇ri̇ci̇-adjuvan-i̇mmünoterapi̇-pembrolizumab\">B. OYUN\nDEĞİŞTİRİCİ: ADJUVAN İMMÜNOTERAPİ (Pembrolizumab)</h3>\n<p>Yıllarca böbrek kanserinde koruyucu ilaç olarak Sunitinib, Sorafenib,\nPazopanib (TKI'lar) denendi. Sonuç? Koca bir sıfır. Sağkalımı\nuzatmadıkları gibi, hastaları ağır yan etkilerle zehirlediler.</p>\n<p>Sonra KEYNOTE-564 klinik çalışması geldi ve kılavuzları baştan\nyazdı.</p>\n<ul>\n<li><p>İlaç: Pembrolizumab (Keytruda) - PD-1 inhibitörü.</p></li>\n<li><p>Kime Verilir? (Endikasyon): Radikal veya Parsiyel nefrektomi\nsonrası Yüksek Nüks Riski taşıyan hastalara (pT2 Grade 4/Sarkomatoid,\npT3, pT4, pN+ pozitif lenf nodu olanlar).</p></li>\n<li><p>M1 NED (No Evidence of Disease): Hastanın böbreğinde tümör var,\naynı zamanda akciğerinde de tek bir metastazı var. Cerrah hem böbreği\nalıyor hem de gidip akciğerdeki metastazı tamamen çıkarıyor. Vücutta\nmakroskobik hiç kanser kalmıyor. İşte bu \"M1 NED\" grubudur ve adjuvan\nPembrolizumab'dan <em>en çok fayda gören</em> en yüksek riskli\ngruptur.</p></li>\n<li><p>Süre ve Başarı: Hastaya 1 yıl boyunca (3 haftada bir damardan)\nPembrolizumab verilir. Hastalıksız sağkalımı (DFS) ve Genel Sağkalımı\n(OS) istatistiksel ve klinik olarak anlamlı derecede uzattığı\nkanıtlanmıştır (EAU 2026 Kategori 1 önerisi).</p></li>\n</ul>\n<h3 id=\"c-taki̇p-follow-up-algori̇tmalari\">C. TAKİP (FOLLOW-UP)\nALGORİTMALARI</h3>\n<p>Böbrek kanseri nükslerinin büyük çoğunluğu ilk 3 yıl içinde,\ngenellikle de Akciğer ve Karaciğer'e olur. Geç nüksler (10 yıl sonra\nbile) RCC'nin tipik özelliğidir, bu yüzden takip bir ömür sürer.</p>\n<ul>\n<li>Düşük Risk (Örn: pT1a, Grade 1-2):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Çok agresif görüntülemeye gerek yoktur. Sadece USG veya BT/MR ile\nbatın, ve düz röntgen (Akciğer Grafisi) veya düşük doz Toraks BT ile\ngöğüs kafesi izlenir. 1. yıldan sonra aralıklar açılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Orta ve Yüksek Risk (Örn: pT3, Grade 4):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Akciğer grafisi yetmez, mutlaka Toraks BT çekilmelidir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Batın için kontrastlı Trifazik BT veya MR kullanılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İlk 2-3 yıl boyunca her 3-6 ayda bir, daha sonra yıllık olarak sıkı\nbir şekilde taranır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>PET-CT ve Kemik Sintigrafisi: <em>Rutin takipte yeri YOKTUR.</em>\nSadece hastanın kemik ağrısı varsa (ALP yüksekliği varsa) kemik\nsintigrafisi/MR istenir. RCC genellikle PET'te çok iyi parlamaz (FDG\ntutulumu değişkendir).</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Eskiden kullandığımız o akıllı ilaçlar (TKI - Tirozin Kinaz\nİnhibitörleri) metastatik evrede tümörü küçültürken, koruyucu (adjuvan)\nevrede neden başarısız oldu da İmmünoterapi başarılı oldu?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"TKI'lar sitostatiktir, yani yeni damar oluşumunu (VEGF)\nengeller ve tümörü sadece baskılar. İlacı kestiğiniz an, uyuyan\nmikrometastazlar tekrar büyür. Ancak İmmünoterapi (Pembrolizumab)\nhastanın kendi T-hücrelerini eğitir. İlaç kesilse bile bağışıklık\nsisteminde bir 'Hafıza (Memory)' oluşur ve kanda dolaşan kanser\nhücrelerini yıllar sonra bile tanıyıp yok etmeye devam eder.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Patoloji raporu geldi: pT1b, Grade 2, Kromofob RCC. Leibovich\nskoru hesaplayıp adjuvan Pembrolizumab başlayalım mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. İki nedenden dolayı: Birincisi, bu düşük/orta riskli\nbir tümördür (pT1b). İkincisi ve en önemlisi; KEYNOTE-564 çalışması ve\nFDA/EMA onayları ağırlıklı olarak Şeffaf Hücreli (Clear Cell) RCC\niçindir. Kromofob RCC zaten biyolojik olarak çok uysaldır ve\nimmünoterapiye yanıtı (PD-L1 ekspresyonu) genellikle düşüktür.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Poliklinikte böbrek kanseri takibi yaptığın hastanın kan\ntahlilinde Alkalen Fosfataz (ALP) aniden yükseldi. Tümör nereye nüks\netmiş (sıçramış) olabilir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"ALP yüksekliği, RCC takibinde aksi ispat edilene kadar Kemik\nMetastazı veya Karaciğer Metastazı habercisidir. Hastayı acilen\nKaraciğer için kontrastlı MR'a ve Kemik sintigrafisine (veya tüm vücut\nkemik MR'ına) yönlendirmeliyim.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Parsiyel nefrektomi yaptığın hastanın patoloji raporunda\n'Cerrahi sınırda fokal pozitiflik (Tümör sınırda devam ediyor)' geldi.\nHemen hastayı tekrar ameliyata alıp böbreği tamamen (Radikal) çıkarır\nmısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. EAU kılavuzları bu konuda çok nettir: Parsiyel\nnefrektomide pozitif cerrahi sınır her zaman lokal nüks anlamına gelmez\n(koterin yakma etkisiyle o sınır ölmüş olabilir). Radikal nefrektomiye\nkoşmak yerine, bu hastayı lokal nüks açısından daha sıkı BT/MR\naralıklarıyla yakın takibe (aktif izlem) almak standart\nyaklaşımdır.\"</li>\n</ul>\n"}, {"id": "7.10", "t": "Metastatik RCC ve Sistemik Tedaviler", "h": "<h3 id=\"a-hastanin-kaderi̇ni̇-çi̇zen-pusula-imdc-heng-kri̇terleri̇\">A.\nHASTANIN KADERİNİ ÇİZEN PUSULA: IMDC (Heng) KRİTERLERİ</h3>\n<p>Metastatik bir RCC hastasına ezbere ilaç başlanmaz. Hastanın ne kadar\nyaşayacağını ve hangi ilaca yanıt vereceğini belirleyen, dünyaca kabul\ngörmüş IMDC (International Metastatic RCC Database Consortium) risk\nskorlamasıdır.</p>\n<p>Hoca vizitte bu 6 parametreyi adın gibi saymanı ister:</p>\n<ol type=\"1\">\n<li><p>Zaman: Tanıdan sistemik tedaviye kadar geçen sürenin 1 yıldan\nkısa olması.</p></li>\n<li><p>Performans: Karnofsky Performans Skorunun %80'in altında\nolması.</p></li>\n<li><p>Hemoglobin: Normalin alt sınırından düşük olması\n(Anemi).</p></li>\n<li><p>Kalsiyum: Düzeltilmiş kalsiyumun normalin üst sınırından yüksek\nolması (Hiperkalsemi).</p></li>\n<li><p>Nötrofil: Normalin üst sınırından yüksek olması.</p></li>\n<li><p>Trombosit: Normalin üst sınırından yüksek olması.</p></li>\n</ol>\n<ul>\n<li><p>İyi Risk (Favorable): 0 faktör. (Tümör yavaş büyür, anjiogenez ön\nplandadır).</p></li>\n<li><p>Orta Risk (Intermediate): 1-2 faktör.</p></li>\n<li><p>Kötü Risk (Poor): 3-6 faktör. (Tümör çok vahşidir, bağışıklık\nsistemi çökmüştür).</p></li>\n</ul>\n<h3\nid=\"b-bi̇ri̇nci̇-basamak-1-li̇ne-si̇stemi̇k-tedavi̇ler-paradigma-değişimi\">B.\nBİRİNCİ BASAMAK (1. LİNE) SİSTEMİK TEDAVİLER: Paradigma Değişimi</h3>\n<p>Eskiden herkese tek tip TKI (Sunitinib veya Pazopanib) verilirdi.\nBugün kılavuzlar IMDC risk grubuna göre Kombinasyon Tedavilerini altın\nstandart kabul ediyor:</p>\n<h3 id=\"1-çiftli-i̇mmünoterapi-kombinasyonu-nivolumab--i̇pilimumab\">1.\nÇiftli İmmünoterapi Kombinasyonu (Nivolumab + İpilimumab):</h3>\n<ul>\n<li><p>Mekanizma: İpilimumab (CTLA-4 inhibitörü) lenf düğümlerindeki\nT-hücrelerini aktive eder. Nivolumab (PD-1 inhibitörü) ise tümörün\niçindeki savaş alanında T-hücrelerinin kör olmasını engeller. Düşmana\niki farklı cepheden saldırılır.</p></li>\n<li><p>Kime Verilir? Özellikle Orta ve Kötü risk grubundaki hastalarda\n(EAU Kategori 1). Şeffaf hücreli RCC'de bu kombinasyonla hastaların\nyaklaşık %10'unda tümör tamamen yok olur (Complete Response - CR) ve\nyıllarca geri dönmez!</p></li>\n</ul>\n<h3 id=\"2-i̇mmünoterapi--tki-kombinasyonları-io--tki\">2. İmmünoterapi +\nTKI Kombinasyonları (IO + TKI):</h3>\n<ul>\n<li><p>Örnekler: Pembrolizumab + Lenvatinib, Pembrolizumab + Axitinib,\nNivolumab + Cabozantinib.</p></li>\n<li><p>Mekanizma: TKI tümörün damarlarını boğar ve onu aç bırakır; bu\nsırada İmmünoterapi içeri sızıp hücreleri patlatır.</p></li>\n<li><p>Kime Verilir? Tüm risk gruplarına verilebilir. Özellikle İyi Risk\n(Favorable) grubunda en güçlü seçenektir çünkü bu tümörler çok yoğun\ndamarlanır (VEGF bağımlıdır).</p></li>\n</ul>\n<h3 id=\"c-si̇toredükti̇f-nefrektomi̇-böbreği-almalı-mıyız\">C. SİTOREDÜKTİF\nNEFREKTOMİ (Böbreği Almalı mıyız?)</h3>\n<p>Hasta metastatik (Akciğerde nodüller var). Ürolog olarak o böbreği\n(ana tümörü) almalı mısın, yoksa hastayı direkt onkolojiye mi\ngöndermelisin?</p>\n<ul>\n<li><p>Geçmişin Efsanesi: Sitoredüktif Nefrektomi (CN) hastanın\nsağkalımını uzatır denirdi.</p></li>\n<li><p>CARMENA Çalışması (Deprem Etkisi): Bu çalışma gösterdi ki; Orta\nve Kötü riskli mRCC hastalarında sadece ilaç (Sunitinib) vermek,\n\"Ameliyat + İlaç\" vermekten daha kötü değildi (Non-inferiority). Üstelik\nameliyat edilen kötü riskli hastalar komplikasyonlardan dolayı aylarını\nhastanede kaybediyor ve asıl hayat kurtarıcı ilacı alamıyordu.</p></li>\n<li><p>2026 EAU Kılavuzu Kuralı: Sitoredüktif nefrektomi artık sadece\nİyi Riskli (Favorable) hastalarda, tümör yükünün (hacminin) büyük\nçoğunluğu böbrekteyse ve hasta cerrahiyi rahatça kaldırabilecek\ndurumdaysa önerilir. Kötü riskli hastalara kesinlikle BİSTÜRİ VURULMAZ,\ndoğrudan sistemik tedavi başlanır. <em>(İstisna: Böbrek kanıyorsa veya\ndayanılmaz ağrı yapıyorsa palyatif amaçla alınır).</em></p></li>\n</ul>\n<h3 id=\"d-metastazektomi̇-oligometastatik-hastalık\">D. METASTAZEKTOMİ\n(Oligometastatik Hastalık)</h3>\n<p>Hastanın böbreğini yıllar önce aldın. Şimdi kontrolde akciğerinde\nveya beyninde tek bir tane metastaz (Oligometastaz) çıktı.</p>\n<ul>\n<li>Eğer o metastazı cerrahi olarak tamamen çıkarabilirsen (veya\nStereotaktik Radyoterapi - SBRT ile nokta atışı yakabilirsen), hastayı\nsistemik ilaçların o ağır yan etkilerinden yıllarca koruyabilir, hatta\nkür sağlayabilirsin.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 7 Final Soruları)</p>\n<ol type=\"1\">\n<li>Soru: \"Metastatik RCC hastasının kemiklerinde yaygın (litik)\nmetastazlar var ve sürekli kemik ağrısı çekiyor, kırık riski yüksek. TKI\nve İmmünoterapi dışında bu hastaya ek olarak hangi ilacı\nbaşlamalısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İskeletle ilişkili olayları (SRE - patolojik kırık, omurilik\nbasısı) önlemek için mutlaka kemik koruyucu ajanlar başlanmalıdır.\nOsteoklastları inhibe eden Zoledronik Asit (Bifosfonat) veya RANK-L\ninhibitörü olan Denosumab standart olarak tedaviye eklenmelidir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta Çiftli İmmünoterapi (Nivolumab + İpilimumab) alıyor.\nPolikliniğe şiddetli ve kanlı ishal ile geldi. Ne düşünürsün ve ne\nyaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İmmünoterapinin en ölümcül yan etkilerinden biri olan İmmün\nAracılı Kolit düşünürüm. Bağışıklık sistemi kanseri bırakıp bağırsaklara\nsaldırmaya başlamıştır. İlacı derhal keser, hastayı yatırır ve yüksek\ndoz sistemik kortikosteroid (Metilprednizolon) başlarım. Düzelmezse\nİnfliksimab gibi immünsüpresanlara geçerim.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sitoredüktif nefrektomide böbreği aldıktan sonra hasta\nmucizevi bir şekilde tamamen hastalıksız (NED) hale gelebilir mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Sadece spontan regresyon (kendiliğinden gerileme) denilen\nçok nadir (%1'den az) bir durumda evet. Bazen ana tümörü (böbreği)\nçıkardığınızda, vücudun bağışıklık sistemi üzerindeki o devasa baskı\nkalkar ve akciğerdeki küçük metastazlar kendi kendine kaybolur. Ancak bu\nonkolojik bir kural değil, nadir bir şanstır.\"</li>\n</ul>\n"}]}, {"n": 8, "t": "Testis ve Penis Kanserleri", "s": [{"id": "8.1", "t": "Testis Kanseri Epidemiyolojisi, Risk Faktörleri ve Tanı", "h": "<h3 id=\"a-epi̇demi̇yoloji̇-ve-hi̇stoloji̇k-köken\">A. EPİDEMİYOLOJİ VE\nHİSTOLOJİK KÖKEN</h3>\n<ul>\n<li><p>Zirve Yaş: 15-35 yaş arası genç erkeklerin en sık görülen solid\n(organ) tümörüdür.</p></li>\n<li><p>Hücresel Köken: Testis tümörlerinin %95'i Germ Hücreli\nTümörlerdir (GCT). Yani sperm üreten ana hücrelerin yoldan çıkmasıyla\noluşurlar. Kalan %5'i ise seks kord-stromal (Leydig, Sertoli) veya\nlenfoma gibi diğer tiplerdir.</p></li>\n<li><p>İki Ana Kamp: Germ hücreli tümörler onkolojik davranış, tedavi ve\nmarker profili açısından iki devasa kampa ayrılır:</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Seminom (Saf Seminom): Genellikle 30-40 yaş arası görülür, daha\nyavaş büyür, radyoterapiye ve kemoterapiye aşırı duyarlıdır.</p></li>\n<li><p>Non-Seminomatöz Germ Hücreli Tümör (NSGCT): 15-25 yaş arası pik\nyapar. Embriyonal karsinom, Yolk Sac (Endodermal sinüs), Koryokarsinom\nve Teratom alt tiplerini (veya bunların mikst/karışık hallerini) içerir.\nÇok daha agresiftir, hızla kan ve lenf yoluyla yayılır.</p></li>\n</ol>\n<h3 id=\"b-ri̇sk-faktörleri̇-neden-bu-genç-adam\">B. RİSK FAKTÖRLERİ: Neden\nBu Genç Adam?</h3>\n<p>Testis kanserinde sigara veya obezite gibi klasik suçluların yeri\nyoktur. Sorun embriyolojik gelişimde ve genetikte yatar.</p>\n<h3 id=\"1-kriptorşidizm-i̇nmemiş-testis\">1. Kriptorşidizm (İnmemiş\nTestis):</h3>\n<ul>\n<li>En güçlü ve en çok sorgulanan risk faktörüdür (Riski 4-6 kat\nartırır). Testisin karın içinde veya inguinal kanalda kalması, o yüksek\nısıya maruziyet, germ hücrelerinin DNA'sını bozar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kritik Bilgi:</em> Çocukluk çağında (ideali 1 yaşından önce)\nyapılan Orşiopeksi (testisi torbaya indirme) ameliyatı kanser riskini\ntamamen SIFIRLAMAZ, ancak riski azaltır ve testisin fizik muayene ile\nelle kontrol edilebilmesini (erken teşhisi) sağlar. Ayrıca inmemiş\ntestis tek taraflı olsa bile, karşı (sağlam inmiş) testiste de kanser\nriski normal popülasyona göre artmıştır (genetik zemin).</li>\n</ul>\n<ol type=\"1\">\n<li>Aile Öyküsü: Babasında testis kanseri olanın riski 4 kat, erkek\nkardeşinde olanın riski 8-10 kat artar.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Karşı Testiste Kanser Öyküsü: Bir testisini kanserden kaybeden\nhastanın, diğer testisinde kanser çıkma ihtimali (metakron) yaklaşık\n%1-2'dir (Normal popülasyonun 500 katı).</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>GCNIS (Germ Cell Neoplasia in Situ): Testis kanserinin öncü\n(prekürsör) lezyonudur. Tübüllerin içindeki bu bozuk hücreler, 5 yıl\niçinde %50 ihtimalle invaziv kansere dönüşür.</li>\n</ol>\n<h3 id=\"c-kli̇ni̇k-prezantasyon-ve-tani-siyah-beyaz-gerçekler\">C. KLİNİK\nPREZANTASYON VE TANI (Siyah-Beyaz Gerçekler)</h3>\n<ul>\n<li><p>Klasik Semptom: Skrotumda ağrısız, sert, ele gelen kitle. Hasta\ngenellikle duş alırken tesadüfen fark eder. (Ağrı olguların sadece\n%10-20'sinde, tümörün içine kanama veya infarktüs olduğunda\ngörülür).</p></li>\n<li><p>Ürolojik Aksiyom: Fizik muayenede testisin <em>kendi dokusu\niçinde (intratestiküler)</em> saptanan her solid kitle, aksi ispat\nedilene kadar KANSERDİR. Epididim kistleri veya hidrosel gibi kistik\nekstra-testiküler yapılar iyi huyludur, ancak testisin içi asla yalan\nsöylemez.</p></li>\n<li><p>Altın Standart Görüntüleme: Skrotal Doppler Ultrasonografi\n(USG)</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Muayeneden hemen sonra ilk istenecek tetkiktir. Sensitivitesi %100'e\nyakındır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kanser, USG'de genellikle çevre dokudan daha koyu (hipoekoik),\nsınırları düzensiz ve kanlanması artmış (hipervasküler) bir solid kitle\nolarak görünür. Eğer kistik alanlar veya kireçlenmeler (kalsifikasyon)\nvarsa, NSGCT (özellikle Teratom) şüphesi artar.</li>\n</ul>\n<h3 id=\"d-tümör-markerlari-biyokimyasal-parmak-i̇zleri\">D. TÜMÖR\nMARKERLARI (Biyokimyasal Parmak İzleri)</h3>\n<p>Ameliyathaneye girmeden önce MUTLAKA kan alıp bakman gereken üç\nbiyokimyasal silahımız vardır. Bunların yarı ömürlerini bilmek onkolojik\ntakibin kalbidir.</p>\n<h3 id=\"1-α-fetoprotein-afp\">1. α-Fetoprotein (AFP):</h3>\n<ul>\n<li>Yarı ömrü: 5-7 gün.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kaynağı: Yolk Sac (Sarı kesesi) tümörlerinden salgılanır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Altın Kural:</em> Saf Seminom ve Saf Koryokarsinom ASLA AFP\nsalgılamaz. Eğer hastanın patolojisi \"Saf Seminom\" geldiyse ama kanında\nAFP yüksekse, o patoloji yanlıştır veya tümörün içinde gizli bir NSGCT\n(Yolk sac/Embriyonal) odağı vardır. Hasta anında \"NSGCT\" gibi tedavi\nedilir.</li>\n</ul>\n<h3 id=\"1-β-human-koryonik-gonadotropin-β-hcg\">1. β-Human Koryonik\nGonadotropin (β-hCG):</h3>\n<ul>\n<li>Yarı ömrü: 24-36 saat.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kaynağı: Sinsityotrofoblastlardan salgılanır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Koryokarsinomların %100'ünde, Embriyonal tümörlerin %40'ında ve\nSeminomların yaklaşık %15-20'sinde yüksek bulunabilir. Çok yüksek\nseviyeleri hipertiroidi veya jinekomasti yapabilir.</li>\n</ul>\n<h3 id=\"1-laktat-dehidrogenaz-ldh\">1. Laktat Dehidrogenaz (LDH):</h3>\n<ul>\n<li>Tümöre spesifik değildir. Tümörün boyutunu, hücre yıkımını (nekroz)\nve metastatik yükü (burden) gösteren genel bir proliferasyon\nmarkerıdır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe genç bir hasta geldi, inmemiş testis öyküsü yok\nama Skrotal USG'sinde 'Testiküler Mikrolitiyazis' (yaygın mikro\nkireçlenmeler) saptandı. Kanser olur mu diye korkuyor. Biyopsi yapar\nmısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU 2026 kılavuzlarına göre tek başına (izole)\nmikrolitiyazis bir kanser riski oluşturmaz ve biyopsi/tarama endikasyonu\nyoktur. Ancak mikrolitiyazise ek olarak hastada inmemiş testis öyküsü,\nkarşı testiste kanser öyküsü veya testiste atrofi (hacim &lt;12 ml) gibi\nek bir risk faktörü varsa, o zaman GCNIS şüphesiyle testis biyopsisi\ndüşünülmelidir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"USG'de testisin içinde devasa, sert, hipoekoik bir kitle\ngördün. Kesin kanser diyorsun. Teşhisi patolojik olarak kanıtlamak için\niğne biyopsisi yapar mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Asla! Testis tümörlerine İĞNE BİYOPSİSİ YAPILMAZ (Mutlak\nKontrendikasyon). İğne, testisi saran o sağlam kılıfları (Tunika\nAlbuginea ve Vajinalis) deler ve normalde sadece lenf yoluyla\nretroperitona yayılan kanser hücrelerinin, skrotum cildine ve inguinal\nlenf nodlarına ekilmesine (Tract seeding / Yön değiştirmiş metastaz)\nneden olur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe öksürük ve sırt ağrısıyla gelen genç hastanın\nBatın BT'sinde devasa bir retroperitoneal kitle (lenf nodu paketi)\nsaptandı. Ancak hastanın testisleri fiziki muayenede tamamen normal. Bu\ntestis kanseri olabilir mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Evet, olabilir. Buna 'Burned-out' (Yanıp\nsönmüş/Kendiliğinden gerilemiş) Testis Tümörü denir. Primer testis\ntümörü çok hızlı büyüyüp metastaz yaptıktan sonra, kendi kanlanmasını\naşarak iskemik nekroza uğrar ve testisin içinde sadece küçük bir\nskar/kalsifikasyon bırakarak yok olur. Tanı için testis USG'si yapılır\nve o kalsifikasyon odağı aranır; markerlara (AFP/β-hCG) bakılır.\"</li>\n</ul>\n"}, {"id": "8.2", "t": "Radikal İnguinal Orşiyektomi ve Evreleme (TNM / S-EVRESİ)", "h": "<h3 id=\"a-neden-kasiktan-anatomik-ve-onkolojik-prensip\">A. NEDEN\nKASIKTAN? (Anatomik ve Onkolojik Prensip)</h3>\n<p>Testis torbanın (skrotum) içindedir. Mantıken en kısa yol skrotumu\nkesip testisi çıkarmaktır. Ancak bir ürolog bunu ASLA yapmaz.</p>\n<ul>\n<li><p>Lenfatik Drenaj Farkı: Testisin lenfatik drenajı, embriyolojik\nkökeni nedeniyle ta yukarıya, retroperitona (Para-aortik ve\nİnterkavokaval lenf nodlarına) gider. Ancak skrotum derisinin lenfatik\ndrenajı kasıktaki Yüzeyel İnguinal Lenf Nodlarına gider.</p></li>\n<li><p>Skrotal İhlal (Scrotal Violation) Kabusu: Eğer testisi çıkarmak\niçin skrotumu kesersen, testisin lenfatik akışını bozup skrotumun\nlenfatiklerine bağlamış olursun (Yön değiştirmiş metastaz). Tümör\nhücreleri artık retroperiton yerine kasık lenf bezlerine yayılır. Bu\ncerrahi hata, hastanın evresini değiştirir ve ileride kasık bölgesine\ngereksiz radyoterapi veya morbiditesi yüksek inguinal lenf nodu\ndisseksiyonu yapılmasına neden olur.</p></li>\n</ul>\n<h3 id=\"b-cerrahi̇-tekni̇k-altin-kurallar\">B. CERRAHİ TEKNİK: ALTIN\nKURALLAR</h3>\n<p>Bu ameliyatın adı \"Basit Orşiyektomi\" değil, **\"Radikal İnguinal\nOrşiyektomi\"**dir.</p>\n<ol type=\"1\">\n<li><p>Kesi (İnsizyon): Kasıktan (İnguinal kanal üzerinden) yapılır.\nEksternal oblik aponörozu açılır ve spermatik kord (kordon)\nbulunur.</p></li>\n<li><p>Önce Klemp, Sonra Temas (Non-Touch Technique): Cerrah elini\ntestise sürmeden ve testisi skrotumdan doğurtmadan önce, spermatik kordu\ninternal inguinal ring (iç halka) seviyesinde atravmatik bir klemple\n(veya turnikeyle) sıkar.</p></li>\n</ol>\n<ul>\n<li><em>Neden?</em> Testisi tuttuğunda, sıktığında veya çekiştirdiğinde\niçindeki kanser hücreleri ve tümör trombüsleri venöz sisteme\npompalanmasın diye.</li>\n</ul>\n<ol type=\"1\">\n<li>Doğurtma ve İnceleme: Kordon klemplendikten sonra testis kasıktaki\nkesiden dışarı doğurtulur. Gözle ve elle muayene edilir. Eğer şüphe\nvarsa, ameliyat masasında steril ultrason yapılabilir. (İğne biyopsisi\nYASAKTIR).</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Yüksek Ligasyon (High Ligation): Kanserden emin olunduğunda,\nspermatik kord iç inguinal halka seviyesinde (olabildiğince yüksekten)\nkalıcı olarak bağlanır ve kesilir. Testis ve kordon blok halinde\nvücuttan ayrılır.</li>\n</ol>\n<h3 id=\"c-patoloji̇k-evreleme-pt-evresinin-i̇ncelikleri\">C. PATOLOJİK\nEVRELEME (pT Evresinin İncelikleri)</h3>\n<p>Testisi patoloğa gönderdin. Patolog sadece tümörün tipini (Seminom vs\nNSGCT) söylemekle kalmaz, T evresini de belirler. EAU kılavuzlarında T\nevresi sağkalım hesaplamaları için çok kritiktir:</p>\n<ul>\n<li><p>pT1: Tümör sadece testisin içindedir (Rete testis'i tutabilir).\nLenfovasküler İnvazyon (LVI) YOKTUR.</p></li>\n<li><p>pT2: Tümör testisin içindedir ancak Lenfovasküler İnvazyon (LVI)\nVARDIR. VEYA tümör testisi saran o kalın kılıfı (Tunika Albuginea) aşıp,\ndışarıdaki zarın yaprağına (Tunika Vajinalis) invaze olmuştur.\n<em>(Asistan Notu: LVI varlığı, NSGCT hastalarında gizli metastaz\nriskini %50'lere çıkaran en önemli prognostik faktördür).</em></p></li>\n<li><p>pT3: Tümör spermatik korda invaze olmuştur.</p></li>\n<li><p>pT4: Tümör skrotum derisine invaze olmuştur (Genellikle hasta geç\nkalmıştır veya daha önce yanlışlıkla skrotal biyopsi/skrotal cerrahi\nyapılmıştır).</p></li>\n</ul>\n<h3 id=\"d-onkoloji̇ni̇n-matemati̇ği̇-s-evresi̇-ve-yari-ömür-half-li̇fe\">D.\nONKOLOJİNİN MATEMATİĞİ: \"S\" EVRESİ VE YARI ÖMÜR (HALF-LİFE)</h3>\n<p>Testis kanseri, dünyada TNM sistemine \"S\" (Serum Tümör Belirteçleri)\nharfinin eklendiği tek kanserdir (TNM-S).</p>\n<p>Ameliyattan önce AFP, β-hCG ve LDH aldın. Ameliyatı yaptın, tümörü\nvücuttan çıkardın. <em>Peki hastanın evresi ne zaman\nbelirlenir?</em></p>\n<p>Kural: Evreleme ameliyattan ÖNCEKİ değil, ameliyattan SONRAKİ\n(markerların yarı ömrüne göre düşmesi beklendikten sonraki) marker\nseviyelerine göre yapılır.</p>\n<ul>\n<li><p>AFP Yarı Ömrü: 5 - 7 gün.</p></li>\n<li><p>β-hCG Yarı Ömrü: 24 - 36 saat.</p></li>\n</ul>\n<p>Senaryo (Marker Decay / Yıkım Matematiği):</p>\n<p>Ameliyat öncesi hastanın AFP'si 1000 ng/mL. Ameliyattan 7 gün sonra\nhastayı polikliniğe çağırdın. AFP yarı ömrü 7 gün olduğuna göre, kan\ndeğerinin 500'e düşmesini beklersin. 14. günde 250'ye, 21. günde 125'e\ninmelidir.</p>\n<ul>\n<li><p>Eğer markerlar bu matematiksel yarı ömre (half-life decay) uygun\nolarak düşüyorsa → S0 Evresi (Vücutta kanser kalmamış\ndemektir).</p></li>\n<li><p>Eğer markerlar düşmüyor, plato çiziyor veya YÜKSELİYORSA → BT'de\n(Tomografide) hiçbir şey görünmese bile, bu hastada mikroskobik metastaz\nvardır ve hasta S1, S2 veya S3 evresindedir. (Direkt kemoterapiye\ngider).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Acile skrotal ağrı ile bir hasta geldi. Yanlışlıkla\nepididimo-orşit (enfeksiyon) veya torsiyon sanıp skrotumdan (torbadan)\nkestin ve testisi açtın. Karşına tümör çıktı. Cerrahi ihlal (Scrotal\nViolation) yaptın. Ne yapacaksın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Paniğe kapılmadan kordonu kasıktan (inguinal) açarak\nyüksekten bağlar ve testisi inguinal kesiden çıkarırım. Skrotal kesiyi\nkapatırım. Ameliyat sonrası dönemde EAU kılavuzlarına göre skrotumun o\nyarısının (Hemiskrotektomi) genişçe çıkarılması düşünülebilir, ancak\ngüncel pratikte bu pek önerilmez. Hasta sistemik tedavi veya radyoterapi\nalacaksa, alan skrotumu ve inguinal lenf nodlarını kapsayacak şekilde\ngenişletilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Radikal Orşiyektomi sırasında sağlam olan KARŞI testise\nbiyopsi yapma endikasyonları nelerdir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU 2026'ya göre karşı testise rutin biyopsi önerilmez.\nSadece Yüksek Riskli hastalarda GCNIS (Karsinoma in situ) varlığını\ndışlamak için önerilir. Yüksek risk kriterleri: Karşı testisin hacminin\n&lt; 12 ml (atrofik) olması, hastanın yaşının &lt; 40 olması ve\nkriptorşidizm (inmemiş testis) öyküsünün olmasıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın tek testisi var ve onda da 1.5 cm tümör çıktı.\nRadikal orşiyektomi yaparsan hasta kısır kalacak ve ömür boyu\ntestosteron replasmanı alacak. Bu hastaya 'Testis Koruyucu Cerrahi'\n(Parsiyel Orşiyektomi) yapabilir miyiz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU kılavuzları çok katı şartlar altında buna izin verir.\nMutlak endikasyonlar: Soliter (tek) testis veya senkron bilateral (iki\ntaraflı) tümör olması. Tümörün boyutu &lt; 2 cm olmalı ve pre-op\ntestosteron seviyesi normal olmalıdır. Ancak çıkarılan parça dışında\nkalan sağlıklı testis dokusunda %80-90 oranında GCNIS (öncü kanser\nhücresi) bulunacağı için, ameliyattan sonra kalan testise mutlaka\nAdjuvan Radyoterapi (18-20 Gy) verilmelidir (Bu radyoterapi sperm\nüretimini bitirir, ancak Leydig hücrelerini koruyarak testosteron\nüretiminin devam etmesini sağlar).\"</li>\n</ul>\n"}, {"id": "8.3", "t": "Evre 1 Seminom ve Evre 1 NSGCT Yönetimi", "h": "<h3 id=\"a-evre-1-semi̇nom-uysal-dev\">A. EVRE 1 SEMİNOM (Uysal Dev)</h3>\n<p>Seminomlar biyolojik olarak yavaş büyüyen, metastaz yapmakta tembel\ndavranan ancak radyasyona (ışına) ve kemoterapiye karşı inanılmaz\nderecede duyarlı (kırılgan) tümörlerdir.</p>\n<ul>\n<li><p>Gizli Metastaz Riski (Nüks Şansı): Evre 1 bir seminomun\nretroperitonda mikrometastaz barındırma (yani sadece izlersek nüks etme)\nihtimali ortalama %15-20'dir.</p></li>\n<li><p>Risk Faktörleri (EAU 2026): İki patolojik bulgu bu riski %30'lara\nçıkarır:</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Tümör boyutunun &gt; 4 cm olması.</p></li>\n<li><p>Rete Testis İnvazyonu olması.</p></li>\n</ol>\n<p>Yönetim Stratejileri (EAU Kılavuzlarına Göre):</p>\n<ol type=\"1\">\n<li><p>Aktif İzlem (Surveillance - Altın Standart):<br />\nHasta uyumluysa (kontrollere düzenli gelecekse), risk faktörü olsun veya\nolmasın ilk seçenek sadece takip etmektir. Nüks eden %15-20'lik grubu\nbekleriz, nüks ettiklerinde 3 kür BEP kemoterapisi veya radyoterapi ile\n%99 oranında tam kür sağlarız. Böylece hastaların %80'ini gereksiz ilaç\nveya ışın toksisitesinden kurtarmış oluruz.</p></li>\n<li><p>Adjuvan Kemoterapi (Tek Doz Karboplatin):<br />\nHasta \"Ben nüks korkusuyla yaşayamam\" diyorsa veya takiplere\ngelemeyecekse (Örn: denizci, kırsalda yaşıyor), 1 kür (Tek doz)\nKarboplatin (AUC 7 dozunda) verilir. Bu tek dozluk ilaç nüks riskini\n%5'in altına indirir.</p></li>\n<li><p>Adjuvan Radyoterapi (Tarihe Karışan Efsane):<br />\nSeminomlar radyasyona o kadar duyarlıdır ki, retroperitona verilecek 20\nGy'lik düşük doz (Dog-leg veya Para-aortik strip) bir ışın, tüm\nmikrometastazları yok eder. Ancak; EAU 2026 bu yöntemi ilk seçenek\nolmaktan şiddetle çıkarmıştır. Çünkü genç yaşta verilen bu ışın, 15-20\nyıl sonra hastada İkincil Kanserlere (Mide, Pankreas, Lösemi) neden\nolmaktadır. Genç bir adamı testis kanserinden kurtarıp 50 yaşında mide\nkanserinden kaybetmemek için radyoterapiden olabildiğince\nkaçınılır.</p></li>\n</ol>\n<h3 id=\"b-evre-1-nsgct-vahşi-canavar\">B. EVRE 1 NSGCT (Vahşi\nCanavar)</h3>\n<p>Non-Seminomatöz Germ Hücreli Tümörler (Embriyonal, Yolk Sac,\nKoryokarsinom) hızlı bölünür, radyoterapiye dirençlidir ve kan/lenf\nyoluyla çok agresif yayılır.</p>\n<ul>\n<li><p>Gizli Metastaz Riski: Tümörün testiste görünmesine rağmen\nretroperitona çoktan saçılmış olma ihtimali ortalama %30'dur.</p></li>\n<li><p>En Güçlü Risk Faktörü (Vizitin Kalbi): Patoloji raporunda\nLenfovasküler İnvazyon (LVİ) varlığıdır (pT2).</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>LVİ Yoksa (pT1): Nüks riski %15.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>LVİ Varsa (pT2): Nüks riski %50'dir! (Yazı-tura atmakla\neşdeğerdir).</li>\n</ul>\n<p>Yönetim Stratejileri (EAU Kılavuzlarına Göre):</p>\n<ol type=\"1\">\n<li><p>Aktif İzlem: Sadece LVİ negatif (pT1) olan ve kontrollere\nkesinlikle gelebilecek, uyumlu hastalarda ilk seçenektir.</p></li>\n<li><p>Adjuvan Kemoterapi (1 Kür BEP):<br />\nÖzellikle LVİ pozitif (pT2) olan yüksek riskli hastalarda en çok\nönerilen seçenektir. BEP (Bleomisin + Etoposid + Cisplatin) protokolünün\nsadece 1 kürü, %50 olan nüks riskini %2-3'lere düşürür.</p></li>\n<li><p>RPLND (Retroperitoneal Lenf Nodu Disseksiyonu - Sinir\nKoruyucu):<br />\nKemoterapi (Bleomisin) alamayacak akciğer kapasitesi düşük hastalarda\nveya patolojisinde saf Teratom olan (Teratom kemoterapiye dirençlidir,\nsadece cerrahiyle tedavi edilir) hastalarda profilaktik olarak yapılır.\nHem tanı (evreleme) hem de tedavi sağlar. Sempatik sinirler korunarak\nretrograd ejakülasyon önlenir.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Evre 1 NSGCT hastası, patolojide LVI pozitif (%50 nüks riski\nvar). Hasta adjuvan kemoterapi almayı reddetti ve 'Beni sadece izleyin'\ndedi. Kabul eder misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Evet, EAU kılavuzları hastanın açık onayı ve\nbilgilendirilmesi şartıyla LVI pozitif hastada bile aktif izlemi bir\nseçenek olarak sunar. Çünkü bu hasta izlemde nüks etse bile (Evre 2'ye\ngeçse bile), verilecek 3 veya 4 kür BEP kemoterapisi ile hastaya yine\n%98-99 oranında tam şifa (Kür) sağlanır. İzlemde nüks etmek hastanın\nölüm fermanı demek değildir, sadece alacağı kemoterapi kür sayısını (1\nyerine 3) artırır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Evre 1 Seminom'da tek doz Karboplatin veriyoruz. Dozunu (AUC\n7) hesaplarken hastanın sadece boy ve kilosuna mı bakarız?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Karboplatin böbreklerden atıldığı için dozu Calvert\nFormülü ile hesaplanır. Bu formülde hastanın hedeflenen Eğri Altında\nKalan Alan (AUC - Area Under Curve) değeri ile Glomerüler Filtrasyon\nHızı (GFR) kullanılır. GFR'si düşük bir hastada yüksek doz verilirse\nölümcül kemik iliği baskılanması (Trombositopeni) gelişir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Patoloji raporunda 'Mikst Germ Hücreli Tümör: %60 Seminom,\n%40 Yolk Sac' geldi. Bu hastayı Seminom protokolüne göre mi, NSGCT\nprotokolüne göre mi tedavi edersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle NSGCT (Non-Seminom) protokolüne göre tedavi\nederim. Tümörün içinde %1 bile olsa NSGCT komponenti varsa, tümör\nbiyolojik olarak o agresif bileşenin karakterini alır ve NSGCT gibi\nyönetilir. Saf Seminom diyebilmek için %100 Seminom olmalı ve AFP\ntamamen negatif olmalıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"BEP kemoterapisindeki 'Bleomisin'in üroloğu ve anesteziyi en\nçok korkutan spesifik toksisitesi nedir?\"</li>\n</ol>\n<p>Cevap: \"Pulmoner Toksisite (İnterstisyel Pnömoni ve Akciğer\nFibrozisi). Bleomisin alan hastalar ileride başka bir ameliyat (örn:\nRPLND) olacaksa, anestezi doktoru uyarılmalıdır. Çünkü ameliyatta\nhastaya %100 Oksijen (FiO2) verilirse, bu oksijen akciğerlerde serbest\noksijen radikallerine dönüşüp ani ve ölümcül solunum yetmezliğine (ARDS)\nneden olur. Bleomisin öyküsü olanlarda anestezi sırasındaki oksijen\nkonsantrasyonu olabildiğince düşük (&lt;%30) tutulmalıdır.\"</p>\n"}, {"id": "8.4", "t": "İleri Evre Metastatik Hastalık ve RPLND Cerrahisi", "h": "<h3 id=\"a-i̇lk-vuruş-si̇stemi̇k-kemoterapi̇-ve-igcccg-ri̇sk-gruplari\">A. İLK\nVURUŞ: SİSTEMİK KEMOTERAPİ VE IGCCCG RİSK GRUPLARI</h3>\n<p>Metastatik bir testis kanseri hastasına direkt cerrahi (RPLND)\nYAPILMAZ. Tümör lenflere sıçramışsa, ilk ve en güçlü silahımız her zaman\nSistemik Kemoterapi (BEP Protokolü)'dir. Hastaya kaç kür verileceğini\ndünyaca kabul görmüş IGCCCG (International Germ Cell Cancer\nCollaborative Group) risk sınıflaması belirler. Bu sınıflama tümörün\ntipine, metastazın yerine (akciğer vs. beyin/karaciğer) ve tümör\nmarkerlarının (AFP, hCG, LDH) yüksekliğine bakar:</p>\n<ol type=\"1\">\n<li><p>İyi Risk (Favorable): Sadece akciğer veya lenf nodu metastazı\nvardır, markerlar çok yüksek değildir. Tedavi: 3 kür BEP (Bleomisin,\nEtoposid, Cisplatin) veya Bleomisin kontrendike ise 4 kür EP verilir.\nŞifa oranı &gt;%90'dır.</p></li>\n<li><p>Orta Risk (Intermediate): Markerlar daha yüksektir. Tedavi: 4 kür\nBEP verilir.</p></li>\n<li><p>Kötü Risk (Poor): Akciğer DIŞI organ metastazı (Karaciğer, Kemik,\nBeyin) olanlar veya markerları tavan yapmış (Örn: AFP &gt;10.000)\nhastalardır. <em>Kritik Not: Seminomların \"Kötü Risk\" grubu YOKTUR, en\nfazla Orta Risk olurlar.</em> Tedavi: 4 kür BEP (veya VIP). Şifa oranı\n%50-60 bandındadır.</p></li>\n</ol>\n<h3 id=\"b-kemoterapi̇-sonrasi-rezi̇dü-ki̇tle-yöneti̇mi̇-vizitin-kalbi\">B.\nKEMOTERAPİ SONRASI REZİDÜ KİTLE YÖNETİMİ (Vizitin Kalbi)</h3>\n<p>3 veya 4 kür BEP bitti. Markerlar tamamen normale döndü (S0). Ancak\nBT'yi çektiğinde retroperitonda hala bir kitle (Rezidü) duruyor. İşte\nşimdi Seminom ile Non-Seminom (NSGCT) arasındaki o devasa uçurum\nbaşlar.</p>\n<h3 id=\"1-seminomda-rezidü-kitle-dokunma-sadece-bak\">1. Seminomda Rezidü\nKitle (Dokunma, Sadece Bak):</h3>\n<ul>\n<li><p>Seminom kemoterapi ile eridiğinde geriye taş gibi sert, damarlara\nçimento gibi yapışmış desmoplastik bir skar (nedbe) dokusu bırakır. Bunu\ncerrahi olarak çıkarmak bir kabustur (Sıklıkla Vena Kava/Aort\nyaralanmasına veya nefrektomiye gider).</p></li>\n<li><p>EAU Kuralı: Kitle &lt; 3 cm ise kesinlikle dokunulmaz, sadece\nizlenir. Kitle &gt; 3 cm ise, içinde canlı kanser kalıp kalmadığını\nanlamak için kemoterapi bitiminden en az 6-8 hafta sonra PET-BT çekilir.\nPET negatifse izlenir, pozitifse kurtarma (salvage) cerrahisi veya\nradyoterapi düşünülür.</p></li>\n</ul>\n<h3 id=\"2-non-seminomda-nsgct-rezidü-kitle-hemen-kes-ve-al\">2.\nNon-Seminomda (NSGCT) Rezidü Kitle (Hemen Kes ve Al):</h3>\n<ul>\n<li><p>NSGCT'de kemoterapi sonrası geriye kalan kitlenin içinde ne\nolduğunu ne BT, ne MR, ne de PET-BT ayırt edebilir. (NSGCT'de PET'in\nyeri YOKTUR).</p></li>\n<li><p>O kitlenin patolojisi üç şeyden biri çıkacaktır:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>%40-50 ihtimalle Nekroz/Fibrozis (Ölü doku).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>%40 ihtimalle Teratom (İyi huylu gibi görünse de büyüyüp etrafa\nzarar veren, kemoterapiye %100 dirençli doku).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>%10-15 ihtimalle Canlı Kanser (Viable tumor).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>EAU Kuralı: Markerlar negatifken (S0) BT'de kitle &gt; 1 cm ise, o\nkitleyi (Teratom veya canlı kanser olma ihtimaline karşı) cerrahi olarak\nsöküp almak ZORUNDASINIZ. Buna Post-Kemoterapi RPLND (PC-RPLND)\ndenir.</li>\n</ul>\n<h3 id=\"c-rplnd-anatomi̇si̇-ve-si̇ni̇r-koruyucu-cerrahi̇\">C. RPLND ANATOMİSİ\nVE SİNİR KORUYUCU CERRAHİ</h3>\n<p>Retroperitoneal Lenf Nodu Disseksiyonu (RPLND), böbrek damarlarından\nbaşlayıp pelvisin derinliklerine kadar inen, aort ve vena kava'nın\netrafındaki (ve aralarındaki) tüm lenfatik/yağlı dokunun sıyrılıp\n\"iskeletleştirilmesi\" işlemidir.</p>\n<p>Cerrahi Sınırlar (Şablonlar):</p>\n<ul>\n<li><p>Üst Sınır: Her iki renal ven (Böbrek toplardamarları).</p></li>\n<li><p>Alt Sınır: Aortun çatallandığı yerin aşağısı (Ana İlyak\ndamarların üreterle kesiştiği yer).</p></li>\n<li><p>Yan Sınırlar: Her iki üreter.</p></li>\n<li><p>Sağ ve Sol Farkı: Sağ testis tümörü Vena Kava etrafına\n(İnterkavokaval ve Prekaval), sol testis tümörü ise Aort etrafına\n(Para-aortik ve Pre-aortik) metastaz yapar. Erken evrede şablon buna\ngöre daraltılabilir (Modifiye RPLND), ancak ileri evrede devasa kitleler\nvarsa Bilateral (Çift Taraflı) tam disseksiyon şarttır.</p></li>\n</ul>\n<p>Kabus Komplikasyon: Retrograd Ejakülasyon (Kuru Boşalma)</p>\n<p>Bu gencecik adamları kanserden kurtarırken en çok dikkat etmemiz\ngereken şey sempatik sinirlerdir (T10-L2 seviyesi). Bu sinirler Aort ve\nVena Kava'nın üzerinden geçip pelvise inerek \"Emisyon\" (Spermin\nprostatik üretraya atılması) refleksini sağlar.</p>\n<p>Eğer lenf bezlerini temizlerken bu sinirleri (Postgangliyonik\nsempatik lifler / Hipogastrik pleksus) kesersen, hasta ömür boyu orgazm\nolur ama dışarı sperm çıkmaz (Sperm mesaneye kaçar - Retrograd\nejakülasyon) ve doğal yolla baba olamaz. Bu yüzden modern RPLND'de tümör\ndamarlara yapışık değilse \"Sinir Koruyucu (Nerve-Sparing)\" teknik\nuygulanır.</p>\n<h3 id=\"d-büyüyen-teratom-sendromu-growing-teratoma-syndrome\">D. BÜYÜYEN\nTERATOM SENDROMU (Growing Teratoma Syndrome)</h3>\n<p>Tıbbın en garip paradokslarından biridir.</p>\n<ul>\n<li><p>Hasta kemoterapi alırken veya bittikten hemen sonra Tümör\nMarkerları (AFP, hCG) hızla düşer ve SIFIRLANIR.</p></li>\n<li><p>Ancak çektiğin BT'lerde kitle hızla büyümeye devam eder!</p></li>\n<li><p>Nedeni: Kemoterapi, kitlenin içindeki agresif hücreleri\n(Embriyonal, Yolk Sac) öldürmüş ve markerları sıfırlamıştır. Ancak\ngeriye kalan o dirençli \"Teratom\" hücreleri kendi başına çılgınca\nbüyümeye başlamıştır. Teratomlar kıkırdak, saç, diş bile üretebilen\nkaotik yapılardır. Kemoterapi ve Radyoterapi Teratoma HİÇBİR ŞEY\nYAPAMAZ.</p></li>\n<li><p>Tedavi: Tek çare, kitle ne kadar büyük olursa olsun, etraftaki\norganları (böbrek, bağırsak, damar) feda etme pahasına acil ve tam RPLND\n(Cerrahi eksizyon) yapmaktır. Çıkarırsan hasta kurtulur, çıkaramazsan\nkitle damarları boğarak hastayı öldürür.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"NSGCT hastasına 3 kür BEP verdin. Markerlar düştü (S0). BT'de\nVena Kava'nın arkasında 2 cm kitle kaldı. PC-RPLND kararı aldın.\nAmeliyatta lenf bezlerini çıkarırken sadece o 2 cm'lik şişmiş kitleyi mi\n(Nodülektomi) çıkarırsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Asla! Sadece görünen nodülü çıkarmak (Berry-picking / Çilek\ntoplama) onkolojik bir cinayettir. Testis kanserinde lenfatik yayılım\nmikroskobik ağlar şeklindedir. O 2 cm'lik kitlenin etrafındaki normal\nboyutlu görünen lenf bezlerinde bile %20 canlı kanser olabilir. Bu\nyüzden belirlenen şablonun içindeki TÜM lenfatik doku blok halinde\n(Template Disseksiyon) iskeletleştirilerek çıkarılmalıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Patoloji raporunda PC-RPLND sonrası çıkan kitlenin %100'ü\n'Nekroz/Fibrozis' (ölü doku) geldi. Hastaya ek bir tedavi (Kemoterapi)\nverir misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Nekroz gelmesi, önceki BEP kemoterapisinin işini %100\nmükemmel yaptığının kanıtıdır. Hastaya başka hiçbir tedavi verilmez,\nsadece izleme (Follow-up) alınır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"PC-RPLND patolojisinde kitlenin içinde '%15 Canlı Kanser\n(Viable NSGCT)' çıktı. Şimdi ne yapacağız?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu çok tehlikeli bir durumdur. Demek ki birinci basamak\nkemoterapi (BEP) tüm hücreleri öldürememiş. Bu hastalara nüksü\nengellemek için cerrahiden sonra mutlaka 2 kür daha Adjuvan\n(Konsolidasyon) Kemoterapisi (Genellikle TIP, VIP veya EP)\nverilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastaya BEP verdik ama AFP ve hCG değerleri düşmedi (Plato\nçizdi veya yükselmeye devam ediyor). BT'de de kitle duruyor. Bu hastaya\nPC-RPLND yapılır mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle yapılmaz! Markerları yüksek olan (S1-S3) bir\nhastalık, sistemik olarak aktif ve yayılıyor demektir. Kitleyi\nçıkarsanız bile hasta kanda dolaşan hücrelerden ölür. Bu hastanın\ncerrahiye değil, hemen İkinci Basamak (Salvage / Kurtarma)\nKemoterapisine (Örn: TIP - Paklitaksel, İfosfamid, Cisplatin) veya\nYüksek Doz Kemoterapi + Otolog Kök Hücre Nakline ihtiyacı vardır. RPLND\nsadece markerlar normale döndükten sonra yapılır.\"</li>\n</ul>\n"}, {"id": "8.5", "t": "Penis Kanseri (Epidemiyoloji, Skuamöz İnvazyon ve Cerrahi Prensipler)", "h": "<h3 id=\"a-koruyucu-kalkan-sünnet-ve-hpvni̇n-karanlik-yüzü\">A. KORUYUCU\nKALKAN: SÜNNET VE HPV'NİN KARANLIK YÜZÜ</h3>\n<p>Penis kanserlerinin &gt;%95'i Skuamöz Hücreli Karsinomdur (SCC).\nHastalık, sünnet derisinin (prepusyum) iç yaprağı ile glans (penis başı)\narasındaki o kapalı, nemli ve kronik enflamasyona açık bölgede\nbaşlar.</p>\n<h3 id=\"1-sünnetin-epidemiyolojik-gücü\">1. Sünnetin Epidemiyolojik\nGücü:</h3>\n<ul>\n<li>Yenidoğan Sünneti: Eğer bir erkek çocuğu yenidoğan döneminde sünnet\nedilirse, penis kanseri riski neredeyse SIFIRLANIR. * Yetişkin Sünneti:\nİleri yaşlarda yapılan sünnet, kanser riskini azaltır ancak yenidoğan\nsünneti kadar mutlak bir koruma sağlamaz. Çünkü prepusyum altında\nyıllarca biriken Smegma (ölü deri hücreleri ve sekresyonlardan oluşan\nkronik irritan madde) karsinogenezi çoktan başlatmış olabilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Fimozis (Sünnet derisinin geriye çekilememesi): Penis kanseri\nhastalarının %25-75'inde fimozis öyküsü vardır. Tümör, daralan derinin\naltında gizlice büyür ve hasta ancak kanama veya akıntı başladığında\ndoktora gelir.</li>\n</ul>\n<h3 id=\"1-hpv-human-papillomavirus-yolağı\">1. HPV (Human Papillomavirus)\nYolağı:</h3>\n<ul>\n<li>Penis kanserlerinin yaklaşık %40-50'si HPV (Özellikle Tip 16 ve 18)\nile doğrudan ilişkilidir. (Tıpkı kadınlardaki serviks kanseri\ngibi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>HPV pozitif tümörler genellikle <em>Bazaloid</em> veya <em>Warty\n(Siğilimsi)</em> alt tiplerdedir ve ilginç bir şekilde, HPV negatif\n(daha çok kronik enflamasyon kökenli) tümörlere göre sağkalım oranları\ndaha iyidir.</li>\n</ul>\n<h3 id=\"b-pri̇mer-tümör-yöneti̇mi̇-organ-koruma-sanatı\">B. PRİMER TÜMÖR\nYÖNETİMİ: Organ Koruma Sanatı</h3>\n<p>Geçmişte peniste 1 santimetrelik bir tümör görüldüğünde bile\n\"Parsiyel veya Total Penektomi\" (penisin kesilmesi) yapılırdı. 2026 EAU\nkılavuzlarının ana felsefesi ise şudur: \"Onkolojik güvenlikten taviz\nvermeden organı, kozmetiği ve cinsel fonksiyonu koru.\"</p>\n<ol type=\"1\">\n<li>Lokal Evreleme (Suni Ereksiyonlu MR):<br />\nAmeliyat planını tümörün hangi süngerimsi dokuya girdiği belirler.</li>\n</ol>\n<ul>\n<li>T1: Sadece bağ dokusuna girmiş.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>T2: Corpus Spongiosum'a (üretranın etrafındaki doku) invaze\nolmuş.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>T3: Corpora Cavernosa'ya (asıl ereksiyonu sağlayan kalın tüplere)\ninvaze olmuş.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Nasıl Anlarız?</em> Hastanın penisine Prostaglandin E1 (PGE1)\nenjekte edilip suni ereksiyon sağlanır ve Pelvik MR çekilir. Ereksiyon\nhalindeki dokuda tümörün (karanlık alanın) ne kadar derine girdiği\nmilimetrik olarak haritalanır.</li>\n</ul>\n<h3 id=\"1-organ-koruyucu-yaklaşımlar-ta-tis-ve-t1-için\">1. Organ\nKoruyucu Yaklaşımlar (Ta, Tis ve T1 için):</h3>\n<ul>\n<li>Topikal Tedavi: Sadece yüzeyel (Tis) lezyonlarda %5-Fluorourasil\nveya İmikimod kremler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Lazer Ablasyon: Nd:YAG veya \\CO_2 lazer ile yüzeyel tıraşlama.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Glans Resurfacing / Glandektomi: Tümör sadece penis başının\nyüzeyindeyse, glansın cildi tamamen soyulur ve bacaktan alınan deri\nyaması (Greft) ile yeni bir glans yapılır. Kanser derindeyse tüm glans\nkesilir (Glandektomi) ve korpus kavernozumların ucuna yine greft\ndikilir. Hasta ayakta işeyebilir ve cinsel fonksiyonunu korur.</li>\n</ul>\n<ol type=\"1\">\n<li>Parsiyel Penektomi ve Efsanenin Çöküşü:<br />\nEğer tümör T2/T3 evresinde veya çok agresifse organ koruma yapılamaz,\npenisin bir kısmı kesilir (Parsiyel Penektomi).</li>\n</ol>\n<ul>\n<li>Yıkılan Tabu: Eskiden tümörün en az 2 cm gerisinden kesmek şarttı.\nBu kural penisi çok kısalttığı için artık terk edildi. Güncel kural:\n\"Cerrahi sınırın negatif (tümörsüz) olması yeterlidir.\" Sınırın 3-5\nmilimetre geriden olması bile onkolojik olarak tamamen güvenlidir.</li>\n</ul>\n<h3 id=\"c-kasiktaki̇-savaş-di̇nami̇k-senti̇nel-lenf-nodu-bi̇yopsi̇si̇-dsnb\">C.\nKASIKTAKİ SAVAŞ: DİNAMİK SENTİNEL LENF NODU BİYOPSİSİ (DSNB)</h3>\n<p>Penis kanserinde hastanın kaderini primer tümör değil, İnguinal Lenf\nNodları belirler.</p>\n<ul>\n<li>İkilem: Eğer lenf bezlerinde kanser varsa ve \"Radikal İnguinal\nLenfadenektomi\" yaparsan hastanın hayatını kurtarırsın. Ancak kasıktaki\ntüm lenf bezlerini söküp almak; bacakta devasa ödem (Lenfödem / Fil\nhastalığı), yara açılması ve deri nekrozu gibi korkunç komplikasyonlara\n(%50 oranında) yol açar. Peki her hastanın kasığını gereksiz yere\nkesmekten nasıl kurtulacağız?</li>\n</ul>\n<p>Çözüm: DSNB (Dynamic Sentinel Node Biopsy)</p>\n<p>Tıpkı meme kanserinde olduğu gibi, EAU kılavuzları palpe edilemeyen\n(ele gelmeyen) lenf nodu olan T1G2 veya daha yüksek evreli hastalarda bu\ntekniği zorunlu tutar.</p>\n<ol type=\"1\">\n<li><p>İşaretleme: Ameliyattan bir gün önce tümörün etrafına radyoaktif\nmadde (Teknesyum-99m Nanokolloid) enjekte edilir. Ameliyat sabahı ise\nmavi boya (Patent Blue / İzülfan Mavisi) enjekte edilir.</p></li>\n<li><p>Avcılık: Bu maddeler tümörden çıkıp lenf yollarına girer ve ilk\ngittikleri (tümörü filtreleyen ilk istasyon) lenf bezine otururlar. Buna\n\"Nöbetçi (Sentinel) Lenf Nodu\" denir.</p></li>\n<li><p>Biyopsi: Cerrah kasıkta küçük bir kesi açar. Elindeki gama-prob\n(radyasyon ölçer) cihazıyla en çok öten (radyoaktif) ve gözle mavi\nboyanmış olan o tek bir lenf bezini bulup çıkarır.</p></li>\n<li><p>Karar: Bu nöbetçi lenf bezi patolojiye (frozen) gönderilir.\nTemizse, diğer lenf bezlerine dokunulmaz ve hasta radikal disseksiyonun\nkomplikasyonlarından kurtarılır. Kanserliyse, kasıktaki tüm lenf bezleri\nmecburen temizlenir.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe 50 yaşında, ağır fimozisi (sünnet derisi geriye\nçekilemeyen) olan bir hasta geldi. Derinin altından kötü kokulu akıntı\ngeliyor ve palpasyonda sert bir kitle hissediyorsun. Hemen antibiyotik\nverip gönderir misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Asla. Fimozis altında hissedilen sert, indüre bir kitle aksi\nispat edilene kadar Penis Kanseridir. Antibiyotik vermek teşhisi\ngeciktirir ve felaketle sonuçlanabilir. Hastaya poliklinik şartlarında\nlokal anestezi altında hemen 'Dorsal Slit' (sünnet derisinin sırtından\nboylamasına kesilmesi) yaparak glansı açığa çıkarır, kitleyi gözle görür\nve mutlaka insizyonel biyopsi alırım.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Erkek çocuklarına HPV aşısı yapmak penis kanserini önler mi?\nKılavuzlar ne diyor?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle evet. Geçmişte HPV aşısı sadece kız çocuklarına\n(serviks kanseri için) yapılıyordu. Güncel kılavuzlar, Hem genital\nsiğilleri (Kondilom) hem de HPV kaynaklı penis ve anal karsinomları\nönlemek amacıyla 9-14 yaş arası erkek çocuklarına rutin HPV (Örn:\n9-valan Gardasil) aşısını şiddetle önermektedir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Premalign lezyonlar olan 'Queyrat Eritroplazisi' ile 'Bowen\nHastalığı' arasındaki fark nedir? İkisi de aynı hücre midir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Histolojik olarak ikisi de aynıdır; ikisi de Karsinoma in\nSitu (CIS) yani bazal membranı aşmamış Skuamöz Hücreli Karsinomdur.\nSadece bulundukları yer farklıdır. Kırmızı, kadifemsi plak şeklinde\nGlans (penis başı) veya prepusyum iç yüzeyinde olanlara <em>Queyrat\nEritroplazisi</em>; penis gövdesindeki (şaft) keratinize ciltte olanlara\nise <em>Bowen Hastalığı</em> denir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Penis kanserinde ameliyat öncesi kan tahlilinde 'Kalsiyum'\nseviyesi yüksek geldi. Bu neyin habercisi olabilir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Tıpkı böbrek kanserinde olduğu gibi, ileri evre Penis\n(Skuamöz hücreli) karsinomları da paraneoplastik sendrom olarak kana\nPTHrP (Parathormon İlişkili Peptit) salgılayabilir. Hiperkalsemi varlığı\ngenellikle tümör yükünün çok yüksek olduğunu ve prognozun (sağkalımın)\nkötü olduğunu gösteren sinsi bir işarettir.\"</li>\n</ul>\n"}, {"id": "8.6", "t": "İleri Evre Penis Kanseri ve Radikal İnguinal Lenfadenektomi", "h": "<h3 id=\"a-radi̇kal-i̇ngui̇nal-lenf-nodu-di̇sseksi̇yonu-ilnd\">A. RADİKAL\nİNGUİNAL LENF NODU DİSSEKSİYONU (ILND)</h3>\n<p>Eğer DSNB (Nöbetçi lenf bezi) pozitif geldiyse veya hastanın\nkasığında klinik olarak ele gelen, BT/MR'da şüpheli lenf nodları varsa\n(cN1/cN2), o tarafın kasığındaki tüm lenf bezlerini temizlemek\nzorundayız. Bu ameliyat ürolojinin en morbid (komplikasyonlu)\ncerrahilerinden biridir.</p>\n<h3 id=\"1-cerrahi-sınırlar-femoral-üçgen\">1. Cerrahi Sınırlar (Femoral\nÜçgen):</h3>\n<ul>\n<li>Üst Sınır: İnguinal ligaman.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Dış (Lateral) Sınır: Sartorius kası.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İç (Medial) Sınır: Adduktor longus kası.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Taban: İlyopsoas ve pektineus kaslarının fasyası.</li>\n</ul>\n<ol type=\"1\">\n<li>Yüzeyel ve Derin Disseksiyon: Lenf bezleri fasya lata'nın hem\nüzerinde (yüzeyel) hem de altında (derin - femoral damarların etrafında)\nbulunur. Saphen ven (bacağın ana yüzeyel toplardamarı) genellikle feda\nedilir ve bağlanır.</li>\n</ol>\n<!-- -->\n\n<h3 id=\"1-kabus-komplikasyonlar\">1. Kabus Komplikasyonlar:</h3>\n<ul>\n<li>Cilt Nekrozu: Kasık derisi çok incedir. Altındaki kan damarları\nkesildiği için deri beslenemez ve çürür (nekroz).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Lenfosel ve Lenfödem: Bacağın tüm lenf akışı kesildiği için lenf\nsıvısı kesi yerinde birikir (lenfosel) veya bacak devasa bir şekilde\nşişer (Lenfödem / Fil hastalığı). Bu durum kalıcı olabilir.</li>\n</ul>\n<h3 id=\"b-hayat-kurtaran-manevra-sartori̇us-kas-flebi̇\">B. HAYAT KURTARAN\nMANEVRA: SARTORİUS KAS FLEBİ</h3>\n<p>Ameliyatta kasıktaki lenf bezlerini temizlediğinde, bacağın en büyük\ndamarları olan Femoral Arter ve Femoral Ven çırılçıplak ortada\nkalır.</p>\n<ul>\n<li><p>Tehlike: Eğer ameliyattan sonra cilt nekrozu gelişir veya yara\nenfekte olursa, bu çıplak damarlar dışarıdan havayla/bakteriyle temas\neder. Damar duvarı kurur, çürür ve aniden patlayarak (Blow-out) hastanın\ndakikalar içinde kan kaybından ölmesine neden olur.</p></li>\n<li><p>Çözüm (Hoca Sorusu): Cerrah ameliyatın sonunda Sartorius kasını\n(bacağın dışındaki uzun kas) yapıştığı yerden (ASIS - Anterior Superior\nİliak Spina) keser, kası damarların üzerine doğru çevirir ve oraya\ndiker. Buna <em>Sartorius Transpozisyonu (Kas Flebi)</em> denir. Kas,\nkanlanan kalın bir yorgan gibi femoral damarların üstünü örterek onları\nenfeksiyondan ve patlamadan korur.</p></li>\n</ul>\n<h3 id=\"c-pelvi̇k-lenf-nodu-di̇sseksi̇yonu-plnd-ne-zaman-yukarı-çıkarız\">C.\nPELVİK LENF NODU DİSSEKSİYONU (PLND): Ne Zaman Yukarı Çıkarız?</h3>\n<p>Penis kanserinin lenfatik yayılımı saat gibi tıkır tıkır, sırayla\nişler: Önce yüzeyel inguinal → sonra derin inguinal → sonra pelvik\n(karnın içindeki) lenf nodları.</p>\n<p>Peki cerrah kasıktaki lenf bezlerini alırken, karnın içine (Pelvise)\ngeçip oradaki lenf bezlerini de temizlemeli midir? EAU 2026 kuralları\n(Endikasyonlar):</p>\n<ol type=\"1\">\n<li><p>Cloquet (Rosenmüller) Nodu Pozitifliği: İnguinal kanaldan pelvise\ngeçişteki o en son nöbetçi lenf bezi (Cloquet nodu) frozen patolojide\nkanserli gelirse.</p></li>\n<li><p>≥ 2 Adet İnguinal Nod Pozitifliği: Kasıktaki bezlerin en az\nikisinde kanser çıkarsa.</p></li>\n<li><p>Ekstranodal İnvazyon (ENE): Kanser, lenf bezinin kapsülünü delip\ndışarıdaki yağ dokusuna taşmışsa.</p></li>\n</ol>\n<p>Bu durumlardan biri varsa, tümör inguinal bariyeri aşmış demektir ve\naynı taraf (ipsilateral) Pelvik Lenf Nodu Disseksiyonu ZORUNLUDUR.</p>\n<h3 id=\"d-sabi̇t-ki̇tleler-ve-neoadjuvan-kemoterapi̇-tip\">D. SABİT KİTLELER\nVE NEOADJUVAN KEMOTERAPİ (TIP)</h3>\n<p>Hasta polikliniğe geldi. Kasığındaki kitle o kadar büyük ki, cilde,\nkaslara ve altındaki kemiğe yapışmış durumda (Fikse / Unresectable).</p>\n<ul>\n<li><p>Ne Yapılmaz? \"Hemen ameliyata alıp kazıyalım\" DENMEZ. Çünkü o\nkitleyi çıkarırken femoral damarları da kesmek (bacağı ampute etmek)\nzorunda kalırsın ve geride kesin kanser kalır.</p></li>\n<li><p>Altın Standart: Tıpkı mesane kanserinde olduğu gibi, EAU\nkılavuzları bu hastalara önce Neoadjuvan Kemoterapi (Genellikle TIP:\nTaksol + İfosfamid + Platin) verilmesini emreder. Kemoterapi kitleyi\nküçültür, damarlardan ayırır (Downstaging) ve cerrahiyi mümkün\n(rezektabl) hale getirir.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 8 Gerçek Final Soruları)</p>\n<ol type=\"1\">\n<li>Soru: \"Kasığında ele gelen 3 cm lenf nodu olan bir hastada primer\ntümörü (penisi) ameliyat ettin. Lenf nodları için ne kadar beklersin\nveya hemen o seans inguinal disseksiyon yapar mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Eğer primer tümörde bariz bir enfeksiyon yoksa, aynı seans\ninguinal lenfadenektomi yapabilirim. Ancak peniste şiddetli\nenfeksiyon/nekroz varsa, o lenf nodunun kanserden değil enfeksiyondan\nşişmiş olma (Reaktif büyüme) ihtimali çok yüksektir. Bu durumda hastaya\n4-6 hafta geniş spektrumlu antibiyotik verir ve beklerim. Şişlik inmezse\nlenfadenektomi yaparım.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sartorius kasını kestik ve damarların üzerini örttük.\nHastanın bacak fonksiyonlarında (yürümesinde) kalıcı bir bozukluk olur\nmu?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Sartorius kası bacağın fleksiyon ve dışa rotasyonuna\n(terzi oturuşu) yardımcı olan ince bir kastır. Fonksiyonunu bacağın\ndiğer güçlü kasları (Quadriceps vb.) devraldığı için, hastanın\nyürümesinde veya günlük hayatında kalıcı bir motor kayıp yaşanmaz.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın patolojisi pN3 (Pelvik lenf nodu pozitif) geldi.\nCerrahiyi mükemmel yapsak bile sağkalım beklentisi nasıldır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ne yazık ki oldukça kötüdür. Penis kanseri pelvik nodlara\nulaştıysa sistemik bir hastalık kabul edilir. Cerrahi sonrası mutlaka\nAdjuvan Kemoterapi (veya Radyoterapi) verilmesine rağmen, bu hastaların\n5 yıllık sağkalım oranı %20-30 civarındadır.\"</li>\n</ul>\n<h3 id=\"9-androloji-i-seksüel-disfonksiyon-ve-peyronie-hastalığı\">9.\nAndroloji I: Seksüel Disfonksiyon ve Peyronie Hastalığı</h3>\n"}]}, {"n": 9, "t": "Androloji I: Seksüel Disfonksiyon ve Peyronie", "s": [{"id": "9.1", "t": "Ereksiyon Fizyolojisi, Nöroanatomi ve ED Etyolojisi", "h": "<h3 id=\"a-nöroanatomi̇-beyinden-penise-uzanan-otoyol\">A. NÖROANATOMİ:\nBeyinden Penise Uzanan Otoyol</h3>\n<p>Ereksiyon, beyinde (hipotalamusta) başlayan bir düşüncenin, peniste\nhidrolik bir basınca dönüştüğü kusursuz bir refleks zinciridir. İki ana\nyoldan tetiklenir:</p>\n<ol type=\"1\">\n<li><p>Psikojenik Ereksiyon (Görsel ve İşitsel): Beyinde başlar.\nUyarılar omuriliğe (T11-L2 sempatik ve S2-S4 parasempatik merkezlere)\niner. Buradan Pelvik Pleksus'a ulaşır.</p></li>\n<li><p>Refleksojenik Ereksiyon (Dokunsal): Doğrudan penis cildindeki\nreseptörlerden başlar, Pudendal Sinir (S2-S4) üzerinden omuriliğe gider\nve beyni bypass ederek doğrudan ereksiyonu tetikler. (Bu yüzden\nomuriliği T11'in üzerinden kesilmiş / felçli hastalarda bile dokunmayla\nereksiyon olabilir).</p></li>\n</ol>\n<p>Kilit Yapı: Kavernöz Sinirler (Cavernous Nerves)</p>\n<p>Pelvik pleksustan ayrılıp prostatın her iki yanından (nörovasküler\ndemet) süzülerek penise giren bu incecik otonom sinirler, ereksiyonun\nşalteridir. Radikal prostatektomi veya rektum kanseri ameliyatlarında\ncerrahın korumaya çalıştığı sinirler tam olarak bunlardır.</p>\n<h3 id=\"b-bi̇yoki̇mya-ve-fi̇zyoloji̇-nitrik-oksit-no-mucizesi\">B. BİYOKİMYA\nVE FİZYOLOJİ: Nitrik Oksit (NO) Mucizesi</h3>\n<p>Ereksiyon, penisin içindeki süngerimsi dokuların (Korpus Kavernozum)\nkanla dolması değil, o kanın içeride hapsedilmesi olayıdır. Bu süreç\nmikroskobik düzeyde şöyle gerçekleşir:</p>\n<ol type=\"1\">\n<li><p>Şalterin Açılması: Cinsel uyarı geldiğinde, kavernöz sinir\nuçlarından (NANC nöronları) ve damarların iç yüzeyindeki endotel\nhücrelerinden Nitrik Oksit (NO) salgılanır.</p></li>\n<li><p>Hücre İçi Kaskad: NO, düz kas hücresinin içine girerek Guanilat\nSiklaz enzimini aktive eder. Bu enzim, hücredeki GTP'yi cGMP (Siklik\nGuanozin Monofosfat) molekülüne çevirir.</p></li>\n<li><p>Gevşeme (Relaksasyon): cGMP, hücre içindeki kalsiyum (\\Ca{+2})\nseviyesini hızla düşürür. Kalsiyum düşünce, penisin içindeki o sıkıca\nkasılmış olan düz kaslar aniden gevşer (relakse olur).</p></li>\n<li><p>Hidrolik Dolum: Kaslar gevşeyince, penise kan getiren kavernozal\narterler genişler ve süngerimsi boşluklara (sinüzoidlere) hızla kan\ndolar. Penis büyümeye başlar.</p></li>\n<li><p>Veno-Oklüzif Mekanizma (Kilitleme): Asıl mucize buradadır. Kanla\nşişen sinüzoidler, penisi dıştan saran o taş gibi sert, esnemez kılıfa\n(Tunika Albuginea) içeriden baskı yapar. Bu baskı, penisteki kanı geri\ngötürecek olan incecik venleri (toplardamarları) tunika albuginea ile\nsinüzoidler arasına sıkıştırıp kapatır. Kan içeri girer ama dışarı\nçıkamaz. Tam (rijit) ereksiyon gerçekleşir.</p></li>\n</ol>\n<h3 id=\"c-etyoloji̇-sistem-nerede-çöker-ed-nedenleri\">C. ETYOLOJİ: Sistem\nNerede Çöker? (ED Nedenleri)</h3>\n<p>Bir erkeğin ereksiyon olamaması için yukarıdaki çarklardan sadece\nbirinin kırılması yeterlidir.</p>\n<ol type=\"1\">\n<li>Vasküler / Endotelyal Disfonksiyon (En Sık Neden - %40): Damarların\niç yüzeyi (endotel) bozulduğunda yeterince Nitrik Oksit (NO)\nüretemez.</li>\n</ol>\n<ul>\n<li><em>Damar Çapı Hipotezi (Artery Size Hypothesis):</em> Penil arterin\nçapı 1-2 mm, Koroner arterin çapı 3-4 mm, Karotis (boyun) arterinin çapı\n5-7 mm'dir. Sistemik bir damar sertliği (Ateroskleroz) başladığında, en\ndar boru olan penis damarı herkesten önce tıkanır. Bu yüzden ED, koroner\narter hastalığının en erken klinik belirtisidir.</li>\n</ul>\n<ol type=\"1\">\n<li>Nörojenik (Kablo Kopması):<br />\nRadikal pelvik cerrahiler (Prostatektomi, Sistektomi), Multipl Skleroz\n(MS), omurilik yaralanmaları veya diyabetik nöropati (sinirlerin\nşekerden erimesi) kavernöz sinirleri susturur.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Endokrinolojik (Yakıt Eksikliği):<br />\nTestosteron, sadece cinsel isteği (libido) değil, aynı zamanda Nitrik\nOksit Sentaz (NOS) enziminin üretimini de düzenler. Hipogonadizm (Düşük\nTestosteron) veya Hiperprolaktinemi mekanizmayı durdurur.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>İatrojenik (İlaçlar):<br />\nDahiliye ve psikiyatri reçeteleri ürolojik fonksiyonun en büyük\ndüşmanlarındandır. Beta-blokerler, Tiazid diüretikler (Tansiyon\nilaçları), SSRI grubu antidepresanlar ve anti-androjenler (Prostat\nkanseri ilaçları) ED'nin en sık görülen geri döndürülebilir\nnedenleridir.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Venöz Kaçak (Venöz Sızıntı):<br />\nPenis kanla dolar, ancak tunika albuginea yeterince sağlam değilse veya\ndüz kaslar tam gevşeyemezse, venler sıkışamaz. Kan sürekli geri kaçar.\nHasta \"Sertleşiyorum ama hemen sönüyor\" der.</li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe ED şikayetiyle gelen 50 yaşında, obez, hafif\nhipertansiyonu olan bir hasta var. EAU kılavuzuna göre mavi hapı (PDE5i)\nyazıp göndermeden önce mutlaka sorman/yapman gereken hayati test\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU kılavuzları, ED'yi kardiyovasküler bir uyarıcı kabul\neder. İlaç yazmadan önce hastanın kardiyak riskini (Princeton III\nKonsensüsüne göre) değerlendirmeliyim. Eğer hasta düşük riskli değilse\n(örn: 2 kat merdiven çıkarken göğsü ağrıyorsa), PDE5 inhibitörü yazmadan\nönce mutlaka Kardiyoloji konsültasyonu (Efor testi) istemek zorundayım.\nAksi takdirde cinsel aktivite sırasındaki efor hastada miyokard\nenfarktüsünü (kalp krizini) tetikleyebilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sildenafil (Viagra) ve benzeri ilaçların (PDE5 İnhibitörleri)\nmoleküler düzeydeki asıl görevi nedir? Nitrik Oksit mi üretirler?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. PDE5 inhibitörleri vücutta sıfırdan Nitrik Oksit veya\ncGMP üretmezler. Onların tek görevi, ereksiyonu bitiren ve cGMP'yi yıkan\nenzim olan Fosfodiesteraz Tip 5 (PDE5) enzimini bloke etmektir. Yani\ncGMP'nin yıkımını engelleyerek hücre içinde birikmesini sağlarlar. Bu\nyüzden hastada cinsel bir uyarı (libido/istek) yoksa ve baştan hiç NO\nsalgılanmıyorsa, bu ilaçlar kesinlikle işe yaramaz.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Venöz kaçak (Veno-oklüzif disfonksiyon) olduğundan\nşüphelendiğin genç bir hastada bunu objektif olarak nasıl\nkanıtlarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Altın standart tanı yöntemi Penil Renkli Doppler\nUltrasonografi (Penil Doppler USG)'dir. Hastanın penisine damar\ngenişletici (Papaverin/Trimiks) iğne yaparız ve ereksiyon olmasını\nbekleriz. Ardından kavernozal arterlerin Sistolik Pik Akım Hızına (PSV -\nkan giriş hızı) ve End-Diyastolik Hızına (EDV - kanın geri kaçış hızı)\nbakarız. PSV &gt;30 cm/sn iken EDV &gt;5 cm/sn çıkıyorsa, kan içeri\ngiriyor ama venlerden geri kaçıyor demektir; venöz kaçak teşhisi\nkesinleşir.\"</li>\n</ul>\n"}, {"id": "9.2", "t": "Erektil Disfonksiyon Tanısı ve Medikal Tedaviler (1. ve 2. Basamak)", "h": "<h3 id=\"a-tani-soruşturma-ve-biyokimyasal-dedektiflik\">A. TANI:\nSoruşturma ve Biyokimyasal Dedektiflik</h3>\n<p>ED tanısı koymak için pahalı cihazlara veya ağrılı testlere gerek\nyoktur. Tanının %80'i hastanın öyküsünde gizlidir.</p>\n<ol type=\"1\">\n<li><p>IIEF-5 Skoru (Uluslararası Erektil Fonksiyon Formu): Hastaya\nverilen 5 soruluk bu anket, hastalığın şiddetini (Hafif, Orta, Ağır)\nobjektif olarak puanlar ve tedavinin başarısını takip etmemizi\nsağlar.</p></li>\n<li><p>RigiScan (NPT - Nokturnal Penil Tümesans Testi): Hastanın\npsikojenik ED mi (stres/anksiyete kaynaklı) yoksa organik ED mi\n(damar/sinir bozukluğu) yaşadığını anlamanın altın standardıdır. Cihaz\nhastanın penisine takılır ve hasta uyur. Sağlıklı bir erkek REM uykusu\nsırasında gecede 3-5 kez ereksiyon yaşar. Eğer cihaz gece\nereksiyonlarını kaydediyorsa, hastanın damar ve sinirleri tamamen\nsağlamdır; sorun %100 psikolojiktir.</p></li>\n<li><p>Zorunlu Laboratuvar Paneli: Her ED hastasından sabah 08:00 -\n11:00 arası (seviyenin en yüksek olduğu saatler) Total Testosteron,\nAçlık Kan Şekeri (HbA1c) ve Lipid Profili (Kolesterol) istenmesi\nkılavuzların emridir.</p></li>\n</ol>\n<h3 id=\"b-1-basamak-tedavi̇-pde5-i̇nhibitörleri-mucize-moleküller\">B. 1.\nBASAMAK TEDAVİ: PDE5 İnhibitörleri (Mucize Moleküller)</h3>\n<p>1998'de piyasaya sürülen bu ilaçlar (mavi haplar), cinsel tıbbın\ngidişatını sonsuza dek değiştirdi.</p>\n<ul>\n<li>Altın Kural: Bu ilaçlar afrodizyak değildir! Cinsel istek (libido)\nve mekanik uyarı olmadan ASLA işe yaramazlar. Görevleri Nitrik Oksit\nüretmek değil, üretilen cGMP'nin PDE5 enzimi tarafından yıkılmasını\nengellemektir.</li>\n</ul>\n<p>Ajanlar Arasındaki Farmakolojik Farklar (Hoca Bunu Sorar):</p>\n<h3 id=\"1-sildenafil-viagra-ve-vardenafil-levitra\">1. Sildenafil\n(Viagra) ve Vardenafil (Levitra):</h3>\n<ul>\n<li>Etki Süresi: Kısa etkilidir (4-6 saat). İlişkiden 1 saat önce\nalınmalıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gıda Etkisi: Yağlı yemekler ve alkol emilimini bozar; mutlaka aç\nkarnına alınmalıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yan Etki (Çapraz Reaksiyon): Sildenafil, retinadaki PDE6 enzimiyle\nçapraz reaksiyona girer. Bu yüzden hastalar \"Mavi/Yeşil görme\" veya\nışığa hassasiyet yaşayabilir.</li>\n</ul>\n<h3 id=\"1-tadalafil-cialis\">1. Tadalafil (Cialis):</h3>\n<ul>\n<li>Etki Süresi: Çok uzun etkilidir (36 saat). Bu yüzden \"Hafta sonu\nhapı\" (Weekend pill) olarak bilinir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gıda Etkisi: Tok veya aç karnına alınabilir, yemekten\netkilenmez.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yan Etki: Kaslardaki PDE11 enzimiyle çapraz reaksiyona girdiği için\nspesifik olarak Sırt ve kas ağrısı (Miyalji) yapabilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Ekstra Kullanım:</em> Düşük dozu (Günlük 5 mg), prostat büyümesi\n(BPH) olan hastalarda alt üriner sistem semptomlarını (LUTS) rahatlatmak\niçin de FDA onaylıdır.</li>\n</ul>\n<h3 id=\"1-avanafil-spedra\">1. Avanafil (Spedra):</h3>\n<ul>\n<li>Piyasaya çıkan en yeni nesildir. En büyük avantajı çok hızlı\nemilmesidir (15-30 dakika içinde etki başlar) ve yan etki profili en\ndüşük olan ajandır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>MUTLAK KONTRENDİKASYON: PDE5 inhibitörleri, kalp hastalarının\nkullandığı NİTRATLAR (Dilaltı İsosorbid dinitrat vb.) ile kesinlikle\nbirlikte KULLANILAMAZ. İkisi de cGMP'yi artırdığı için ölümcül, geri\ndöndürülemez bir hipotansiyona (tansiyon düşüklüğüne) neden olur.</li>\n</ul>\n<h3 id=\"c-2-basamak-tedavi̇-haplar-i̇şe-yaramadığında\">C. 2. BASAMAK\nTEDAVİ: Haplar İşe Yaramadığında</h3>\n<p>Eğer hasta PDE5 inhibitörlerinden maksimum dozda ve doğru kullanıma\nrağmen fayda görmüyorsa (örn: ağır diyabetikler veya radikal\nprostatektomi sonrası sinirleri kesilmiş hastalar), merdivenin ikinci\nbasamağına çıkılır.</p>\n<h3 id=\"1-i̇ntrakavernozal-enjeksiyon-ici---i̇ğne-tedavisi\">1.\nİntrakavernozal Enjeksiyon (ICI) - İğne Tedavisi:</h3>\n<p>Hasta ilacı yutmaz, insülin iğnesi gibi ince bir iğneyle doğrudan\npenisinin içine (Korpus Kavernozum) enjekte eder.</p>\n<ul>\n<li><p>Ajanlar: Alprostadil (Prostaglandin E1 - PGE1) tek başına\nkullanılır veya en güçlü kombinasyon olan Trimiks (Alprostadil +\nPapaverin + Fentolamin) hazırlanır.</p></li>\n<li><p>Mekanizma: Bu ilaçlar sinirlere veya Nitrik Oksit yolağına\nihtiyaç duymaz. Doğrudan düz kasların içindeki cAMP'yi artırarak anında\nve zorunlu bir ereksiyon sağlarlar. (Uyarıya gerek yoktur).</p></li>\n<li><p>Risk: En çok korktuğumuz yan etkisi Priapizm (4 saatten uzun\nsüren, inmeyen ağrılı ereksiyon) ve iğne yerlerinde yıllar içinde\ngelişen Fibrozis/Plak oluşumudur.</p></li>\n</ul>\n<h3 id=\"2-vakum-ereksiyon-cihazları-ved\">2. Vakum Ereksiyon Cihazları\n(VED):</h3>\n<p>İlaç veya iğne istemeyen (veya kullanamayan) hastalar için mekanik\nçözümdür.</p>\n<ul>\n<li><p>Penisin üzerine plastik bir silindir geçirilir, vakum pompasıyla\nkan zorla penisin içine çekilir ve penisin köküne sıkı bir silikon halka\n(Constriction ring) takılarak kanın geri kaçması engellenir.</p></li>\n<li><p><em>Dezavantajı:</em> Penis soğuk ve morarık (siyanotik) görünür.\nHalka dışarıdan baskı yaptığı için meninin dışarı çıkmasını\n(ejakülasyonu) engeller. Halka 30 dakikadan fazla tutulmamalıdır (iskemi\nriski).</p></li>\n</ul>\n<h3 id=\"d-yeni̇-nesi̇l-vi̇zyon-şok-dalga-tedavisi-li-eswt\">D. YENİ NESİL\nVİZYON: Şok Dalga Tedavisi (LI-ESWT)</h3>\n<p>Haplar veya iğneler sadece geçici (semptomatik) çözümlerdir; anı\nkurtarırlar ama hastalığı iyileştirmezler. Son yıllarda kılavuzlara\ngiren Düşük Yoğunluklu Şok Dalga Tedavisi (LI-ESWT) ise doğrudan <em>kür\n(tamamen iyileşme)</em> sağlamayı hedefler.</p>\n<ul>\n<li><p>Mekanizma: Penise dışarıdan verilen ses (şok) dalgaları, dokuda\nmikro-travmalar yaratır. Vücut bu travmayı onarmak için o bölgeye kök\nhücreleri ve büyüme faktörlerini (VEGF) çağırır. Sonuç: Peniste yepyeni,\ns
