/li>\n<li><p>Mekanizma: Ameliyat sırasında kopan ve mesane içindeki suda yüzen\ncanlı kanser hücrelerinin (tümör seeding) yaralı mukozaya tutunup\nyeniden kök salmasını engeller (Kemoablasyon).</p></li>\n<li><p>Faydası: İlk 5 yıldaki nüks riskini tek bir dozla %15-20 oranında\nazaltır. EAU kılavuzlarında Düşük ve Orta riskli hastalar için \"Standart\nÖneri\"dir.</p></li>\n<li><p>KİME YAPILMAZ? (Mutlak Kontrendikasyon): Ameliyatta mesaneyi\ndeldiysen (Perforasyon şüphesi) veya rezeksiyon çok derinse ASLA\nVERİLMEZ. İlaç batın içine veya perivezikal yağ dokusuna kaçarsa ölümcül\nkimyasal peritonit, nekroz ve bağırsak fistülleri yapar.</p></li>\n</ul>\n<h3 id=\"c-i̇ntravezi̇kal-i̇mmünoterapi̇-bcg-bacillus-calmette-guérin\">C.\nİNTRAVEZİKAL İMMÜNOTERAPİ: BCG (Bacillus Calmette-Guérin)</h3>\n<p>Bu tedavi, onkoloji tarihinin en büyük zaferlerinden biridir. Yüksek\nriskli tümörlerde ve özellikle Karsinoma in Situ (CIS) tedavisinde\nkemoterapiden fersah fersah üstündür.</p>\n<ol type=\"1\">\n<li><p>Nedir? Zayıflatılmış (atenüe) canlı <em>Mycobacterium bovis</em>\n(Sığır Tüberkülozu) bakterisidir.</p></li>\n<li><p>Nasıl Çalışır? Mesaneye verilen bakteriler, tümörlü ürotelyum\nhücrelerindeki fibronektine tutunur ve hücre içine alınır. Vücut bunu\ndevasa bir enfeksiyon olarak algılar. Mesane duvarında muazzam bir lokal\nimmün fırtına (Makrofajlar, CD4/CD8 T-hücreleri, Th1 sitokin kaskadı)\nkopar. Bu \"bağışıklık ordusu\", bakterileri yok ederken araya karışan\nkanser hücrelerini de acımasızca katleder.</p></li>\n</ol>\n<h3 id=\"3-swog-protokolü-altın-standart-uygulama\">3. SWOG Protokolü\n(Altın Standart Uygulama):</h3>\n<ul>\n<li>İndüksiyon: TUR-BT'den en az 2-4 hafta sonra başlanır. Haftada 1\nkez, toplam 6 hafta verilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İdame (Maintenance): 3. ayda 3 hafta, 6. ayda 3 hafta ve sonrasında\n3 yıla kadar her 6 ayda bir 3 hafta şeklinde devam eder. <em>(Kural:\nYüksek riskte 3 yıl, orta riskte 1 yıl idame verilir).</em></li>\n</ul>\n<h3 id=\"d-bcg-zehi̇rlenmesi̇-ve-yöneti̇mi̇-bcg-osis\">D. BCG ZEHİRLENMESİ VE\nYÖNETİMİ (BCG-osis)</h3>\n<p>Hastaya canlı bir tüberküloz mikrobu veriyorsun; bu masum bir ilaç\ndeğildir.</p>\n<ol type=\"1\">\n<li><p>Lokal Yan Etkiler: Sık idrara çıkma, yanma (Kimyasal sistit),\nhafif hematüri. Bunlar ilacın işe yaradığının (immün yanıtın) kanıtıdır.\nAntikolinerjikler veya kinolon grubu olmayan antibiyotiklerle\nsemptomatik yönetilir.</p></li>\n<li><p>Sistemik Enfeksiyon (BCG Sepsisi): Bakteri kan dolaşımına\nkarışırsa ölümcüldür. Dirençli yüksek ateş (&gt;39°C), titreme,\nhipotansiyon ve karaciğer/akciğer granülomları görülür.</p></li>\n</ol>\n<ul>\n<li>Müdahale: Akut Tüberküloz tedavisi başlanır (İzoniazid + Rifampisin\n+ Etambutol). Ağır vakalarda immün yanıtı baskılamak için sistemik\nkortikosteroidler eklenir.</li>\n</ul>\n<p>Mutlak Kontrendikasyonlar (Kime BCG Verilmez?):</p>\n<ul>\n<li><p>İmmünsüpresif hastalar (HIV, organ nakli).</p></li>\n<li><p>Makroskopik (gözle görülür) hematürisi olanlar (Damarlar açık\ndemektir, mikrop kana karışır).</p></li>\n<li><p>Travmatik sonda takılanlar (Kanama olduysa o günkü BCG seansı\nderhal iptal edilir).</p></li>\n<li><p>TUR-BT sonrası ilk 2 hafta içinde olanlar.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"TUR-BT sonrası BCG başlamak için neden en az 2-4 hafta\nbekliyoruz da erken tek doz kemoterapi (SIO) gibi hemen ameliyat sonrası\nvermiyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Erken tek doz kemoterapi, hücrelerin tutunmasını engellemek\niçin verilir ve sistemik emilimi düşüktür. Ancak BCG <em>canlı bir\nbakteridir</em>. Ameliyattan hemen sonra mesane duvarında açık damarlar\nve derin rezeksiyon yaraları vardır. BCG bu açık damarlardan kana\nkarışırsa, hastayı fulminan tüberküloz sepsisine (BCG-osis) sokar ve\nöldürebilir. Yaraların epitelize olması (kapanması) için 2-4 hafta\nbeklemek şarttır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"BCG sepsisinde tedaviye neden klasik tüberküloz dörtlüsündeki\n'Pirazinamid'i eklemiyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Çünkü BCG suşları (<em>Mycobacterium bovis</em> kaynaklı\noldukları için) Pirazinamid'e doğal olarak dirençlidir. Bu ilacın hiçbir\nfaydası olmaz, sadece gereksiz hepatotoksisite yapar.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Orta riskli bir hastaya Mitomisin-C veriyoruz ama nüksler\ndevam ediyor. Etkinliği artırmak için cihaz destekli (Device-assisted)\nhangi yöntemleri kullanabiliriz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İlacın ürotelyumdan doku içine nüfuz etmesini artırmak için\niki ana yöntem vardır: HIVEC / Synergo (Hipertermi): Mesane içindeki\nsıvıyı 42-43°C'ye ısıtarak hücre zarı geçirgenliğini artırır. EMDA\n(Elektromotif İlaç Uygulaması): İyontoforez mantığıyla düşük bir\nelektrik akımı kullanılarak kemoterapi ajanının mesane duvarına\nitilmesini sağlar.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta 6 haftalık indüksiyon BCG'sini aldı. Ne zaman kontrol\nsistoskopisi yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"TUR-BT'den itibaren 3. ayda. Sistoskopi ile birlikte mutlaka\nidrar sitolojisi de gönderilmelidir.\"</li>\n</ul>\n"}, {"id": "6.5", "t": "BCG-Yanıtsız Hastalık (BCG-Unresponsıve)", "h": "<h3 id=\"a-bcg-yanitsiz-bcg-unresponsive-tanimi-nedi̇r\">A. \"BCG-YANITSIZ\"\n(BCG-Unresponsive) TANIMI NEDİR?</h3>\n<p>Hoca vizitte ilk bunu sorar: \"Bu hastaya BCG-Yanıtsız demek için\nhastanın tam olarak ne kadar ilaç almış olması gerekir?\" Çünkü yetersiz\ndoz almış birine yanıtsız diyemezsin.</p>\n<p>FDA ve Kılavuzlara göre \"Yeterli BCG\" (Adequate BCG) tanımı:</p>\n<ul>\n<li><p>En az 5 doz İndüksiyon (6 haftanın en az 5'i) ARTI</p></li>\n<li><p>En az 2 doz İdame (Maintenance) VEYA ikinci bir indüksiyonun en\naz 2 dozu.</p></li>\n</ul>\n<p>BCG-Yanıtsızlık Kriterleri: (Yeterli BCG aldıktan sonra;)</p>\n<ol type=\"1\">\n<li><p>İlk değerlendirmede (3. ayda) T1 High-Grade tümör saptanması. (En\ntehlikelisi).</p></li>\n<li><p>Son BCG dozundan sonraki 6 ay içinde Ta High-Grade veya CIS\nsaptanması.</p></li>\n<li><p>Son BCG dozundan sonraki 12 ay içinde CIS nüksü\nsaptanması.</p></li>\n</ol>\n<p>Kritik Not: BCG aldıktan sonra hastada <em>Low-Grade (Düşük\ndereceli)</em> bir Ta tümör çıkarsa, bu \"BCG-Yanıtsız\" kabul edilmez!\nBCG, low-grade tümörleri yok etmek için değil, high-grade ve CIS'i\ndurdurmak için verilir.</p>\n<h3 id=\"b-altin-standart-erken-radi̇kal-si̇stektomi̇\">B. ALTIN STANDART:\nERKEN RADİKAL SİSTEKTOMİ</h3>\n<p>Eğer hasta BCG-Yanıtsız kriterlerini karşılıyorsa, EAU ve AUA\n2025/2026 kılavuzları tartışmasız bir şekilde şunu söyler: İlk ve en\ngüçlü öneri Radikal Sistektomi'dir.</p>\n<ul>\n<li><p>Neden Acele Ediyoruz? Çünkü bu tümörler biyolojik olarak son\nderece saldırgandır ve mesane içinde (NMIBC aşamasında) görünseler bile,\nkas tabakasına ilerleme (progresyon) ve metastaz potansiyelleri\ndevasadır.</p></li>\n<li><p>Pencere (Window of Opportunity): BCG yanıtsızlığı saptandıktan\nsonra radikal sistektomiyi 12 haftadan fazla geciktirmek, hastanın\nkansere özgü sağkalım oranını dramatik şekilde düşürür.</p></li>\n</ul>\n<h3 id=\"c-mesane-koruyucu-kurtarma-salvage-tedavi̇leri̇\">C. MESANE\nKORUYUCU KURTARMA (SALVAGE) TEDAVİLERİ</h3>\n<p>Peki ya hasta 80 yaşındaysa, ağır kalp yetmezliği varsa (Sistektomi\nolamazsa) veya masada ölmeyi göze alıp \"Mesanemi aldırmıyorum!\" diyorsa?\nİşte 2026 vizyonunun devrim yarattığı yer burasıdır. Bu hastalara artık\n\"Sizi kaderinize terk ediyoruz\" demiyoruz:</p>\n<h3 id=\"1-sistemik-i̇mmünoterapi-pembrolizumab---keytruda\">1. Sistemik\nİmmünoterapi (Pembrolizumab - Keytruda):</h3>\n<ul>\n<li><p>Nedir? Sistemik bir PD-1 inhibitörüdür. (Damardan verilir, mesane\niçine değil).</p></li>\n<li><p>Endikasyon: Radikal sistektomiye uygun olmayan veya reddeden, CIS\niçeren BCG-yanıtsız hastalarda FDA onaylıdır.</p></li>\n<li><p>Başarı: Hastaların yaklaşık %40'ında 3. ayda tam yanıt (Complete\nResponse - CR) sağlar.</p></li>\n</ul>\n<h3\nid=\"2-i̇ntravezikal-gen-tedavisi-nadofaragene-firadenovec---adstiladrin\">2.\nİntravezikal Gen Tedavisi (Nadofaragene firadenovec - Adstiladrin):</h3>\n<ul>\n<li><p>Nedir? Sonda ile mesane içine verilen, replikasyon defektli bir\nAdenovirüs vektörüdür. Bu virüs, insan <em>İnterferon-alfa 2b</em>\ngenini taşır.</p></li>\n<li><p>Mekanizma: Virüs, mesane duvarındaki hücrelere girer ve onları\nbirer \"İnterferon fabrikasına\" çevirir. Yüksek doz interferon kanser\nhücrelerini yok eder. 3 ayda bir tek doz uygulanır.</p></li>\n</ul>\n<h3 id=\"3-sıralı-i̇ntravezikal-kemoterapi-gemcitabine--docetaxel\">3.\nSıralı İntravezikal Kemoterapi (Gemcitabine + Docetaxel):</h3>\n<ul>\n<li>Özellikle ABD'de son yıllarda inanılmaz popülerleşen bir kurtarma\nrejimidir. Önce Gemcitabine mesaneye verilir, 1-2 saat bekletilip\nboşaltılır, hemen ardından Docetaxel verilir. BCG bulunamayan (BCG\nshortage) dönemlerde veya BCG yanıtsızlarda güçlü bir\nalternatiftir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastaya 6 hafta indüksiyon BCG verdik. 3. ayda kontrol\nsistoskopisi yaptık ve T1 High-Grade tümör nüksü gördük. Hasta 'Bana bir\nkür daha BCG verin' diyor. Ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle reddederim. 3. ayda saptanan T1 High-Grade tümör,\ndoğrudan BCG-Yanıtsız kategorisine girer. Bu hastaya bir kür daha BCG\nvermek, tümörün kas tabakasına inmesi ve metastaz yapması için ona zaman\nhediye etmektir. Acil Radikal Sistektomi planlarım.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sistemik Pembrolizumab tedavisinin en çok korkulan yan\netkileri (İmmün aracılı toksisite) nelerdir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bağışıklık sisteminin frenlerini (PD-1) kaldırdığımız için\nvücut kendi organlarına saldırabilir. En tehlikelileri; Pnömonit\n(akciğer inflamasyonu), Kolit (şiddetli ishal/bağırsak delinmesi),\nHepatit ve Endokrinopatilerdir (Hipotiroidi, Tip 1 Diyabet).\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"BCG-Refrakter (Dirençli) ile BCG-Relapsing (Nükseden)\nterimleri neden terk edildi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Klinik çalışmaları standardize etmek için. Dirençli\n(Refrakter) veya Nükseden kelimeleri zaman aralığını ve doz miktarını\nnet belirtmiyordu. FDA ve onkoloji dernekleri, sistektomi veya yeni ilaç\ndenemeleri için net bir eşik belirlemek amacıyla zaman ve doza dayalı\n'BCG-Unresponsive (Yanıtsız)' terimini şemsiye bir kavram olarak\nstandardize etti.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Mesane koruyucu tedavilerde (Pembrolizumab vb.) başarısız\nolursak ne olur?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Gecikmiş radikal sistektomi (Delayed Cystectomy) aşamasına\ngeçeriz. Ancak literatür net olarak gösteriyor ki, kurtarma tedavileri\ndenerken geçen sürede hastalığın lenf nodlarına veya peritona yayılma\nriski çok yüksektir.\"</li>\n</ul>\n"}, {"id": "6.6", "t": "MIBC Yönetimi I (Kemoterapi ve Radikal Cerrahi)", "h": "<h3 id=\"a-neoadjuvan-kemoterapi̇-nac-tartışmasız-altın-standart\">A.\nNEOADJUVAN KEMOTERAPİ (NAC): Tartışmasız Altın Standart</h3>\n<p>Radikal sistektomi (mesanenin alınması) öncesi hastaya sistemik\nkemoterapi verilmesidir. Kılavuzlar, T2-T4a, N0, M0 evresindeki\ncerrahiye uygun her hastaya kategori 1 kanıt düzeyiyle NAC verilmesini\nemreder.</p>\n<h3 id=\"1-neden-önce-kemoterapi\">1. Neden Önce Kemoterapi?</h3>\n<ul>\n<li>Dolaşımdaki gizli mikro-metastazları yok etmek.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tümörün boyutunu küçültmek ve lenf nodlarını temizleyerek cerrahiyi\nkolaylaştırmak (Down-staging).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sağkalım: 5 yıllık genel sağkalımda %5-8 oranında \"mutlak\", %20\noranında \"göreceli\" iyileşme sağlar. Hastaların yaklaşık %30-40'ı\nameliyat masasına yattığında mesanesinde hiç kanser kalmamış (pT0)\nolur!</li>\n</ul>\n<h3 id=\"1-hangi-i̇laç-cisplatin-kuralı\">1. Hangi İlaç? (Cisplatin\nKuralı):</h3>\n<ul>\n<li>NAC sadece ve sadece Cisplatin bazlı kombinasyonlarla (Örn: MVAC\nveya Gemcitabine-Cisplatin / GC) yapılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ölümcül Hata: Eğer hasta Cisplatin alamıyorsa (Cisplatin-unfit),\nyerine \"Karboplatin\" verilmez. Karboplatinin neoadjuvan ortamda sağkalım\navantajı yoktur. Hasta kemoterapi almadan doğrudan radikal sistektomiye\nyönlendirilir.</li>\n</ul>\n<h3 id=\"b-radi̇kal-si̇stektomi̇-anatominin-yeniden-yazılması\">B. RADİKAL\nSİSTEKTOMİ: Anatominin Yeniden Yazılması</h3>\n<p>Bu ameliyat, insan vücudundaki en majör, en kanlı ve fizyolojiyi en\nçok değiştiren cerrahilerden biridir. Sadece mesane değil, tüm pelvik\norganlar \"blok halinde\" çıkarılır.</p>\n<ul>\n<li><p>Erkeklerde (Standart): Mesane, Prostat, Seminal Veziküller ve\ndistal üreterler çıkarılır. Üretra, prostatın bittiği yerden (apeks)\nkesilir.</p></li>\n<li><p>Kadınlarda (Anterior Pelvik Ekzenterasyon): Mesane, Uterus\n(Rahim), Ovarler (Yumurtalıklar), Fallop tüpleri ve Vajinanın ön\n(anterior) duvarı çıkarılır.</p></li>\n<li><p>Organ Koruyucu Cerrahi: Güncel kılavuzlar, çok seçilmiş, tümörün\nmesane boynundan/prostattan veya vajinadan uzak olduğu genç hastalarda\ncinsel fonksiyonu korumak için (erkekte prostat kapsülü/sinirler,\nkadında vajina ve uterus) koruyucu tekniklere izin vermektedir. Ancak\nonkolojik risk her zaman hastayla tartışılmalıdır.</p></li>\n</ul>\n<h3 id=\"c-lenf-nodu-di̇sseksi̇yonu-plnd-sağkalımın-gizli-anahtarı\">C. LENF\nNODU DİSSEKSİYONU (PLND): Sağkalımın Gizli Anahtarı</h3>\n<p>Mesaneyi ve prostatı/rahmi almak işin sadece görünen yüzüdür. Gerçek\nkanser cerrahisi, pelvisteki o yağlı dokuların içindeki lenf bezlerini\ntek tek ayıklamaktır (Lenfadenektomi).</p>\n<ul>\n<li><p>Neden Yapılır? Hem evreleme (gerçek metastaz var mı?) hem de\ntedavi (çıkardığın lenf bezleriyle birlikte kanseri de vücuttan atarsın)\namacı taşır. Çıkarılan lenf nodu sayısı (lenf nodu verimi - ideal olarak\n&gt;15-20) sağkalımla doğrudan ilişkilidir.</p></li>\n<li><p>Sınırlar Nelerdir?</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Standart Şablon: Eksternal iliyak, internal iliyak ve obturator\nfossa lenf nodları (Bifürkasyona kadar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Genişletilmiş Şablon (Extended - ePLND): Sınırlar yukarıda Aortik\nBifürkasyona (veya ana iliyak damarların üreteri çaprazladığı yere)\nkadar, aşağıda Cooper bağına kadar, arkada ise presakral nodları\niçerecek şekilde genişletilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>EAU 2025/2026 Görüşü:</em> Hastanın sağkalımını maksimize etmek\niçin radikal sistektomi sırasında genişletilmiş (ePLND) yapılması\nstandart cerrahi kalite göstergesidir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Bir hastaya 'Cisplatin-unfit' (Cisplatin alamaz) demek için\nhangi kriterlere bakarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: Galyum konsensüsüne göre şu kriterlerden herhangi biri varsa\nhasta Cisplatin alamaz:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Böbrek yetmezliği (Kreatinin klerensi/GFR &lt; 60 mL/dk).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İşitme kaybı (Odyometride Grade ≥ 2).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Periferik nöropati (Grade ≥ 2).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kötü performans skoru (ECOG PS ≥ 2).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İleri kalp yetmezliği (NYHA Class III).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta Cisplatin-unfit, ameliyattan önce neoadjuvan kemoterapi\nveremedik ve direkt Radikal Sistektomi yaptık. Patoloji pT3N1 geldi\n(Tümör mesane dışına çıkmış ve lenf nodunda kanser var). Şimdi ne\nyapacağız?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Eğer hasta ameliyat sonrası iyileşip Cisplatin alabilir\nduruma gelmediyse, bu hastaya Adjuvan İmmünoterapi (Nivolumab veya\nPembrolizumab) başlanması güncel kılavuzların en yeni ve en güçlü\nönerisidir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Kadın hastada Radikal Sistektomi yaparken vajinanın ön\nduvarını neden alıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Mesanenin arka duvarı ile vajinanın ön duvarı tek bir fasya\ntabakasını paylaşır. Mesane tabanına yerleşmiş bir kanser mikroskobik\nolarak bu fasyayı aşıp vajina duvarına invaze olmuş olabilir. Onkolojik\ngüvenliği (negatif cerrahi sınır) sağlamak için ikisi birleşik olarak\nçıkarılır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Radikal sistektomi sırasında üretrayı kestin. Patoloğa\ngönderdiğin sınır (Frozen section) kanser pozitif geldi. Ameliyatın\nseyri nasıl değişir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Üretrada kanser varken hastaya bağırsaktan yeni bir mesane\n(Ortotopik Neomesane) yapıp o üretraya DİKEMEM. Kanser anında nüks eder.\nBu durumda yeni mesane planı iptal edilir, hastaya İleal Konduit (Karna\nbağlanan torba) yapılır ve mutlaka eş zamanlı veya gecikmeli olarak\nÜretrektomi (Üretranın tamamen çıkarılması) ameliyata eklenir.\"</li>\n</ul>\n"}, {"id": "6.7", "t": "MIBC Yönetimi II (Üriner Diversiyonlar ve Rekonstrüksiyon)", "h": "<h3 id=\"a-i̇leal-kondui̇t-bricker-tekniği--i̇nkontinan-diversiyon\">A. İLEAL\nKONDUİT (Bricker Tekniği / İnkontinan Diversiyon)</h3>\n<p>Dünyada en sık uygulanan, cerrahi süresi nispeten kısa ve\nkomplikasyon oranı en öngörülebilir olan \"altın standart\" saptırma\nyöntemidir.</p>\n<ol type=\"1\">\n<li><p>Teknik: Terminal ileumdan (İleoçekal valvin 15-20 cm\nproksimalinden başlayarak) yaklaşık 15-20 cm'lik bir bağırsak segmenti\nizole edilir. Kalan bağırsak uç uca (anastomoz) dikilerek sindirim\nsistemi bütünlüğü sağlanır.</p></li>\n<li><p>Üreteroileal Anastomoz: Her iki üreter bu izole bağırsak\nparçasının bir ucuna (Bricker: ayrı ayrı, Wallace: uçları\nbirleştirilerek tek parça halinde) dikilir.</p></li>\n<li><p>Stoma: Bağırsağın diğer ucu karın sağ alt kadranından cilde\nağızlaştırılır. İdrar sürekli olarak buradaki torbaya (urostomi)\nakar.</p></li>\n<li><p>Kime Yapılır? İleri yaşlı, performansı düşük, böbrek\nfonksiyonları sınırda olan veya neomesane için kontrendikasyonu olan\nhastalara.</p></li>\n</ol>\n<h3 id=\"b-ortotopi̇k-neomesane-kontinan-diversiyon\">B. ORTOTOPİK\nNEOMESANE (Kontinan Diversiyon)</h3>\n<p>Hastayı dışarıdan sarkan bir idrar torbasından kurtaran, anatomik ve\npsikolojik olarak en yüz güldürücü (ama cerrahisi en zor) yöntemdir. En\nbilinen teknikler Studer ve Hautmann poşlarıdır.</p>\n<ol type=\"1\">\n<li><p>Teknik (Detübülerizasyon Şartı): Yaklaşık 40-60 cm ileum segmenti\nalınır. Bağırsak uzunlamasına tamamen kesilerek (detübülerizasyon) boru\nyapısı bozulur ve \"W\" veya \"U\" şeklinde katlanıp dikilerek küresel bir\ndepo haline getirilir.</p></li>\n<li><p>Anastomoz: Üst tarafa üreterler, alt tarafa ise hastanın kendi\ndoğal üretrası dikilir.</p></li>\n<li><p>Fizyolojik Bedeli: Bağırsak peristaltizmi (kasılma dalgası)\nbozulduğu için idrar düşük basınçta depolanır (LaPlace Kanunu). Ancak\nyeni mesanede \"Detrüsör\" (kendi kendine kasılan kas) yoktur.</p></li>\n</ol>\n<h3 id=\"4-kime-yapilmaz-kontrendikasyonlar\">4. Kime YAPILMAZ?\n(Kontrendikasyonlar):</h3>\n<ul>\n<li>Üretral cerrahi sınır pozitifliği (Tümör üretradaysa).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Böbrek yetmezliği (eGFR &lt; 45-60 ml/dk) veya Karaciğer yetmezliği\n(Bağırsak idrarı emeceği için böbrek ve karaciğer bu yükü\ntemizleyemez).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İnflamatuar bağırsak hastalığı (Crohn) veya pelvik radyoterapi\nöyküsü.</li>\n</ul>\n<h3 id=\"c-metaboli̇k-kompli̇kasyonlar-hoca-vizitinin-belkemiği\">C.\nMETABOLİK KOMPLİKASYONLAR (Hoca Vizitinin Belkemiği)</h3>\n<p>İdrarı bağırsağın içine koyduğunda, bağırsak \"Ben idrarı emmem\"\ndemez. Aktif olarak içindeki iyonları kana çekmeye başlar. Kullanılan\nbağırsak segmentine göre değişen bu komplikasyonları adın gibi\nbilmelisin:</p>\n<ol type=\"1\">\n<li>Hiperkloremik Metabolik Asidoz: İleum ve kolon, idrardaki Amonyum\n(\\NH_4+) ve Klor (\\Cl-) iyonlarını kana emerken, Bikarbonat'ı (\\HCO_3-)\nidrara atar. Vücut asidoza girer.</li>\n</ol>\n<ul>\n<li><em>Tedavi:</em> Sodyum Bikarbonat hapları veya Klorotiyazid\n(böbrekten klor atılımını artırmak için).</li>\n</ul>\n<ol type=\"1\">\n<li>Jejunum Sendromu (Neden Jejunum Kullanılmaz?): Jejunumun su ve\nelektrolit geçirgenliği devasadır. İdrarı buraya koyarsan Sodyum ve Su\nidrara, Potasyum ve Asit kana geçer. Hasta hızla Hiponatremik,\nHiperkalemik Asidoz ve dehidratasyon komasına girer.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>B12 Vitamini Eksikliği: B12 sadece terminal ileumdan emilir. Sen\nneomesane için 60 cm ileum aldığında, vücudun B12 depoları 2-3 yıl\niçinde tükenir. Hasta megaloblastik anemi ve nörolojik defisitlerle\ngelir. <em>Yıllık B12 enjeksiyonu şarttır.</em></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Kemik Demineralizasyonu (Osteomalazi): Kronik asidozu dengelemek\niçin vücut en büyük kalsiyum deposu olan kemikleri kullanır. Kemikten\nkalsiyum çekildikçe kemikler erir.</li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Ortotopik neomesane yaptığımız hasta ameliyattan 1 ay sonra\ngeldi. 'Hocam idrarımı yapamıyorum' diyor. Bu hasta normalde nasıl\nişemelidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Neomesanede detrüsör kası olmadığı için hasta normal bir\nişeme hissi duymaz (sadece dolgunluk hisseder). İşemek için pelvik\ntabanını (sfinkteri) gevşetmeli ve eş zamanlı olarak karın içi basıncını\nartırmalıdır (Valsalva Manevrası). İdrarını saatli (2-3 saatte bir)\nyapması öğretilmelidir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Neomesane hastası Valsalva ile idrarını yapamıyor ve mesanede\nciddi rezidü kalıyor (Hiperkontinans). Yönetimi nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ortotopik neomesane hastalarının %10-20'sinde (özellikle\nkadınlarda kinking/açılanma nedeniyle daha sık) idrarı tamamen\nboşaltamama sorunu görülür. Bu durumda hastaya ömür boyu Temiz Aralıklı\nKateterizasyon (TAK/CIC) yapması öğretilir. Zaten neomesane kararı\nalınırken hastanın zihinsel ve fiziksel olarak TAK yapabilecek\nkapasitede olması (el becerisi) ön şarttır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Bağırsağı uzunlamasına kesmenin (Detübülerizasyon) fiziksel\nve fizyolojik mantığı nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İki mantığı vardır. 1. Fizyolojik: Bağırsağın dairesel kas\nlifleri kesildiği için, toplu halde kasılıp idrarı böbreklere geri\nkaçıran yüksek basınçlı peristaltik dalgalar kırılır. 2. Fiziksel:\nLaPlace Kanunu gereği; bir kürenin yarıçapı arttıkça, içindeki basınç\ndüşer. Detübülerizasyon ile yüzey alanı maksimize edilerek düşük\nbasınçlı/yüksek kapasiteli bir depo elde edilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastada hem mesane kanseri var hem de ileri evre böbrek\nyetmezliği nedeniyle diyalize giriyor. Bu hastaya hangi üriner\ndiversiyonu yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ortotopik neomesane kesinlikle kontrendikedir. İleal konduit\nyapılabilir ancak idrar çıkışı (output) çok az olacağı veya hiç\nolmayacağı için stoma bakımı zorlaşır ve bağırsak segmenti mukusla\ntıkanabilir. Bu tür diyaliz hastalarında sadece mesanenin alındığı ve\nüreterlerin cilde doğrudan bağlandığı Kütanöz Üreterostomi veya\nüreterlerin bağlandığı çok kısa bağırsak segmentleri tercih\nedilebilir.\"</li>\n</ul>\n"}, {"id": "6.8", "t": "Mıbc'de Mesane Koruyucu Yaklaşımlar (Trimodalite Tedavisi)", "h": "<h3 id=\"a-tri̇modali̇te-tedavi̇si̇-tmt-nedi̇r\">A. TRİMODALİTE TEDAVİSİ (TMT)\nNEDİR?</h3>\n<p>TMT, kanseri üç koldan aynı anda vurmayı hedefleyen, birbirini\ntamamlayan üç basamaklı bir protokoldür.</p>\n<ol type=\"1\">\n<li><p>Maksimal TUR-BT (Cerrahın Görevi): Mesane içindeki tümör, kas\ndokusuna kadar olabildiğince derin ve tamamen (\"görünür tümör kalmayacak\nşekilde\") kazınır. Bu adım çok kritiktir; çünkü radyoterapi devasa\nkitleleri değil, mikroskobik kalıntıları yok etmekte\nbaşarılıdır.</p></li>\n<li><p>Radyoterapi (RT - Işınlama): Mesaneye ve pelvik lenf nodlarına\nyüksek doz (genellikle 64-66 Gy) radyasyon verilir.</p></li>\n<li><p>Eşzamanlı (Konkürrent) Kemoterapi: Radyoterapi verilirken hasta\naynı anda radyosensitizer (ışına duyarlılığı artıran) özellikli\nkemoterapi (Cisplatin, Mitomisin-C + 5-FU veya düşük doz Gemcitabine)\nalır.</p></li>\n</ol>\n<p><em>Kritik Uyarı:</em> TMT bir \"Radyoterapi\" veya \"Kemoterapi\"\ntedavisi değildir. Bu üç silahın aynı anda ve eksiksiz kullanılmasıdır.\nBiri eksikse buna TMT denmez ve başarı şansı dramatik olarak düşer.</p>\n<h3 id=\"b-ki̇mler-i̇deal-adaydir-hasta-seçimi-hayatidir\">B. KİMLER İDEAL\nADAYDIR? (Hasta Seçimi Hayatidir)</h3>\n<p>EAU ve AUA 2025/2026 kılavuzları, TMT'yi radikal sistektomiye\n\"alternatif\" olarak sunar, ancak sadece çok iyi seçilmiş hastalarda\nsağkalımın benzer (non-inferior) olduğunu vurgular. İdeal bir TMT adayı\nşu özelliklere sahip olmalıdır:</p>\n<ul>\n<li><p>Tümör Özellikleri: Erken kas invazyonu (T2), tek odaklı, küçük\nboyutlu (&lt;5 cm) ve CIS (Karsinoma in Situ) içermeyen tümörler. (CIS\nradyoterapiye çok dirençlidir ve tüm mesaneye yayıldığı için ışınlamak\nçok zordur).</p></li>\n<li><p>Anatomi: Tümör mesane kubbesinde (dome) veya yan duvarda olmalı;\nmesane boynu veya prostatik üretrayı tutmamalıdır.</p></li>\n<li><p>Fonksiyon: Hastanın mesane kapasitesi iyi olmalı ve şiddetli\nirritatif semptomları (sürekli işeme, inkontinans) olmamalıdır.</p></li>\n<li><p>Cerrahi Başarı: İlk adım olan TUR-BT'de tümör \"gözle görünür\nşekilde\" tamamen (Maksimal) rezeke edilebilmiş olmalıdır. Hidronefroz\n(böbrek şişmesi) olmamalıdır, zira bu durum tümörün üreteri tıkadığını\nve agresif olduğunu gösterir.</p></li>\n</ul>\n<h3 id=\"c-tmtni̇n-yan-etki̇leri̇-ve-ri̇skleri̇\">C. TMT'NİN YAN ETKİLERİ VE\nRİSKLERİ</h3>\n<p>\"Mesaneyi koruduk, iş bitti\" demek büyük bir yanılgıdır. Işınlanan\nbir mesane, eski sağlıklı mesane değildir.</p>\n<ul>\n<li><p>Radyasyon Sistiti: Mesane duvarı sertleşir, esnekliğini kaybeder\n(kontrakte mesane). Hastada ömür boyu sürebilecek sık idrara çıkma,\naciliyet hissi ve kanamalar görülebilir.</p></li>\n<li><p>Bağırsak Toksisitesi: Radyasyon rektuma da isabet ettiği için\nradyasyon proktiti (kanlı ishal) gelişebilir.</p></li>\n<li><p>Nüks Riski: TMT sonrası ilk 5 yılda hastaların yaklaşık %30'unda\nmesanede (genellikle NMIBC evresinde) nüks görülür. Bu nedenle çok sıkı\n(3-6 ayda bir) sistoskopi takibi şarttır.</p></li>\n</ul>\n<h3 id=\"d-kurtarma-salvage-si̇stektomi̇si̇-son-çare\">D. KURTARMA (SALVAGE)\nSİSTEKTOMİSİ: Son Çare</h3>\n<p>TMT başarısız olursa (tümör kas tabakasında nüks ederse veya\nradyoterapiye rağmen büyürse), hastanın tek şansı \"Kurtarma\nSistektomisidir\".</p>\n<ul>\n<li>Neden Çok Zordur? Radyoterapi almış dokular fibrotik (tahta gibi\nsert) olur, anatomik planlar kaybolur ve damarlar yapışır. Cerrahi çok\ndaha kanlıdır, bağırsak yaralanma riski çok yüksektir ve ameliyat\nsonrası yara iyileşmesi/idrar kaçağı (fistül) problemleri standart\nsistektomiye göre kat kat fazladır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe 65 yaşında bir hasta geldi. Mesanesinde 6 cm'lik,\nçok odaklı bir T2 tümör var ve etrafında yaygın CIS izleniyor. Ek olarak\nsağ böbrekte tümöre bağlı hidronefroz var. Hasta mesanesini korumak için\nTMT istiyor. Ne önerirsin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu hasta TMT için kesinlikle uygun bir aday değildir. Çok\nodaklı olması, büyük boyutu, CIS varlığı ve hidronefroz (üreteri\ntıkayacak kadar agresif olması) TMT'nin başarısızlık garantisidir. Bu\nhastaya ısrarla Radikal Sistektomi ve Neoadjuvan Kemoterapi\nönermeliyim.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Trimodalite Tedavisi (TMT) alan bir hastada, 6. ay kontrol\nsistoskopisinde mesanede Ta High-Grade (Kasa invaze olmayan) nüks\ngördün. Hemen Kurtarma Sistektomisi yapar mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Eğer nüks kasa invaze değilse (NMIBC), kılavuzlar bu\ndurumu konservatif yönetmeyi önerir. Tümörü TUR-BT ile rezeke eder ve\nhastaya (radyoterapi öyküsüne rağmen) intravezikal tedavi (BCG veya\nKemoterapi) verebilirim. Sistektomi, kasa invaziv (MIBC) nükslerde veya\ntedavi edilemeyen devasa tümörlerde/kanamalarda devreye girer.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"TMT protokolünde neden radyoterapi ile kemoterapiyi <em>aynı\nanda</em> (konkürrent) veriyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Çünkü burada kullanılan kemoterapinin (özellikle Cisplatin\nveya 5-FU/Mitomisin) birincil amacı vücuttaki metastazları öldürmek\ndeğil, mesanedeki tümör hücrelerini radyasyona duyarlı hale getirmektir\n(Radyosensitizasyon). Kemoterapi, tümör hücrelerinin DNA tamir\nmekanizmalarını bozarak radyasyonun yıkıcı etkisini maksimize\neder.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Bir hastaya sadece radyoterapi verip kemoterapi vermezsek\n(Bimodalite) sonuç ne olur?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Sağkalım oranları sadece RT alanlarda, TMT (Kemoterapi + RT\n+ TUR) alanlara göre istatistiksel olarak anlamlı derecede daha kötüdür.\nKemoterapi verilemeyen hastalarda RT tek başına küratif değil,\ngenellikle palyatif (kanamayı/ağrıyı durdurucu) kabul edilir.\"</li>\n</ul>\n"}, {"id": "6.9", "t": "İleri Evre ve Metastatik Ürotelyal Kanser Yönetimi", "h": "<h3 id=\"a-bi̇ri̇nci̇-basamak-1-li̇ne-tedavi̇-paradi̇gmasi-oyun-değişti\">A.\nBİRİNCİ BASAMAK (1. LİNE) TEDAVİ PARADİGMASI: Oyun Değişti</h3>\n<p>Yıllarca metastatik ürotelyal karsinomda (mUC) altın standart,\nhastanın Cisplatin alıp alamamasına göre şekillenirdi. Ancak güncel\nEV-302 / KEYNOTE-A39 klinik çalışması bu kuralı yıktı ve kılavuzları\ngüncelledi.</p>\n<h3\nid=\"1-yeni-altın-standart-kategori-1-enfortumab-vedotin--pembrolizumab\">1.\nYeni Altın Standart (Kategori 1): Enfortumab Vedotin +\nPembrolizumab</h3>\n<ul>\n<li><p>Platin (Cisplatin/Karboplatin) uygunluğundan <em>bağımsız\nolarak</em>, metastatik hastalarda ilk tercih artık bu\nikilidir.</p></li>\n<li><p>Geleneksel kemoterapiye göre genel sağkalımı (OS) neredeyse iki\nkatına çıkarmış, metastatik mesane kanserinde daha önce görülmemiş bir\nyanıt oranına (%68) ulaşmıştır.</p></li>\n</ul>\n<p>2. Alternatif (Geleneksel) Yol: Platin Bazlı Kemoterapi + İdame\nİmmünoterapi</p>\n<ul>\n<li><p>Eğer hasta EV+Pembro ikilisine ulaşamıyorsa veya kontrendikasyonu\nvarsa, eski algoritmaya dönülür.</p></li>\n<li><p>Hasta Cisplatin'e uygunsa Gemcitabine + Cisplatin (GC), değilse\nGemcitabine + Karboplatin başlanır.</p></li>\n<li><p>JAVELIN Bladder 100 Kuralı: Kemoterapi (4-6 kür) bittikten sonra\nhastalık büyümemişse (progresyon yoksa), \"Bekleyelim görelim\" denmez.\nHasta derhal Avelumab (PD-L1 inhibitörü) idame (maintenance) tedavisine\nalınır.</p></li>\n</ul>\n<h3 id=\"b-akilli-bombalar-anti̇kor-i̇laç-konjugatlari-adc\">B. AKILLI\nBOMBALAR: ANTİKOR-İLAÇ KONJUGATLARI (ADC)</h3>\n<p>Bunlar, kemoterapinin yan etkilerini azaltıp etkisini sadece tümöre\nyönlendiren \"Truva Atı\" moleküllerdir.</p>\n<ol type=\"1\">\n<li>Enfortumab Vedotin (EV): * Hedef: Ürotelyal kanser hücrelerinin\nyüzeyinde çok yoğun bulunan Nektin-4 proteinine bağlanır.</li>\n</ol>\n<ul>\n<li>Mekanizma: Hücre içine girdikten sonra, taşıdığı zehirli yükü (MMAE\n- mikrotübül yıkıcı ajan) serbest bırakır ve sadece o hücreyi içeriden\nöldürür.</li>\n</ul>\n<h3 id=\"1-sacituzumab-govitecan-sg\">1. Sacituzumab Govitecan (SG):</h3>\n<ul>\n<li>Hedef: Trop-2 reseptörüne bağlanır. Taşıdığı yük SN-38'dir\n(Topoizomeraz I inhibitörü). Genellikle EV ve Pembro sonrası direnç\ngelişen hastalarda (3. basamak) kullanılır.</li>\n</ul>\n<h3 id=\"c-hedefe-yöneli̇k-tedavi̇ler-mutasyon-avcilari\">C. HEDEFE YÖNELİK\nTEDAVİLER (MUTASYON AVCILARI)</h3>\n<p>Tüm hastaların tümör genetiği (NGS - Yeni Nesil Dizileme) metastatik\nevrede mutlaka çıkarılmalıdır. Çünkü bazen tümörün çok spesifik bir\nzayıf noktası vardır.</p>\n<ul>\n<li>Erdafitinib (FGFR İnhibitörü): Metastatik hastaların yaklaşık\n%20'sinde FGFR2 veya FGFR3 gen mutasyonu/füzyonu bulunur. Eğer bu\nmutasyon varsa, hastaya günde bir kez hap olarak verilen Erdafitinib\nbaşlanır. Sinyal yolağını keserek tümörü durdurur.</li>\n</ul>\n<h3 id=\"d-i̇mmünoterapi̇-checkpoint-i̇nhi̇bi̇törleri̇\">D. İMMÜNOTERAPİ\n(CHECKPOINT İNHİBİTÖRLERİ)</h3>\n<p>Tümör hücreleri, bağışıklık sisteminin T-hücrelerine \"Ben dostum,\nbana dokunma\" sinyali (PD-L1) göndererek onlardan saklanır.\nPembrolizumab, Nivolumab, Avelumab ve Atezolizumab gibi ajanlar bu\nmaskeyi indirir (PD-1 / PD-L1 blokajı) ve hastanın kendi bağışıklık\nsisteminin kansere saldırmasını sağlar.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Enfortumab Vedotin (EV) alan bir hastada poliklinikte hangi\nspesifik yan etkileri sorgularsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EV'nin klasik kemoterapiden çok farklı üç majör toksisitesi\nvardır: 1. Şiddetli cilt döküntüleri (Nektin-4 ciltte de bulunduğu için\nStevens-Johnson Sendromuna kadar gidebilir). 2. Periferik Nöropati (MMAE\nyüküne bağlı karıncalanma/uyuşma). 3. Hiperglisemi (Diyabeti olmayan\nhastalarda bile ani kan şekeri fırlamaları).\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Avelumab idame (maintenance) tedavisinin felsefesi nedir?\nNeden hastalığın ilerlemesini beklemiyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kemoterapi tümörü olabildiğince küçültür ve antijenleri\naçığa çıkarır. Ancak kemoterapi kesildiğinde mikroskobik hücreler hızla\nçoğalmaya başlar ve hasta yeni bir ilacı alamayacak kadar kötüleşebilir.\nAvelumab, kemoterapinin yarattığı bu antijenik ortamı fırsat bilip\nbağışıklık sistemini aktif tutarak tümörün başını kaldırmasını engeller.\nBuna 'Switch Maintenance' denir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Platin-unfit (ne Cisplatin ne Karboplatin alabilen) bir\nhastaya ilk basamakta EV+Pembro veremiyorsan ne verirsin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU 2026'ya göre bu hastalarda, PD-L1 ekspresyon düzeyinden\nbağımsız olarak tek ajan immünoterapi (Pembrolizumab veya Atezolizumab)\nstandart bir seçenektir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastaya Erdafitinib (FGFR inhibitörü) başladın. Göz hekimine\nkonsülte etmen gerekir mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle evet. Erdafitinib'in en korkulan ve spesifik yan\netkilerinden biri Santral Seröz Retinopati (CSR) ve diğer oküler\ntoksisitelerdir. Hastanın düzenli göz dibi muayenesi olması\nzorunludur.\"</li>\n</ul>\n"}, {"id": "6.10", "t": "Üst Üriner Sistem Ürotelyal Tümörleri (UTUC)", "h": "<h3 id=\"a-etyoloji̇-si̇gara-ve-spesi̇fi̇k-düşmanlar\">A. ETYOLOJİ: SİGARA VE\nSPESİFİK DÜŞMANLAR</h3>\n<p>Tüm ürotelyal kanserlerin sadece %5-10'unu oluşturur. Sigara yine en\nbüyük risk faktörüdür, ancak UTUC'ye çok spesifik iki özel etyolojik\nneden vardır ki asistan vizitlerinin vazgeçilmezidir:</p>\n<ol type=\"1\">\n<li><p>Balkan Endemik Nefropatisi (Aristoloşik Asit): Balkan ülkelerinde\nve bazı Uzak Doğu bitkisel ilaçlarında (Aristolochia fangchi) bulunan bu\nasit, böbrek yetmezliği ile birlikte inanılmaz derecede yüksek oranda ve\ngenellikle çift taraflı UTUC yapar. DNA'da A:T → T:A transversiyonu\nşeklinde karakteristik bir mutasyon izi bırakır.</p></li>\n<li><p>Lynch Sendromu (HNPCC): DNA yanlış eşleşme onarımı (Mismatch\nRepair - MMR, özellikle MSH2) genlerindeki mutasyonlara bağlıdır. Genç\nyaşta (&lt;60) UTUC ile gelen, ailesinde kolon veya endometrium kanseri\nöyküsü olan her hastada Amsterdam II Kriterleri sorgulanmalı ve genetik\ntarama yapılmalıdır.</p></li>\n</ol>\n<h3 id=\"b-tani-ve-ri̇sk-strati̇fi̇kasyonu-eau-20252026\">B. TANI VE RİSK\nSTRATİFİKASYONU (EAU 2025/2026)</h3>\n<p>Tanıda altın standart BT Ürografi'dir. Toplayıcı sistemde kontrast\nmaddenin dolduramadığı, tümörün yer kapladığı karanlık bir alan olan\n\"Dolum Defekti\" (Filling Defect) aranır.</p>\n<p>Ancak BT tek başına yetmez. Hastaya Tanısal Üreteroskopi (URS)\nyapılarak tümör gözle görülür ve biyopsi alınır.</p>\n<p><em>Kritik Bilgi:</em> URS biyopsisi ile tümörün kası invaze edip\netmediğini (T evresini) anlamak neredeyse imkansızdır. Bu yüzden\nevreleme değil, sadece Derecelendirme (Low-Grade / High-Grade)\nyapılır.</p>\n<p>EAU Risk Sınıflaması: Cerrahinin boyutunu bu belirler.</p>\n<ul>\n<li><p>Düşük Risk: Tek odaklı, &lt;2 cm, Low-Grade (sitoloji ve\nbiyopside), BT'de invazyon görünümü olmayan.</p></li>\n<li><p>Yüksek Risk: Hidronefroz (tıkanıklık) varlığı, &gt;2 cm,\nHigh-Grade, çok odaklı, daha önce radikal sistektomi geçirmiş olmak veya\nvaryant histoloji içermesi.</p></li>\n</ul>\n<h3 id=\"c-altin-standart-cerrahi̇-radi̇kal-nefroüreterektomi̇-rnu\">C. ALTIN\nSTANDART CERRAHİ: RADİKAL NEFROÜRETEREKTOMİ (RNU)</h3>\n<p>Yüksek riskli bir UTUC'de böbreği kurtarmaya çalışmak onkolojik bir\nkumardır.</p>\n<ul>\n<li><p>Neleri Alıyoruz? Böbrek + Etrafındaki Gerota fasyası + Üreterin\nTAMAMI + Mesane Kuff'ı (Bladder Cuff).</p></li>\n<li><p>Neden Mesane Kuff'ı Alınır? Üreteri mesaneye girdiği yerden (UVJ)\nkesip bırakamazsınız. Kalan o birkaç santimetrelik distal üreter\ngüdüğünde (stump) tümör nüks etme ihtimali %30-60 gibi devasa bir\norandır. Üreter, mesanedeki deliğiyle (orifis) birlikte, etrafından\n\"para büyüklüğünde\" bir parça mesane duvarı kesilerek (kuff) tamamen ve\nblok halinde çıkarılmalıdır.</p></li>\n<li><p>Lenf Nodu Disseksiyonu (LND): Yüksek riskli tümörlerde şablona\nuygun (böbrek pelvisi için paraaortik/parakaval, pelvik üreter için\npelvik) LND yapılması sağkalımı artırır ve evreleme için\nzorunludur.</p></li>\n</ul>\n<h3 id=\"d-böbrek-koruyucu-cerrahi̇-kss---kidney-sparing-surgery\">D.\nBÖBREK KORUYUCU CERRAHİ (KSS - Kidney-Sparing Surgery)</h3>\n<p>Eğer hasta Düşük Riskli grubundaysa veya zorunlu nedenleri varsa (tek\nböbrekliyse, kronik böbrek yetmezliği varsa), böbrek feda edilmez:</p>\n<ol type=\"1\">\n<li><p>Endoskopik Ablasyon: URS ile girilip tümörün lazerle\n(Holmium/Thulium) yakılmasıdır. Sık nüks eder, çok sıkı takip\ngerektirir.</p></li>\n<li><p>Segmental Üreterektomi: Tümör alt üreterde ve kısmen agresifse,\nsadece o üreter segmenti kesilir ve üreter mesaneye yeniden dikilir\n(Üreteroneosistostomi / Psoas Hitch).</p></li>\n</ol>\n<h3 id=\"e-rnu-sonrasi-kri̇ti̇k-hamle-i̇ntravezi̇kal-kemoterapi̇\">E. RNU\nSONRASI KRİTİK HAMLE: İNTRAVEZİKAL KEMOTERAPİ</h3>\n<p>Radikal Nefroüreterektomi yaptın, böbreği ve üreteri tamamen aldın.\nBitti mi? Hayır.</p>\n<p>UTUC hastalarının %20 ile %50'sinde ameliyattan sonraki ilk 1-2 yıl\niçinde mesanede tümör nüksü görülür (Aynı kanserojenlere maruz kalan\nmesanenin alan etkisi veya ameliyat sırasındaki tümör ekilmesi).</p>\n<ul>\n<li>Kural: RNU sonrası (genelde post-op 2-10. günler arası, sonda\nçekilmeden önce) mesane içine tek doz Mitomisin-C veya Epirubisin\ninstilasyonu yapılmalıdır. Bu basit işlem, mesane nüks riskini tek\nbaşına %15-20 oranında azaltır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 6 Final Soruları)</p>\n<ol type=\"1\">\n<li>Soru: \"Üst sistem tümörü şüphesi olan bir hastada idrar sitolojisini\nidrar kabına işeterek (voided) mi alırsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. İşenmiş idrar sitolojisinin UTUC'de duyarlılığı çok\ndüşüktür. Hele ki tümör üreteri tıkadıysa, kanser hücreleri mesaneye\nulaşamaz bile. Altın standart, sistoskopi/URS sırasında direkt o tarafın\nüreter orifisinden kateter gönderip böbrek pelvisini yıkayarak Selektif\n(Barbotaj) Sitoloji almaktır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"UTUC'de neoadjuvan kemoterapi (Cisplatin) verilir mi, yoksa\ndirekt ameliyata mı alınır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"EAU 2026 kılavuzları, klinik olarak yüksek riskli/invaziv\nşüphesi olan (cT2-4 veya cN+) UTUC'lerde, tıpkı mesane kanserinde olduğu\ngibi Cisplatin bazlı Neoadjuvan Kemoterapi verilmesini önerir. Çünkü\nhastalar RNU ameliyatından sonra (tek böbrekle kalacakları için)\nGFR'leri düşer ve adjuvan kemoterapiyi (Cisplatin) alamaz hale\ngelirler.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Açık RNU ameliyatında üreter ve böbrek diseksiyonu yaparken\nonkolojik prensip olarak üreteri ne zaman bağlarsın/klemplersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ameliyatın en başında. Böbreği manipüle etmeden önce üreter\nalt kısımdan kliplenmeli veya bağlanmalıdır. Aksi takdirde, böbreği\nserbestleştirirken yapılan masaj ve basınç, tümör hücrelerinin idrarla\nbirlikte aşağı mesaneye dökülmesine (seeding) neden olur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Endoskopik olarak (böbrek koruyucu) lazerle yaktığın düşük\nriskli UTUC hastasını nasıl takip edersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu hastalarda nüks riski muazzamdır. 3. ayda mutlaka\ndiagnostik URS ve selektif sitoloji (Second-look) yaparım. Mesane\nkanseri için de risk altında olduklarından eş zamanlı sistoskopi ve\nyıllık BT Ürografi ile çok sıkı bir takip protokolüne alırım.\"</li>\n</ul>\n"}]}, {"n": 7, "t": "Böbrek Tümörleri (RCC) ve Kistik Hastalıklar", "s": [{"id": "7.1", "t": "Epidemiyoloji, Etyoloji ve Genetik Sendromlar", "h": "<h3 id=\"a-epi̇demi̇yoloji̇-ve-klasi̇k-ri̇sk-faktörleri̇\">A. EPİDEMİYOLOJİ VE\nKLASİK RİSK FAKTÖRLERİ</h3>\n<p>RCC, yetişkin kanserlerinin yaklaşık %2-3'ünü oluşturur ve erkeklerde\nkadınlara göre 1.5 - 2 kat daha sıktır. Olguların %95'i sporadik\n(kendiliğinden), %5'i ise ailesel (genetik sendromlar) kökenlidir.</p>\n<p>Majör Sporadik Risk Faktörleri:</p>\n<ol type=\"1\">\n<li><p>Sigara: Riski yaklaşık 2 kat artırır.</p></li>\n<li><p>Obezite: Böbrek kanseriyle en güçlü korelasyon gösteren\nfaktörlerden biridir. (Artmış östrojen, insülin direnci ve IGF-1 yolağı\nüzerinden).</p></li>\n<li><p>Hipertansiyon: Hem yüksek kan basıncının böbrek parankiminde\nyarattığı kronik hasar hem de bazı antihipertansif ilaçların\nmekanizmaları suçlanmaktadır.</p></li>\n<li><p>Kronik Böbrek Yetmezliği (Edinsel Kistik Böbrek Hastalığı): Uzun\nsüre (3-5 yıl) diyalize giren hastaların böbreklerinde kistler oluşur.\nBu hastaların RCC (özellikle papiller tip) geliştirme riski normal\npopülasyondan 30 kat fazladır.</p></li>\n</ol>\n<h3 id=\"b-şeffaf-hücreli̇-clear-cell-karsi̇nogenez-vhl-yolağı\">B. ŞEFFAF\nHÜCRELİ (CLEAR CELL) KARSİNOGENEZ: VHL Yolağı</h3>\n<p>Tüm RCC'lerin en sık görülen tipi (%70-80) Şeffaf Hücreli RCC\n(ccRCC)'dir. Bu tümörün genetik şifresi, 3. kromozomun kısa kolunda\n(3p25) bulunan Von Hippel-Lindau (VHL) tümör baskılayıcı geninin\ninaktivasyonudur.</p>\n<p>Mekanizma (Oksijen Yanılsaması):</p>\n<ul>\n<li><p>Normalde hücrede yeterli oksijen varken, VHL proteini\n\\HIF-1α<br />\n(Hipoksi İndüklenebilir Faktör) proteinini bağlar ve onu yıkıma\n(ubikütinasyon) götürür.</p></li>\n<li><p>Eğer VHL geni mutasyona uğrarsa veya susturulursa, hücrede\noksijen olsa BİLE \\HIF-1α yıkılamaz ve çekirdekte birikir.</p></li>\n<li><p>Hücre kendini \"sürekli oksijensiz (hipoksik) ortamda\" zanneder ve\nhayatta kalmak için yeni damar yapıcı faktörleri (\\VEGF, \\PDGF) ve\nglukoz taşıyıcılarını (\\GLUT-1) devasa miktarlarda sentezler.</p></li>\n<li><p><em>Sonuç:</em> İnanılmaz derecede kanlanan (hipervasküler), içi\nglikojen ve lipit dolu (mikroskopta şeffaf görünen) bir tümör ortaya\nçıkar. Modern TKI (Tirozin Kinaz İnhibitörü) ilaçlarının tamamı işte bu\naşırı üretilen \\VEGF reseptörlerini bloke etmek üzerine\nkuruludur.</p></li>\n</ul>\n<h3 id=\"c-hoca-vi̇zi̇ti̇ni̇n-belkemi̇ği̇-geneti̇k-sendromlar\">C. HOCA VİZİTİNİN\nBELKEMİĞİ: GENETİK SENDROMLAR</h3>\n<p>Eğer karşına genç yaşta (&lt;46), çift taraflı (bilateral) veya çok\nodaklı (multifokal) böbrek tümörü olan bir hasta gelirse, bu sporadik\nbir şanssızlık değil, bir sendromdur. Genetik tarama şarttır!</p>\n<h3 id=\"1-von-hippel-lindau-vhl-sendromu\">1. Von Hippel-Lindau (VHL)\nSendromu:</h3>\n<ul>\n<li>Karakteri: Otozomal dominant. Genç yaşta bilateral/multifokal Şeffaf\nHücreli RCC yapar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eşlik Edenler: Santral sinir sistemi ve retinada\nhemanjiyoblastomlar, feokromositoma, pankreas kistleri/nöroendokrin\ntümörleri.</li>\n</ul>\n<h3 id=\"1-birt-hogg-dubé-bhd-sendromu\">1. Birt-Hogg-Dubé (BHD)\nSendromu:</h3>\n<ul>\n<li>Karakteri: FLCN (Folliculin) gen mutasyonu. Hastalarda genellikle\nKromofob RCC ve Onkositom (veya ikisinin karışımı hibrid tümörler)\ngörülür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eşlik Edenler: Deride beyazımsı papüller (Fibrofoliküloma) ve\nakciğerde kistler (Genç yaşta Spontan Pnömotoraks hikayesi çok\ntipiktir).</li>\n</ul>\n<h3 id=\"1-herediter-papiller-rcc-hprcc\">1. Herediter Papiller RCC\n(HPRCC):</h3>\n<ul>\n<li>Karakteri: \\MET proto-onkogeninin aktivasyonu. Sadece bilateral,\nmultifokal Tip 1 Papiller RCC yapar. Başka organ tutulumu yoktur.</li>\n</ul>\n<h3 id=\"1-herediter-leiomyomatozis-ve-rcc-hlrcc\">1. Herediter\nLeiomyomatozis ve RCC (HLRCC):</h3>\n<ul>\n<li>Karakteri: \\FH (Fumarat Hidrataz) enzim mutasyonu. Krebs döngüsü\nbozulur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tehlikesi: Tip 2 Papiller RCC yapar. Bu tümörler VHL'nin aksine\ninanılmaz agresiftir; 1-2 cm iken bile hızla metastaz yaparlar. Erken ve\nradikal cerrahi şarttır. Deri ve uterusta miyomlar (leiomyom) eşlik\neder.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe 35 yaşında, acil serviste iki kez pnömotoraks\ntüpü takılmış, yüzünde sivilce benzeri beyaz lezyonları olan ve\nultrasonunda böbrek kitleleri saptanan bir hasta geldi. Hangi sendromu\ndüşünürsün ve tümörün patolojik tipi muhtemelen nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Akciğer kistleri (pnömotoraks), ciltteki fibrofolikülomalar\nve böbrek tümörü triyadı Birt-Hogg-Dubé (BHD) sendromunu gösterir.\nBöbrekteki kitle büyük ihtimalle Kromofob RCC veya Onkositomdur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"VHL sendromlu bir hastada 2 cm'lik böbrek tümörü saptadık.\nHemen ameliyat edelim mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. VHL hastalarında tümörler ömür boyu çıkmaya devam\nedeceği için her kitleye müdahale edemeyiz (hasta böbreksiz kalır).\nEAU/AUA kılavuzlarına göre bu hastalarda tümör çapı 3 cm'yi geçene kadar\nsadece yakın aktif izlem yapılır. 3 cm'yi aştığında ise nefron koruyucu\ncerrahi (Parsiyel Nefrektomi) uygulanır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Tip 1 Papiller RCC ile Tip 2 Papiller RCC'yi genetik\nsendromlar üzerinden nasıl ayırt edersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Tip 1, \\MET mutasyonlu HPRCC sendromunda görülür, daha\nyavaş seyirlidir ve iyi huylu olmaya meyillidir. Tip 2 ise \\FH<br />\nmutasyonlu HLRCC sendromunda görülür, inanılmaz derecede agresiftir ve\nküçük boyutta bile lenfatik/visseral metastaz yapar.\"</li>\n</ul>\n"}, {"id": "7.2", "t": "Histolojik Alt Tipler ve Patoloji", "h": "<h3 id=\"a-şeffaf-hücreli̇-karsi̇nom-clear-cell-rcc---ccrcc\">A. ŞEFFAF\nHÜCRELİ KARSİNOM (Clear Cell RCC - ccRCC)</h3>\n<p>Tüm böbrek kanserlerinin %70-80'ini oluşturur. En sık gördüğümüz, en\nçok metastaz yapan ve onkolojik çalışmaların (TKI ajanları) neredeyse\ntamamının üzerine kurulduğu \"klasik\" böbrek kanseridir.</p>\n<ul>\n<li><p>Köken: Proksimal kıvrımlı tübül epitelinden köken alır.</p></li>\n<li><p>Makroskopik Görünüm (Ameliyat Masası): Tümörü kestiğinde içi\naltın sarısı renktedir. Çünkü hücreler deli gibi lipit (yağ) ve\nkolesterol depolar. Sıklıkla içinde kanama (hemoraji) ve nekroz odakları\nbarındırır; bu da tümörün alacalı, kahverengi-sarı bir renkte\ngörünmesine neden olur.</p></li>\n<li><p>Mikroskopik Görünüm: Rutin H&amp;E (Hematoksilen-Eozin)\nboyamasında hücrelerin içindeki lipit ve glikojen çözülüp yıkandığı için\nsitoplazmaları tamamen \"şeffaf/boş\" (Clear) görünür. Hücre zarları çok\nbelirgindir, bitki hücresine benzerler. İnce, zengin bir damar ağıyla\n(hipervasküler) çevrilidirler (VHL yolağının VEGF üretimi\nnedeniyle).</p></li>\n</ul>\n<h3 id=\"b-papi̇ller-karsi̇nom-prcc\">B. PAPİLLER KARSİNOM (pRCC)</h3>\n<p>İkinci en sık görülen tiptir (%10-15). Karakteristik özelliği çok\nodaklı (multifokal) ve çift taraflı (bilateral) olmaya meyilli\nolmasıdır.</p>\n<ul>\n<li><p>Köken: Proksimal tübül.</p></li>\n<li><p>Makroskopik Görünüm: Şeffaf hücrelinin aksine sarı değil, daha\nsoluk, gri-beyaz renktedir. Sıklıkla sahte bir kapsülle (psödokapsül)\nçevrilidir. İçinde kanamadan ziyade nekroz ve kistik dejenerasyon sık\ngörülür.</p></li>\n<li><p>Mikroskopik Görünüm: Tümör hücreleri, ortasında damar ve bağ\ndokusu (fibrovasküler kor) bulunan parmak benzeri çıkıntılar\n(papillalar) oluşturur. Sıklıkla içinde Psammoma cisimcikleri\n(mikroskobik kalsifikasyonlar) bulunur.</p></li>\n<li><p>Kritik Alt Tipler (Kaderi Belirler):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 1: Hücreler tek sıralıdır, sitoplazmaları soluktur (bazofilik).\n\\MET mutasyonu ile ilişkilidir. Prognozu çok iyidir, yavaş büyür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 2: Hücreler çok sıralı (stratifike), çekirdekleri iridir ve\nsitoplazmaları pembedir (eozinofilik). VHL'den bile daha agresiftir, çok\nhızlı metastaz yapar ve prognozu kötüdür.</li>\n</ul>\n<h3 id=\"c-kromofob-karsi̇nom-chrcc\">C. KROMOFOB KARSİNOM (chRCC)</h3>\n<p>Tümörlerin %4-5'ini oluşturur. Ürologların patoloji raporunda görmeyi\nen çok sevdiği tiplerden biridir çünkü metastaz potansiyeli çok düşüktür\n(%5 civarı) ve prognozu mükemmeldir.</p>\n<ul>\n<li><p>Köken: Toplayıcı kanalların interkalar hücrelerinden köken\nalır.</p></li>\n<li><p>Makroskopik Görünüm: Soluk kahverengi (Tan renkli), çok iyi\nsınırlı, homojen ve solid kitlelerdir. Ortasında sıklıkla yıldız\nşeklinde bir skar (Santral stellat skar) bulunur (Bu skar Onkositom ile\nçok karışmasına neden olur!).</p></li>\n<li><p>Mikroskopik Görünüm: Hücreler çok büyüktür, bitki hücresine\nbenzer. Çekirdeklerinin etrafında karakteristik, soluk bir hale\n(Perinükleer Halo) bulunur.</p></li>\n<li><p>Ayırıcı Tanı (Hoca Sorusu): Kromofob mu, yoksa tamamen iyi huylu\nolan Onkositom mu? Bunu ayırmak için patolog Hale Kolloidal Demir\n(Hale's Colloidal Iron) boyası yapar. Kromofob RCC bu boyayla maviye\nboyanırken (pozitif), onkositom boyanmaz (negatif).</p></li>\n</ul>\n<h3 id=\"d-toplayici-kanal-belli̇ni̇-karsi̇nomu\">D. TOPLAYICI KANAL\n(BELLİNİ) KARSİNOMU</h3>\n<p>Ürolojik onkolojinin kabusudur. Olguların %1'inden azını oluşturur\nama teşhis konduğunda hastaların çoğu çoktan metastatik evrededir.</p>\n<ul>\n<li><p>Köken: Medulladaki (böbreğin derin kısımları) toplayıcı\nkanalların esas (principal) hücrelerinden köken alır.</p></li>\n<li><p>Klinik ve Patoloji: Böbreğin pelvisine doğru agresif bir şekilde\nbüyür, çok yoğun bağ dokusu (Desmoplazi) içerdiği için taş gibi serttir.\nKemoterapiye, radyoterapiye ve immünoterapiye dirençlidir. Sağkalım\ngenellikle aylar ile ifade edilir.</p></li>\n</ul>\n<h3 id=\"e-nükleer-derecelendi̇rme-whoisup-si̇stemi̇\">E. NÜKLEER\nDERECELENDİRME: WHO/ISUP SİSTEMİ</h3>\n<p>Geçmişte kullanılan Fuhrman sisteminin yerini 2016'dan beri WHO/ISUP\nNükleer Derecelendirme Sistemi almıştır. Bu sistem, tümörün hücresel\ndüzeyde ne kadar vahşileştiğini çekirdekçik (nükleol) yapısına bakarak\nbelirler. <em>Özellikle Şeffaf ve Papiller RCC için geçerlidir, Kromofob\niçin kullanılmaz.</em></p>\n<ul>\n<li><p>Grade 1: Nükleol 400x büyütmede (yüksek büyütme) bile görünmez.\n(Çok uysal).</p></li>\n<li><p>Grade 2: Nükleol 400x büyütmede görünür ancak 100x'te (küçük\nbüyütme) görünmez.</p></li>\n<li><p>Grade 3: Nükleol 100x küçük büyütmede bile kabak gibi görünür.\n(Agresif).</p></li>\n<li><p>Grade 4: Tümörde sarkomatoid diferansiyasyon, rabdoid özellikler\nveya dev, tuhaf çekirdekli (pleomorfik) hücreler vardır. (En ölümcül, en\nagresif form).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Ameliyatta çıkardığın böbreği ikiye kestin, tümörün içi\nsapsarı ve kanamalıydı. Hangi alt tipi düşünürsün ve neden o\nrenktedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Büyük ihtimalle Şeffaf Hücreli RCC (ccRCC)'dir. Sarı renk,\nhücrelerin içinde yoğun miktarda biriken lipit ve kolesterolden\nkaynaklanır. Hipervasküler olduğu için de içi kanama ve nekroz\ndoludur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Patoloji raporunda 'Santral stellat skarı olan, Hale\nkolloidal demir boyası ile pozitif boyanan hücreler' yazıyor. Bu tümör\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Santral skar hem iyi huylu Onkositom'da hem de Kromofob\nRCC'de görülür. Ancak Hale kolloidal demir boyası pozitifliği bizi kesin\nolarak Kromofob RCC tanısına götürür.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Eğer bir hastanın patoloji raporunda 'Sarkomatoid\nDiferansiyasyon' yazıyorsa, bu ayrı bir RCC alt tipi midir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Sarkomatoid diferansiyasyon ayrı bir histolojik alt\ntip değildir; şeffaf, papiller veya kromofob RCC'nin de-diferansiye\nolarak (özünü kaybederek) Grade 4 seviyesine ulaştığını, bağ dokusu/kas\nhücresine benzeyen çok vahşi bir forma dönüştüğünü gösterir. Sağkalımı\ndramatik olarak düşürür.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Papiller RCC (pRCC) tanısı alan bir hastada, evreleme (evre 1\nbile olsa) dışında neye mutlaka dikkat etmeliyiz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Tip 1 mi, Tip 2 mi olduğuna bakmalıyız. Çünkü pT1 (küçük)\nbir Tip 2 pRCC, çok daha büyük bir Tip 1'den bile daha ölümcül olabilir\nve adjuvan tedavi/yakın takip kararlarını doğrudan etkiler.\"</li>\n</ul>\n"}, {"id": "7.3", "t": "Klinik Prezantasyon ve Paraneoplastik Sendromlar", "h": "<h3 id=\"a-klasi̇k-tri̇yadin-çöküşü-ve-i̇nsi̇dantaloma-çaği\">A. KLASİK\nTRİYADIN ÇÖKÜŞÜ VE \"İNSİDANTALOMA\" ÇAĞI</h3>\n<p>Eskiden tıp fakültesinde öğretilen meşhur bir RCC triyadı (üçlemesi)\nvardı:</p>\n<h3 id=\"1-yan-ağrısı-flank-pain\">1. Yan Ağrısı (Flank pain)</h3>\n<h3 id=\"2-makroskopik-hematüri-kanlı-idrar\">2. Makroskopik Hematüri\n(Kanlı idrar)</h3>\n<h3 id=\"3-palpe-edilebilen-kitle-ele-gelen-kitle\">3. Palpe Edilebilen\nKitle (Ele gelen kitle)</h3>\n<p>2026 Gerçekliği: Günümüzde bu üçlünün bir arada görülme oranı %10'un\naltına inmiştir. Eğer bir hasta polikliniğe bu üçlüyle geliyorsa, o\nkitle muhtemelen devasa boyutlara ulaşmış, lokal ileri (T3/T4) veya\nçoktan metastatik (M1) evreye geçmiştir.</p>\n<ul>\n<li>Yeni Normal: Günümüzde böbrek tümörlerinin %60-70'i \"İnsidental\"\n(Tesadüfi) olarak saptanır. Hasta safra kesesi ağrısı, bel fıtığı veya\ncheck-up için Ultrason/BT çektirir ve radyolog rapora \"Sağ böbrek alt\npolde 4 cm solid kitle\" yazar. İnsidental saptanan tümörler genellikle\ndaha küçük boyutlu, daha düşük evreli ve sağkalımı çok daha\nyüksektir.</li>\n</ul>\n<h3 id=\"b-paraneoplasti̇k-sendromlar-pns-tıbbi-i̇llüzyonlar\">B.\nPARANEOPLASTİK SENDROMLAR (PNS): Tıbbi İllüzyonlar</h3>\n<p>RCC hastalarının yaklaşık %20-30'unda Paraneoplastik Sendrom\ngörülür.</p>\n<p><em>Kritik Kural:</em> Bu sendromlar, tümörün o organa (örneğin\nkaraciğere) metastaz yapmasından değil, kana salgıladığı kimyasallardan\nkaynaklanır. Tümörü (böbreği) çıkardığında sendrom tamamen düzelir. Eğer\naylar/yıllar sonra sendrom geri dönerse, bu metastazın veya lokal nüksün\nen güçlü kanıtıdır.</p>\n<h3 id=\"1-stauffer-sendromu-non-metastatik-hepatik-disfonksiyon\">1.\nStauffer Sendromu (Non-Metastatik Hepatik Disfonksiyon):</h3>\n<p>Asistan vizitlerinin ve Board sınavlarının en prestijli\nsorusudur.</p>\n<ul>\n<li><p>Klinik: Hastanın Karaciğer Fonksiyon Testleri (ALP, AST, ALT,\nBilirubin) tavan yapmıştır, protrombin zamanı (PT) uzamıştır, hatta\nhepatosplenomegali vardır. Ancak BT çekersin, karaciğerde HİÇBİR\nmetastaz yoktur.</p></li>\n<li><p>Mekanizma: Tümörün devasa miktarda salgıladığı İnterlökin-6\n(IL-6) sitokininin karaciğerde yarattığı toksik ve enflamatuar\netkidir.</p></li>\n<li><p>Yönetim: Nefrektomi yaparsın, 1-2 ay içinde karaciğer enzimleri\nmucizevi bir şekilde tamamen normale döner.</p></li>\n</ul>\n<h3 id=\"2-hiperkalsemi-en-sık-görülen-pns\">2. Hiperkalsemi (En Sık\nGörülen PNS):</h3>\n<p>Hastaların yaklaşık %10-20'sinde görülür. Letarji, kabızlık, aritmi\nve komaya kadar gidebilir.</p>\n<ul>\n<li>Mekanizma: Tümör, PTHrP (Parathormon İlişkili Peptit) salgılar. Bu\npeptit, tıpkı gerçek parathormon gibi kemiklerdeki kalsiyumu kana çeker.\nLaboratuvarda kalsiyum yüksek, gerçek PTH ise (baskılandığı için)\n<em>düşük</em> gelir.</li>\n</ul>\n<h3 id=\"3-polisitemi-eritrositoz--kan-fazlalığı\">3. Polisitemi\n(Eritrositoz / Kan Fazlalığı):</h3>\n<ul>\n<li>Mekanizma: Böbrek zaten vücudun Eritropoietin (EPO) fabrikasıdır.\nÖzellikle hipoksi yolağı bozulan (VHL mutasyonlu) Şeffaf Hücreli RCC,\nkana kontrolsüzce Ektopik EPO salgılar. Hastanın hemoglobini 18-20'lere\nçıkar. Yüzü kıpkırmızı (pletore) olur, tromboz riski artar.</li>\n</ul>\n<h3 id=\"4-hipertansiyon\">4. Hipertansiyon:</h3>\n<p>Renin salgılayan hücrelerin kontrolsüzlüğü veya devasa tümörün renal\narteri dışarıdan sıkıştırıp böbreği iskemide bırakması (Goldblatt\nEtkisi) sonucu inatçı hipertansiyon görülür.</p>\n<h3 id=\"c-anatomi̇k-uyaricilar-vi̇zi̇ti̇n-altin-bi̇lgi̇si̇-vari̇kosel\">C.\nANATOMİK UYARICILAR (VİZİTİN ALTIN BİLGİSİ): VARİKOSEL</h3>\n<p>Polikliniğe 50 yaşında bir adam geldi, \"Hocam sol yumurtalığımda\ndamarlar şişti\" diyor. Muayene ediyorsun, Sol Varikosel var. Normalde\nvarikosel genç yaşta görülür.</p>\n<ul>\n<li><p>Kritik Hamle: Hastayı sedyeye yatırıp (supin pozisyon) beklersin.\nİdiyopatik (normal) varikosel yatınca boşalır ve kaybolur. Ancak bu\nhastada yatmasına rağmen varikosel KAYBOLMUYOR (Non-redükte).</p></li>\n<li><p>Mekanizma: Sol testis veni, sol böbrek venine dik açıyla dökülür.\nEğer böbrekteki bir RCC, sol böbrek veninin içine kadar büyüyüp damarı\ntıkadıysa (Tümör Trombüsü), testisten gelen kan yukarı çıkamaz ve\ngöllenir.</p></li>\n<li><p>Kural: İleri yaşta aniden ortaya çıkan, özellikle sağ tarafta\nolan veya yatınca geçmeyen (non-redükte) sol varikoselde <em>aksi ispat\nedilene kadar</em> BT ile böbrek tümörü (RCC tümör trombüsü)\naranmalıdır!</p></li>\n</ul>\n<h3 id=\"d-b-semptomlari-ve-prognoz\">D. B-SEMPTOMLARI VE PROGNOZ</h3>\n<p>Kilo kaybı, gece terlemesi, dirençli ateş (enfeksiyon olmadan) ve\nkaşeksi. Eğer hastada sistemik enflamasyona bağlı bu semptomlar ve\nlaboratuvarda Anemi, yüksek Sedimentasyon (ESR) veya yüksek CRP varsa,\nbu tümörün biyolojik olarak çok agresif olduğunu ve sağkalım şansının\ndüşük olduğunu gösterir.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe makroskopik hematüri ile gelen bir hastada,\nkanamanın mesaneden (ürotelyal karsinom) mi yoksa böbrekten (RCC) mi\nkaynaklandığını sadece pıhtının şekline bakarak nasıl tahmin\nedersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Mesane kanamalarındaki pıhtılar genellikle amorf, düzensiz\nve parçalıdır. Ancak böbrek parankiminden kanayan bir tümörün kanı,\nüreterden aşağı inmek zorunda kalır. Üreterin şeklini alarak donduğu\niçin 'Solucan' veya 'Erişte' şeklinde (Vermiform pıhtı) uzun ince\npıhtılar olarak idrara dökülür.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastada paraneoplastik sendrom olması, tümörün evresini (TNM)\notomatik olarak yükseltir veya inoperabl (ameliyat edilemez) yapar\nmı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Paraneoplastik sendromlar T, N veya M evresini\ndoğrudan etkilemez. Küçük (T1) bir tümör bile sistemik sendrom yapabilir\nve cerrahi ile tamamen kür sağlanabilir. Ancak istatistiksel olarak, PNS\nvarlığı tümörün yüksek dereceli (High-Grade) ve biyolojik olarak agresif\nolma ihtimaliyle koreledir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Stauffer Sendromu olan bir hastayı ameliyat ettik, karaciğer\nenzimleri normale döndü. 2 yıl sonra rutin kontrolde AST/ALP tekrar\nyükseldi. Gastroenterolojiye mi yollarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Asla. Eğer başka bariz bir sebep (hepatit, alkol) yoksa,\nStauffer sendromunun geri dönmesi RCC'nin nüks ettiğinin (lokal nüks\nveya uzak metastaz) en spesifik klinik bulgularından biridir. Acilen\nevreleme amaçlı toraks ve batın BT çektiririm.\"</li>\n</ul>\n"}, {"id": "7.4", "t": "Görüntüleme, Bosniak Sınıflaması ve Renal Biyopsi", "h": "<h3 id=\"a-altin-standart-tri̇fazi̇k-çok-fazli-bt-ve-hounsfield-kurali\">A.\nALTIN STANDART: TRİFAZİK (ÇOK FAZLI) BT VE HOUNSFIELD KURALI</h3>\n<p>Böbrek kitlelerinde tek bir kontrastsız tomografi hiçbir işe yaramaz.\nKitlenin kontrast tutup tutmadığını (Enhancement), yani \"kanlanıp\nkanlanmadığını\" kanıtlamak zorundasın. Kanser dokusu, VHL yolağı\nnedeniyle yeni damarlar (anjiogenez) yarattığı için kontrast maddeyi\nemer ve parlar.</p>\n<ul>\n<li>Fazlar:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Kontrastsız Faz: Kitlenin temel yoğunluğu (Hounsfield Unit - HU)\nölçülür. Yağ, kalsifikasyon veya kanama aranır.</p></li>\n<li><p>Kortikomedüller Faz (30-40. sn): Damarların ve korteksin en net\nparladığı an. Arteriyel anatomi (cerrahi planlama için) ve venöz tümör\ntrombüsü haritalanır.</p></li>\n<li><p>Nefrografik Faz (90-120. sn): Böbrek parankiminin tamamen homojen\nboyandığı, böbrek kitlelerini saptamak için en duyarlı olan fazdır. 4.\nEkskretuar (Atılım) Fazı (5-7. dk): Kontrastın idrara (toplayıcı\nsisteme) geçtiği faz. Kitlenin toplayıcı sisteme (pelvis/kaliks) girip\ngirmediği görülür.</p></li>\n</ol>\n<ul>\n<li>Hounsfield Unit (HU) Kuralı: Bir kitlenin kontrastsız HU değeri ile\nkontrastlı HU değeri arasındaki fark &gt;15-20 HU ise, bu kitle kontrast\ntutuyordur. Aksi ispat edilene kadar Solid Kitle = RCC (Böbrek Kanseri)\nkabul edilir.</li>\n</ul>\n<h3\nid=\"b-bosni̇ak-siniflamasi-2019-güncellemesi-kistik-kitlelerin-kaderi\">B.\nBOSNİAK SINIFLAMASI (2019 Güncellemesi): Kistik Kitlelerin Kaderi</h3>\n<p>Her böbrek kitlesi solid (katı) değildir. İçi sıvı dolu kistik\nkitlelerin kanserleşme riskini belirleyen ve cerrahi endikasyonu\nkoyduran dünyadaki tek geçerli sistemdir (BT ve MR bazlıdır).</p>\n<ul>\n<li><p>Bosniak I (Basit Kist): Duvarı incecik, septası/kireçlenmesi\nolmayan, su yoğunluğunda (&lt;20 HU) kist. <em>Kanser riski: %0. Tedavi:\nDokunma, takip bile etme.</em></p></li>\n<li><p>Bosniak II (Minimal Komplike Kist): Birkaç tane incecik septa\n(bölme) veya duvarda incecik kireçlenme var. Ölçülebilir kontrast\ntutulumu yok. <em>Kanser riski: %1-2. Tedavi: Dokunma.</em></p></li>\n<li><p>Bosniak IIF (F = Follow-up / Takip): Septa sayısı daha fazla,\nduvar/septa biraz kalın ama hala ölçülebilir kontrast tutulumu yok.\n<em>Kanser riski: %5-10. Tedavi: Ameliyat edilmez, ancak büyüme var mı\ndiye 6. ayda, sonra yıllık BT/MR ile sıkı takip edilir.</em></p></li>\n<li><p>Bosniak III (Belirsiz Kistik Kitle): Duvarında veya septalarında\nkalınlaşma ve net olarak ölçülebilir kontrast tutulumu (&gt;15 HU artış)\nvardır. <em>Kanser riski: %50. Tedavi: Kılavuzlar Parsiyel Nefrektomi\nveya güçlü bir şüphede Renal Biyopsi önerir.</em></p></li>\n<li><p>Bosniak IV (Kistik Kanser): Kistin içinde duvar/septa haricinde,\nnet olarak kontrast tutan solid/nodüler bileşen vardır. <em>Kanser\nriski: %90-100. Tedavi: Doğrudan Cerrahi (Parsiyel veya Radikal\nNefrektomi).</em></p></li>\n</ul>\n<h3 id=\"c-renal-ki̇tle-bi̇yopsi̇si̇-rmb-efsanelerin-çöküşü\">C. RENAL KİTLE\nBİYOPSİSİ (RMB): Efsanelerin Çöküşü</h3>\n<p>Geçmişte ürologlar böbrek tümörlerine iğne batırmaktan çok korkardı.\nEfsane şuydu: <em>\"İğneyi sokarsak kanser hücreleri iğne hattına ekilir\n(Tract Seeding) veya kitle kanar.\"</em> 2026 Gerçekliği: EAU\nkılavuzları, modern \"Koaksiyel (Kılıflı) Kor Biyopsi\" tekniği ile iğne\nyolu ekilmesi riskinin %0.01'den (on binde bir) daha az olduğunu ve\nmajör kanama riskinin ihmal edilebilir düzeyde olduğunu kanıtlamıştır.\nBiyopsi artık masadaki en güçlü silahlarımızdan biridir.</p>\n<p>EAU/AUA Biyopsi Endikasyonları (Kime Biyopsi Yapmalıyız?):</p>\n<ol type=\"1\">\n<li><p>Küçük Renal Kitlelerde (SRM, &lt;4 cm): Hastayı \"Aktif İzlem\"\nprotokolüne almadan veya fokal tedavi (Kriyoterapi/RFA) ile yakmadan\nönce tanıyı kesinleştirmek için ZORUNLUDUR.</p></li>\n<li><p>Metastatik RCC (mRCC): Hasta cerrahi olamayacak kadar yaygın\nhastalığa sahipse, sistemik tedaviye (TKI/İmmünoterapi) başlamak için\npatolojik doku tanısı şarttır.</p></li>\n<li><p>Başka Organ/Sistem Şüphesi: Görüntüleme böbrek lenfomasını,\napseyi veya akciğer/meme kanserinin böbreğe sıçramasını (metastazını)\ndüşündürüyorsa gereksiz böbrek alımını önlemek için yapılır.</p></li>\n</ol>\n<ul>\n<li><em>Kime YAPILMAZ?</em> Hasta zaten genç, kitle 7 cm, kontur dışına\ntaşıyor ve cerrahiye kesin uygunsa; biyopsi kararı değiştirmez, hasta\ndoğrudan ameliyata alınır.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe BT raporuyla bir hasta geldi: 'Böbrekte 3 cm'lik\nBosniak Tip IIF kist'. Hasta çok panik, 'Hemen ameliyat edin' diyor. Ne\nyaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hastayı ameliyat etmem. Bosniak IIF (Follow-up) kistlerin\nonkolojik kuralı sıkı takiptir. Hastaya kanser riskinin düşük olduğunu\nanlatır, 6. ayda MR veya trifazik BT ile kistin kontrastlanan\nseptalarında kalınlaşma (Tip III'e kayma) olup olmadığını kontrol\nederim.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Böbrek kitle biyopsisinde İnce İğne Aspirasyon Biyopsisi\n(FNA) mi tercih edersin, Kor (Kalın İğne) Biyopsi mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kesinlikle Kor Biyopsi (18-Gauge). İnce iğne aspirasyonu\nsadece hücreleri çeker (sitoloji), ancak böbrek tümörlerinde\nFuhrman/ISUP nükleer derecelendirmesi yapmak ve histolojik alt tipi\n(Şeffaf vs. Kromofob) anlamak için dokunun mimari yapısını (histoloji)\nbütün olarak görmemiz şarttır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Kontrastsız BT'de bir böbrek kitlesinin Hounsfield (HU)\nyoğunluğu -40 (Eksi Kırk) geldi. Ne düşünürsün?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Eksi değerli HU yoğunluğu YAĞ (Lipit) dokusunu gösterir.\nBöbrekte makroskopik yağ içeren bir kitle gördüğümde aklıma ilk olarak\niyi huylu bir tümör olan Anjiyomiyolipom (AML) gelir. Genellikle kanser\n(RCC) ekarte edilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hasta böbrek yetmezliğinde (Kreatinin 3.0), trifazik BT için\niyotlu kontrast madde veremiyoruz. MR için de Gadolinyum kontrendike\n(Nefrojenik Sistemik Fibrozis riski). Kitleyi nasıl evreleyeceğiz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu çok zorlu bir senaryodur. Yeni nesil kontrast maddeler\nkullanılabilirliği tartışılsa da, en güvenli alternatif Kontrastlı\nUltrasonografi (CEUS - Contrast-Enhanced Ultrasound) kullanmaktır.\nCEUS'ta kullanılan mikro-kabarcıklar böbrekten değil akciğerlerden\nsolunumla atıldığı için nefrotoksik değildir ve kitlenin damarlanmasını\nçok net gösterir.\"</li>\n</ul>\n"}, {"id": "7.5", "t": "Benign (İyi Huylu) Böbrek Tümörleri", "h": "<h3 id=\"a-anji̇yomi̇yoli̇pom-aml-yağ-kas-ve-kanayan-damarlar\">A.\nANJİYOMİYOLİPOM (AML): Yağ, Kas ve Kanayan Damarlar</h3>\n<p>Böbreğin en sık görülen iyi huylu solid tümörüdür. Adı üstünde, üç\nfarklı dokudan oluşur: Kan damarları (Anjiyo), düz kas (Miyo) ve olgun\nyağ dokusu (Lipom).</p>\n<h3 id=\"1-radyolojik-tanı-altın-kural\">1. Radyolojik Tanı (Altın\nKural):</h3>\n<p>Bir kitlede makroskopik yağ dokusu (Kontrastsız BT'de -20 ile -80\nHounsfield Unit / HU arası değer) saptarsan, o kitle aksi ispat edilene\nkadar AML'dir. Kanser (RCC) makroskopik yağ içermez! (RCC sadece\nmikroskopik hücre içi lipit içerir).</p>\n<h3 id=\"2-i̇ki-farklı-klinik-senaryo\">2. İki Farklı Klinik Senaryo:</h3>\n<ul>\n<li><p>Sporadik (Klasik) Tip: Olguların %80'idir. Genellikle orta yaşlı\nkadınlarda, tek taraflı ve soliter (tek) görülür.</p></li>\n<li><p>Tüberoskleroz Kompleksi (TSC) İlişkili Tip: Olguların %20'sidir.\nGenellikle genç yaşta, çift taraflı (bilateral) ve çok odaklıdır. Bu\nhastaların yüzünde sivilce benzeri lezyonlar (adenoma sebaseum), zeka\ngeriliği ve epilepsi (epileptik nöbetler) vardır. TSC1 (Hamartin) veya\nTSC2 (Tüberin) gen mutasyonu, mTOR yolağını aşırı aktive ederek bu\ntümörleri devasa boyutlara ulaştırır.</p></li>\n</ul>\n<h3 id=\"3-kabus-senaryosu-wunderlich-sendromu\">3. Kabus Senaryosu:\nWunderlich Sendromu</h3>\n<p>AML iyi huyludur ama masum değildir. İçindeki damarlar (\"anjiyo\"\nkısmı) elastin tabakasından yoksun, zayıf ve anevrizmatik (balonlaşmış)\nyapıdadır. Tümör büyüdükçe bu damarlar aniden yırtılır ve böbrek\netrafına (retroperitona) devasa, hayatı tehdit eden spontan bir kanama\nyapar. Buna Wunderlich Sendromu denir. Hasta aniden başlayan şiddetli\nyan ağrısı ve hipovolemik şok ile acile gelir.</p>\n<h3 id=\"4-eauaua-20252026-yönetim-kılavuzu\">4. EAU/AUA 2025/2026 Yönetim\nKılavuzu:</h3>\n<ul>\n<li><p>Takip: Çapı &lt; 4 cm ve asemptomatik olanlar (hamilelik\nplanlamayanlarda) sadece yıllık USG/BT ile izlenir.</p></li>\n<li><p>Müdahale (Kime Dokunmalıyız?): * Çapı \\&gt; 4 cm\nolanlar.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İntratümöral anevrizma çapı \\&gt; 5 mm olanlar (Rüptür riski en\nyüksek grup!).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Semptomatik olanlar (Ağrı, kanama).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Çocuk doğurma çağındaki kadınlar (Hamilelikte artan kan hacmi ve\nöstrojen/progesteron, rüptür riskini inanılmaz artırır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>Tedavi Seçenekleri: Altın standart cerrahi değil, radyoloji\nünitesinde yapılan Selektif Arteriyel Embolizasyon'dur. Kitleyi besleyen\ndamar tıkanır, kitle küçülür. Cerrahi (Parsiyel Nefrektomi) sadece\nembolizasyon yapılamadığında veya RCC şüphesi dışlanamadığında (Yağdan\nfakir AML) yapılır.</p></li>\n<li><p><em>Medikal Onkoloji:</em> Tüberoskleroz ilişkili dev AML'lerde\nameliyat yerine mTOR inhibitörleri (Everolimus) verilerek kitlenin\nsistemik olarak küçültülmesi kılavuzlara girmiştir.</p></li>\n</ul>\n<h3 id=\"b-onkosi̇tom-oncocytoma-büyük-taklitçi\">B. ONKOSİTOM\n(ONCOCYTOMA): Büyük Taklitçi</h3>\n<p>Böbrek tübüllerindeki interkalar (araya giren) hücrelerden köken\nalan, tamamen iyi huylu ama bizi en çok çileden çıkaran tümördür.</p>\n<ul>\n<li><p>Morfoloji: Hücreleri ağzına kadar mitokondri ile doludur (bu\nyüzden mikroskopta çok pembe/eozinofilik görünür).</p></li>\n<li><p>Radyolojik Tuzak: BT veya MR'da çok tipik bir \"Santral Stellat\nSkar\" (Ortası yıldız şeklinde nedbe) ve anjiyografide \"Tekerlek İzi\"\n(Spoke-wheel) damarlanma paterni görülür.</p></li>\n<li><p>Neden Baş Belasıdır? Çünkü bu \"Santral Skar\" görüntüsü, son\nderece kötü huylu bir kanser olan Kromofob RCC'de de görülür! Ne yazık\nki, ameliyat öncesi BT/MR veya klasik iğne biyopsisi ile Onkositom'u\nKromofob RCC'den %100 kesinlikle ayırmak imkansızdır. Bu belirsizlik\nyüzünden, Onkositom şüphesi olan hastalar mecburen kansermiş gibi kabul\nedilip (Parsiyel veya Radikal Nefrektomi) ameliyat edilir. Kesin tanı\nanca ameliyat sonrası patoloğun yapacağı özel boyamalarla (Hale\nKolloidal Demir negatifliği) konur.</p></li>\n</ul>\n<h3 id=\"c-jukstaglomerüler-hücreli̇-tümör-reninoma\">C. JUKSTAGLOMERÜLER\nHÜCRELİ TÜMÖR (Reninoma)</h3>\n<p>Son derece nadirdir ama textbooklarda çok spesifik bir kliniği olduğu\niçin bilinmesi şarttır.</p>\n<ul>\n<li><p>Genellikle genç erişkinlerde ve kadınlarda görülür.\nJukstaglomerüler aparattan köken aldığı için kana kontrolsüzce Renin\npompalar.</p></li>\n<li><p>Klinik Triyad: Şiddetli ve dirençli sekonder Hipertansiyon +\nHipokalemi (Düşük potasyum) + Genç yaş.</p></li>\n<li><p>Tedavisi kitle eksizyonudur; böbreği kurtarmak (Parsiyel\nNefrektomi) tansiyonu anında normale döndürür.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe BT raporuyla bir hasta geldi. Kitle solid,\nkontrast tutuyor ama radyolog 'Makroskopik yağ izlenmedi' yazmış. Yine\nde bu kitlenin iyi huylu bir Anjiyomiyolipom (AML) olma ihtimali var\nmıdır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Evet, vardır. Buna 'Yağdan Fakir AML' (Lipid-poor AML)\ndenir. Tüm AML'lerin yaklaşık %5'i makroskopik yağ içermez ve radyolojik\nolarak Şeffaf Hücreli RCC'yi birebir taklit eder. Bu durumda tanıyı\nkoymak için kitleye Kor Biyopsi yapmak EAU kılavuzlarında önerilen en\nmantıklı yaklaşımdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"AML şüphesi olan 38 yaşında kadın hasta. Kitle 5 cm. Hasta 3\naylık hamile. Selektif arteriyel embolizasyon mu yaparsın, yoksa\nameliyat mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu gerçek bir klinik ikilemdir. Hasta hamile olduğu için\nradyasyon içeren anjiyografi/embolizasyon yapılamaz (Fetal toksisite). 5\ncm'lik AML hamilelikte artan kan hacmiyle yırtılmaya (Wunderlich) çok\nmüsaittir. Genellikle kadın doğum ile konsey yapılarak, rüptür\nengellenmesi adına 2. trimesterde retroperitoneal laparoskopik/açık\nParsiyel Nefrektomi veya çok sıkı yatak istirahati ve USG takibi\nplanlanmalıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Böbrekte Onkositom tespit ettik, ancak ameliyat öncesi iğne\nbiyopsisi yaparsak RCC'den ayıramayacağımızı söylüyorsun. Neden?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Çünkü her iki tümör (Onkositom ve Kromofob RCC) aynı\nhücreden (Toplayıcı kanal interkalar hücre) köken alır ve mikroskobik\nolarak birbirlerine çok benzerler. Ayrıca, Birt-Hogg-Dubé sendromunda\nolduğu gibi, aynı kitlenin içinde hem onkositom hem kromofob RCC\nhücrelerinin bir arada bulunduğu 'Hibrid Onkositik Tümörler' vardır.\nKalın iğne (Kor) biyopsisi kitlenin sadece bir kısmını örneklediği için,\naldığımız yer iyi huylu görünse bile yan taraftaki kötü huylu (kanser)\nhücreleri atlamış olabiliriz.\"</li>\n</ul>\n"}, {"id": "7.6", "t": "Küçük Renal Kitleler (SRM) - İzlem ve Fokal Tedaviler", "h": "<h3 id=\"a-küçük-renal-ki̇tle-srm-nedi̇r-ve-bi̇yoloji̇si̇-nasildir\">A. KÜÇÜK\nRENAL KİTLE (SRM) NEDİR VE BİYOLOJİSİ NASILDIR?</h3>\n<ul>\n<li><p>Tanım: Radyolojik olarak kontrast tutan, solid ve çapı ≤ 4 cm\n(Klinik evre T1a) olan kitlelerdir.</p></li>\n<li><p>Biyolojik Gerçekler (Vizitin Temeli):</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Cerrahiyle çıkarılan SRM'lerin yaklaşık %20-25'i iyi huyludur\n(Onkositom, yağdan fakir AML vb.).</p></li>\n<li><p>Kanser (RCC) olsalar bile, çoğu çok düşük dereceli (Grade 1-2) ve\nson derece yavaş büyüyen (yılda ortalama 2-3 mm) tümörlerdir.</p></li>\n<li><p>3 cm'nin altındaki bir kitlenin metastaz yapma ihtimali %1-2'den\ndüşüktür.</p></li>\n</ol>\n<p>Bu veriler ışığında, her T1a kitleye anında \"Parsiyel Nefrektomi\"\nkararı vermek, özellikle yaşlı hastalarda gereksiz böbrek yetmezliği ve\nmorbidite yaratmaktır.</p>\n<h3 id=\"b-akti̇f-i̇zlem-active-surveillance---as\">B. AKTİF İZLEM (ACTIVE\nSURVEILLANCE - AS)</h3>\n<p>Tıpkı prostat kanserinde olduğu gibi, böbrekte de \"Dokunma, sadece\nizle\" protokolümüz var. Ancak buradaki mantık organı korumaktan ziyade,\n<em>komorbiditesi yüksek hastayı ameliyatın yükünden\nkorumaktır.</em></p>\n<ul>\n<li>İdeal Aday Kimdir? * İleri yaşlı (&gt;75 yaş).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ciddi kardiyovasküler, pulmoner ek hastalığı olan (ASA skoru yüksek)\nve anestezi riski taşıyanlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yaşam beklentisi 5 yıldan kısa olanlar (Kanserden değil, kalpten\nölme ihtimali daha yüksek olanlar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Protokol Nasıl İşler?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İlk yıl 3-6 ayda bir, sonraki yıllarda yıllık USG veya BT/MR ile\nkitlenin boyutu ölçülür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ne Zaman Müdahale Edilir (Trigger)?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kitlenin büyüme hızı yılda 5 mm'yi (0.5 cm) aşarsa.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kitle çapı 4 cm sınırını geçerse.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hastanın anksiyetesi dayanılmaz boyuta ulaşırsa.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kritik EAU Kuralı: Aktif izlem kararı almadan önce, kitlenin\ngerçekten ne olduğunu bilmek ve büyüme potansiyelini öngörebilmek için\n(iyi huyluysa hastayı rahatlatmak adına) Renal Kitle Biyopsisi şiddetle\nönerilir.</li>\n</ul>\n<h3 id=\"c-fokal-tedavi̇ler-ablasyon\">C. FOKAL TEDAVİLER (ABLASYON)</h3>\n<p>Hasta ameliyatı kaldıramayacak kadar yaşlı/hasta, ancak kitle hızlı\nbüyüyor veya hasta izlemde kalmak istemiyor. İşte o zaman sahneye\nGirişimsel Radyoloji ve fokal ablasyon cihazları çıkar. İğneyle ciltten\n(perkütan) girilerek kitle olduğu yerde imha edilir.</p>\n<h3 id=\"1-kriyoterapi-dondurarak-yok-etme\">1. Kriyoterapi (Dondurarak\nYok Etme):</h3>\n<ul>\n<li><p>Mekanizma: İğne (prob) kitleye saplanır ve ucundan Argon gazı\nverilir. Doku aniden -40°C ile -80°C arasına soğutulur. Hücre içindeki\nsu donup buz kristallerine dönüşür, hücre zarı parçalanır ve hücreler\nosmotik şok ile ölür.</p></li>\n<li><p>Avantajı: İşlem sırasında oluşan \"Buz Topu\" (Ice ball) BT ve\nUSG'de çok net görünür, cerrah nereyi dondurduğunu milimetrik olarak\ntakip edebilir. Özellikle böbreğin içine gömülü (endofitik) kitlelerde\nçok başarılıdır.</p></li>\n</ul>\n<h3 id=\"2-radyofrekans-ablasyon-rfa---yakarak-yok-etme\">2. Radyofrekans\nAblasyon (RFA - Yakarak Yok Etme):</h3>\n<ul>\n<li><p>Mekanizma: Yüksek frekanslı alternatif akım ile dokudaki iyonlar\ntitreştirilir ve sürtünme ısısı yaratılır. Doku 60-100°C arasına\nısıtılarak koagülasyon nekrozu oluşturulur.</p></li>\n<li><p>Dezavantajı (Isı Havuzu / Heat Sink Etkisi): Eğer kitle böbreğin\nmerkezindeki büyük damarlara (renal arter/ven) yakınsa, kanın hızlı\nakışı ısıyı alıp götürür. İstenen sıcaklığa ulaşılamaz ve damar\nkenarında canlı kanser hücreleri kalabilir. Bu yüzden RFA daha çok dışa\ndoğru büyüyen (ekzofitik) kitlelerde tercih edilir.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Kriyoterapi uyguladığımız bir hastayı 6. ayda BT ile kontrole\nçağırdık. Eski kitlenin yerinde 2 cm'lik bir lezyon duruyor. Bu işlemin\nbaşarısız olduğunu mu gösterir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Fokal tedavilerde kitle vücut dışına çıkarılmaz,\nsadece yeri skar (nedbe) dokusuna döner. Başarı kriterimiz kitlenin yok\nolması değil, kontrast tutulumunun (enhancement) kaybolmasıdır. Eğer\nkitle trifazik BT'de kontrast tutmuyorsa (&lt;15 HU artış), işlem\nbaşarılıdır. Kontrast tutuyorsa orada canlı tümör (rezidü/nüks) kalmış\ndemektir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"70 yaşında bir hastada 2.5 cm T1a kitle var. Fokal tedavi\n(Kriyo/RFA) ile Parsiyel Nefrektomi arasında onkolojik sonuçlar\naçısından fark var mıdır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kanser spesifik sağkalım oranları her iki yöntemde de\nbenzerdir ve mükemmeldir (&gt;%95). Ancak fokal tedavilerin en büyük\nzayıflığı, lokal nüks (aynı yerde tekrar çıkma) oranının cerrahiye göre\nanlamlı derecede daha yüksek olmasıdır. Bu yüzden sağlıklı hastalarda\naltın standart hala Parsiyel Nefrektomi'dir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Kitle üretere veya toplayıcı sisteme çok yakın. Kriyoterapi\nyaparken üreterin donup nekroza gitmesini (fistül açılmasını) nasıl\nengellersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İşlemden hemen önce sistoskopi ile hastaya bir Retrograd\nÜreter Kateteri (Açık uçlu veya Double-J) takarım. Kriyoterapi işlemi\nboyunca bu kateterden içeri sürekli sıcak/ılık serum fizyolojik yıkarak\n(irrigasyon) üreteri içeriden ısıtır ve buz topunun üretere zarar\nvermesini engellerim.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Fokal ablasyon yapacağımız hastaya neden öncesinde mutlaka\nkitle biyopsisi yapmalıyız?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Çünkü ablasyon yaptığımızda kitle patoloji kavanozuna değil,\nvücudun içinde kalıp kömürleşiyor/buzlaşıyor. Elimizde histolojik bir\ndoku olmuyor. Eğer ileride tümör metastaz yaparsa, elimizde alt tipi\n(Şeffaf mı, Papiller mi?) ve genetiğini bilemediğimiz bir düşman kalır.\nHedefe yönelik ilaçları (TKI) seçebilmek için biyopsi ablasyon öncesi\nzorunludur.\"</li>\n</ul>\n"}, {"id": "7.7", "t": "Lokalize RCC Cerrahisi - Parsiyel vs. Radikal Nefrektomi", "h": "<h3 id=\"a-parsi̇yel-nefrektomi̇-nephron-sparing-surgery---nss\">A. PARSİYEL\nNEFREKTOMİ (Nephron-Sparing Surgery - NSS)</h3>\n<p>Sadece tümörün, etrafındaki milimetrik bir sağlam dokuyla birlikte\nçıkarılıp, geriye kalan sağlıklı böbrek parankiminin korunduğu\ncerrahidir.</p>\n<p>Endikasyonlar (Kime Yapılır?):</p>\n<ol type=\"1\">\n<li><p>Mutlak Endikasyonlar: Hastanın tek böbreği varsa, bilateral (iki\ntaraflı) tümörü varsa veya zaten kronik böbrek yetmezliği (KBY)\nhastasıysa. Radikal nefrektomi hastayı diyalize mahkum edeceği için\nparsiyel \"zorunludur\".</p></li>\n<li><p>Rölatif Endikasyonlar: Karşı böbrek sağlam ama ileride bozulma\nriski yüksekse (Diyabet, Hipertansiyon, Taş hastalığı veya genç\nhasta).</p></li>\n<li><p>Elektif Endikasyonlar (Altın Standart): Karşı böbrek tamamen\nsağlıklı olsa bile, teknik olarak yapılabilecek konumdaki tüm T1a (≤ 4\ncm) ve uygun T1b (4-7 cm) tümörlerde EAU kılavuzları Parsiyel\nNefrektomiyi <em>ilk seçenek (standart)</em> olarak önerir.</p></li>\n</ol>\n<p>Cerrahi Sınır (Margin) Ne Kadar Olmalı?</p>\n<p>Eskiden 1 cm sağlam doku alma kuralı vardı. Günümüzde onkolojik kural\nşudur: \"Sınırın negatif olması yeterlidir.\" 1 milimetrelik sağlam doku\n(hatta tümörü kendi yalancı kapsülü etrafından sıyırmak - Tümör\nEnükleasyonu) ile 1 santimetrelik rezeksiyonun kanser nüksü açısından\nhiçbir farkı yok
