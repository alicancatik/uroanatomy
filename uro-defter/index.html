rekir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Low Energy (Joule) / High Frequency (Hz): DUSTING (Tozlama). Taşı un\nufak eder. Spontan düşsün istersin.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Retropulsion (Geri İtme): Enerji arttıkça taş yukarı (böbreğe)\nkaçar. Bunu engellemek için frekansı artırıp enerjiyi düşürmelisin.</li>\n</ul>\n<h3 id=\"2-thulium-fiber-lazer-tfl---yeni-nesil\">2. Thulium Fiber Lazer\n(TFL - Yeni Nesil):</h3>\n<ul>\n<li><p>Daha ince fiberler, daha az retropulsion, daha hızlı\ntozlama.</p></li>\n<li><p>Holmium \"kaba kuvvet\" ise, Thulium \"neşter\" gibidir. Yumuşak doku\n(Prostat/Darlık) kesiminde daha etkilidir.</p></li>\n</ul>\n<h3 id=\"e-kilavuz-teller-guidewires\">E. KILAVUZ TELLER (Guidewires)</h3>\n<p>Bir üroloğun en iyi dostu. Üretere giremezsen ameliyat biter.</p>\n<ol type=\"1\">\n<li><p>PTFE (Teflon) Teller: Serttir, kaygandır ama kıvrılmaz. İlk\ngirişte kullanılır.</p></li>\n<li><p>Hidrofilik (Su seven) Teller: (Örn: Glidewire). Islanınca çok\nkayganlaşır. Darlık geçmek için idealdir.</p></li>\n<li><p>Sert (Stiff/Amplatz) Teller: Eğilip bükülmez. Üzerinden ağır\naletler (Dilatör, Access Sheath) göndermek için \"tren rayı\" görevi\ngörür.</p></li>\n<li><p>Zebra Tel: Üzerinde çizgiler vardır. Endoskopide telin hareket\nedip etmediğini (yerinden çıkıp çıkmadığını) anlamanı sağlar.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Mesane yan duvar tümörünü rezeke ederken bacak aniden sıçradı\n(Adduktor Spazm). Neden?\"</li>\n</ol>\n<ul>\n<li>Cevap: Obturator Sinir Refleksi. Mesane yan duvarının hemen dışından\nObturator Sinir geçer. Koter akımı siniri uyarır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Çözüm:</em> Bipolar kullanmak (daha az yayılır), kas gevşetici\nistemek veya Obturator Blok yapmak. Asla zorlama, mesaneyi\ndelersin!</li>\n</ul>\n<h3 id=\"1-soru-lazer-fiberini-taşa-ne-kadar-yaklaştırmalısın\">1. Soru:\n\"Lazer fiberini taşa ne kadar yaklaştırmalısın?\"</h3>\n<ul>\n<li>Cevap: \"Sıfıra yakın ama dokunmadan (0.5 - 1 mm). Eğer fiberi taşa\ngömersen fiber ucu yanar ve kırılır (Geriye doğru yanma -\nBurnback).\"</li>\n</ul>\n<h3\nid=\"1-soru-foley-sondanın-üzerindeki-5-15-cc-yazısı-neyi-ifade-eder\">1.\nSoru: \"Foley sondanın üzerindeki '5-15 cc' yazısı neyi ifade eder?\"</h3>\n<ul>\n<li>Cevap: Balonun şişirilmesi gereken sıvı miktarını. Asla hava ile\nşişirme (söner veya emboli riski). Saf su veya SF ile şişir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Rigid Sistoskop ile Flexible Sistoskop arasındaki en büyük\nfark nedir (Hasta konforu dışında)?\"</li>\n</ol>\n<ul>\n<li><p>Cevap: Flexible ile mesane boynunu ve kendi girdiğin deliği bile\ngeriye dönüp görebilirsin (Retroflexion). Rigid ile bu\nimkansızdır.</p></li>\n<li></li>\n</ul>\n"}]}, {"n": 2, "t": "Üriner Sistem Enfeksiyonları ve Enflamatuar Durumlar", "s": [{"id": "2.1", "t": "Sınıflandırma, Patogenez ve Tanımlar", "h": "<p>Enfeksiyon yönetiminde ilk kural: Düşmanını ve Savaş Alanını\nTanı.</p>\n<h3 id=\"a-eau-ve-cdc-tanimlari-sınav-sorusu\">A. EAU VE CDC TANIMLARI\n(Sınav Sorusu)</h3>\n<p>İYE (İdrar Yolu Enfeksiyonu) tek bir hastalık değildir. Şu 3 kavramı\nbirbirinden net ayırmalısın:</p>\n<h3 id=\"1-bakteriüri-enfeksiyon-değil\">1. Bakteriüri (Enfeksiyon\nDeğil!):</h3>\n<ul>\n<li><p>İdrarda bakteri olmasıdır. Semptom yoksa Asemptomatik Bakteriüri\n(ABU) denir.</p></li>\n<li><p><em>Klinik Kural:</em> Gebeler ve ürolojik girişim yapılacaklar\n(kanamalı işlem) HARİÇ tedavi edilmez! (Yaşlı teyzelerin idrarı kokuyor\ndiye antibiyotik verme).</p></li>\n</ul>\n<h3 id=\"2-komplike-olmayan-basit-i̇ye\">2. Komplike Olmayan (Basit)\nİYE:</h3>\n<ul>\n<li><p>Kimde: Premenopozal, gebe olmayan, anatomik ve fonksiyonel üriner\nsistem anomalisi olmayan, ek hastalığı (Diyabet/İmmunsupresyon) olmayan\nKADINLAR.</p></li>\n<li><p><em>Özet:</em> Sağlıklı kadınların sistiti.</p></li>\n</ul>\n<h3 id=\"3-komplike-i̇ye-herkes-buraya-girer\">3. Komplike İYE (Herkes\nBuraya Girer!):</h3>\n<ul>\n<li>Kimde:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>ERKEKLER (Erkek İYE'si her zaman komplike kabul edilir!).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gebeler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Çocuklar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Anatomik Bozukluk (Taş, Darlık, BPH, Kist).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Fonksiyonel Bozukluk (Nörojenik Mesane, VUR).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İmmunsupresyon (Diyabet, Steroid kullanımı, Transplant).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kateteri olanlar (CAUTI).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Önemi:</em> Bu hastalarda ampirik tedavi (tek doz Fosfomisin\nvb.) yetmez. Genellikle kültür sonucu beklenir veya geniş spektrumlu\nbaşlanır, görüntüleme (USG/BT) gerekir.</li>\n</ul>\n<h3 id=\"b-tekrarlayan-rekürren-i̇ye-tanimi\">B. TEKRARLAYAN (REKÜRREN) İYE\nTANIMI</h3>\n<p>Bu tanım matematikseldir.</p>\n<ul>\n<li><p>Tanım: Son 6 ayda ≥ 2 veya son 1 yılda ≥ 3 kez kültürle\nkanıtlanmış İYE atağı.</p></li>\n<li><p>Relaps (Nüks) vs Re-enfeksiyon (Yeni Enfeksiyon):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Relaps: Tedavi bittikten sonraki 2 hafta içinde, AYNI mikroorganizma\nile tekrar enfeksiyon. (Tedavi yetersizliği, taş içine saklanmış bakteri\nveya kronik prostatit).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Re-enfeksiyon: Tedaviden 2 hafta sonra veya FARKLI bir\nmikroorganizma ile enfeksiyon. (Yeni bulaş).</li>\n</ul>\n<h3 id=\"c-patogenez-bakteri̇-vs-konak-savaşın-tarafları\">C. PATOGENEZ:\nBAKTERİ VS. KONAK (Savaşın Tarafları)</h3>\n<p>Bakteri yukarı tırmanmak ister, vücut onu aşağı atmak ister.</p>\n<h3 id=\"1-bakterinin-silahları-virülans-faktörleri\">1. Bakterinin\nSilahları (Virülans Faktörleri)</h3>\n<p>E.coli'nin en büyük silahı Fimbria (Pili) denilen \"kancalar\"dır.</p>\n<ul>\n<li><p>Tip 1 Fimbria: Mesane epiteline (Mannoz reseptörlerine) tutunur\n-&gt; SİSTİT yapar.</p></li>\n<li><p>P-Fimbria (Gal-Gal Pili): Böbrek epiteline tutunur -&gt;\nPİYELONEFRİT yapar. (P harfinden hatırla: P-fimbria =\nPyelonefrit).</p></li>\n<li><p>K-Antijeni: Kapsüldür. Fagositozu (nötrofilin yemesini)\nengeller.</p></li>\n<li><p>Hemolizin: Dokuyu parçalar, demir kaynağı sağlar.</p></li>\n<li><p>Üreaz Enzimi: (Proteus, Klebsiella, Pseudomonas). Üreyi parçalar\n-&gt; Amonyak oluşturur -&gt; İdrar pH'ı artar (Alkali olur) -&gt;\nMagnezyum Amonyum Fosfat (STRUVİT) Taşı oluşur.</p></li>\n</ul>\n<h3 id=\"2-konağın-savunması-bizim-silahlarımız\">2. Konağın Savunması\n(Bizim Silahlarımız)</h3>\n<ul>\n<li><p>İdrar Akımı (Washout): En önemli savunmadır! (İşemek bakteriyi\natar). Tıkanıklık (Taş/BPH) bu yüzden enfeksiyon yapar.</p></li>\n<li><p>Tamm-Horsfall Proteini (Uromodulin):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Henle kulpundan salgılanır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Görevi:</em> Bakterinin Tip 1 fimbriasını bağlar (\"Yalancı\nreseptör\" gibi davranır). Bakteri mesane duvarı yerine bu proteine\nyapışır ve işerken atılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>İdrar pH ve Ozmolaritesi: Asidik ve yoğun idrar bakteriyi\nbozar.</p></li>\n<li><p>Vajinal Flora (Laktobasil): Asidik pH sağlar. Menopozda östrojen\nazalınca Laktobasil ölür -&gt; pH artar -&gt; E.coli kolonizasyonu\nartar. (Postmenopozal İYE nedeni).</p></li>\n</ul>\n<h3 id=\"d-mi̇krobi̇yoloji̇-olağan-şüpheli̇ler\">D. MİKROBİYOLOJİ: OLAĞAN\nŞÜPHELİLER</h3>\n<p>Kültür sonucu çıkmadan antibiyotik başlayacaksan düşmanı tahmin\netmelisin.</p>\n<h3 id=\"1-toplum-kökenli-evden-gelen\">1. Toplum Kökenli (Evden\nGelen):</h3>\n<ul>\n<li><p>E. coli (%75-90): Tartışmasız lider.</p></li>\n<li><p>Staph. saprophyticus (%5-15): Genç, cinsel aktif kadınlarda\n(\"Balayı Sistiti\").</p></li>\n<li><p>Klebsiella, Proteus, Enterococcus.</p></li>\n</ul>\n<h3 id=\"2-hastane-kökenli-nozokomiyal\">2. Hastane Kökenli\n(Nozokomiyal):</h3>\n<ul>\n<li><p>E. coli (%50): Hala en sık ama oranı düşer.</p></li>\n<li><p>Pseudomonas aeruginosa: Sonda takılan, yoğun bakımda yatan\nhastalarda. (Yeşil idrar!).</p></li>\n<li><p>Klebsiella, Enterobacter, Serratia, Candida (Mantar).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastanın idrar kültüründe <em>Proteus mirabilis</em> üredi.\nAklına ilk ne gelmeli?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Taş (Struvit) şüphesi. Proteus üreaz pozitiftir, idrarı\nalkali yapar ve taş oluşturur. Görüntüleme (USG/BT) istemeliyiz çünkü\ntaş temizlenmeden enfeksiyon bitmez (Relaps yapar).\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Erkek hastada ilk kez sistit oldu. 'Basit sistit' deyip\ngeçebilir miyiz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Erkeklerde üretra uzundur ve prostat sıvısı\nantibakteriyeldir (Çinko içerir). Enfeksiyon olması zordur. Olduysa\naltta yatan bir neden (BPH, Darlık, Taş) vardır. Mutlaka Komplike İYE\nolarak değerlendirip görüntüleme yapmalıyız.\"</li>\n</ul>\n<h3 id=\"1-soru-diyabetik-hastada-i̇ye-neden-daha-sık-ve-şiddetli-olur\">1.\nSoru: \"Diyabetik hastada İYE neden daha sık ve şiddetli olur?\"</h3>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Glikozüri: İdrarda şeker bakteri için besi yeridir.</p></li>\n<li><p>Nöropati: Mesane tam boşalamaz (Rezidü idrar kalır).</p></li>\n<li><p>İmmunsupresyon: Nötrofil fonksiyonları bozuktur.</p></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Soru: \"Piyelonefrit yapan E.coli ile Sistit yapan E.coli aynı\nmıdır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Genetik olarak farklıdır. Piyelonefritojenik suşlarda\nP-Fimbria ve Hemolizin üretimi daha fazladır.\"</li>\n</ul>\n"}, {"id": "2.2", "t": "Alt Üriner Sistem Enfeksiyonları (Sistit ve Üretrit)", "h": "<h3 id=\"a-akut-si̇sti̇t-mesane-enfeksiyonu\">A. AKUT SİSTİT (Mesane\nEnfeksiyonu)</h3>\n<p>Genellikle bakteriyeldir. Mesane mukozasının (ürotelyum) yüzeyel\nenfeksiyonudur.</p>\n<h3 id=\"1-klinik-tablo-semptomlar\">1. Klinik Tablo (Semptomlar)</h3>\n<ul>\n<li><p>Dizüri: İdrar yaparken yanma (En sık).</p></li>\n<li><p>Pollaküri: Sık idrara çıkma.</p></li>\n<li><p>Urgency: Ani sıkışma hissi.</p></li>\n<li><p>Suprapubik Ağrı: Göbek altı hassasiyet.</p></li>\n<li><p>Koku ve Bulanıklık: (Hematüri %30 görülebilir - <em>Hemorajik\nSistit</em>).</p></li>\n<li><p><em>⚠️ Önemli Ayrım:</em> Ateş, Yan ağrısı (böğür ağrısı),\nBulantı/Kusma YOKTUR. Varsa Piyelonefrit düşün!</p></li>\n</ul>\n<h3 id=\"2-tanı\">2. Tanı</h3>\n<ul>\n<li><p>Komplike Olmayan (Genç Kadın): Semptomlar tipikse Kültür\nGEREKMEZ. Tam İdrar Tahlili (TİT) yeterlidir (Lökosit esteraz ve Nitrit\npozitifliği).</p></li>\n<li><p>Komplike (Erkek, Gebe, Rekürren, Şüpheli): Mutlaka KÜLTÜR\nalınmalıdır.</p></li>\n</ul>\n<h3 id=\"3-tedavi-eau-birinci-basamak---first-line\">3. Tedavi (EAU\nBirinci Basamak - \"First Line\")</h3>\n<p>Antibiyotik süreleri kısadır (Doku penetrasyonuna gerek yok, idrarda\nbirikmesi yeter).</p>\n<h3 id=\"1-fosfomisin-trometamol-monurol\">1. Fosfomisin Trometamol\n(Monurol):</h3>\n<ul>\n<li><em>Doz:</em> 3g Tek Doz (Gece yatarken, mesane boş, dolu mideye\ndeğil).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Avantaj:</em> Hasta uyumu mükemmel. Direnç düşük.</li>\n</ul>\n<h3 id=\"1-nitrofurantoin-piyeloseptyl\">1. Nitrofurantoin\n(Piyeloseptyl):</h3>\n<ul>\n<li><em>Doz:</em> 50-100 mg, günde 3-4 kez, 5 gün. (Makrokristal formu\ngünde 2 kez).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ Hoca Sorusu:</em> \"Piyelonefritte Nitrofurantoin verilir\nmi?\"</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cevap:</em> HAYIR! Çünkü sadece idrarda yoğunlaşır, böbrek\ndokusuna geçmez (Doku penetrasyonu zayıf). Ayrıca GFR &lt; 30 ise etkisi\nyoktur, verilmez.</li>\n</ul>\n<ol type=\"1\">\n<li>Pivmecillinam: Türkiye'de az bulunur ama EAU çok sever (Penisilin\ntürevi).</li>\n</ol>\n<ul>\n<li>ALTERNATİF (İkinci Basamak):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sefalosporinler (Sefuroksim, Sefiksim).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>SAKINILMASI GEREKEN (Son Çare):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Florokinolonlar (Siprofloksasin/Levofloksasin). Sadece piyelonefrite\nveya prostatite sakla!</li>\n</ul>\n<h3 id=\"b-tekrarlayan-rekürren-si̇sti̇t-yöneti̇mi̇\">B. TEKRARLAYAN\n(REKÜRREN) SİSTİT YÖNETİMİ</h3>\n<p>Yılda 3'ten fazla sistit olan kadına sürekli antibiyotik yazıp\ngönderemezsin. Koruyucu strateji gerekir.</p>\n<ol type=\"1\">\n<li>Davranışsal: Su içimi artırılmalı (&gt;2.5 L), cinsel ilişki sonrası\nişenmeli (Post-coital voiding).</li>\n</ol>\n<h3 id=\"2-i̇mmüno-profilaksi-aşı-benzeri\">2. İmmüno-Profilaksi (Aşı\nbenzeri):</h3>\n<ul>\n<li>OM-89 (Uro-Vaxom): E.coli lizatıdır (Oral tablet). Bağışıklığı\nuyarır. EAU güçlü önerir. (3 ay kullanım).</li>\n</ul>\n<h3 id=\"1-antibiyotik-profilaksisi-son-çare\">1. Antibiyotik Profilaksisi\n(Son çare):</h3>\n<ul>\n<li>İlişki sonrası tek doz (Nitrofurantoin 50mg veya TMP-SMX).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Veya 6 ay boyunca her gece düşük doz.</li>\n</ul>\n<h3 id=\"c-üretri̇t-erkeklerde-akıntı\">C. ÜRETRİT (Erkeklerde Akıntı)</h3>\n<p>Genç, cinsel aktif erkeklerde en sık İYE nedenidir. İkiye ayrılır:\nGonokoksik (Bel Soğukluğu) ve Non-Gonokoksik (NGU).</p>\n<h3 id=\"1-gonokoksik-üretrit-etken-neisseria-gonorrhoeae\">1. Gonokoksik\nÜretrit (Etken: <em>Neisseria gonorrhoeae</em>)</h3>\n<ul>\n<li><p>Kuluçka: Kısa (2-5 gün).</p></li>\n<li><p>Akıntı: PÜRELAN! (Sarı-Yeşil, Krema kıvamında, bol\nmiktarda).</p></li>\n<li><p>Gram Boyama: Lökositler <em>içinde</em> Gram (-) Diplokoklar\n(Kahve çekirdeği şeklinde).</p></li>\n<li><p>Risk: Tedavi edilmezse Üretra Darlığı yapar!</p></li>\n</ul>\n<h3 id=\"2-non-gonokoksik-üretrit-ngu\">2. Non-Gonokoksik Üretrit\n(NGU)</h3>\n<ul>\n<li><p>Etkenler: <em>Chlamydia trachomatis</em> (%50), <em>Mycoplasma\ngenitalium</em>, <em>Ureaplasma urealyticum</em>,\n<em>Trichomonas</em>.</p></li>\n<li><p>Kuluçka: Uzun (1-3 hafta).</p></li>\n<li><p>Akıntı: MUKOİD! (Şeffaf, camsı, su gibi, az miktarda). Genelde\nsabahları \"damla\" şeklinde (Bonjour damlası).</p></li>\n<li><p>Tanı: İlk idrar PCR (Sabah ilk idrarın ilk 10-20 cc'si). <em>Orta\nakım idrarı verilmez, bakteri yıkanır gider!</em></p></li>\n</ul>\n<h3 id=\"3-tedavi-çiftli-tedavi---dual-therapy\">3. Tedavi (Çiftli Tedavi\n- \"Dual Therapy\")</h3>\n<p>Eskiden tek ilaç verilirdi, şimdi direnç yüzünden ikili veriyoruz. Eş\ntedavisi şarttır!</p>\n<ul>\n<li>Protokol:</li>\n</ul>\n<h3 id=\"1-seftriaksone-rocephin-1g-im-tek-doz---gonore-için\">1.\nSeftriaksone (Rocephin): 1g IM (Tek Doz) -&gt; <em>Gonore\niçin.</em></h3>\n<ol start=\"2\" type=\"1\">\n<li>Doksisiklin (Tetradox/Monodoks): 100 mg 2x1 (7 gün) -&gt;\n<em>Klamidya için.</em></li>\n</ol>\n<ul>\n<li><em>Alternatif:</em> Azitromisin 1g Tek Doz (Ama Mikoplazma direnci\narttığı için Doksisiklin artık ilk tercih).</li>\n</ul>\n<h3 id=\"d-kadinlarda-üretral-sendrom\">D. KADINLARDA ÜRETRAL SENDROM</h3>\n<p>Kültür negatif, akıntı yok ama hasta \"İşerken yanıyorum, sanki jilet\nişiyorum\" diyor.</p>\n<ul>\n<li><p>Nedenler: Vajinit, Herpes (HSV), Atrofik Vajinit (Menopozda),\nSabun/Deterjan irritasyonu.</p></li>\n<li><p>Tedavi: Nedene yöneliktir. Gereksiz antibiyotik verme.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Sistit tedavisinde neden Siprofloksasin (Cipro) ilk tercih\ndeğil?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>E.coli direnci çok yüksek (%30-40).</p></li>\n<li><p>\"Collateral Damage\" (Yan hasar) fazla. Bağırsak florasını kalıcı\nbozuyor.</p></li>\n<li><p>Tendon rüptürü ve Aort anevrizması riski var (FDA\nuyarısı).</p></li>\n<li><p>Piyelonefrit gibi daha ciddi enfeksiyonlar için\nsaklanmalı.</p></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Soru: \"Erkek hasta, akıntısı yok ama 'İdrar kanalında\nkaşıntı/karıncalanma var' diyor. Ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu NGU (Klamidya/Mikoplazma) için tipik bir ön belirtidir.\nAkıntı olmasa bile PCR veya sürüntü alıp Doksisiklin tedavisi\ndüşünülür.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sistit tedavisi verdin, hasta 3 gün sonra geldi. Yanması\ngeçti ama 'İdrarımda hala kan var' diyor. Ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Mesane Tümörü alarmı! Enfeksiyon (Sistit) bazen tümörün\nüzerindeki nekrozdan veya tümörün kendisinden kaynaklanabilir.\nEnfeksiyon geçse bile hematüri (özellikle sigara içen veya &gt;40 yaş\nhastada) devam ediyorsa mutlaka Sistoskopi yapılmalıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Gebede sistit tedavisinde hangi ilaçlar GÜVENLİ, hangileri\nYASAK?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Güvenli (Kategori B): Fosfomisin, Nitrofurantoin (Son trimester\nhariç - Hemoliz riski), Sefalosporinler, Penisilinler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yasak: Kinolonlar (Kıkırdak hasarı - Kategori C/D), Tetrasiklinler\n(Diş/Kemik hasarı - Kategori D), TMP-SMX (İlk trimesterda folat\neksikliği - Kategori C).</li>\n</ul>\n<h3 id=\"1-soru-klamidya-neden-kültürde-üremez\">1. Soru: \"Klamidya neden\nkültürde üremez?\"</h3>\n<ul>\n<li>Cevap: Çünkü Zorunlu Hücre İçi Parazittir. Virüs gibi yaşar, besi\nyerinde (agar) büyümez. Tanı PCR veya hücre kültürü (McCoy) ile\nkonur.</li>\n</ul>\n"}, {"id": "2.3", "t": "Üst Üriner Sistem Enfeksiyonları (Piyelonefrit)", "h": "<h3 id=\"a-akut-pi̇yelonefri̇t-böbreğin-ateşi\">A. AKUT PİYELONEFRİT:\n\"Böbreğin Ateşi\"</h3>\n<p>Bakterilerin (genellikle çıkan yolla) renal parankime ve pelvise\nulaşmasıdır.</p>\n<h3 id=\"1-klinik-triad-olmazsa-olmazlar\">1. Klinik Triad (Olmazsa\nOlmazlar):</h3>\n<ul>\n<li><p>Ateş: (&gt;38°C), Titreme (Rigors).</p></li>\n<li><p>Yan Ağrısı: (Flank Pain).</p></li>\n<li><p>Bulantı/Kusma: (Sistitte olmaz! Bu varsa sistemik tutulum\nvardır).</p></li>\n<li><p>Fizik Muayene: KVA (Kostovertebral Açı) Hassasiyeti pozitiftir.\n(Sırta vurduğunda hasta zıplar).</p></li>\n</ul>\n<h3 id=\"2-tanı-ve-görüntüleme-ne-zaman-bt-çekelim\">2. Tanı ve\nGörüntüleme (Ne Zaman BT Çekelim?)</h3>\n<ul>\n<li><p>Basit Piyelonefrit (Genç Kadın): Klinik + İdrar Kültürü\nyeterlidir. Görüntüleme şart değil (Eğer tedaviye 72 saatte yanıt\nvermezse çekilir).</p></li>\n<li><p>Komplike Piyelonefrit (Erkek, Taş öyküsü, Diyabet): Mutlaka\nKontrastlı BT çekilmelidir.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>BT Bulgusu:</em> \"Kama Şeklinde (Wedge-shaped) Hipoperfüzyon\nAlanları\". (Böbrek alacalı bulacalı görünür, ödemli olduğu için kontrast\ntutamaz).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>USG:</em> Böbrek büyük (ödemli) görünür, kortikomedüller ayrım\nsilinir ama BT kadar hassas değildir.</li>\n</ul>\n<h3 id=\"3-yatış-endikasyonları-kimi-eve-gönderemezsin\">3. Yatış\nEndikasyonları (Kimi Eve Gönderemezsin?)</h3>\n<ul>\n<li><p>İnatçı kusma (Oral ilaç alamıyor).</p></li>\n<li><p>Hemodinamik instabilite (Sepsis bulguları, Tansiyon düşük,\nTaşikardik).</p></li>\n<li><p>Gebelik.</p></li>\n<li><p>Obstrüksiyon şüphesi (Taş + Enfeksiyon = ACİL DRENAJ!).</p></li>\n<li><p>Sosyal güvencesi/desteği olmayan, takibe gelemeyecek\nhasta.</p></li>\n</ul>\n<h3 id=\"4-tedavi-protokolü-eau-2025\">4. Tedavi Protokolü (EAU 2025)</h3>\n<ul>\n<li><p>Süre: 7-14 gün (Sistit gibi 3 günde bitmez!).</p></li>\n<li><p>Ayaktan:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Siprofloksasin / Levofloksasin (Eğer yerel direnç &lt;%10 ise).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eğer direnç yüksekse: Başlangıçta 1 doz Seftriakson (IM/IV) veya\nAminoglikozid yapıp, oral devam et.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yatarak:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sefalosporinler (Seftriakson 2g, Sefepim).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Piperasilin-Tazobaktam (Tazocin): Psödomonas riski varsa.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Karbapenemler (Meropenem): ESBL (+) veya Sepsis tablosunda.</li>\n</ul>\n<h3 id=\"b-özel-ve-tehli̇keli̇-formlar-asistanın-kabusu\">B. ÖZEL VE\nTEHLİKELİ FORMLAR (Asistanın Kabusu)</h3>\n<p>Bunlar \"biraz antibiyotik verelim geçer\" denecek hastalıklar\ndeğildir.</p>\n<h3 id=\"1-renal-apse\">1. RENAL APSE</h3>\n<p>Piyelonefritin tedavi edilmemesi veya yetersiz tedavisi sonucu\nparankim dokusunun eriyip püy (irin) dolu bir boşluğa dönüşmesidir.</p>\n<ul>\n<li><p>Kortikal Apse (Renal Karbunkül): Genelde hematojen yayılımdır (S.\naureus - Cilt enfeksiyonu/IV ilaç bağımlısı).</p></li>\n<li><p>Kortikomedüller Apse: Genelde asendan yolla (İdrar yoluyla) gelen\nE. coli/Klebsiella.</p></li>\n<li><p>Tedavi:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>&lt; 3 cm: Sadece Antibiyotik ile takip edilebilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>3-5 cm: Perkütan Drenaj (Girişimsel Radyoloji) + Antibiyotik.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>&gt; 5 cm veya Çoklu: Cerrahi Drenaj gerekebilir.</li>\n</ul>\n<h3 id=\"2-amfi̇zematoz-pi̇yelonefri̇t-gazlı-böbrek\">2. AMFİZEMATOZ\nPİYELONEFRİT (Gazlı Böbrek)</h3>\n<p>Hayatı tehdit eden, nekrotizan bir enfeksiyondur.</p>\n<ul>\n<li><p>Kimde Olur? Kontrolsüz DİYABETİK hastalarda (Kandaki yüksek\nglikoz fermantasyona uğrar).</p></li>\n<li><p>Etken: Gaz oluşturan bakteriler (<em>E. coli,\nKlebsiella</em>).</p></li>\n<li><p>Tanı: BT'de böbrek parankimi içinde veya çevresinde HAVA (Gaz)\ngörülür.</p></li>\n<li><p>Tedavi (Sınıflamaya göre - Wan Sınıflaması):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 1 (Sadece toplayıcı sistemde gaz): Antibiyotik + Drenaj (JJ\nStent).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 2 (Parankimde gaz): Perkütan Drenaj + Antibiyotik.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 3-4 (Yaygın gaz, Böbrek fonksiyonu yok): ACİL NEFREKTOMİ!\n(Beklersen hasta ölür).</li>\n</ul>\n<h3 id=\"3-ksantogranülomatöz-pi̇yelonefri̇t-xgp\">3. KSANTOGRANÜLOMATÖZ\nPİYELONEFRİT (XGP)</h3>\n<p>Böbreğin kronik, yıkıcı, granülomatöz iltihabıdır.</p>\n<ul>\n<li><p>Mekanizma: Genelde obstrüktif bir taş (Geyik boynuzu) zemininde\ngelişir. Makrofajlar bakteriyi yutar ama sindiremez, yağ yüklenir (Köpük\nHücreleri - Foam Cells).</p></li>\n<li><p>Görüntüleme (BT): \"Ayı Pençesi\" (Bear Paw Sign) görünümü.\nGenişlemiş kalisler ve incelmiş parankim.</p></li>\n<li><p>Klinik Tuzak: Radyolojik olarak Böbrek Tümörü (RCC) ile karışır!\nPsoas kasına yapışır, lenfleri büyütür. Tanı genelde patolojide\nkonur.</p></li>\n<li><p>Tedavi: Nefrektomi. (Antibiyotikle düzelmez, böbrek fonksiyonunu\nkaybetmiştir).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Piyelonefrit tanısıyla yatırdığın hastanın ateşi 72. saatte\n(3. gün) hala düşmedi. Ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Komplikasyon gelişmiş olabilir (Apse, Obstrüksiyon, Dirençli\nBakteri). Mutlaka Kontrol Görüntüleme (Kontrastlı BT) çekerim. Apse\nvarsa drene ederim, taş varsa stent takarım.\"</li>\n</ul>\n<h3 id=\"1-soru-gebede-akut-piyelonefrit-neden-tehlikelidir\">1. Soru:\n\"Gebede akut piyelonefrit neden tehlikelidir?\"</h3>\n<ul>\n<li>Cevap: Erken doğum eylemini tetikler, bebekte sepsise yol açabilir\nve anne ARDS (Akut Solunum Sıkıntısı) riskine girer. Mutlaka yatırılarak\ntedavi edilmelidir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Taşlı Piyelonefrit (Obstrüktif Piyelonefrit) neden Ürolojik\nAcildir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Tıkanıklık arkasında biriken enfekte idrar (Piyonefroz),\nkapalı bir apse gibi davranır. Antibiyotik oraya ulaşamaz. Basınç\narttıkça bakteriler kana karışır (Ürosepsis).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kural: 'Pus under pressure' (Basınç altındaki irin) boşaltılmalıdır.\nAcil JJ Stent veya Perkütan Nefrostomi takılmazsa hasta %40 mortalite\nriski taşır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"XGP (Ksantogranülomatöz Piyelonefrit) ameliyatında bizi\nbekleyen en büyük tehlike nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Enflamasyon nedeniyle böbrek çevre dokulara (Vena Cava,\nDuodenum, Kolon, Psoas) yapışıktır. Diseksiyon çok zordur, majör damar\nyaralanması veya bağırsak fistülü riski yüksektir. Genellikle açık\ncerrahi tercih edilir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"İdrar kültüründe üreme olmadı ama hasta piyelonefrit\nkliniğinde. 'Steril Piyüri' (Lökosit var, bakteri yok) nedenleri\nnelerdir?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Daha önce antibiyotik kullanımı (Yarım tedavi).</p></li>\n<li><p>Böbrek Tüberkülozu.</p></li>\n<li><p>Taş hastalığı.</p></li>\n<li><p>Atipik bakteriler (Klamidya, Üreaplasma).</p></li>\n<li><p>Tümör.</p></li>\n</ol>\n"}, {"id": "2.4", "t": "Prostatit Sendromları ve Kronik Pelvik Ağrı", "h": "<h3 id=\"a-nih-siniflamasi-ezberlenecek-tablo\">A. NIH SINIFLAMASI\n(Ezberlenecek Tablo)</h3>\n<p>Eskiden \"Abakteriyel Prostatit\" denilip geçilirdi. 1999'dan beri NIH\n(Amerikan Ulusal Sağlık Enstitüsü) sınıflaması kullanıyoruz.</p>\n<h3 id=\"1-kategori-i-akut-bakteriyel-prostatit\">1. Kategori I: Akut\nBakteriyel Prostatit</h3>\n<ul>\n<li>Klinik: Ateş, titreme, Perineal/Suprapubik Ağrı, İşeme zorluğu\n(Glob).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Durum: ACİL serviste görülür. Sistemik enfeksiyondur.</li>\n</ul>\n<h3 id=\"1-kategori-ii-kronik-bakteriyel-prostatit\">1. Kategori II:\nKronik Bakteriyel Prostatit</h3>\n<ul>\n<li>Klinik: Tekrarlayan İYE atakları (Relaps). Ataklar arasında hasta\nrahattır ama idrar kültüründe AYNI bakteri ürer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Neden: Bakteriler prostat taşları veya duktusları içine saklanır\n(Biyofilm).</li>\n</ul>\n<ol type=\"1\">\n<li>Kategori III: Kronik Pelvik Ağrı Sendromu (CPPS) - %90 Hasta\nBuradadır!</li>\n</ol>\n<ul>\n<li>Klinik: En az 3 aydır devam eden pelvik ağrı + İşeme\nsemptomları.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Özellik: Standart kültürlerde ÜREME YOKTUR.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Alt Tipler:</em></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>IIIa (Enflamatuar): Prostat sıvısında (EPS) veya VB3'te Lökosit\nVAR.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>IIIb (Non-Enflamatuar): Lökosit YOK. (Buna artık \"Prostatodynia\"\ndeniyor).</li>\n</ul>\n<h3 id=\"1-kategori-iv-asemptomatik-enflamatuar-prostatit\">1. Kategori\nIV: Asemptomatik Enflamatuar Prostatit</h3>\n<ul>\n<li>Klinik: Şikayet YOK.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tanı: Biyopside (patolog \"kronik prostatit\" yazar) veya Lökospermi\n(İnfertilite araştırmasında) ile tesadüfen bulunur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: Sadece PSA yüksekliği varsa veya infertilite/işlem\nyapılacaksa tedavi edilir.</li>\n</ul>\n<h3 id=\"b-tani-yöntemleri̇-meares-stamey-testi̇\">B. TANI YÖNTEMLERİ:\nMEARES-STAMEY TESTİ</h3>\n<p>Bakterinin üretra mı yoksa prostat kaynaklı mı olduğunu anlamanın tek\nyolu budur.</p>\n<h3 id=\"1-dört-kap-testi-altın-standart-ama-kimse-yapmaz\">1. Dört Kap\nTesti (Altın Standart ama Kimse Yapmaz):</h3>\n<ul>\n<li><p>VB1 (Voided Bladder 1): İlk 10 cc idrar. -&gt; Üretra florasını\ngösterir.</p></li>\n<li><p>VB2 (Orta Akım): Mesane idrarı. -&gt; Mesane (Sistit) durumunu\ngösterir.</p></li>\n<li><p>EPS (Expressed Prostatic Secretions): Prostat masajı ile gelen\nsıvı. -&gt; Prostatı gösterir.</p></li>\n<li><p>VB3 (Masaj Sonrası İdrar): Masajdan sonraki ilk idrar. -&gt;\nProstatı gösterir.</p></li>\n<li><p><em>Yorum:</em> Eğer VB3 veya EPS'deki bakteri sayısı VB1 ve\nVB2'den 10 kat fazlaysa -&gt; Kronik Bakteriyel Prostatit.</p></li>\n</ul>\n<h3 id=\"2-i̇ki-kap-testi-pratik-yöntem---nickel-testi\">2. İki Kap Testi\n(Pratik Yöntem - Nickel Testi):</h3>\n<ul>\n<li><p>Poliklinikte bunu yaparsın.</p></li>\n<li><p>Önce İdrar (Pre-Masaj): Mesane/Üretra.</p></li>\n<li><p>Prostat Masajı.</p></li>\n<li><p>Sonra İdrar (Post-Masaj): Prostat.</p></li>\n<li><p><em>Sonuç:</em> Post-masaj idrarında lökosit/bakteri varsa\nprostatittir.</p></li>\n</ul>\n<h3 id=\"c-tedavi̇-strateji̇leri̇-eau-kılavuzu\">C. TEDAVİ STRATEJİLERİ (EAU\nKılavuzu)</h3>\n<p>Tedavi kategorisine göre değişir.</p>\n<h3 id=\"1-akut-bakteriyel-prostatit-kategori-i\">1. Akut Bakteriyel\nProstatit (Kategori I)</h3>\n<ul>\n<li><p>YATIŞ: Genelde gerekir.</p></li>\n<li><p>Tedavi: Geniş spektrumlu IV Antibiyotik (Sefalosporin +\nAminoglikozid). Ateş düşünce Oral Kinolona geçilir.</p></li>\n<li><p>Süre: En az 2-4 hafta.</p></li>\n<li><p>Kontrendikasyon: ASLA PROSTAT MASAJI YAPMA! (Bakteriyemi ve\nSepsis riski).</p></li>\n<li><p>Glob: Üretral sonda takmak zordur ve ağrılıdır. Suprapubik\nKateter (Sistostomi) tercih edilir.</p></li>\n</ul>\n<h3 id=\"2-kronik-bakteriyel-prostatit-kategori-ii\">2. Kronik Bakteriyel\nProstatit (Kategori II)</h3>\n<ul>\n<li><p>Bakteri bellidir ama prostat içine ilaç zor girer.</p></li>\n<li><p>İlaç: Florokinolonlar (Sipro/Levofloksasin) veya Trimetoprim\n(TMP-SMX).</p></li>\n<li><p>Süre: 4-6 Hafta (Uzun tedavi şart).</p></li>\n<li><p><em>Neden:</em> Prostat sıvısı asidiktir (pH 6.4), enfeksiyonda\nalkali olur (pH 8). İlaçların \"İyon Tuzağı\" (Ion Trapping)\nmekanizmasıyla içeride birikmesi için lipofilik ve bazik olması gerekir.\nKinolonlar bunu en iyi yapan gruptur.</p></li>\n</ul>\n<h3 id=\"3-cpps-kategori-iii---upoint-si̇stemi̇\">3. CPPS (Kategori III) -\nUPOINT SİSTEMİ</h3>\n<ul>\n<li><p>Burada \"Mikrop\" yoktur veya ana neden değildir. Antibiyotik\n(Kinolon) sadece 1 kez 4-6 hafta denenir, yanıt yoksa kesilir. Tekrar\ntekrar verilmez!</p></li>\n<li><p>Multimodal Tedavi (UPOINT): Hastanın şikayetine göre tedavi\nseçilir.</p></li>\n<li><p>Urinary (İşeme): Alfa-bloker (Tamsulosin/Alfuzosin). En az 3-6\nay.</p></li>\n<li><p>Psychosocial (Psikolojik): Anksiyete/Depresyon tedavisi.</p></li>\n<li><p>Organ Specific (Prostat): Fitoterapi (Quercetin, Saw Palmetto,\nPolen özü).</p></li>\n<li><p>Infection (Enfeksiyon): Antibiyotik (Sadece kanıt\nvarsa).</p></li>\n<li><p>Neurologic/Systemic (Ağrı): Gabapentin, Pregabalin,\nAmitriptilin.</p></li>\n<li><p>Tenderness (Kas spazmı): Pelvik taban fizyoterapisi,\nMiyorelaksanlar.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3 id=\"1-soru-akut-prostatitli-hastada-psa-bakılır-mı\">1. Soru: \"Akut\nprostatitli hastada PSA bakılır mı?\"</h3>\n<ul>\n<li>Cevap: Hayır, bakılmaz. Çünkü akut enflamasyonda PSA 50-100'e kadar\nçıkabilir. Bu kanser demek değildir. Hastayı ve doktoru gereksiz paniğe\nsokar. PSA enfeksiyon tamamen geçtikten 3 ay sonra bakılmalıdır.</li>\n</ul>\n<h3 id=\"1-soru-kronik-prostatit-neden-kısırlık-infertilite-yapar\">1.\nSoru: \"Kronik prostatit neden kısırlık (infertilite) yapar?\"</h3>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Lökositler (ROS): Reaktif Oksijen Radikalleri spermin DNA'sını\nbozar.</p></li>\n<li><p>Obstrüksiyon: Ejakülatör kanallarda ödem/skar\n(Tıkanıklık).</p></li>\n<li><p>Antikor: Sperm antikorları gelişebilir.</p></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Soru: \"Kronik Pelvik Ağrısı olan hastada hangi 'Kırmızı Bayraklar'\n(Red Flags) bizi prostatitten uzaklaştırıp Kanser veya başka şeye\nyönlendirir?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Görülebilir Hematüri (Mesane Kanseri?).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>50 yaş üstü yeni başlayan semptomlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sigara öyküsü.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Nörolojik bulgular (Cauda Equina?).</li>\n</ul>\n<h3 id=\"1-soru-fitoterapi-bitkisel-ilaçlar-prostatitte-plasebo-mudur\">1.\nSoru: \"Fitoterapi (Bitkisel ilaçlar) prostatitte plasebo mudur?\"</h3>\n<ul>\n<li>Cevap: Hayır. EAU kılavuzları özellikle Quercetin (Biyo-flavonoid)\nve Polen Özü'nün (Cernilton) enflamasyonu azalttığına dair kanıtlar\nsunar (Kanıt Düzeyi B). Kategori III hastalarda mutlaka\ndenenmelidir.</li>\n</ul>\n<h3 id=\"1-soru-prostat-masajı-terapötik-işe-yarar-mı\">1. Soru: \"Prostat\nmasajı (Terapötik) işe yarar mı?\"</h3>\n<ul>\n<li>Cevap: Kronik Prostatitte (Kategori II ve III) tıkalı kanalları\naçmak, drenajı sağlamak ve antibiyotik penetrasyonunu artırmak için\nhaftada 2-3 kez önerilebilir (Eski ama etkili bir yöntemdir). <em>Akut\nprostatitte YASAKTIR.</em></li>\n</ul>\n"}, {"id": "2.5", "t": "Genital Sistem Enfeksiyonları ve Aciller", "h": "<h3 id=\"a-epi̇di̇di̇mo-orşi̇t-skrotal-yangın\">A. EPİDİDİMO-ORŞİT (Skrotal\nYangın)</h3>\n<p>Epididim ve testisin enflamasyonudur. Genellikle enfeksiyon vas\ndeferens yoluyla retrograd (geriye doğru) yayılır.</p>\n<h3 id=\"1-yaş-ve-etken-ayrımı-hayati̇\">1. Yaş ve Etken Ayrımı\n(HAYATİ!)</h3>\n<p>Tedaviyi hastanın yaşına ve cinsel aktivitesine göre seçmek\nzorundasın.</p>\n<ul>\n<li>&lt; 35 Yaş (Genç, Cinsel Aktif):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Etken: <em>C. trachomatis</em> (Klamidya) ve <em>N. gonorrhoeae</em>\n(Gonore).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: Seftriakson (1g IM Tek doz) + Doksisiklin (100mg 2x1, 10-14\ngün).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Uyarı:</em> Eş tedavisi şart!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>&gt; 35 Yaş (BPH, Kateter, Enstrümantasyon):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Etken: Enterik bakteriler (<em>E. coli, Pseudomonas</em>).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: Florokinolonlar (Levofloksasin 500mg 1x1 veya\nSiprofloksasin, 10-14 gün).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Uyarı:</em> Kinolon direnci varsa Sefalosporinlere geçilir.</li>\n</ul>\n<h3 id=\"2-tanı-ve-ayırıcı-tanı-torsiyon-mu\">2. Tanı ve Ayırıcı Tanı\n(Torsiyon mu?)</h3>\n<ul>\n<li><p>Klinik: Skrotum şiş, kızarık, ağrılı ve sıcaktır. Ateş\nolabilir.</p></li>\n<li><p>Prehn Belirtisi: Testisi yukarı kaldırınca ağrı AZALIR\n(Epididimit lehine). Torsiyonda ağrı değişmez veya artar. (Güvenilirliği\ndüşüktür!).</p></li>\n<li><p>Refleks: Kremaster Refleksi epididimitte genellikle alınır,\ntorsiyonda kaybolur.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>GÖRÜNTÜLEME (Renkli Doppler USG):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Epididimit: Kanlanma (Vaskülarizasyon) ARTMIŞTIR (\"Yangın Yeri\"\ngörünümü).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Torsiyon: Kanlanma YOKTUR veya azalmıştır.</li>\n</ul>\n<h3 id=\"3-komplikasyonlar\">3. Komplikasyonlar</h3>\n<ul>\n<li><p>Testis Apsesi: Antibiyotikle düzelmeyen ateş ve kitle. (Drenaj\nveya Orşiektomi gerekir).</p></li>\n<li><p>Testiküler İnfarkt: Kordon ödemi o kadar artar ki arteriyel akımı\nbozar. (Testis ölür).</p></li>\n</ul>\n<h3 id=\"b-fournier-gangreni̇-nekrotizan-fasiit\">B. FOURNIER GANGRENİ\n(Nekrotizan Fasiit)</h3>\n<p>Ürolojinin en ölümcül (%20-40 mortalite) acilidir. Perine ve genital\nbölgenin polimikrobiyal (aerob + anaerob), hızlı ilerleyen nekrotizan\nenfeksiyonudur.</p>\n<h3 id=\"1-risk-faktörleri\">1. Risk Faktörleri</h3>\n<ul>\n<li><p>Diyabet (En sık).</p></li>\n<li><p>Alkolizm.</p></li>\n<li><p>İmmünsupresyon / Kemoterapi.</p></li>\n<li><p>Perirenal apse, Üretra darlığı (idrar ekstravazasyonu), Anal\nfissür.</p></li>\n</ul>\n<h3 id=\"2-klinik-bulgular-gözünle-tanı-koy\">2. Klinik Bulgular (Gözünle\nTanı Koy!)</h3>\n<ul>\n<li><p>Erken Dönem: Orantısız ağrı (Görünürde az şey var ama hasta çok\nağrılı).</p></li>\n<li><p>İleri Dönem:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ciltte siyah nekrotik plaklar (Eşek arısı sokmuş gibi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Krepitasyon: Cilt altında gaz hissi (Çıtır çıtır ses).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Koku: Odaya girdiğinde burnunu yakan o spesifik çürük et\nkokusu.</li>\n</ul>\n<h3 id=\"3-tedavi-zamanla-yarış\">3. Tedavi (Zamanla Yarış)</h3>\n<p>Bu hastalara \"Sabah vizitte hocaya danışırım\" denmez. Gece 3'te bile\nolsa hoca aranır ve hasta masaya alınır.</p>\n<ol type=\"1\">\n<li>Hemodinamik Stabilizasyon: Geniş damar yolu, sıvı\nresüsitasyonu.</li>\n</ol>\n<h3 id=\"2-geniş-spektrumlu-antibiyotik-üçlü-kombinasyon\">2. Geniş\nSpektrumlu Antibiyotik (Üçlü Kombinasyon):</h3>\n<ul>\n<li>Penisilin/Sefalosporin + Metronidazol (Anaeroblar için) +\nAminoglikozid.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Veya Karbapenemler (Meropenem/İmipenem).</li>\n</ul>\n<h3 id=\"1-aci̇l-cerrahi̇-debri̇dman-altın-kural\">1. ACİL CERRAHİ DEBRİDMAN\n(Altın Kural):</h3>\n<ul>\n<li>Tüm nekrotik dokular kanayan canlı (sarı/kırmızı) dokuyu görene\nkadar kesilip atılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Colles Fasyası sınırları boyunca ilerler. Testisler genelde korunur\n(Çünkü ayrı kanlanır - Testiküler arterden).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gerekirse sistostomi veya kolostomi açılır (İdrar/gaita yaraya\ndeğmesin diye).</li>\n</ul>\n<h3 id=\"4-fgsi-skoru-fourniers-gangrene-severity-index\">4. FGSI Skoru\n(Fournier's Gangrene Severity Index):</h3>\n<ul>\n<li><p>Ateş, Nabız, Solunum, Na, K, Kreatinin, Lökosit, Hematokrit,\nBikarbonat.</p></li>\n<li><p>Skor &gt; 9 ise: %75 Ölüm riski.</p></li>\n</ul>\n<h3 id=\"c-mump-kabakulak-orşi̇ti̇\">C. MUMP (KABAKULAK) ORŞİTİ</h3>\n<ul>\n<li><p>Viral bir enfeksiyondur (Paramyxovirus).</p></li>\n<li><p>Genelde parotit (yanak şişmesi) başladıktan 4-8 gün sonra\ngelişir.</p></li>\n<li><p>Klinik: Tek taraflı (%70) veya çift taraflı (%30) testis\nşişmesi.</p></li>\n<li><p>Risk: Puberte sonrası geçirilirse Testis Atrofisi ve İnfertilite\nriski yüksektir.</p></li>\n<li><p>Tedavi: Spesifik tedavisi yoktur. İstirahat, skrotal elevasyon,\nsoğuk uygulama. Antibiyotik verilmez!</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3\nid=\"1-soru-fournier-gangreninde-testisler-neden-genelde-sağlam-kalır\">1.\nSoru: \"Fournier gangreninde testisler neden genelde sağlam kalır?\"</h3>\n<ul>\n<li>Cevap: \"Çünkü testislerin kanlanması intra-abdominal kaynaktan\n(Aorttan çıkan Testiküler Arter) gelir. Enfeksiyon ise perineal cilt\naltı fasyasında (Colles/Dartos) ilerler. Testislerin beslenmesi bu\nfasyalardan bağımsızdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Epididimit tedavisi alan hastanın ağrısı 3. gün geçti ama\n'Testisimde sertlik kaldı' diyor. Ne dersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Normaldir. Epididimdeki endürasyonun (sertliğin) geçmesi 4-6\nhafta sürebilir. Ancak kitle büyüyorsa Testis Tümörü veya Apse ekarte\nedilmelidir.\"</li>\n</ul>\n<h3 id=\"1-soru-bruselloz-peynir-hastalığı-ürolojide-ne-yapar\">1. Soru:\n\"Bruselloz (Peynir Hastalığı) ürolojide ne yapar?\"</h3>\n<ul>\n<li>Cevap: Ülkemizde endemiktir. İnatçı, tedaviye dirençli\nEpididimo-orşit yapar. Hasta çiğ süt/peynir öyküsü veriyorsa ve standart\nantibiyotikle düzelmiyorsa Wright Testi (Brucella aglütinasyonu)\nistenmelidir.</li>\n</ul>\n<h3 id=\"1-soru-fournier-debridmanında-cilt-kapatılır-mı\">1. Soru:\n\"Fournier debridmanında cilt kapatılır mı?\"</h3>\n<ul>\n<li>Cevap: ASLA! Yara açık bırakılır. Günlük pansuman veya VAC (Vakum)\ntedavisi ile granülasyon dokusu oluşması beklenir. Enfeksiyon tamamen\nbitince greftleme yapılır. Erken kapatırsan anaeroblar tekrar ürer ve\nhasta ölür.</li>\n</ul>\n<h3 id=\"1-soru-akut-epididimit-testis-tümörü-ile-karışır-mı\">1. Soru:\n\"Akut Epididimit, Testis Tümörü ile karışır mı?\"</h3>\n<ul>\n<li>Cevap: Evet. Hızlı büyüyen tümörlerde (Embriyonel Karsinom) içine\nkanama olursa ağrı ve şişlik yapar. USG'de şüpheli alan varsa,\nenfeksiyon tedavisi sonrası mutlaka kontrol USG çekilmelidir.</li>\n</ul>\n"}, {"id": "2.6", "t": "Genitoüriner Tüberküloz (GÜ-TB)", "h": "<p>GÜ-TB, akciğer dışı tüberkülozun en sık görülen ikinci formudur (Lenf\nnodundan sonra). Genellikle akciğer enfeksiyonundan yıllar sonra (15-20\nyıl latent kalabilir) ortaya çıkar.</p>\n<h3 id=\"a-patogenez-sessiz-i̇şgal\">A. PATOGENEZ: \"Sessiz İşgal\"</h3>\n<ol type=\"1\">\n<li><p>Hematojen Yayılım: Mikobakteriler akciğerden kana karışır ve\nböbrek korteksine (Glomerüllere) yerleşir.</p></li>\n<li><p>Kortikal Granülomlar: Burada sessiz kalır. İmmün sistem\nzayıflarsa (Yaşlılık, Diyabet, Steroid) aktive olur.</p></li>\n<li><p>İdrar Yoluyla Yayılım (Descending): Bakteriler tübüllere geçer,\npapillayı nekroze eder ve kalislere dökülür. İdrarla birlikte üreteri,\nmesaneyi, prostatı ve epididimi enfekte eder.</p></li>\n</ol>\n<ul>\n<li><em>Klinik İpucu:</em> Epididim tüberkülozu genellikle idrar yoluyla\n(retrograd) değil, enfekte idrarın reflüsü veya kan yoluyla olur. Ancak\nprostat ve veziküloseminalis tutulumu sıktır.</li>\n</ul>\n<h3 id=\"b-kli̇ni̇k-ve-tani-steril-piyüri-alarmı\">B. KLİNİK VE TANI:\n\"Steril Piyüri Alarmı\"</h3>\n<p>Hasta tipik sistit şikayetleriyle gelir (Sık idrar, yanma),\nantibiyotik verirsin geçmez. Kültür alırsın temiz çıkar. İşte o an alarm\nzilleri çalmalı!</p>\n<h3 id=\"1-semptomlar\">1. Semptomlar</h3>\n<ul>\n<li><p>Dizüri, Pollaküri, Urgency (%50): Mesane tutulumuna bağlıdır.\nAntibiyotiğe yanıt vermez.</p></li>\n<li><p>Hematüri: Mikroskopik veya makroskopik.</p></li>\n<li><p>Yan Ağrısı: Üreter darlığına (hidronefroz) bağlı\nolabilir.</p></li>\n<li><p>Epididimit: Akıntısız, ağrısız veya az ağrılı şişlik. Vas\nDeferens muayenesinde \"Tesbih Tanesi\" (Beaded Vas) görünümü\ntipiktir.</p></li>\n</ul>\n<h3 id=\"2-laboratuvar\">2. Laboratuvar</h3>\n<ul>\n<li><p>Steril Piyüri: Lökosit (+) ama Rutin Kültür (-).</p></li>\n<li><p>Asit-Fast Basil (ARB) Boyama: Sabah ilk idrarı (x3 gün üst üste).\n(Duyarlılık düşüktür).</p></li>\n<li><p>KÜLTÜR (Altın Standart):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Lowenstein-Jensen: Sonuç 4-8 haftada çıkar (Çok yavaş).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>MGIT (Sıvı Kültür): Daha hızlıdır (2 hafta).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>PCR (GeneXpert): Çok hızlı ve spesifiktir. Tanıda artık ilk tercih\nhaline gelmektedir.</li>\n</ul>\n<h3 id=\"c-radyoloji̇k-bulgular-görüntüyle-tanı-koy\">C. RADYOLOJİK\nBULGULAR (Görüntüyle Tanı Koy!)</h3>\n<p>GÜ-TB, radyolojide Fibrozis (Skar) ve Kalsifikasyon hastalığıdır.</p>\n<h3 id=\"1-erken-dönem\">1. Erken Dönem:</h3>\n<ul>\n<li>\"Güve Yeniği\" (Moth-eaten) Görünümü: Kalislerin ucunda (papillada)\nülserasyonlar ve düzensizlikler.</li>\n</ul>\n<h3 id=\"2-i̇lerleyen-dönem\">2. İlerleyen Dönem:</h3>\n<ul>\n<li><p>İnfundibüler Darlık (Fantom Kalis): Kalis boynu daralır, kalis\ngenişler ama idrarla bağlantısı kesildiği için IVP/BT'de\ndolmaz.</p></li>\n<li><p>Üreter Darlıkları: Genellikle çoklu ve uzundur (\"Tesbih dizisi\"\nveya \"Pipe-stem\" - pipo sapı görünümü).</p></li>\n</ul>\n<h3 id=\"3-geç-dönem-böbrek-bitmiş\">3. Geç Dönem (Böbrek Bitmiş):</h3>\n<ul>\n<li>Putty Kidney (Macun Böbrek / Mastik Böbrek): Böbrek tamamen\nkireçlenmiş (kalsifiye), içi peynirleşmiş (kazeöz) materyalle dolu,\nçalışmayan bir kese halini almıştır. Autonephrectomy (Oto-nefrektomi)\ndenir.</li>\n</ul>\n<h3 id=\"4-mesane-bulgusu\">4. Mesane Bulgusu:</h3>\n<ul>\n<li><p>Thimble Bladder (Yüksük Mesane): Fibrozis nedeniyle mesane\nkapasitesi 50 cc'ye kadar düşer. Duvarı kalındır.</p></li>\n<li><p>Golf Hole (Golf Deliği) Orifis: Üreter orifisi etrafındaki\nfibrozis nedeniyle orifis sürekli açık, geniş ve geri çekilmiş görünür.\n(VUR'a neden olur).</p></li>\n</ul>\n<h3 id=\"d-tedavi̇-protokolü-i̇laç-mı-bıçak-mı\">D. TEDAVİ PROTOKOLÜ (İlaç\nmı, Bıçak mı?)</h3>\n<p>Tüberküloz öncelikle MEDİKAL bir hastalıktır. Cerrahinin yeri\nkomplikasyonlardır.</p>\n<h3 id=\"1-medikal-tedavi-çoklu-i̇laç---6-ay\">1. Medikal Tedavi (Çoklu\nİlaç - 6 Ay)</h3>\n<p>Standart Akciğer TB tedavisiyle aynıdır.</p>\n<ul>\n<li><p>İlk 2 Ay (4'lü): İsoniazid (H), Rifampisin (R), Pirazinamid (Z),\nEtambutol (E).</p></li>\n<li><p>Sonraki 4 Ay (2'li): İsoniazid + Rifampisin.</p></li>\n<li><p><em>Takip:</em> Tedavi sırasında karaciğer enzimleri, ürik asit\nve göz muayenesi (Etambutol toksisitesi) yapılmalıdır.</p></li>\n</ul>\n<h3 id=\"2-cerrahi-tedavi-ne-zaman\">2. Cerrahi Tedavi (Ne Zaman?)</h3>\n<ul>\n<li><p>Nefrektomi: Sadece \"Çalışmayan, Enfeksiyon kaynağı olan,\nHipertansiyon yapan veya Ağrılı\" böbreğe yapılır. (Putty\nKidney).</p></li>\n<li><p>Rekonstrüksiyon (Augmentasyon/Üreter Reimplantasyonu):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>ALTIN KURAL:</em> Hasta en az 4-6 hafta anti-TB tedavisi almadan\nbıçak vurulmaz! Dokular ödemli ve gevrek olur, dikiş tutmaz, fistül\ngelişir. Önce ilacı ver, dokular iyileşsin, fibrozis otursun, sonra\nonar.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Steril piyüri nedenleri nelerdir? (Daha önce konuştuk ama TB\niçin tekrar hatırlayalım)\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>GÜ-Tüberküloz.</p></li>\n<li><p>Yetersiz tedavi edilmiş İYE.</p></li>\n<li><p>Taş hastalığı.</p></li>\n<li><p>Mesane Tümörü (CIS).</p></li>\n<li><p>Klamidya / Üreaplasma.</p></li>\n<li><p>İnterstisyel Sistit.</p></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Soru: \"Tüberkülozlu hastada anti-TB tedavi başlandıktan 2 hafta\nsonra üreter darlığı arttı ve hidronefroz gelişti. Neden? Tedavi işe\nyaramadı mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır, bu beklenen bir durumdur (Paradoksal Reaksiyon).\nBakteriler öldükçe iyileşme dokusu (fibrozis) artar ve darlıklar\nsıkılaşır. Bu dönemde hastaya Steroid eklenmesi veya geçici JJ Stent\ntakılması gerekebilir.\"</li>\n</ul>\n<h3 id=\"1-soru-golf-hole-orifis-sistoskopide-nasıl-görünür\">1. Soru:\n\"Golf Hole orifis sistoskopide nasıl görünür?\"</h3>\n<ul>\n<li>Cevap: Normalde orifis kapalı bir çizgi gibidir. TB'de ise sürekli\naçık, krater gibi bir delik görülür. İdrarın mesaneden üretere kaçışı\n(VUR) serbesttir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastada hem prostatit bulguları var hem de Vas Deferens'te\nboncuklanma hissediyorsun. Tanı?\"</li>\n</ol>\n<ul>\n<li>Cevap: Genital Tüberküloz. (Genellikle renal TB ile birliktedir,\nböbreği de tara!).</li>\n</ul>\n"}, {"id": "2.7", "t": "Genital Ülserler ve Siğiller", "h": "<p>Burada ezberlemen gereken \"Ülser Algoritması\" şudur: Ağrılı mı? Sert\nmi? Tek mi?</p>\n<h3 id=\"a-geni̇tal-ülserler-yaralar\">A. GENİTAL ÜLSERLER (Yaralar)</h3>\n<h3 id=\"1-si̇fi̇li̇z-frengi̇---büyük-taklitçi\">1. SİFİLİZ (FRENGİ) - \"Büyük\nTaklitçi\"</h3>\n<ul>\n<li><p>Etken: <em>Treponema pallidum</em> (Spiroket).</p></li>\n<li><p>Primer Sifiliz (Şankr):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Görünüm: AĞRISIZ, tabanı temiz (püy yok), kenarları sert (Endüre -\nDüğme gibi) ve genellikle TEK ülserdir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kuluçka:</em> 10-90 gün (Ort. 3 hafta).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Lenf Nodu:</em> Genellikle çift taraflı, ağrısız LAP.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sekonder Sifiliz (Döküntü):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi edilmezse 6-8 hafta sonra gövdede döküntü, avuç içi/ayak\ntabanında kızarıklık ve genital bölgede Kondiloma Lata (HPV siğili ile\nkarışır ama daha düz ve ıslaktır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tanı:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Karanlık Saha Mikroskobisi (Artık nadir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Seroloji: VDRL/RPR (Tarama - Takipte düşer) + TPHA/FTA-ABS\n(Doğrulama - Ömür boyu pozitif kalır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi (Altın Standart):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Benzatin Penisilin G (2.4 Milyon Ünite IM - Tek Doz).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Alerji varsa:</em> Doksisiklin (14 gün).</li>\n</ul>\n<h3 id=\"2-herpes-geni̇tali̇s-hsv-2\">2. HERPES GENİTALİS (HSV-2)</h3>\n<ul>\n<li><p>Etken: <em>Herpes Simplex Virus Tip 2</em>.</p></li>\n<li><p>Klinik:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>AĞRILI, çoklu, içi su dolu veziküller (\"Gül yaprağı üzerinde çiy\ntanesi\"). Sonra patlar ve sığ, ağrılı ülserlere dönüşür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Prodrom:</em> Lezyon çıkmadan önce kaşıntı/yanma olur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>Özellik: Virüs Dorsal Kök Ganglionuna yerleşir ve ömür boyu\nkalır. Stres/immünsupresyonda nüks eder.</p></li>\n<li><p>Tedavi: Küratif değildir (virüsü yok etmez), semptomları\nbaskılar.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Asiklovir / Valasiklovir (İlk atakta 7-10 gün, nükslerde 3-5\ngün).</li>\n</ul>\n<h3 id=\"3-şankroi̇d-yumuşak-şankr\">3. ŞANKROİD (Yumuşak Şankr)</h3>\n<ul>\n<li><p>Etken: <em>Haemophilus ducreyi</em>.</p></li>\n<li><p>Klinik:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>AĞRILI, tabanı kirli (püy/nekroz), kenarları yumuşak ve düzensiz\nülser.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Bubo: Tek taraflı, ağrılı, süpüre (akıntılı) inguinal lenf\nnodu.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: Azitromisin (1g Tek Doz) veya Seftriakson.</li>\n</ul>\n<h3 id=\"b-geni̇tal-si̇ği̇ller-hpv---kondiloma-aküminata\">B. GENİTAL\nSİĞİLLER (HPV - Kondiloma Aküminata)</h3>\n<p>Üroloji polikliniğinin en sık dermatolojik başvurusudur.</p>\n<ul>\n<li>Etken: <em>Human Papilloma Virus</em>.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 6 ve 11: Siğillerin %90'ı (Düşük Kanser Riski).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tip 16 ve 18: Kanser (Serviks, Penis, Anüs) yapanlar (Yüksek\nRisk).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>Görünüm: Karnabahar benzeri, saplı veya sapsız, ten\nrengi/kahverengi lezyonlar.</p></li>\n<li><p>Tedavi Seçenekleri:</p></li>\n</ul>\n<ol type=\"1\">\n<li>Hasta Uygulamalı: İmiquimod (Aldara) krem, Podofilotoksin. (Uzun\nsürer, nüks sıktır).</li>\n</ol>\n<h3 id=\"2-doktor-uygulamalı-daha-etkili\">2. Doktor Uygulamalı (Daha\nEtkili):</h3>\n<ul>\n<li>Kriyoterapi (Sıvı Azot): Gebelerde güvenlidir. İz bırakmaz.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Elektrokoter / Lazer: Hızlı çözüm.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ Cerrahi Güvenlik Uyarısı:</em> Koter dumanında viral DNA\nbulunur! Mutlaka Duman Emici (Smoke Evacuator) ve N95 maske\nkullanmalısın. Asistanına ve kendine bunu solutma!</li>\n</ul>\n<ol type=\"1\">\n<li>Cerrahi Eksizyon: Çok büyük (dev kondilom - Buschke-Löwenstein)\nkitlelerde.</li>\n</ol>\n<h3 id=\"c-di̇ğer-dermatoloji̇k-lezyonlar-tuzaklar\">C. DİĞER DERMATOLOJİK\nLEZYONLAR (Tuzaklar)</h3>\n<p>Her lezyon CYBH değildir. Hastayı boşuna korkutma veya kanseri\nkaçırma.</p>\n<h3 id=\"1-balani̇ti̇s--balanoposti̇ti̇s\">1. BALANİTİS / BALANOPOSTİTİS</h3>\n<ul>\n<li><p>Glans (Balanitis) ve sünnet derisinin (Posthitis)\niltihabıdır.</p></li>\n<li><p>En Sık Neden: <em>Candida albicans</em> (Mantar).</p></li>\n<li><p>Klinik İpucu: Sünnetsiz bir erkek, glansında beyaz peynirimsi\nbirikim ve kızarıklıkla geliyorsa -&gt; DİYABET BAK! (Gizli şekerin ilk\nbulgusu olabilir).</p></li>\n<li><p>Tedavi: Antifungal kremler + Hijyen + (Gerekirse)\nSünnet.</p></li>\n</ul>\n<h3 id=\"2-li̇ken-skleroz-bxo---balanitis-xerotica-obliterans\">2. LİKEN\nSKLEROZ (BXO - Balanitis Xerotica Obliterans)</h3>\n<ul>\n<li><p>Görünüm: Glans ve prepisyumda Porselen Beyazı, atrofik,\nskarlaşmış plaklar.</p></li>\n<li><p>Riskler:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Fimozis (Deri darlığı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Meatal Stenoz (İdrar deliği darlığı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Penis Kanseri (SCC): Pre-kanseröz kabul edilir! Uzun vadede\nkanserleşebilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: Güçlü Topikal Steroidler (Klobetasol) -&gt; Yanıt yoksa\nSünnet -&gt; Darlık varsa Meatoplasti.</li>\n</ul>\n<h3 id=\"3-pearly-penile-papules-i̇nci-tanesi-papüller\">3. PEARLY PENILE\nPAPULES (İnci Tanesi Papüller)</h3>\n<ul>\n<li><p>Görünüm: Glans penis koronasında (taç kısmında) sıralı, küçük,\nderi renginde kabartılar.</p></li>\n<li><p>Önemli: Bu NORMAL ANATOMİK VARYASYONDUR! Hastalık değildir,\nbulaşıcı değildir.</p></li>\n<li><p>Yönetim: Hastayı ikna et. \"Yakalım\" derse yapma, skar\nkalır.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Sifiliz tedavisinde penisilin yaptık, hasta 4 saat sonra\nateş, titreme ve kas ağrısıyla acile geldi. Alerji mi oldu?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır, bu Jarisch-Herxheimer Reaksiyonudur. Ölen\nbakterilerden (spiroketlerden) açığa çıkan toksinlere bağlıdır.\nZararsızdır, 24 saatte geçer. Antipiretik verilir, tedaviye devam\nedilir.\"</li>\n</ul>\n<h3 id=\"1-soru-hangi-hpv-tipleri-için-aşı-var-ve-kimlere-yapalım\">1.\nSoru: \"Hangi HPV tipleri için aşı var ve kimlere yapalım?\"</h3>\n<ul>\n<li>Cevap: Gardasil-9 (Tip 6, 11, 16, 18, 31, 33, 45, 52, 58).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kız ve ERKEK çocuklarına (9-14 yaş ideal, 45 yaşa kadar\nyapılabilir). Erkeklere yapmak hem penis kanserini hem de taşıyıcılığı\n(kadınları korumak için) önler.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Üretra içinde (Meatusun 1-2 cm içinde) siğil (kondilom) varsa\nkoterle yakalım mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Körlemesine yakarsan üretra darlığı (striktür) yaparsın.\nMutlaka Sistoskop eşliğinde, görerek ve mukozayı minimum hasarlayarak\n(soğuk bıçak veya düşük doz lazer/koter ile) temizlemelisin.\"</li>\n</ul>\n<h3 id=\"1-soru-sifilizde-gumma-nedir\">1. Soru: \"Sifilizde 'Gumma'\nnedir?\"</h3>\n<ul>\n<li>Cevap: Tersiyer (Geç) sifilizde görülen, lastik kıvamında, nekrotik,\ngranülomatöz lezyonlardır. Kemik, karaciğer veya testiste olabilir.\n(Testis tümörü ile karışır!).</li>\n</ul>\n<h3 id=\"1-soru-bxo-liken-tanısı-nasıl-kesinleşir\">1. Soru: \"BXO (Liken)\ntanısı nasıl kesinleşir?\"</h3>\n<ul>\n<li>Cevap: Biyopsi ile. Ancak klinik görünüm (porselen beyazı) çok\ntipiktir. Sünnet edilen parçanın patolojiye gönderilmesi şarttır.</li>\n</ul>\n"}, {"id": "2.8", "t": "Özel Durumlar: Gebelik, Kateter ve Asemptomatik Bakteriüri (Abu)", "h": "<h3 id=\"a-asemptomati̇k-bakteri̇üri̇-abu\">A. ASEMPTOMATİK BAKTERİÜRİ\n(ABU)</h3>\n<p>Tanım: Hastanın hiçbir şikayeti yokken (ateş, yanma, sıkışma yok),\nalınan idrar örneğinde anlamlı üreme (≥ 105 cfu/mL) olmasıdır.</p>\n<h3 id=\"1-kural-kimi-asla-tedavi-etme\">1. Kural: Kimi ASLA Tedavi\nEtme?</h3>\n<p>Bu hastalara antibiyotik vermek sadece dirençli bakteri yaratır ve\nhastanın florasını bozar.</p>\n<ul>\n<li><p>Yaşlılar (Geriatrik popülasyon): İdrarı kokuyor diye ilaç\nverme.</p></li>\n<li><p>Diyabetikler: Semptom yoksa verme.</p></li>\n<li><p>Omurilik Yaralanmalı Hastalar (SCI): Sonda kullananlarda bakteri\nhep vardır.</p></li>\n<li><p>Böbrek Nakli Hastaları: İlk 1 aydan sonra tedavi\nönerilmez.</p></li>\n</ul>\n<h3 id=\"2-kural-kimi-mutlaka-tedavi-et-sadece-2-grup\">2. Kural: Kimi\nMUTLAKA Tedavi Et? (Sadece 2 Grup!)</h3>\n<ol type=\"1\">\n<li>GEBELER: İlk trimesterda tarama yapılır ve tedavi edilir.</li>\n</ol>\n<h3 id=\"2-üroloji̇k-gi̇ri̇şi̇m-yapilacak-hastalar\">2. ÜROLOJİK GİRİŞİM\nYAPILACAK HASTALAR:</h3>\n<ul>\n<li><em>Şart:</em> Mukoza bütünlüğünün bozulacağı ve kanama riski olan\nişlemler (TUR-P, TUR-M, URS, PCNL, Biyopsi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Neden:</em> Bakteriyemi ve Sepsis riski %60-80'dir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Not:</em> Sonda takmak veya sistoskopi yapmak (kanamasız) için\ntedavi şart değildir.</li>\n</ul>\n<h3 id=\"b-gebeli̇kte-i̇ye\">B. GEBELİKTE İYE</h3>\n<p>Gebelikte fizyolojik ve anatomik değişiklikler İYE riskini\nartırır.</p>\n<h3 id=\"1-neden-sık-görülür\">1. Neden Sık Görülür?</h3>\n<ul>\n<li><p>Mekanik: Büyüyen uterus üreterlere (özellikle sağa) bası\nyapar.</p></li>\n<li><p>Hormonal: Progesteron düz kasları gevşetir -&gt; Üreter ve mesane\ntonusu azalır -&gt; İdrar akımı yavaşlar (Staz) -&gt; Fizyolojik\nHidronefroz (Sağda daha sık).</p></li>\n<li><p>Kimyasal: İdrar pH'ı artar, glikozüri görülür (Bakteri\nsever).</p></li>\n</ul>\n<h3 id=\"2-tedavi-edilmezse-ne-olur\">2. Tedavi Edilmezse Ne Olur?</h3>\n<ul>\n<li><p>Anne İçin: %20-40 oranında Akut Piyelonefrit gelişir (Normalde\n%1). Gebede piyelonefrit ARDS (Akciğer ödemi) ve Sepsis riski\ntaşır.</p></li>\n<li><p>Bebek İçin: Erken doğum (Preterm eylem), Düşük Doğum Ağırlığı,\nFetal ölüm.</p></li>\n</ul>\n<h3 id=\"3-güvenli-i̇laç-seçimi-fda-kategorileri\">3. Güvenli İlaç Seçimi\n(FDA Kategorileri)</h3>\n<ul>\n<li>GÜVENLİ (Kategori B):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Fosfomisin (İlk tercih).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Nitrofurantoin (Dikkat: 36. haftadan sonra, yani doğuma yakın\nVERİLMEZ! Bebekte G6PD eksikliğine bağlı hemoliz/sarılık yapar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sefalosporinler (Sefaleksin, Sefuroksim).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Penisilinler (Amoksisilin).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>YASAK (Kategori C/D):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Florokinolonlar (Kıkırdak toksisitesi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tetrasiklinler (Diş/Kemik diskolorasyonu).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Trimetoprim-Sulfametoksazol (İlk trimesterda folat antagonistidir\n-&gt; Nöral tüp defekti yapar. Son trimesterda kernikterus yapar).</li>\n</ul>\n<h3 id=\"c-kateter-i̇li̇şki̇li̇-i̇ye-cauti\">C. KATETER İLİŞKİLİ İYE\n(CAUTI)</h3>\n<p>Hastane enfeksiyonlarının %40'ıdır.</p>\n<h3 id=\"1-patogenez-biyofilm-biofilm\">1. Patogenez: Biyofilm\n(Biofilm)</h3>\n<p>Sonda takıldıktan 48 saat sonra yüzeyinde bakteriler, proteinler ve\nkristallerden oluşan bir \"zırh\" (biyofilm) oluşur.</p>\n<ul>\n<li><p>Bakteriler bu tabakanın içinde antibiyotikten ve bağışıklık\nsisteminden korunur.</p></li>\n<li><p><em>Önemli:</em> İdrar kültüründe üreyen bakteri, biyofilmdeki\nbakteriden farklı olabilir!</p></li>\n</ul>\n<h3 id=\"2-tanı-tuzak\">2. Tanı (Tuzak!)</h3>\n<ul>\n<li><p>Sondalı hastada idrarda lökosit (piyüri) ve bakteri HER ZAMAN\nvardır. Bu enfeksiyon demek değildir.</p></li>\n<li><p>CAUTI Tanısı İçin:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Semptom (Ateş, Yan ağrısı, Açıklanamayan bilinç değişikliği,\nSepsis).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>VE Kültürde üreme.</li>\n</ul>\n<h3 id=\"3-yönetim-ve-tedavi-altın-kural\">3. Yönetim ve Tedavi (Altın\nKural)</h3>\n<ul>\n<li>Adım 1: SONDAYI DEĞİŞTİR! (Veya çek).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eski sonda biyofilm kaynağıdır. Antibiyotik versen de oradaki\nbakteriyi öldüremezsin. Tedaviye başlamadan önce kültürü YENİ SONDADAN\nalmalısın.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>Adım 2: Geniş spektrumlu antibiyotik başla (Kültür sonucuna göre\ndaralt).</p></li>\n<li><p>Adım 3: Kapalı drenaj sistemini bozma. Torbayı yere koyma (Reflü\nolmasın).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Mor İdrar Torbası Sendromu (Purple Urine Bag Syndrome) nedir?\nAcil midir?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Mekanizma: Kronik kabızlığı olan sondalı hastalarda görülür.\nBağırsaktaki triptofan bakterilerce parçalanır -&gt; İndol -&gt; İdrarda\nİndoksil Sülfat -&gt; Bakteriyel enzimlerle (Fosfataz/Sülfataz) İndigo\n(Mavi) ve İndirubin (Kırmızı) pigmentlerine dönüşür. Mavi + Kırmızı =\nMOR.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik: Genellikle zararsızdır. Sondayı ve torbayı değiştir,\nkabızlığı çöz, hidrasyonu artır. Panik yapma.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sondalı hastanın idrarında <em>Candida albicans</em> (Mantar)\nüredi. Fluconazole başlayalım mı?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Semptom (Ateş, ağrı) yoksa -&gt; HAYIR! Bu kolonizasyondur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ne Yapmalı? Sondayı çek veya değiştir. Genelde kendiliğinden\nkaybolur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ne Zaman Tedavi? Hasta nötropenikse, ürolojik girişim yapılacaksa\nveya mantar topları (Fungal Ball) tıkanıklık yapıyorsa tedavi\nedilir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"TUR-P yapacağın hastada Asemptomatik Bakteriüri saptadın. Ne\nzaman tedavi etmelisin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İşlemden önceki gece veya işlem sabahı başlamak yeterlidir.\nUzun süre önceden vermeye gerek yok.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Gebelikte neden sağ böbrek daha çok şişer (Hidronefroz\nolur)?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Uterus dekstro-rotasyon yapar (Sağa döner), sağ üretere\nbasar.</p></li>\n<li><p>Sol üreter, Sigmoid kolon tarafından yastık gibi\nkorunur.</p></li>\n</ol>\n"}, {"id": "2.9", "t": "Ürosepsis ve Şok Yönetimi", "h": "<h3 id=\"a-tanimlar-ve-qsofa-sepsis-3-kriterleri\">A. TANIMLAR VE qSOFA\n(Sepsis-3 Kriterleri)</h3>\n<p>Eskiden SIRS (Sistemik Enflamatuar Yanıt Sendromu) kullanılırdı,\nartık EAU ve Yoğun Bakım Dernekleri SOFA (Sepsis-related Organ Failure\nAssessment) kullanıyor.</p>\n<h3 id=\"1-sepsis-tanımı\">1. Sepsis Tanımı:</h3>\n<p>Enfeksiyona karşı vücudun verdiği düzensiz yanıtın organ\ndisfonksiyonuna yol açmasıdır.</p>\n<h3 id=\"2-qsofa-hızlı-sofa---yatak-başı-skoru\">2. qSOFA (Hızlı SOFA) -\nYatak Başı Skoru:</h3>\n<p>Acil serviste veya serviste hastanın durumu kötüleştiğinde şu 3 şeye\nbak (Her biri 1 puan):</p>\n<ul>\n<li><p>Solunum Sayısı: ≥ 22 / dk. (Hızlı soluyor mu?).</p></li>\n<li><p>Bilinç Durumu: GKS &lt; 15 (Konfüzyon, uykuya meyil).</p></li>\n<li><p>Sistolik Tansiyon: ≤ 100 mmHg.</p></li>\n</ul>\n<p>Skor ≥ 2 ise: Yüksek riskli Sepsis! Yoğun bakım konsültasyonu ve\nagresif tedavi gerekir.</p>\n<h3 id=\"3-septik-şok\">3. Septik Şok:</h3>\n<p>Sepsis tablosuna ek olarak;</p>\n<ul>\n<li><p>Yeterli sıvı resüsitasyonuna rağmen ortalama arter basıncını\n(MAP) ≥ 65 mmHg tutmak için Vazopresör (Noradrenalin) ihtiyacı\nvarsa.</p></li>\n<li><p>VE Serum Laktat \\&gt; 2 mmol/L ise.</p></li>\n</ul>\n<h3 id=\"b-yöneti̇m-altin-saat-hour-1-bundle\">B. YÖNETİM: \"ALTIN SAAT\"\n(HOUR-1 BUNDLE)</h3>\n<p>Sepsis tanısı koyduğun an kronometre başlar. İlk 1 saatte şunları\nyapmak zorundasın:</p>\n<ol type=\"1\">\n<li><p>Laktat Ölç: Doku perfüzyonunu gösterir. &gt;2 ise tehlike, &gt;4\nise şok.</p></li>\n<li><p>Kültür Al: Antibiyotik vermeden ÖNCE kan ve idrar kültürü\nal.</p></li>\n</ol>\n<h3 id=\"3-geniş-spektrumlu-antibiyotik\">3. Geniş Spektrumlu\nAntibiyotik:</h3>\n<ul>\n<li>Piperasilin-Tazobaktam (Tazocin) veya Karbapenem (Meropenem).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Asla \"Cipro verelim bekleyelim\" deme!</li>\n</ul>\n<h3 id=\"1-sıvı-resüsitasyonu\">1. Sıvı Resüsitasyonu:</h3>\n<ul>\n<li>Hipotansiyon veya Laktat ≥ 4 ise: \\30 ml/kg Kristaloid\n(İzotonik/Ringer) başla. (Örn: 70 kg hasta için 2100 cc sıvı,\nhızlıca).</li>\n</ul>\n<ol type=\"1\">\n<li>Vazopresör: Sıvıya rağmen Tansiyon &lt; 65 mmHg ise Noradrenalin\nbaşla.</li>\n</ol>\n<h3 id=\"c-üroloji̇k-müdahale-source-control-kaynağı-kurut\">C. ÜROLOJİK\nMÜDAHALE: \"SOURCE CONTROL\" (Kaynağı Kurut)</h3>\n<p>Antibiyotik tıkalı böbreğe girmez! İdrar yollarında tıkanıklık\n(Taş/Tümör) varsa ve arkasında enfeksiyon (Piyonefroz) birikmişse, o\ntıkanıklığı açmadan hasta düzelmez.</p>\n<p>Karar Anı: Stent mi, Nefrostomi mi?</p>\n<h3 id=\"1-üreteral-stent-jj-stent\">1. Üreteral Stent (JJ Stent):</h3>\n<ul>\n<li><em>Avantaj:</em> İçeriden takılır, torba taşımaz.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Dezavantaj:</em> Genel veya spinal anestezi gerekebilir\n(Hipotansif hastada riskli!). Püy çok koyuysa stent tıkanabilir.</li>\n</ul>\n<h3 id=\"1-perkütan-nefrostomi-pcn\">1. Perkütan Nefrostomi (PCN):</h3>\n<ul>\n<li><em>Avantaj:</em> Lokal anestezi ile yapılabilir (Hasta şoktaysa en\ngüvenlisi). Drenajı garantidir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Dezavantaj:</em> Dışarıda torba olması, kanama riski.</li>\n</ul>\n<p>Altın Kural: Hasta septik şoktaysa ve anestezi alamayacak kadar\nkötüyse -&gt; NEFROSTOMİ hayat kurtarır.</p>\n"}, {"id": "2.10", "t": "Antimikrobiyal Profilaksi ve Direnç", "h": "<h3 id=\"a-cerrahi̇-alan-enfeksi̇yonlarini-ssi-önleme\">A. CERRAHİ ALAN\nENFEKSİYONLARINI (SSI) ÖNLEME</h3>\n<p>Ameliyattan önce \"koruyucu\" antibiyotik vermektir. Amaç dokuda ve\nkanda ilaç düzeyini yüksek tutmaktır.</p>\n<p>Zamanlama: İnsizyondan (bıçak değmeden) 30-60 dakika önce (Anestezide\nuyutulurken) yapılmalıdır. 2 saat önce veya ameliyattan sonra yapılanın\nfaydası yoktur!</p>\n<p>EAU Önerileri (Ezber):</p>\n<h3 id=\"1-temiz-cerrahiler-üriner-sisteme-girilmeyen\">1. Temiz\nCerrahiler (Üriner sisteme girilmeyen):</h3>\n<ul>\n<li>Örn: Basit Orşiektomi, Varikoselektomi.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Profilaksi: GEREKMEZ. (Risk faktörü yoksa).</li>\n</ul>\n<h3 id=\"1-temiz-kontamine-üriner-sisteme-girilen\">1. Temiz-Kontamine\n(Üriner sisteme girilen):</h3>\n<ul>\n<li>Örn: TUR-P, TUR-M, URS, PCNL.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Profilaksi: ŞARTTIR.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>İlaç:</em> Sefazolin (1. Kuşak), Sefuroksim (2. Kuşak) veya\nFosfomisin (TUR için).</li>\n</ul>\n<h3 id=\"1-transrektal-prostat-biyopsisi-en-riskli-i̇şlem\">1. Transrektal\nProstat Biyopsisi (En Riskli İşlem!):</h3>\n<ul>\n<li>Rektum florasını (E.coli) prostat içine taşıyorsun.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eski Protokol: Siprofloksasin (Artık direnç %50!).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>YENİ EAU 2025 Protokolü:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Önce Rektal Sürüntü (Rectal Swab) al.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Direnç durumuna göre \"Hedefe Yönelik\" (Targeted) profilaksi\nver.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eğer swab alamıyorsan: Fosfomisin (3g) veya Seftriakson ile\n\"Augmented\" (Güçlendirilmiş) profilaksi yap.</li>\n</ul>\n<h3 id=\"b-di̇rençli̇-bakteri̇ler-esbl-ve-cpe\">B. DİRENÇLİ BAKTERİLER: ESBL\nVE CPE</h3>\n<h3 id=\"1-esbl-genişlemiş-spektrumlu-beta-laktamaz\">1. ESBL (Genişlemiş\nSpektrumlu Beta-Laktamaz):</h3>\n<ul>\n<li>Penisilinleri ve Sefalosporinleri (Seftriakson dahil) parçalar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: KARBAPENEMLER (Ertapenem, Meropenem, İmipenem).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Alternatif (Hafif vakada):</em> Fosfomisin, Nitrofurantoin\n(Sistitte).</li>\n</ul>\n<h3 id=\"1-cpe-karbapenemaz-üreten-enterobakter\">1. CPE (Karbapenemaz\nÜreten Enterobakter):</h3>\n<ul>\n<li>Karbapenemleri de parçalar. (Son durak!).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: Kolistin, Tigesiklin, Seftazidim-Avibaktam (Yeni\nnesil).</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 2 Final Soruları)</p>\n<h3\nid=\"1-soru-septik-şoktaki-taş-hastasına-acil-urs-yapıp-taşı-kıralım-mı\">1.\nSoru: \"Septik şoktaki taş hastasına acil URS yapıp taşı kıralım\nmı?\"</h3>\n<ul>\n<li>Cevap: HAYIR! ASLA! Taşı kırmak (lazer/litotripsi) bakteri ve\ntoksinlerin kana karışmasını (bakteriyemi) artırır. Hasta masada\nkalabilir (\"Taşın üzerine basma!\").</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Doğrusu:</em> Sadece stenti tak (veya nefrostomi aç), idrarı\nboşalt, çık. Taş 2-4 hafta sonra hasta düzelince kırılır.</li>\n</ul>\n<h3\nid=\"1-soru-profilaksiyi-ameliyattan-sonra-ne-kadar-devam-ettirelim\">1.\nSoru: \"Profilaksiyi ameliyattan sonra ne kadar devam ettirelim?\"</h3>\n<ul>\n<li>Cevap: EAU kılavuzuna göre TEK DOZ yeterlidir. En fazla 24 saat.\nSondası kaldı diye günlerce antibiyotik vermek direnci artırır,\nenfeksiyonu önlemez.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın tansiyonu 80/50, şuuru kapalı, idrarı püy gibi.\nHemşire 'Hocam antibiyotik orderı girmediniz' diyor. Önce ne\nyaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Önce KÜLTÜR (Kan ve İdrar) alırım, hemen ardından geniş\nspektrumlu (Karbapenem) başlarım. Kültürsüz antibiyotik başlarsam etkeni\nasla bulamayabiliriz.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Neden Prostat Biyopsisinde Fosfomisin kullanıyoruz? O sadece\nsistit ilacı değil mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: Fosfomisin prostata çok iyi geçer (Penetrasyonu iyidir) ve\nE.coli direnci çok düşüktür. Oral olduğu için de pratiktir. Kinolon\ndirenci yüzünden artık biyopsi profilaksisinde ilk tercihlerden\nbiridir.</li>\n</ul>\n<p>Semptomları (LUTS)**</p>\n"}]}, {"n": 3, "t": "BPH ve Erkek Alt Üriner Sistem Semptomları (LUTS)", "s": [{"id": "3.1", "t": "Tanımlar, Patofizyoloji ve BPH-LUTS İlişkisi", "h": "<h3 id=\"a-kavramlar-muhteşem-dörtlü\">A. KAVRAMLAR: \"MUHTEŞEM\nDÖRTLÜ\"</h3>\n<p>EAU Kılavuzu bu terimleri net ayırır. Vizitte hocana \"Hastanın BPH'sı\nvar\" dersen, hoca \"Patolojik tanısı mı var?\" diye sorabilir. Doğru dil\nşudur:</p>\n<h3 id=\"1-bph-benign-prostat-hiperplazisi\">1. BPH (Benign Prostat\nHiperplazisi):</h3>\n<ul>\n<li>Tanım: Sadece HİSTOLOJİK (Mikroskobik) bir tanıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Stromal ve epitelyal hücrelerin hiperplazisidir (Sayıca artış).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Önemli:</em> 80 yaşındaki erkeklerin %90'ında histolojik BPH\nvardır ama hepsinin şikayeti yoktur.</li>\n</ul>\n<h3 id=\"1-bpe-benign-prostat-büyümesi---enlargement\">1. BPE (Benign\nProstat Büyümesi - Enlargement):</h3>\n<ul>\n<li>Tanım: KLİNİK bir tanıdır (Rektal Tuşe veya USG ile).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Prostat hacminin artmasıdır (Genelde &gt;30 cc).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>BPH, prostatın büyümesine (BPE) neden <em>olabilir</em> ama her BPH\nbüyümeyle gitmez.</li>\n</ul>\n<h3 id=\"1-boo-mesane-çıkım-tıkanıklığı---bladder-outlet-obstruction\">1.\nBOO (Mesane Çıkım Tıkanıklığı - Bladder Outlet Obstruction):</h3>\n<ul>\n<li>Tanım: ÜRODİNAMİK bir tanıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yüksek detrusor basıncı + Düşük idrar akımı.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>BPE, tıkanıklığa (BOO) neden <em>olabilir</em> ama her büyük prostat\ntıkamaz (Dışa doğru büyüyebilir). Küçük bir prostat (ör: Mesane boynu\ndarlığı veya median lob) ciddi BOO yapabilir.</li>\n</ul>\n<h3 id=\"1-luts-alt-üriner-sistem-semptomları\">1. LUTS (Alt Üriner Sistem\nSemptomları):</h3>\n<ul>\n<li>Tanım: Hastanın ŞİKAYETİDİR.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>BPH/BPE/BOO, LUTS yapabilir. Ama LUTS yapan binlerce başka neden\nvardır (OAB, Poliüri, Enfeksiyon, Taş).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kural:</em> \"Hastanın LUTS'u var\" denir, \"Hastanın BPH şikayeti\nvar\" denmez.</li>\n</ul>\n<h3 id=\"b-patofi̇zyoloji̇-tikanikliğin-i̇ki̇-bi̇leşeni̇\">B. PATOFİZYOLOJİ:\nTIKANIKLIĞIN İKİ BİLEŞENİ</h3>\n<p>İlaç tedavisini bu mekanizmaya göre seçiyoruz. Prostat neden\ntıkıyor?</p>\n<h3 id=\"1-statik-bileşen-kütle-etkisi\">1. Statik Bileşen (Kütle\nEtkisi):</h3>\n<ul>\n<li><p>Nedir: Prostatın fiziksel olarak büyüyüp üretrayı\nsıkıştırmasıdır.</p></li>\n<li><p>Sorumlu: Epitelyal doku büyümesi.</p></li>\n<li><p>Tedavi Hedefi: Prostatı küçültmek.</p></li>\n<li><p>İlaç: 5-Alfa Redüktaz İnhibitörleri (5-ARI) -&gt;\nFinasterid/Dutasterid. (Epiteli küçültür).</p></li>\n</ul>\n<h3 id=\"2-dinamik-bileşen-kas-tonusu\">2. Dinamik Bileşen (Kas\nTonusu):</h3>\n<ul>\n<li><p>Nedir: Prostat stromasındaki ve mesane boynundaki düz kasların\nkasılmasıdır.</p></li>\n<li><p>Sorumlu: Alfa-1 Adrenerjik Reseptörler. (Özellikle Alfa-1a alt\ntipi).</p></li>\n<li><p>Tedavi Hedefi: Kası gevşetmek.</p></li>\n<li><p>İlaç: Alfa-Blokerler -&gt; Tamsulosin/Alfuzosin. (Tonusu azaltır,\nkanalı genişletir).</p></li>\n</ul>\n<h3 id=\"c-mesaneni̇n-yaniti-kazanan-yoktur-kaybeden-mesanedi̇r\">C.\nMESANENİN YANITI: \"KAZANAN YOKTUR, KAYBEDEN MESANEDİR\"</h3>\n<p>BPH sadece prostat hastalığı değildir, asıl hasar mesanede olur.\nTıkanıklık (BOO) karşısında mesane 2 evreden geçer:</p>\n<p>Evre 1: Kompansasyon (Uyum) Evresi:</p>\n<ul>\n<li><p>Tıkanıklığı aşmak için detrusor kası hipertrofiye uğrar (Kas\nyapar).</p></li>\n<li><p>Sistoskopi: Trabekülasyon (Kas liflerinin belirginleşmesi)\ngörülür.</p></li>\n<li><p>Klinik: Semptomlar hafiftir, rezidü idrar (PMR) kalmaz.</p></li>\n<li><p>Risk: Detrusor instabilitesi gelişir -&gt; Depolama Semptomları\n(Sıkışma/Sık idrar) başlar.</p></li>\n</ul>\n<p>Evre 2: Dekompansasyon (Yetersizlik) Evresi:</p>\n<ul>\n<li><p>Mesane yorulur. Kas liflerinin yerini bağ dokusu\n(Kollajen/Fibrozis) alır.</p></li>\n<li><p>Sistoskopi: Selül ve Divertikül (Zayıf noktalardan fıtıklaşma)\noluşur.</p></li>\n<li><p>Klinik: Kasa gücü azalır, boşaltamaz. Rezidü İdrar (PMR)\nartar.</p></li>\n<li><p>Sonuç: Kronik Retansiyon -&gt; Hidronefroz -&gt; Böbrek\nYetmezliği.</p></li>\n<li><p><em>Önemli:</em> Bu evreye girmeden ameliyat etmelisin! Mesane\n\"Tembel\" (Underactive) olursa prostatı alsan bile işeyemez.</p></li>\n</ul>\n<h3 id=\"d-eti̇yoloji̇-modern-teori̇ler\">D. ETİYOLOJİ: MODERN TEORİLER</h3>\n<p>Eskiden \"Yaşlanınca olur\" denirdi. Artık biliyoruz ki BPH sistemik\nbir hastalıktır.</p>\n<h3 id=\"1-hormonal-teori-dht\">1. Hormonal Teori (DHT):</h3>\n<ul>\n<li>Testosteron prostat içine girer -&gt; 5-Alfa Redüktaz (Tip 2) enzimi\nile -&gt; Dihidrotestosteron (DHT)'a dönüşür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>DHT, prostatı büyüten asıl güçlü androjendir (Testosterondan 10 kat\ngüçlü).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Tedavi:</em> Bu yüzden 5-ARI ilaçları DHT'yi bloklar.</li>\n</ul>\n<h3 id=\"1-metabolik-sendrom-ve-enflamasyon\">1. Metabolik Sendrom ve\nEnflamasyon:</h3>\n<ul>\n<li>Obezite, Diyabet, Hipertansiyon -&gt; Sistemik Enflamasyon\nyapar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Enflamasyon -&gt; Prostatta büyüme faktörlerini (IGF, FGF)\ntetikler.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Metabolik sendromu olanlarda BPH daha hızlı ilerler\nve LUTS daha şiddetlidir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastanın prostatı 80 gram (BPE var) ama şikayeti (LUTS) yok.\nAkımı (Qmax) 18 ml/sn. Ameliyat edelim mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: HAYIR! \"Profilaktik Prostatektomi\" diye bir şey yoktur.\nŞikayeti yoksa, böbrekleri sağlamsa, sadece prostatı büyük diye ameliyat\nedilmez. Takip edilir (Wait and See).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın prostatı sadece 25 gram (Küçük) ama çok zor işiyor,\nakımı zayıf. Neden?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Median Lob: Mesane boynuna \"kapakçık\" (ball-valve) gibi oturup\ntıkıyor olabilir.</p></li>\n<li><p>Mesane Boynu Yüksekliği/Darlığı: Prostat küçük olsa bile boyun\naçılmıyordur.</p></li>\n<li><p>Üretra Darlığı: Prostat dışı nedenler.</p></li>\n</ol>\n<!-- -->\n\n<h3 id=\"1-soru-sistoskopide-gördüğün-trabekülasyon-neyin-işaretidir\">1.\nSoru: \"Sistoskopide gördüğün 'Trabekülasyon' neyin işaretidir?\"</h3>\n<ul>\n<li>Cevap: Mesanenin çıkım tıkanıklığına (BOO) karşı verdiği mücadelenin\n(Kompansasyon) işaretidir. Detrusor kas demetleri kalınlaşmıştır.\nTıkanıklığın kronik olduğunu gösterir.</li>\n</ul>\n<h3 id=\"1-soru-metabolik-sendrom-ile-bph-ilişkisi-nedir\">1. Soru:\n\"Metabolik Sendrom ile BPH ilişkisi nedir?\"</h3>\n<ul>\n<li>Cevap: Hiperinsülinemi ve Obezite, prostat büyümesini hızlandırır.\nAyrıca pelvik iskemiye yol açarak LUTS'u şiddetlendirir. Bu hastalarda\nerektil disfonksiyon da (ED) sık görülür.</li>\n</ul>\n"}, {"id": "3.2", "t": "Tanısal Değerlendirme - I (Temel)", "h": "<p>EAU Kılavuzlarına göre, invaziv testlere (sistoskopi, ürodinami)\ngeçmeden önce yapılması ZORUNLU standart değerlendirme şunları\niçerir:</p>\n<h3 id=\"a-ipss-uluslararasi-prostat-semptom-skoru\">A. IPSS (ULUSLARARASI\nPROSTAT SEMPTOM SKORU)</h3>\n<p>Bu sadece bir anket değil, tedavi şemasını belirleyen ana\nkriterdir.</p>\n<h3 id=\"1-yapısı-7-soru--1-yaşam-kalitesi\">1. Yapısı (7 Soru + 1 Yaşam\nKalitesi):</h3>\n<p>Sorular iki gruba ayrılır (Bunu ayırt etmek tedaviyi seçerken\nönemlidir):</p>\n<ul>\n<li>Boşaltım (Obstrüktif) Soruları: (1, 3, 5, 6. Sorular)</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tam boşalamama hissi, Kesik kesik işeme, Akım zayıflığı, Ikınarak\nbaşlama.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Depolama (İrritatif) Soruları: (2, 4, 7. Sorular)</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sık idrara çıkma (Pollaküri), Tutamama/Sıkışma (Urgency), Gece\nkalkma (Nocturia).</li>\n</ul>\n<h3 id=\"2-skorlama-ve-yönetim-eau-algoritması\">2. Skorlama ve Yönetim\n(EAU Algoritması):</h3>\n<p>Her soru 0-5 arası puanlanır. Toplam 35 puandır.</p>\n<ul>\n<li><p>0-7 Puan (Hafif): TAKİP ET (Watchful Waiting). İlaç verme, hayat\ntarzı önerileri ver.</p></li>\n<li><p>8-19 Puan (Orta): MEDİKAL TEDAVİ. (Alfa blokerler vb.).</p></li>\n<li><p>20-35 Puan (Şiddetli): İLERİ TETKİK / CERRAHİ. (Yaşam kalitesini\nbozuyorsa).</p></li>\n</ul>\n<h3 id=\"3-soru-8-yaşam-kalitesi-qol---quality-of-life\">3. Soru 8: Yaşam\nKalitesi (QoL - Quality of Life):</h3>\n<ul>\n<li><p><em>\"Hayatının geri kalanını idrar yapma şeklin bugünkü gibi\nolacak şekilde geçirseydin ne hissederdin?\"</em></p></li>\n<li><p>0 (Memnunum) - 6 (Berbat).</p></li>\n<li><p><em>Klinik Kural:</em> Hastanın IPSS'i 25 bile olsa, QoL skoru\n0-1 ise (\"Ben halimden memnunum, alıştım\") diyorsa AMELİYAT ETME! Biz\nskoru değil, hastayı tedavi ediyoruz.</p></li>\n</ul>\n<h3 id=\"b-psa-prostat-spesi̇fi̇k-anti̇jen---sadece-kanser-değil\">B. PSA\n(PROSTAT SPESİFİK ANTİJEN) - Sadece Kanser Değil!</h3>\n<p>BPH yönetiminde PSA'nın rolü sadece kanseri ekarte etmek değildir;\nProstatın Büyümesini ve İlerlemesini Öngörmektir.</p>\n<h3 id=\"1-hacim-tahmini-proxy-marker\">1. Hacim Tahmini (Proxy\nMarker):</h3>\n<ul>\n<li><p>EAU diyor ki: Eğer PSA &gt; 1.5 ng/mL ise, o prostat muhtemelen\n&gt; 30 cc'dir.</p></li>\n<li><p>Bu hastaların semptomlarının ilerleme ve akut retansiyona\n(tıkanmaya) girme riski yüksektir.</p></li>\n<li><p><em>Tedavi Kararı:</em> Bu hastalara 5-ARI\n(Finasterid/Dutasterid) eklenmelidir (Kombinasyon tedavisi).</p></li>\n</ul>\n<h3 id=\"2-kanser-ayrımı\">2. Kanser Ayrımı:</h3>\n<ul>\n<li><p>BPH da PSA'yı yükseltir.</p></li>\n<li><p>Kural: PSA 4-10 ng/mL arasındaysa (Gri Zon):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Serbest/Total PSA Oranı'na bak.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Oran &lt; %15-20 ise Kanser riski yüksektir -&gt; Biyopsi.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Oran &gt; %25 ise BPH lehinedir.</li>\n</ul>\n<h3 id=\"c-i̇şeme-günlüğü-frequency-volume-chart---fvc\">C. İŞEME GÜNLÜĞÜ\n(FREQUENCY-VOLUME CHART - FVC)</h3>\n<p>Bunu istemeden noktüri tedavisi yapmak, karanlıkta ateş etmektir.</p>\n<p>Nasıl Yapılır?</p>\n<p>Hasta en az 24 saat (ideali 3 gün), saati saatine ne kadar su\niçtiğini ve ne kadar idrar yaptığını (ölçü kabıyla) not eder.</p>\n<p>Tanılar (Neye Bakıyoruz?):</p>\n<ol type=\"1\">\n<li>Noktüri: Gece uykudan uyanıp idrar yapmaktır. (Uyuyamayıp tuvalete\ngitmek değil, tuvalet için uyanmak!).</li>\n</ol>\n<h3 id=\"2-24-saatlik-poliüri\">2. 24 Saatlik Poliüri:</h3>\n<ul>\n<li>Günlük idrar miktarı &gt; 3 Litre (veya &gt; 40 ml/kg).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Sebep:</em> Diyabet, Diyabet İnsipidus, Polidipsi (Çok su\niçme).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Tedavi:</em> Prostatla ilgisi yok! Dahiliye'ye gönder.</li>\n</ul>\n<h3 id=\"1-noktürnal-poliüri-np---en-sik-tuzak\">1. Noktürnal Poliüri (NP)\n- EN SIK TUZAK!</h3>\n<ul>\n<li>24 saatlik idrar normaldir ama üretimin çoğu gecedir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>NP İndeksi (NPI): (Gece İdrar Hacmi) / (24 Saatlik Toplam\nHacim).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gençlerde: &gt; %20</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yaşlılarda (&gt;65): &gt; %33 (Yani idrarın 3'te 1'i gece\nçıkıyorsa).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Sebep:</em> Kalp Yetmezliği (Ödemin gece çözülmesi), Venöz\nYetmezlik, Uyku Apnesi (OSAS), Akşam çay/kahve içimi.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Tedavi:</em> Desmopressin, Diüretik saatinin değişimi, Varis\nçorabı. Prostat ameliyatı bu hastayı düzeltmez!</li>\n</ul>\n<h3 id=\"d-di̇ğer-temel-testler\">D. DİĞER TEMEL TESTLER</h3>\n<h3 id=\"1-tam-i̇drar-tahlili-ti̇t\">1. Tam İdrar Tahlili (TİT):</h3>\n<ul>\n<li>Enfeksiyon (Lökosit/Nitrit), Hematüri veya Glikozüri (Diyabet) var\nmı?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Eğer Hematüri Varsa:</em> BPH deyip geçme, Mesane Kanseri ekarte\nedilmeli (Görüntüleme + Sistoskopi).</li>\n</ul>\n<h3 id=\"1-böbrek-fonksiyon-testleri-kreatinin\">1. Böbrek Fonksiyon\nTestleri (Kreatinin):</h3>\n<ul>\n<li>EAU: Her hastada zorunlu değildir ama yapılması önerilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eğer Kreatinin yüksekse ve Hidronefroz varsa -&gt; Yüksek Basınçlı\nKronik Retansiyon. (Acil drenaj gerekir!).</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Polikliniğe gelen 60 yaşında hastanın IPSS skoru 12 (Orta),\nQoL 4 (Mutsuz). Ama 'Gece 5 kere kalkıyorum' diyor. İşeme günlüğünde\ngündüz 1000 cc, gece 1500 cc idrarı var. Tanı ve Tedavi?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tanı: Noktürnal Poliüri (Gece idrarı &gt; %33).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tedavi: BPH ilacı (Alfa bloker) tek başına işe yaramaz. Hastaya\nakşam sıvı kısıtlaması önerilmeli, bacak ödemi varsa gündüz atılması\nsağlanmalı. Düzelmezse Desmopressin düşünülmeli.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"İşeme günlüğünde 'Maksimum İşeme Hacmi' (Maximum Voided\nVolume) neden önemli?\"</li>\n</ol>\n<ul>\n<li>Cevap: Fonksiyonel mesane kapasitesini gösterir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eğer hasta her seferinde en fazla 100-150 cc işiyorsa -&gt; Küçük\nKapasiteli Mesane (OAB, İnterstisyel Sistit veya TB sekeli).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eğer 500-600 cc işeyebiliyorsa mesane kapasitesi normaldir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"PSA değeri 1.2 ng/mL olan, IPSS skoru 25 olan hastaya 5-ARI\n(Avodart/Proscar) verelim mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: Hayır. PSA 1.5'in altındaysa prostat muhtemelen küçüktür\n(&lt;30cc). 5-ARI'lar küçük prostatlarda etkisizdir. Sadece yan etki\n(Libido kaybı) yapar. Sadece Alfa-bloker verilmeli.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastaya IPSS formunu verdin, okuma yazması yok. Ne\nyapacaksın?\"</li>\n</ol>\n<ul>\n<li>Cevap: Soruları ben okuyacağım ama yönlendirmeden (\"Çok mu\nsıkışıyorsun?\" değil, \"Ne sıklıkla sıkışıyorsun?\") cevaplamasını\nisteyeceğim. Veya görsel IPSS skalaları (gülen/ağlayan yüzler)\nkullanılabilir.</li>\n</ul>\n"}, {"id": "3.3", "t": "Tanısal Değerlendirme - II (Ürodinami ve Akım)", "h": "<h3 id=\"a-üroflowmetri̇-i̇şeme-testi̇\">A. ÜROFLOWMETRİ (İŞEME TESTİ)
