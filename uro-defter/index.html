ar verebilir (kanama\nriski). Bu yüzden kanallar küçülmüştür:</p>\n<ul>\n<li><p>Mini-PCNL: 16-20 Fr.</p></li>\n<li><p>Ultra-Mini: 11-13 Fr.</p></li>\n<li><p>Micro-PCNL: Sadece iğne içinden (4.8 Fr) lazerle kırma.</p></li>\n<li><p><em>Kural:</em> Kanal küçüldükçe kanama azalır ama taşın dışarı\nalınma süresi uzar.</p></li>\n</ul>\n<h3 id=\"e-kompli̇kasyonlar-kritik-takip\">E. KOMPLİKASYONLAR (Kritik\nTakip)</h3>\n<ol type=\"1\">\n<li><p>Kanama: En sık görülen komplikasyondur. Eğer durdurulamazsa renal\narter anjiyografisi ve Embolizasyon gerekebilir.</p></li>\n<li><p>Yandaki Organ Yaralanmaları: Pleura (Pnömotoraks), Kolon veya\nDalak/Karaciğer zedelenmesi.</p></li>\n<li><p>Ürosepsis: Tıkalı ve enfekte sistemde yüksek basınçlı irrigasyon\nfelakettir.</p></li>\n<li><p>Ekstravazasyon: Sıvının batın içine veya retroperitona\nkaçması.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"PCNL sırasında 'Kalisiyel Divertikül' taşına girerken neye\ndikkat edersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: Divertikülün boynu dar olduğu için taş parçaları dökülemez.\nMutlaka divertikül içine direkt ponksiyon yapılmalı ve taş alındıktan\nsonra divertikül boynu lazer veya koter ile genişletilmelidir\n(fulgurasyon).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Ameliyat bittiğinde her hastaya Nefrostomi tüpü takmak\nzorunlu mudur?\"</li>\n</ol>\n<ul>\n<li>Cevap: Hayır. Eğer kanama yoksa, taş tamamen temizlendiyse ve üreter\naçıksa \"Tubeless PCNL\" (tüpsüz) yapılabilir. Bu, hastanın ağrısını ve\nhastanede kalış süresini azaltır.</li>\n</ul>\n<h3 id=\"1-soru-üst-pol-ponksiyonu-yaparken-en-büyük-risk-nedir\">1. Soru:\n\"Üst pol ponksiyonu yaparken en büyük risk nedir?\"</h3>\n<ul>\n<li>Cevap: Hidro-Pnömotoraks. 11. veya 12. kaburga üzerinden girilirken\npleura zedelenebilir. Hastanın solunumu bozulursa akciğer grafisi\nçekilmeli ve gerekirse göğüs tüpü takılmalıdır.</li>\n</ul>\n<h3 id=\"1-soru-valdivia-pozisyonu-nedir\">1. Soru: \"Valdivia Pozisyonu\nnedir?\"</h3>\n<ul>\n<li>Cevap: Supine (sırtüstü) PCNL pozisyonlarından biridir; hasta\nsırtının altına bir yastık konularak hafif yan yatırılır.</li>\n</ul>\n"}, {"id": "4.8", "t": "Metabolik Değerlendirme ve Metafilaksi", "h": "<h3 id=\"a-ki̇me-detayli-değerlendi̇rme-yapalim\">A. KİME DETAYLI\nDEĞERLENDİRME YAPALIM?</h3>\n<p>Her ilk kez taş düşürene 24 saatlik idrar analizi yapmak\nmaliyetlidir. EAU Kılavuzu \"Yüksek Riskli Taş Oluşturucular\" grubuna bu\ntestleri zorunlu kılar:</p>\n<ul>\n<li><p>Çocuklar ve adölesanlar.</p></li>\n<li><p>Tekrarlayan (Rekürren) taşları olanlar.</p></li>\n<li><p>Genetik yatkınlığı olanlar: Sistinüri, RTA (Renal Tübüler\nAsidoz), Primer Hiperoksalüri.</p></li>\n<li><p>Soliter (Tek) böbreği olanlar.</p></li>\n<li><p>Anatomik anomalisi olanlar: At nalı böbrek, UPJ darlığı.</p></li>\n<li><p>Taş tipi riskli olanlar: Ürik asit, Sistin, Enfeksiyon\ntaşları.</p></li>\n</ul>\n<h3 id=\"b-24-saatli̇k-i̇drar-anali̇zi̇-altın-standart\">B. 24 SAATLİK İDRAR\nANALİZİ (Altın Standart)</h3>\n<p>Hasta 24 saat boyunca tüm idrarını bir kapta toplar. Şunlara\nbakarız:</p>\n<ol type=\"1\">\n<li><p>Hacim: &lt; 2 Litre ise risklidir.</p></li>\n<li><p>Kalsiyum: &gt; 250 mg/gün (Hiperkalsiüri).</p></li>\n<li><p>Oksalat: &gt; 40 mg/gün (Hiperoksalüri).</p></li>\n<li><p>Sitrat: &lt; 320 mg/gün (Hipositratüri - Taş oluşumunu engelleyen\nen önemli madde).</p></li>\n<li><p>Ürik Asit: &gt; 800 mg/gün.</p></li>\n<li><p>pH: Ürik asit için &lt; 5.5, Struvit/Kalsiyum fosfat için &gt;\n7.0 olması kritiktir.</p></li>\n</ol>\n<h3 id=\"c-genel-öneri̇ler-tüm-taş-hastaları-i̇çin\">C. GENEL ÖNERİLER (Tüm\nTaş Hastaları İçin)</h3>\n<ol type=\"1\">\n<li>Sıvı Alımı: En önemli kural! Günde 2.5 - 3 Litre su içilmeli. Amaç,\n24 saatlik idrar miktarını 2 Litrenin üzerinde tutmaktır.</li>\n</ol>\n<h3 id=\"2-beslenme\">2. Beslenme:</h3>\n<ul>\n<li>Tuz (Sodyum) Kısıtlaması: &lt; 3-5 gram/gün. Çok tuz, idrarda\nkalsiyum atılımını artırır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hayvansal Protein: Fazlası idrarı asidize eder ve sitratı düşürür.\nDengeli olmalı.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kalsiyum Kısıtlanmamalı: Yanlış bilinen bir gerçektir! Kalsiyumu\nkeserseniz, bağırsakta oksalatı bağlayamazsınız ve idrarda oksalat artar\n(Enterik Hiperoksalüri). Normal kalsiyum alımı (1-1.2 g/gün)\nşarttır.</li>\n</ul>\n<ol type=\"1\">\n<li>Limonata ve Narenciye: Doğal sitrat kaynağıdır. Hipositratüri için\nharika bir destekleyicidir.</li>\n</ol>\n<h3 id=\"d-spesi̇fi̇k-i̇laç-tedavi̇si̇\">D. SPESİFİK İLAÇ TEDAVİSİ</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Durum</th>\n<th>İlaç</th>\n<th>Mekanizma</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hiperkalsiüri</td>\n<td>Tiazid Diüretikler</td>\n<td>Böbrekten kalsiyum geri emilimini artırır, idrara kalsiyum geçişini\nazaltır.</td>\n</tr>\n<tr class=\"even\">\n<td>Hipositratüri / Asit pH</td>\n<td>Potasyum Sitrat</td>\n<td>İdrarı alkalize eder, kalsiyuma bağlanarak taşlaşmasını önler.</td>\n</tr>\n<tr class=\"odd\">\n<td>Hiperürikozüri (Gut)</td>\n<td>Allopurinol</td>\n<td>Ürik asit üretimini azaltır.</td>\n</tr>\n<tr class=\"even\">\n<td>Enfeksiyon Taşı</td>\n<td>AHA (Asetohidroksamik Asit)</td>\n<td>Üreaz enzimini inhibe eder (Yan etkileri nedeniyle zordur).</td>\n</tr>\n</tbody>\n</table>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Ürik asit taşlarını eritmek için neden Potasyum Sitrat\nveriyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Ürik asit taşları asidik pH'da oluşur. pH'ı 6.5 - 7.2 arasına\nçekmek ürik asidi çözünür hale getirir. Buna Oral Kemolizis denir. (Not:\npH 7.5'i geçerse bu sefer kalsiyum fosfat taşları oluşmaya başlar, denge\nönemli!).</li>\n</ul>\n<h3 id=\"1-soru-sodyum-kısıtlaması-idrardaki-kalsiyumu-nasıl-etkiler\">1.\nSoru: \"Sodyum kısıtlaması idrardaki kalsiyumu nasıl etkiler?\"</h3>\n<ul>\n<li>Cevap: Proksimal tübülde sodyum ve kalsiyum geri emilimi beraber\nseyreder. Çok sodyum alırsanız, sodyum atılırken kalsiyumu da\nberaberinde idrara çeker (Hiperkalsiüri yapar).</li>\n</ul>\n<h3\nid=\"1-soru-ispanak-ve-kuruyemişi-kısıtlamak-hangi-hastada-önemlidir\">1.\nSoru: \"Ispanak ve kuruyemişi kısıtlamak hangi hastada önemlidir?\"</h3>\n<ul>\n<li>Cevap: Hiperoksalürisi olan hastada. Oksalat en çok koyu yeşil\nsebzelerde (ıspanak, pazı) ve kuru yemişlerde bulunur.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Enfeksiyon taşlarında (Struvit) neden sadece ameliyat\nyetmez?\"</li>\n</ol>\n<ul>\n<li>Cevap: Çünkü bu taşların içinde bakteriler hapsolmuştur. Geride\nkalan mikroskobik bir parça bile yeni bir enfeksiyon odağı olur ve taşın\nhızla nüks etmesine yol açar. Mutlaka taşsızlık (stone-free) sağlanmalı\nve antibiyotik tedavisi devam etmelidir.</li>\n</ul>\n"}, {"id": "4.9", "t": "Özel Durumlarda Taş Yönetimi", "h": "<h3 id=\"a-gebeli̇kte-taş-hastaliği-en-hassas-konu\">A. GEBELİKTE TAŞ\nHASTALIĞI (En Hassas Konu)</h3>\n<p>Gebelikte fizyolojik olarak sağ tarafta daha belirgin olmak üzere\nhidronefroz (progesteron etkisi ve bası) normaldir. Ancak taş işin içine\ngirince durum değişir.</p>\n<h3 id=\"1-tanı\">1. Tanı:</h3>\n<ul>\n<li>İlk Tercih: Ultrasonografi (USG). Hidronefrozu görürüz ama taşı\ngörmekte zorlanabiliriz.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İkinci Tercih: Transvaginal USG (Distal taşlar için) veya MR\nÜrografi (Tıkanıklık seviyesini radyasyonsuz gösterir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Düşük Doz BT: Sadece diğer yöntemlerle tanı konulamayan ve hayatı\ntehdit eden durumlarda, 2. ve 3. trimesterde çok nadiren.</li>\n</ul>\n<h3 id=\"1-tedavi\">1. Tedavi:</h3>\n<ul>\n<li>Konservatif: Hastaların %70-80'i hidrasyon ve analjezi ile taşı\ndüşürür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Drenaj: Sepsis veya durdurulamayan ağrı varsa; JJ Stent takılması\nveya Perkütan Nefrostomi (Lokal anesteziyle).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Cerrahi: Eğer drenaj yetmezse veya hasta kalıcı çözüm isterse\nFlexible URS güvenle yapılabilir. Ama kural: Skopi (radyasyon) kapalı\nolacak veya \"Pulse\" modunda, minimum sürede, kurşun yelek korumasıyla\nkullanılacaktır.</li>\n</ul>\n<h3 id=\"b-çocuklarda-taş-hastaliği-pediatrik-ürolithiazis\">B. ÇOCUKLARDA\nTAŞ HASTALIĞI (Pediatrik Ürolithiazis)</h3>\n<p>Çocuklarda taş varsa, altında mutlaka bir metabolik bozukluk veya\nanatomik anomali aranmalıdır.</p>\n<h3 id=\"1-cerrahi-farklar\">1. Cerrahi Farklar:</h3>\n<ul>\n<li>ESWL: Çocuklarda başarı oranı erişkinlerden daha yüksektir çünkü\ndoku geçişi daha rahattır. Şok dalgaları akciğerlere (kontüzyon riski)\ngelmemelidir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>URS/RIRS: Çocuk üreteri incedir. Genelde işlemden 1-2 hafta önce\nstent takıp (pre-stenting) üreteri genişletmek gerekebilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Mini-PCNL: Çocuk böbreği küçüktür, bu yüzden pediatrik kılıflar\n(10-14 Fr) kullanılır.</li>\n</ul>\n<ol type=\"1\">\n<li>Metafilaksi: Çocuklarda 24 saatlik idrar analizi ve taş analizi\nZORUNLUDUR.</li>\n</ol>\n<h3 id=\"c-soli̇ter-böbrekte-taş-tek-böbrek\">C. SOLİTER BÖBREKTE TAŞ (Tek\nBöbrek)</h3>\n<p>Bu hastada tıkanıklık demek, anüri (idrar çıkışının durması) ve\nsaatler içinde böbrek yetmezliği demektir.</p>\n<ul>\n<li><p>Aciliyet: Tıkanıklık saptandığı an dekompresyon (drenaj)\nyapılmalıdır.</p></li>\n<li><p>Cerrahi: PCNL veya RIRS yapılabilir ancak komplikasyon payı\nsıfırdır. Kanama olursa \"diğer böbrek\" yoktur. Bu yüzden bu hastalarda\nen az invaziv yöntem (genelde RIRS) önceliklidir.</p></li>\n</ul>\n<h3 id=\"d-at-nali-böbrek-ve-anatomi̇k-anomali̇ler\">D. AT NALI BÖBREK VE\nANATOMİK ANOMALİLER</h3>\n<p>At nalı böbrekte böbrekler alt pollerden birleşiktir ve rotasyonları\nfarklıdır. Üreterler daha önden (anterior) ve yüksekten çıkar.</p>\n<ul>\n<li><p>Zorluk: Böbrek pelvisi öne baktığı için standart PCNL girişleri\n(posterior) zordur.</p></li>\n<li><p>Yöntem: Taşın yerine göre Flexible URS (RIRS) veya laparoskopi\neşliğinde PCNL tercih edilebilir.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Gebe hastada JJ stent takarken skopi kullanmadan nasıl emin\nolursun?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Stent içindeki kılavuz telin (guide wire) mesaneden\nçıktığını görerek, stentin proksimal ucunun böbrek pelvisinde olduğunu\nise Ultrasonografi ile teyit ederek skopisiz stent takabilirim.\"</li>\n</ul>\n<h3 id=\"1-soru-nefrokalsinozis-nedir-taş-hastalığından-farkı-nedir\">1.\nSoru: \"Nefrokalsinozis nedir? Taş hastalığından farkı nedir?\"</h3>\n<ul>\n<li>Cevap: \"Taş hastalığı (nefrolithiazis) toplayıcı sistem içindeki\ntaşlardır. Nefrokalsinozis ise böbrek parankiminde (genelde medullada)\nkalsiyum birikmesidir. Genellikle Renal Tübüler Asidoz (RTA) veya\nHiperparatiroidi gibi ağır metabolik durumlarda görülür.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Çocuklarda ESWL yaparken akciğerleri korumak için ne\nyaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Şok dalgalarının akciğer bazallerine ulaşmaması için hastayı\nuygun pozisyonlandırırım ve diyaframın altına koruyucu kalkan (kurşun\nveya özel bariyerler) yerleştiririm.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Taş nedeniyle anüri (hiç idrar yapamama) gelişen bir hastada\nilk düşünmen gereken nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hastanın ya soliter (tek) böbrekli olduğunu ya da her iki\nüreterinin de taşla tam tıkalı olduğunu düşünürüm. Bu mutlak bir cerrahi\nacildir.\"</li>\n</ul>\n"}, {"id": "4.10", "t": "Nadir Taşlar ve Genetik Sendromlar", "h": "<h3 id=\"a-si̇sti̇n-taşlari-sistinüri\">A. SİSTİN TAŞLARI (Sistinüri)</h3>\n<p>En sık karşılaşılan nadir taş tipidir. Otozomal resesif bir aminoasit\ntransport bozukluğudur.</p>\n<ul>\n<li><p>Patoloji: Böbrek proksimal tübülünde COLA (Sistin, Ornitin,\nLizin, Arjinin) aminoasitlerinin geri emilimi bozulur. Sistin asidik\nidrarda çözünmez ve taşlaşır.</p></li>\n<li><p>Tanı: * Radyoloji: DÜSG'de \"Buzlu Cam\" (Ground-glass)\ngörünümü.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Mikroskopi: İdrarda tipik Hegzagonal (Altıgen) kristaller.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>Tedavi Zorluğu: Sistin taşları esnektir (\"plastik\" gibidir). ESWL\nbu taşlarda etkisizdir. Lazerle (RIRS) kırmak bile saatler\nsürebilir.</p></li>\n<li><p>Metafilaksi: * Hidrasyon: Çok agresif olmalı (Günde &gt;4 litre\nidrar hedeflenir).</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Alkalizasyon: pH &gt; 7.5 tutulmalıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İlaç: Tiopronin veya D-Penisilamin (Sistini sülfhidril bağlarıyla\nbağlayıp çözünürlüğü artırır).</li>\n</ul>\n<h3 id=\"b-pri̇mer-hi̇peroksalüri̇-ph\">B. PRİMER HİPEROKSALÜRİ (PH)</h3>\n<p>Karaciğerdeki bir enzim eksikliği (AGXT) sonucu vücudun aşırı oksalat\nüretmesidir.</p>\n<ul>\n<li><p>Klinik: Çocukluk çağında başlayan tekrarlayan kalsiyum oksalat\nmonohidrat taşları ve Nefrokalsinozis.</p></li>\n<li><p>Tehlike: Oksalat böbrek parankimine çöker ve hızla son dönem\nböbrek yetmezliğine (SDBY) yol açar.</p></li>\n<li><p>Tedavi: Çok yüksek miktarda su, Piridoksin (Vitamin B6). Ağır\nvakalarda Kombine Karaciğer-Böbrek Nakli tek kesin çözümdür.</p></li>\n</ul>\n<h3 id=\"c-i̇laç-taşlari\">C. İLAÇ TAŞLARI</h3>\n<p>Bazı ilaçlar ya kendileri kristalize olur ya da idrar metabolizmasını\nbozarak taş yapar.</p>\n<ul>\n<li><p>İndinavir: HIV tedavisinde kullanılır. Radyolüsenttir (BT'de bile\ngörülmeyebilir!).</p></li>\n<li><p>Triamteren: Diüretik olarak kullanılır.</p></li>\n<li><p>Topiramat: Antiepileptiktir. Karbonik anhidraz inhibisyonu\nyaparak distal RTA benzeri bir tablo (alkali idrar + hipositratüri)\nüzerinden taş yapar.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 4 Final Soruları)</p>\n<ol type=\"1\">\n<li>Soru: \"Sistin taşı olan hastaya neden 'gece kalkıp su içmelisin'\ndiyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Sistinüri hastalarında idrar konsantrasyonu gece en yüksek\nseviyeye ulaşır. Taş oluşumunu engellemek için 24 saatlik idrar hacmi\nsabit tutulmalıdır; bu yüzden uykuyu bölüp hidrasyonu sürdürmek\nhayatidir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Ürik asit taşını alkali idrarda (pH 7.0) eritirken, sistin\ntaşında neden pH 7.5'i hedefliyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Sistinin çözünürlüğü pH 7.0'den sonra logaritmik olarak\nartar. pH 7.5 üzerine çıkıldığında sistin çok daha kolay çözünür, ancak\nbu sefer kalsiyum fosfat taşı riski artar. Denge hassastır.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hangi nadir taş tipinde 'L-metiyoninden fakir diyet'\nönerilir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Sistinüri'de. Metiyonin, sistinin öncü maddesidir\n(prekürsör). Hayvansal protein kısıtlaması bu nedenle önemlidir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"BT'de taşı görüp DÜSG'de göremediğin (radyolüsent) taşlar\nnelerdir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Ürik asit, Ksantin, 2,8-Dihidroksiadenin ve İndinavir\ntaşları.</li>\n</ul>\n"}]}, {"n": 5, "t": "Prostat Kanseri", "s": [{"id": "5.1", "t": "Epidemiyoloji ve Tarama Stratejileri", "h": "<h3 id=\"a-epi̇demi̇yoloji̇-ki̇m-tehli̇kede\">A. EPİDEMİYOLOJİ: KİM\nTEHLİKEDE?</h3>\n<p>Prostat kanseri erkeklerde en sık görülen solid organ kanseridir ve\nkansere bağlı ölümlerde akciğer kanserinden sonra ikinci sıradadır.</p>\n<p>Değiştirilemez Risk Faktörleri:</p>\n<ol type=\"1\">\n<li><p>Yaş: En güçlü risk faktörüdür. 50 yaşın altında nadirdir, yaş\narttıkça insidans patlar.</p></li>\n<li><p>Etnisite: Siyah ırkta risk daha yüksektir ve hastalık daha\nagresif seyreder. Asya kökenlilerde risk en düşüktür.</p></li>\n<li><p>Genetik ve Aile Öyküsü: * Birinci derece akrabada (baba/erkek\nkardeş) varsa risk 2 kat artar.</p></li>\n</ol>\n<ul>\n<li>İki veya daha fazla akrabada varsa risk 5-11 kat artar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>BRCA2 Mutasyonu: Sadece meme kanseri değil, prostat kanseri riskini\nde artırır ve bu hastalar genelde daha kötü prognoza sahiptir.</li>\n</ul>\n<h3 id=\"b-psa-dost-mu-düşman-mi\">B. PSA: DOST MU, DÜŞMAN MI?</h3>\n<p>PSA (Prostat Spesifik Antijen) kansere özgü değil, PROSTATA ÖZGÜDÜR.\n* PSA'yı Yükselten Nedenler: BPH, Prostatit, İdrar retansiyonu (Glob),\nSistoskopi, Biyopsi, Ejakülasyon (son 48 saat) ve Bisiklete binmek\n(prostat masajı etkisi).</p>\n<ul>\n<li>PSA'yı Düşüren Nedenler: 5-Alfa Redüktaz İnhibitörleri\n(Finasterid/Dutasterid). <em>Kural: Bu ilaçları kullanan hastada PSA\ndeğerini 2 ile çarparak gerçeği buluruz.</em></li>\n</ul>\n<h3 id=\"c-eau-tarama-algori̇tmasi-ki̇me-ne-zaman\">C. EAU TARAMA\nALGORİTMASI: KİME, NE ZAMAN?</h3>\n<p>EAU \"Toplum bazlı yaygın tarama\" yerine \"Risk-adaptif erken tanı\"\nstratejisini önerir. Amaç, ölümcül olabilecek kanserleri yakalamak,\nyavaş seyirli olanları rahat bırakmaktır.</p>\n<h3 id=\"1-taramaya-başlama-yaşı\">1. Taramaya Başlama Yaşı:</h3>\n<ul>\n<li><p>Risk faktörü olmayan erkekler: 50 yaş.</p></li>\n<li><p>Aile öyküsü (PCa) olanlar veya Siyah ırk: 45 yaş.</p></li>\n<li><p>BRCA2 mutasyonu taşıyanlar: 40 yaş.</p></li>\n</ul>\n<h3 id=\"2-tarama-ne-zaman-bırakılmalı\">2. Tarama Ne Zaman\nBırakılmalı?</h3>\n<ul>\n<li>Beklenen yaşam süresi &lt; 10-15 yıl olan erkeklerde tarama\nyapılmamalıdır. Çünkü bu hastada kanser çıksa bile, hasta başka nedenden\nölecektir; teşhisin ve tedavinin komplikasyonları hastayı daha çok\nüzecektir (Watchful Waiting felsefesi).</li>\n</ul>\n<h3 id=\"3-takip-sıklığı-40-45-yaş-başlangıç-değerine-göre\">3. Takip\nSıklığı (40-45 Yaş Başlangıç Değerine Göre):</h3>\n<ul>\n<li><p>PSA &lt; 1 ng/mL ise: 8-10 yıl sonra tekrar bakılabilir (Düşük\nrisk).</p></li>\n<li><p>PSA &gt; 1 ng/mL ise: 2 yılda bir takip edilmelidir.</p></li>\n</ul>\n<h3 id=\"d-rektal-tuşe-dre-hala-gerekli̇-mi̇\">D. REKTAL TUŞE (DRE): HALA\nGEREKLİ Mİ?</h3>\n<p>Evet! PSA'sı normal olan hastaların yaklaşık %10-15'inde sadece\nrektal tuşedeki sertlik (nodül) ile kanser yakalanabilir. PSA düşük olsa\nbile parmakla hissedilen asimetri, sertlik veya fiksite biyopsi\nendikasyonudur.</p>\n<h3 id=\"e-psa-türevleri̇-karar-vermeye-yardimci-olanlar\">E. PSA\nTÜREVLERİ: KARAR VERMEYE YARDIMCI OLANLAR</h3>\n<p>PSA tek başına yetmediğinde (özellikle 4-10 ng/mL arası gri zon)\nşunlara bakıyoruz:</p>\n<ol type=\"1\">\n<li>PSA Dansitesi (PSAD): PSA / Prostat Hacmi (USG/MR).</li>\n</ol>\n<ul>\n<li>Eşik: &gt; 0.15 ise biyopsi lehinedir. (Prostat küçük ama PSA\nyüksekse tehlike büyüktür).</li>\n</ul>\n<ol type=\"1\">\n<li>PSA Velocity (Hız): Yıllık artış hızı. \\&gt; 0.75 ng/mL/yıl<br />\nartış kanser lehinedir.</li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Serbest/Total PSA Oranı: %15-20'nin altı riskli kabul edilir.</li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"75 yaşında, ağır KOAH ve kalp yetmezliği olan hastada PSA 7\nng/mL geldi. Biyopsi yapalım mı?\"</li>\n</ol>\n<ul>\n<li>Cevap: Hayır. Hastanın komorbiditeleri nedeniyle yaşam beklentisi 10\nyılın altındadır. Tanı koysak bile küratif tedavi (cerrahi/radyoterapi)\nuygulayamayacağımız için hastayı gereksiz yere biyopsi riskine\nsokmamalıyız.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın babası 50 yaşında prostat kanserinden ölmüş. Hasta\n42 yaşında geldi. PSA bakmalı mısın?\"</li>\n</ol>\n<ul>\n<li>Cevap: Evet. Güçlü aile öyküsü olanlarda tarama sınırı 45, hatta\nbazı kaynaklara göre 40'a çekilir.</li>\n</ul>\n<h3 id=\"1-soru-ejakülasyon-psayı-ne-kadar-süre-etkiler\">1. Soru:\n\"Ejakülasyon PSA'yı ne kadar süre etkiler?\"</h3>\n<ul>\n<li>Cevap: Yaklaşık 48 saat. PSA kanı vermeden önce 2 gün cinsel perhiz\nistenir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"PSA taraması 'Overdiagnosis' (Aşırı Teşhis) riskini nasıl\nartırır?\"</li>\n</ol>\n<ul>\n<li>Cevap: PSA taramasıyla hiçbir zaman hastaya zarar vermeyecek olan\n\"klinik önemsiz\" (Gleason 3+3) kanserleri çok fazla yakalıyoruz. Bu da\nhastada gereksiz strese ve gereksiz cerrahi komplikasyonlara yol\naçabiliyor.</li>\n</ul>\n"}, {"id": "5.2", "t": "Tanısal Görüntüleme ve mpMRI (PI-RADS v2.1)", "h": "<h3 id=\"a-mpmri-neden-standart-oldu\">A. mpMRI NEDEN STANDART OLDU?</h3>\n<ol type=\"1\">\n<li><p>Aşırı Teşhisi Azaltır: Klinik olarak önemsiz (Gleason 3+3)\nkanserleri görmezden gelmemize yardımcı olur.</p></li>\n<li><p>Tanı Doğruluğunu Artırır: Klinik olarak önemli (Gleason ≥ 3+4)\nkanserleri hedeflememizi sağlar.</p></li>\n<li><p>Negatif Öngörü Değeri (NPV): MR tertemizse (PI-RADS 1-2), PSA\ndansitesi de düşükse biyopsiyi erteleme şansı verir.</p></li>\n</ol>\n<h3 id=\"b-pi-rads-v21-prostate-imaging-reporting-and-data-system\">B.\nPI-RADS v2.1 (Prostate Imaging-Reporting and Data System)</h3>\n<p>MR raporunda gördüğün 1'den 5'e kadar olan skorlar, o bölgede \"Klinik\nÖnemli Kanser\" bulunma ihtimalini söyler:</p>\n<ul>\n<li><p>PI-RADS 1: Çok düşük risk (Kanser olasılığı çok az).</p></li>\n<li><p>PI-RADS 2: Düşük risk.</p></li>\n<li><p>PI-RADS 3: Orta risk (Şüpheli, PSA dansitesine göre karar\nverilir).</p></li>\n<li><p>PI-RADS 4: Yüksek risk (Biyopsi ŞART).</p></li>\n<li><p>PI-RADS 5: Çok yüksek risk (&gt;1.5 cm veya prostat dışına taşma\nşüphesi).</p></li>\n</ul>\n<h3 id=\"c-mrdaki̇-üç-si̇lahşörler-sekanslar\">C. MR'DAKİ ÜÇ SİLAHŞÖRLER\n(Sekanslar)</h3>\n<p>Radyolog bu puanı verirken üç farklı görüntüye bakar:</p>\n<ol type=\"1\">\n<li><p>T2-Ağırlıklı Görüntü (Anatomi): Prostatın zonlarını (Periferik\nvs. Transizyonel) en iyi burada görürüz. Tümörler burada genelde\n\"Siyah/Koyu\" (Hipointens) odak olarak görünür.</p></li>\n<li><p>DWI (Difüzyon Ağırlıklı Görüntü - EN KRİTİĞİ): Kanser hücreleri\nçok sıkı paketlendiği için su moleküllerinin hareketini\nkısıtlar.</p></li>\n</ol>\n<ul>\n<li>ADC Haritası: Tümör burada kapkara görünür (Kısıtlanmış\ndifüzyon).</li>\n</ul>\n<ol type=\"1\">\n<li>DCE (Dinamik Kontrastlı Görüntü): Kanserli doku yeni damarlar\noluşturduğu için kontrastı hızlı tutar ve hızlı boşaltır.</li>\n</ol>\n<h3 id=\"d-zona-göre-baskin-sekanslar-hoca-bunu-sorar\">D. ZONA GÖRE\nBASKIN SEKANSLAR (Hoca Bunu Sorar!)</h3>\n<p>Prostatın hangi bölgesinde hangi MR görüntüsüne güveneceğiz?</p>\n<ul>\n<li><p>Periferik Zon (PZ): Tümörlerin %70-80'i buradan çıkar. Burada ana\nbelirleyici sekans DWI (Difüzyon) görüntüsüdür.</p></li>\n<li><p>Transizyonel Zon (TZ): BPH'nın olduğu bölge. Burada ana\nbelirleyici sekans T2 görüntüsüdür. (Çünkü TZ'de BPH nodülleri difüzyonu\nzaten karıştırabilir).</p></li>\n</ul>\n<h3 id=\"e-evrelemede-mrin-rolü\">E. EVRELEMEDE MR'IN ROLÜ</h3>\n<p>MR sadece tanı koymaz, ameliyat planını da değiştirir:</p>\n<ul>\n<li><p>EPE (Ekstraprostatik Uzanım): Tümör kapsülü delmiş mi?</p></li>\n<li><p>SVI (Seminal Vezikül İnvazyonu): Tümör seminal keselere sıçramış\nmı?</p></li>\n<li><p>NVP (Nörovasküler Paket): Sinir koruyucu cerrahi yapabilir\nmiyiz?</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3 id=\"1-soru-hastanın-mrı-pi-rads-3-geldi-biyopsi-yapalım-mı\">1. Soru:\n\"Hastanın MR'ı PI-RADS 3 geldi. Biyopsi yapalım mı?\"</h3>\n<ul>\n<li>Cevap: \"Tek başına PI-RADS 3 kararsız bir skordur. Burada PSA\nDansitesine bakarım. Eğer PSAD &gt; 0.15 ise biyopsi yapmayı, düşükse\nyakın takip etmeyi (veya biyopsiyi ertelemeyi) düşünürüm.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Biyopsi yapılmış ve temiz gelmiş bir hastada PSA yükselmeye\ndevam ediyorsa MR'ın önemi nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Özellikle standart biyopsi iğnesinin ulaşamadığı Anterior\n(Ön) bölge tümörlerini yakalamak için mpMRI hayatidir. MR'daki şüpheli\nbölgeye füzyon biyopsi yapılmalıdır.\"</li>\n</ul>\n<h3 id=\"1-soru-adc-haritasında-kısıtlanmış-difüzyon-neyi-ifade-eder\">1.\nSoru: \"ADC haritasında 'kısıtlanmış difüzyon' neyi ifade eder?\"</h3>\n<ul>\n<li>Cevap: \"ADC değerinin düşük olması, o bölgedeki hücre yoğunluğunun\nçok yüksek olduğunu (kanser lehine) ve suyun hareketinin engellendiğini\ngösterir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"PI-RADS v2.1'de skorlamayı değiştiren 'upgrade' kuralı\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Örneğin TZ'de T2 skoru 3 olan bir lezyon, eğer difüzyonda\n(DWI) çok belirgin kısıtlanma gösteriyorsa (skor 4 veya 5), genel\nPI-RADS skoru bir üst dereceye yükseltilebilir.\"</li>\n</ul>\n"}, {"id": "5.3", "t": "Prostat Biyopsisi: Teknik ve Strateji", "h": "<h3 id=\"a-mr-ultrason-füzyon-bi̇yopsi̇\">A. MR-ULTRASON FÜZYON BİYOPSİ</h3>\n<p>MR’da görülen şüpheli alanın (PI-RADS ≥ 3) biyopsi sırasında\nkullanılan transrektal ultrason (TRUS) görüntüsüyle üst üste\nçakıştırılması işlemidir.</p>\n<p>Neden Füzyon?</p>\n<ul>\n<li><p>Standart biyopsinin kaçırdığı anterior (ön) ve apikal yerleşimli\ntümörleri yakalar.</p></li>\n<li><p>Klinik önemsiz kanserleri daha az, klinik önemli (agresif)\nkanserleri daha fazla yakalar.</p></li>\n</ul>\n<p>Teknikler:</p>\n<ol type=\"1\">\n<li><p>Kognitif Füzyon: Cerrah MR görüntüsünü aklında tutarak o bölgeye\niğne atar (Yanılgı payı yüksektir).</p></li>\n<li><p>Yazılım Tabanlı Füzyon: Özel cihazlar MR ve USG görüntülerini\ndijital olarak birleştirir (Altın standart).</p></li>\n</ol>\n<h3 id=\"b-transrektal-tr-vs-transperi̇neal-tp-yaklaşim\">B. TRANSREKTAL\n(TR) VS. TRANSPERİNEAL (TP) YAKLAŞIM</h3>\n<p>EAU 2025/2026 kılavuzlarında çok radikal bir değişim var. Bir asistan\nolarak bu trendi bilmelisin:</p>\n<h3 id=\"1-transrektal-biyopsi\">1. Transrektal Biyopsi:</h3>\n<ul>\n<li>Yol: İğne rektumdan geçer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Risk: Rektum florasındaki bakteriler (E. coli) kan dolaşımına\nkarışabilir. Ürosepsis riski vardır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Antibiyotik: Profilaksi ŞARTTIR.</li>\n</ul>\n<h3 id=\"1-transperineal-biyopsi-yeni̇-standart\">1. Transperineal Biyopsi\n(YENİ STANDART):</h3>\n<ul>\n<li>Yol: İğne makat ile testis torbası arasındaki deriden (perine)\ngeçer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Avantaj: Rektumdan geçmediği için enfeksiyon riski neredeyse\nsıfırdır. Prostatın ön bölgesine ulaşmak çok daha kolaydır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>EAU Önerisi: Enfeksiyon riskini minimize etmek için mümkünse\ntransperineal yaklaşımı tercih edin.</li>\n</ul>\n<h3 id=\"c-bi̇yopsi̇-strateji̇si̇-kaç-parça-alalım\">C. BİYOPSİ STRATEJİSİ\n(Kaç Parça Alalım?)</h3>\n<p>Eğer elimizde bir mpMRI varsa stratejimiz şöyledir:</p>\n<ul>\n<li><p>Target (Hedefli) Biyopsi: MR’daki şüpheli odaktan (genelde bir\nodaktan 2-4 parça).</p></li>\n<li><p>Sistematik Biyopsi: MR’daki odaktan bağımsız olarak prostatın tüm\nalanlarını tarayan standart 10-12 parça.</p></li>\n<li><p>Kural: Sadece hedefli biyopsi yapmak bazen MR'ın görmediği\nodakları kaçırabilir. Bu nedenle Hedefli + Sistematik kombinasyonu en\nyüksek başarıyı sağlar.</p></li>\n</ul>\n<h3 id=\"d-bi̇yopsi̇-öncesi̇-hazirlik-ve-kompli̇kasyonlar\">D. BİYOPSİ ÖNCESİ\nHAZIRLIK VE KOMPLİKASYONLAR</h3>\n<p>Hazırlık:</p>\n<ul>\n<li><p>Antibiyotik: Transrektal yapılacaksa Kinolon (Siprofloksasin)\nveya Fosfomisin. (Direnç bölgelerinde rektal sürüntüye göre seçim\nyapılır).</p></li>\n<li><p>Kan Sulandırıcılar: Antiplatelet/Antikoagülanlar (ASA, Plavix,\nCoumadin) işlemden 5-7 gün önce kesilmeli veya \"bridge\" (köprüleme)\nyapılmalıdır.</p></li>\n</ul>\n<p>Komplikasyonlar:</p>\n<ol type=\"1\">\n<li><p>Hematüri (İdrarda kan): Çok sıktır, genelde kendiliğinden\ngeçer.</p></li>\n<li><p>Hemospermi (Menide kan): Hastayı uyar! 4-6 hafta sürebilir,\nkorkutucu ama zararsızdır.</p></li>\n<li><p>Rektal Kanama: Genelde hafiftir.</p></li>\n<li><p>Akut Üriner Retansiyon (Glob): Prostatın şişmesine bağlı hasta\nişeyemez (Sonda gerekebilir).</p></li>\n<li><p>Ürosepsis: En korkulanıdır. Ateş ve titreme varsa hasta acilen\nyatırılmalıdır.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3\nid=\"1-soru-neden-transperineal-biyopsi-günümüzde-daha-çok-öneriliyor\">1.\nSoru: \"Neden transperineal biyopsi günümüzde daha çok öneriliyor?\"</h3>\n<ul>\n<li>Cevap: \"Temel neden enfeksiyon güvenliğidir. Transrektal yolla\nyapılan biyopsilerde floradaki dirençli bakteriler nedeniyle sepsis\nriski artmıştır. Transperineal yolda cilt dezenfeksiyonu yapılabildiği\niçin sepsis riski yok denecek kadar azdır.\"</li>\n</ul>\n<h3\nid=\"1-soru-biyopsi-raporunda-asap-veya-hgpin-görürsen-ne-yaparsın\">1.\nSoru: \"Biyopsi raporunda 'ASAP' veya 'HGPIN' görürsen ne yaparsın?\"</h3>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>HGPIN (High-Grade Prostatic Intraepithelial Neoplasia): Tek\nodaktaysa takip edilir, biyopsi tekrarı şart değildir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>ASAP (Atypical Small Acinar Proliferation): Kanser şüphesi yüksektir\nama tanı için yetersizdir. Biyopsi tekrarı (mümkünse füzyon ile)\nŞARTTIR.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Biyopsi sonrası ateşle gelen hastada ilk yaklaşımın ne\nolmalıdır?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ürosepsis şüphesiyle hastayı yatırırım. Kan ve idrar kültürü\nalıp hemen geniş spektrumlu (Karbapenem veya Piperasilin-Tazobaktam)\nantibiyotik başlarım. Kinolon direncini mutlaka hesaba katarım.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sistematik biyopsi ile füzyon biyopsiyi kombine etmenin\nmantığı nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"mpMRI'nın negatif öngörü değeri %100 değildir. MR'da\ngörünmeyen ama klinik olarak önemli olabilecek (özellikle Gleason 7)\nodakları yakalamak için sistematik örnekleme emniyet kemeridir.\"</li>\n</ul>\n"}, {"id": "5.4", "t": "Patoloji ve Derecelendirme (Gleason & ISUP)", "h": "<h3 id=\"a-gleason-skorlama-si̇stemi̇\">A. GLEASON SKORLAMA SİSTEMİ</h3>\n<p>Gleason sistemi, tümörün glandüler (bezsel) yapısının bozulma\nderecesine dayanır. Patolog, dokudaki en baskın iki paterni toplar.</p>\n<ul>\n<li><p>Primer Patern: Dokuda en yaygın görülen yapı.</p></li>\n<li><p>Sekonder Patern: Dokuda ikinci en yaygın görülen yapı.</p></li>\n</ul>\n<p>Kural: Eğer biyopsi örneğinde tek bir patern varsa (örn: hepsi 3),\nskor \\3+3=6 olarak kaydedilir. Eğer üç farklı patern varsa (3, 4 ve 5),\nbiyopsi materyalinde en sık olan ve en kötü (yüksek) olan patern\ntoplanır.</p>\n<h3 id=\"b-isup-derece-gruplari-grade-groups\">B. ISUP DERECE GRUPLARI\n(GRADE GROUPS)</h3>\n<p>Gleason skoru bazen kafa karıştırıcı olabilir (Örn: \\3+4 ile\n\\4+3<br />\nikisi de 7 eder ama seyirleri farklıdır). Bu yüzden 2014'te ISUP\n(International Society of Urological Pathology) sistemi\ngeliştirildi:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>ISUP Derecesi</th>\n<th>Gleason Skoru</th>\n<th>Patolojik Görünüm</th>\n<th>Prognoz</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Grup 1</td>\n<td>\\3 + 3 = 6</td>\n<td>Sadece iyi diferansiye bezler.</td>\n<td>Mükemmel</td>\n</tr>\n<tr class=\"even\">\n<td>Grup 2</td>\n<td>\\3 + 4 = 7</td>\n<td>Çoğunlukla iyi bezler, az miktar kötü.</td>\n<td>İyi</td>\n</tr>\n<tr class=\"odd\">\n<td>Grup 3</td>\n<td>\\4 + 3 = 7</td>\n<td>Çoğunlukla kötü bezler, az miktar iyi.</td>\n<td>Orta</td>\n</tr>\n<tr class=\"even\">\n<td>Grup 4</td>\n<td>\\4 + 4 = 8</td>\n<td>Kötü diferansiye / Kribriform yapı.</td>\n<td>Kötü</td>\n</tr>\n<tr class=\"odd\">\n<td>Grup 5</td>\n<td>\\9 - 10</td>\n<td>Glandüler yapı kalmamış / Nekroz.</td>\n<td>Çok Kötü</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"c-kri̇bri̇form-yapinin-önemi̇-vizitlerin-yeni-favorisi\">C.\n\"KRİBRİFORM\" YAPININ ÖNEMİ (Vizitlerin Yeni Favorisi)</h3>\n<p>Yeni kılavuzlarda (EAU 2025/2026), Gleason 4 paterninin içinde\n\"Kribriform\" (eleksi/delikli) yapı olup olmadığına özellikle\nbakılır.</p>\n<ul>\n<li><p>Eğer patoloji raporunda \"Kribriform patern izlenmiştir\"\nyazıyorsa, bu kanser normal bir Gleason 4'ten çok daha\nsaldırgandır.</p></li>\n<li><p>Klinik Önemi: Bu hastalar \"Aktif İzlem\" (Active Surveillance)\niçin uygun değildir, direkt tedaviye yönlendirilmelidir.</p></li>\n</ul>\n<h3 id=\"d-radi̇kal-prostatektomi̇-spesmeni̇nde-gleason\">D. RADİKAL\nPROSTATEKTOMİ SPESMENİNDE GLEASON</h3>\n<p>Ameliyat sonrası prostatın tamamı incelendiğinde skor değişebilir\n(Up-grade veya Down-grade).</p>\n<ul>\n<li>Tersiyer Patern: Ameliyat materyalinde %5'ten az görülen ama çok\nsaldırgan olan üçüncü bir patern varsa not edilir. (Örn: \\3+4 ama %2\noranında Gleason 5 var). Bu durum nüks riskini artırır.</li>\n</ul>\n<h3 id=\"e-di̇ğer-kri̇ti̇k-teri̇mler\">E. DİĞER KRİTİK TERİMLER</h3>\n<ol type=\"1\">\n<li><p>Perinöral İnvazyon (PNI): Tümörün sinir lifleri etrafına\nsarılmasıdır. Genelde daha yüksek evreyle ilişkilidir.</p></li>\n<li><p>Linfovasküler İnvazyon (LVI): Tümörün damar içine girmesidir.\nMetastaz riskini gösterir.</p></li>\n<li><p>İntraduktal Karsinom (IDC-P): Prostat kanallarının içindeki\nsaldırgan yayılımdır. Kötü prognoz işaretidir.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Gleason \\3+4=7 ile \\4+3=7 arasındaki temel klinik fark\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"\\3+4 (ISUP 2) olan hastada baskın hücre tipi iyi huylu olan\n3'tür, bu hastalar düşük-orta riskli kabul edilir. Ancak \\4+3<br />\n(ISUP 3) olan hastada baskın hücre tipi saldırgan olan 4'tür. ISUP 3\nhastalarda metastaz ve nüks riski ISUP 2'ye göre 3 kat daha\nfazladır.\"</li>\n</ul>\n<h3 id=\"1-soru-biyopside-gleason-224-tanısı-koyabilir-miyiz\">1. Soru:\n\"Biyopside Gleason \\2+2=4 tanısı koyabilir miyiz?\"</h3>\n<ul>\n<li>Cevap: \"Güncel patoloji pratiğinde artık biyopsi materyalinde\nGleason 1 ve 2 kullanılmaz. Tanı konulabilecek en düşük derece Gleason\n\\3+3=6'dır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Patoloji raporunda 'Kanser odağı 12 korun 1'inde, 2 mm ve\nGleason 6' yazıyor. Ne düşünürsün?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu, 'Klinik Önemsiz Kanser' adayıdır. Hastanın yaşına ve PSA\ndeğerine bakarak bu hastayı ameliyat etmek yerine Aktif İzlem programına\nalmayı düşünürüm.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Patolog 'Varyant Histoloji' (Örn: Duktal karsinom,\nNöroendokrin diferansiyasyon) rapor ederse ne değişir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bu varyantlar standart adenokarsinomdan çok daha agresiftir\nve PSA ile her zaman doğru takip edilemezler. Daha agresif cerrahi veya\nkemoterapi gerekebilir.\"</li>\n</ul>\n"}, {"id": "5.5", "t": "Evreleme ve Risk Sınıflandırması", "h": "<h3 id=\"a-eau-ri̇sk-gruplari-damico-modi̇fi̇ye\">A. EAU RİSK GRUPLARI\n(D’AMICO MODİFİYE)</h3>\n<p>Tedavi kararını (Ameliyat mı, İzlem mi?) bu tabloya göre veriyoruz.\nHastanı bu kutulardan birine yerleştir:</p>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Risk Grubu</th>\n<th>PSA</th>\n<th>Gleason / ISUP</th>\n<th>Klinik Evre (cT)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Düşük Risk</td>\n<td>&lt; 10</td>\n<td>ISUP 1 (Gl 3+3)</td>\n<td>T1c - T2a (Hissedilmeyen/Küçük)</td>\n</tr>\n<tr class=\"even\">\n<td>Orta Risk</td>\n<td>10 - 20</td>\n<td>ISUP 2-3 (Gl 7)</td>\n<td>T2b (Yarım lobdan büyük)</td>\n</tr>\n<tr class=\"odd\">\n<td>Yüksek Risk</td>\n<td>&gt; 20</td>\n<td>ISUP 4-5 (Gl 8-10)</td>\n<td>≥ T2c veya T3 (Kapsül dışı)</td>\n</tr>\n</tbody>\n</table>\n<p>Not: Eğer hastanın parametreleri farklı gruplara giriyorsa (Örn: PSA\n8 ama Gleason 8), hasta en yüksek olan gruba dahil edilir.</p>\n<h3 id=\"b-tnm-evrelemesi̇-kritik-noktalar\">B. TNM EVRELEMESİ (Kritik\nNoktalar)</h3>\n<ul>\n<li>T (Primer Tümör): * T1: Parmakla hissedilmez. (T1c: PSA\nyüksekliğiyle yakalanan).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>T2: Prostat içinde sınırlı. (T2a: Tek lobun yarısından azı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>T3: Kapsül dışına taşma. (T3a: Ekstraprostatik uzanım, T3b: Seminal\nvezikül invazyonu).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>T4: Çevre organlara (Rektum, mesane, pelvik duvar) invazyon.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><p>N (Lenf Nodu): N0 (Yok), N1 (Bölgesel lenf nodu\nmetastazı).</p></li>\n<li><p>M (Metastaz): M1a (Bölgesel olmayan lenf nodu), M1b (Kemik), M1c\n(Visseral organ - Karaciğer/Akciğer).</p></li>\n</ul>\n<h3 id=\"c-evreleme-araçlari-ki̇me-ne-i̇steyeli̇m\">C. EVRELEME ARAÇLARI:\nKİME NE İSTEYELİM?</h3>\n<p>EAU 2025/2026 kılavuzları gereksiz maliyet ve radyasyondan\nkaçınır:</p>\n<ol type=\"1\">\n<li><p>Düşük Riskli Hasta: Hiçbir evreleme (Sintigrafi/BT) GEREKMEZ.\nTümörün yayılma ihtimali çok düşüktür.</p></li>\n<li><p>Orta Riskli Hasta: Eğer ISUP 3 (Gleason 4+3) ise evreleme\nönerilir.</p></li>\n<li><p>Yüksek Riskli Hasta: Mutlaka evreleme yapılmalıdır.</p></li>\n</ol>\n<p>Geleneksel Yöntemler:</p>\n<ul>\n<li><p>Kemik Sintigrafisi: Kemik metastazı taraması.</p></li>\n<li><p>Abdomen/Pelvis BT: Lenf nodu taraması.</p></li>\n</ul>\n<p>Yeni Altın Standart: PSMA-PET (Ga-68 veya F-18)</p>\n<p>Geleneksel görüntülemeden çok daha hassastır. Özellikle yüksek riskli\nhastalarda ameliyat öncesi gizli metastazları yakalamak için artık ilk\ntercihler arasına girmiştir.</p>\n<h3 id=\"d-lenf-nodu-di̇sseksi̇yonu-lnd-karari\">D. LENF NODU DİSSEKSİYONU\n(LND) KARARI</h3>\n<p>Hoca ameliyatta sorar: \"Bu hastaya lenf nodu temizliği yapalım\nmı?\"</p>\n<ul>\n<li><p>Sadece BT veya MR'a bakarak karar verilmez.</p></li>\n<li><p>Nomogramlar (Örn: Briganti): PSA, Evre ve ISUP değerlerini\ngirersin. Eğer lenf nodu metastaz riski &gt; %5-7 ise ameliyat sırasında\nGenişletilmiş (Extended) Pelvik Lenf Nodu Disseksiyonu\nyapılmalıdır.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3\nid=\"1-soru-klinik-t2a-ile-t2b-arasındaki-fark-parmakla-nasıl-anlaşılır\">1.\nSoru: \"Klinik T2a ile T2b arasındaki fark parmakla nasıl\nanlaşılır?\"</h3>\n<ul>\n<li>Cevap: \"T2a'da sertlik tek lobun yarısından azını kaplar. T2b'de ise\nsertlik tek lobun yarısından fazlasını kaplamıştır ancak hala tek bir\nlobdadır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"PSMA-PET her zaman kanseri gösterir mi? Yanlış negatiflik\nolabilir mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bazı çok düşük diferansiye veya nöroendokrin özellik\ngösteren tümörlerde PSMA ekspresyonu düşük olabilir. Ayrıca küçük (5 mm\naltı) metastazlar gözden kaçabilir. Yine de günümüzdeki en hassas\naraçtır.\"</li>\n</ul>\n<h3\nid=\"1-soru-kemik-sintigrafisinde-metastazı-en-çok-neyle-karıştırırsın\">1.\nSoru: \"Kemik sintigrafisinde metastazı en çok neyle karıştırırsın?\"</h3>\n<ul>\n<li>Cevap: \"Dejeneratif değişikliklerle (artroz/kireçlenme).\nSintigrafide 'sıcak odak' görülen her yer kanser değildir; travma veya\nenflamasyon da tutulum yapabilir. Bu durumda direkt grafi veya MR ile\nkorelasyon gerekir.\"</li>\n</ul>\n<h3\nid=\"1-soru-neden-düşük-riskli-hastalara-kemik-sintigrafisi-istemiyoruz\">1.\nSoru: \"Neden düşük riskli hastalara kemik sintigrafisi\nistemiyoruz?\"</h3>\n<ul>\n<li>Cevap: \"PSA &lt; 10 ve Gleason 6 olan bir hastada kemik metastazı\nbulunma ihtimali %1'den azdır. Pozitif gelen sonuçlar genelde yalancı\npozitifliktir ve hastayı gereksiz ek tetkik/stres sarmalına sokar.\"</li>\n</ul>\n"}, {"id": "5.6", "t": "Lokalize Hastalıkta \"Gözlem\" Stratejileri", "h": "<h3 id=\"a-akti̇f-i̇zlem-active-surveillance---as\">A. AKTİF İZLEM (ACTIVE\nSURVEILLANCE - AS)</h3>\n<p>Felsefe: \"Bu kanser şu an zararsız ama ileride saldırganlaşabilir.\nKür şansını kaybetmeden, tedavi yan etkilerini (inkontinans, ED) mümkün\nolduğunca öteleyelim.\"</p>\n<ul>\n<li><p>Hedef Hasta: Yaşam beklentisi &gt; 10 yıl olan, Düşük Riskli\nhastalar.</p></li>\n<li><p>EAU 2025/2026 Kriterleri (İdeal Aday):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>PSA &lt; 10 ng/mL.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>ISUP Derece 1 (Gleason 3+3).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik Evre ≤ T2a.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>PSA Dansitesi &lt; 0.15.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Biyopsi kriterleri (Genelde &lt; 2-3 pozitif kor, kor başına &lt;\n%50 tümör).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Protokol (Nasıl İzliyoruz?):</li>\n</ul>\n<ol type=\"1\">\n<li><p>PSA Takibi: İlk yıl her 6 ayda bir.</p></li>\n<li><p>DRE (Rektal Tuşe): Yılda bir.</p></li>\n<li><p>mpMRI: Genelde 12-24. ayda bir tekrar.</p></li>\n<li><p>Kontrol Biyopsisi: 12. ayda \"Confirmatory\" (doğrulama) biyopsisi\nönerilir.</p></li>\n</ol>\n<ul>\n<li>Tedaviye Geçiş (Küratif Tedavi Ne Zaman?):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>ISUP derecesinin artması (Gleason 3+4 veya üzerine çıkış).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tümör hacminin biyopside belirgin artması.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hastanın psikolojik olarak izlemi tolere edememesi.</li>\n</ul>\n<h3 id=\"b-bekle-gör-watchful-waiting---ww\">B. BEKLE-GÖR (WATCHFUL\nWAITING - WW)</h3>\n<p>Felsefe: \"Bu hasta kanserden değil, başka bir nedenden ölecek. Kanser\nşikayet yapana kadar (metastaz/obstrüksiyon) hiçbir şey yapmayalım.\"</p>\n<ul>\n<li><p>Hedef Hasta: Yaşam beklentisi &lt; 10 yıl olan veya ciddi\nkomorbiditeleri (Ağır KKY, KOAH, Demans) bulunan hastalar.</p></li>\n<li><p>Risk Grubu: Tüm risk grupları (Düşük, Orta, Yüksek) WW adayı\nolabilir.</p></li>\n<li><p>Takip: PSA veya biyopsi takibi rutin değildir. Sadece semptom\ntakibi yapılır.</p></li>\n<li><p>Tedavi: Amaç kür (iyileşme) değil, palpasyondur. Kemik ağrısı\nolursa radyoterapi, idrar tıkanıklığı olursa TUR-P, metastaz olursa ADT\n(Hormon tedavisi) verilir.</p></li>\n</ul>\n<h3 id=\"c-as-vs-ww-temel-farklar-hoca-bunu-mutlaka-sorar\">C. AS VS. WW:\nTEMEL FARKLAR (Hoca Bunu Mutlaka Sorar!)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Özellik</th>\n<th>Aktif İzlem (AS)</th>\n<th>Bekle-Gör (WW)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Amaç</td>\n<td>Küratif tedaviyi ertelemek (Kür hala hedef)</td>\n<td>Semptomatik tedavi (Palyasyon)</td>\n</tr>\n<tr class=\"even\">\n<td>Yaşam Beklentisi</td>\n<td>&gt; 10 Yıl</td>\n<td>&lt; 10 Yıl</td>\n</tr>\n<tr class=\"odd\">\n<td>Takip Araçları</td>\n<td>PSA, mpMRI, Re-biyopsi</td>\n<td>Klinik semptomlar</td>\n</tr>\n<tr class=\"even\">\n<td>Risk Grubu</td>\n<td>Sadece Düşük Risk</td>\n<td>Tüm Risk Grupları</td>\n</tr>\n</tbody>\n</table>\n<h3 id=\"d-akti̇f-i̇zlemde-modern-beli̇rteçler-2026-güncellemesi̇\">D. AKTİF\nİZLEMDE \"MODERN\" BELİRTEÇLER (2026 GÜNCELLEMESİ)</h3>\n<p>Artık sadece PSA ve biyopsiye bakmıyoruz. mpMRI'da lezyonun büyümesi\nveya Genetik Testler (Decipher, Oncotype DX, Prolaris) izlem kararında\nçok daha etkili. Eğer hastanın genetik skoru \"agresif\" gelirse, Gleason\n6 olsa bile izlemden çıkarıp ameliyata yönlendirebiliriz.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3\nid=\"1-soru-gleason-33-olan-her-hastayı-aktif-i̇zleme-alabilir-miyiz\">1.\nSoru: \"Gleason 3+3 olan her hastayı Aktif İzlem'e alabilir miyiz?\"</h3>\n<ul>\n<li>Cevap: \"Hayır. Hastanın yaşam beklentisi, PSA dansitesi ve tümörün\nbiyopsideki hacmi (kor sayısı) önemlidir. Ayrıca mpMRI'da PI-RADS 4/5\nlezyon varsa ve sistematik biyopsi Gleason 6 geldiyse, hedeflenmiş\nbiyopsiyle lezyonun gerçek derecesini (upgrade riskini) dışlamadan AS\nkararı vermemek gerekir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Aktif İzlem'deki bir hastada PSA yükselmesi tek başına\nameliyat kararı verdirir mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Tek başına PSA yükselmesi (PSA hızı/ikiye katlanma süresi\nuyarıcı olsa da) genellikle yeterli değildir. mpMRI ile yeni/büyüyen\nodak varlığına bakılmalı ve mutlaka re-biyopsi ile patolojik progresyon\nispatlanmalıdır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Bekle-Gör (WW) programındaki hastada ne zaman hormon tedavisi\n(ADT) başlarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Semptomatik metastaz geliştiğinde veya PSA artışına bağlı\nlokal progresyon (idrar çıkışında zorlanma/hematüri) riskinde palyatif\namaçla başlarım.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Neden Gleason 3+4 (ISUP 2) hastalar genelde Aktif İzlem'e\nalınmaz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"İçinde Gleason 4 paterni barındıran tümörlerin metastaz\npotansiyeli vardır. Ancak 2025/2026 kılavuzları, çok seçilmiş, düşük\nhacimli ve kribriform patern içermeyen ISUP 2 hastaların 'Sıkı İzlem'\n(Favorable Intermediate Risk) altında AS adayı olabileceğini\nbelirtmektedir.\"</li>\n</ul>\n"}, {"id": "5.7", "t": "Küratif Tedaviler - Radikal Prostatektomi (RP)", "h": "<h3 id=\"a-cerrahi̇-tekni̇kler-rarp-vs-lrp-vs-açik\">A. CERRAHİ TEKNİKLER:\nRARP vs. LRP vs. AÇIK</h3>\n<ol type=\"1\">\n<li><p>Robot Yardımlı Radikal Prostatektomi (RARP): Günümüzde dünyada ve\nTürkiye'deki merkezlerin çoğunda altın standarttır. 3D görüntü, el\ntitremesinin önlenmesi ve 7 derece hareket kabiliyeti ile sinir korumada\nüstündür.</p></li>\n<li><p>Laparoskopik (LRP): Robotun olmadığı yerlerde uygulanır, öğrenme\neğrisi daha zordur.</p></li>\n<li><p>Açık RP (RRP): Retropubik yaklaşım. Robotik cerrahiye göre kanama\nmiktarı daha fazladır ancak onkolojik sonuçlar tecrübeli ellerde\nbenzerdir.</p></li>\n</ol>\n<h3 id=\"b-ameli̇yatin-kri̇ti̇k-basamaklari\">B. AMELİYATIN KRİTİK\nBASAMAKLARI</h3>\n<ol type=\"1\">\n<li><p>Mesane Boynu Diseksiyonu: Mesane ile prostatın birleştiği yer\nkesilir. Burada üreter orifislerini korumak için çok dikkatli\nolunmalıdır (özellikle median lobu büyük olanlarda).</p></li>\n<li><p>Vaz Deferens ve Seminal Vezikül Diseksiyonu: Prostatın\narkasındaki \"liman\" bölgesi. Seminal keseler tamamen\nçıkarılmalıdır.</p></li>\n<li><p>Nörovasküler Paket (Sinir) Koruma: Prostatın saat 5 ve 7\nhizasında seyreden ereksiyon sinirlerinin (Walsh sinirleri)\nkorunmasıdır.</p></li>\n<li><p>Endopelvik Fasya ve Dorsal Ven Kompleksi (DVC): Kanamanın en çok\nolduğu yerdir. DVC sütüre edilerek kontrol altına alınır.</p></li>\n<li><p>Üretra Diseksiyonu ve Anastomoz: Prostat çıkarıldıktan sonra\nmesane boynu ile üretra tekrar birbirine dikilir (Vezikoüretral\nAnastomoz).</p></li>\n</ol>\n<h3 id=\"c-si̇ni̇r-koruma-nerve-sparing-strateji̇si̇\">C. SİNİR KORUMA (NERVE\nSPARING) STRATEJİSİ</h3>\n<p>Her hastada sinir korunmaz. Karar verirken mpMRI ve biyopsi raporuna\nbakılır:</p>\n<ul>\n<li><p>İntrafasyal: Sinire en yakın, en pürüzsüz diseksiyon (Sadece\ndüşük riskli hastalarda).</p></li>\n<li><p>İnterfasyal: Orta yol.</p></li>\n<li><p>Ekstrafasyal: Sinirlerin kanser şüphesiyle feda edilmesi (T3 veya\nyüksek riskli hastalarda).</p></li>\n</ul>\n<h3 id=\"d-onkoloji̇k-başari-cerrahi̇-sinir-pozi̇ti̇fli̇ği̇-psm\">D. ONKOLOJİK\nBAŞARI: CERRAHİ SINIR POZİTİFLİĞİ (PSM)</h3>\n<p>Ameliyat sonrası patoloji raporunda \"Cerrahi sınır pozitiftir\" (R1)\nyazıyorsa, tümör prostatın kesi sınırına kadar ulaşmış demektir. Bu,\ngelecekte Biyokimyasal Nüks (PSA yükselmesi) riskini artırır.</p>\n<h3 id=\"e-fonksi̇yonel-sonuçlar-ve-kompli̇kasyonlar\">E. FONKSİYONEL\nSONUÇLAR VE KOMPLİKASYONLAR</h3>\n<ol type=\"1\">\n<li><p>İnkontinans (İdrar Kaçırma): En sık görülen sorundur. Genelde 3-6\nay içinde pelvik taban egzersizleriyle (Kegel) düzelir. Kalıcı hasar\n%5'in altındadır.</p></li>\n<li><p>Erektil Disfonksiyon (ED): Sinir korunsun ya da korunmasın,\nprostat çıkarıldıktan sonra geçici veya kalıcı iktidarsızlık\ngörülebilir. Erken dönemde \"Penil Rehabilitasyon\" (PDE5\ninhibitörleri/vakum) başlanmalıdır.</p></li>\n<li><p>Anastomoz Kaçağı: Ameliyat sonrası sondadan fazla dren gelmesi.\nGenelde sonda süresi uzatılarak iyileşir.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Robotik cerrahide 'Rocco Sütürü' (Posterior Musculofascial\nReconstruction) nedir ve neden yapılır?\"</li>\n</ol>\n<ul>\n<li>Cevap: Anastomoz öncesi mesane arkasındaki fasyayı üretral fasyaya\nyaklaştırma işlemidir. Amacı üretral gerginliği azaltmak ve ameliyat\nsonrası erken dönem idrar tutma (kontinans) başarısını artırmaktır.</li>\n</ul>\n<h3 id=\"1-soru-pelvik-lenf-nodu-disseksiyonu-plnd-sınırları-nelerdir\">1.\nSoru: \"Pelvik Lenf Nodu Disseksiyonu (PLND) sınırları nelerdir?\"</h3>\n<ul>\n<li>Cevap: Standart Şablon: Eksternal iliyak ven, obturator sinir ve\ninternal iliyak arter arasındaki bölge temizlenir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Ameliyat bittikten sonra idrar çıkışını kontrol etmek için\nmesaneye su verdiğimizde kaçak varsa ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: Anastomozu ek dikişlerle güçlendiririm. Kaçak devam ederse\nsondanın yerini kontrol eder ve dren takibini sıkılaştırırım.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Cerrahi sınır pozitifliği (R1) olan her hastaya hemen ek\ntedavi (Radyoterapi) verilmeli midir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Hayır. EAU kılavuzları, PSA yükselene kadar (Biyokimyasal\nnüks) beklemenin (Salvage RT) veya risk çok yüksekse erken dönemde\nvermenin (Adjuvan RT) tartışılabileceğini söyler. Genelde PSA takibi\ntercih edilir.</li>\n</ul>\n"}, {"id": "5.8", "t": "Radyoterapi ve Fokal Tedaviler", "h": "<h3 id=\"a-eksternal-işinlama-ebrt\">A. EKSTERNAL IŞINLAMA (EBRT)</h3>\n<p>Vücut dışından, doğrusal hızlandırıcılar (LINAC) vasıtasıyla prostat\ndokusuna yüksek enerjili X-ışınları gönderilmesidir.</p>\n<ol type=\"1\">\n<li><p>Teknikler (IMRT / VMAT): Modern cihazlar sadece prostata\nodaklanır, çevre dokuları (rektum ve mesane) maksimum düzeyde\nkorur.</p></li>\n<li><p>Hipofraksiyonasyon: Eskiden 8 hafta süren tedavi (78-80 Gy),\nartık daha yüksek dozlu ama daha kısa süreli (2-4 hafta) protokollerle\nyapılabilmektedir.</p></li>\n</ol>\n<h3 id=\"3-adt-hormon-tedavisi-kombinasyonu\">3. ADT (Hormon Tedavisi)\nKombinasyonu:</h3>\n<ul>\n<li>Orta Risk: 4-6 ay ADT eklenmesi önerilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Yüksek Risk: 2-3 yıl ADT ile kombine edilmelidir (Kür şansını\nartırır).</li>\n</ul>\n<h3 id=\"b-braki̇terapi̇-i̇çeriden-işınlama\">B. BRAKİTERAPİ (İçeriden\nIşınlama)</h3>\n<p>Prostatın içine radyoaktif kaynakların (çekirdeklerin)\nyerleştirilmesi işlemidir.</p>\n<ol type=\"1\">\n<li><p>LDR (Düşük Doz Hızı): Kalıcı çekirdekler (İyot-125) prostat içine\nbırakılır. Genelde sadece düşük riskli, küçük prostatlı hastalarda\nkullanılır.</p></li>\n<li><p>HDR (Yüksek Doz Hızı): Geçici iğnelerle yüksek doz verilir,\ngenelde EBRT ile kombine edilir.</p></li>\n</ol>\n<h3 id=\"c-radyoterapi̇-sonrasi-taki̇p-phoenix-kri̇terleri̇\">C. RADYOTERAPİ\nSONRASI TAKİP (PHOENIX KRİTERLERİ)</h3>\n<p>Ameliyat sonrası PSA'nın \"sıfıra\" (0.1 altına) inmesini bekleriz.\nAncak radyoterapide prostat yerinde olduğu için PSA hiçbir zaman\nsıfırlanmaz.</p>\n<ul>\n<li><p>Nadir (Nadir Noktası): PSA'nın düştüğü en alt seviye.</p></li>\n<li><p>Biyokimyasal Nüks Tanımı: Nadir + 2 ng/mL. (Örn: PSA 0.5'e kadar\ndüştü, sonra yükselip 2.5 olduysa nüks kabul edilir).</p></li>\n</ul>\n<h3 id=\"d-fokal-tedavi̇ler-sadece-tümörü-öldür\">D. FOKAL TEDAVİLER:\n\"SADECE TÜMÖRÜ ÖLDÜR\"</h3>\n<p>\"Neden tüm prostatı alıyoruz/ışınlıyoruz? Sadece MR'daki tümörü yok\nedelim\" felsefesidir.</p>\n<ol type=\"1\">\n<li><p>HIFU (Yüksek Yoğunluklu Odaklanmış Ultrason): Ses dalgalarıyla\ntümörü ısıtarak (termal) yok eder.</p></li>\n<li><p>Kriyoterapi: Dondurarak yok etme.</p></li>\n</ol>\n<h3 id=\"3-fokal-lazer-ablasyon\">3. Fokal Lazer Ablasyon:</h3>\n<ul>\n<li>EAU 2025/2026 Görüşü: Hala \"İnceleme Altında\" (Investigational)\nkategorisindedir. Sadece klinik çalışmalar dahilinde veya ameliyat/RT\nistemeyen çok seçilmiş hastalarda uygulanmalıdır. Uzun dönem sonuçları\ncerrahi kadar sağlam değildir.</li>\n</ul>\n<h3 id=\"e-kompli̇kasyonlar-rp-i̇le-farkini-bi̇l\">E. KOMPLİKASYONLAR (RP İLE\nFARKINI BİL!)</h3>\n<table>\n<thead>\n<tr class=\"header\">\n<th>Özellik</th>\n<th>Cerrahi (RP)</th>\n<th>Radyoterapi (RT)</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Erken Dönem</td>\n<td>Sonda, yara yeri, hematom</td>\n<td>İrritatif semptomlar (Sık idrar)</td>\n</tr>\n<tr class=\"even\">\n<td>Geç Dönem</td>\n<td>İnkontinans (Sık)</td>\n<td>Radyasyon Sistiti / Proktiti (Kanama)</td>\n</tr>\n<tr class=\"odd\">\n<td>Cinsel Fonksiyon</td>\n<td>ED hemen başlar</td>\n<td>ED zamanla gelişir</td>\n</tr>\n</tbody>\n</table>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Radyoterapi sonrası PSA 0.5'ten 1.2'ye çıktı. Hemen nüks mü\ndiyelim?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. 'PSA Bounce' (PSA Sıçraması) dediğimiz durum\nolabilir. Tedaviden 12-24 ay sonra geçici bir PSA yükselmesi\ngörülebilir. Acele etmemeli, Phoenix kriterlerini (Nadir + 2)\nbeklemeliyiz.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Radyasyon Sistiti gelişen ve kanaması olan hastada ne\nyaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Mesane irrigasyonu, gerekirse hiperbarik oksijen tedavisi\nveya koterizasyon (argon plazma koagülasyon) planlarım.\"</li>\n</ul>\n<h3 id=\"1-soru-brakiterapi-için-hangi-hastalar-uygun-değildir\">1. Soru:\n\"Brakiterapi için hangi hastalar uygun değildir?\"</h3>\n<ul>\n<li><strong>Cevap:</strong> \"Daha önce geçirilmiş TUR-P (prostatta oyuk\nolduğu için kaynaklar yerleşmez), çok büyük prostat (&gt;50-60 cc) ve\nciddi işeme şikayeti (IPSS &gt; 20) olanlar uygun değildir.\"</li>\n</ul>\n<h3 id=\"1-soru-kurtarma-salvage-cerrahisi-nedir\">1.\n<strong>Soru:</strong> \"Kurtarma (Salvage) cerrahisi nedir?\"</h3>\n<ul>\n<li><strong>Cevap:</strong> \"Radyoterapi sonrası nüks eden hastada\nprostatın çıkarılmasıdır. Anatomi tamamen bozulduğu ve dokular\nsertleştiği için komplikasyon riski (rektum yaralanması, inkontinans) en\nyüksek cerrahilerden biridir.\"</li>\n</ul>\n"}, {"id": "5.9", "t": "Metastatik ve Kastrasyona Dirençli Hastalık", "h": "<h3 id=\"a-metastati̇k-hormona-duyarli-prostat-kanseri̇-mhspc\">A.\nMETASTATİK HORMONA DUYARLI PROSTAT KANSERİ (mHSPC)</h3>\n<p>Hasta ilk kez metastazla (kemik, lenf, organ) gelmiştir ve hormon\ntedavisine henüz başlanmamıştır.</p>\n<h3 id=\"1-temel-tedavi-adt-androjen-deprivasyon-tedavisi\">1. Temel\nTedavi: ADT (Androjen Deprivasyon Tedavisi):</h3>\n<ul>\n<li>LHRH Agonistleri (Goserelin, Leuprolid): Önce testosteronu artırır\n(Flare etkisi), sonra düşürür. Mutlaka ilk 2 hafta anti-androjenle\nbaşlanmalıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>LHRH Antagonistleri (Degarelix, Relugolix): Testosteronu anında\ndüşürür, \"flare\" yapmaz.</li>\n</ul>\n<h3 id=\"1-kombinasyon-terapileri-2026-standartları\">1. Kombinasyon\nTerapileri (2026 Standartları):</h3>\n<ul>\n<li>EAU artık \"Sadece ADT\"yi yetersiz buluyor.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Doublet (İkili): ADT + Yeni Nesil Hormonal Ajan (Abirateron,\nEnzalutamid, Apalutamid) VEYA ADT + Dosetaksel (Kemoterapi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Triplet (Üçlü): ADT + Dosetaksel + (Abirateron veya Darolutamid).\nÖzellikle yüksek hacimli metastatik hastalıkta sağkalımı ciddi\nartırır.</li>\n</ul>\n<h3 id=\"b-kastrasyona-di̇rençli̇-prostat-kanseri̇-crpc\">B. KASTRASYONA\nDİRENÇLİ PROSTAT KANSERİ (CRPC)</h3>\n<p>En kritik tanım budur. Testosteron seviyesi cerrahi veya medikal\nolarak \"kastrasyon\" seviyesine (\\&lt; 50 ng/dL) inmiş olmasına rağmen\nPSA'nın yükselmesi veya yeni metastazların çıkmasıdır.</p>\n<ol type=\"1\">\n<li><p>M0 CRPC (Metastazsız): Sadece PSA yükseliyor ama görüntülemede\n(BT/Sintigrafi) metastaz yok. Burada PSMA-PET ile \"mikro-metastaz\"\naranmalı ve Apalutamid/Enzalutamid/Darolutamid seçenekleri\ndeğerlendirilmelidir.</p></li>\n<li><p>M1 CRPC (Metastatik): Artık hastalık kastrasyona dirençli ve\nmetastatik haldedir.</p></li>\n</ol>\n<h3 id=\"c-yeni̇-nesi̇l-ajanlarin-mekani̇zmalari\">C. YENİ NESİL AJANLARIN\nMEKANİZMALARI</h3>\n<ul>\n<li><p>Abirateron: Adrenal bezde ve tümörün içinde testosteron sentezini\nsağlayan CYP17 enzimini bloke eder. Mutlaka Prednizolon ile\nverilmelidir.</p></li>\n<li><p>Enzalutamid / Apalutamid / Darolutamid: Androjen reseptörünü (AR)\nbloke eder, testosteronun hücre içine girmesini ve DNA'ya bağlanmasını\nengeller.</p></li>\n<li><p>PARP İnhibitörleri (Olaparib): Sadece BRCA1/2 mutasyonu olan\nhastalarda DNA tamir mekanizmasını bozarak etki eder.</p></li>\n</ul>\n<h3 id=\"d-radyum-223-ve-lutesyum-177-nükleer-silahlar\">D. RADYUM-223 VE\nLUTESYUM-177 (Nükleer Silahlar)</h3>\n<ul>\n<li><p>Radyum-223: Sadece kemik metastazı olan, organ metastazı olmayan\nhastalarda kullanılan bir \"Alfa yayıcı\"dır. Kemikteki kalsiyum\ntaklitçisidir, metastaza yapışıp orayı içeriden bombalar.</p></li>\n<li><p>Lu-177 PSMA: \"Teranostik\" yaklaşımdır. PSMA-PET'te tutulum\ngösteren her yere gidip radyasyon bırakır. Kemoterapi sonrası en güçlü\nsilahtır.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3 id=\"1-soru-adt-alan-bir-hastada-kastrasyon-seviyesi-nedir\">1. Soru:\n\"ADT alan bir hastada 'Kastrasyon Seviyesi' nedir?\"</h3>\n<ul>\n<li>Cevap: \\50 ng/dL. Ancak güncel çalışmalar bu sınırın 20 ng/dL\naltında olmasının onkolojik sonuçları daha da iyileştirdiğini\ngöstermektedir.</li>\n</ul>\n<h3 id=\"1-soru-mhspc-hastasında-kemoterapi-dosetaksel-kime-verelim\">1.\nSoru: \"mHSPC hastasında kemoterapi (Dosetaksel) kime verelim?\"</h3>\n<ul>\n<li>Cevap: Yüksek Hacimli (High Volume) hastalara. Tanımı: 4 veya daha\nfazla kemik metastazı (en az biri pelvis/omurga dışında olacak) VEYA\nvisseral (karaciğer/akciğer) metastaz varlığı.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Abirateron kullanırken neden yanına mutlaka steroid\n(Prednizolon) ekliyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Abirateron CYP17'yi bloke edince kortizol üretimi azalır. Bu\nda ACTH artışına ve sonuçta Mineralokortikoid fazlalığına\n(hipertansiyon, hipokalemi, ödem) yol açar. Steroid vererek bu döngüyü\nkırarız.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Kemik metastazı olan hastada 'Kemik Koruyucu Tedavi' olarak\nne eklersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: Bisfosfonatlar (Zoledronik Asit) veya Denosumab. Amacı kemik\nkırıklarını (Skeletal Related Events) önlemektir.</li>\n</ul>\n"}, {"id": "5.10", "t": "Takip ve Biyokimyasal Nüks (BCR) Yönetimi", "h": "<h3 id=\"a-ameli̇yat-sonrasi-taki̇p-sifirin-peşi̇nde\">A. AMELİYAT SONRASI\nTAKİP: \"SIFIR\"IN PEŞİNDE</h3>\n<p>Radikal Prostatektomi (RP) sonrası prostat dokusu tamamen çıkarıldığı\niçin PSA'nın saptanamaz seviyelere (&lt; 0.1 ng/mL) düşmesini\nbekleriz.</p>\n<ol type=\"1\">\n<li>Zamanlama: PSA'nın yarılanma ömrü yaklaşık 3 gündür. Tam\n\"sıfırlanma\" genelde ameliyattan 4-6 hafta sonra görülür.</li>\n</ol>\n<h3 id=\"2-periyot\">2. Periyot:</h3>\n<ul>\n<li>İlk 2 yıl: 3 ayda bir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>2-5. yıllar: 6 ayda bir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>5 yıldan sonra: Yılda bir</li>\n</ul>\n<h3 id=\"b-bi̇yoki̇myasal-nüks-bcr-tanimlari-hoca-mutlaka-sorar\">B.\nBİYOKİMYASAL NÜKS (BCR) TANIMLARI (Hoca Mutlaka Sorar!)</h3>\n<p>Nüks tanımı, yapılan primer tedaviye göre değişir. Bu ikisini asla\nkarıştırma:</p>\n<h3 id=\"1-radikal-prostatektomi-sonrası\">1. Radikal Prostatektomi\nSonrası:</h3>\n<ul>\n<li>Tanım: PSA'nın ardışık iki ölçümde ≥ 0.2 ng/mL<br />\nolmasıdır.</li>\n</ul>\n<h3 id=\"1-radyoterapi-sonrası-phoenix-kriteri\">1. Radyoterapi Sonrası\n(Phoenix Kriteri):</h3>\n<ul>\n<li>Tanım: \"Nadir\" (tedavi sonrası inilen en düşük PSA) + 2\nng/mL.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Örnek:</em> Hastanın PSA'sı RT sonrası 0.4'e kadar düştü. Eğer\n2.4 olursa nüks kabul edilir.</li>\n</ul>\n<h3 id=\"c-nüks-varsa-lokal-mi̇-si̇stemi̇k-mi̇\">C. NÜKS VARSA: LOKAL Mİ,\nSİSTEMİK Mİ?</h3>\n<p>PSA yükseldiğinde ilk soru şudur: Kanser sadece yatakta (prostatın\neski yerinde) mı kaldı, yoksa vücuda mı yayıldı?</p>\n<ul>\n<li><p>Lokal Nüks Lehine: PSA yükselmesi geç (ameliyattan &gt;3 yıl\nsonra), PSA ikiye katlanma süresi uzun (&gt;12 ay), Gleason skoru düşük\n(≤ 7).</p></li>\n<li><p>Sistemik (Metastatik) Nüks Lehine: PSA yükselmesi erken (&lt;1\nyıl), PSA ikiye katlanma süresi kısa (&lt;6 ay), Gleason skoru yüksek\n(8-10).</p></li>\n</ul>\n<p>Modern Tanı Aracı: PSMA-PET. PSA değeri 0.2 - 0.5 arasına çıktığı\nandan itibaren nüksün yerini saptamakta en hassas yöntemdir.</p>\n<h3 id=\"d-kurtarma-salvage-tedavi̇leri̇\">D. KURTARMA (SALVAGE)\nTEDAVİLERİ</h3>\n<ol type=\"1\">\n<li><p>Salvage Radyoterapi (SRT): RP sonrası PSA nüksü olan, ancak\nmetastaz saptanmayan hastalarda prostat yatağına ışın verilmesidir. PSA\n&lt; 0.5 iken başlanırsa başarı şansı çok yüksektir.</p></li>\n<li><p>Salvage Prostatektomi: RT sonrası nükslerde prostatın\nçıkarılmasıdır (Çok zordur, 5.8'de konuşmuştuk).</p></li>\n<li><p>Salvage Lenf Nodu Disseksiyonu: PSMA-PET'te sadece 1-2 lenf\nnodunda nüks varsa, bunların cerrahiyle çıkarılmasıdır (Oligometastatik\nyaklaşım).</p></li>\n</ol>\n<h3 id=\"e-taki̇pte-di̇ğer-parametreler\">E. TAKİPTE DİĞER PARAMETRELER</h3>\n<p>Sadece PSA yetmez; hastanın hayat kalitesini de sormalısın:</p>\n<ul>\n<li><p>Kontinans Durumu: Kaç ped kullanıyor?</p></li>\n<li><p>Erektil Fonksiyon: İlaçlara yanıt var mı?</p></li>\n<li><p>Darlık Takibi: Ameliyat yerinde (anastomoz) daralma var mı?\n(İşeme kalibrasyonu).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Bölüm 5 Final Soruları)</p>\n<h3 id=\"1-soru-ameliyat-sonrası-6-haftada-psa-015-geldi-ne-yaparsın\">1.\nSoru: \"Ameliyat sonrası 6. haftada PSA 0.15 geldi. Ne yaparsın?\"</h3>\n<ul>\n<li>Cevap: \"Henüz 0.2 eşiğine ulaşmadığı için 'nüks' diyemem. Ancak\nPSA'nın tam sıfıra inmemesi (Persistent PSA) kötü prognoz işaretidir. 3\nay sonra testi tekrarlarım; yükseliş sürerse radyoterapi\nplanlarım.\"</li>\n</ul>\n<h3\nid=\"1-soru-psa-doubling-time-i̇kiye-katlanma-süresi-neden-önemlidir\">1.\nSoru: \"PSA Doubling Time (İkiye Katlanma Süresi) neden önemlidir?\"</h3>\n<ul>\n<li>Cevap: \"Hastalığın agresifliğini gösterir. PSA'sı 6 aydan kısa\nsürede ikiye katlanan hastalar, metastaz geliştirme ve prostat\nkanserinden ölme riski en yüksek olan gruptur.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Ameliyattan 5 yıl sonra PSA 0.22 olan hastaya kemik\nsintigrafisi ister misin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Hayır. Geleneksel kemik sintigrafisi PSA &lt; 10-20 olan\nhastalarda genelde hiçbir şey göstermez. Bu değerde en mantıklı\ngörüntüleme PSMA-PET/BT'dir.\"</li>\n</ul>\n<h3 id=\"1-soru-adjuvan-rt-ile-salvage-rt-arasındaki-fark-nedir\">1. Soru:\n\"Adjuvan RT ile Salvage RT arasındaki fark nedir?\"</h3>\n<ul>\n<li>Cevap: Adjuvan: PSA yükselmeden, riskli patoloji (T3, pozitif sınır)\nnedeniyle hemen ameliyat sonrası verilir. Salvage: PSA yükselince (nüks\nolunca) verilir. Güncel kılavuzlar genelde yan etkileri azaltmak için\nSalvage RT'yi (yakın PSA takibiyle) tercih eder.</li>\n</ul>\n"}]}, {"n": 6, "t": "Mesane Kanseri ve Ürotelyal Tümörler", "s": [{"id": "6.1", "t": "Epidemiyoloji, Etyopatogenez ve Patoloji", "h": "<h3 id=\"a-moleküler-karsi̇nogenez-i̇ki̇-farkli-yol-dual-track-pathway\">A.\nMOLEKÜLER KARSİNOGENEZ: İKİ FARKLI YOL (Dual-Track Pathway)</h3>\n<p>Mesane kanseri tek bir hastalık değildir. Moleküler olarak tamamen\nzıt karakterde iki farklı yoldan gelişir. Bu ayrımı bilmek, tümörün\ngelecekteki davranışını öngörmenin anahtarıdır:</p>\n<h3 id=\"1-papiller-yol-ta--düşük-dereceli-tümörler\">1. Papiller Yol (Ta\n→ Düşük Dereceli Tümörler):</h3>\n<ul>\n<li>Mutasyon: FGFR3 (Fibroblast Growth Factor Receptor 3) ve HRAS\nmutasyonları karakteristiktir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik: Bu yol, ürotelyumun lümene doğru (ekzofitik) karnabahar gibi\nbüyümesine neden olur. Genellikle Low-Grade (Düşük Dereceli) kalırlar.\nKas tabakasına ilerleme (progresyon) riskleri düşüktür ama sürekli aynı\nyerden veya başka bir duvardan nüks etmeyi çok severler.</li>\n</ul>\n<h3 id=\"1-solid--yassı-yol-cis--kas-i̇nvaziv-tümörler\">1. Solid / Yassı\nYol (CIS → Kas İnvaziv Tümörler):</h3>\n<ul>\n<li>Mutasyon: TP53 (Tümör baskılayıcı gen) ve RB1 (Retinoblastom) gen\nmutasyonları.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik: Bu tümörler dışarı doğru değil, direkt duvarın içine\n(endofitik) doğru büyürler. Karsinoma in Situ (CIS) bu yolun öncülüdür.\nHücreler son derece agresiftir (High-Grade) ve hızla kas dokusuna (T2)\ninvaze olurlar.</li>\n</ul>\n<p>Özellikle düşük riskli papiller tümörlerin (Ta, Low-Grade) en büyük\nklinik problemi, hastanın hayatını tehdit etmesinden ziyade, sık nüks\netmesi ve hastayı bitmek bilmeyen kontrol sistoskopilerine mahkum\netmesidir. Günümüzde bu hasta yükünü ve enstrümantasyon morbiditesini\nazaltmak için, 3. ay kontrol sistoskopisinin yerini alabilecek\nnon-invaziv alternatifler aranmaktadır. İdrar sitolojisi ile mesaneye\nyönelik mpMRI kombinasyonunun, geleneksel sistoskopiye karşı\nnon-inferiority (daha alt seviyede olmama) potansiyelini kanıtlamak,\nürolojik onkolojinin en vizyoner araştırma konularından biridir.</p>\n<h3 id=\"b-moleküler-siniflandirma-lumi̇nal-vs-bazal\">B. MOLEKÜLER\nSINIFLANDIRMA: LUMİNAL VS. BAZAL</h3>\n<p>Meme kanserinde yıllardır kullanılan bu genetik sınıflandırma, artık\nEAU kılavuzları ile mesane kanserine de entegre oldu. Kas invaziv mesane\nkanserleri (MIBC) gen ekspresyon profillerine göre temelde ikiye\nayrılır:</p>\n<ul>\n<li><p>Luminal Tip: Şemsiye (yüzeyel) hücrelerin özelliklerini taşır.\nFGFR3 mutasyonları sıktır. Prognozu daha iyidir ancak neoadjuvan\nkemoterapiye (NAC) yanıtı sınırlıdır.</p></li>\n<li><p>Bazal Tip: Ürotelyumun kök hücre (bazal) tabakasından köken alır.\nSkuamöz (yassı epitel) farklılaşma gösterir. Çok daha agresiftir ve\nhızlı metastaz yapar, ANCAK Cisplatin bazlı neoadjuvan kemoterapiye\nmükemmel yanıt verir.</p></li>\n</ul>\n<h3 id=\"c-varyant-hi̇stoloji̇ler-oyunu-deği̇şti̇renler\">C. VARYANT\nHİSTOLOJİLER: OYUNU DEĞİŞTİRENLER</h3>\n<p>Patoloji raporunda sadece \"High-Grade Ürotelyal Karsinom\" yazması\nayrıdır, altında \"Şu varyant izlenmiştir\" yazması ayrıdır. Varyant\nhistolojiler, tümörün standart kurallara uymadığını bağırır. Bir\nasistanın bunları gördüğünde alarm durumuna geçmesi gerekir:</p>\n<h3 id=\"1-mikropapiller-varyant\">1. Mikropapiller Varyant:</h3>\n<ul>\n<li>Mikroskopta küçük, sapsız hücre kümeleri (gemi dümenine benzer)\nşeklinde görünür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik Önemi: Yüzeyde (T1) görünse bile lenfovasküler invazyon oranı\ndevasadır. BCG tedavisine genelde dirençlidir. EAU, T1 mikropapiller\nvaryant saptandığında Erken Radikal Sistektomi düşünülmesini şiddetle\nönerir.</li>\n</ul>\n<h3 id=\"1-plazmasitoid-varyant\">1. Plazmasitoid Varyant:</h3>\n<ul>\n<li>Hücreler plazma hücrelerine benzer. E-Kaderin (CDH1) mutasyonu\nnedeniyle hücreler birbirine tutunamaz.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik Önemi: Sinsi ve ölümcüldür. Mesane duvarı boyunca \"tek sıra\"\nhalinde kayarak ilerler (Linitis Plastica benzeri). Sıklıkla peritona\nyayılır.</li>\n</ul>\n<h3 id=\"1-sarkomatoid-varyant\">1. Sarkomatoid Varyant:</h3>\n<ul>\n<li>Hem epitelyal hem de mezenkimal (bağ dokusu/kas) kötü huylu\nözellikler gösterir. Çok hızlı büyür, prognozu en kötü olanlardan\nbiridir.</li>\n</ul>\n<h3 id=\"1-nested-yuvalanan-varyant\">1. Nested (Yuvalanan) Varyant:</h3>\n<ul>\n<li>Mikroskopta \"iyi huylu\" Brunn yuvalarına çok benzer, patoloğu\nyanıltıp \"Low-Grade\" veya \"Benign\" tanısı aldırabilir. Ancak biyolojik\nolarak son derece agresif bir High-Grade tümördür.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Patoloji raporunda 'Karsinoma in Situ (CIS)' geldi. Bu tümör\nT evrelemesinde nereye düşer ve neden tehlikelidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"CIS, evreleme olarak Tis'tir, yani bazal membranı aşmamış,\nyüzeye paralel (yassı) yayılan bir tümördür. Ancak histolojik olarak her\nzaman High-Grade'dir. P53 mutasyonu taşıdığı için bazal membranı delip\nkasa (T2) inme potansiyeli çok yüksektir; bu nedenle yüksek riskli kabul\nedilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Hastanın mesanesinde divertikül var ve divertikülün içinde\ntümör saptadık. Bu durumun normal mesane duvarındaki bir tümörden\nanatomik ve onkolojik farkı nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Mesane divertiküllerinde Detrüsör kas tabakası (Muskularis\nPropria) bulunmaz. Sadece mukoza ve ince bir bağ dokusu vardır. Bu\nnedenle divertikül içindeki bir tümör lamina propriayı aştığı an direkt\nperivezikal yağ dokusuna (T3 evresine) geçmiş olur. Ayrıca ince duvar\nnedeniyle TUR-M sırasında perforasyon riski çok yüksektir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Genç bir kadın hasta, kronik pelvik ağrı sendromu ve dirençli\nsistit şikayetiyle yıllarca takip edilmiş. Şimdi mesane kubbesinde\n(dome) kitlesi var. Patoloji Adenokarsinom geldi. Akla ilk ne\ngelmeli?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Mesane kubbesindeki adenokarsinomlar aksi ispat edilene\nkadar Urakus Tümörü kabul edilir. Urakus, embriyolojik dönemde mesaneyi\ngöbeğe bağlayan allantois artığıdır. Tedavisi sadece TUR-M değil, göbeğe\nkadar uzanan umbilikal bağın (urakusun) ve mesane kubbesinin blok\nhalinde çıkarılmasıdır (Parsiyel Sistektomi).\"</li>\n</ul>\n"}, {"id": "6.2", "t": "Tanısal Yaklaşım, Görüntüleme ve Biyobelirteçler", "h": "<h3 id=\"a-asemptomati̇k-mi̇krohematüri̇-amh-algori̇tmasi\">A. ASEMPTOMATİK\nMİKROHEMATÜRİ (AMH) ALGORİTMASI</h3>\n<p>Makroskopik (gözle görülür) hematüri aksi ispat edilene kadar\nkanserdir ve tam tarama (BT Ürografi + Sistoskopi) gerektirir. Ancak her\nbüyütme alanında (HPF) &gt;3 eritrosit görülen Mikroskopik Hematüri\nhastalarında AUA kılavuzları hastaları 3 risk grubuna ayırır:</p>\n<ol type=\"1\">\n<li><p>Düşük Risk (Örn: &lt;50 yaş kadın, hiç sigara içmemiş): Sistokopi\nveya BT önerilmez. 6 ay sonra idrar tahlili tekrarı veya sadece USG\nyeterlidir.</p></li>\n<li><p>Orta Risk (Örn: 50-59 yaş arası, 10-20 paket/yıl sigara): USG ve\nSistoskopi önerilir. BT Ürografi şart değildir.</p></li>\n<li><p>Yüksek Risk (Örn: &gt;60 yaş, &gt;20 paket/yıl sigara veya\nmakroskopik atak): Tam tarama (BT Ürografi + Sistoskopi)\nZORUNLUDUR.</p></li>\n</ol>\n<h3 id=\"b-si̇stoskopi̇-beyaz-işiktan-opti̇k-i̇llüzyonlara\">B. SİSTOSKOPİ:\nBEYAZ IŞIKTAN OPTİK İLLÜZYONLARA</h3>\n<p>Poliklinikte ofis şartlarında yapılan esnek (flexible) sistoskopi\naltın standarttır. Ancak standart Beyaz Işık (White Light) sistoskopisi,\nözellikle yassı tümörleri (CIS) gözden kaçırabilir.</p>\n<ul>\n<li><p>PDD (Mavi Işık / Hexvix): Mesaneye işlemden önce verilen\nfotosensitize edici madde (HAL), kanser hücrelerinde birikir ve mavi\nışık altında florasan kırmızı parlar. Özellikle CIS tanısında ve TUR-M\nsınırlarını belirlemede eşsizdir.</p></li>\n<li><p>NBI (Dar Bant Görüntüleme): Işığın dalga boyu daraltılır (415 ve\n540 nm). Bu dalga boyları hemoglobin tarafından maksimum emildiği için,\ntümörün etrafındaki anjiogenez (yeni damarlanma) kahverengi/yeşil renkte\nçok net görünür.</p></li>\n</ul>\n<h3 id=\"c-i̇drar-si̇toloji̇si̇-ve-bi̇yobeli̇rteçler\">C. İDRAR SİTOLOJİSİ VE\nBİYOBELİRTEÇLER</h3>\n<p>Patolojiye gönderdiğin idrar veya yıkama sıvısı, Paris Sınıflaması\n(The Paris System - TPS) ile raporlanır.</p>\n<ul>\n<li><p>Sitolojinin Paradoksu: High-Grade (Yüksek Dereceli) tümörler ve\nCIS için duyarlılığı %90'lara ulaşır, adeta bir keskin nişancıdır. Ancak\nLow-Grade (Düşük Dereceli) tümörlerin hücreleri normal ürotelyum\nhücrelerine çok benzediği için sitolojinin duyarlılığı %20'lere kadar\ndüşer. Yani <em>Sitoloji negatifliği, düşük riskli bir tümörün\nolmadığını asla kanıtlamaz.</em></p></li>\n<li><p>Moleküler Biyobelirteçler: FDA onaylı UroVysion (FISH yöntemiyle\nkromozom anomalilerini arar) ve NMP22 (Nükleer Matriks Proteini) gibi\ntestler sitolojinin açıklarını kapatmak için kullanılır ancak henüz\nsistoskopinin yerini alabilmiş değillerdir.</p></li>\n</ul>\n<h3 id=\"d-vi̇zyoner-yaklaşim-mpmri-ve-non-i̇nvazi̇v-taki̇p-vi-rads\">D.\nVİZYONER YAKLAŞIM: mpMRI VE NON-İNVAZİV TAKİP (VI-RADS)</h3>\n<p>Mesane kanserinde BT Ürografi üst sistemi (böbrek pelvisi/üreter)\nharitalamak için vazgeçilmezdir. Ancak iş, tümörün mesane kasına\n(detrüsör) inip inmediğini ameliyattan önce anlamaya geldiğinde devreye\nmpMRI (Multiparametrik MR) ve VI-RADS sınıflaması girer. VI-RADS skoru\nyüksekse, tümörün kası invaze ettiği öngörülür.</p>\n<p>Akademik Paradigma Değişimi:</p>\n<p>Düşük riskli mesane kanserlerinin (Örn: Ta, Low-Grade) takibinde\naltın standart, rezeksiyondan sonraki 3. ayda yapılan kontrol\nsistoskopisidir. Ancak bu durum, hastalar için ciddi anksiyete,\nenfeksiyon riski ve sağlık sistemi için devasa bir enstrümantasyon yükü\noluşturur.</p>\n<p>Güncel ürolojik onkoloji araştırmalarının en sıcak konularından biri,\nbu invaziv 3. ay kontrol sistoskopisi yerine mesaneye yönelik mpMRI ile\nidrar sitolojisinin kombinasyonunun kullanılmasıdır. Bu ikili\nkombinasyonun (anatomik görüntüleme + hücresel analiz), geleneksel\nsistoskopiye karşı <em>non-inferiority (daha alt seviyede olmama)</em>\ngösterip gösteremeyeceği, düşük riskli hastaların takibinde devrim\nyaratabilecek, hastayı sondadan ve ofis sistoskopisinden kurtarabilecek\nkritik bir araştırma sahasıdır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastanın idrar sitolojisi 'Atipik Ürotelyal Hücreler (AUC)'\nolarak raporlandı. Paris Sınıflamasına göre bu ne anlama gelir ve ne\nyaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"AUC, hücrelerin tamamen normal olmadığını ama High-Grade\nkanser diyebilecek kadar da bozulmadığını gösterir. Gri zondur. Bu\ndurumda enfeksiyon veya taş gibi reaktif nedenleri dışladıktan sonra,\ntanıyı netleştirmek için UroVysion FISH testi isteyebilir veya erken\nkontrol sistoskopisi planlayabilirim.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"VI-RADS skorlamasında T2-Ağırlıklı serilerde detrüsör kasını\nnasıl ayırt edersin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"T2 serilerinde mesane lümeni (idrar) hiperintens (beyaz),\nmukoza/lamina propria ince bir çizgi, detrüsör kası ise hipointens\n(siyah/koyu) ve kesintisiz bir bant olarak izlenir. Tümör bu siyah bandı\nkesintiye uğratmışsa VI-RADS skoru artar (kas invazyonu şüphesi).\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Yüksek riskli makroskopik hematüri ile gelen, kreatinini 2.5\nmg/dL (Böbrek yetmezliği) olan hastada BT Ürografi çekemiyoruz. Üst\nsistemi nasıl değerlendireceksin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Kontrastlı BT kontrendike olduğu için iki alternatifim var:\nBirincisi MR Ürografi (Eğer GFR &gt;30 ise Gadolinyum kullanılabilir,\ndaha düşükse kontrastsız MRU). İkincisi ve en garantilisi ise,\nsistoskopi sırasında üreter orifislerinden kateter göndererek floroskopi\naltında kontrast verip Retrograd Piyelografi çekmektir.\"</li>\n</ul>\n"}, {"id": "6.3", "t": "NMIBC Yönetimi I (Cerrahi) - TUR-BT Prensipleri", "h": "<h3 id=\"a-kutsal-kase-detrüsör-kasi-muskularis-propria\">A. KUTSAL KASE:\nDETRÜSÖR KASI (Muskularis Propria)</h3>\n<p>Mesane duvarı içten dışa; Mukoza (Ürotelyum), Lamina Propria (T1\nsınırı) ve Detrüsör Kasından (T2 sınırı) oluşur.</p>\n<ul>\n<li><p>Altın Kural: Yaptığın rezeksiyonun tabanında mutlaka ama mutlaka\nDetrüsör kas dokusu bulunmalıdır.</p></li>\n<li><p>Neden? Eğer patolog mikroskopta kas dokusunu görmezse, tümörün\nkasa girip girmediğini bilemez ve rapora \"Kas izlenmedi (pTx)\" yazar.\nBu, cerrahi bir yetersizliktir. (Bunun tek istisnası, çok net, küçük ve\ndaha önce düşük dereceli olduğu bilinen nüks Ta tümörlerdir).</p></li>\n</ul>\n<h3 id=\"b-cerrahi̇-tekni̇kler-fraksi̇yone-vs-en-bloc-rezeksi̇yon\">B. CERRAHİ\nTEKNİKLER: FRAKSİYONE VS. EN-BLOC REZEKSİYON</h3>\n<p>Güncel textbooklar ve EAU kılavuzları, tümörün mesane duvarından\nnasıl koparılacağı konusunda iki ana akıma odaklanır:</p>\n<h3 id=\"1-fraksiyone-parçalı-rezeksiyon-klasik-yöntem\">1. Fraksiyone\n(Parçalı) Rezeksiyon (Klasik Yöntem):</h3>\n<ul>\n<li>Standart tel loop (koter) ile tümör ekzofitik kısmından tabanına\ndoğru \"cips (chip)\" şeklinde katman katman kesilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Dezavantajı:</em> Tümör parçalanır, hücreler mesane içine\nsaçılır (seeding riski). Patolog için doku oryantasyonu kaybolur;\nmukoza, lamina propria ve kas parçaları çorba gibi birbirine\nkarışır.</li>\n</ul>\n<h3 id=\"1-en-bloc-rezeksiyon-erbt---yeni-nesil-standart\">1. En-Bloc\nRezeksiyon (ERBT - Yeni Nesil Standart):</h3>\n<ul>\n<li>Tümör parçalanmaz. Etrafındaki 5-10 mm'lik sağlam mukoza sınırından\nbaşlanarak, altındaki kas dokusuyla birlikte \"elma dilimi\" gibi tek bir\nbütün halinde çıkarılır. Lazer (Thulium/Holmium) veya özel koter uçları\nkullanılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Avantajı:</em> Patolog tümörün derinliğini ve cerrahi sınırları\nkusursuz değerlendirir. Kılavuzlar, özellikle ≤ 3 cm tümörlerde bu\ntekniği yüksek şiddetle önermektedir.</li>\n</ul>\n<h3 id=\"c-cerrahi̇-kabus-obturator-refleks-ve-perforasyon\">C. CERRAHİ\nKABUS: OBTURATOR REFLEKS VE PERFORASYON</h3>\n<p>Mesanenin lateral (yan) duvarındaki tümörleri rezeke ederken en büyük\nkorkumuz hastanın bacağının aniden şiddetle uyarılmasıdır.</p>\n<ul>\n<li><p>Mekanizma: Lateral duvarın hemen dışından geçen Nervus\nObturatorius, elektrokoterin akımıyla uyarılır ve uyluk adduktor\nkaslarında şiddetli bir spazm yaratır. Bu anlık sıçrama, aletin mesane\nduvarını delip geçmesine (perforasyon) neden olur.</p></li>\n<li><p>Nasıl Önlenir?</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Genel Anestezi + Derin Kas Gevşetici (Kürarizasyon): En güvenli\nyoldur. Spinal anestezi bu refleksi <em>kesmez</em>, çünkü sinir kökü\ndaha yukarıdan çıkar veya direkt lokal akımdan etkilenir.</p></li>\n<li><p>Bipolar Koter veya Lazer: Akımın doku içi yayılımı az olduğu için\nrefleks riski düşüktür (ancak sıfır değildir).</p></li>\n<li><p>Obturator Sinir Bloğu: Anestezist tarafından ultrason eşliğinde\nsinirin lokal anestezikle uyuşturulması.</p></li>\n</ol>\n<h3 id=\"d-i̇ki̇nci̇-baki-re-tur-hata-kabul-etmeyen-kural\">D. İKİNCİ BAKI\n(RE-TUR): HATA KABUL ETMEYEN KURAL</h3>\n<p>\"Tümörü tertemiz aldım, kası da gördüm, iş bitti\" diyemezsin. EAU\n2025/2026 algoritmalarına göre, ilk ameliyattan 2 ila 6 hafta sonra\nhastayı tekrar ameliyathaneye alıp aynı yeri yeniden rezeke etmen\ngereken mutlak endikasyonlar vardır:</p>\n<ol type=\"1\">\n<li><p>Eksik (İnkomplet) İlk Rezeksiyon: Çok fazla kanama veya çok büyük\ntümör yükü nedeniyle tümörün tamamı alınamadıysa.</p></li>\n<li><p>Kas Dokusu Yokluğu: Patoloji raporunda \"Muskularis propria\nizlenmedi\" yazıyorsa (Ta, Low-Grade hariç).</p></li>\n<li><p>Patoloji pT1 İse: <em>En kritik kural budur.</em> Kas dokusu\nörneklenmiş ve tümör kasa inmemiş (T1) görünse bile, T1 High-Grade\ntümörlerin yaklaşık %30'unda ilk ameliyatta rezidü (kalan) tümör veya\natlanmış kas invazyonu (T2) saptanır. Bu yüzden tüm T1'lere Re-TUR\nZORUNLUDUR.</p></li>\n</ol>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Ameliyat sırasında obturator refleks oldu ve mesaneyi deldin.\nEkstraperitoneal perforasyon ile İntraperitoneal perforasyonun yönetim\nfarkı nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Ekstraperitoneal (mesane tabanı veya ön duvarı) delinmelerde\nbatın içine geçiş yoktur; genelde sondayı 7-10 gün tutarak konservatif\n(ameliyatsız) takip edilir. Ancak İntraperitoneal (mesane kubbesi -\ndome) perforasyonda idrar ve kanser hücreleri direkt karın boşluğuna\n(bağırsakların arasına) dolar. Bu durum acil açık cerrahi (laparatomi)\nile mesanenin onarılmasını gerektirir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Bipolar TUR ile Monopolar TUR arasındaki fizyolojik fark\nnedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Monopolar sistemde elektrik akımı hastanın vücudundan\ngeçerek koter plağına döner, irrigasyon sıvısı olarak iletken olmayan\n(ancak su zehirlenmesi - TUR Sendromu riski taşıyan) Mannitol/Sorbitol\nkullanılır. Bipolar sistemde ise akım sadece aletin kendi uçları\narasında (loop) döner; bu sayede irrigasyon sıvısı olarak izotonik\n(Serum Fizyolojik) kullanılabilir ve TUR sendromu riski\nsıfırlanır.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Re-TUR yapmak için neden 2 hafta bekliyoruz da ertesi gün\nyapmıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Erken dönemde (ilk 1-2 hafta) rezeksiyon yatağında yoğun\nödem, inflamasyon ve fibrin/pıhtı birikimi vardır. Sınırları ayırt etmek\nimkansızdır. Dokunun iyileşip skarlaşmaya başlaması ve kalan tümör\ndokusunun kendini belli etmesi için optimal süre 2 ila 6 hafta\narasıdır.\"</li>\n</ul>\n"}, {"id": "6.4", "t": "NMIBC Yönetimi II (İntravezikal Tedaviler)", "h": "<h3 id=\"a-ri̇sk-strati̇fi̇kasyonu-pusulamız\">A. RİSK STRATİFİKASYONU\n(Pusulamız)</h3>\n<p>Tedaviye ezbere başlanmaz. Hastayı EAU 2025/2026 NMIBC Risk\nGruplarına ayırmak zorundasın (Tümör sayısı, boyutu &gt;3 cm, nüks\ndurumu, Ta/T1, Low/High Grade ve CIS varlığına göre):</p>\n<ol type=\"1\">\n<li><p>Düşük Risk: Tek, primer, &lt;3 cm, Ta Low-Grade. (Tedavi: Sadece\ntek doz kemoterapi yeterlidir).</p></li>\n<li><p>Orta Risk: Çoklu veya nükseden Ta Low-Grade tümörler. (Tedavi: 1\nyıla kadar kemoterapi veya 1 yıl BCG).</p></li>\n<li><p>Yüksek Risk: Herhangi bir T1, High-Grade veya CIS. (Tedavi:\nMutlaka 1-3 yıllık tam doz BCG).</p></li>\n<li><p>Çok Yüksek Risk: T1 High-Grade + CIS + Çoklu/Büyük tümörler.\n(Tedavi: BCG denenebilir ama Erken Radikal Sistektomi güçlü bir şekilde\ntartışılmalıdır).</p></li>\n</ol>\n<h3 id=\"b-erken-tek-doz-kemoterapi̇-post-op-erken-i̇nstilasyon---sio\">B.\nERKEN TEK DOZ KEMOTERAPİ (Post-op Erken İnstilasyon - SIO)</h3>\n<p>Ameliyat bitti, sondayı taktın. Hastayı yatağına göndermeden önce\nyapman gereken kritik bir hamle var.</p>\n<ul>\n<li><p>Zamanlama: TUR-BT sonrası ilk 2-24 saat içinde (ideali ilk 6\nsaatte) mesane içine tek doz kemoterapi (Mitomisin-C veya Epirubisin)\nverilmesidir.</p><
