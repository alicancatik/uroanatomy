tox-zehrin-kusursuz-felci\">A. BOTULİNUM\nTOKSİNİ (BOTOX): Zehrin Kusursuz Felci</h3>\n<p>Doğadaki en ölümcül biyolojik toksinlerden biri olan <em>Clostridium\nbotulinum</em> bakterisinin ürettiği bu zehir, doğru dozda\n(OnabotulinumtoxinA) kullanıldığında ürolojinin en büyük\nkurtarıcılarından birine dönüşür.</p>\n<p>Moleküler Suikast (SNARE Proteini Yıkımı): Normalde sinir ucuna gelen\nelektriksel sinyal, içi Asetilkolin (ACh) dolu veziküllerin hücre zarına\nyapışmasını ve Asetilkolin'in kasın üzerine boşalmasını sağlar. Bu\nyapışmayı sağlayan kilit molekül SNARE protein kompleksidir\n(SNAP-25).</p>\n<p>Botox molekülü, sinir ucunun içine sızar ve doğrudan bu SNARE\nproteinlerini kesip parçalar. Asetilkolin vezikülleri hücre zarına\nyapışamaz, dışarı çıkamaz. Sinir sağlamdır, kas sağlamdır ama aradaki\niletişim kopmuştur. Sonuç: Enjekte edilen bölgede Gevşek (Flask)\nFelç.</p>\n<p>Uygulama Şekli: Hasta lokal veya hafif sedasyon altındayken\nsistoskopla mesaneye girilir. Esnek (fleksibl) veya rijit bir iğneyle,\nmesane kasının (detrüsörün) içine 20 ila 30 farklı noktadan zehir\nenjekte edilir.</p>\n<p><em>İdiyopatik OAB için:</em> Toplam 100 Ünite.</p>\n<p><em>Nörojenik OAB için (Spina Bifida/MS):</em> Toplam 200 Ünite.</p>\n<h3 id=\"b-botoxun-aşi̇l-topuğu-i̇drar-retansiyonu-ve-süre\">B. BOTOX'UN\nAŞİL TOPUĞU: İdrar Retansiyonu ve Süre</h3>\n<p>Mucizevi bir tedavidir, hastaların %70'inde sıkışmaları bıçak gibi\nkeser. Ancak bedelleri vardır:</p>\n<p>Etki Kalıcı Değildir: Vücut o kopan SNARE proteinlerini yavaş yavaş\nyeniden sentezler ve sinir uçları (Sprouting) yeniden filizlenir.\nBotox'un etkisi 6 ila 9 ay içinde tamamen BİTER. Hastanın yılda 1-2 kez\nbu sistoskopik işlemi tekrarlatması gerekir.</p>\n<p>Aşırı Felç (İdrar Retansiyonu): Mesane kasını çok fazla felç\nederseniz, hasta bu kez tuvalete gittiğinde idrarını HİÇ yapamaz. İşlem\nsonrası hastaların yaklaşık %5-10'unda (Nörojeniklerde daha yüksek)\nidrar yapamama ve içeride idrar kalması (Yüksek PVR) gelişir.</p>\n<h3\nid=\"c-sakral-nöromodülasyon-mesane-pi̇li̇-sistemi-yeniden-programlamak\">C.\nSAKRAL NÖROMODÜLASYON (MESANE PİLİ): Sistemi Yeniden Programlamak</h3>\n<p>Mesaneyi felç etmek istemiyorsak, ona beynin o kaybettiği baskılayıcı\n(inhibitör) reflekslerini elektriksel olarak yeniden öğretmemiz gerekir.\nCampbell-Walsh-Wein buna <em>Nöromodülasyon</em> der.</p>\n<p>Fizyolojik Mantık: Mesane kasının kendi kendine kasılmasını durdurmak\niçin, mesaneye giden otonomik sinir yollarına sürekli, düşük voltajlı,\nhafif bir elektriksel titreşim (pulse) gönderilir. Bu uyarılar,\nomurilikteki ara nöronları (İnternöronlar) uyararak beyne giden refleks\narkını \"Modüle eder\" (Baskılar veya düzenler).</p>\n<p>Anatomik Hedef (S3 Forameni): Kuyruk sokumundaki (Sakrum) kemik\ndeliklerinin 3.sü olan S3 forameni, mesane ve pelvik tabanın\nkontrolünden sorumlu olan ana parasempatik ve somatik kabloların\n(Pelvik/Pudendal) geçtiği ana otobandır.</p>\n<p>Aşamalı Cerrahi (Test ve Kalıcı Pil):</p>\n<p><em>1. Aşama (Test Fazı):</em> Ameliyathanede floroskopi (Röntgen)\neşliğinde, S3 deliğinden içeriye ince, çengelli bir elektrot (Tined\nLead) yerleştirilir. Ucu dışarıda bırakılır ve hasta 2-4 hafta boyunca\nbelindeki harici bir cihazla gezer.</p>\n<p><em>2. Aşama (Kalıcı IPG):</em> Eğer test süresince hasta işeme\ngünlüğünde şikayetlerinin en az %50 azaldığını kanıtlarsa, hasta tekrar\nameliyata alınır. Kablonun ucu, kalçanın üst kısmına cilt altına açılan\nbir cebe yerleştirilen kalıcı bataryaya (IPG - Implantable Pulse\nGenerator) bağlanır. Pilin ömrü modele göre 5 ila 15 yıl\narasındadır.</p>\n<h3 id=\"d-ti̇bi̇al-si̇ni̇r-sti̇mülasyonu-ptns-i̇ğne-korkusu-olmayanlara\">D.\nTİBİAL SİNİR STİMÜLASYONU (PTNS): İğne Korkusu Olmayanlara</h3>\n<p>Ağır ameliyat veya Botox istemeyen hastalar için geliştirilmiş\nperiferik bir alternatiftir.</p>\n<p>Ayak bileğinin iç kısmındaki (Medial Malleolün hemen arkası)\nPosterior Tibial Sinir yakınına akupunktur iğnesine benzer ince bir iğne\nbatırılır. Bu sinir, doğrudan S3 köküne kadar giden uzun bir\nkablodur.</p>\n<p>Dışarıdan verilen elektrik, bilekten omuriliğe kadar çıkarak\n(Retrograd) mesane merkezini modüle eder. Haftada 1 gün, 30 dakikalık\nseanslar halinde toplam 12 hafta klinikte uygulanır. (Etkisi Botox veya\nPile göre daha mütevazıdır ancak tamamen zararsızdır).</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Poliklinikte, üç farklı ilaca dirençli OAB'si olan 45 yaşında\nbir kadın hastaya 'Sana mesanenin içine Botox iğnesi yapalım' dedin.\nHasta kabul etti. Reçeteyi ve onam formunu imzalatmadan önce, hastaya\nsorman ve kesinlikle onayını alman (aksi takdirde malpraktis sayılacak)\nen hayati soru ve klinik kural nedir?\"</p>\n<p>Cevap: \"Hastaya şu kesin uyarıyı yapmalıyım: <em>'Bu iğneden sonra\nmesaneniz tamamen felç olabilir ve idrarınızı hiç yapamayabilirsiniz. Bu\ndurumda günde 4-6 kez kendi kendinize idrar yolunuzdan içeri ince bir\nsonda (TAK/CIC) sokarak mesanenizi boşaltmayı göze alıyor musunuz?'</em>\nEAU kılavuzları çok nettir: Eğer hasta Temiz Aralıklı Kateterizasyon\n(TAK) yapmayı reddediyorsa veya fiziksel olarak yapamayacak durumdaysa\n(ellerinde artrit, aşırı obezite), BOTOX UYGULAMASI KESİNLİKLE\nKONTRENDİKEDİR.\"</p>\n<p>Soru: \"Ameliyathanede Sakral Nöromodülasyon (Mesane Pili) takıyorsun.\nİğneyi floroskopi altında 3. sakral delikten (S3 forameninden) içeri\nsoktun. İçeriye test elektriği verdin. İğnenin ucunun S2, S4 değil de\ntam ve kusursuz olarak S3 sinir kökünde (doğru yerde) olduğunu\nkanıtlayan hastadaki o klasik Motor Yanıt (Kasılma) belirtileri\nnelerdir?\"</p>\n<p>Cevap: \"İdeal S3 uyarımı, otonomik ve somatik kabloların tam\nkavşağını vurduğumuzu gösteren iki muazzam motor yanıt yaratır:</p>\n<p>Körük (Bellows) Yanıtı: Hastanın anüsünün (makatının) ve pelvik\ntabanının, sanki bir körük çekiliyormuş gibi şiddetle içeriye doğru\n(kraniyal yönde) çekilmesi.</p>\n<p>Ayak Başparmağı Yanıtı (Plantar Fleksiyon): Elektrik verilen\ntaraftaki ayağın sadece BAŞPARMAĞININ yere doğru bükülmesidir (Plantar\nfleksiyon).</p>\n<p>(Not: Eğer tüm ayak bileği dönüyor veya bacak zıplıyorsa iğne çok\nyukarıda S2'dedir; eğer hiçbir ayak yanıtı yok sadece sfinkter\nkasılıyorsa iğne çok aşağıda S4'tedir).\"</p>\n<p>Soru: \"Fowler Sendromu olan, yani mesanesinde tıkanıklık\n(obstrüksiyon) olmamasına rağmen idrarını yapamayan, aylardır sonda ile\nyaşayan (Non-obstrüktif Üriner Retansiyon) 25 yaşında bir kadın hastan\nvar. Bu hastanın mesane kasını yeniden çalıştırmak için Botox mu\nyaparsın, Sakral Nöromodülasyon (SNM) mu takarsın?\"</p>\n<p>Cevap: \"Botox KESİNLİKLE yapmam. Botox kası felç eder; zaten idrar\nyapamayan bir hastaya yapıldığında mesaneyi tamamen betonlaştırır.\nNon-obstrüktif retansiyon durumlarında (özellikle sfinkterin anlamsızca\nkasıldığı Fowler Sendromunda), FDA onaylı ve EAU kılavuzlarının altın\nstandart tek cerrahi tedavisi Sakral Nöromodülasyon'dur (Mesane Pili).\nSNM, omurilikteki o bozuk refleks arkını yeniden modüle eder, sfinkterin\nistemsiz kasılmasını (hiperaktivitesini) çözer ve hastaların %70'ini\nkalıcı sondadan kurtarır.\"</p>\n"}, {"id": "11.5", "t": "Stres Üriner İnkontinans (SUI): Askı Cerrahileri ve Hamak Teorisi", "h": "<h3 id=\"a-patofi̇zyoloji̇-delanceynin-hamak-hammock-teorisi\">A.\nPATOFİZYOLOJİ: DeLancey'nin \"Hamak (Hammock)\" Teorisi</h3>\n<p>İdrar kanalının (Üretranın) neden idrar kaçırdığını anlamak için\npelvik tabanın mimarisine bakmak zorundayız.</p>\n<p>Sağlam Hamak: Üretra, vajinanın ön duvarı ve endopelvik fasya adı\nverilen gergin bir hamağın (trambolinin) üzerinde yatar. Kadın\nöksürdüğünde veya ıkındığında, artan karın içi basıncı üretrayı aşağıya\ndoğru iter. Üretra, altındaki bu gergin hamağa çarparak ezilir (komprese\nolur) ve kapanır. İdrar kaçmaz.</p>\n<p>Hamağın Çöküşü (Üretral Hipermobilite): Çok sayıda normal doğum\n(makrozomik bebek), menopoz (östrojen eksikliği), obezite veya yaşlanma;\no gergin fasyayı (hamağı) yırtar ve sarkıtır. Kadın öksürdüğünde üretra\naşağıya doğru itilir ama çarpıp kapanacağı gergin bir zemin bulamaz.\nÜretra vajinaya doğru yer değiştirir (Hipermobilite) ve kapı açık\nkalır.</p>\n<p>B. CERRAHİ FELSEFE: Mid-Üretral Slingler (Tension-Free) ve Dizbağı\nEtkisi</p>\n<p>Eskiden sarkan bu mesane boynunu yukarı asmak için devasa açık karın\nameliyatları (Burch Kolposüspansiyonu) yapılırdı. 1990'ların sonunda\nUlmsten'in icat ettiği \"Mid-Üretral Sling (Sentetik Askı)\" devrimiyle\nher şey değişti.</p>\n<p>Günümüzde altın standart, üretranın orta kısmının (Mid-üretra)\naltından Polipropilen (Makroporöz Tip 1) sentetik bir şerit (Bant/Tape)\ngeçirmektir.</p>\n<p>Gerilimsiz (Tension-Free) Kuralı: Bant üretranın altından geçirilir\nama KESİNLİKLE yukarı doğru asılıp gerdirilmez! Bant ile üretra arasında\nbir makas girecek kadar boşluk bırakılır. Hasta dinlenirken bant\nüretrayı sıkmaz (bu yüzden idrar yaparken zorlanmaz).</p>\n<p>Dizbağı (Knee-kink) Mekanizması: Kadın öksürdüğünde (basınç\narttığında), üretra aşağı doğru hareket eder. Tam o anda, altına\nyerleştirdiğimiz o sentetik banta çarpar ve bir bahçe hortumunun\nbükülmesi (kink) gibi katlanarak anında kapanır.</p>\n<h3 id=\"c-i̇ki̇-farkli-rota-tvt-mi-tot-mu\">C. İKİ FARKLI ROTA: TVT mi, TOT\nmu?</h3>\n<p>O sentetik bandı üretranın altından geçirdikten sonra, uçlarını\nvücudun neresinden çıkarıp sabitleyeceğimiz, ameliyatın ismini ve\nrisklerini belirler.</p>\n<p>1. Retropubik Rota (TVT - Tension-free Vaginal Tape): Yukarıya Giden\nYol</p>\n<p>Teknik: İğneler vajinadan girer, leğen kemiğinin (Symphysis Pubis)\nhemen arkasından (Retzius mesafesinden) yukarı doğru itilir ve göbek\naltından (suprapubik bölgeden) cilt dışına çıkarılır. Bant \"U\" şeklini\nalır.</p>\n<p>Avantajı: Üretrayı çok daha dikey ve güçlü bir şekilde destekler.\nSadece hamağı sarkanlarda (Hipermobilite) değil, sfinkteri tamamen felç\nolmuş (ALPP &lt; 60 olan İç Sfinkter Yetmezliği / ISD) hastalarda da\nALTIN STANDARTTIR.</p>\n<p>Kabus Riski: İğneleri körlemesine yukarı iterken mesaneyi, bağırsağı\nveya o bölgedeki büyük damarları delme riski yüksektir.</p>\n<h3 id=\"2-transobturator-rota-tot-yatay-giden-güvenli-yol\">2.\nTransobturator Rota (TOT): Yatay Giden Güvenli Yol</h3>\n<p>Teknik: İğneler mesaneye hiç yaklaşmaz. Vajinadan girer, yanlara\ndoğru yönelir ve kasıklardaki o devasa kemik boşluğundan (Foramen\nObturatuar) geçerek uyluk iç kısmından dışarı çıkar. Bant \"V\" veya yatay\nbir hamak şeklini alır.</p>\n<p>Avantajı: Mesaneyi veya bağırsağı delme riski neredeyse SIFIRDIR.\nİğneler pelvik organların uzağından geçer.</p>\n<p>Dezavantajı: Ağır sfinkter yetmezliğinde (ISD) TVT kadar başarılı\ndeğildir. Ayrıca iğneler obturator kaslardan ve sinirlerden geçtiği\niçin, hastaların %10'unda ameliyat sonrası haftalar süren şiddetli kasık\nve bacak (uyluk) ağrıları görülür.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Ameliyathanede bir hastaya TVT (Retropubik Sling) yapıyorsun.\nTrokarları (iğneleri) vajinadan sokup yukarı, suprapubik cilde doğru\nşiddetle ittin ve çıkardın. İşlemi bitirip sondayı takmadan önce, TVT\nameliyatında yapılması yüzde yüz ZORUNLU olan o endoskopik hamle nedir\nve neden TOT'de bu zorunluluk yoktur?\"</p>\n<p>Cevap: \"TVT trokarları körlemesine Retzius mesafesinden (mesanenin\nhemen önünden) geçer. Bu yüzden iğneler geçer geçmez KESİNLİKLE\nSistoskopi yapılmalı ve mesanenin içi (özellikle kubbe ve yan duvarlar)\n70 derecelik optikle tek tek taranmalıdır. Eğer iğne mesaneyi deldiyse\n(ki %5-10 vakada olabilir), o iğne içeride bırakılmaz; hemen geri\nçekilir, mesane boşaltılır ve iğne yeniden doğru açıyla yönlendirilir.\nMesane delinmesi açık ameliyat gerektirmez, sadece hastaya 3-5 gün sonda\ntakılması yeterlidir. TOT ameliyatında ise iğneler yatay (obturator)\neksende ilerlediği için mesaneyi delme riski çok düşüktür, sistoskopi\nşart koşulmaz.\"</p>\n<p>Soru: \"Polikliniğe TOT ameliyatı geçirdikten 1 yıl sonra gelen bir\nkadın hasta var. İdrar kaçırması mükemmel düzelmiş. Ancak 'Hocam sürekli\nkötü kokulu bir vajinal akıntım var, hafif kanamalarım oluyor ve eşimle\ncinsel ilişkiye girdiğimizde eşim batma/acı (Disparoni/Hispareni)\nhissediyor' diyor. Bu klasik tablonun altında yatan cerrahi komplikasyon\nnedir?\"</p>\n<p>Cevap: \"Bu klasik bir Mesh (Yama) Erozyonu / Ekstrüzyonu tablosudur.\nÜretranın altına koyduğumuz o polipropilen sentetik bant, zamanla vajina\nmukozasını iyileşmeden aşındırmış ve vajinanın içine (dışarıya) doğru\nfırlamıştır. Enfekte olduğu için akıntı yapar, eşinin cinsel organına\nsürtündüğü için de ilişki sırasında batma ve kanama yaratır. Ufak\nerozyonlar lokal östrojen kremleriyle epitelize olmaya (kapanmaya)\nzorlanabilir, ancak genellikle o fırlayan sentetik parçanın\nameliyathanede kesilip (Eksizyon) mukozanın yeniden dikilmesi\ngerekir.\"</p>\n<p>Soru: \"TVT ameliyatını bitirdin, 'Tension-free' (gerilimsiz)\nbıraktığını düşünüyorsun. Ertesi gün hastanın sondasını çektin ama hasta\ntuvalete gittiğinde idrarını HİÇ yapamıyor, mesanesi şişiyor (Akut İdrar\nRetansiyonu). Bandı çok gerdiğini fark ettin. Bu hastaya ömür boyu sonda\nmı takacaksın, yönetim algoritması nedir?\"</p>\n<p>Cevap: \"Sling ameliyatları sonrası geçici retansiyon (idrar\nyapamama), cerrahi bölgedeki ödem nedeniyle %10-15 oranında görülür. İlk\nhamlem ASLA hemen ameliyata almak değildir. Hastaya 1 ila 2 hafta\nboyunca Temiz Aralıklı Kateterizasyon (TAK/CIC) öğretilir veya sonda\ntakılarak ödemin inmesi beklenir. Eğer 2-4 hafta geçmesine rağmen hasta\nhala idrar yapamıyorsa (Kalıcı obstrüksiyon), bu kez cerrahi şarttır.\nErken dönemde bant bulunup hafifçe gevşetilebilir; ancak aylar geçmiş ve\nskar dokusu oturmuşsa, bandın tam ortasından kesildiği Üretrolizis (Mesh\ninsizyonu) ameliyatı yapılarak o boğucu tıkanıklık ortadan kaldırılır\n(Bant kesilse bile hastaların büyük kısmı idrar kaçırmamaya devam eder,\nçünkü etraftaki fibrotik skar dokusu hamağı tutmaya yetebilir).\"</p>\n"}, {"id": "11.6", "t": "Nörojenik Alt Üriner Sistem Disfonksiyonu (Seviye Haritası, Ms, Parkinson)", "h": "<h3 id=\"a-üç-katli-bi̇na-lezyon-seviyesi-ve-böbreklerin-kaderi\">A. ÜÇ\nKATLI BİNA: Lezyon Seviyesi ve Böbreklerin Kaderi</h3>\n<p>Nörojenik mesaneyi anlamak için sinir sistemini üç katlı bir bina\ngibi düşünmeliyiz. Arızanın hangi katta olduğu, mesane ve sfinkterin\n(kapının) nasıl davranacağını dikte eder.</p>\n<h3 id=\"1-çatı-katı-suprapontin-lezyonlar-sinerji-var-fren-yok\">1. Çatı\nKatı (Suprapontin Lezyonlar): Sinerji Var, Fren Yok</h3>\n<p>Hastalıklar: İnme (Serebrovasküler Olay), Parkinson, Alzheimer, Beyin\nTümörleri.</p>\n<p>Fizyoloji: Pontin İşeme Merkezi (PMC) sağlamdır, sfinkter ile mesane\narasındaki uyum (Sinerji) bozulmamıştır. Ancak Frontal Lobdan gelen\n\"İdrarını tut\" emri (inhibitör fren) kopmuştur.</p>\n<p>Klinik Tablo: Mesane kendi kendine aniden kasılır (Aşırı Aktif\nDetrüsör - DO). Ancak kapı (sfinkter) da zamanında açıldığı için içeride\nyüksek basınç oluşmaz.</p>\n<p>Böbreklerin Kaderi: GÜVENDEDİR. Hasta altını ıslatır ama böbreklere\nidrar kaçmaz.</p>\n<h3 id=\"2-orta-kat-suprasakral-spinal-lezyonlar-en-ölümcül-bölge\">2.\nOrta Kat (Suprasakral Spinal Lezyonlar): En Ölümcül Bölge</h3>\n<p>Hastalıklar: Boyun/Sırt Omurilik Travmaları (Trafik kazası, yüksekten\ndüşme), Multipl Skleroz (MS), Transvers Miyelit.</p>\n<p>Fizyoloji: Pons (PMC) ile Sakral merkez (S2-S4) arasındaki otoban\n(Spinal Kord) kopmuştur. Mesane kasılır (DO), ancak Pons ile iletişim\nkoptuğu için kapı (sfinkter) açılmayı unutur veya o da kasılır.</p>\n<p>Klinik Tablo: Motor tam gaz çalışırken, kapı üzerine kilitlenir\n(Detrüsör Sfinkter Dissinerjisi - DSD).</p>\n<p>Böbreklerin Kaderi: TEHLİKEDEDİR. İçerideki basınç 40-100 cmH2O'lara\nfırlar. İdrar çıkamadığı için böbreklere geri vurur (VUR), hidronefroz\nve diyalize giden kalıcı böbrek yetmezliği başlar.</p>\n<h3\nid=\"3-bodrum-katı-sakral-ve-i̇nfrasakral-lezyonlar-fişi-çekilmiş-motor\">3.\nBodrum Katı (Sakral ve İnfrasakral Lezyonlar): Fişi Çekilmiş Motor</h3>\n<p>Hastalıklar: Spina Bifida, Bel Fıtığı (Kauda Ekina Sendromu), Pelvik\nTravmalar (Leğen kemiği kırıkları), Radikal Pelvik Cerrahiler.</p>\n<p>Fizyoloji: Mesanenin doğrudan elektriğini sağlayan sakral kökler\n(S2-S4) veya pelvik sinirler kesilmiştir.</p>\n<p>Klinik Tablo: Mesane kası felç olmuştur (Detrüsör Arefleksisi /\nAtonik Mesane). Mesane kasılamaz, devasa bir torba gibi litrelerce\nidrarla dolar ve taşarak damla damla sızdırır (Overflow incontinence).\nKapı (sfinkter) da genellikle felçtir.</p>\n<p>Böbreklerin Kaderi: Çoğunlukla güvendedir ancak mesane duvarı zamanla\nfibrozise uğrayıp esnekliğini kaybederse (Düşük Kompliyans) tehlike\nçanları çalar.</p>\n<h3 id=\"b-kli̇ni̇k-si̇nsi̇li̇kler-multipl-skleroz-ms-ve-parkinson\">B. KLİNİK\nSİNSİLİKLER: Multipl Skleroz (MS) ve Parkinson</h3>\n<p>Bu iki nörolojik dev, poliklinikte karşımıza en sık çıkan ama\nbirbirinden tamamen farklı davranan iki hastalıktır.</p>\n<p>Multipl Skleroz (MS): Bukalemun Hastalık</p>\n<p>MS, Miyelin kılıfına saldıran otoimmün bir hastalıktır ve plaklar\n(lezyonlar) beynin veya omuriliğin <em>herhangi bir yerinde</em>\nolabilir. Üstelik zamanla yer değiştirebilirler.</p>\n<p>Bu yüzden MS hastasının mesanesi bir \"Bukalemun\" gibidir. Bugün\nSuprapontin karakterde (Sadece DO) davranırken, 6 ay sonra yeni bir\nomurilik atağıyla Suprasakral karaktere (DSD - Ölümcül yüksek basınç)\ndönüşebilir. EAU kılavuzları bu yüzden MS hastalarına düzenli ve yıllık\nÜrodinami takibini şart koşar.</p>\n<p>Parkinson Hastalığı: Yavaşlayan Kapı</p>\n<p>Sorun beyindeki (Bazal Ganglion) dopamin eksikliğidir. Klasik bir\nSuprapontin lezyondur, yani böbrekler güvendedir.</p>\n<p>En sık bulgu Aşırı Aktif Detrüsör (DO)'dur. Hasta aniden sıkışır.\nAncak Parkinson'un o meşhur kas yavaşlığı (Bradikinezi) sfinkteri de\netkiler. Motor kasıldığında, sfinkterin açılması gecikir\n(Psödo-dissinerji). Ürodinamide DSD gibi görünür ama aslında kapı sadece\nyavaş açılıyordur, nörolojik olarak kilitli değildir.</p>\n<h3 id=\"c-peri̇feri̇k-sabotaj-radikal-pelvik-cerrahi-ve-diyabet\">C.\nPERİFERİK SABOTAJ: Radikal Pelvik Cerrahi ve Diyabet</h3>\n<p>Omurilik sapasağlam olsa bile, mesaneye giden o incecik kablolar\npelviste kesilirse sistem çöker.</p>\n<p>İatrojenik Felç (Radikal Cerrahiler): Genel cerrahlar rektum kanseri\niçin (Aşağı Anterior Rezeksiyon - LAR) veya jinekologlar rahim ağzı\nkanseri için (Wertheim / Radikal Histerektomi) ameliyat yaparken,\nmesanenin arkasından geçen o incecik Pelvik Splanik Sinirleri\nyanlışlıkla keserler veya gererler. Ameliyat sonrası hastanın sondası\nçekildiğinde hasta idrarını hiç yapamaz (İdrar Retansiyonu). Aylar süren\nTAK (Sonda) gerektirir.</p>\n<p>Diyabetik Sistopati: Yıllarca süren kontrolsüz kan şekeri, mesanenin\nduyu sinirlerini (Gafferent lifleri) çürütür (Sensory Neuropathy). Hasta\nmesanesinin dolduğunu hissetmez. Gittikçe kapasite artar, 1000 cc idrar\nbirikir ama kasılma refleksi doğmaz. Ağrısız idrar retansiyonu\nbaşlar.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"70 yaşında, Parkinson hastası bir erkek polikliniğe geldi.\nGece sık tuvalete kalkma ve idrarı zor başlatma şikayetleri var.\nUltrasonunda prostatı 60 gram (BPH) ölçüldü. Ailesi, 'Hocam babamızın\nprostatını ameliyat edin (TUR-P) de rahatlasın' diyor. Ancak Parkinson\nhastasında prostat cerrahisi kararı alırken seni bekleyen en büyük\ntehlike (Kontrendikasyon şüphesi) nedir ve bunu nasıl dışlarsın?\"</p>\n<p>Cevap: \"En büyük tehlike, bu hastanın gerçek bir idiyopatik Parkinson\ndeğil de, Parkinson'a çok benzeyen ve otonom sinir sistemini tamamen\nçökerten MSA (Multipl Sistem Atrofisi - Shy-Drager Sendromu) olma\nihtimalidir. MSA hastalarında çizgili sfinkter (kapı) otonomik olarak\nfelçtir ve her zaman açıktır. Eğer bu hastaya TUR-P yaparsam (iç\nkapıyı/prostatı da ben kesersem), hastanın tutunacak hiçbir sfinkteri\nkalmaz ve ömür boyu Şiddetli İdrar Kaçırma (Total İnkontinans) yaşar.\nCerrahiden önce mutlaka Nöroloji onayı alınmalı ve sfinkter EMG'li\nÜrodinami yapılarak dış sfinkterin (Onuf nükleusunun) sağlam olduğu\nkanıtlanmalıdır.\"</p>\n<p>Soru: \"Tip 2 Diyabeti olan ve yıllardır idrarını damla damla,\nıkınarak yapan (Diyabetik Sistopatili) bir hastaya ürodinami yaptın.\nMesane kapasitesi 800 cc, detrüsör hiç kasılmıyor (Arefleksi), basınç\ndüşük (Pdet &lt; 15 cmH2O) ama idrar akımı da çok zayıf. Bu 'Atonik'\nmesaneyi ilaçla kasmak için eskiden kullanılan Kolinerjik agonistlerin\n(Bethanechol / Urecholine) güncel EAU kılavuzlarındaki yeri nedir?\"</p>\n<p>Cevap: \"EAU 2026 kılavuzlarına göre, felçli veya atonik bir mesaneyi\nilaçla kasmaya çalışmak (Bethanechol kullanımı) kesinlikle önerilmez ve\nyeri yoktur. Çünkü bu ilaçlar mesane kasını (detrüsörü) sistemik olarak\nuyarsa da, fizyolojik bir işeme sinerjisi yaratamazlar; genellikle\nmesane boynunu ve sfinkteri de kasar, ritmik bir boşaltım sağlamazlar ve\nciddi sistemik yan etkiler (bradikardi, bronkospazm) yaparlar.\nAtonik/Arefleksik mesanenin dünyaca kabul görmüş yegane altın standart\ntedavisi TAK (Temiz Aralıklı Kateterizasyon)'dur.\"</p>\n<p>Soru: \"Bir trafik kazası sonrası hastanın belden aşağısı felç oldu\n(L1 seviyesi kırığı). Hastayı servise aldın. Kazadan sonraki ilk\nhaftalarda (Spinal Şok dönemi), bu hastanın mesanesi nasıl davranır (DO\nmu, Atonik mi) ve bu dönemdeki ilk ürolojik eylem planın nedir?\"</p>\n<p>Cevap: \"Kazadan hemen sonraki ilk 6-12 haftalık döneme Spinal Şok\ndenir. Bu dönemde omurilik, lezyon seviyesinin altındaki tüm refleks\naktivitesini tamamen kapatır (Susturur). Dolayısıyla mesane, suprasakral\nbir lezyon olmasına rağmen başlangıçta Aşırı Aktif (DO) DEĞİLDİR; tam\ntersine Tamamen Felçtir (Arefleksik/Atonik). Sfinkter de kapalı kalır.\nBu dönemde ürodinami çekilmez çünkü yanıltıcıdır. Yapılması gereken tek\neylem, spinal şok çözülüp refleksler (DSD ve DO) aylar sonra geri dönene\nkadar mesaneyi güvence altına almak için derhal TAK (günde 4-6 kez\nSonda) başlamaktır.\"</p>\n"}, {"id": "11.7", "t": "Detrüsör Sfinkter Dissinerjisi (DSD) ve Otonomik Disrefleksi", "h": "<p>A. DSD (DETRÜSÖR SFİNKTER DİSSİNERJİSİ): Kilitli Kapıya Karşı Çalışan\nMotor</p>\n<p>Omuriliğin Pontin İşeme Merkezi (Pons) ile Sakral Merkezi (S2-S4)\narasındaki o uzun yolda (Suprasakral bölge) bir kopukluk olduğunda,\nmesane ile sfinkter (kapı) arasındaki o muazzam uyum (sinerji) tamamen\nyok olur.</p>\n<p>Fizyolojik Kabus: Mesane dolduğunda, detrüsör kası idrarı atmak için\nşiddetle kasılır. Ancak beyinle iletişim koptuğu için, çizgili dış\nsfinkter açılması gerekirken tam tersine o da detrüsörle aynı anda, tüm\ngücüyle kasılır.</p>\n<p>Basınç Fırtınası: Kapı kilitli, motor tam gaz çalışıyor. Mesane içi\nbasınç (Pdet) saniyeler içinde 40, 60, hatta 100 cmH2O'nun üzerine\nfırlar. İdrar dışarı çıkamaz, geriye (böbreklere) vurur. Böbrekler\nhidronefrozla ezilir, parankim çürür ve hasta üremiye (böbrek\nyetmezliğine) gider.</p>\n<h3 id=\"b-otonomi̇k-di̇srefleksi̇-ad-sistemik-patlama\">B. OTONOMİK\nDİSREFLEKSİ (AD): Sistemik Patlama</h3>\n<p>DSD mesaneyi ve böbrekleri parçalarken, Otonomik Disrefleksi (AD)\ndoğrudan hastanın beynini ve kalbini hedef alır. Sadece T6 seviyesinin\nÜZERİNDE (Boyun veya üst sırt) omurilik hasarı olan hastalarda görülür.\nNeden T6? Çünkü karın içi organların devasa damar ağını (Splanik yatak)\nkasan sempatik sinirler T5-L2 arasından çıkar.</p>\n<p>Krizin Anatomisi (Adım Adım):</p>\n<p>Tetikleyici (Zehirli Uyarı): Lezyon seviyesinin altından, genellikle\npelvisten inanılmaz ağrılı bir uyarı gelir. (En sık neden: Tıkanmış\nsonda yüzünden aşırı gerilmiş mesane, şiddetli kabızlık/taşlaşmış gaita\nveya böbrek taşı).</p>\n<p>Sempatik Patlama: Bu ağrı sinyali omurilikten yukarı çıkar ama\nT6'daki kopukluk (kırık) nedeniyle beyne ulaşamaz. Omurilik bu uyarıya\npanikle yanıt verir ve T6'nın altındaki tüm sempatik sinirleri (Splanik\nyatağı) aynı anda ateşler.</p>\n<p>Vazokonstriksiyon (Ölümcül Tansiyon): Karnın içindeki tüm damarlar\naniden beton gibi kasılır. Kan basıncı saniyeler içinde 200-250 mmHg'ye\nfırlar.</p>\n<p>Beynin Çaresizliği (Bradikardi ve Kızarma): Beyindeki baroreseptörler\nbu devasa tansiyonu algılar ve kalbi yavaşlatarak (Bradikardi) ve\ndamarları gevşeterek tansiyonu düşürmeye çalışır. Ancak beynin\ngönderdiği \"gevşe\" emri T6'daki kırıktan aşağı geçemez!</p>\n<p><em>Sonuç:</em> Hastanın lezyon (T6) ÜZERİNDE kalan kısmı (yüzü,\nboynu, kolları) kıpkırmızı olur, terler, başı şiddetle zonklar. Lezyon\nALTINDA kalan kısmı (bacakları, karnı) ise buz gibidir, soluktur ve\ndamarları büzüşmüştür.</p>\n<h3 id=\"c-kri̇z-yöneti̇mi̇-saniyelerle-yarışmak\">C. KRİZ YÖNETİMİ:\nSaniyelerle Yarışmak</h3>\n<p>Acilde o kırmızı yüzlü, zonklayan baş ağrısı çeken ve tansiyonu\n220/120 olan T4 paraplejik hastayı gördüğünde EAU protokolü derhal\nbaşlar:</p>\n<p>Hemen OTURTUR! İlk ve en basit mekanik hamledir. Hastayı yatakta\nhızla dik (oturur) pozisyona getir. Yerçekimi, kanı bacaklara toplayarak\n(Venöz göllenme) beyne giden o devasa kan basıncını bir nebze olsun\ndüşürür.</p>\n<p>Tetikleyiciyi BUL VE YOK ET (Altın Kural):</p>\n<p>Hastanın sondası var mı? Hemen hortumu kontrol et, kıvrılmış veya\ntıkanmış olabilir. Gerekirse sondayı çekip DERHAL yeni ve geniş bir\nsonda (Foley/Nelaton) tak ve mesaneyi tamamen boşalt. Mesane boşaldığı\nan, o devasa sempatik fırtına %90 ihtimalle bıçak gibi kesilir.</p>\n<p>Mesane boş ama kriz devam ediyorsa? Rektal tuşe yap, içeride\ntaşlaşmış gaita (Fekal impaksiyon) varsa lokal anestezi jeli (lidokain)\nsürerek nazikçe boşalt.</p>\n<p>Farmakolojik Kalkan: Sondalamaya rağmen tansiyon (Sistolik &gt; 150\nmmHg) düşmüyorsa, kısa etkili ve hızlı anti-hipertansifler başla. (Dil\naltı Nifedipin, Kaptopril veya damardan Nitratlar/Sodyum\nNitroprussid).</p>\n<h3 id=\"d-dsdni̇n-cerrahi̇-evri̇mi̇-sfinkterotomi-neden-terk-edildi\">D.\nDSD'NİN CERRAHİ EVRİMİ: Sfinkterotomi Neden Terk Edildi?</h3>\n<p>Hastayı AD krizinden ve yüksek basınçtan (DSD) kalıcı olarak\nkurtarmak zorundayız.</p>\n<p>Karanlık Çağ (Eksternal Sfinkterotomi): Eskiden ürologlar sistoskopla\ngirip, o kilitlenen çizgili dış sfinkteri saat 12 hizasından bıçakla\nveya koterle (DVIU gibi) tamamen keserlerdi. Kapı tamamen kırıldığı için\nmesane basıncı düşerdi. <em>Bedeli:</em> Hasta ömür boyu, 24 saat idrar\nkaçıran bir musluğa dönerdi ve penis ucuna prezervatif sonda (Kondom\nkateter) takarak yaşamak zorunda kalırdı (Kadınlarda prezervatif sonda\nyapılamadığı için uygulanamazdı).</p>\n<p>Modern Çağ (Botox + TAK): EAU 2026'ya göre artık kapıyı (sfinkteri)\nkırmıyoruz; motoru (detrüsörü) susturuyoruz! Mesane kasının içine\nBotulinum Toksini (Botox - 200 Ünite) enjekte edilerek mesane tamamen\nfelç edilir. Yüksek basınç sıfırlanır, böbrekler kurtulur. Hasta kendi\nidrarını günde 4-6 kez Temiz Aralıklı Kateterizasyon (TAK) ile güvenle,\ndüşük basınçla boşaltır ve kuru kalır.</p>\n<p><em>(Nadir Alternatif: Sadece sfinkterin içine Botox yapılarak\nkapının geçici olarak felç edilmesi de denenebilir, ancak TAK uyumu olan\nhastada altın standart detrüsör botoksudur).</em></p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Poliklinikte, T4 seviyesinden omurilik felci olan bir hastaya\ntanısal Sistoskopi yapıyorsun. Aletle idrar yolundan geçip mesaneye su\ndoldurmaya başladın. İşlemin 2. dakikasında hasta aniden terlemeye\nbaşladı, 'Başım çok fena ağrıyor' dedi ve monitörde nabzı 40'a\n(Bradikardi) düşerken tansiyonu 210/110'a fırladı. Ameliyat masasında\nilk ne yaparsın?\"</p>\n<p>Cevap: \"Hasta masada Otonomik Disrefleksi (AD) krizine girmiştir;\ntetikleyici de benim mesaneye doldurduğum suyun yarattığı gerginliktir.\nİlk yapacağım şey Sistoskopiyi DERHAL durdurmak ve mesanenin içindeki\nsuyu tamamen ve hızla dışarı boşaltmaktır. İşlemi sonlandırır, masanın\nbaş kısmını hızla kaldırıp hastayı oturtur pozisyona getiririm. Eğer\ntansiyon birkaç dakika içinde normale dönmezse, anestezi ekibiyle\nbirlikte hızlı etkili vazodilatör (Nitrat vb.) tedavisine geçerim.\"</p>\n<p>Soru: \"Ürodinami çekiyorsun. Motor (Pdet) şiddetle kasılırken, eş\nzamanlı olarak Dış Sfinkterin EMG (Elektromiyografi) aktivitesinin de\nçılgınca arttığını, yani her ikisinin de aynı anda kasıldığını gördün.\nBu klasik bir DSD grafiği. Ancak hastanın sadece Parkinson hastalığı\nvar, omuriliğinde (suprasakral) hiçbir lezyonu yok. Parkinson hastasında\ngörülen bu tabloya neden 'Gerçek DSD' demiyoruz ve adı nedir?\"</p>\n<p>Cevap: \"Gerçek DSD, anatomik olarak omuriliğin koptuğu ve refleks\narkının tamamen kontrolsüz kaldığı suprasakral lezyonlarda (MS, Travma)\ngörülür. Parkinson gibi beyin (suprapontin) lezyonlarında ise anatomik\nkopukluk yoktur, sadece kas hareketlerinde bir 'gecikme ve katılık\n(Bradikardi/Rijidite)' vardır. Mesane kasıldığında, sfinkter aslında\naçılmak ister ama Parkinson'un yarattığı yavaşlık nedeniyle zamanında\naçılamaz veya istemsizce kasılı kalır. Buna Psödo-DSD (Yalancı\nDissinerji) veya Gecikmiş Sfinkter Relaksasyonu denir. Gerçek DSD gibi\nböbrekleri öldürücü yüksek basınçlara çok nadiren ulaşır.\"</p>\n<p>Soru: \"DSD'si olan ve tekerlekli sandalyeye bağlı bir hastada,\nellerindeki ağır kontraktürler (veya obezite) nedeniyle kendi kendine\nTAK (sonda) yapması fiziksel olarak imkansız. Ailesi de yapamıyor.\nBöbrekleri korumak için yüksek basıncı düşürmelisin ama Botox yaparsan\nmesaneyi boşaltamayacaklar. Bu çıkmaz durumdaki (TAK yapamayan) hastaya\nsunacağın en radikal ve kalıcı cerrahi çözüm (Üriner Diversiyon)\nnedir?\"</p>\n<p>Cevap: \"Eğer hasta TAK yapamıyorsa ve mesane basıncı böbrekleri\ntehdit ediyorsa, o mesaneyi sistemden tamamen çıkarmak veya baypas etmek\nzorundayız. EAU kılavuzlarına göre bu durumda altın standart çözüm İleal\nVezikostomi veya Suprapubik Kateter değildir; genellikle kalıcı ve düşük\nbasınçlı bir çözüm olan İleal Konduit (Bricker Diversiyonu)\nameliyatıdır. Üreterler mesaneden ayrılır, ince bağırsağın bir parçasına\ndikilir ve o bağırsak karın duvarına (stoma) ağızlaştırılır. İdrar\ndoğrudan, hiç basınç görmeden karnına yapıştırılan torbaya akar,\nböbrekler ömür boyu güvenceye alınır.\"</p>\n"}, {"id": "11.8", "t": "Pelvik Organ Prolapsusu (POP) ve Sistosele Ürolojik Yaklaşım", "h": "<h3 id=\"a-anatomi̇ni̇n-çöküşü-delanceynin-3-destek-seviyesi\">A. ANATOMİNİN\nÇÖKÜŞÜ: DeLancey'nin 3 Destek Seviyesi</h3>\n<p>Bir kadının pelvik organlarının aşağı düşmesini engelleyen yapı\nkaslar değil, asıl olarak o kasların üzerini örten sağlam bağ\ndokularıdır (Endopelvik Fasya). DeLancey bu desteği 3 kata ayırır:</p>\n<p>Seviye I (Apikal Destek - Kubbe): Uterosakral ve Kardinal bağlardır.\nRahim ve vajinanın en tepe noktasını (Apeks) yukarı, kuyruk sokumuna\nasar. <em>Çökerse:</em> Rahim Sarkması (Uterin Prolapsus) veya rahim\nalınmışsa Vajinal Kaf Prolapsusu (Vajina içinin dışına eldiven gibi\nçıkması) görülür.</p>\n<p>Seviye II (Lateral Destek - Duvarlar): Puboservikal fasyanın pelvis\nyan duvarlarına (Arcus tendineus) tutunduğu yerdir.</p>\n<p><em>Ön duvar çökerse:</em> Mesane vajinadan fırlar (Sistosel).</p>\n<p><em>Arka duvar çökerse:</em> Kalın bağırsak vajinadan fırlar\n(Rektosel).</p>\n<p>Seviye III (Distal Destek): Üretra ve perine cismidir. (Bozulması\nSUI'ye yol açar).</p>\n<h3 id=\"b-mekani̇k-tuzak-kinking-etkisi-ve-gizli-okkült-sui\">B. MEKANİK\nTUZAK: \"Kinking\" Etkisi ve Gizli (Okkült) SUI</h3>\n<p>Polikliniğe evre 3 devasa bir sistoselle (mesane sarkmasıyla) gelen\nbir hastaya \"Öksürürken idrar kaçırıyor musun?\" diye sorarsın. Hasta\n\"Hayır hocam, aksine idrarımı yapmakta zorlanıyorum, parmağımla o\nkitleyi (mesaneyi) içeri itmeden idrarım akmıyor\" der.</p>\n<p>Fizyolojik İllüzyon: Sarkan o devasa mesane, vajinadan aşağı düşerken\nidrar kanalını (Üretrayı) bir bahçe hortumu gibi katlar, büker (Kinking\nEtkisi). Bu bükülme mekanik bir tıkanıklık (Obstrüksiyon) yaratır. Hasta\nidrar kaçırmaz, hatta idrarını boşaltamaz hale gelir (PVR artar,\nböbrekler şişebilir).</p>\n<p>Okkült (Gizli) SUI Tehlikesi: EAU kılavuzlarının en büyük medikolegal\nuyarısı buradadır. Eğer bu hastayı ameliyata alıp sarkan mesaneyi\n(Sistoseli) yukarı asarsan, o bükülmüş üretrayı DÜZELTMİŞ ve açmış\nolursun. Hortum açıldığında, altındaki sfinkter yetmezliği aniden ortaya\nçıkar ve hasta ameliyattan sonra şarıl şarıl idrar kaçırmaya başlar.\n(Buna De Novo veya Okkült SUI denir).</p>\n<h3 id=\"c-altin-standart-tani-redüksiyon-testi-prolapsusun-i̇tilmesi\">C.\nALTIN STANDART TANI: Redüksiyon Testi (Prolapsusun İtilmesi)</h3>\n<p>Ameliyattan önce bu gizli tuzağa düşmemek için yapılması ZORUNLU olan\nklinik testtir.</p>\n<p>Hasta jinekolojik masadayken mesanesi 200-300 cc sıvıyla\ndoldurulur.</p>\n<p>Önce sarkma varken öksürtülür (Kaçak yoktur).</p>\n<p>Sonra sarkan o devasa sistosel/prolapsus, dev bir pamuklu çubukla\n(Swab), pessarla veya parmakla <em>içeriye (yukarıya) doğru itilir\n(Redükte edilir)</em>. Hortumun bükülmesi düzeltilir.</p>\n<p>Hasta tekrar öksürtülür. Eğer idrar fışkırırsa, hastada Gizli\n(Okkült) SUI vardır.</p>\n<p><em>Cerrahi Plan:</em> Ameliyatta SADECE sarkma düzeltilmez; aynı\nseansta mutlaka üretranın altına bir askı (Eş zamanlı TOT/TVT Sling)\nkonulmalıdır!</p>\n<h3 id=\"d-cerrahi̇-rekonstrüksi̇yon-doğal-doku-mu-sentetik-mesh-mi\">D.\nCERRAHİ REKONSTRÜKSİYON: Doğal Doku mu, Sentetik Mesh mi?</h3>\n<p>Ameliyat seçimi, sarkmanın hangi kompartmanda (Ön, Arka, Tepe)\nolduğuna göre değişir.</p>\n<h3 id=\"1-ön-duvar-sarkması-sistosel-için-anterior-kolporrafi\">1. Ön\nDuvar Sarkması (Sistosel) için: Anterior Kolporrafi</h3>\n<p>Vajina ön duvarı kesilir. Fıtıklaşan mesane yukarı itilir ve yırtılan\no puboservikal fasya, hastanın kendi dokusuyla (eriyebilir dikişlerle)\nüst üste bindirilerek sıkılaştırılır. EAU 2026'ya göre sistosel\nonarımında Vajinal yoldan Sentetik Mesh KULLANILMASI FDA Tarafından\nYASAKLANMIŞTIR / ŞİDDETLE KISITLANMIŞTIR. (Vajinadan konulan sentetik\nağlar çok yüksek oranda erozyon, enfeksiyon ve kronik pelvik ağrı\nyapar).</p>\n<p>2. Tepe Sarkması (Apikal/Kaf Prolapsusu) için: Sakrokolpopeksi (Altın\nStandart)</p>\n<p>Eğer rahim veya vajina tepesi çökmüşse, vajinadan yapılan onarımlar\n(%30-40) hızla nüks eder.</p>\n<p>Robotik / Laparoskopik Sakrokolpopeksi: Karın içinden girilir. \"Y\"\nşeklindeki makroporöz sentetik bir ağın (Mesh) bir bacağı vajina ön\nduvarına, diğer bacağı vajina arka duvarına dikilir. Y'nin uzun kuyruğu\nise yukarı çekilerek Sakrum kemiğinin Ön Longitudinal Ligamanına\n(genellikle S1-S2 Promontorium hizasına) titanyum vidalar veya sağlam\ndikişlerle asılır. Sarkma ihtimalini neredeyse sıfırlayan en dayanıklı\nanatomik onarımdır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Poliklinikte POP muayenesi yapıyorsun. Dünyaca kabul gören\nPOP-Q (Pelvic Organ Prolapse Quantification) sistemini kullanıyorsun.\nMuayene formunda 'Nokta Aa: +2, Nokta Ba: +4' olarak işaretledin. Bu\nskorlar vajinanın neresindeki sarkmayı gösterir ve + (artı) değerler ne\nanlama gelir?\"</p>\n<p>Cevap: \"POP-Q sisteminde 'A' ve 'B' harflerinin yanındaki küçük 'a'\nharfi (Anterior) vajinanın ÖN DUVARINI (Yani Mesaneyi / Sistoseli)\ntemsil eder. Himen (Kızlık zarı) seviyesi '0' kabul edilir. İçerideki\nnoktalar eksi (-), himenden dışarı sarkan noktalar artı (+) değer alır.\nBa noktasının +4 olması, mesanenin vajina girişinden 4 cm dışarıya\n(bacak arasına) sarktığını gösteren evre 3-4 çok ağır bir Sistosel\ntablosudur.\"</p>\n<p>Soru: \"Robotik Sakrokolpopeksi yapıyorsun. Sentetik meşin (ağın)\nkuyruğunu Sakral Promontoriuma (S1 kemiğinin önüne) asacaksın. O\nbölgedeki peritonu açıp diseksiyon yaparken, koterin ucuyla yanlışlıkla\nkemiğin tam önünde, ortada seyreden bir damarı yırttın. Ekran aniden\nkanla doldu. Yırttığın bu ölümcül damarın adı nedir ve kanamayı\ndurdurmak neden çok zordur?\"</p>\n<p>Cevap: \"Yırttığım o sinsi ve ölümcül damar A.V. Sacralis Mediana\n(Orta Sakral Arter ve Ven)'dir. Aortun çatallanmasından hemen önce\nçıkan, sakrumun tam ön yüzünden aşağı inen bir damardır. Kanaması\nşiddetlidir ve durdurması çok zordur çünkü damar doğrudan presakral\nfasyanın içine ve kemik yüzeyine (venöz pleksusa) yapışıktır. Koterle\nyakmaya çalışmak genellikle deliği büyütür. Bu krizde en iyi hamle,\nkemik yüzeyine steril raptiyeler (Thumbtack) basmak veya o bölgeye kemik\nmumu (Bone wax) / hemostatik ajanlarla sıkı bir tamponad (bası)\nuygulamaktır.\"</p>\n<p>Soru: \"75 yaşında, cinsel hayatı aktif olmayan, anestezi riski çok\nyüksek (ASA 4), devasa bir rahim ve mesane sarkması (Total Prolapsus /\nEvre 4) olan bir hasta geldi. Robotik Sakrokolpopeksi yapamazsın.\nDüzenli pessar (halka) kullanımını da tolere edemedi. Bu yüksek riskli\nhastada organları içeri sokup vajinayı tamamen kapatarak sorunu kökünden\n(ama radikal bir şekilde) çözen cerrahinin adı nedir?\"</p>\n<p>Cevap: \"Bu tablo için altın standart ve en kısa süren (lokal/spinal\nanesteziyle bile yapılabilen) kurtarıcı cerrahi Kolpokleizis (Vajinanın\nKapatılması - LeFort işlemi) ameliyatıdır. Sarkan vajina ön ve arka\nduvar mukozaları dikdörtgen şeklinde soyulur ve ön duvar arka duvara\ndikilerek vajina tüpü tamamen oblitere edilir (kapatılır). Organlar\niçeride hapsedilir. Cerrahi süresi çok kısadır, nüks ihtimali sıfıra\nyakındır. Ancak cinsel ilişki (koitus) fonksiyonunu kalıcı olarak yok\nettiği için, ameliyat öncesi hastadan ve (varsa) eşinden çok katı ve net\nbir aydınlatılmış onam alınması medikolegal olarak %100 zorunludur.\"</p>\n"}, {"id": "11.9", "t": "Ağrılı Mesane Sendromu / İnterstisyel Sistit (IC/PBS)", "h": "<h3 id=\"a-patofi̇zyoloji̇-yırtılan-zırh-ve-asit-yağmuru\">A. PATOFİZYOLOJİ:\nYırtılan Zırh ve Asit Yağmuru</h3>\n<p>Normalde mesanemizin iç yüzeyi (ürotelyum), idrarın içindeki zehirli\natıkların, asitlerin ve minerallerin kas tabakasına ve sinirlere\nsızmasını engelleyen kusursuz bir zırhla kaplıdır. Bu zırhın adı GAG\n(Glikozaminoglikan) tabakasıdır.</p>\n<p>GAG Defekti: İnterstisyel sistitli hastalarda bu GAG tabakası\nbilinmeyen bir nedenle (otoimmün, travmatik veya nörojenik) delinir veya\nincelir.</p>\n<p>Potasyum Sızıntısı: İdrarın içinde yüksek oranda bulunan Potasyum\n(\\K+) ve asitler, bu deliklerden sızarak mesanenin derinliklerindeki\n(interstisyum) sinir uçlarına (C-liflerine) ulaşır.</p>\n<p>Nörojenik İnflamasyon: Sinirler bu asitle adeta yanar. Madde P\n(Substance P) salgılanır, bölgedeki Mast hücreleri uyarılır ve ortama\ndevasa miktarda Histamin boşalır. Sonuç: Bakteri olmadığı halde mesanede\ninanılmaz bir yangı, kanama ve dayanılmaz bir pelvik ağrı başlar.</p>\n<h3 id=\"b-tani-dışlama-sanatı-ve-sistoskopinin-gerçekleri\">B. TANI:\nDışlama Sanatı ve Sistoskopinin Gerçekleri</h3>\n<p>İnterstisyel Sistit (IC), bir Dışlama Tanısıdır (Diagnosis of\nExclusion). Tümör yok, taş yok, enfeksiyon yok, OAB yok; ama ağrı var.\nTanıyı kesinleştirmek için EAU kılavuzları hastayı anestezi altında\nameliyathaneye alıp Hidrodistansiyonlu Sistoskopi yapmamızı emreder.</p>\n<p>Mesane anestezi altında 80 cmH2O basınçla 1-2 dakika boyunca suyla\niyice gerdirilir (Hidrodistansiyon), ardından su boşaltılırken mesane\nduvarına bakılır:</p>\n<p>Glomerülasyonlar (Şelale Kanamaları): GAG tabakası bozuk olduğu için,\ngerilen mesane duvarındaki kılcal damarlar çatlar ve mukoza üzerinde\nnokta nokta (peteşiyal) şelale gibi sızan kanamalar görülür. (Hastalığın\nklasik bulgusudur).</p>\n<p>Hunner Lezyonları / Ülserleri: Hastaların sadece %10-20'sinde görülür\nama Patognomoniktir (Tanı koydurucudur). Mukoza üzerinde etrafı kızarık,\nortası soluk, yıldız şeklinde çökük ülserlerdir. Dokunduğun an kanarlar.\nBu ülserleri gördüğünde IC tanısı kesinleşir.</p>\n<h3 id=\"c-tedavi̇-algori̇tmasi-eauaua-basamaklı-yaklaşım\">C. TEDAVİ\nALGORİTMASI: EAU/AUA Basamaklı Yaklaşım</h3>\n<p>Tedavi tek bir ilaçla olmaz; basamak basamak ilerlenir.</p>\n<p>1. Basamak (Davranışsal ve Diyet): İdrarı asidik yapan, potasyumdan\nzengin her şey YASAKTIR. (Kahve, çay, asitli meyveler, domates, baharat,\nçikolata, alkol). Hasta diyetini düzenlediğinde şikayetlerin %30'u\nazalır.</p>\n<h3 id=\"2-basamak-oral-i̇laçlar\">2. Basamak (Oral İlaçlar):</h3>\n<p>Amitriptilin (Trisiklik Antidepresan): Sadece depresyon için değil;\nhem sinirsel ağrıyı (nöropatik ağrı) keser hem de kuvvetli bir\nantihistaminik (mast hücre blokajı) etkisi vardır. Altın\nstandarttır.</p>\n<p>Pentosan Polysülfat Sodyum (Elmiron): FDA onaylı tek oral ilaçtır.\nAğızdan alınır, idrarla atılır ve gidip o yırtık GAG tabakasına\nyapışarak sentetik bir zırh oluşturur. (Etkisinin başlaması 3-6 ayı\nbulur).</p>\n<p>Diğerleri: Hidroksizin (Antihistaminik), Siklosporin A.</p>\n<h3 id=\"3-basamak-i̇ntravezikal-tedaviler---mesane-i̇çi-yıkamalar\">3.\nBasamak (İntravezikal Tedaviler - Mesane İçi Yıkamalar):</h3>\n<p>Haplar işe yaramazsa, poliklinikte hastaya sonda takılıp doğrudan\nmesanenin içine \"Zırh Tamiri\" yapan sıvılar basılır. (Haftada bir, 6\nhafta boyunca).</p>\n<p>Hyaluronik Asit ve Kondroitin Sülfat (Cystistat/Ialuril): Doğrudan\nGAG tabakasının yapı taşlarıdır. Mesaneyi içeriden sıvar ve asitten\nkorur.</p>\n<p>DMSO (Dimetil Sülfoksit): Güçlü bir anti-inflamatuardır. Mesane içine\nverilir, 15 dakika bekletilir. (Yan etkisi: Nefeste şiddetli sarımsak\nkokusu yapar).</p>\n<p>4. Basamak (Endoskopik Müdahale): Eğer sistoskopide Hunner Lezyonu\n(Ülseri) gördüysen, bunu ilaçla iyileştiremezsin. O ülserleri\nameliyathanede koterle yakmak (Fulgurasyon), lazerle kazımak (Ablasyon)\nveya içlerine doğrudan Triamsinolon (Steroid) enjekte etmek zorundasın.\nBu işlem hastanın ağrısını aylar boyunca bıçak gibi keser.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Eskiden polikliniklerde IC tanısı koymak için 'Potasyum\nDuyarlılık Testi (PST - Parsons Testi)' adı verilen bir test yapılırdı.\nMesanenin içine sonda ile sıvı Potasyum Klorür (KCl) basılır, eğer hasta\nçığlık atacak kadar ağrı hissederse tanı kesinleşirdi. Bu test güncel\nEAU/AUA kılavuzlarında neden yasaklanmış ve terk edilmiştir?\"</p>\n<p>Cevap: \"Potasyum Duyarlılık Testi, hastaya bilerek asit döküp\nsinirlerini yakmak gibi inanılmaz derecede ağrılı, invaziv ve zalimce\nbir testtir. Dahası, sadece interstisyel sistitte değil, OAB'de, idrar\nyolu enfeksiyonunda veya radyasyon sistitinde de pozitif çıkabildiği\niçin spesifitesi çok düşüktür. Hastaya gereksiz acı vermemek adına\ngüncel kılavuzlar bu provokatif testi teşhis algoritmasından tamamen\nçıkarmıştır.\"</p>\n<p>Soru: \"Hastaya yıllardır IC/PBS tedavisi için Pentosan Polysülfat\nSodyum (Elmiron) yazıyorsun. Hasta şikayetlerinin azaldığını söylüyor\nancak son zamanlarda 'Hocam gözümün önünde siyah noktalar uçuşuyor,\nokurken harfler eğrilip bükülüyor' demeye başladı. İlacı derhal kesmeni\ngerektiren ve hemen Göz Hastalıklarına konsülte etmeni zorunlu kılan bu\nspesifik ve tehlikeli yan etkinin adı nedir?\"</p>\n<p>Cevap: \"Elmiron'un (Pentosan) uzun süreli ve kümülatif kullanımında\n(&gt; 3 yıl) en çok korkulan spesifik komplikasyon Pigmenter Makülopati\n(Maküler Toksisite)'dir. İlaç retinanın maküla tabakasında birikerek\nkalıcı görme kaybına ve okuma zorluğuna neden olabilir. Bu yüzden\nElmiron kullanan her hastaya başlangıçta ve sonrasında yıllık olarak\ndüzenli OCT (Optik Koherens Tomografi) ve retina muayenesi yaptırmak\nmedikolegal bir zorunluluktur.\"</p>\n<p>Soru: \"Hastaya diyet yaptırdın, oral ilaç verdin, mesane içi\nyıkamalar (Hyaluronik asit) denedin, Botox yaptın; hiçbir şey işe\nyaramadı. Hasta günde 40 kez tuvalete gidiyor, mesane kapasitesi 50\ncc'ye düşmüş ve ağrıdan intiharı düşünüyor (Son Dönem - End-Stage IC).\nBu refrakter, fibrotik ve taşlaşmış mesane için son cerrahi (radikal)\nçözüm nedir?\"</p>\n<p>Cevap: \"Ağrıdan tamamen çıldırma noktasına gelmiş ve mesanesi\n\"Shrunken Bladder (Büzüşmüş Mesane)\" haline dönmüş refrakter hastalarda,\ntüm konservatif yollar tükendiğinde son çare Radikal Sistektomi ve\nÜriner Diversiyon (İleal Konduit veya Neomesane)'dur. Ancak bu ameliyat\nkararı verilmeden önce, hastanın ağrısının mesane kaynaklı değil de\nnöropatik pelvik taban kaynaklı olup olmadığını kesinleştirmek gerekir;\naksi takdirde mesaneyi alsan bile hastanın o hayalet ağrısı devam\nedebilir. Bu ameliyat absolut (kesin) son çaredir.\"</p>\n"}, {"id": "11.10", "t": "Erkek Post-Prostatektomi İnkontinansı (PPI) ve Artifisyel Üriner Sfinkter (Aus)", "h": "<h3 id=\"a-i̇atrojeni̇k-yikim-i̇ç-ve-dış-kapının-düşüşü\">A. İATROJENİK\nYIKIM: İç ve Dış Kapının Düşüşü</h3>\n<p>Prostat, mesanenin hemen altında doğal bir \"İç Sfinkter\" (İstemsiz)\ngörevi görür. Radikal Prostatektomide biz prostatı mesane boynuyla\nbirlikte tamamen söküp aldığımızda, iç kapı sonsuza dek yok olur.\nHastanın idrarını tutabilmesi için geriye tek bir silahı kalır: Çizgili\nDış Sfinkter (Rabdofinkter).</p>\n<p>Eğer ameliyat sırasındaki çekilmeler (traksiyon), koterin ısısı veya\napeksteki kanseri temizlerken atılan dikişler bu dış sfinkteri de\nzedelerse, hasta tamamen kapısız kalır. Buna Post-Prostatektomi\nİnkontinansı (PPI) denir.</p>\n<h3 id=\"b-hafi̇forta-kaçaklar-erkek-askıları-male-slings\">B. HAFİF/ORTA\nKAÇAKLAR: Erkek Askıları (Male Slings)</h3>\n<p>Eğer hasta günde 1-2 ped kirletiyorsa (Hafif-Orta PPI) ve sfinkterin\nhala biraz kasılma gücü varsa, ilk seçenek Erkek Askı (Male Sling)\nameliyatlarıdır (Örn: AdVance, Virtue).</p>\n<p><em>Mekanizma:</em> Kadınlardaki \"hamak\" mantığından farklıdır.\nPerineden (apış arasından) girilir. Bulbar üretranın altından geçirilen\nsentetik meş (ağ), kemiklere (obturatuar foramene) asılarak yukarı doğru\ngerdirilir.</p>\n<p><em>Amaç:</em> Üretrayı yukarı ve içeri (proksimale) doğru iterek,\nsfinkter bölgesindeki anatomik açıyı düzeltmek ve idrar kanalını\nuzatmaktır.</p>\n<p>Kılavuzların Kesin Kuralı: Eğer hasta daha önce Radyoterapi (Işın\ntedavisi) almışsa, dokular tahta gibi sertleştiği ve esnemediği için\nSling ameliyatları KESİNLİKLE KONTRENDİKEDİR (Başarı şansı %0'a\nyakındır).</p>\n<h3 id=\"c-altin-standart-artifisyel-üriner-sfinkter-aus-800\">C. ALTIN\nSTANDART: Artifisyel Üriner Sfinkter (AUS 800)</h3>\n<p>Eğer hasta günde 4-5 ped (Ağır PPI) kullanıyorsa veya radyoterapi\nöyküsü varsa, tek ve altın standart çözüm yapay sfinkterdir (En bilinen\nmodel: AMS 800). Bu cihaz, içi sıvıyla dolu, 3 parçalı kapalı bir\nhidrolik sistemdir.</p>\n<p>Manşon (Cuff): Perineden girilerek idrar kanalının (Bulbar Üretra)\netrafına bir yüzük gibi sarılır. İçi sıvı dolu olduğu için üretrayı\ndışarıdan 360 derece sıkarak kapatır.</p>\n<p>Basınç Düzenleyici Balon (PRB - Pressure Regulating Balloon): Karın\niçine (genellikle Retzius mesafesine veya subrektal alana)\nyerleştirilir. Sistemin \"Su Deposu\"dur ve manşonun üretrayı hangi\nbasınçla (genellikle 61-70 cmH2O) sıkacağını otonom olarak ayarlar.</p>\n<p>Kontrol Pompası (Pump): Hastanın skrotumuna (testis torbasına),\ntestislerin yanına cilt altına yerleştirilir.</p>\n<p>Nasıl Çalışır?</p>\n<p>Sistem normalde AÇIK (Aktif, Manşon şişik, Kapı kapalı) haldedir.\nHasta idrara sıkıştığında, tuvalete gider ve eliyle torbasındaki pompayı\niki kez ard arda (Cycle) kuvvetlice sıkar.</p>\n<p>Pompa sıkıldığında, manşonun içindeki su hortumlarla PRB (Balon)\ndeposuna transfer olur.</p>\n<p>Manşon söner, idrar kanalı (üretra) üzerindeki baskı tamamen kalkar\nve kapı %100 açılır.</p>\n<p>Hasta rahatça, tıkanmadan, normal bir şekilde idrarını boşaltır.</p>\n<p>Hasta elini çeker ve bekler. Sistemin içindeki Direnç (Resistor)\nvalfleri, suyu PRB'den geri manşona doğru itmeye başlar. Bu dolum 3 ila\n5 DAKİKA sürer.</p>\n<p>5 dakikanın sonunda manşon yeniden şişer ve idrar yolunu kapatır.</p>\n<h3 id=\"d-ausun-aşi̇l-topuğu-ve-kabusu-sonda-cinayeti-ve-erozyon\">D.\nAUS'UN AŞİL TOPUĞU VE KABUSU: Sonda Cinayeti ve Erozyon</h3>\n<p>Yapay sfinkter mucizedir, hayat kurtarır ancak en ufak bir hata\nüretrayı delip geçer (Erozyon).</p>\n<p>Enfeksiyon Riski: Yabancı bir silikon parçası konduğu için (tıpkı\nmutluluk çubuğu/protez gibi), ameliyathanedeki en ufak bir\n<em>Stafilokok</em> bakterisi cihazı çürütür. Tüm sistem ameliyathane\nşartlarında çıkartılmak zorunda kalınır. Bu yüzden ameliyat öncesi\nhastanın idrarının steril olması %100 ZORUNLUDUR. Hastanın bacakları,\nkarnı antibiyotikli solüsyonlarla defalarca yıkanır, her cerrahi ekip\n(hemşire, asistan) maske/eldiven prosedürlerine bir organ nakli\ntitizliğinde uymak zorundadır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"AUS (Yapay Sfinkter) takılmış 60 yaşında bir erkek hasta acile\ngeldi. Kalp krizi (MI) geçiriyor veya kalça kırığı var, başka bir\nnedenle acil ameliyata veya anjiyoya alınacak. Acil asistanı sana,\n'Hocam bu hastaya idrar sondası (Foley) takabilir miyim?' diye sordu.\nOlası bir felaketi önlemek için vereceğin kesin talimat nedir?\"</p>\n<p>Cevap: \"Aktif halde, şişik bir yapay sfinkter manşonu varken (üretra\nkapalıyken) üretradan körlemesine bir sonda itmek, üretrayı manşonla\nsonda arasında sıkıştırıp parçalamak demektir (İatrojenik\nErozyon/Rüptür). Bu bir cinayettir. Hastaya idrar sondası takılmadan\nveya herhangi bir endoskopik (sistoskopi) işlem yapılmadan önce cihazın\ntorbadaki pompasındaki 'Deaktivasyon Düğmesine (Deactivation Button)'\nbasılarak manşonun sönük (Açık/Deflate) pozisyonda KİLİTLENMESİ ŞARTTIR.\nAncak o zaman güvenle sonda takılabilir.\"</p>\n<p>Soru: \"Hastana 3 yıl önce AUS taktın. 3 yıl boyunca hiç idrar\nkaçırmadı, ped kullanmadı. Ancak son 1 aydır, 'Hocam gündüzleri gezerken\nkaçırmıyorum ama gece yatakta döndüğümde veya ağır bir şey kaldırdığımda\n(Öksürdüğümde) tekrar idrar kaçırmaya başladım' diyerek geldi. Sistem\nhala çalışıyor. Bu mekanik ve anatomik arızanın adı nedir?\"</p>\n<p>Cevap: \"Bu klasik bir Üretral Atrofi tablosudur. Yapay sfinkterin\nmanşonu, 3 yıl boyunca bulbar üretrayı (korpus spongiyozumu) 61-70 cmH2O\nbasınçla sıkmış ve kanlanmasını bozmuştur. Bu uzun süreli bası sonucu,\nüretra süngeri incelmiş ve erimiştir (Atrofi). Manşon aynı boyuttadır\nama içindeki üretra inceldiği için artık 360 derece tam bir kapatma\nsağlayamamaktadır (Bol geliyordur). Bu durumda ameliyathaneye tekrar\ngirip, daha küçük çaplı yeni bir manşon (Örn: 4.5 cm yerine 4.0 cm veya\nTandem/Çift Manşon) takılarak sorun çözülür.\"</p>\n<p>Soru: \"Hastaya AUS ameliyatını yeni bitirdin, yaraları kapattın.\nAmeliyat masasında cihazın pompasını sıkıp 'Cycle' (Aç-Kapa) testini\nyaptın, sistem kusursuz çalışıyor. Hastayı servise veya evine\ngönderirken cihazı AÇIK (Aktif - Üretrayı kapatan) pozisyonda mı\nbırakırsın, yoksa KAPALI (Deaktif - Manşon inik) pozisyonda mı?\nNeden?\"</p>\n<p>Cevap: \"Ameliyat biter bitmez cihazı kesinlikle DEAKTİF (Manşon\nsönük/Kapı açık) pozisyonda kilitler ve hastayı öyle gönderirim.\nAmeliyatın yarattığı doku ödemi, hematom ve inflamasyon nedeniyle üretra\nzaten çok şiştir. Eğer cihazı o anda aktif hale getirir ve üretrayı bir\nde manşonla sıkıştırırsam, o üretra 3 gün içinde nekroza gidip delinir\n(Erken Erozyon). EAU/AUA kurallarına göre hasta 4 ila 6 hafta boyunca\n(ödem inene kadar) cihaz kapalıyken yine idrar kaçırmaya devam eder. 6.\nHaftada (Aktivasyon vizitinde) poliklinikte cihazı aktif hale getirir,\nhastaya nasıl kullanacağını öğretir ve idrarını keseriz.\"</p>\n"}]}, {"n": 12, "t": "Pediatrik Üroloji I", "s": [{"id": "12.1", "t": "Üriner Sistemin Embriyolojisi ve Gelişimsel Anomaliler", "h": "<h3 id=\"a-böbreği̇n-üç-aşamali-yaratilişi\">A. BÖBREĞİN ÜÇ AŞAMALI\nYARATILIŞI</h3>\n<p>İnsan embriyosunda böbrek tek seferde oluşmaz. Tıpkı bir binanın\ntemeli, iskelesi ve çatısı gibi üç farklı yapı sırayla birbirinin yerini\nalır:</p>\n<p>Pronefroz (İlkel Böbrek): 4. haftada boyun bölgesinde (servikal)\nbelirir ve hiçbir işlev görmeden birkaç gün içinde tamamen kaybolur\n(dejenere olur). Sadece evrimsel bir kalıntıdır.</p>\n<p>Mezonefroz (Geçici Böbrek): Torakolomber bölgede oluşur. 4. ile 8.\nhaftalar arasında geçici olarak idrar üretir. Asıl önemi böbrek olmak\ndeğil, erkeklerde Wolff Kanalını (ileride epididim ve vaz deferens\nolacak yapıyı) oluşturmasıdır.</p>\n<p>Metanefroz (Kalıcı Böbrek): 5. haftada pelviste başlar ve bizim ömür\nboyu kullanacağımız asıl böbrektir. İki mucizevi yapının birbirini\nkarşılıklı uyardığı bir diyalogla şekillenir.</p>\n<h3 id=\"b-hücresel-di̇yalog-üreterik-tomurcuk-ve-metanefrik-blastem\">B.\nHÜCRESEL DİYALOG: Üreterik Tomurcuk ve Metanefrik Blastem</h3>\n<p>Metanefrozun gelişmesi, tıp fakültesinde her anatomi hocasının\nsorduğu o meşhur \"karşılıklı indüksiyon\" kaskadına bağlıdır.</p>\n<p>Üreterik Tomurcuk (Ureteric Bud): Wolff kanalının alt ucundan\nfilizlenen bir daldır. Yukarıya doğru büyürken üreterleri, renal\npelvisi, majör/minör kaliksleri ve toplayıcı kanalları oluşturur.</p>\n<p>Metanefrik Blastem: Embriyonun kuyruk sokumu (sakral) bölgesindeki\nmezenkimal dokudur. Üreterik tomurcuk gelip bu dokuya çarptığında,\nkimyasal sinyaller (GDNF ve RET reseptörleri) salgılanır. Blastem bu\nsinyalle nefronlara (glomerül, proksimal/distal tübüller, Henle kulbu)\ndönüşür.</p>\n<p>Klinik Kural: Eğer üreterik tomurcuk zamanında çıkmazsa veya blasteme\nulaşamazsa sinyalleşme olmaz ve o taraftaki böbrek hiç gelişmez (Böbrek\nAgenezisi). Eğer tomurcuk erken çatallanırsa Çift Toplayıcı Sistem\n(Duplikasyon) oluşur.</p>\n<h3 id=\"c-böbreği̇n-yükseli̇şi̇-ve-rotasyonu-ascent-and-rotation\">C.\nBÖBREĞİN YÜKSELİŞİ VE ROTASYONU (ASCENT AND ROTATION)</h3>\n<p>Böbrekler hayata pelviste (leğen kemiğinin içinde) başlar. Embriyo\nbüyüdükçe (6. ve 9. haftalar arası) böbrekler yukarı, asıl yerleri olan\nretroperitona (lumbar bölgeye) tırmanır.</p>\n<p>Rotasyon: Pelvisteyken renal pelvis (böbrek havuzcuğu) öne bakarken,\nyukarı çıkarken 90 derece içe (mediale) döner. Bu yüzden normal bir\nanatomide renal pelvis içte (medialde), kaliksler ise dışta (lateralde)\nyer alır.</p>\n<h3 id=\"d-füzyon-ve-lokali̇zasyon-anomali̇leri̇\">D. FÜZYON VE LOKALİZASYON\nANOMALİLERİ</h3>\n<p>Yukarı çıkış veya rotasyon sırasında işler ters giderse, ürolojik\ncerrahinin o kanlı ve tehlikeli anomalileri ortaya çıkar.</p>\n<p>Atnalı Böbrek (Horseshoe Kidney):</p>\n<p>En sık görülen füzyon anomalisidir (1/400). Böbrekler pelvisten\nyukarı çıkmaya başlamadan önce, %90 oranında alt pollerinden\n(uçlarından) birbirine yapışır.</p>\n<p>Altın Anatomik Sınır (İMA): Bu yapışık devasa kitle yukarı çıkarken,\naortadan çıkan İnferior Mezenterik Arter (IMA) adlı damara takılır. İMA\nbir kanca gibi böbreğin altından geçer ve böbreklerin daha fazla yukarı\nçıkmasını engeller. Bu yüzden atnalı böbrekler her zaman normalden daha\naşağıdadır (L3-L5 seviyesinde).</p>\n<p>Cerrahi Risk: Rotasyonlarını tamamlayamadıkları için renal pelvisleri\nöne bakar. Üreterler o kalın \"istmus\" dokusunun (böbrekleri birleştiren\nköprü) üzerinden atlayarak aşağı inmek zorundadır. Bu anormal anatomi\nidrar akışını bozar ve UPJ darlığı, taş oluşumu ve enfeksiyon riskini\ninanılmaz derecede artırır.</p>\n<p>Çapraz Kaynaşık Ektopi (Crossed Fused Ectopia):</p>\n<p>Böbreklerden biri kendi tarafında yukarı çıkmak yerine, karşı tarafa\ngeçer ve oradaki böbrekle birleşir. Hastanın bir tarafında hiç böbrek\nyokken, diğer tarafında devasa çift bir böbrek kitlesi vardır. Ancak\nüreterler (idrar kanalları) mesaneye normal, kendi yerlerinden\ngirerler.</p>\n<p>Pelvik Böbrek (Ektopi):</p>\n<p>Böbrek yukarı çıkış yolculuğuna hiç başlamaz ve pelviste kalır.\nGenellikle kanlanmasını doğrudan ilyak damarlardan alır. Gebelik\nsırasında (rahim büyüdüğünde) veya apandisit ameliyatlarında yanlışlıkla\nzarar görme riski çok yüksektir.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Yenidoğan yoğun bakımda bir bebek doğdu. Yüzü basık, kulakları\ndüşük, çenesi küçük ve el/ayaklarında şekil bozuklukları var.\nAkciğerleri gelişmemiş (Pulmoner hipoplazi) ve bebek nefes alamıyor.\nUltrason yaptın ve her iki böbreği de göremedin (Bilateral Renal\nAgenezi). Bu ölümcül sendromun adı nedir ve akciğerler neden\ngelişmemiştir?\"</p>\n<p>Cevap: \"Bu tablo Potter Sendromudur. Anne karnında amniyon sıvısını\nüreten asıl kaynak fetüsün böbrekleridir (fetal idrar). Çift taraflı\nböbrek yokluğunda idrar üretilemez ve Oligohidramnios (sıvı yokluğu)\ngelişir. Amniyon sıvısı olmadığı için anne rahmi bebeği ezer\n(yüz/ekstremite anomalileri) ve amniyon sıvısını yutarak/soluyarak\ngelişmesi gereken akciğerler gelişemez (Pulmoner hipoplazi). Bebek\ngenellikle doğumdan hemen sonra solunum yetmezliğinden kaybedilir.\"</p>\n<p>Soru: \"Poliklinikte ultrason raporunda 'Sol ektopik pelvik böbrek'\nyazan genç bir kadın hasta var. Hastanın jinekolojik öyküsünde veya\nanatomisinde ekstra kontrol etmen gereken eşlik eden bir sendrom var\nmıdır?\"</p>\n<p>Cevap: \"Evet. Üriner sistem ile genital sistem (Müllerian kanallar)\nembriyolojik olarak çok yakın komşudur. Tek taraflı böbrek agenezisi\nveya pelvik ektopi gibi anomalilerde kadınlarda sıklıkla Müllerian\nAnomaliler (Çift rahim, yarım rahim, vajinal septum veya\nMayer-Rokitansky-Küster-Hauser Sendromu) eşlik edebilir. Mutlaka detaylı\njinekolojik MR veya muayene istenir.\"</p>\n<p>Soru: \"Atnalı böbreği olan bir hastada 2 cm'lik pelvis taşı var. Açık\nveya perkütan cerrahi (PCNL) planlarken normal bir böbreğe göre damar\nanatomisi açısından neden çok daha fazla korkmalısın?\"</p>\n<p>Cevap: \"Çünkü atnalı böbreklerin damarlanması (vaskülarizasyonu)\ntamamen kaotiktir. Normal bir böbrek tek bir renal arterden beslenirken;\natnalı böbrek aortadan, ilyak arterlerden, İMA'dan veya sakral\narterlerden birden fazla (multipl) ektopik arter alabilir. Bu ektopik\ndamarlar genellikle böbreğin pelvisinin tam üzerinden veya altından\ngeçer. Yanlış bir kesi veya perkütan iğne girişi, öngörülemeyen devasa\nve ölümcül kanamalara yol açar. Bu yüzden ameliyat öncesi mutlaka\nKontrastlı BT Anjiyografi çekilip damar haritası çıkarılmalıdır.\"</p>\n"}, {"id": "12.2", "t": "Antenatal Hidronefroz (Fetal USG, Postnatal Değerlendirme ve Ap Çap)", "h": "<h3\nid=\"a-fetal-usg-ve-alarm-zi̇lleri̇-ap-çap-antero-posterior-pelvik-çap\">A.\nFETAL USG VE ALARM ZİLLERİ: AP Çap (Antero-Posterior Pelvik Çap)</h3>\n<p>Böbreğin ne kadar şiştiğini anlamak için radyolog, anne karnındaki\nbebeğin böbrek havuzcuğunu (Renal Pelvis) en geniş yerinden, önden\narkaya doğru ölçer. Buna AP Çap (APD) denir.</p>\n<p>Geçmişte sadece SFU (Society of Fetal Urology) evrelemesi\nkullanılırdı, ancak güncel EAU/AUA 2026 kılavuzları çok daha objektif\nolan UTD (Urinary Tract Dilation) Sınıflamasını ön plana çıkarmaktadır.\nKarar verirken gebelik haftası (Trimester) ve AP çapın milimetresi\nhayatidir:</p>\n<h3 id=\"2-trimester-16-27-haftalar\">2. Trimester (16-27. Haftalar):</h3>\n<p>\\&lt; 4 mm: Normal.</p>\n<p>\\4 - 7 mm: UTD A1 (Düşük Risk). Genellikle fizyolojiktir, sadece USG\ntakibi istenir.</p>\n<p>≥ 7 mm: UTD A2-3 (Yüksek Risk). Patoloji (UPJ darlığı, VUR) şüphesi\nbaşlar.</p>\n<h3 id=\"3-trimester-28-hafta-ve-sonrası\">3. Trimester (28. Hafta ve\nSonrası):</h3>\n<p>\\&lt; 7 mm: Normal.</p>\n<p>\\7 - 10 mm: UTD A1 (Düşük Risk).</p>\n<p>≥ 10 mm: UTD A2-3 (Yüksek Risk). Eğer çap 15 mm'yi geçiyorsa, bu\nartık kesinlikle cerrahi bir patolojinin (örn: şiddetli UPJ\nobstrüksiyonu) habercisidir.</p>\n<h3 id=\"b-hi̇dronefrozun-altinda-yatan-düşmanlar-etyoloji\">B.\nHİDRONEFROZUN ALTINDA YATAN DÜŞMANLAR (Etyoloji)</h3>\n<p>Suyu tutan baraj nerededir?</p>\n<p>Geçici/Fizyolojik Hidronefroz (%50-70): Düz kasların henüz tam\nolgunlaşmamasına veya anne hormonlarına bağlıdır. Kendi kendine\ngeçer.</p>\n<p>Üreteropelvik Bileşke (UPJ) Darlığı (%10-20): Patolojik hidronefrozun\nen sık nedenidir. Böbrek şiştir ama üreter (aşağı inen kanal)\nnormal/incedir.</p>\n<p>Vezikoüreteral Reflü - VUR (%10-15): İdrarın mesaneden böbreğe geri\nkaçmasıdır. Ultrason mesanenin dolup boşalmasına göre değişkenlik\ngösterir (bazen böbrek çok şişer, bazen iner).</p>\n<p>Üreterovezikal Bileşke (UVJ) Darlığı / Megaüreter (%5-10): Tıkanıklık\nmesaneye giriş yerindedir. Ultrasonda hem böbrek şiştir hem de üreter\ndevasa bir boru gibi (Megaüreter) genişlemiştir.</p>\n<p>Posterior Üretral Valv - PUV (%1-2): En ölümcül, en acil tablodur.\nSadece erkek fetüslerde görülür. Her iki böbrek de şiddetli\nhidronefrotiktir, mesane duvarı kalınlaşmıştır (Keyhole/Anahtar deliği\nbelirtisi) ve bebek idrar yapamadığı için amniyon sıvısı yoka yakındır\n(Oligohidramnios).</p>\n<h3 id=\"c-postnatal-doğum-sonrasi-değerlendi̇rme-o-kritik-hata\">C.\nPOSTNATAL (DOĞUM SONRASI) DEĞERLENDİRME: O Kritik Hata!</h3>\n<p>Bebek doğdu. Pediatri veya Kadın Doğum asistanı seni arayıp \"Hocam\nantenatal hidronefrozu olan bebek doğdu, hemen şimdi (1. gün) ultrason\nçekelim mi?\" diye sorar.</p>\n<p>Ürolojik Aksiyom (Asla Unutma): Bebek doğar doğmaz, hayatının ilk\n48-72 saati içinde RUTİN BÖBREK ULTRASONU ÇEKİLMEZ! (Bilateral devasa\nşişlik veya PUV şüphesi olan aciller hariç).</p>\n<p>Neden? Çünkü yenidoğanlar hayatlarının ilk 2-3 gününde fizyolojik bir\ndehidratasyon (sıvı kaybı) ve oligüri (az idrar çıkarma) dönemindedir.\nBebek susuz olduğu için böbrekler az idrar üretir. Eğer sen 1. gün USG\nçekersen, aslında devasa bir UPJ darlığı olan böbreği \"normal\n(şişmemiş)\" olarak görürsün. Buna Yalancı Negatiflik (False Negative)\ndenir.</p>\n<p>Doğrusu: Bebek anne sütünü alıp hidrate olduktan sonra, yani doğumdan\n3 ila 7 gün sonra ilk USG (Postnatal USG) çekilir.</p>\n<h3 id=\"d-i̇lk-müdahale-antibiyotik-profilaksisi-kimlere-verilir\">D. İLK\nMÜDAHALE: Antibiyotik Profilaksisi Kimlere Verilir?</h3>\n<p>Bebeğin böbreği şişmiş durumda ve içinde idrar gölleniyor. Göllenen\nidrar enfeksiyona (Piyelonefrit) davetiyedir. Bir yenidoğanda\npiyelonefrit hızla sepsise ve böbrek skar (nedbe) oluşumuna, yani kalıcı\nnefron kaybına yol açar.</p>\n<p>EAU 2026 Kılavuzuna Göre Profilaksi Endikasyonları:</p>\n<p>Yüksek dereceli (SFU Evre 3-4 veya UTD P2-3) hidronefroz.</p>\n<p>Bilateral (iki taraflı) hidronefroz.</p>\n<p>Üreterde genişleme (Megaüreter) veya mesanede kalınlaşma varsa.</p>\n<p>VUR veya PUV şüphesi varsa.</p>\n<p>İlaç: Yenidoğanlarda ilk ay böbrek ve karaciğer enzimleri\nolgunlaşmadığı için Trimetoprim-Sülfametoksazol (Bactrim) gibi ilaçlar\nYASAKTIR (Kernikterus/Sarılık yapar). İlk 1-2 ay sadece Amoksisilin veya\nSefaleksin (düşük doz, günde tek sefer) kullanılır.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Erkek bebek, antenatal takiplerinde bilateral (iki taraflı)\nEvre 4 hidronefroz ve oligohidramnios saptanmıştı. Doğumhaneden seni\nacil aradılar, bebek doğdu. Ultrasonu beklemek veya 3 gün sonra çağırmak\ngibi bir lüksün var mı? İlk ne yapacaksın?\"</p>\n<p>Cevap: \"Kesinlikle yok. Bu tablo aksi ispat edilene kadar Posterior\nÜretral Valv (PUV) kabul edilir ve ürolojik bir acildir. Bebek idrar\nyapamadığı için böbrekleri patlama noktasındadır. Yenidoğan yoğun bakıma\niner inmez ilk yapacağım iş, bebeğin idrar kanalından (üretradan) içeri\nince bir beslenme sondası (5F veya 6F Feeding Tube) takarak mesaneyi\nboşaltmaktır. Sonda takıldıktan sonra böbreklerin rahatlayıp\nrahatlamadığını görmek için USG çekilir ve kesin tanı için VCUG (İşeme\nSistouretrografisi) planlanır.\"</p>\n<p>Soru: \"Bebek doğdu, 5. gün ultrasonunu çektin. Her iki böbrek de\ntamamen NORMAL geldi. Antenatal dönemdeki o 7 mm'lik hidronefrozlar\ntamamen kaybolmuş. Aileye 'Gözünüz aydın, hiçbir hastalığı yok, bir daha\nkontrole gelmeyin' diyebilir misin?\"</p>\n<p>Cevap: \"Demem. Geçici/fizyolojik hidronefroz düzelmiş olabilir, ancak\nVezikoüreteral Reflü (VUR) hastalığında böbrekler ultrasonda %100 normal\ngörünebilir. VUR, sadece işeme (kasılma) sırasında idrarı yukarı kaçırıp\nböbreği anlık olarak şişirebilir. Aileyi, bebekte ateşli idrar yolu\nenfeksiyonu (İYE) gelişmesi durumunda acilen bize başvurmaları gerektiği\nve böyle bir durumda VCUG çekileceği konusunda mutlaka uyarmalıyım.\"</p>\n<p>Soru: \"Bir aylık bebekte sol UPJ darlığı şüphesiyle böbrek\nsintigrafisi (MAG3 veya DTPA) isteyeceğiz. Bebeğin böbrek\nfonksiyonlarının tam anlamıyla olgunlaşmasını beklemeli miyiz, yoksa\nhemen 1. haftada çekelim mi?\"</p>\n<p>Cevap: \"Yenidoğan böbreklerinin glomerüler filtrasyon hızı (GFR) ve\ntübüler sekresyon kapasitesi ilk haftalarda çok düşüktür. Eğer\nsintigrafiyi (MAG3) doğumdan hemen sonra çekersen, böbrek ilacı\natamayacağı için 'sanki tamamen tıkanmış' gibi yalancı bir obstrüksiyon\neğrisi verir. Güvenilir bir sintigrafi çekebilmek için bebeğin\nnefronlarının olgunlaşması beklenmeli, yani MAG3 sintigrafisi bebek en\naz 1 aylık (tercihen 4-6 haftalık) olduktan SONRA çekilmelidir.\"</p>\n"}, {"id": "12.3", "t": "UPJ Darlığı Etyolojisi, Patofizyolojisi ve Tanı Algoritması", "h": "<h3 id=\"a-düşmanin-anatomi̇si̇-i̇çeriden-mi-dışarıdan-mı\">A. DÜŞMANIN\nANATOMİSİ (İçeriden mi, Dışarıdan mı?)</h3>\n<p>Renal pelvis ile üreterin birleştiği o huni şeklindeki geçit neden\ntıkanır? Kılavuzlar bunu iki ana mekanizmaya ayırır:</p>\n<h3 id=\"1-i̇ntrinsik-i̇çsel-darlık---aperistaltik-segment\">1. İntrinsik\n(İçsel) Darlık - \"Aperistaltik Segment\":</h3>\n<p>Yenidoğan ve bebeklik dönemindeki vakaların tartışmasız en sık\nnedenidir. Sorun embriyolojiktir.</p>\n<p>Patofizyoloji: O bölgedeki düz kas hücreleri spiral (sarmal) şekilde\ngelişmek yerine uzunlamasına gelişmiş ve aralarına aşırı miktarda\nkollajen (bağ dokusu) birikmiştir.</p>\n<p>Sonuç: Böbrek pelvisinden gelen idrar dalgası (peristaltizm) bu sert\nve kasılamayan (aperistaltik) segmente çarpar ve aşağı iletilemez.\nAnatomik bir tam kapalılık yoktur, fonksiyonel bir iletim felci\nvardır.</p>\n<h3\nid=\"2-ekstrinsik-dışsal-darlık---çaprazlayan-damar-crossing-vessel\">2.\nEkstrinsik (Dışsal) Darlık - \"Çaprazlayan Damar\" (Crossing Vessel):</h3>\n<p>Daha çok büyük çocuklarda ve ergenlerde (sıklıkla sol tarafta)\ngörülen sinsi bir tablodur.</p>\n<p>Patofizyoloji: Böbreğin alt polünü besleyen anormal/ektopik bir arter\n(Aberran alt pol arteri), tam UPJ'nin üzerinden çaprazlayarak geçer ve\nidrar kanalını dışarıdan bir hortum gibi ezer.</p>\n<p>Klinik (Dietl Krizi): Bu hastalar bebekken tamamen normaldir. Ancak\nçocuk büyüyüp çok fazla sıvı aldığında (veya ergenlikte bira/kahve\niçtiğinde) böbrek aniden aşırı idrar üretir. Pelvis şişer, şiştikçe o\ndamarın üzerine daha çok katlanır (kink yapar) ve tıkanır. Çocuk acile\nkıvrandıran, bulantı-kusmalı şiddetli bir yan ağrısıyla gelir. İdrar\nyavaş yavaş boşaldığında ağrı aniden kesilir.</p>\n<h3\nid=\"b-tani-algori̇tmasi-ultrasonun-sınırları-ve-sintigrafinin-gücü\">B.\nTANI ALGORİTMASI: Ultrasonun Sınırları ve Sintigrafinin Gücü</h3>\n<h3 id=\"1-i̇lk-basamak-ultrasonografi-usg\">1. İlk Basamak: Ultrasonografi\n(USG)</h3>\n<p>UPJ darlığı tanısı ultrasonda şu klasik üçlüyle şüphe çeker:</p>\n<p>Renal pelvis çok geniştir (Örn: AP çap &gt; 15 mm).</p>\n<p>Kaliksler küntleşmiş veya balonlaşmıştır (Kaliksiyel dilatasyon).</p>\n<p>Üreter GÖRÜLMEZ! (Eğer ultrason raporunda \"üreter 10 mm çapında\ngenişlemiştir\" yazıyorsa, o UPJ darlığı DEĞİLDİR; VUR veya\nMegaüreterdir. UPJ'de tıkanıklık yukarıda olduğu için aşağısı tamamen\nsönüktür).</p>\n<h3 id=\"2-altın-standart-diüretikli-böbrek-sintigrafisi-mag3--dtpa\">2.\nAltın Standart: Diüretikli Böbrek Sintigrafisi (MAG3 / DTPA)</h3>\n<p>İşte ameliyat veya izlem kararını verdiren o muazzam nükleer\ntest.</p>\n<p>Neden DTPA değil de MAG3? DTPA sadece glomerüllerden süzülür (GFR).\nMAG3 (Mertiatid) ise proksimal tübüllerden sekrete edilir. Bebeklerin\nglomerülleri henüz tam olgunlaşmadığı için MAG3, fonksiyonu düşük bebek\nböbreklerinde bile mükemmel görüntü ve eğri verir. Kılavuzların\npediatrideki tartışmasız ilk tercihidir.</p>\n<p>Furosemid (Lasix) Etkisi: Çocuğa damardan radyoaktif ilaç (MAG3)\nverilir. İlaç böbrekte toplanır (Uptake). Sonra damardan Furosemid\n(idrar söktürücü) yapılır. Eğer sistem tıkalı değilse, o devasa idrar\ndalgası radyoaktif maddeyi yıkayıp aşağı (mesaneye) süpürür. Tıkalıysa,\nmadde böbrekte hapsolur.</p>\n<h3 id=\"c-si̇nti̇grafi̇ni̇n-di̇li̇-karar-verici-parametreler\">C. SİNTİGRAFİNİN\nDİLİ: Karar Verici Parametreler</h3>\n<p>Raporu eline aldığında gözün sadece şu iki değere odaklanmalıdır:</p>\n<h3 id=\"1-bölünmüş-böbrek-fonksiyonu-split-renal-function---srf\">1.\nBölünmüş Böbrek Fonksiyonu (Split Renal Function - SRF):</h3>\n<p>Her iki böbreğin toplam fonksiyona katkısını % (yüzde) olarak verir.\nNormalde 50/50 veya 45/55 olmalıdır.</p>\n<p>Alarm Zili: Eğer hidronefrotik olan böbreğin SRF'si %40'ın altına\ninmişse, o böbrek boğuluyor ve nefronları kalıcı olarak ölüyor demektir.\nCerrahi (Piyeloplasti) endikasyonu KESİNDİR.</p>\n<h3 id=\"2-yarılanma-süresi-t-half--t_12\">2. Yarılanma Süresi (T-half /\n\\T_{1/2}):</h3>\n<p>Radyoaktif maddenin Furosemid yapıldıktan sonra böbrekten yarı yarıya\ntemizlenmesi için geçen süredir. Eğrinin eğimini belirler.</p>\n<p>\\T_{1/2} &lt; 10 dakika: Tıkanıklık YOKTUR (Sadece genişlemiş,\ntembel bir havuzdur).</p>\n<p>\\T_{1/2} = 10-20 dakika: Şüpheli (Equivocal) bölge. Yakın takip\ngerektirir.</p>\n<p>\\T_{1/2} &gt; 20 dakika: Gerçek bir OBSTRÜKSİYON (Tıkanıklık)\nvardır. Eğri (Washout curve) aşağı inmez, düz bir plato çizer veya\nyukarı çıkmaya devam eder.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"3 aylık bebeğin sol böbreğinde USG'de 25 mm hidronefroz (Evre\n4) var. MAG3 sintigrafisi çektik: Split fonksiyon Sol %48, Sağ %52.\nAncak Sol böbreğin \\T_{1/2} süresi 35 dakika (Obstrüktif eğri). Böbrek\nfonksiyonu korunduğuna (%48) göre, bu bebeği hemen ameliyata\n(Piyeloplasti) alır mısın, yoksa izler misin?\"</p>\n<p>Cevap: \"EAU 2026 kılavuzuna göre İzlem (Konservatif Yönetim) yaparım.\nBebeklerde sadece eğrinin obstrüktif (tıkanık) gelmesi tek başına\nameliyat endikasyonu DEĞİLDİR, çünkü bu tıkanıklıkların bir kısmı ilk\n1-2 yıl içinde kendiliğinden olgunlaşıp açılabilir. Ameliyat için\nobstrüktif eğriye ek olarak; Split fonksiyonun %40'ın altına düşmesi,\ntakiplerde fonksiyonun &gt;%5 daha kaybolması, USG'de AP çapın giderek\nartması veya bebeğin ateşli idrar yolu enfeksiyonu/ağrı atakları\n(Semptomatik) geçirmesi şarttır.\"</p>\n<p>Soru: \"Büyük bir çocuk (14 yaşında) geldi. Aralıklı şiddetli yan\nağrısı (Dietl krizi) tarifliyor. USG'sinde UPJ darlığı şüphesi var.\nAmeliyatta 'Çaprazlayan Damar (Crossing Vessel)' ile karşılaşma\nihtimaline karşı sintigrafi (MAG3) dışında ameliyat öncesi kesinlikle\nistemen gereken görüntüleme nedir?\"</p>\n<p>Cevap: \"Büyük çocuklarda çaprazlayan damar insidansı çok yüksektir.\nSintigrafi sadece tıkanıklığı gösterir, anatomiyi göstermez. Ameliyat\nplanını (özellikle robotik/laparoskopik yapacaksam) belirlemek için\nmutlaka Kontrastlı MR Ürografi veya BT Anjiyografi istemeliyim. Bu\nsayede o anormal ektopik damarın tam yerini ameliyattan önce haritalamış\nolurum.\"</p>\n<p>Soru: \"MAG3 sintigrafisi sonucunda hidronefrotik sol böbreğin Split\nFonksiyonu (SRF) %8 geldi. Neredeyse tamamen ölmüş bir böbrek. Aileye\ndirekt 'Böbreği alacağız (Nefrektomi)' mi dersin?\"</p>\n<p>Cevap: \"Pediatrik yaş grubunda böbreklerin inanılmaz bir geri dönüş\n(recovery) potansiyeli vardır. Genellikle %10-15'in altındaki böbreklere\nnefrektomi düşünülse de, direkt almam. Önce o böbreğe perkütan yolla bir\nNefrostomi Tüpü takarım. 2-4 hafta boyunca o böbrekten gelen idrarı\nbiriktirip kreatinin klirensini ölçerim veya sintigrafiyi tekrarlarım.\nTıkanıklık açıldığında böbrek fonksiyonu toparlıyorsa (örn: %15-20'lere\nçıkıyorsa) kurtarma ameliyatı (Piyeloplasti) yaparım; hiç toparlamıyorsa\nNefrektomi kararı veririm.\"</p>\n"}, {"id": "12.4", "t": "UPJ Darlığında Cerrahi Prensipler (Anderson-Hynes Piyeloplasti)", "h": "<h3 id=\"a-altin-standart-anderson-hynes-dismembranöz-piyeloplasti\">A.\nALTIN STANDART: Anderson-Hynes Dismembranöz Piyeloplasti</h3>\n<p>Tüm UPJ darlığı ameliyatlarının tartışmasız şahıdır. \"Dismembranöz\"\n(ayrılmış) kelimesi, hastalıklı UPJ segmentinin tamamen kesilip vücuttan\nçıkarıldığını ifade eder.</p>\n<p>Eksizyon (Kesip Atma): Hastalıklı, daralan UPJ segmenti (yaklaşık 1-2\ncm) tamamen kesilir ve patolojiye gönderilir.</p>\n<p>Redüksiyon (Küçültme): Böbrek pelvisi yıllarca idrar biriktiği için\ndevasa bir balona dönüşmüştür. Sadece dar kısmı kesmek yetmez, o devasa\npelvisin de fazla kısımları kesilerek küçültülür (Redüksiyon\nPiyeloplasti). Aksi takdirde idrar o geniş havuzda göllenmeye (staz)\ndevam eder ve enfeksiyon/taş yaratır.</p>\n<p>Spatülizasyon (Altın Kural): Üreteri (idrar kanalını) düz bir boru\ngibi yuvarlak şekilde pelvise dikemezsin. Dikersen, dikişler iyileşirken\nbüzüşür ve o nokta tekrar tıkanır. Bu yüzden üreterin dış (lateral)\nduvarına uzunlamasına 1.5 - 2 cm'lik bir kesi atılır. Üreterin ağzı bir\nyılanın ağzı gibi genişletilir. Buna Spatülizasyon denir.</p>\n<p>Anastomoz: Genişletilmiş üreter, küçültülmüş pelvise 5-0 veya 6-0\nemilebilir dikişlerle (PDS veya Vicryl) su sızdırmaz (watertight)\nşekilde dikilir. Kusursuz bir huni elde edilir.</p>\n<h3 id=\"b-çaprazlayan-damar-crossing-vessel-yöneti̇mi̇\">B. ÇAPRAZLAYAN\nDAMAR (CROSSING VESSEL) YÖNETİMİ</h3>\n<p>Bazen UPJ'nin kendisi tamamen sağlamdır, ancak böbreğin alt polünü\nbesleyen ektopik bir atardamar (Aberran Arter) tam UPJ'nin üzerinden\ngeçerek kanalı bir hortum gibi ezer. Ameliyatta bu damarla\nkarşılaştığında ne yapacaksın?</p>\n<p>Ölümcül Hata: \"Bu damar idrar yolunu tıkıyor, damarı bağlayıp\nkeseyim\" DENMEZ. Böbrek arterleri son-arterlerdir (end-artery). O damarı\nkesersen böbreğin alt polü anında iskemik nekroza (çürümeye) gider.</p>\n<p>Cerrahi Çözüm (Transpozisyon): Damara ASLA dokunulmaz. İdrar kanalı\n(UPJ) kesilir, üreter damarın ÖNÜNE (Anterioruna) alınarak damarla olan\nteması kesilir ve pelvis ile üreter damarın önünde (üstünde) yeniden\nbirbirine dikilir. Damar artık idrar yolunun arkasında kalmış ve bası\nortadan kalkmıştır.</p>\n<p><em>Alternatif (Hellström Tekniği):</em> Kanalı kesmeden, sadece\ndamarı böbrek pelvisinin daha yukarısına (doku tünelleri içine)\nkaydırarak sabitleme işlemidir, ancak dismembranöz anatomi kadar kalıcı\nsonuç vermez.</p>\n<h3 id=\"c-açik-mi-mi̇ni̇mal-i̇nvazi̇v-mi̇-kesi-nereden-olacak\">C. AÇIK MI,\nMİNİMAL İNVAZİV Mİ? (Kesi Nereden Olacak?)</h3>\n<p>EAU ve AUA kılavuzları yaşa ve hastanın anatomisine göre net sınırlar\nçizer:</p>\n<p>Bebekler (&lt; 1 Yaş, &lt; 10 kg): Karın içi hacimleri çok küçük\nolduğu için laparoskopik/robotik aletleri manevra ettirmek zordur. Bu\nyaş grubunda hala altın standart, sırttan kasları kesmeden araladığımız\no minicik ve çok zarif Dorsal Lumbotomi (açık) kesisidir.</p>\n<p>Büyük Çocuklar ve Ergenler: Altın standart kesinlikle Robot Yardımlı\nLaparoskopik Piyeloplasti (RALP)'dir. Da Vinci robotunun 3 boyutlu\nbüyütmesi ve 540 derece dönebilen bilek hareketleri, o incecik dikişleri\n(anastomozu) milimetrik bir kusursuzlukla atmamızı sağlar. Hastanede\nkalış süresini 1 güne düşürür.</p>\n<h3 id=\"d-si̇gorta-poli̇çesi̇-double-j-dj-stent-ve-drenaj\">D. SİGORTA\nPOLİÇESİ: Double-J (DJ) Stent ve Drenaj</h3>\n<p>Yeni diktiğin o incecik anastomoz ödem toplayacak ve idrar geçişine\nbir süreliğine direnecektir.</p>\n<p>İçeriden bir kalıp (iskelet) oluşturmak ve idrarın dikişlerin\narasından batına sızmasını (Ürinoma) engellemek için böbrekten mesaneye\nkadar uzanan bir Double-J (DJ) Stent takılır.</p>\n<p>Dışarıya da (retroperitona) ufak bir dren konur.</p>\n<p>DJ stent genellikle ameliyattan 4-6 hafta sonra poliklinik\nşartlarında kısa bir sistoskopi işlemiyle çekilir.</p>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<p>Soru: \"Ameliyatta UPJ'yi kestin, ancak darlığın üreter boyunca çok\nuzun olduğunu (örn: 3-4 cm) fark ettin. Hastalıklı kısmı tamamen kesip\natarsan (dismembranöz yaparsan), sağlam üreter yukarıya (pelvise)\nyetişmeyecek. Bu durumda böbreği nasıl kurtarırsın?\"</p>\n<p>Cevap: \"Eğer darlık segmenti çok uzunsa ve anastomoz gergin\n(tansiyonlu) olacaksa, Anderson-Hynes (dismembranöz) tekniğinden\nvazgeçerim. Bunun yerine üreteri tamamen kesmeden, geniş renal pelvis\ndokusundan bir dil (flep) kaldırarak o dar üreterin üzerine yama\nyaparım. Buna duruma göre Spiral Flep, Y-V Plasti veya Foley Y-Plasti\ngibi <em>Non-Dismembranöz Flep Teknikleri</em> adı verilir.\"</p>\n<p>Soru: \"Ameliyatta yanlışlıkla Çaprazlayan Damarı (Crossing Vessel)\nkestin veya bağladın. Alt pol iskemisi gelişti. Hastanın ilerleyen\nyıllarında karşısına çıkacak en tehlikeli sistemik komplikasyon\nnedir?\"</p>\n<p>Cevap: \"Kesinlikle Şiddetli Hipertansiyondur. Alt pol iskemik\nkaldığında (oksijensizleştiğinde), oradaki Jukstaglomerüler aparat\n'Vücutta kan basıncı düştü' sanarak kana çılgınca Renin pompalamaya\nbaşlar. Bu Renin-Anjiyotensin-Aldosteron (RAAS) aktivasyonu, çocukta\nilaca dirençli ve tehlikeli bir renovasküler hipertansiyona neden\nolur.\"</p>\n<p>Soru: \"Ameliyat çok başarılı geçti, hastayı servise aldın. 2. gün\nbatın dreninden sapsarı, berrak ve yüksek miktarda (günde 300 cc) sıvı\ngelmeye başladı. Ne düşünürsün ve tanıyı nasıl kesinleştirirsin?\"</p>\n<p>Cevap: \"Attığım dikişlerin (anastomozun) arasından idrar sızıyor\ndemektir. Buna Ürinoma / İdrar Kaçağı denir. Kesinleştirmek için drenden\ngelen sıvıdan örnek alıp Biyokimya'ya gönderir ve Kreatinin seviyesine\nbakarım. Drendeki kreatinin, hastanın kan kreatinininden kat kat\nyüksekse, bu sıvı kesinlikle idrardır. Genellikle telaş yapmam, dreni ve\nsondayı içeride tutarak sistemdeki basıncı düşürürüm; dikişler birkaç\ngün içinde kendiliğinden kapanır.\"</p>\n"}, {"id": "12.5", "t": "Vezikoüreteral Reflü (VUR) - Patofizyoloji ve Derecelendirme", "h": "<h3 id=\"a-kusursuz-sübap-anti-reflü-mekanizması-nasıl-bozulur\">A.\nKUSURSUZ SÜBAP: Anti-Reflü Mekanizması Nasıl Bozulur?</h3>\n<p>Sağlıklı bir insanda, sen amuda kalkıp idrar yapsan bile bir damla\nidrar böbreğe geri kaçmaz. Çünkü evrim, üreterin mesaneye girdiği yer\nolan Üreterovezikal Bileşkeye (UVJ) kusursuz bir çekvalf (sübap)\nmekanizması yerleştirmiştir.</p>\n<p>5:1 Kuralı (Tünel Boyu): Üreter mesaneye dik bir açıyla girmez;\nmesane kasının (detrüsör) içine eğik (oblik) bir açıyla dalar ve\nmukozanın altında uzun bir \"Submukozal Tünel\" oluşturarak ilerler.\nNormalde bu tünelin uzunluğunun, üreterin çapına oranı en az 5:1\nolmalıdır.</p>\n<p>Fizyolojik Kilitlenme: Mesane idrar yapmak için kasıldığında (içeride\nbasınç arttığında), tünelin üzerindeki mukoza bir kapak (flap-valve)\ngibi üreteri mesane duvarına doğru ezer ve kanalı kapatır. İdrar sadece\ndışarı (üretraya) çıkabilir.</p>\n<p>Primer VUR (Kısa Tünel): VUR hastalarında embriyolojik bir hata\nsonucu üreter mesaneye çok yanal (lateral ektopik) ve çok dik bir açıyla\ngirer. Submukozal tünel yok denecek kadar kısadır (Örn: 1:1 oranı).\nMesane kasıldığında kapak kapanamaz, kanal ağzına kadar açık kalır ve\nidrar böbreğe geri şutlanır.</p>\n<h3 id=\"b-altin-standart-tani-vcug-ve-5-evreli-yıkım\">B. ALTIN STANDART\nTANI: VCUG ve 5 Evreli Yıkım</h3>\n<p>VUR tanısı ultrasonla KONMAZ. Ultrason böbreği sadece o anki haliyle\n(statik) görür. Reflüyü yakalamak için idrar kesesi dolarken ve işerken\nidrarın nereye gittiğini (dinamik) görmek zorundasın.</p>\n<p>Bunun altın standardı VCUG (Voiding Sistouretrografi / İşeme\nFilmi)'dir. Çocuğa idrar sondası takılır, mesane kontrast maddeyle\n(ilaçlı su) doldurulur. Çocuk idrarını yaparken seri röntgenler çekilir.\nKılavuzlar VUR'u, kaçağın nereye kadar ulaştığına ve böbreği ne kadar\nşişirdiğine göre Uluslararası Reflü Derecelendirme Sistemine (IRSC) göre\n5 evreye ayırır:</p>\n<p>Evre I: Kontrast madde sadece üretere (kanala) kadar kaçar. Böbrek\nhavuzcuğuna (pelvise) ulaşmaz.</p>\n<p>Evre II: Kontrast madde ta böbreğe, kalikslere kadar ulaşır ancak\nkanallarda hiçbir genişleme (dilatasyon) YOKTUR.</p>\n<p>Evre III: Üreter, pelvis ve kalikslerde HAFİF/ORTA derecede genişleme\nvardır. Ancak kalikslerin o keskin uçlu (kadeh şeklindeki) forniksleri\nhenüz bozulmamıştır.</p>\n<p>Evre IV: Üreterde orta derecede genişleme ve kıvrımlaşma (kink)\nbaşlar. Böbrek içindeki kaliks uçları (forniksler) artık basınçtan\nezilmiş ve küntleşmiştir (Blunting).</p>\n<p>Evre V: En ağır tablodur. Üreter devasa bir yılan gibi kıvrımlı ve\nkalındır (Megaüreter). Böbrek kaliksleri birer balon gibi şişmiş,\nböbreğin papilla izleri tamamen yok olmuştur.</p>\n<h3 id=\"c-skar-avcisi-dmsa-sintigrafisi\">C. SKAR AVCISI: DMSA\nSintigrafisi</h3>\n<p>VCUG bize kaçağın (reflünün) derecesini söyler, ancak o kaçağın\nböbreği \"içten içe çürütüp çürütmediğini\" söyleyemez. Ateşli İYE geçiren\nbir VUR hastasında böbreğin korteksinde (parankiminde) skar (ölü doku)\nkalıp kalmadığını gösteren tek altın standart test Tek
