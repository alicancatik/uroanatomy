<style>
:root{--bg:#F4F3EF;--surface:#FFFFFF;--ink:#1B2027;--muted:#5E6872;--line:#DEDBD3;--soft:#EAE7DF;--acc:#1D5C63;--acc2:#B4532A;--ok:#1E7A4C;--okbg:#E2F2E9;--no:#B03A2E;--nobg:#F8E5E2;--fs:17px;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181D;--surface:#1B2229;--ink:#E7EAED;--muted:#9AA6B1;--line:#2B353F;--soft:#232C35;--acc:#6CC3CB;--acc2:#F0A07A;--ok:#6FD29C;--okbg:#163225;--no:#F08A7E;--nobg:#3A1E1B}}
:root[data-theme="dark"]{--bg:#13181D;--surface:#1B2229;--ink:#E7EAED;--muted:#9AA6B1;--line:#2B353F;--soft:#232C35;--acc:#6CC3CB;--acc2:#F0A07A;--ok:#6FD29C;--okbg:#163225;--no:#F08A7E;--nobg:#3A1E1B}
:root[data-theme="black"]{--bg:#000;--surface:#0E0E10;--ink:#ECEFF2;--muted:#9AA3AB;--line:#26292E;--soft:#1A1C20;--acc:#6CC3CB;--acc2:#F0A07A;--ok:#6FD29C;--okbg:#122C1E;--no:#F08A7E;--nobg:#331A17}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(64px + env(safe-area-inset-bottom,0px) + 24px)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:8px;min-height:56px;border-bottom:1px solid transparent}
header.top.sc{border-bottom-color:var(--line)}
.hb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--acc);flex:none}
.hb svg{width:22px;height:22px}
.ht{flex:1;min-width:0;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-family:"Source Serif 4",Georgia,serif;font-size:26px;font-weight:600;color:var(--acc);letter-spacing:-.01em}
.search{position:relative;margin:4px 0 12px}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--acc);font-variant-numeric:tabular-nums}
.row .tt{flex:1;min-width:0;font-weight:600;line-height:1.3}
.row .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.row .meta{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.done .num{background:var(--acc);color:var(--surface)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.pbar{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
/* reader */
.reader{font-family:"Source Serif 4",Georgia,serif;font-size:var(--fs);line-height:1.65}
.reader h1,.reader h2,.reader h3{font-family:"IBM Plex Sans",sans-serif}
.reader p{margin:.7em 0}
.reader ul,.reader ol{padding-left:1.3em}
.reader li{margin:.25em 0}
.reader strong{color:var(--ink)}
.reader table{border-collapse:collapse;font-family:"IBM Plex Sans",sans-serif;font-size:14px;min-width:100%}
.reader .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:12px 0;border:1px solid var(--line);border-radius:10px}
.reader th,.reader td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.reader th{background:var(--soft)}
.stitle{font-size:22px;font-weight:700;line-height:1.25;margin:6px 0 4px}
.skicker{font-size:13px;color:var(--acc2);font-weight:600;letter-spacing:.02em}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:13px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface))}
.note{background:color-mix(in srgb,var(--acc2) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--acc2) 35%,var(--line));border-radius:12px;padding:10px 12px;font-size:14px;margin:12px 0}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:20px 0}
.btn{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;text-align:center}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.pri small{color:color-mix(in srgb,var(--surface) 80%,transparent)}
mark{background:color-mix(in srgb,var(--acc2) 28%,transparent);color:inherit;border-radius:3px}
/* quiz */
.q{font-size:18px;line-height:1.5;margin:6px 0 14px;font-weight:500}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0;line-height:1.4}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.exp{border-left:3px solid var(--acc);padding:6px 12px;margin:12px 0;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:58px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA=[{"n": 1, "t": "Cerrahi Anatomi, Fizyoloji ve Temel Değerlendirme", "s": [{"id": "1.1", "t": "Böbrek ve Adrenal Cerrahi Anatomisi", "h": "<p>Bir üroloji asistanı olarak nefrektomiye (basit, radikal veya\nparsiyel) girdiğinde, sadece böbreği değil, etrafındaki \"mayın\ntarlalarını\" da bilmelisin.</p>\n<h3\nid=\"1-konum-ve-kritik-komşuluklar-vizit-sorusu-neyi-yaralayabilirsin\">1.\nKonum ve Kritik Komşuluklar (Vizit Sorusu: \"Neyi\nYaralayabilirsin?\")</h3>\n<p>Böbrekler retroperitonealdir (T12-L3 arası). Sağ böbrek, karaciğer\nbasısı nedeniyle soldan 1-2 cm daha aşağıdadır.</p>\n<ul>\n<li>SAĞ BÖBREK KOMŞULUKLARI (Cerrahi Riskler):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Superior: Sağ Adrenal, Karaciğer (Sağ lob).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Medial: Duodenumun 2. kısmı (İnen kıta).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ Asistan Uyarısı:</em> Sağ radikal nefrektomide diseksiyonu\nmedialde çok derinleştirirsen ve Kocher manevrası ile duodenumu ekarte\netmezsen, duodenum yaralanması yapabilirsin. Bu mortalitesi yüksek bir\nkomplikasyondur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İnferior: Hepatik fleksura (Kolon).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>SOL BÖBREK KOMŞULUKLARI (Cerrahi Riskler):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Superior: Sol Adrenal, Dalak, Mide.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Medial/Anterior: Pankreas kuyruğu (Cauda Pancreatis).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ Asistan Uyarısı:</em> Sol nefrektomide hilusu dönerken veya\nüst polü serbestlerken pankreas kuyruğu yaralanabilir. Sonuç: Pankreatik\nfistül.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>İnferior: Splenik fleksura, Jejunum.</li>\n</ul>\n<h3 id=\"2-fasyalar-ve-cerrahi-planlar\">2. Fasyalar ve Cerrahi\nPlanlar</h3>\n<p>Böbrek, cerrahın \"diseksiyon planı\" dediği yağ ve fasya katmanlarıyla\nkorunur.</p>\n<ol type=\"1\">\n<li>Pararenal Yağ (Paranefrik): En dış katman.</li>\n</ol>\n<h3 id=\"2-renal-fasya-gerota-ve-zuckerkandl\">2. Renal Fasya (Gerota ve\nZuckerkandl):</h3>\n<ul>\n<li>Anterior: Gerota Fasyası (Toldt fasyası ile komşudur).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Posterior: Zuckerkandl Fasyası (Psoas kası üzerindedir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kritik Bilgi:</em> Bu iki fasya lateralde birleşir (Laterokonal\nFasya). Superior'da birleşip diyafragmaya yapışır (Bu yüzden böbrek\nsolunumla hareket eder). Ancak İnferior'da (aşağıda) tam kapalı\ndeğildir, üreter boyunca devam eder.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Vizit Sorusu:</em> \"Perinefrik apse veya hematom neden pelvise\nkadar inebilir ama yukarı çıkmaz?\" -&gt; Çünkü fasyal plan aşağıda\naçıktır.</li>\n</ul>\n<ol type=\"1\">\n<li>Perirenal Yağ (Perinefrik): Kapsül ile fasya arasındaki yağ dokusu.\n(\"Dirty Fat\" dediğimiz yapışık yağ dokusu tümör enflamasyonunda burayı\nzorlaştırır).</li>\n</ol>\n<h3 id=\"3-renal-vasküler-anatomi-en-çok-soru-buradan-gelir\">3. Renal\nVasküler Anatomi (En Çok Soru Buradan Gelir)</h3>\n<p>Böbrekler kardiak output'un %20-25'ini alır. Kanlanma L1-L2\nseviyesindedir.</p>\n<h3 id=\"a-arterler-segmental-dağılım\">A. ARTERLER (Segmental\nDağılım)</h3>\n<ul>\n<li><p>Tek bir renal arter (%70). %30 vakada aksesuar arter (varyasyon)\ngörülür. Aksesuar arterler genelde alt pole gider ve UP darlık (crossing\nvessel) sebebi olabilir.</p></li>\n<li><p>Dallanma Sırası: Ana Renal Arter -&gt; Anterior &amp; Posterior\nDallar -&gt; Segmental Arterler (5 adet) -&gt; İnterlober -&gt; Arkuat\n-&gt; İnterlobüler.</p></li>\n<li><p><em>Önemli:</em> Renal arterler **\"End-Arter\"**dir. Yani\nkollateral (yedek) dolaşımı yoktur. Bir dalı bağlarsan, o segment\ninfarkt olur (ölür).</p></li>\n</ul>\n<h3 id=\"b-venler-sağ-ve-sol-farkı---hayati̇\">B. VENLER (Sağ ve Sol Farkı\n- HAYATİ!)</h3>\n<p>Venöz drenajda asimetri vardır. Bu cerrahi planlamayı değiştirir.</p>\n<ul>\n<li>SOL Renal Ven:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Uzundur (7-10 cm). Aortun üzerinden geçer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Drenaj: Sol Gonadal Ven (Testis/Ovaryan), Sol Adrenal Ven ve bazen\nSol Lumbar Ven buraya dökülür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Nutcracker Sendromu (Sol renal venin Aort ile SMA\narasında sıkışması) -&gt; Hematüri ve sol varikosel yapar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Sol Varikosel, sağa göre daha sıktır çünkü dik\naçıyla dökülür. (Sağda izole varikosel varsa retroperitoneal kitle/tümör\nşüphesi!)</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>SAĞ Renal Ven:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kısadır (2-4 cm). Direkt Vena Cava İnferior'a (VCİ) dökülür.\nDalsızdır (Genellikle).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ Cerrahi Risk:</em> Sağ nefrektomide manevra alanın çok\ndardır. Veni yırtarsan direkt kava yaralanması gibi kanar.</li>\n</ul>\n<h3 id=\"4-i̇ntrarenal-anatomi-ve-brodel-hattı\">4. İntrarenal Anatomi ve\nBrodel Hattı</h3>\n<p>Perkütan Nefrolitotomi (PCNL) veya Anatrofik Nefrolitotomi yapacaksan\nbunu bilmek zorundasın.</p>\n<ul>\n<li><p>Renal arter böbreğe girince Anterior (Ön) ve Posterior (Arka)\ndallara ayrılır.</p></li>\n<li><p>Anterior dal: Böbreğin ön yüzünü ve dış kenarını besler.</p></li>\n<li><p>Posterior dal: Sadece arka orta kısmı besler.</p></li>\n<li><p>Brodel Hattı (Avascular Plane): Arka konveks kenarın (lateral)\nbiraz posteriorunda, anterior ve posterior vasküler dağılımın\nbirleştiği, damarsız (avasküler) bir hattır.</p></li>\n<li><p><em>Uygulama:</em> PCNL girişleri ve böbreği boydan boya\naçtığımız ameliyatlar, kanamayı minimize etmek için bu hattan\nyapılır.</p></li>\n</ul>\n<h3 id=\"5-adrenal-sürrenal-bez-anatomisi\">5. Adrenal (Sürrenal) Bez\nAnatomisi</h3>\n<p>Böbreğin şapkasıdır ama cerrahisi ayrı bir sanattır.</p>\n<ul>\n<li><p>Şekil: Sağ (Piramit/Üçgen), Sol (Yarımay/Semilunar).</p></li>\n<li><p>Kanlanma (3 Arter, 1 Ven Kuralı):</p></li>\n</ul>\n<ol type=\"1\">\n<li>Arterler: Çok zengindir.</li>\n</ol>\n<ul>\n<li>A. Suprarenalis Superior (İnferior Frenik Arterden gelir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>A. Suprarenalis Media (Direkt Aorttan gelir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>A. Suprarenalis İnferior (Renal Arterden gelir).</li>\n</ul>\n<ol type=\"1\">\n<li>Venler (Kritik Fark!): Her bezin sadece TEK ana veni vardır.</li>\n</ol>\n<ul>\n<li>Sağ Adrenal Ven: Çok kısadır, direkt ve arkadan Vena Cava'ya\ndökülür. (Adrenalektomide en tehlikeli adım bu veni bağlamaktır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sol Adrenal Ven: Daha uzundur, Sol Renal Vene dökülür.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Radikal nefrektomide neden önce arteri, sonra veni\nbağlıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Önce veni bağlarsak, arterden kan gelmeye devam eder ama\nçıkış olmaz. Böbrek şişer (konjesyon), kanar ve tümör varsa tümör\nhücrelerinin dolaşıma saçılma riski artar. (İstisna: Tümör trombüsü\nvarsa yaklaşım değişebilir).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Sağ böbrek tümörlerinde Vena Cava tutulumu (trombüs) neden\nsoldan daha sıktır?\"</li>\n</ol>\n<ul>\n<li>Cevap: Sağ renal ven çok kısa olduğu için tümörün kavaya ulaşması\ndaha kolaydır.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Parsiyel nefrektomide sıcak iskemi ve soğuk iskemi süreleri\nsınırın nedir?\" (Campbell &amp; EAU Bilgisi)</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sıcak İskemi: İdeal olan &lt;20-25 dakika. 30 dakikadan sonra geri\ndönüşsüz nefron hasarı başlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Soğuk İskemi: Buzlu slush ile soğutulursa böbrek 3 saate kadar\ndayanabilir (Transplantasyon mantığı).</li>\n</ul>\n<h3 id=\"1-soru-aksesuar-renal-arteri-kestiğinde-ne-olur\">1. Soru:\n\"Aksesuar renal arteri kestiğinde ne olur?\"</h3>\n<ul>\n<li>Cevap: Segmental infarkt gelişir. O bölge parankimi fonksiyonunu\nkaybeder. Hipertansiyon krizi (Renin deşarjı) gelişebilir.</li>\n</ul>\n"}, {"id": "1.2", "t": "Üreter ve Mesane Anatomisi", "h": "<h3 id=\"a-üreter-taşın-ve-i̇drarın-yolu\">A. ÜRETER (Taşın ve İdrarın\nYolu)</h3>\n<p>Üreterler 25-30 cm uzunluğunda, 3-4 mm çapında kaslı tüplerdir.\nRetroperitoneal başlar, pelviste sonlanır.</p>\n<h3 id=\"1-anatomik-seyir-ve-bölgeler\">1. Anatomik Seyir ve Bölgeler</h3>\n<p>Üreteri cerrahi ve radyolojik olarak 3 parçaya ayırırız:</p>\n<ul>\n<li><p>Abdominal (Üst): UPJ'den İliak damar çaprazına kadar.</p></li>\n<li><p>Pelvik (Orta): İliak damarlardan mesaneye kadar.</p></li>\n<li><p>İntramural (Alt): Mesane duvarı içindeki kısım (En dar\nyer).</p></li>\n</ul>\n<h3\nid=\"2-fizyolojik-darlıklar-taşların-takıldığı-yerler---sınav-sorusu\">2.\nFizyolojik Darlıklar (Taşların Takıldığı Yerler - Sınav Sorusu!)</h3>\n<p>Taş düşüren bir hastada BT'de bakacağın ilk 3 nokta:</p>\n<ol type=\"1\">\n<li><p>Üreteropelvik Bileşke (UPJ): Renal pelvisin üretere döndüğü\nyer.</p></li>\n<li><p>İliak Damar Çaprazı: Üreter, İliak arterlerin (genellikle\nBifurkasyonun hemen üzerinden, Common İliak'tan) üzerinden atlar. Burası\narkadan bası yeridir.</p></li>\n<li><p>Üreterovezikal Bileşke (UVJ): Mesaneye giriş yeri. En dar\nkısımdır.</p></li>\n</ol>\n<h3 id=\"3-üreter-kanlanması-cerrahi-i̇çin-en-kritik-bilgi\">3. Üreter\nKanlanması (Cerrahi İçin En Kritik Bilgi)</h3>\n<p>Üreterin kendi ana damarı yoktur. Etraftan dal alır. Bu yüzden\ncerrahide \"Adventisyayı soyma!\" kuralı vardır.</p>\n<ul>\n<li>Abdominal Kısım: Kanlanma MEDİAL'den gelir (Renal arter, Aort,\nGonadal arter).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi Kural:</em> Üst üreter cerrahisinde diseksiyonu\nLateralden yaparsın ki medialdeki damarları bozma.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Pelvik Kısım: Kanlanma LATERAL'den gelir (İnternal iliak, Vezikal\narterler).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi Kural:</em> Alt üreter cerrahisinde (ör. Radikal\nSistektomi) diseksiyonu Medialden yaparsın.</li>\n</ul>\n<h3 id=\"b-mesane-reservuar\">B. MESANE (Reservuar)</h3>\n<p>Mesane, pelvis minor içinde, pubis simfizi arkasında yer alır.\nDolduğunda glob vesicale vererek batına yükselir (Sistostomi için\ngüvenli alan yaratır).</p>\n<h3 id=\"1-yapısal-bölümler\">1. Yapısal Bölümler</h3>\n<ul>\n<li><p>Apex: Üst uç. Urachus (Median Umbilikal Ligaman) ile göbeğe\ntutunur.</p></li>\n<li><p>Fundus/Taban: Arka alt yüz. Erkekte rektum/seminal veziküller,\nkadında vajina/uterus ile komşudur.</p></li>\n<li><p>Boyun (Neck): En sabit kısımdır. Puboprostatik (erkek) veya\nPubovezikal (kadın) ligamanlarla pubise asılıdır.</p></li>\n</ul>\n<h3 id=\"2-trigon-özel-bölge\">2. Trigon (Özel Bölge)</h3>\n<ul>\n<li><p>İki üreter orifisi ve mesane boynu arasındaki üçgendir.</p></li>\n<li><p>Farkı: Mesanenin geri kalanı (Endoderm) aksine, Trigon Mezonefrik\nkanal kökenlidir.</p></li>\n<li><p><em>Özellik:</em> Mukozası düzdür, ruga (kıvrım) yapmaz. Kas\ntabakası detrusor ile kaynaşmıştır ama ayrı bir inervasyonu\nvardır.</p></li>\n</ul>\n<h3 id=\"3-mesane-duvar-katmanları\">3. Mesane Duvar Katmanları</h3>\n<ol type=\"1\">\n<li><p>Mukoza (Ürotelyum): Değişici epitel. İdrar geçirmezdir.\nKanserlerin %90'ı buradan çıkar (TCC).</p></li>\n<li><p>Submukoza: Lamina propria. (T1 evrelemesi buraya invazyonu\ngösterir).</p></li>\n<li><p>Muskularis (Detrusor): 3 katmanlı (İç-Dış boyuna, Orta sirküler).\nBu ağ yapısı mesanenin her yöne kasılarak boşalmasını sağlar.</p></li>\n<li><p>Serosa/Adventisya: Mesanenin sadece üst kısmı (Dome) peritonla\nörtülüdür (Serosa). Geri kalanı Adventisyadır.</p></li>\n</ol>\n<ul>\n<li><em>Vizit Notu:</em> Peritonla örtülü olduğu için mesane kubbe\nyaralanmalarında idrar batına akar (İntraperitoneal Rüptür -&gt; Cerrahi\ngerekir). Boyun yaralanmalarında idrar pelvise sızar (Ekstraperitoneal\nRüptür -&gt; Sonda ile takip edilebilir).</li>\n</ul>\n<h3 id=\"c-vaskülari̇zasyon-ve-lenfati̇kler-onkoloji-temeli\">C.\nVASKÜLARİZASYON VE LENFATİKLER (Onkoloji Temeli)</h3>\n<p>Radikal Sistektomi yaparken neyi bağlayıp neyi çıkaracağını\nbelirleyen anatomi budur.</p>\n<h3 id=\"1-arterler-hepsi-i̇nternal-i̇liak-arterin-anterior-dalından\">1.\nArterler (Hepsi İnternal İliak Arterin Anterior Dalından)</h3>\n<ul>\n<li><p>Superior Vezikal Arter: Umbilikal arterin açık kalan kısmıdır.\nMesanenin üstünü besler.</p></li>\n<li><p>İnferior Vezikal Arter: Mesane tabanı, prostat ve seminal\nvezikülleri besler. (Kadında karşılığı Vajinal Arterdir).</p></li>\n</ul>\n<h3 id=\"2-venler-santorini-pleksusu\">2. Venler (Santorini Pleksusu)</h3>\n<ul>\n<li><p>Mesane ve prostat venleri, Santorini (Dorsal Venöz) Pleksusuna\ndökülür.</p></li>\n<li><p><em>Cerrahi:</em> Radikal prostatektomi/sistektomide en çok\nkanayan yer burasıdır.</p></li>\n</ul>\n<h3 id=\"3-lenfatik-drenaj-eau-kılavuzu---plnd-sınırları\">3. Lenfatik\nDrenaj (EAU Kılavuzu - PLND Sınırları)</h3>\n<p>Mesane kanseri lenfojendir. Drenaj sırası:</p>\n<ol type=\"1\">\n<li><p>Obturator ve Eksternal İliak (İlk istasyon).</p></li>\n<li><p>İnternal İliak (Hipogastrik) ve Presakral.</p></li>\n<li><p>Common İliak.</p></li>\n</ol>\n<ul>\n<li><p><em>Standart PLND:</em> İliak bifurkasyonun altına\nkadar.</p></li>\n<li><p><em>Genişletilmiş (Extended) PLND:</em> Aort bifurkasyonuna veya\nİMA (İnferior Mezenterik Arter) hizasına kadar çıkılması önerilir (Daha\niyi sağkalım).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Kılçık Sorular)</p>\n<ol type=\"1\">\n<li>Soru: \"Kadın doğum uzmanı histerektomi yaparken üreteri\nkesti/bağladı. Nerede ve neden?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Water under the bridge\" (Köprünün altındaki su). Uterin\narter (köprü), üreterin (su) üzerinden geçer. Uterin arteri bağlarken\nhemen altındaki üreter yanlışlıkla bağlanır.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Vezikoüreteral Reflü (VUR) neden her çocukta olmuyor? Koruyan\nmekanizma ne?\"</li>\n</ol>\n<ul>\n<li>Cevap: Üreter mesaneye girerken submukozal tünel (Waldeyer kılıfı\niçinde) boyunca ilerler. Bu tünelin uzunluğunun üreter çapına oranı 5:1\nolmalıdır. Mesane dolarken detrusor bu tüneli sıkar ve geri kaçışı\n(reflüyü) önler. Tünel kısaysa reflü olur.</li>\n</ul>\n<h3\nid=\"1-soru-sistektomide-hangi-siniri-korumaya-çalışıyoruz-ve-nerede\">1.\nSoru: \"Sistektomide hangi siniri korumaya çalışıyoruz ve nerede?\"</h3>\n<ul>\n<li>Cevap: Kavernöz sinirler (Ereksiyonu sağlayan nörovasküler demet).\nMesane boynu ve prostatın posterolateralinde (saat 5 ve 7 hizasında)\nseyreder.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Urachus artığı (median umbilikal ligaman) neden sistektomide\nçıkarılmalı?\"</li>\n</ol>\n<ul>\n<li>Cevap: Urachal Adenokarsinom riski nedeniyle. Bu tümörler mesane\nkubbesinden (dome) köken alır ve kötü prognozludur.</li>\n</ul>\n"}, {"id": "1.3", "t": "Prostat, Seminal Vezikül ve Üretra Anatomisi", "h": "<h3 id=\"a-prostat-mcneali̇n-zonal-anatomi̇si̇-kutsal-harita\">A. PROSTAT:\nMCNEAL'İN ZONAL ANATOMİSİ (Kutsal Harita)</h3>\n<p>Eskiden prostat loblara ayrılırdı, şimdi McNeal'in tanımladığı\n\"Zon\"lara göre konuşuyoruz. Bu ayrım hastalıkların yerleşimi için\nkritiktir.</p>\n<h3 id=\"1-periferal-zon-70-hacim\">1. Periferal Zon (%70 Hacim):</h3>\n<ul>\n<li>Prostatın posterolateral kısmıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik Önem: Prostat kanserlerinin %70-75'i buradan çıkar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Vizit Notu:</em> Rektal Tuşe (DRE) ile parmağının hissettiği yer\nburasıdır. Bu yüzden DRE tarama için değerlidir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi:</em> Radikal prostatektomide çıkardığımız ana kitledir,\nkapsül ile sınırlıdır.</li>\n</ul>\n<h3 id=\"1-transizyonel-geçiş-zon-5-10-hacim\">1. Transizyonel (Geçiş) Zon\n(%5-10 Hacim):</h3>\n<ul>\n<li>Üretrayı (prostatik üretra) çevreleyen küçük kısımdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Klinik Önem: BPH (Benign Prostat Hiperplazisi) sadece buradan\nkaynaklanır!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Mekanizma:</em> BPH büyüdükçe Periferal Zonu dışa doğru iter ve\nsıkıştırır. Bu sıkışmış dokuya \"Cerrahi Kapsül\" denir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi:</em> Açık prostatektomi (Millin/Freyer) veya TUR-P\nyaparken, parmağınla veya koterle sıyırdığın plan, bu \"Cerrahi Kapsül\"\nile Adenom (Büyümüş Transizyonel Zon) arasındadır.</li>\n</ul>\n<h3 id=\"1-santral-zon-25-hacim\">1. Santral Zon (%25 Hacim):</h3>\n<ul>\n<li>Ejakülatör kanalları çevreleyen, tabana (base) yakın kısımdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kanser veya BPH gelişimi çok nadirdir (%1-5). Buradaki kanserler\nagresiftir.</li>\n</ul>\n<h3 id=\"1-anterior-fibromusküler-stroma\">1. Anterior Fibromusküler\nStroma:</h3>\n<ul>\n<li>Bez (glandüler) yapısı içermez. Sadece kas ve bağ dokusudur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Prostatın ön yüzünü kaplar. Kanser çıkmaz, sadece invazyon\nolur.</li>\n</ul>\n<h3 id=\"b-prostatin-fasya-ve-komşuluklari-radikal-cerrahi-i̇çin\">B.\nPROSTATIN FASYA VE KOMŞULUKLARI (Radikal Cerrahi İçin)</h3>\n<p>Radikal Prostatektomi (Açık/Robotik) yaparken 3 kritik yapıya dikkat\nedersin:</p>\n<h3 id=\"1-denonvilliers-fasyası-rektoprostatik-fasya\">1. Denonvilliers\nFasyası (Rektoprostatik Fasya):</h3>\n<ul>\n<li>Prostatın arkasında, Rektum ile Prostat arasındadır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi:</em> Bu fasya rektumu korur. Eğer kanser arkaya\ntaşmışsa (T3b), bu fasyayı da çıkarman gerekir ama rektumu delmemeye\n(Rektal Yaralanma) çok dikkat etmelisin.</li>\n</ul>\n<h3 id=\"1-endopelvik-fasya-ve-puboprostatik-ligamanlar\">1. Endopelvik\nFasya ve Puboprostatik Ligamanlar:</h3>\n<ul>\n<li>Prostatı yanlardan pelvise asar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi:</em> Robotikte önce bu fasyayı açarsın ki prostat\nserbestleşsin (Drop down).</li>\n</ul>\n<h3 id=\"1-nörovasküler-demet-walshın-hediyesi\">1. Nörovasküler Demet\n(Walsh'ın Hediyesi):</h3>\n<ul>\n<li>Ereksiyonu sağlayan kavernöz sinirler, prostatın posterolateralinde\n(Saat 5 ve 7 hizasında) seyreder.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Sinir Koruyucu (Nerve-Sparing) Cerrahi:</em> Bu demeti prostat\nkapsülünden nazikçe ayırarak ereksiyonu korumayı hedefleriz.</li>\n</ul>\n<h3 id=\"c-semi̇nal-vezi̇küller-ve-ejakülatör-kanallar\">C. SEMİNAL\nVEZİKÜLLER VE EJAKÜLATÖR KANALLAR</h3>\n<ul>\n<li><p>Mesane tabanının arkasında, prostatın üzerinde \"tavşan kulağı\"\ngibi dururlar.</p></li>\n<li><p>Görev: Semen hacminin %60-70'ini (Fruktozdan zengin sıvı)\nüretirler. Sperm deposu DEĞİLDİR (Depo: Ampulla ve Epididim).</p></li>\n<li><p>Vasa Deferens: Testisten gelen sperm kanalı, seminal vezikül ile\nbirleşerek Ejakülatör Kanalı oluşturur.</p></li>\n<li><p><em>Anatomik Landmark:</em> Ejakülatör kanallar prostatın içinden\ngeçer ve Verumontanum'a açılır.</p></li>\n</ul>\n<p>D. ERKEK ÜRETRA ANATOMİSİ (Sonda Takamayınca Çağırılan Asistanın\nBilmesi Gerekenler)</p>\n<p>Erkek üretrası yaklaşık 18-20 cm'dir ve \"S\" şeklinde kıvrımlıdır. 4\nbölüme ayrılır:</p>\n<h3 id=\"1-posteri̇or-üretra-pelvis-i̇çindeki-kısım\">1. POSTERİOR ÜRETRA\n(Pelvis İçindeki Kısım)</h3>\n<ul>\n<li>Prostatik Üretra (3-4 cm): En geniş kısımdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Verumontanum (Seminal Colliculus): Arka duvardaki tümsektir.\nEjakülatör kanallar buraya açılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>⚠️ ASİSTAN İÇİN HAYATİ BİLGİ:</em> TUR-P yaparken Verumontanum\nsenin deniz fenerindir. Onun hizasının (distalinin) altına inersen\nEksternal Sfinkteri kesersin ve hasta hayatı boyunca idrar kaçırır!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Membranöz Üretra (1-2 cm): Ürogenital diyafram (kas tabanı) içinden\ngeçer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Özellik: Üretra'nın en dar, en az esneyen ve en sabit kısmıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Travma:</em> Pelvik kırıklarda en çok kopan yer burasıdır\n(Posterior Üretra Yaralanması).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eksternal Sfinkter buradadır (İstemli idrar tutma).</li>\n</ul>\n<h3 id=\"2-anteri̇or-üretra-penis-i̇çindeki-kısım\">2. ANTERİOR ÜRETRA\n(Penis İçindeki Kısım)</h3>\n<ul>\n<li>Bulbar Üretra: Perine bölgesindedir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Travma:</em> \"Apış arası düşmelerde\" (Straddle injury -\nbisiklet/bahçe çiti) ezilen kısımdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Cowper bezleri buraya açılır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Penil (Pendulöz) Üretra: Penisin sarkan kısmındadır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Fossa Navicularis: Dış deliğin (Meatus) hemen arkasındaki\ngenişlemedir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<h3 id=\"1-soru-tur-p-yaparken-sfinkteri-koruduğunu-nasıl-anlarsın\">1.\nSoru: \"TUR-P yaparken sfinkteri koruduğunu nasıl anlarsın?\"</h3>\n<ul>\n<li>Cevap: \"Verumontanum'un distaline (aşağısına) rezeksiyon yapmam.\nVeru, sfinkterin hemen proksimalindedir (yukarısındadır).\"</li>\n</ul>\n<h3 id=\"1-soru-sondanın-balonu-nerede-şişmeli\">1. Soru: \"Sondanın balonu\nnerede şişmeli?\"</h3>\n<ul>\n<li>Cevap: \"Mesane içinde. Eğer prostatik üretrada şişirilirse prostat\nkanar, şiddetli ağrı olur ve sfinkter spazmı/hasarı gelişebilir. İdrar\ngelmeden balon şişirilmez.\"</li>\n</ul>\n<h3\nid=\"1-soru-neden-bphda-cerrahi-kapsül-oluşur-ama-kanserde-oluşmaz\">1.\nSoru: \"Neden BPH'da 'Cerrahi Kapsül' oluşur ama Kanserde oluşmaz?\"</h3>\n<ul>\n<li>Cevap: BPH (Transizyonel zon) nodüler büyür ve periferal dokuyu\nezerek yalancı bir kapsül oluşturur. Kanser (Periferal zon) ise\ninfiltratif büyür (dokunun içine işler), iterek büyümez.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Radikal Prostatektomide apikal diseksiyon (prostatın alt ucu)\nneden en zor kısımdır?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Santorini venöz pleksusu (aşırı kanama riski) tam\nburadadır.</p></li>\n<li><p>Eksternal sfinkter ile prostat apeksi yapışıktır; ayırmak\nmilimetrik hassasiyet gerektirir (Kontinans için).</p></li>\n<li><p>Rektum çok yakındır.</p></li>\n</ol>\n<!-- -->\n\n<ol type=\"1\">\n<li>Soru: \"Erkek hastada sonda takarken takılma hissettiğin 'askı'\nneresidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Bulbar üretra ile Membranöz üretra birleşimi. Burası 'S'\nkıvrımının en keskin olduğu yerdir ve sfinkter spazmı burayı kapatır.\nPenisi yukarı (göbeğe) doğru çekerek 'S'yi 'J' şekline getirip\ndüzleştirmek gerekir.\"</li>\n</ul>\n"}, {"id": "1.4", "t": "Penis, Skrotum ve Testis Anatomisi", "h": "<h3 id=\"a-peni̇s-anatomi̇si̇-ve-katmanlari\">A. PENİS ANATOMİSİ VE\nKATMANLARI</h3>\n<p>Penis, idrar atılımı ve kopülasyon organıdır. 3 silindirik yapıdan\noluşur:</p>\n<ol type=\"1\">\n<li><p>Corpora Cavernosa (2 adet): Dorsalde yer alır. Ereksiyonu\nsağlayan asıl yapılardır.</p></li>\n<li><p>Corpus Spongiosum (1 adet): Ventralde yer alır. İçinden üretra\ngeçer. Distalde genişleyerek Glans Penisi oluşturur.</p></li>\n</ol>\n<h3 id=\"1-fasyal-katmanlar-travma-ve-enfeksiyon-i̇çin-kritik\">1. Fasyal\nKatmanlar (Travma ve Enfeksiyon İçin Kritik)</h3>\n<p>Dıştan içe doğru:</p>\n<ul>\n<li><p>Cilt: İnce ve gevşektir.</p></li>\n<li><p>Dartos Fasyası (Yüzeyel Fasya): Cilt altı dokusudur. Skrotumdaki\nDartos kası ile devam eder.</p></li>\n<li><p>Buck Fasyası (Derin Fasya):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Üç erektil cismi (2 kavernoza + 1 spongiosum) sıkıca sarar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Derin Dorsal Ven, Arter ve Sinirler bu fasyanın <em>içinde</em>,\nTunika Albuginea'nın <em>üzerinde</em> seyreder.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Penil Fraktür veya üretra rüptüründe; eğer Buck\nfasyası sağlamsa hematom/idrar penis gövdesinde sınırlı kalır (\"Patlıcan\ndeformitesi\"). Buck yırtılırsa idrar/kan skrotuma ve perineye yayılır\n(Kelebek Tarzı Hematom).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tunika Albuginea:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kavernöz cisimleri saran çok güçlü, beyaz, esnemeyen kılıftır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Ereksiyon:</em> Kan buraya dolar, tunika esnemediği için venleri\nsıkıştırır ve kanı hapseder (Veno-oklüziv Mekanizma).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Peyronie Hastalığı:</em> Tam bu tabakada (Tunika Albuginea) plak\noluşumudur.</li>\n</ul>\n<h3 id=\"2-vaskülarizasyon-ereksiyonun-motoru\">2. Vaskülarizasyon\n(Ereksiyonun Motoru)</h3>\n<p>Penis kanlanması İnternal Pudendal Arterden gelir. 3 dala\nayrılır:</p>\n<ol type=\"1\">\n<li><p>Bulbourethral Arter: Bulbusu ve spongiosumu besler.</p></li>\n<li><p>Dorsal Arter: Glans ve cildi besler.</p></li>\n<li><p>Kavernozal (Derin) Arter: <em>En önemlisi!</em> Kavernoz\ncisimlerin tam ortasından geçer ve ereksiyon sırasında kanı sinüzoidlere\n(boşluklara) pompalar.</p></li>\n</ol>\n<h3 id=\"b-skrotum-ve-testi̇s-katmanlari-soğan-zarı-modeli\">B. SKROTUM VE\nTESTİS KATMANLARI (Soğan Zarı Modeli)</h3>\n<p>Skrotumdan testise ulaşmak için kesilen katmanlar, karın duvarı\nkatmanlarının devamıdır (İnmemiş testis cerrahisinde bu ilişkiyi bilmek\nşarttır).</p>\n<p>Ezberlemek için Mnemonic: <em>\"Some Damn Englishman Called It The\nTestis\"</em></p>\n<h3 id=\"1-skin-cilt\">1. Skin (Cilt)</h3>\n<h3 id=\"2-dartos-yüzeyel-fasya---scarpa-fasyasının-devamı\">2. Dartos\n(Yüzeyel fasya - Scarpa fasyasının devamı)</h3>\n<h3 id=\"3-external-spermatic-fascia-eksternal-oblik-kasın-fasyası\">3.\nExternal Spermatic Fascia (Eksternal Oblik kasın fasyası)</h3>\n<ol start=\"4\" type=\"1\">\n<li>Cremaster Muscle/Fascia (İnternal Oblik kas lifleri - Testisi yukarı\nçeker)</li>\n</ol>\n<h3 id=\"5-internal-spermatic-fascia-fasya-transversalisin-devamı\">5.\nInternal Spermatic Fascia (Fasya Transversalis'in devamı)</h3>\n<h3 id=\"6-tunica-vaginalis-peritonun-devamı\">6. Tunica Vaginalis\n(Peritonun devamı):</h3>\n<ul>\n<li>Parietal Yaprak: Dışta.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Viseral Yaprak: Testise yapışık.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Hidrosel, bu iki yaprak arasında sıvı\nbirikmesidir.</li>\n</ul>\n<ol type=\"1\">\n<li>Tunica Albuginea (Testisin kendi kapsülü).</li>\n</ol>\n<h3 id=\"c-testi̇s-ve-epi̇di̇di̇m\">C. TESTİS VE EPİDİDİM</h3>\n<p>Testisler skrotumda, vücut ısısından 2-3°C daha düşük ısıda çalışır\n(Spermatogenez için şart).</p>\n<h3 id=\"1-i̇ç-yapı\">1. İç Yapı</h3>\n<ul>\n<li><p>Seminifer Tübüller: Sperm üretim fabrikası. Sertoli hücreleri\nburadadır (Kan-Testis bariyeri).</p></li>\n<li><p>İnterstisyel Alan: Leydig hücreleri buradadır (Testosteron\nüretimi - LH etkisiyle).</p></li>\n<li><p>Rete Testis: Tübüllerin birleşip epididime döküldüğü ağ.</p></li>\n</ul>\n<h3 id=\"2-epididim-olgunlaşma-okulu\">2. Epididim (Olgunlaşma Okulu)</h3>\n<ul>\n<li><p>Testisin posterolateraline yapışıktır.</p></li>\n<li><p>Bölümleri: Baş (Caput), Gövde (Corpus), Kuyruk (Cauda).</p></li>\n<li><p>Spermler burada hareket yeteneği kazanır ve depolanır. Kuyruk\nkısmı Vas Deferens olarak devam eder.</p></li>\n</ul>\n<h3 id=\"3-testis-kanlanması-torsiyon-i̇çin-kritik\">3. Testis Kanlanması\n(Torsiyon İçin Kritik)</h3>\n<ul>\n<li><p>Arter: Testiküler Arter (Direkt Aorttan çıkar, L2\nseviyesinden).</p></li>\n<li><p>Ven: Pampiniform Pleksus (Sarmaşık gibi arteri sarar - Isı\ndeğişimi sağlar).</p></li>\n<li><p>Lenfatikler (ONKOLOJİ KURALI):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Testis embriyolojik olarak böbrek seviyesinden indiği için lenfleri\nRetroperitoneal Lenf Nodlarına (Para-aortic/Inter-aortocaval)\ndökülür.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>İstisna:</em> Eğer skrotal cilde invazyon varsa veya daha önce\nskrotal cerrahi geçirilmişse İnguinal Lenf Nodlarına dökülür.</li>\n</ul>\n<h3 id=\"d-spermati̇k-kordon-kordon-yapıları\">D. SPERMATİK KORDON (Kordon\nYapıları)</h3>\n<p>İnguinal kanalın içinden geçen yapıdır. Varikosel ameliyatında\nbağladığımız ve koruduğumuz yapılar buradadır.</p>\n<p>İçindekiler:</p>\n<ol type=\"1\">\n<li><p>Vas Deferens (Sperm kanalı).</p></li>\n<li><p>Testiküler Arter.</p></li>\n<li><p>Pampiniform Pleksus (Venler).</p></li>\n<li><p>Genitofemoral Sinir (Genital dalı).</p></li>\n<li><p>Lenfatikler.</p></li>\n</ol>\n<h3 id=\"6-kremasterik-arter-ve-deferensiyel-arter-yedek-kanlanma\">6.\n<em>Kremasterik Arter ve Deferensiyel Arter (Yedek kanlanma).</em></h3>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Testis tümöründe neden skrotal biyopsi yapmıyoruz, neden\nyüksek inguinal orşiektomi yapıyoruz?\"</li>\n</ol>\n<ul>\n<li>Cevap: Skrotumu kesersek lenfatik drenajı bozarız. Normalde\nretroperitoneuma giden tümör hücreleri, skrotal kesiyle inguinal lenf\nnodlarına yayılır (Evrelemeyi bozar). Kordonu internal halkadan\n(yukarıdan) bağlayıp çıkarmalıyız.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Varikosel ameliyatında testiküler arteri yanlışlıkla\nbağlarsan testis atrofiye gider mi?\"</li>\n</ol>\n<ul>\n<li>Cevap: Genellikle hayır (ama riskli). Çünkü Deferensiyel Arter\n(Vezikal arterden gelir) ve Kremasterik Arter (Epigastrik arterden\ngelir) kollateral dolaşım sağlayabilir. Ancak çocuklarda bu\nkollateraller gelişmemiştir, atrofi riski çok yüksektir!</li>\n</ul>\n<h3\nid=\"1-soru-peyronie-plağı-ve-penil-fraktür-yırtığı-hangi-tabakadadır\">1.\nSoru: \"Peyronie plağı ve Penil Fraktür yırtığı hangi tabakadadır?\"</h3>\n<ul>\n<li>Cevap: İkisi de Tunika Albuginea'dadır.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Fournier Gangreni (Nekrotizan Fasiit) hangi fasyal planlarda\nilerler?\"</li>\n</ol>\n<ul>\n<li>Cevap: Colles Fasyası (Perine), Dartos (Skrotum/Penis) ve Scarpa\n(Karın ön duvarı). Hepsi birbirinin devamıdır. Bu yüzden enfeksiyon\nperine bölgesinden göğüs duvarına kadar cilt altından\nilerleyebilir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"İnmemiş testis ameliyatında testisi skrotuma indirmemizi\nengelleyen en dirençli yapı hangisidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Genellikle spermatik damarların kısalığıdır (bazen de yapışık\nkermaster lifleri ve patent processus vaginalis).</li>\n</ul>\n"}, {"id": "1.5", "t": "Pelvik Taban ve Perine Anatomisi", "h": "<p>Pelvik tabanı bir hamak, perineyi ise bu hamağın altındaki destek\nyapıları olarak düşün.</p>\n<h3 id=\"a-pelvi̇k-di̇yafram-levator-ani-kompleksi\">A. PELVİK DİYAFRAM\n(Levator Ani Kompleksi)</h3>\n<p>Pelvis boşluğunu alttan kapatan, organları (mesane, prostat/uterus,\nrektum) yerinde tutan kas tabakasıdır.</p>\n<h3 id=\"1-levator-ani-kası-3-parçadan-oluşur\">1. Levator Ani Kası (3\nParçadan Oluşur):</h3>\n<ul>\n<li><p>M. Pubococcygeus: En büyük parçadır. Pubis'ten başlar, arkada\nkoksikse gider.</p></li>\n<li><p>M. Puborectalis (En önemlisi!): Pubis'ten başlar, rektumun\narkasından dolaşıp \"U\" şeklinde askı (sling) yapar.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Görevi:</em> Rektumu öne çeker (Anorektal açıyı daraltır) -&gt;\nFekal kontinans sağlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Görevi:</em> Üretral sfinktere destek olur -&gt; Üriner\nkontinans sağlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>M. Iliococcygeus: Yanlarda, Arcus Tendineus'tan başlar.</li>\n</ul>\n<h3 id=\"2-m-coccygeus-ischiococcygeus\">2. M. Coccygeus\n(Ischiococcygeus):</h3>\n<ul>\n<li><p>Levator ani'nin arkasında, sakrum ve koksiks arasında yelpaze\ngibidir. Pelvik tabanı arkadan kapatır.</p></li>\n<li><p><em>Klinik:</em> Pelvik Taban Düşüklüğü (Prolapsus), bu kasların\n(özellikle Pubococcygeus) zayıflaması veya doğum travması sonucu oluşur\n(Sistosel, Rektosel).</p></li>\n</ul>\n<h3 id=\"b-peri̇ne-eşkenar-dörtgen\">B. PERİNE (Eşkenar Dörtgen)</h3>\n<p>Bacakları açılmış bir hastada (Litotomi pozisyonu), simfizis pubis,\niskial tüberositler ve koksiks arasındaki eşkenar dörtgen alandır. İki\nüçgene ayrılır:</p>\n<h3 id=\"1-ürogeni̇tal-üçgen-ön-taraf\">1. ÜROGENİTAL ÜÇGEN (Ön\nTaraf):</h3>\n<p>Üretra ve vajinanın geçtiği yerdir.</p>\n<ul>\n<li><p>Perineal Membran: Bu üçgeni kapatan sert fasyadır. Derin ve\nYüzeyel poşları ayırır.</p></li>\n<li><p>Yüzeyel Perineal Poş (Cilt altı):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Penis/Klitoris kökleri (Crura ve Bulb).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>M. Ischiocavernosus: Ereksiyonda kanın geri kaçışını engeller.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>M. Bulbospongiosus: İşeme sonunda üretrayı sağar (Damlama olmasın\ndiye) ve ejakülasyonda spermi fırlatır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Derin Perineal Poş (Membranın üstü):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eksternal Üretral Sfinkter: İstemli idrar tutma kası. (Radikal\nprostatektomide koruduğumuz yapı).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Cowper Bezleri (Erkekte): Derin poştadır ama kanalı yüzeyel poşa\n(bulbar üretraya) açılır.</li>\n</ul>\n<h3 id=\"2-anal-üçgen-arka-taraf\">2. ANAL ÜÇGEN (Arka Taraf):</h3>\n<p>Ortasında anüs bulunur.</p>\n<ul>\n<li>İskioanal Fossa (Ischiorectal Fossa): Anüsün iki yanındaki yağ dolu\nboşluktur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Perianal Apse buradaki yağ dokusunda gelişir. Çok\nhızlı yayılır ve \"At nalı apse\" yapabilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Cerrahi:</em> Burayı drene ederken lateral duvarda Alcock\nKanalına (Pudendal sinir/damar paketi) dikkat etmelisin!</li>\n</ul>\n<h3 id=\"c-pudendal-si̇ni̇r-kral-sinir\">C. PUDENDAL SİNİR (Kral Sinir)</h3>\n<p>Üroloğun en iyi bilmesi gereken somatik sinirdir. İşeme, dışkılama ve\nseksüel fonksiyon (orgazm/ejakülasyon hissi) ondan sorulur.</p>\n<ul>\n<li><p>Kökler: S2-S3-S4 (<em>\"S2, 3, 4 keeps the poo off the\nfloor\"</em>).</p></li>\n<li><p>Seyri (Çok Sorulur):</p></li>\n</ul>\n<ol type=\"1\">\n<li><p>Pelvis içinden çıkar (Greater Sciatic Foramen).</p></li>\n<li><p>İskial Spine (Diken) etrafından dolanır (Pudendal Blok yeri\nburasıdır!).</p></li>\n<li><p>Tekrar içeri girer (Lesser Sciatic Foramen).</p></li>\n<li><p>İskioanal fossanın dış duvarında Alcock Kanalı içinde\nilerler.</p></li>\n</ol>\n<ul>\n<li>Dalları:</li>\n</ul>\n<ol type=\"1\">\n<li><p>İnferior Rektal Sinir: Anal sfinkter.</p></li>\n<li><p>Perineal Sinir: Skrotum/Labia cildi ve derin kaslar.</p></li>\n<li><p>Dorsal Sinir (Penis/Klitoris): Glans duyusu (Erken boşalma\ntedavisinde hedef alınan his).</p></li>\n</ol>\n<h3 id=\"d-peri̇neal-ci̇si̇m-central-tendon\">D. PERİNEAL CİSİM (Central\nTendon)</h3>\n<p>Anüs ile skrotum/vajina arasındaki fibromusküler düğümdür.</p>\n<ul>\n<li><p>Tüm perineal kaslar (Bulbospongiosus, Transverse perinei, Anal\nsfinkter) buraya yapışır.</p></li>\n<li><p><em>Klinik:</em> Doğumlarda (Episiotomi) burası kesilir.\nİyileşmezse pelvik taban çöker.</p></li>\n<li><p><em>Cerrahi:</em> Radikal Perineal Prostatektomi (Nadir yapılır)\nburadan girilerek yapılır.</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Radikal Prostatektomi sonrası hasta idrar kaçırıyor. Sorun\nhangi anatomik yapıda?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Büyük ihtimalle Rabdosfinkter (Eksternal Sfinkter) hasarı\nveya yetersizliği. Ancak posterior rekonstrüksiyon (Rocco dikişi)\nyapılmadıysa, Levator Ani desteği de azalmış olabilir.\"</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Pudendal Blok yapacaksın (örn: Prostat biyopsisi veya\nperineal ağrı için). İğneyi nereye yönlendireceksin?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Rektal tuşe ile İskial Spine (Spina Ischiadica) palpe\nedilir. Sinir, sakrospinöz ligamanın hemen arkasından, spinin\nmedialinden geçer.\"</li>\n</ul>\n<h3 id=\"1-soru-fournier-gangreni-neden-bacaklara-inmez\">1. Soru:\n\"Fournier Gangreni neden bacaklara inmez?\"</h3>\n<ul>\n<li>Cevap: Çünkü Colles Fasyası, uyluk fasyasına (Fascia Lata) sıkıca\nyapışır. Enfeksiyonu orada durdurur.</li>\n</ul>\n<h3 id=\"1-soru-i̇şeme-merkezleri-neresidir\">1. Soru: \"İşeme merkezleri\nneresidir?\"</h3>\n<ul>\n<li>Cevap:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sakral (S2-S4): Onuf Çekirdeği (Sfinkter motor nöronları buradadır).\nRefleks işeme.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Pontin (Beyin Sapı): PMC (Pontin Miksiyon Merkezi) - Barrington\nÇekirdeği. Sfinkter ve Mesane koordinasyonunu (sinerjiyi) sağlar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kortikal (Frontal Lob): Sosyal baskılama (Tuvalet gelene kadar\ntutma).</li>\n</ul>\n<h3\nid=\"1-soru-tot-transobturator-tape-ameliyatında-iğne-nereden-geçer\">1.\nSoru: \"TOT (Transobturator Tape) ameliyatında iğne nereden geçer?\"</h3>\n<ul>\n<li>Cevap: Obturator foramen ve membrandan geçer. Levator ani kasını\ndelmez (TVT deler). Bu yüzden TOT daha güvenlidir ama hipereksiyonda\n(Valsalva ile kaçırmada) TVT kadar etkili olmayabilir.</li>\n</ul>\n"}, {"id": "1.6", "t": "Renal Fizyoloji ve Elektrolit Dengesi", "h": "<p>Böbrek sadece idrar torbası doldurucusu değildir; vücudun\nkimyageridir.</p>\n<h3 id=\"a-glomerüler-fi̇ltrasyon-gfr-ve-otoregülasyon\">A. GLOMERÜLER\nFİLTRASYON (GFR) VE OTOREGÜLASYON</h3>\n<p>Böbrekler kardiak outputun %20-25’ini alır (yaklaşık 1-1.2 L/dk).</p>\n<h3 id=\"1-otoregülasyon-80-180-mmhg-arası\">1. Otoregülasyon (80-180 mmHg\nArası)</h3>\n<p>Sistolik tansiyon 80 ile 180 mmHg arasında değişse bile böbrek GFR'yi\nsabit tutar. Bunu iki mekanizma ile yapar:</p>\n<ul>\n<li><p>Miyojenik Refleks: Kan basıncı artarsa afferent arteriol kasılır\n(basıncı glomerüle yansıtmaz).</p></li>\n<li><p>Tübüluglomerüler Geri Bildirim (Macula Densa): Distal tübüle\ngelen tuz miktarı artarsa (GFR artmış demektir), Macula Densa sinyal\ngönderir ve afferent arteriolü daraltır.</p></li>\n</ul>\n<h3 id=\"2-kritik-i̇laç-etkileşimi-triple-whammy---üçlü-darbe\">2. Kritik\nİlaç Etkileşimi (Triple Whammy - Üçlü Darbe):</h3>\n<p>Bu mekanizmayı bozan ilaçları bilmelisin:</p>\n<ul>\n<li>Prostaglandinler: Afferent arteriolü GENİŞLETİR (Kan akışını\nartırır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>NSAID (Ağrı kesiciler):</em> Prostaglandini bloklar -&gt;\nAfferent daralır -&gt; Akut Böbrek Yetmezliği.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Anjiotensin II: Efferent arteriolü DARALTIR (Filtrasyon basıncını\nkorur).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>ACE İnhibitörü / ARB:</em> Efferenti gevşetir -&gt; Glomerül içi\nbasınç düşer -&gt; GFR düşer.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Asistan Notu:</em> Yaşlı, dehidrate bir hastaya (zaten böbrek\nkanlanması sınırda), NSAID (Voltaren/Arveles) yapıp bir de tansiyon\nilacını (ACEi) kesmezsen, hasta Akut Tübüler Nekroz (ATN) ile elinde\nkalır.</li>\n</ul>\n<h3 id=\"b-nefron-boyunca-taşima-diüretikler-nerede-çalışır\">B. NEFRON\nBOYUNCA TAŞIMA (Diüretikler Nerede Çalışır?)</h3>\n<p>Her segmentin bir görevi ve o görevi bloke eden bir ilacı vardır.</p>\n<h3 id=\"1-proksimal-tübül-i̇şçinin-hamalı\">1. Proksimal Tübül (İşçinin\nHamalı)</h3>\n<ul>\n<li><p>Filtre edilen suyun ve tuzun %65'i burada geri emilir.</p></li>\n<li><p>Glikoz (%100'ü), Aminoasitler ve Bikarbonat burada\nemilir.</p></li>\n<li><p><em>Klinik:</em> SGLT-2 İnhibitörleri (Dapagliflozin vb.) burada\nçalışır. Glikoz emilimini engeller, idrarla atar.</p></li>\n<li><p><em>Hasar:</em> İskemiye (şoka) en duyarlı bölgedir. ATN genelde\nburada başlar.</p></li>\n</ul>\n<h3 id=\"2-henle-kulpu-konsantrasyon-merkezi\">2. Henle Kulpu\n(Konsantrasyon Merkezi)</h3>\n<ul>\n<li><p>İnen Kol: Suya geçirgen, tuza değil. (İdrar yoğunlaşır).</p></li>\n<li><p>Çıkan Kalın Kol (HAYATİ): Suya geçirimsiz, tuza\ngeçirgen.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Na-K-2Cl Pompası: Buradaki ana motor.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Loop Diüretikleri (Furosemid/Desal) bu pompayı\nbloklar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Sonuç:</em> Na, K ve Cl atılır. Medüller yoğunluk bozulur, su\ngeri emilemez -&gt; Güçlü Diürez.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Yan Etki:</em> Hipokalemi, Hiponatremi.</li>\n</ul>\n<h3 id=\"3-distal-tübül-i̇nce-ayar\">3. Distal Tübül (İnce Ayar)</h3>\n<ul>\n<li><p>NaCl geri emilimi devam eder.</p></li>\n<li><p><em>Klinik:</em> Tiazid Diüretikleri burada çalışır.</p></li>\n<li><p><em>Önemli:</em> Kalsiyum geri emilimi Parathormon (PTH)\netkisiyle burada olur. Tiazidler kalsiyum emilimini ARTIRIR. (Bu yüzden\nkalsiyum taşı olan hastalarda taş oluşumunu önlemek için Tiazid\nveririz!).</p></li>\n</ul>\n<h3 id=\"4-toplayıcı-kanallar-son-karar-yeri\">4. Toplayıcı Kanallar (Son\nKarar Yeri)</h3>\n<ul>\n<li><p>Aldosteron: Na'yu emer, K'u atar.</p></li>\n<li><p>ADH (Vazopressin): Aquaporin kanallarını açar, Suyu\nemer.</p></li>\n<li><p><em>Klinik:</em> Spironolakton (Aldosteron antagonisti) burada\nçalışır. K tutucu diüretiktir.</p></li>\n</ul>\n<h3 id=\"c-reni̇n-anji̇otensi̇n-aldosteron-si̇stemi̇-raas\">C.\nRENİN-ANJİOTENSİN-ALDOSTERON SİSTEMİ (RAAS)</h3>\n<p>Böbreğin tansiyonu yönettiği sistemdir.</p>\n<ol type=\"1\">\n<li><p>Tansiyon düşerse veya sodyum azalırsa Jukstaglomerüler hücreler\nRenin salgılar.</p></li>\n<li><p>Renin -&gt; Anjiotensinojen'i Anjiotensin I'e çevirir.</p></li>\n<li><p>ACE (Akciğerde) -&gt; Anjiotensin I'i Anjiotensin II'ye\nçevirir.</p></li>\n</ol>\n<h3 id=\"4-anjiotensin-iinin-etkileri-4-ana-etki\">4. Anjiotensin II'nin\nEtkileri (4 Ana Etki):</h3>\n<ul>\n<li>Güçlü Vazokonstrüksiyon (Tansiyonu artırır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Aldosteron salgısı (Tuz ve su tutar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>ADH salgısı (Su tutar).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Susama hissi.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Klinik:</em> Renovasküler Hipertansiyon. Renal arter darlığında\nböbrek \"bana kan gelmiyor\" sanar, sürekli Renin basar. Tedaviye dirençli\ntansiyon olur.</li>\n</ul>\n<h3 id=\"d-post-obstrükti̇f-di̇ürez-pod---ürologların-kabusu\">D.\nPOST-OBSTRÜKTİF DİÜREZ (POD) - Ürologların Kabusu</h3>\n<p>Bilateral hidronefrozlu veya tek böbrekli obstrükte hastaya (BPH,\nTaş) sonda taktıktan veya nefrostomi açtıktan sonra saatte 500-1000 cc\nidrar gelmeye başlamasıdır.</p>\n<p>Neden Olur?</p>\n<ol type=\"1\">\n<li>Fizyolojik: Vücutta biriken fazla suyun (Volüm yükü) atılması. (Buna\ndokunma, atsın).</li>\n</ol>\n<h3 id=\"2-patolojik\">2. Patolojik:</h3>\n<ul>\n<li>Üre Yıkanması: Biriken üre ozmotik diürez yaptırır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Tübüler Hasar: Tübüller ADH'ya yanıtsızdır (Nefrojenik Diyabet\nİnsipidus benzeri tablo). Sodyum tutulamaz.</li>\n</ul>\n<p>Yönetim (Vizit Cevabı):</p>\n<ul>\n<li><p>Saatlik idrar takibi.</p></li>\n<li><p>Eğer saatlik idrar &gt; 200 ml ise veya &gt; 3000 ml/gün ise POD\nkabul et.</p></li>\n<li><p>Kural: Hastanın çıkardığı idrarın %50'sini veya %75'ini yerine\nkoy ( %5 dextroz değil, dengeli solüsyonla - SF veya Ringer).</p></li>\n<li><p>Asla %100 replasman yapma! Yaparsan diürez asla durmaz (Kısır\ndöngü). Böbreğin konsantre etmeyi tekrar öğrenmesi lazım.</p></li>\n</ul>\n<h3 id=\"e-asi̇t-baz-dengesi̇-ve-üri̇ner-di̇versi̇yonlar\">E. ASİT-BAZ DENGESİ\nVE ÜRİNER DİVERSİYONLAR</h3>\n<p>Radikal Sistektomi sonrası yapılan bağırsak mesanelerinde (İleal\nConduit veya Neobladder) görülen metabolik bozukluklar sınav\nsorusudur.</p>\n<ul>\n<li><p>İleum ve Kolon: İdrardaki Amonyum (NH4) ve Klorür (Cl)'ü geri\nemer, Bikarbonat (HCO3)'ı bağırsağa salgılar.</p></li>\n<li><p>Sonuç: Kanda Asit artar (H+), Klor artar, Bikarbonat\ndüşer.</p></li>\n<li><p>Tablo: HİPERKLOREMİK METABOLİK ASİDOZ.</p></li>\n<li><p><em>Tedavi:</em> Oral Bikarbonat desteği.</p></li>\n<li><p><em>İstisna:</em> Eğer mide (Gastrosistoplasti) kullanılırsa\nMetabolik Alkaloz olur (Asit salgıladığı için).</p></li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastanın potasyumu 6.5 mEq/L oldu (Hiperkalemi). Acil\nserviste ne yaparsın?\"</li>\n</ol>\n<ul>\n<li>Cevap:</li>\n</ul>\n<h3\nid=\"1-kalsiyum-glukonat-kalbi-korur-membran-stabilizasyonu-i̇lk-iştir\">1.\nKalsiyum Glukonat: Kalbi korur (Membran stabilizasyonu). İlk iştir!</h3>\n<ol start=\"2\" type=\"1\">\n<li><p>İnsülin + Dekstroz: Potasyumu hücre içine sokar.</p></li>\n<li><p>Beta-agonist (Ventolin): Hücre içine sokar.</p></li>\n<li><p>Loop Diüretiği (Lasix): Atılımı sağlar.</p></li>\n<li><p>Son çare Diyaliz.</p></li>\n</ol>\n<!-- -->\n\n<h3 id=\"1-soru-taş-hastasına-neden-tiazid-veriyoruz-mekanizması-ne\">1.\nSoru: \"Taş hastasına neden Tiazid veriyoruz? Mekanizması ne?\"</h3>\n<ul>\n<li>Cevap: Distal tübülde Na-Cl kanalını bloklar, hücre içi Na düşer.\nBunu dengelemek için bazolateraldeki Na-Ca pompası çalışır. Sonuçta\nlümenden (idrardan) kalsiyum emilimi artar. İdrar kalsiyumu düşer\n(Hipokalsiüri), kan kalsiyumu artar.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Post-obstrüktif diürezde neden Hipokalemi ve Hiponatremi\ngörülür?\"</li>\n</ol>\n<ul>\n<li>Cevap: Tübüler hasar nedeniyle sodyum geri emilemez (Natriürez).\nYüksek akım nedeniyle potasyum distal tübülde hızla atılır. Magnezyum da\nkaybedilir (Magnezyum düşüklüğü Potasyumun düzelmesini engeller!).</li>\n</ul>\n<h3 id=\"1-soru-oligüri-az-idrar-tanımı-nedir\">1. Soru: \"Oligüri (Az\nidrar) tanımı nedir?\"</h3>\n<ul>\n<li>Cevap: &lt; 400 ml/gün veya &lt; 0.5 ml/kg/saat.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>\"Anüri tanımı nedir?\": &lt; 100 ml/gün (Genelde tıkanıklık veya\nkortikal nekroz işaretidir).</li>\n</ul>\n<h3 id=\"1-soru-pth-böbrekte-ne-yapar\">1. Soru: \"PTH böbrekte ne\nyapar?\"</h3>\n<ul>\n<li>Cevap:</li>\n</ul>\n<ol type=\"1\">\n<li><p>Kalsiyumu geri emer (Distal tübül).</p></li>\n<li><p>Fosforu atar (Proksimal tübül - \"Fosfatürik etki\").</p></li>\n<li><p>D Vitaminini aktifleştirir (1-alfa hidroksilazı uyarır).</p></li>\n</ol>\n"}, {"id": "1.7", "t": "Üriner Sistem Radyolojisi - I (BT ve MR)", "h": "<h3 id=\"a-bi̇lgi̇sayarli-tomografi̇-bt-ve-fazlari\">A. BİLGİSAYARLI\nTOMOGRAFİ (BT) VE FAZLARI</h3>\n<p>Bir BT isterken radyoloji teknisyenine \"Ne zaman çekeceğini\" söylemek\nzorundasın. Her patolojinin yakalandığı saniye farklıdır.</p>\n<h3 id=\"1-kontrastsız-taş-protokolü\">1. Kontrastsız (Taş\nProtokolü):</h3>\n<ul>\n<li><p>Zaman: 0. saniye.</p></li>\n<li><p>Amaç: Üriner sistem taşları (Altın standart).</p></li>\n<li><p><em>Dikkat:</em> Kontrast verirsen, kontrast da beyaz görünür,\ntaş da beyaz görünür. Taşı kontrastın içinde kaybedersin\n(Maskeleme).</p></li>\n<li><p>Hounsfield Ünitesi (HU): Dokunun yoğunluk birimidir.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Su: 0 HU</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kemik: +1000 HU</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hava: -1000 HU</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Taş Sertliği: &lt;500 HU (ESWL ile kolay kırılır), &gt;1000 HU (Sert\ntaş, ESWL başarısız, RIRS/PCNL düşün).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Adrenal Adenom Ayrımı: &lt;10 HU ise %98 benign (Lipidden zengin\nadenom).</li>\n</ul>\n<h3 id=\"2-kortikomedüller-arteriyel-faz\">2. Kortikomedüller (Arteriyel)\nFaz:</h3>\n<ul>\n<li><p>Zaman: 30-40. saniye.</p></li>\n<li><p>Amaç: Arteriyel anatomi (Renal arter varyasyonları,\nanevrizmalar).</p></li>\n<li><p><em>Görüntü:</em> Korteks parlak, medulla koyu (Böbrek alacalı\ngörünür).</p></li>\n</ul>\n<h3 id=\"3-nefrografik-parankimal-faz\">3. Nefrografik (Parankimal)\nFaz:</h3>\n<ul>\n<li><p>Zaman: 80-100. saniye.</p></li>\n<li><p>Amaç: Böbrek Tümörleri (RCC) en iyi burada görülür.</p></li>\n<li><p><em>Görüntü:</em> Kontrast tüm parankime yayılmıştır (Homojen\ngri). Tümör (Genelde daha az kanlandığı için veya nekrotik olduğu için)\nparankimden farklı kontrastlanır (Enhancement).</p></li>\n</ul>\n<h3 id=\"4-ekskretuvar-pyelografik-faz\">4. Ekskretuvar (Pyelografik)\nFaz:</h3>\n<ul>\n<li><p>Zaman: 5-10. dakika.</p></li>\n<li><p>Amaç: Üst Üriner Sistem Tümörleri (TCC) ve toplayıcı sistem\nanatomisi.</p></li>\n<li><p><em>Görüntü:</em> Kontrast idrara karışmış, kalisleri ve üreteri\ndoldurmuştur. Dolum defektleri (Tümör) burada görünür.</p></li>\n</ul>\n<p>⭐ Altın Standart: BT Ürografi (CTU)</p>\n<p>Hematuri araştırmasında kullanılır. Üç fazın birleşimidir:</p>\n<ol type=\"1\">\n<li><p>Önce Kontrastsız (Taş var mı?).</p></li>\n<li><p>Sonra Kontrastlı (Nefrografik + Ekskretuvar).</p></li>\n<li><p>Split Bolus Tekniği: Tek çekimde hem parankimi hem üreteri\ngöstermeye çalışır (Radyasyon dozunu azaltmak için).</p></li>\n</ol>\n<h3 id=\"b-manyeti̇k-rezonans-görüntüleme-mr\">B. MANYETİK REZONANS\nGÖRÜNTÜLEME (MR)</h3>\n<p>Radyasyon içermez (Gebelerde ve çocuklarda güvenli). Yumuşak doku\nayrımında (Prostat, Mesane Evrelemesi) BT'den üstündür.</p>\n<h3 id=\"1-temel-sekanslar-ezberle\">1. Temel Sekanslar (Ezberle)</h3>\n<ul>\n<li><p>T1 Ağırlıklı: Su SİYAH görünür. Anatomi ve yağ dokusu için\niyidir. (Lenf nodu takibi).</p></li>\n<li><p>T2 Ağırlıklı: Su BEYAZ görünür. Patoloji (Ödem, Tümör, Kist)\ngenelde su içerdiği için parlak görünür.</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Prostat:</em> Zonal anatomi T2'de görülür. Kanser T2'de SİYAH\n(Hipointens) görünür.</li>\n</ul>\n<h3 id=\"2-difüzyon-ağırlıklı-görüntüleme-dwi-ve-adc-haritası\">2.\nDifüzyon Ağırlıklı Görüntüleme (DWI) ve ADC Haritası:</h3>\n<ul>\n<li><p>Hücresel yoğunluğu ölçer.</p></li>\n<li><p>Kanser: Hücreler çok sıkışıktır, su molekülleri hareket edemez\n(Diffüzyon Kısıtlanması).</p></li>\n<li><p><em>Görüntü:</em> DWI'da PARLAK (Ampul gibi yanar), ADC\nharitasında SİYAH görünür. Bu \"Clinically Significant\" kanser\ndemektir.</p></li>\n</ul>\n<h3 id=\"c-skorlama-ve-siniflandirma-si̇stemleri̇-ebu-sınavı\">C. SKORLAMA\nVE SINIFLANDIRMA SİSTEMLERİ (EBU Sınavı)</h3>\n<p>Radyoloji raporunda sadece \"Kitle var\" yazmaz, bir kod yazar. O kodu\nsen yorumlarsın.</p>\n<h3 id=\"1-bosniak-siniflamasi-böbrek-kistleri---2019-güncellemesi\">1.\nBOSNIAK SINIFLAMASI (Böbrek Kistleri - 2019 Güncellemesi)</h3>\n<p>BT veya MR ile yapılır. Kistin kanserleşme riskini belirtir.</p>\n<ul>\n<li><p>Bosniak I: Basit kist. İnce duvar, septa yok, kalsifikasyon yok.\n(Risk: %0 -&gt; Takip gerekmez).</p></li>\n<li><p>Bosniak II: İnce septa (&lt;1mm), ince kalsifikasyon. (Risk: ~%0\n-&gt; Takip gerekmez).</p></li>\n<li><p>Bosniak IIF (Follow-up): Çok sayıda ince septa, minimal\nkalınlaşma. (Risk: %5 -&gt; 6 ay sonra kontrol).</p></li>\n<li><p>Bosniak III: Kalın, düzensiz septa veya duvar. Kontrast tutulumu\n(Enhancement) VAR. (Risk: %50 -&gt; Cerrahi/Biopsi).</p></li>\n<li><p>Bosniak IV: Kistin içinde solid (yumuşak doku) komponent var.\n(Risk: %90 -&gt; Bu Kist değil, Kistik RCC'dir -&gt; Cerrahi).</p></li>\n</ul>\n<h3 id=\"2-pi-rads-prostat-mr\">2. PI-RADS (Prostat MR)</h3>\n<p>Multiparametrik MR (mpMRI) ile prostat kanseri olasılığı. (v2.1).</p>\n<ul>\n<li><p>PI-RADS 1-2: Çok düşük risk. (Biyopsi gerekmez).</p></li>\n<li><p>PI-RADS 3: Ara risk. (PSA dansitesi ve aile öyküsüne göre karar\nver).</p></li>\n<li><p>PI-RADS 4-5: Yüksek risk. (Mutlaka Füzyon Biyopsi).</p></li>\n<li><p><em>Kural:</em> Periferal Zonda (PZ) belirleyici olan\nDWI/ADC'dir. Transizyonel Zonda (TZ) belirleyici olan T2\nsekansıdır.</p></li>\n</ul>\n<h3 id=\"3-vi-rads-mesane-mr\">3. VI-RADS (Mesane MR)</h3>\n<p>Mesane kanserinin kasa invaze olup olmadığını (T2 mi, T1 mi?) anlamak\niçin kullanılır. TUR-B öncesi cerrahi planı (Radikal vs Organ koruyucu)\ndeğiştirir.</p>\n<h3 id=\"d-kontrast-madde-nefropati̇si̇-cin\">D. KONTRAST MADDE NEFROPATİSİ\n(CIN)</h3>\n<p>İyotlu kontrast madde (BT) nefrotoksiktir. Gadolinyum (MR) daha az\ntoksiktir ama masum değildir.</p>\n<ul>\n<li><p>Risk Grubu: GFR &lt; 45 ml/dk, Diyabetik Nefropati,\nDehidratasyon.</p></li>\n<li><p>Önlem (Profilaksi):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>En etkili yöntem: HİDRASYON! (İşlemden 12 saat önce ve sonra SF\ninfüzyonu).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>N-Asetil Sistein (Oral): Kanıt düzeyi tartışmalı ama zararsız.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Metformin kullanan hastalarda işlem günü ve sonrası 48 saat ilaç\nkesilmeli (Laktik asidoz riski).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>NSF (Nefrojenik Sistemik Fibrozis): GFR &lt; 30 olan hastalarda MR\nkontrastı (Gadolinyum) verilirse ciltte ve iç organlarda ölümcül\nfibrozis yapabilir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Radyoloji Tuzakları)</p>\n<ol type=\"1\">\n<li>Soru: \"Pelvik bölgede gördüğün o parlaklık taş mı yoksa flebolit\n(Ven taşı) mi? Nasıl ayırırsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Flebolitlerin ortası genellikle radyolüsendir (deliktir),\n'Kuyruklu Yıldız' (Comet Tail) işareti verirler (Venin devamı görülür).\nÜreter taşı ise dokuyla çevrilidir (Tissue Rim Sign - Üreter\nödemi).\"</li>\n</ul>\n<h3 id=\"1-soru-adrenal-kitlede-washout-yıkanma-ne-demek\">1. Soru:\n\"Adrenal kitlede 'Washout' (Yıkanma) ne demek?\"</h3>\n<ul>\n<li>Cevap: Adrenal adenomlar (benign) kontrastı hızlı alır ve hızlı\nbırakır. Metastazlar ise kontrastı tutar, bırakmaz.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Absolute Washout:</em> &gt; %60 ise Adenomdur.</li>\n</ul>\n<h3 id=\"1-soru-dual-enerji-bt-dect-taş-hastasında-ne-işe-yarar\">1. Soru:\n\"Dual Enerji BT (DECT) taş hastasında ne işe yarar?\"</h3>\n<ul>\n<li>Cevap: Taşın atom numarasını (Z) hesaplar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Ürik Asit Taşı: Turuncu/Kırmızı görünür. (Opere etme,\nOraliz/Alkalinizasyon ver erisin).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kalsiyum Taşı: Mavi görünür. (Erimez, kırılması lazım).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Renal kolik (Taş) şüphesi olan hamile hastada ilk tercih\ngörüntüleme nedir?\"</li>\n</ol>\n<ul>\n<li><p>Cevap: Ultrasonografi (USG). Yetmezse MR Ürografi\n(Gadolinyumsuz). Düşük doz BT son çaredir.</p></li>\n<li></li>\n</ul>\n"}, {"id": "1.8", "t": "Üriner Sistem Radyolojisi - II (Nükleer TIP ve USG)", "h": "<h3 id=\"a-ultrasonografi̇-usg---üroloğun-stetoskopu\">A. ULTRASONOGRAFİ\n(USG) - Üroloğun Stetoskopu</h3>\n<p>Radyasyon içermez, yatak başında yapılır.</p>\n<h3 id=\"1-renal-usg-ve-ekojenite\">1. Renal USG ve Ekojenite</h3>\n<ul>\n<li><p>Böbrek parankimi (korteks), karaciğerden daha koyu (hipoekoik)\ngörünmelidir.</p></li>\n<li><p>Eğer böbrek karaciğerden daha parlak (hiperekoik) ise -&gt;\nMedikal Renal Hastalık (KBY, Nefrit) var demektir. Grade 1-4 arası\nevrelenir.</p></li>\n<li><p>Hidronefroz Derecelendirmesi (SFU Evrelemesi - Society for Fetal\nUrology):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 1: Sadece pelvis geniş (Split).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 2: Pelvis + birkaç kalis geniş.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 3: Tüm kalisler geniş, parankim normal.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 4: Parankim incelmiş (Atrofi).</li>\n</ul>\n<h3 id=\"2-doppler-usg-ve-resistive-index-ri\">2. Doppler USG ve\n\"Resistive Index\" (RI)</h3>\n<ul>\n<li><p>Böbrek damar direnci ölçülür.</p></li>\n<li><p>Normal RI: &lt; 0.70.</p></li>\n<li><p>RI &gt; 0.70 Anlamı:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Akut Obstrüksiyon: Taş düşüren hastada BT'de taş görünmese bile,\nağrıyan tarafta RI &gt; 0.70 ise taş vardır! (Ödem direnci\nartırır).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Rejeksiyon: Transplant böbrekte artarsa red (rejeksiyon)\nşüphesi.</li>\n</ul>\n<h3 id=\"3-transrektal-usg-trus\">3. Transrektal USG (TRUS)</h3>\n<ul>\n<li><p>Prostat hacmini en doğru ölçen yöntemdir.</p></li>\n<li><p>Formül: Yükseklik x Genişlik x Uzunluk x 0.52 (Elipsoid\nFormülü).</p></li>\n<li><p><em>Biyopsi:</em> Prostat kanseri tanısında standart\nrehberdir.</p></li>\n</ul>\n<h3 id=\"4-skrotal-usg-renkli-doppler\">4. Skrotal USG (Renkli\nDoppler)</h3>\n<ul>\n<li>Akut Skrotum Ayrımı (Acil Servis Klasiği):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Torsiyon: Testis kanlanması YOK veya AZALMIŞ.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Epididimo-orşit: Testis ve epididim kanlanması ARTMIŞ (Hiperemi -\n\"Yangın yeri\").</li>\n</ul>\n<h3 id=\"b-nükleer-tip-si̇nti̇grafi̇---alfabe-çorbası\">B. NÜKLEER TIP\n(SİNTİGRAFİ) - \"Alfabe Çorbası\"</h3>\n<p>Asistanların en çok karıştırdığı 3 ajan: DTPA, MAG3, DMSA.</p>\n<h3 id=\"1-dmsa-statik-görüntüleme---fotoğraf\">1. DMSA (Statik\nGörüntüleme - \"Fotoğraf\")</h3>\n<ul>\n<li><p>Mekanizma: Proksimal tübül hücrelerine <em>yapışır</em> ve orada\nkalır. Atılmaz.</p></li>\n<li><p>Ne İşe Yarar?</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Skar (İz) Tespiti: Altın standarttır. Piyelonefrit sonrası böbrekte\nhasar kaldı mı?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Diferansiyel Fonksiyon (Split Function): Sağ böbrek %40, Sol %60\nçalışıyor demek için en güvenilir testtir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Kullanım:</em> VUR (Reflü) hastasında skar takibi, Ektopik\nböbrek tanısı.</li>\n</ul>\n<h3 id=\"2-dtpa-dinamik-görüntüleme---video\">2. DTPA (Dinamik Görüntüleme\n- \"Video\")</h3>\n<ul>\n<li><p>Mekanizma: Sadece glomerülden süzülür (Filtrasyon).</p></li>\n<li><p>Ne İşe Yarar?</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Obstrüksiyon (Tıkanıklık) var mı? (UP darlık).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Dezavantajı:</em> Böbrek fonksiyonu kötüyse veya hasta\nyenidoğansa (GFR düşükse) görüntü kalitesi kötüdür.</li>\n</ul>\n<h3 id=\"3-mag3-dinamik-görüntüleme---video---terci̇h-edi̇len\">3. MAG3\n(Dinamik Görüntüleme - \"Video\") - TERCİH EDİLEN!</h3>\n<ul>\n<li><p>Mekanizma: Tübüler sekresyonla atılır.</p></li>\n<li><p>Ne İşe Yarar?</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Obstrüksiyon tanısında Altın Standarttır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Avantajı:</em> Böbrek fonksiyonu kötü olsa bile (Kreatinin\nyüksek) tübüllerden atıldığı için görüntü verir. Yenidoğanlarda DTPA\nyerine bu kullanılır.</li>\n</ul>\n<h3 id=\"c-di̇üreti̇kli̇-renogram-lasix-washout\">C. DİÜRETİKLİ RENOGRAM\n(Lasix Washout)</h3>\n<p>UP darlık şüphesi olan hastada \"Genişleme mi var, Tıkanıklık mı?\"\nsorusunun cevabıdır.</p>\n<ol type=\"1\">\n<li><p>Radyoaktif madde verilir.</p></li>\n<li><p>Böbrek dolduğunda (genelde 20. dk) Furosemid (Lasix)\nyapılır.</p></li>\n</ol>\n<h3 id=\"3-eğrilerin-yorumu-ebu-sorusu\">3. Eğrilerin Yorumu (EBU\nSorusu):</h3>\n<ul>\n<li>Eğri Hızla Düşüyor (T½ &lt; 10 dk): Obstrüksiyon YOK. (Sadece\ngenişleme var, idrar rahat akıyor).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Eğri Düşmüyor/Plato Çiziyor (T½ &gt; 20 dk): OBSTRÜKSİYON VAR.\n(Cerrahi gerekir).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Gri Alan (T½ 10-20 dk): Şüpheli. (Takip veya tekrar).</li>\n</ul>\n<h3 id=\"d-kemi̇k-si̇nti̇grafi̇si̇-ve-pet-ct-onkoloji\">D. KEMİK SİNTİGRAFİSİ\nVE PET-CT (Onkoloji)</h3>\n<h3 id=\"1-kemik-sintigrafisi-tc-99m-mdp\">1. Kemik Sintigrafisi (Tc-99m\nMDP)</h3>\n<ul>\n<li><p>Prostat ve Meme kanseri gibi \"Osteoblastik\" (Kemik yapan)\nmetastazları gösterir.</p></li>\n<li><p>Super Scan: Tüm iskelet o kadar çok metastaz doludur ki,\nradyoaktif madde kemiklere gitmekten böbreklere gidemez. Böbrekler silik\ngörünür. (Kötü prognoz).</p></li>\n</ul>\n<h3 id=\"2-pet-ct-pozitron-emisyon-tomografisi\">2. PET-CT (Pozitron\nEmisyon Tomografisi)</h3>\n<ul>\n<li>FDG-PET: Şeker (Glikoz) kullanan tümörleri gösterir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Tuzak:</em> Böbrek, Mesane ve Prostat kanserinde\nKULLANILMAZ!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Neden?</em> Çünkü FDG idrarla atılır, böbrek ve mesane zaten\nparlak görünür, tümörü maskeler. Prostat kanseri ise yavaş büyür, şekeri\naz kullanır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>PSMA-PET (Galyum-68):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Prostat Kanseri için devrimdir. Prostat hücresi yüzeyindeki PSMA\nantijenine bağlanır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Endikasyon:</em> Yüksek riskli evreleme ve Nüks (PSA 0.2 iken\nbile nüksü yakalar).</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Yenidoğan hidronefrozunda sintigrafiyi (MAG3) ne zaman\nçekelim?\"</li>\n</ol>\n<ul>\n<li>Cevap: \"Doğar doğmaz çekmeyelim hocam. İlk 1 ay fizyolojik\n'Yenidoğan Oligüri'si ve immatüritesi vardır. Yanlış sonuç verir. 4-6.\nhaftadan sonra çekmek en doğrusudur.\"</li>\n</ul>\n<h3 id=\"1-soru-dmsada-soğuk-alan-cold-spot-ne-anlama-gelir\">1. Soru:\n\"DMSA'da 'Soğuk Alan' (Cold Spot) ne anlama gelir?\"</h3>\n<ul>\n<li>Cevap: Fonksiyon görmeyen korteks dokusudur. Akut piyelonefrit\n(ödem/iskemi) veya kronik skar (nefron kaybı) olabilir. 6 ay sonra\ntekrarlandığında düzelirse akut enfeksiyonmuş, kalıcıysa skarmış\ndenir.</li>\n</ul>\n<h3 id=\"1-soru-testis-tümöründe-pet-ct-ister-miyiz\">1. Soru: \"Testis\ntümöründe PET-CT ister miyiz?\"</h3>\n<ul>\n<li>Cevap: Seminoma dışı tümörlerde (NSGCT) evreleme için istenebilir\n(Metastaz şüphesinde). Ama ilk tanıda BT yeterlidir.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Voiding Sistoüretrografisi (VCUG) bir nükleer tıp tetkiki\nmidir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Hayır, konvansiyonel floroskopik bir yöntemdir. Ancak\n\"Nükleer Sistografi\" (DRNC) denilen nükleer versiyonu vardır. VUR\ntakibinde (kız çocuklarında) radyasyonu azaltmak için kullanılır,\nanatomiyi kötü gösterir ama reflüyü yakalar.</li>\n</ul>\n"}, {"id": "1.9", "t": "Semptomatoloji ve Fizik Muayene", "h": "<h3 id=\"a-semptomatoloji̇-ağrının-dili\">A. SEMPTOMATOLOJİ: \"Ağrının\nDili\"</h3>\n<p>Ürolojik ağrılar çok karakteristiktir. Hasta kapıdan girerken teşhisi\nkoyabilirsin.</p>\n<h3 id=\"1-renal-kolik-taş-ağrısı\">1. Renal Kolik (Taş Ağrısı):</h3>\n<ul>\n<li><p>Karakter: Kolik (Dalgalı), kıvrandırıcı. Hasta yerinde duramaz,\nsürekli pozisyon değiştirir (\"Restless Patient\").</p></li>\n<li><p>Yayılım: Kostovertebral açıdan başlar, öne ve aşağıya\n(kasığa/testise/labiaya) yayılır.</p></li>\n<li><p><em>Fark:</em> Peritonit (Apandisit/Divertikülit) hastası\nkımıldamak istemez (Tahta karın), çünkü hareket ağrıyı artırır. Renal\nkolikte hasta hareketlidir.</p></li>\n</ul>\n<h3 id=\"2-mesane-ve-prostat-ağrısı\">2. Mesane ve Prostat Ağrısı:</h3>\n<ul>\n<li><p>Suprapubik Ağrı: Genelde mesane doluluğu (Glob) veya sistit\nkaynaklıdır.</p></li>\n<li><p>Perineal Ağrı: Prostatitlerin (Kronik Pelvik Ağrı Sendromu) tipik\nyeridir. Hasta \"Sanki tenis topunun üzerine oturuyormuşum gibi\"\nder.</p></li>\n</ul>\n<h3 id=\"3-hematüri-i̇drarda-kan---zamanlama-her-şeydir\">3. Hematüri\n(İdrarda Kan) - Zamanlama Her Şeydir!</h3>\n<p>İşemenin hangi aşamasında kan geldiği (veya pıhtı şekli) sana\nlezyonun yerini söyler:</p>\n<ul>\n<li><p>İnitial (Başlangıç): Üretra (Darlık, karsinom).</p></li>\n<li><p>Terminal (Bitiş): Mesane boynu veya Prostatik üretra (İşeme\nsonunda kasılmayla kanar).</p></li>\n<li><p>Total (Tamamı): Mesane veya Üst Üriner Sistem\n(Böbrek/Üreter).</p></li>\n<li><p>Pıhtı Şekli:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Solucan (Vermiform): Üreterden gelir (Üreterin şeklini almıştır).\n-&gt; Üst sistem tümörü ara!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Amorf (Şekilsiz): Mesane kaynaklıdır.</li>\n</ul>\n<h3 id=\"b-alt-üri̇ner-si̇stem-semptomlari-luts\">B. ALT ÜRİNER SİSTEM\nSEMPTOMLARI (LUTS)</h3>\n<p>BPH hastasını değerlendirirken şikayetleri ikiye ayırmak ZORUNDASIN.\nÇünkü tedavi buna göre değişir.</p>\n<h3 id=\"1-depolama-i̇rritatif-semptomları\">1. Depolama (İrritatif)\nSemptomları:</h3>\n<ul>\n<li><p>Mesanenin dolum fazındaki sorunlardır.</p></li>\n<li><p>Sıkışma (Urgency), Sık idrara çıkma (Frequency), Gece idrara\nkalkma (Nocturia).</p></li>\n<li><p><em>Tedavi:</em> Antikolinerjikler veya Beta-3 agonistler\n(Mesaneyi sakinleştirir).</p></li>\n</ul>\n<h3 id=\"2-boşaltım-obstrüktif-semptomları\">2. Boşaltım (Obstrüktif)\nSemptomları:</h3>\n<ul>\n<li><p>İşeme fazındaki sorunlardır.</p></li>\n<li><p>Zayıf akım, Kesik kesik işeme, Ikınarak işeme, Damlama, Tam\nboşalamama hissi.</p></li>\n<li><p><em>Tedavi:</em> Alfa-blokerler veya 5-ARI (Prostatı\ngevşetir/küçültür).</p></li>\n</ul>\n<p>⭐ SKORLAMA SİSTEMLERİ (EBU Sınavı)</p>\n<p>Vizitte hastanın şikayetini \"çok\" veya \"az\" diye anlatma, skor\nver:</p>\n<ul>\n<li>IPSS (Uluslararası Prostat Semptom Skoru): 0-35 puan.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hafif: 0-7 (Takip et).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Orta: 8-19 (Medikal tedavi).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Şiddetli: 20-35 (Cerrahi/İleri tetkik).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>QoL (Yaşam Kalitesi): \"Hayatının geri kalanını bu şekilde geçirmek\nister misin?\" (0=Memnunum, 6=Berbat).</li>\n</ul>\n<h3 id=\"c-fi̇zi̇k-muayene-ellerin-gözün-olsun\">C. FİZİK MUAYENE: \"Ellerin\nGözün Olsun\"</h3>\n<h3 id=\"1-böbrek-muayenesi-bimanual-palpasyon\">1. Böbrek Muayenesi\n(Bimanual Palpasyon)</h3>\n<ul>\n<li><p>Hasta sırtüstü yatar. Bir elin hastanın arkasında (12. kaburga\naltında), diğer elin önde (rektus kası kenarında).</p></li>\n<li><p>Derin nefes aldırırken arkadaki elinle böbreği öne itip, öndeki\nelinle hissetmeye çalışırsın (Ballottement).</p></li>\n<li><p><em>Normal:</em> Yetişkinlerde böbrek hissedilmez (Zayıf\nkadınlarda sağ böbrek alt polü hariç). Hissediliyorsa ya Hidronefroz, ya\nKitle ya da Polikistik Böbrektir.</p></li>\n</ul>\n<h3 id=\"2-glob-vesicale-mesane-distansiyonu\">2. Glob Vesicale (Mesane\nDistansiyonu)</h3>\n<ul>\n<li><p>Mesane 150 cc'yi geçince perküsyonla, 500 cc'yi geçince\npalpasyonla (göbek altında kitle) hissedilir.</p></li>\n<li><p><em>Önemli:</em> Hasta idrarını yapamıyor ve suprapubik bölgede\nMatite (tok ses) alıyorsan Glob'dur.</p></li>\n</ul>\n<h3 id=\"3-genital-muayene-erkek\">3. Genital Muayene (Erkek)</h3>\n<ul>\n<li>Penis:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Fimozis: Sünnet derisi geri çekilemez.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Parafimozis (ACİL!): Deri geri çekilmiş ama ödem nedeniyle geri\nkapatılamıyor. Glans kangren olabilir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hipospadias: Meatus (delik) ventralde (altta).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Testis:</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Varikosel: Valsalva (ıkınma) ile damarlar belirginleşiyor mu?</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 1: Sadece Valsalva ile palpabl.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 2: İstirahatte palpabl.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Grade 3: Uzaktan gözle görülür (\"Solucan torbası\").</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Transillüminasyon (Işık testi): Skrotuma ışık tut. Işık geçiyorsa\n(kırmızı parlıyorsa) Hidrosel. Işık geçmiyorsa Tümör veya Herni\n(Barsak).</li>\n</ul>\n<h3 id=\"d-rektal-tuşe-dre---digital-rectal-exam\">D. REKTAL TUŞE (DRE -\nDigital Rectal Exam)</h3>\n<p>Üroloğun imzasıdır. PSA tek başına asla yetmez!</p>\n<p>Nasıl Yapılır?</p>\n<p>Hasta yan yatar (dizler karına çekik) veya ayakta öne eğilir. İşaret\nparmağı (bol kayganlaştırıcı ile) sfinkter tonusunu kontrol ederek\ngirer.</p>\n<p>Neye Bakarsın?</p>\n<ol type=\"1\">\n<li><p>Tonus: Anal sfinkter sıkı mı? (Gevşekse Nörojenik Mesane\nşüphesi).</p></li>\n<li><p>Boyut: Yaklaşık gram tahmini (Ceviz, Limon, Portakal).</p></li>\n</ol>\n<h3 id=\"3-kıvam-en-önemlisi\">3. Kıvam (En Önemlisi):</h3>\n<ul>\n<li>Yumuşak/Lastik (Thenar bölgesi): Benign (BPH).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Sert/Nodüler (Eklem yeri - Knuckle): KANSER (CaP)!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Taş Gibi (Stony hard): Prostat taşı veya ileri evre fikse\nkanser.</li>\n</ul>\n<h3 id=\"1-simetri-ve-sulkus-sulkus-silinmiş-mi\">1. Simetri ve Sulkus:\nSulkus silinmiş mi?</h3>\n<!-- -->\n\n<ol type=\"1\">\n<li>Isı/Ağrı: Sıcak ve ağrılıysa -&gt; Akut Prostatit. (Masaj YAPMA!\nBakteriyemiye neden olursun).</li>\n</ol>\n<h3 id=\"e-refleksler-nöroüroloji-i̇çin\">E. REFLEKSLER (Nöroüroloji\nİçin)</h3>\n<ul>\n<li>Bulbokavernöz Refleks (BCR): Glans penisi sıkarken veya foley\nsondasını hafifçe çekerken anal sfinkterin kasılmasıdır.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Anlamı:</em> Spinal kordun S2-S4 segmentinin (Sakral ark) sağlam\nolduğunu gösterir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Spinal Şok:</em> Travma sonrası bu refleks yoksa \"Spinal Şok\"\nvardır. Geri gelirse şok bitmiştir, kalıcı hasar değerlendirilir.</li>\n</ul>\n<p>📝 ASİSTAN VİZİT NOTLARI (Hoca Ne Sorar?)</p>\n<ol type=\"1\">\n<li>Soru: \"Hastada 'Pnömatüri' (İdrarla gaz gelmesi) var. Ne\ndüşünürsün?\"</li>\n</ol>\n<ul>\n<li>Cevap: Kolovezikal Fistül (Bağırsak ile mesane arasında delik). En\nsık neden: Divertikülit (%50), Kolon Kanseri (%20), Crohn (%10).</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"DRE'de prostat 'Fluktuan' (içi sıvı dolu gibi) geliyor ve çok\nağrılı. Tanı nedir?\"</li>\n</ol>\n<ul>\n<li>Cevap: Prostat Apsesi.</li>\n</ul>\n<ol type=\"1\">\n<li>Soru: \"Overflow (Taşma) İnkontinansı nedir? Fizik muayenede nasıl\nanlarsın?\"</li>\n</ol>\n<ul>\n<li>Cevap: Mesane kapasitesini aşmıştır, içeride basınç artar ve\nsfinkter direncini yenerek damla damla kaçırır. Muayenede Glob Vesicale\nvardır. (BPH'ın ileri evresidir).</li>\n</ul>\n<h3 id=\"1-soru-blue-dot-sign-mavi-nokta-belirtisi-nedir\">1. Soru: \"Blue\nDot Sign (Mavi Nokta Belirtisi) nedir?\"</h3>\n<ul>\n<li>Cevap: Skrotum cildinde görülen mavi nokta. Appendix Testis\nTorsiyonu için patognomoniktir. (Testis torsiyonu değildir, cerrahi\ngerekmez, NSAID ile geçer).</li>\n</ul>\n<h3 id=\"1-soru-prehn-belirtisi-nedir\">1. Soru: \"Prehn Belirtisi\nnedir?\"</h3>\n<ul>\n<li>Cevap: Testisi yukarı kaldırdığında ağrı azalıyorsa Epididimit\n(Prehn Pozitif). Ağrı değişmiyor veya artıyorsa Testis Torsiyonu (Prehn\nNegatif). <em>Uyarı: Güvenilirliği düşüktür, Doppler şarttır!</em></li>\n</ul>\n"}, {"id": "1.10", "t": "Ürolojik Enstrümantasyon ve Enerji Kaynakları", "h": "<h3 id=\"a-opti̇k-si̇stemler-ve-görüş-açilari\">A. OPTİK SİSTEMLER VE GÖRÜŞ\nAÇILARI</h3>\n<p>Sistoskop veya Rezektoskopun ucundaki lensin açısı, neyi göreceğini\nbelirler.</p>\n<h3 id=\"1-0-derece-direkt-görüş\">1. 0 Derece (Direkt Görüş):</h3>\n<ul>\n<li>Dürbün gibi dümdüz karşıya bakar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kullanım: Üretrotomi (Darlık açma). Çünkü bıçakla (cold knife) tam\nkarşıdaki darlığı kesmek istersin. Mesane içinde oryantasyonu\nzordur.</li>\n</ul>\n<h3 id=\"1-12-derece\">1. 12 Derece:</h3>\n<ul>\n<li>Eski tip üretrotomlarda vardı, artık pek kullanılmıyor.</li>\n</ul>\n<h3 id=\"1-30-derece-standart\">1. 30 Derece (Standart):</h3>\n<ul>\n<li>Hafif aşağıyı gösterir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kullanım: Genel Sistoskopi ve TUR (Rezeksiyon) için standarttır.\nMesane tabanını ve tavanını rahat tararsın.</li>\n</ul>\n<h3 id=\"1-70-derece-lateraldik-görüş\">1. 70 Derece (Lateral/Dik\nGörüş):</h3>\n<ul>\n<li>Neredeyse yana bakar.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kullanım: Mesane Kubbesi (Dome) ve Ön Duvar tümörleri. 30 derece ile\nbakarsan bu bölgeleri kaçırırsın!</li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Vizit Sorusu:</em> \"Sistoskopi yaparken mesane boynunu ve\nkubbeyi göremiyorum diyorsan ne yapmalısın?\" -&gt; 70 derece optiği\nalmalısın.</li>\n</ul>\n<h3 id=\"b-kateter-ve-şaft-ölçüleri̇-frenchcharriere-skalası\">B. KATETER\nVE ŞAFT ÖLÇÜLERİ (French/Charriere Skalası)</h3>\n<p>Asistanların en çok karıştırdığı matematik.</p>\n<ul>\n<li><p>Formül: 1 French (Fr) = 0.33 mm (veya 3 Fr = 1 mm).</p></li>\n<li><p><em>Örnek:</em> 18 Fr bir sonda kaç mm? -&gt; 18 / 3 = 6\nmm<br />\nçapındadır.</p></li>\n</ul>\n<p>Renk Kodları (Sondalar için Ezberle):</p>\n<p>Göz ucuyla bakıp sondanın boyunu anlamalısın.</p>\n<ul>\n<li><p>Yeşil: 14 Fr (Kadınlar/Darlık şüphesi olanlar).</p></li>\n<li><p>Turuncu: 16 Fr (Standart erişkin).</p></li>\n<li><p>Kırmızı: 18 Fr (Kanama şüphesi/Post-op).</p></li>\n<li><p>Sarı: 20 Fr (Pıhtı varsa/Yıkama yapılacaksa).</p></li>\n<li><p>Mor: 22-24 Fr (Şiddetli kanama/Tamponad).</p></li>\n</ul>\n<h3 id=\"c-elektrocerrahi̇-koter-sistemleri\">C. ELEKTROCERRAHİ (Koter\nSistemleri)</h3>\n<p>TUR-P ve TUR-M (Mesane) ameliyatlarının kalbidir. İki ana sistem\nvardır:</p>\n<h3 id=\"1-monopolar-koter-klasik\">1. Monopolar Koter (Klasik):</h3>\n<ul>\n<li><p>Akım Yolu: Aktif Elektrot (Loop) -&gt; Doku -&gt; Vücut -&gt;\nHasta Plağı (Toprak) -&gt; Cihaz.</p></li>\n<li><p>Sıvı: İletken OLMAYAN sıvı kullanılmalı (Mannitol, Sorbitol,\nGlisin).</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li><em>Neden?</em> Eğer tuzlu su (SF) kullanırsan akım dokuya gitmez,\nsuya dağılır (Resepsiyon yapamazsın).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>RİSK (TUR Sendromu):</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Hipotonik sıvının (Glisin) venöz sinüslere emilmesi sonucu\noluşur.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Dilüsyonel Hiponatremi: Na düşer (&lt;125). Beyin ödemi, konfüzyon,\nnöbet.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Amonyak Toksisitesi: Glisin karaciğerde amonyağa dönüşür -&gt;\nKoma.</li>\n</ul>\n<h3 id=\"2-bipolar-koter-plazmakinetik---modern\">2. Bipolar Koter\n(Plazmakinetik - Modern):</h3>\n<ul>\n<li><p>Akım Yolu: Aktif Elektrot -&gt; Doku -&gt; Geri Dönüş Elektrodu\n(Aynı Loop üzerinde). Akım vücudu dolaşmaz.</p></li>\n<li><p>Sıvı: İletken sıvı kullanılır (İzotonik - SF).</p></li>\n<li><p>Avantajı:</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>TUR Sendromu (Hiponatremi) riski YOKTUR (Sıvı emilse bile SF olduğu\niçin Na düşmez).</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Kalp pili (Pacemaker) olan hastalarda daha güvenlidir.</li>\n</ul>\n<!-- -->\n\n<ul>\n<li>Daha uzun ameliyat süresi sağlar.</li>\n</ul>\n<h3 id=\"d-lazer-si̇stemleri̇-taş-kırıcılar\">D. LAZER SİSTEMLERİ (Taş\nKırıcılar)</h3>\n<p>Modern taş cerrahisinin (RIRS/URS) vazgeçilmezi.</p>\n<h3 id=\"1-holmiumyag-lazer-standart\">1. Holmium:YAG Lazer\n(Standart):</h3>\n<ul>\n<li><p>Mekanizma: Fototermal. Su moleküllerini ısıtarak \"Buhar\nBaloncukları\" oluşturur. Taş bu baloncukla patlar.</p></li>\n<li><p>Ayarlar (Kritik):</p></li>\n</ul>\n<!-- -->\n\n<ul>\n<li>High Energy (Joule) / Low Frequency (Hz): FRAGMENTASYON. Taşı büyük\nparçalara ayırır (Takır tukur kırar). Basket ile toplaman ge
