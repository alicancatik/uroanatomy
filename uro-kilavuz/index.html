<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Üro Kılavuz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Üro Kılavuz">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121A22" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#16202B; --muted:#5C6B78; --line:#DCE2E7; --soft:#E9EEF1;
  --pca:#6A2C70; --nmibc:#0F7173; --mibc:#2E4C9A;
  --g:#1E7A4C; --gbg:#E3F2EA; --z:#9A6200; --zbg:#FBF0DC;
  --acc:var(--pca);
  --tab-h:58px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A22; --surface:#1A242E; --ink:#E8EDF1; --muted:#9AA8B4; --line:#2B3946; --soft:#22303C;
    --pca:#C68BCB; --nmibc:#5CC3C4; --mibc:#8FA8EC;
    --g:#6FD29C; --gbg:#173326; --z:#F0B65A; --zbg:#3A2C12;
  }
}
:root[data-theme="black"]{
  --bg:#000000; --surface:#0E0E10; --ink:#ECEFF2; --muted:#9AA3AB; --line:#26292E; --soft:#1A1C20;
  --g:#6FD29C; --gbg:#123020; --z:#F0B65A; --zbg:#33260E;
}
:root[data-theme="dark"]{
  --bg:#121A22; --surface:#1A242E; --ink:#E8EDF1; --muted:#9AA8B4; --line:#2B3946; --soft:#22303C;
  --pca:#C68BCB; --nmibc:#5CC3C4; --mibc:#8FA8EC;
  --g:#6FD29C; --gbg:#173326; --z:#F0B65A; --zbg:#3A2C12;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body[data-g="pca"]{--acc:var(--pca)} body[data-g="nmibc"]{--acc:var(--nmibc)} body[data-g="mibc"]{--acc:var(--mibc)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
a{color:var(--acc)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 8px;border-bottom:1px solid transparent}
header.top.scrolled{border-bottom-color:var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gname{font-weight:700;font-size:20px;line-height:1.25;color:var(--acc);margin:12px 0 2px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 10px}
.brand h1{margin:0;font-size:clamp(22px,6vw,28px);line-height:1.1;font-weight:700;letter-spacing:-0.02em;color:var(--acc);transition:color .25s}
.brand small{color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:7px 13px;border-radius:18px;font-weight:600;font-size:14px;color:var(--muted);background:var(--soft);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--surface)}
.seg .grp{flex:none;align-self:center;font-size:12px;color:var(--muted);padding:0 2px 0 6px}
.seg .grp:first-child{padding-left:0}
.srow{display:flex;gap:8px;margin-top:10px;align-items:center}
.srow .search{flex:1;margin-top:0}
.thb{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.thb svg{width:20px;height:20px}
.search{margin-top:10px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:10px 36px 10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px;display:none}
.search.has button{display:block}

/* progress */
.prog{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--muted);font-size:13px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}

/* chapters */
details.ch{background:var(--surface);border-radius:14px;margin:10px 0;border:1px solid var(--line);overflow:hidden}
details.ch>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 14px;cursor:pointer}
details.ch>summary::-webkit-details-marker{display:none}
.ch-t{flex:1;font-weight:600;font-size:16px;line-height:1.3}
.ch-c{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ch-x{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .2s}
details[open]>summary .ch-x{transform:rotate(90deg)}
.ch-body{border-top:1px solid var(--line)}
.ch-done .ch-t::after{content:" ✓";color:var(--g)}

/* items */
.it{padding:12px 14px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:24px;padding:0 8px;border-radius:12px;font-size:12px;font-weight:700;margin-top:1px}
.badge.G{background:var(--g);color:var(--surface)}
.badge.Z{background:var(--zbg);color:var(--z);box-shadow:inset 0 0 0 1.5px var(--z)}
.rec p{margin:0;font-size:15.5px}
.rec.learned p{color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:4px}
.acts button{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.acts button svg{width:20px;height:20px}
.acts button[aria-pressed="true"].st{color:#D9A400}
.acts button[aria-pressed="true"].ok{color:var(--g)}
.note{font-size:15px;color:var(--ink);margin:0;padding-left:12px;border-left:3px solid var(--line)}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
table{border-collapse:collapse;width:100%;font-size:14px}
table.wide{min-width:440px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--acc);font-size:13px;border-bottom:2px solid var(--acc)}
td:first-child{font-weight:600;white-space:nowrap;max-width:46%}
td:first-child{white-space:normal}
mark{background:color-mix(in srgb,var(--acc) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.src{font-size:12px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:40px 12px}

/* filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chips button{font-size:13px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500}
.chips button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--surface))}

/* study */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:16px 0}
.card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.card .q{font-size:18px;line-height:1.5;margin:0}
.cz{display:inline-block;min-width:2.4em;padding:0 6px;margin:0 1px;border-radius:6px;background:var(--soft);color:transparent;box-shadow:inset 0 -2px 0 var(--acc);cursor:pointer;font-weight:600}
.cz.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px 10px;border-radius:12px;font-weight:600;font-size:16px;border:1.5px solid var(--line);background:var(--surface)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--surface)}
.btn.g{border-color:var(--g);color:var(--g)} .btn.z{border-color:var(--z);color:var(--z)}
.fb{margin-top:14px;font-weight:600}
.fb.ok{color:var(--g)} .fb.no{color:#C0392B}
.score{display:flex;gap:16px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mode button{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.mode button b{display:block;font-size:15px}
.mode button span{font-size:13px;color:var(--muted)}
.mode button[aria-pressed="true"]{border-color:var(--acc)}
.mode button[aria-pressed="true"] b{color:var(--acc)}

/* info */
.info h2{font-size:20px;margin:22px 0 8px}
.info p,.info li{font-size:15px}
.ref{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.ref b{display:block;margin-bottom:4px}
.danger{color:#C0392B;border-color:#C0392B !important}

/* tabbar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--acc)}
.view{display:none} .view.on{display:block}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body data-g="pca">
<div class="wrap">
  <header class="top" id="top">
    <h1 id="title" class="sr">Üro Kılavuz</h1>
    <div class="seg" role="group" aria-label="Kılavuz seç" id="seg"></div>
    <div class="srow"><div class="search" id="sw"><input id="q" type="search" placeholder="Tüm kılavuzlarda ara" autocomplete="off" enterkeyhint="search" aria-label="Ara"><button id="qx" aria-label="Aramayı temizle">×</button></div><button class="thb" id="thq" aria-label="Temayı değiştir"></button></div>
  </header>

  <section class="view on" id="v-kilavuz">
    <div class="gname" id="gname"></div>
    <div class="chips" id="flt"></div>
    <div class="prog"><span id="pt">0 / 0 öneri öğrenildi</span><div class="bar"><i id="pb"></i></div></div>
    <div id="list"></div>
  </section>

  <section class="view" id="v-calis">
    <div class="mode" id="modes">
      <button data-m="guc" aria-pressed="true"><b>Güç testi</b><span>Öneri güçlü mü, zayıf mı?</span></button>
      <button data-m="sayi" aria-pressed="false"><b>Eşik kartları</b><span>Gizli sayıları hatırla</span></button>
    </div>
    <div class="chips" id="sflt"></div>
    <div id="study"></div>
  </section>

  <section class="view" id="v-yildiz"><div id="stars"></div></section>

  <section class="view info" id="v-kaynak"></section>
</div>

<nav class="tabs" aria-label="Bölümler"><div class="in">
  <button data-v="kilavuz" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Kılavuz</button>
  <button data-v="calis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Çalış</button>
  <button data-v="yildiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>Yıldızlı</button>
  <button data-v="kaynak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Kaynak</button>
</div></nav>

<script>
const PROSTAT = {
id: "pca", ad: "Prostat kanseri", kisa: "Prostat", renk: "pca",
kaynak: "EAU-EANM-ESTRO-ESUR-ISUP-SIOG Guidelines on Prostate Cancer, Pocket Guidelines 2026 (Mart 2026 sınırlı güncelleme)",
url: "https://uroweb.org/guidelines/prostate-cancer",
bolumler: [
{ b: "Giriş ve epidemiyoloji", i: [
 {t:"n", x:"Tedavi seçimini hastalık özellikleri, yaş, komorbiditeler ve hastanın kişisel tercihi belirler. Tüm yönetim seçenekleri hastayla eksiksiz konuşulmalı."},
 {t:"n", x:"Erkeklerde en sık görülen ikinci kanser. Gelişmiş ülkelerde yaşlı erkek oranının yüksekliği ve erken tanı sonrası aşırı tedavi riski nedeniyle önemli bir sağlık sorunu."},
 {t:"n", x:"Kesinleşmiş üç risk faktörü: ileri yaş, etnik köken, genetik yatkınlık."},
 {t:"n", x:"Önleyici önlemlerin riski azalttığına dair yüksek düzey kanıt yok; taramanın etkili olduğu ise gösterilmiş."}
]},
{ b: "Evreleme: TNM 2025", i: [
 {t:"n", x:"Evrelemede 2025 TNM sınıflaması kullanılır. Klinik T evresi yalnızca DRE bulgusuna dayanır."},
 {t:"tb", h:["T","Tanım"], r:[
  ["TX","Primer tümör değerlendirilemiyor"],["T0","Primer tümör bulgusu yok"],
  ["T1","Ele gelmeyen, klinik olarak saptanamayan tümör"],
  ["T1a","Rezeke dokunun %5 veya daha azında insidental histolojik bulgu"],
  ["T1b","Rezeke dokunun %5'inden fazlasında insidental histolojik bulgu"],
  ["T1c","İğne biyopsisiyle saptanan tümör (örn. PSA yüksekliği nedeniyle)"],
  ["T2","Ele gelen ve prostata sınırlı tümör"],
  ["T2a","Bir lobun yarısı veya daha azı"],["T2b","Bir lobun yarısından fazlası, iki lob değil"],["T2c","İki lob tutulumu"],
  ["T3","Prostat kapsülünü palpabl olarak aşan tümör"],
  ["T3a","Ekstrakapsüler uzanım (tek veya çift taraflı)"],["T3b","Seminal vezikül invazyonu"],
  ["T4","Fikse tümör veya seminal vezikül dışında komşu yapı invazyonu: eksternal sfinkter, rektum, levator kaslar ve/veya pelvik duvar"]]},
 {t:"tb", h:["N / M","Tanım"], r:[
  ["NX","Bölgesel LN değerlendirilemiyor"],["N0","Bölgesel (pelvik) LN metastazı yok"],["N1","Bölgesel LN metastazı var"],
  ["M0","Uzak metastaz yok"],["M1a","Bölgesel olmayan LN"],["M1b","Kemik"],["M1c","Diğer bölgeler"]]},
 {t:"n", x:"0,2 cm'yi aşmayan nodal metastaz pNmi olarak işaretlenebilir. Birden fazla metastaz bölgesi varsa en ileri kategori kullanılır; en ileri kategori (p)M1c."},
 {t:"n", x:"Patolojik evreleme (pTNM) klinik TNM'ye büyük ölçüde paraleldir; farkı T1c ve T2 alt evrelerindedir. RP sonrası organa sınırlı tüm tümörler pT2'dir; UICC artık pT2 alt evrelerini tanımıyor."},
 {t:"r", s:"G", x:"Prostat kanserini evrelemek için TNM sınıflamasını kullan."},
 {t:"r", s:"G", x:"Klinik evre yalnızca DRE'ye dayansın; görüntüleme veya patolojiden gelen ek evreleme bilgisi ayrı raporlansın."}
]},
{ b: "Derecelendirme ve anlamlı kanser", i: [
 {t:"n", x:"ISUP/WHO 2022 derece grupları benimsenmiştir: hastanın tümörünün davranışını anlamasını kolaylaştırır ve GS 7'yi prognozu belirgin farklı iki gruba ayırır (3+4 = GG2, 4+3 = GG3)."},
 {t:"tb", h:["Gleason skoru","ISUP derece grubu"], r:[["2–6","1"],["7 (3+4)","2"],["7 (4+3)","3"],["8 (4+4, 3+5, 5+3)","4"],["9–10 (4+5, 5+4, 5+5)","5"]]},
 {t:"r", s:"G", x:"Prostat kanserinin derecelendirmesinde ISUP 2019 sistemini kullan."},
 {t:"n", x:"'Klinik olarak anlamlı' ifadesi, hastada morbidite veya ölüme yol açabilecek kanseri nadiren yol açanlardan ayırmak için kullanılır. Önemsiz kanser sık görülür ve ayrım yapılmazsa aşırı tedavi ve tedaviye bağlı zarar riski yüksektir."},
 {t:"n", x:"Düşük riskli kanser neredeyse tüm erkeklerde önemsizdir. Düşük volümlü bazı GG2 tümörler de PSA, MR bulguları ve patern 4 yüzdesine göre önemsiz olabilir ve başlangıçta tedaviden kaçınılabilir."},
 {t:"n", x:"Önemsiz kanser saptanan tüm hastalar, yaşam beklentisi 10 yılın altına düşene kadar aktif izlemde tutulmalı. Yüksek riskli kanser, yaşam beklentisi kısıtlı değilse neredeyse herkeste anlamlıdır."}
]},
{ b: "EAU risk grupları", i: [
 {t:"n", x:"Sistematik biyopsiye dayalı, biyokimyasal nüks riskine göre gruplama. cT evresi DRE'ye, cN BT/kemik sintigrafisine göredir."},
 {t:"tb", h:["Grup","Tanım"], r:[
  ["Düşük risk","ISUP GG1 ve PSA <10 ng/mL ve cT1-2"],
  ["Olumlu ara risk","GG2 + PSA <10 + cT1-2, veya GG1 + PSA 10–20 + cT1-2"],
  ["Olumsuz ara risk","GG2 + PSA 10–20 + cT1-2, veya GG3 + cT1-2"],
  ["Yüksek risk (lokalize)","GG4/5 veya PSA >20 ng/mL"],
  ["Lokal ileri","cT3-4 ve/veya cN+, GG ve PSA'dan bağımsız"]]}
]},
{ b: "Tanı ve erken tanı", i: [
 {t:"n", x:"Tanı yolunun amacı anlamlı kanseri zamanında saptamak, önemsiz kanseri saptamadan bırakmak; tanısal doğruluk ile birey ve sağlık sistemi üzerindeki yük dengelenmeli. LUTS, aile öyküsü, yaş ve komorbidite her zaman dikkate alınmalı."},
 {t:"n", x:"Şüphe genellikle DRE ve/veya PSA ile doğar. Kesin tanı; biyopsi korları, TUR-P materyali veya BPH nedeniyle yapılan prostatektomi materyalinde adenokarsinomun histopatolojik gösterilmesine dayanır."},
 {t:"n", x:"İleri tanı/evreleme kararı hastanın erişebileceği tedavi seçeneklerine ve yaşam beklentisine göre verilir; tedavi kararını değiştirmeyecek tetkiklerden genellikle kaçınılabilir."},
 {t:"r", s:"Z", x:"Yaşam beklentisi en az 15 yıl olan, iyi bilgilendirilmiş erkeğe bireysel, risk uyarlamalı erken tanı stratejisi sun."},

 {t:"n", x:"Kılavuzun kapsamı 'üriner inkontinans'tan 'nörojenik olmayan kadın LUTS'a genişletildi; non-obstetrik fistüller, kadında mesane çıkım obstrüksiyonu (BOO), az aktif mesane (UAB) ve noktüri bölümleri eklendi."},

{ b: "Ürodinami, ped testi, görüntüleme", i: [
 {t:"n", x:"Kanıt özeti: ürodinami alt üriner sistem fonksiyonunu kapsamlı analiz eder, ancak parametrelerin çoğu aynı seansta ve zamanla değişkenlik gösterir. Üretra fonksiyon testleri tekrarlanabilir olsa da Üİ şiddetiyle tutarlı ilişkili değil. Öykü ile ürodinami uyumsuz olabilir. Ürodinamik DO tanısı aşırı aktif mesanede tedavi sonucunu etkilemez. Komplike olmayan, klinik gösterilebilen SÜİ'de preoperatif ürodinami cerrahi sonucunu iyileştirmez. Preoperatif DO'nun mikst Üİ cerrahisinde başarısızlıkla ilişkisi tutarlı değil, ancak SÜİ cerrahisi sonrası urgency'nin sürmesiyle ilişkili olabilir."},
 {t:"r", s:"G", x:"Ürodinami yaparken International Continence Society'nin iyi ürodinami uygulama standartlarına uy."},
 {t:"r", s:"G", x:"Komplike olmayan SÜİ'ye tedavi sunarken rutin ürodinami yapma."},
 {t:"r", s:"G", x:"Komplike olmayan aşırı aktif mesane semptomlarına birinci basamak tedavi sunarken rutin ürodinami yapma."},
 {t:"r", s:"Z", x:"Bulgular invaziv tedavi seçimini değiştirebilecekse ve/veya tanısal belirsizlik varsa ürodinami yap."},

 {t:"r", s:"Z", x:"Üİ'nin nicel ölçümü gerektiğinde, özellikle tedavi yanıtını değerlendirmede ped testi kullan."},
 {t:"r", s:"G", x:"İlk değerlendirmede (PVR tahmini dışında) üst veya alt üriner sistem görüntülemesini rutin yapma."},
 {t:"r", s:"G", x:"Kadın alt üriner sistem hastalığının tanı ve yönetiminde idrar biyobelirteçlerini veya idrar mikrobiyomunu rutin kullanma."}
]},
{ b: "Aşırı aktif mesane: tanı ve konservatif tedavi", i: [

 {t:"r", s:"G", x:"Tüm AAM hastalarından mevcut ilaç öyküsü al."},
 {t:"r", s:"G", x:"AAM semptomlarını başlatan veya kötüleştiren yeni ilaçları gözden geçir."},
 {t:"r", s:"G", x:"Uygun konservatif tedaviyi seçerken klinisyen ve hastanın birlikte katıldığı ortak karar süreci kullan."},
 {t:"r", s:"G", x:"Yalnızca tutucu ürünlere karar vermeden önce kadını ve/veya bakım vereni mevcut tedavi seçenekleri hakkında bilgilendir."},
 {t:"r", s:"G", x:"Islak AAM'de geçici semptom kontrolü için veya başka tedavi planlanmadığında ya da mümkün olmadığında ped ve/veya tutucu cihaz sun."},
 {t:"r", s:"G", x:"Profilaktik antibiyotiği yalnızca tekrarlayan İYE'si olanlara, antimikrobiyal direnç riskini konuştuktan sonra sun."},
 {t:"n", x:"Kanıt özeti (yaşam tarzı): kafein azaltma sıklık ve urgency'yi azaltabilir; sıvı alımını %25 azaltmak AAM semptomlarını iyileştirebilir ama UÜİ'yi değil; farmakoterapiye eklenen kişisel sıvı önerisi ek fayda sağlamaz; obezite Üİ için risk faktörü; sigarayı bırakmanın faydasına dair kanıt zayıf."},
 {t:"r", s:"G", x:"Kafein azaltmanın urgency ve sıklığı iyileştirebileceğini, inkontinansı ise iyileştirmediğini söyle."},

 {t:"r", s:"G", x:"Sigara içen AAM hastalarına bırakma stratejileri sun."},
 {t:"n", x:"Kanıt özeti (davranışsal/fiziksel): yönlendirilmiş işeme bakıma muhtaç yaşlılarda kısa dönemde kontinansı iyileştirir; mesane eğitimi UÜİ'de etkili ama farmakoterapiden daha az; PFMT sıklığı iyileştirebilir; elektrik stimülasyonu bazı kadınlarda etkili ama standardizasyonu zayıf; PTNS UÜİ ataklarını antimuskarinikten daha fazla azaltır, diğer semptomlarda fark yok; perkütan PTNS idamesi 3 yıla kadar etkili; transkütan PTNS sham'den etkili ve perkütana göre daha kötü değil; akupunktur sonuçları karışık."},
 {t:"r", s:"G", x:"Kognitif bozukluğu olan AAM hastalarına yönlendirilmiş işeme sun."},

 {t:"r", s:"G", x:"PFMT programlarının olabildiğince yoğun olmasını sağla."},
 {t:"r", s:"G", x:"AAM/UÜİ'de semptomatik iyileşme için posterior tibial sinir stimülasyonu sun."},
 {t:"r", s:"Z", x:"AAM semptomlarında akupunkturu seçenek olarak düşün."}
]},
{ b: "Aşırı aktif mesane: ilaç tedavisi", i: [
 {t:"n", x:"Kanıt özeti (antikolinerjikler): plaseboya göre AAM semptomlarını, UÜİ ataklarını, urgency ve sıklığı azaltır, işeme hacmini artırır; ağız kuruluğu, kognitif bozulma ve kabızlık daha sık. Uzatılmış salımlı formlar daha az yan etkili; transdermal oksibutinin daha az ağız kuruluğu ama cilt reaksiyonuyla yüksek bırakma oranı. Yüksek doz daha etkili ama daha yan etkili. Hiçbir antikolinerjik diğerinden açıkça üstün değil. Başka bir modaliteyle kombinasyon tek başına antimuskariniğe üstün. Uyum düşük; hastaların çoğu ilk 3 ayda bırakıyor."},
 {t:"r", s:"G", x:"Uygun farmakoterapiyi seçerken ortak karar süreci kullan."},
 {t:"r", s:"G", x:"Konservatif tedaviden fayda görmeyen AAM'li kadınlara antikolinerjik sun."},
 {t:"r", s:"G", x:"Mümkün olduğunda uzatılmış salımlı antikolinerjik formları düşün."},
 {t:"r", s:"G", x:"Antikolinerjik etkisizse doz artırma, başka bir antikolinerjik form veya β3 agonist (tek başına veya antikolinerjikle) düşün."},
 {t:"r", s:"G", x:"Antikolinerjik başlananları etkinlik ve yan etkiler açısından erken değerlendir."},
 {t:"n", x:"Kanıt özeti (β3 agonistler): mirabegron ve vibegron plaseboya üstün, yan etki oranı plaseboya benzer; antimuskarinikler kadar etkili ama ağız kuruluğu daha az. Solifenasin 5 mg ile yetersiz tedavi edilenler doz artırımından çok mirabegron eklenmesinden fayda görebilir."},
 {t:"r", s:"G", x:"Konservatif tedaviden fayda görmeyen AAM'li kadınlara β3 agonist sun."},
 {t:"r", s:"Z", x:"Solifenasin 5 mg ile yetersiz tedavi edilenlere ek tedavi olarak mirabegron sun."},
 {t:"r", s:"G", x:"Yaşlı kadınlarda, özellikle kognitif bozukluk riski veya mevcut kognitif bozukluğu olanlarda uzun süreli antikolinerjiği dikkatle kullan."},
 {t:"r", s:"G", x:"Antikolinerjik düşünülen kadınlarda antikolinerjik yükü ve ilişkili komorbiditeleri değerlendir."},
 {t:"r", s:"Z", x:"LUTS'u ve menopozun genitoüriner sendromu semptomları olan kadınlara vajinal östrojen sun."}
]},
{ b: "Aşırı aktif mesane: cerrahi ve izlem", i: [
 {t:"n", x:"Kanıt özeti (onabotA): 100 U tek seans plaseboya göre UÜİ/AAM'yi iyileştirir ve yaşam kalitesini artırır; tekrar enjeksiyonlarda etkinlik azalması kanıtı yok ama bırakma oranı yüksek; işeme disfonksiyonu, artmış PVR ve İYE riski var; bakteriüri riski yüksek, klinik önemi belirsiz. UÜİ'yi iyileştirmede antimuskarinikten üstün, atak sayısını azaltmada benzer; işeme disfonksiyonu daha sık. Suburotelyal ve intradetrüsör enjeksiyon arasında fark yok."},
 {t:"r", s:"G", x:"Konservatif veya ilaç tedavisine dirençli AAM/UÜİ'de mesane duvarına onabotulinumtoksinA (100 U) enjeksiyonu sun."},
 {t:"r", s:"G", x:"Öncesinde yanıtın sınırlı süresi, İYE riski ve uzun süreli aralıklı kateterizasyon olasılığı konusunda uyar."},
 {t:"n", x:"Kanıt özeti (SNS): başarısız konservatif tedaviye devam etmekten daha etkili (sham kontrol yok); 24 ayda onabotA 200 U kadar etkili; implante edilenlerin ≥%50'sinde UÜİ'de en az %50 iyileşme sürer, %40'a kadarı 5 yılda kür kalabilir; 3–4 yılda cerrahi revizyon %30–40."},
 {t:"r", s:"G", x:"Antikolinerjik tedaviye dirençli AAM/UÜİ'de sakral sinir stimülasyonu sun."},
 {t:"r", s:"G", x:"AAM semptomlarında vajinal lazer tedavisini iyi düzenlenmiş klinik araştırma dışında sunma (kısa dönemde minimal iyileşme, uzun dönem veri yok)."},
 {t:"r", s:"G", x:"AAM için majör cerrahi öncesinde ve sonrasında uzman hemşire veya eşdeğer sağlık çalışanınca danışmanlık ve ömür boyu destek sağla."},
 {t:"r", s:"Z", x:"Diğer tüm seçenekleri başarısız olan ve tüm olası komplikasyonlar hakkında bilgilendirilmiş AAM/UÜİ hastalarına augmentasyon sistoplasti sun."},
 {t:"r", s:"G", x:"Augmentasyon sistoplastide aralıklı kateterizasyonun yüksek riskini (yapmaya istekli ve yapabilir olduklarından emin ol) ve ömür boyu izlem gerekliliğini anlat."},
 {t:"r", s:"Z", x:"UÜİ tedavisinde detrüsör miyektomi sunma."},
 {t:"r", s:"Z", x:"Üriner diversiyonu yalnızca daha az invaziv tedavileri başarısız olan, stomayı kabul eden ve küçük malignite riski konusunda uyarılan AAM/UÜİ hastalarına sun."},
 {t:"r", s:"G", x:"Antikolinerjik veya β3 agonist başlananlara erken izlem sun."},
 {t:"r", s:"G", x:"OnabotA'nın etkili olduğu kadınlara gerektiğinde tekrar enjeksiyon sun (minimum aralık için üretici önerisine bak)."},
 {t:"r", s:"G", x:"SNS implantı olan kadınlara elektrot yer değiştirmesi, arıza ve pil tükenmesi için ömür boyu izlem sun."},
 {t:"r", s:"Z", x:"Augmentasyon sistoplastiden 10 yıl veya daha uzun süre geçmiş kadınlara küçük malignite riski nedeniyle sistoskopik izlem sun."}
]},

 {t:"r", s:"G", x:"SÜİ cerrahisi dahil işeme disfonksiyonuna yol açabilecek tedavi planlananlarda PVR'yi izle."},

 {t:"r", s:"Z", x:"Preoperatif ürodinami yap: ek depolama semptomları olan SÜİ, inkontinans tipinin belirsiz olduğu durumlar, işeme disfonksiyonu şüphesi, eşlik eden prolapsus veya önceki SÜİ cerrahisi."},
 {t:"r", s:"Z", x:"Bulgular invaziv tedavi seçimini değiştirebilecekse ürodinami yap."},
 {t:"r", s:"G", x:"İnkontinans şiddetini derecelendirmek için üretral basınç profilometrisi veya kaçırma noktası basıncı kullanma."},
 {t:"r", s:"G", x:"SÜİ'nin rutin değerlendirmesinde üst veya alt üriner sistem görüntülemesi yapma."},
 {t:"r", s:"G", x:"Fazla kilolu ve obez LUTS/SÜİ'li kadınları kilo vermeye ve korumaya teşvik et."},
 {t:"r", s:"G", x:"SÜİ veya mikst Üİ'li tüm kadınlara (yaşlılar ve doğum öncesi/sonrası dahil) birinci basamak olarak en az 3 ay süren, denetimli yoğun pelvik taban kas eğitimi sun."},

 {t:"n", x:"Kanıt özeti (duloksetin): SÜİ'yi iyileştirir ama kür şansı düşük; belirgin GİS ve SSS yan etkileri nedeniyle bırakma oranı yüksek, bu semptomlar ilk haftalarla sınırlı olabilir."},
 {t:"r", s:"G", x:"Diğer konservatif tedavilere yanıtsız ve invaziv tedaviden kaçınmak isteyen seçilmiş SÜİ hastalarına, yan etki riski konusunda dikkatle bilgilendirdikten sonra duloksetin sun (lisanslı olduğu yerlerde)."},

]},
{ b: "SÜİ: cerrahi tedavi", i: [
 {t:"n", x:"Polipropilen meş midüretral sling (MUS) uzun dönem komplikasyon kaygıları nedeniyle incelemeye alındı; Birleşik Krallık gibi bazı ülkelerde kullanımı durduruldu. 2020 BK parlamento raporuna göre birçok kadında meş cerrahisi sorunsuz ve faydalı, ancak hepsinde değil; komplikasyon yaşayanların gerçek sayısı bilinmiyor ve azınlıkta olsalar da yaşadıkları ağır."},
 {t:"r", s:"G", x:"SÜİ tedavisine karar verirken ortak karar yaklaşımı kullan."},
 {t:"r", s:"G", x:"PFMT dahil konservatif seçenekleri denemiş/başarısız olmuş hastalara uygunsa farklı cerrahi seçenekler sun ve her birinin avantaj ve dezavantajlarını konuş."},
 {t:"r", s:"G", x:"Yeni SÜİ cihazlarını yalnızca yapılandırılmış araştırma programı içinde kullan; sonuçları kayıt veya iyi düzenlenmiş çalışmada izlenmeli."},
 {t:"r", s:"G", x:"Cerrahi isteyen kadınlara diğer yöntemlere göre risk ve faydaları kapsamlı konuşulduktan sonra kolposüspansiyon (açık veya laparoskopik) sun."},
 {t:"n", x:"Kanıt özeti (otolog sling): kür oranı yüksek ve kolposüspansiyondan daha etkili; açık kolposüspansiyona benzer yan etki oranı, daha fazla işeme disfonksiyonu ve postoperatif İYE, daha az prolapsus ve mesane/üretra perforasyonu."},
 {t:"r", s:"G", x:"Cerrahi isteyen kadınlara diğer yöntemlere göre risk ve faydalar konuşulduktan sonra otolog sling sun."},
 {t:"n", x:"Kanıt özeti (üretral dolgu ajanları): kısa dönemde iyileşme ve kür sağlayabilir; MUS, kolposüspansiyon veya otolog slingden daha az etkili, tekrar enjeksiyon gerekebilir. Otolog yağ ve hiyalüronik asitle yan etki riski daha yüksek. Açık cerrahiye göre yan etkiler daha az. Ajanlar arasında üstünlük kanıtı yok. Periüretral yol transüretral yola göre daha fazla retansiyon riskiyle ilişkili olabilir."},
 {t:"r", s:"G", x:"Cerrahi isteyen kadınlara diğer yöntemlere göre risk ve faydalar konuşulduktan sonra üretral dolgu ajanı sun."},

function hl(text,q){
  let h=esc(text); if(!q) return h;
  const nq=q.trim(); if(!nq) return h;
  const re=new RegExp("("+nq.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return h.replace(re,"<mark>$1</mark>");
}
function recHTML(it,q,showSrc){
  const l=!!ST.learned[it.id], s=!!ST.star[it.id];
  return `<div class="it"><div class="rec${l?" learned":""}">
   <span class="badge ${it.s}">${SL[it.s]}</span>
   <div><p>${hl(it.x,q)}</p>${showSrc?`<div class="src">${esc(it.g.kisa)} · ${esc(it.g.bolumler[it.si].b)}</div>`:""}</div>
   <div class="acts">
    <button class="st" data-star="${it.id}" aria-pressed="${s}" aria-label="${s?"Yıldızı kaldır":"Yıldızla"}">${s?ico.star:ico.starO}</button>
    <button class="ok" data-learn="${it.id}" aria-pressed="${l}" aria-label="${l?"Öğrenildi işaretini kaldır":"Öğrendim olarak işaretle"}">${ico.ok}</button>
   </div></div></div>`;
}
function itemHTML(it,q){
  if(it.t==="r") return recHTML(it,q,false);
  if(it.t==="n") return `<div class="it"><p class="note">${hl(it.x,q)}</p></div>`;
  if(it.t==="tb") return `<div class="it"><div class="tblw"><table${it.h.length>2?' class="wide"':""}><thead><tr>${it.h.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${it.r.map(r=>`<tr>${r.map(c=>`<td>${hl(c,q)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  return "";
}
const openSet=new Set();
function passF(it){
  if(ST.sf==="all") return true;
  if(it.t!=="r") return false;
  if(ST.sf==="G"||ST.sf==="Z") return it.s===ST.sf;
  if(ST.sf==="todo") return !ST.learned[it.id];
  return true;
}
function renderList(){
  const g=cur(), q=$("#q").value.trim();
  if(q.length>=2){ renderSearch(q); return; }
  $("#flt").style.display=""; $(".prog").style.display="";
  let html="";
  g.bolumler.forEach((s,si)=>{
    const items=s.i.filter(passF);
    if(!items.length) return;
    const recs=s.i.filter(x=>x.t==="r"), done=recs.filter(x=>ST.learned[x.id]).length;
    const key=g.id+"-"+si;
    html+=`<details class="ch${recs.length&&done===recs.length?" ch-done":""}" data-k="${key}"${openSet.has(key)?" open":""}>
      <summary><span class="ch-t">${esc(s.b)}</span><span class="ch-c">${recs.length?done+"/"+recs.length:"bilgi"}</span>${ico.chev}</summary>
      <div class="ch-body">${items.map(it=>itemHTML(it,"")).join("")}</div></details>`;
  });
  $("#list").innerHTML=html||`<div class="empty">Bu filtreyle gösterilecek öneri yok.</div>`;
  updProg();
}
function renderSearch(q){
  $("#flt").style.display="none"; $(".prog").style.display="none";
  const lq=q.toLocaleLowerCase("tr");
  const hits=[];
  GL.forEach(g=>g.bolumler.forEach((s,si)=>s.i.forEach(it=>{
    const txt=(it.x||"")+" "+(it.h?it.h.join(" "):"")+" "+(it.r?it.r.flat().join(" "):"");
    if(txt.toLocaleLowerCase("tr").includes(lq)) hits.push(it);
  })));
  if(!hits.length){$("#list").innerHTML=`<div class="empty">“${esc(q)}” için sonuç yok. Daha kısa bir terim deneyin, örneğin “PSAD” yerine “dansite”.</div>`;return;}
  let html=`<div class="prog"><span>${hits.length} sonuç</span></div>`;
  GL.forEach(g=>{
    const gh=hits.filter(h=>h.g===g); if(!gh.length) return;
    html+=`<details class="ch" open><summary><span class="ch-t" style="color:${gc(g)}">${esc(g.ad)}</span><span class="ch-c">${gh.length}</span>${ico.chev}</summary><div class="ch-body">`;
    gh.forEach(it=>{
      if(it.t==="r") html+=recHTML(it,q,true);
      else html+=itemHTML(it,q).replace('</div>',`<div class="src">${esc(g.bolumler[it.si].b)}</div></div>`);
    });
    html+=`</div></details>`;
  });
  $("#list").innerHTML=html;
}
function updProg(){
  const recs=cur().bolumler.flatMap(s=>s.i.filter(x=>x.t==="r"));
  const d=recs.filter(x=>ST.learned[x.id]).length;
  $("#pt").textContent=`${d} / ${recs.length} öneri öğrenildi`;
  $("#pb").style.width=(recs.length?d/recs.length*100:0)+"%";
}
function renderFilters(){
  const opts=[["all","Tümü"],["G","Güçlü"],["Z","Zayıf"],["todo","Öğrenilmemiş"]];
  $("#flt").innerHTML=opts.map(([k,l])=>`<button data-f="${k}" aria-pressed="${ST.sf===k}">${l}</button>`).join("");
}
function renderSeg(){
  const pill=g=>`<button data-g="${g.id}" aria-pressed="${ST.g===g.id}">${g.kisa}</button>`;
  const on=GL.filter(g=>g.grup==="onko"), non=GL.filter(g=>g.grup!=="onko");
  $("#seg").innerHTML=`<span class="grp">Onkoloji</span>`+on.map(pill).join("")+(non.length?`<span class="grp">Non-onkoloji</span>`+non.map(pill).join(""):"");
  setAcc(); $("#gname").textContent=cur().ad;
  const a=$("#seg").querySelector('[aria-pressed="true"]'); if(a) a.scrollIntoView({block:"nearest",inline:"center"});
}
function renderStars(){
  const s=ALLREC.filter(x=>ST.star[x.id]);
  $("#stars").innerHTML=s.length?`<div class="prog"><span>${s.length} yıldızlı öneri</span></div><div class="ch" style="background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px">${s.map(it=>recHTML(it,"",true)).join("")}</div>`
    :`<div class="empty">Henüz yıldızlı öneri yok. Bir önerinin yanındaki yıldıza dokunarak buraya ekleyin.</div>`;
}

// study
let SM="guc", SS={ok:0,no:0}, SCOPE="cur", curCard=null, answered=false;
const NUMRE=/(?:≥|≤|<|>)?\s?\d+(?:[.,]\d+)?(?:\s?[–-]\s?\d+(?:[.,]\d+)?)?(?:\s?(?:%|ng\/mL\/cc|ng\/mL|ng\/dL|nmol\/L|mL\/dk|mg\/m²|mg\/kg|Gy|fr|yıl|ay|hafta|gün|saat|mL|g|cm|mg))?/g;
function pool(){
  let p=SCOPE==="all"?ALLREC:ALLREC.filter(x=>x.g.id===ST.g);
  if(SCOPE==="star") p=ALLREC.filter(x=>ST.star[x.id]);
  if(SM==="sayi") p=p.filter(x=>/\d/.test(x.x));
  return p;
}
function renderSF(){
  const o=[["cur",cur().kisa],["all","Tüm kılavuzlar"],["star","Yıldızlılar"]];
  $("#sflt").innerHTML=o.map(([k,l])=>`<button data-sc="${k}" aria-pressed="${SCOPE===k}">${l}</button>`).join("");
}
function nextCard(){
  const p=pool(); answered=false;
  if(!p.length){$("#study").innerHTML=`<div class="empty">${SCOPE==="star"?"Yıldızlı öneri yok. Kılavuz sekmesinden yıldız ekleyin.":"Bu kapsamda kart yok."}</div>`;return;}
  // prefer unlearned
  const un=p.filter(x=>!ST.learned[x.id]); const src=un.length&&Math.random()<.75?un:p;
  let c; do{c=src[Math.floor(Math.random()*src.length)]}while(src.length>1&&c===curCard);
  curCard=c; renderCard();
}
function scoreHTML(){return `<div class="score"><span>Doğru <b>${SS.ok}</b></span><span>Yanlış <b>${SS.no}</b></span></div>`}
function renderCard(){
  const c=curCard, meta=`${esc(c.g.kisa)} · ${esc(c.g.bolumler[c.si].b)}`;
  if(SM==="guc"){
    $("#study").innerHTML=`<div class="card"><div class="meta">${meta}</div><p class="q">${esc(c.x)}</p>
      <div class="row" id="ans"><button class="btn g" data-a="G">Güçlü</button><button class="btn z" data-a="Z">Zayıf</button></div>
      <div id="fb"></div></div>${scoreHTML()}`;
  } else {
    let n=0;
    const body=esc(c.x).replace(NUMRE,m=>{ if(!/\d/.test(m)) return m; n++; return `<span class="cz" role="button" tabindex="0" aria-label="Gizli değer, göstermek için dokun">${m}</span>`;});
    $("#study").innerHTML=`<div class="card"><div class="meta">${meta} · <span class="badge ${c.s}" style="height:20px;min-width:0;font-size:11px">${SL[c.s]}</span></div><p class="q">${body}</p>
      <div class="row"><button class="btn" id="reveal">Hepsini göster</button><button class="btn pri" id="nx">Sonraki</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" data-learn-card="${c.id}">${ST.learned[c.id]?"Öğrenildi ✓":"Öğrendim"}</button><button class="btn" data-star-card="${c.id}">${ST.star[c.id]?"Yıldızlı ★":"Yıldızla"}</button></div></div>`;
  }
}
function answer(a){
  if(answered) return; answered=true;
  const ok=a===curCard.s; ok?SS.ok++:SS.no++;
  $("#ans").innerHTML=`<button class="btn pri" id="nx">Sonraki</button><button class="btn" data-star-card="${curCard.id}">${ST.star[curCard.id]?"Yıldızlı ★":"Yıldızla"}</button>`;
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Doğru":"Yanlış"}: bu öneri ${SL[curCard.s].toLocaleLowerCase("tr")}.</div>`;
  document.querySelector(".score").outerHTML=scoreHTML();
}

// info
function renderInfo(){
  const total=ALLREC.length, l=ALLREC.filter(x=>ST.learned[x.id]).length, s=ALLREC.filter(x=>ST.star[x.id]).length;
  $("#v-kaynak").innerHTML=`<h2>Kaynaklar</h2>
  ${GL.map(g=>`<div class="ref"><b style="color:${gc(g)}">${esc(g.ad)}</b>${esc(g.kaynak)}<br><a href="${g.url}" target="_blank" rel="noopener">uroweb.org'da aç</a></div>`).join("")}
  <p>İçerik, bu cep kılavuzlarındaki tüm öneri tabloları, tablolar ve açıklayıcı metinlerin kişisel çalışma amacıyla Türkçe olarak yeniden ifade edilmiş halidir; birebir çeviri değildir. Öneri güçleri (güçlü/zayıf) kılavuzdaki derecelendirmeyle aynıdır. Klinik karar için orijinal kılavuza başvurun.</p>
  <h2>İlerleme</h2>
  <p>${l} / ${total} öneri öğrenildi · ${s} yıldızlı</p>
  <p style="font-size:13px;color:var(--muted)">İlerleme bu cihazdaki tarayıcıda saklanır. Safari'de “Ana Ekrana Ekle” ile açılan uygulama ayrı bir depolama kullanır.</p>
  <div class="row"><button class="btn" id="th">Tema: ${THN[ST.theme||"auto"]}</button><button class="btn danger" id="rst">İlerlemeyi sıfırla</button></div>`;
}
function applyTheme(){const t=ST.theme||"auto"; if(t==="auto")document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme=t; setAcc();
 const b=document.getElementById("thq"); if(b){b.innerHTML=THI[t];b.setAttribute("aria-label","Tema: "+THN[t]+". Değiştirmek için dokun");}
 const m=document.querySelector('meta[name="theme-color"]:not([media])')||(()=>{const x=document.createElement("meta");x.name="theme-color";document.head.appendChild(x);return x;})(); m.content=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim()||"#F3F5F7";}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{setAcc();});

// events
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-g],.cz"); if(!t) return;
  if(t.classList.contains("cz")){t.classList.add("on");return;}
  if(t.dataset.g&&t.closest("#seg")){ST.g=t.dataset.g;save();renderSeg();renderList();renderSF();if($("#v-calis").classList.contains("on")){curCard=null;nextCard();}window.scrollTo({top:0});return;}
  if(t.dataset.f){ST.sf=t.dataset.f;save();renderFilters();renderList();return;}
  if(t.dataset.star){const id=t.dataset.star;ST.star[id]=!ST.star[id];if(!ST.star[id])delete ST.star[id];save();
    t.setAttribute("aria-pressed",!!ST.star[id]);t.innerHTML=ST.star[id]?ico.star:ico.starO;if($("#v-yildiz").classList.contains("on"))renderStars();return;}
  if(t.dataset.learn){const id=t.dataset.learn;ST.learned[id]=!ST.learned[id];if(!ST.learned[id])delete ST.learned[id];save();
    t.setAttribute("aria-pressed",!!ST.learned[id]);t.closest(".rec").classList.toggle("learned",!!ST.learned[id]);updProg();
    const d=t.closest("details.ch");if(d&&d.dataset.k){const [gid,si]=d.dataset.k.split("-");const recs=GL.find(g=>g.id===gid).bolumler[+si].i.filter(x=>x.t==="r");const dn=recs.filter(x=>ST.learned[x.id]).length;d.querySelector(".ch-c").textContent=dn+"/"+recs.length;d.classList.toggle("ch-done",dn===recs.length);}
    return;}
  if(t.dataset.v){document.querySelectorAll("nav.tabs button").forEach(b=>b.removeAttribute("aria-current"));t.setAttribute("aria-current","page");
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$("#v-"+t.dataset.v).classList.add("on");
    $("#sw").style.display=t.dataset.v==="kilavuz"?"":"none";
    if(t.dataset.v==="calis"){renderSF();if(!curCard)nextCard();else renderCard();}
    if(t.dataset.v==="yildiz")renderStars();
    if(t.dataset.v==="kaynak")renderInfo();
    if(t.dataset.v==="kilavuz")renderList();
    window.scrollTo({top:0});return;}
  if(t.dataset.m){SM=t.dataset.m;document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b===t));curCard=null;nextCard();return;}
  if(t.dataset.sc){SCOPE=t.dataset.sc;renderSF();curCard=null;nextCard();return;}
  if(t.dataset.a){answer(t.dataset.a);return;}
  if(t.id==="nx"){nextCard();return;}
  if(t.id==="reveal"){document.querySelectorAll(".cz").forEach(z=>z.classList.add("on"));return;}
  if(t.dataset.learnCard){const id=t.dataset.learnCard;ST.learned[id]=!ST.learned[id];if(!ST.learned[id])delete ST.learned[id];save();t.textContent=ST.learned[id]?"Öğrenildi ✓":"Öğrendim";return;}
  if(t.dataset.starCard){const id=t.dataset.starCard;ST.star[id]=!ST.star[id];if(!ST.star[id])delete ST.star[id];save();t.textContent=ST.star[id]?"Yıldızlı ★":"Yıldızla";return;}
  if(t.id==="qx"){$("#q").value="";$("#sw").classList.remove("has");renderList();return;}
  if(t.id==="th"||t.id==="thq"){ST.theme=THO[(THO.indexOf(ST.theme||"auto")+1)%4];save();applyTheme();if($("#v-kaynak").classList.contains("on"))renderInfo();if($("#v-kilavuz").classList.contains("on"))renderList();return;}
  if(t.id==="rst"){if(confirm("Tüm öğrenildi ve yıldız işaretleri silinsin mi?")){ST.learned={};ST.star={};save();renderInfo();}return;}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("cz")){e.preventDefault();e.target.classList.add("on");}});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.k){d.open?openSet.add(d.dataset.k):openSet.delete(d.dataset.k);}},true);
let qt;$("#q").addEventListener("input",e=>{$("#sw").classList.toggle("has",!!e.target.value);clearTimeout(qt);qt=setTimeout(renderList,150);});
window.addEventListener("scroll",()=>$("#top").classList.toggle("scrolled",scrollY>4),{passive:true});

renderSeg();applyTheme();renderFilters();renderList();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
